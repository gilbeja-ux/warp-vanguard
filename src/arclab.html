<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATA DEFENDERS — FX LAB · arc nodes</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060f; overflow: hidden;
    font: 12px/1.4 system-ui, sans-serif; color: #9fb2c8; }
  canvas { display: block; position: fixed; inset: 0; }
  #panel { position: fixed; top: 10px; right: 10px; width: 250px; max-height: calc(100% - 20px);
    overflow-y: auto; background: rgba(6,10,22,0.88); border: 1px solid #1c2740;
    border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(4px); }
  #panel h1 { font-size: 13px; letter-spacing: 2px; color: #8fe0ff; margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: 1fr 44px; gap: 6px; align-items: center; margin: 7px 0; }
  .row label { grid-column: 1 / -1; display: flex; justify-content: space-between; color: #7d90a8; }
  .row label b { color: #d0e4ff; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #4d9bff; }
  .btns { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
  button { background: #101a30; color: #bfeaff; border: 1px solid #27395e; border-radius: 6px;
    padding: 5px 10px; font: 600 11px system-ui; cursor: pointer; }
  button:hover { background: #18264a; }
  pre { background: #060a14; border: 1px solid #1c2740; border-radius: 6px; padding: 8px;
    font-size: 10px; color: #7ee262; white-space: pre-wrap; user-select: all; margin: 8px 0 0; }
  #tag { position: fixed; left: 14px; top: 12px; color: #33507a; letter-spacing: 3px; font-size: 11px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tag">FX LAB — ARC NODES (the node IS a sector of the ring · drag an arc · click to send a hostile)</div>
<div id="panel">
  <h1>ARC DECK</h1>
  <div id="sliders"></div>
  <div class="btns">
    <button id="bPause">pause</button>
    <button id="bZapL">zap cyan</button>
    <button id="bZapR">zap white</button>
    <button id="bFryL">fry cyan</button>
    <button id="bFryR">fry white</button>
    <button id="bCopy">copy values</button>
  </div>
  <pre id="out"></pre>
</div>
<script src="labbg.js"></script>
<script>
'use strict';
// The synthesis lab: the REAL gunmetal monolith ring (kept from ringlab) +
// nodes reimagined as ENERGY ARCS wrapped around the band — a glowing sector
// of the ring itself, bounded by two machined bus-bars. The arc IS the
// coverage window: hostiles crossing inside it get zapped, and the discharge
// leaps from both bars onto the target.
const TAU = Math.PI * 2;
const LIGHT_A = -TAU * 0.31;            // world key-light azimuth (top-left)
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, u = 0;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = t => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };

// ---- knobs ----
const K = { // defaults = the user-approved ARCFX tuning (2026-07-20)
  bandW:   { v: 0.40, min: 0.4,  max: 1.6,  step: 0.05, lbl: 'ring band width', ring: 1 },
  metal:   { v: 0.50, min: 0.5,  max: 1.6,  step: 0.05, lbl: 'metal brightness', ring: 1 },
  sheen:   { v: 0.00, min: 0,    max: 1,    step: 0.05, lbl: 'brushed sheen', ring: 1 },
  span:    { v: 0.24, min: 0.18, max: 0.5,  step: 0.01, lbl: 'arc half-span (rad)' },
  fils:    { v: 7,    min: 2,    max: 7,    step: 1,    lbl: 'filaments' },
  energy:  { v: 1.90, min: 0.3,  max: 2,    step: 0.05, lbl: 'arc energy' },
  wobble:  { v: 0.50, min: 0.1,  max: 1,    step: 0.05, lbl: 'filament wobble' },
  breath:  { v: 0.20, min: 0,    max: 0.5,  step: 0.02, lbl: 'idle breathing' },
  dip:     { v: 0.40, min: 0,    max: 0.9,  step: 0.05, lbl: 'zap energy dip' },
  refill:  { v: 1.00, min: 0.3,  max: 3,    step: 0.1,  lbl: 'recover time (s)' },
  barW:    { v: 0.60, min: 0.25, max: 0.7,  step: 0.01, lbl: 'bar width (×band)' },
  zapT:    { v: 0.40, min: 0.1,  max: 0.6,  step: 0.02, lbl: 'zap bolt life (s)' },
  grain:   { v: 0.40, min: 0,    max: 1,    step: 0.05, lbl: 'film grain' },
  fryT:    { v: 2.20, min: 1,    max: 5,    step: 0.1,  lbl: 'fry cycle (s)' },
};
const D = new Proxy({}, { get: (_, k) => K[k].v });

// ---- game tunnel math ----
const geo = () => {
  const nodeR = Math.min(W, H) * 0.44;
  const R0 = Math.hypot(W, H) / 2 * 1.08;
  return { cx: W / 2, cy: H / 2, nodeR, R0, hitZ: (R0 / nodeR - 1) / 6 };
};
function ring(z, g) {
  const s = 1 / (1 + z * 6);
  return { x: g.cx, y: g.cy, r: g.R0 * s, s };
}
const gun = l => { l *= D.metal; return 'rgb(' + Math.round(l * 0.92) + ',' + Math.round(l * 0.96) + ',' + Math.round(Math.min(255, l * 1.04)) + ')'; };
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---- the two arc nodes ----
const nodes = [
  { baseA: Math.PI * 0.8, phase: 0.0, col: '111,227,255', bright: '#c9f6ff' },
  { baseA: Math.PI * 1.3, phase: 2.1, col: '235,245,255', bright: '#ffffff' },
];
for (const n of nodes) {
  n.angle = n.prevA = n.baseA; n.trailV = 0;
  n.dip = 0;        // 1 right after a zap — the arc's energy is spent, recovers
  n.deadT = 0;      // fry cycle: counts D.fryT → 0 (collapse → ember → regrow → ignite)
  n.threat = 0;
  n.tipA = { x: 0, y: 0 }; n.tipB = { x: 0, y: 0 };
}

// ---- sim state ----
let dummies = [], bolts = [], particles = [];
let nextSpawn = 0.8, spawnTgt = 0, paused = false, dragging = -1, time = 0;

function spawnDummy(i, a) {
  const n = nodes[i];
  dummies.push({ a: a !== undefined ? a : n.angle + rand(-D.span * 0.7, D.span * 0.7), z: 2.2, tgt: i, spin: rand(0, TAU) });
}
function fry(i) { if (nodes[i].deadT <= 0) nodes[i].deadT = D.fryT; }
function zap(i, tx, ty) {
  const n = nodes[i], g = geo();
  if (n.deadT > 0) return;          // a fried arc can't fire
  n.dip = 1;
  if (tx === undefined) {
    tx = g.cx + Math.cos(n.angle) * g.nodeR; ty = g.cy + Math.sin(n.angle) * g.nodeR;
  }
  bolts.push({ i, tx, ty, t: 0 });
  for (let p = 0; p < 14; p++) particles.push({
    x: tx, y: ty, vx: rand(-2.5, 2.5), vy: rand(-2.5, 2.5),
    life: rand(0.3, 0.6), decay: 2.2, col: p % 3 ? n.col : '255,255,255', size: rand(1, 2.6) });
}

// ---- sim ----
function step(dt, g) {
  time += dt;
  LabBG.step(dt);
  for (let i = 0; i < 2; i++) {
    const n = nodes[i];
    if (dragging !== i) n.angle = n.baseA + 0.25 * Math.sin(time * 0.28 + n.phase);
    const vel = angDiff(n.angle, n.prevA);
    n.trailV = n.trailV * 0.8 + vel * 0.2;
    n.prevA = n.angle;
    if (n.dip > 0) n.dip = Math.max(0, n.dip - dt / D.refill);
    if (n.deadT > 0) n.deadT = Math.max(0, n.deadT - dt);
    let th = 0;
    for (const d of dummies) {
      const near = clamp(1 - Math.abs(angDiff(d.a, n.angle)) / 1.1, 0, 1) *
                   clamp((0.7 - d.z) / 0.7 + 0.35, 0, 1);
      th = Math.max(th, near);
    }
    n.threat += (th - n.threat) * Math.min(1, dt * 8);
  }
  if (dummies.length < 2) { nextSpawn -= dt; if (nextSpawn <= 0) { spawnDummy(spawnTgt); spawnTgt = 1 - spawnTgt; nextSpawn = rand(1.1, 1.7); } }
  for (const d of dummies) {
    d.z -= dt * 1.35; d.spin += dt * 4;
    if (d.z <= g.hitZ + 0.02) {
      const rg = ring(Math.max(d.z, 0.02), g);
      const hx = rg.x + Math.cos(d.a) * rg.r, hy = rg.y + Math.sin(d.a) * rg.r;
      if (nodes[d.tgt].deadT > 0) {              // dead sector: the hostile breaches through
        for (let p = 0; p < 10; p++) particles.push({
          x: hx, y: hy, vx: rand(-2, 2), vy: rand(-2, 2),
          life: rand(0.25, 0.5), decay: 2.4, col: '255,60,90', size: rand(1, 2.2) });
      } else {
        zap(d.tgt, hx, hy);
      }
      d.dead = true;
    }
  }
  dummies = dummies.filter(d => !d.dead);
  for (const b of bolts) b.t += dt;
  bolts = bolts.filter(b => b.t < D.zapT);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt * p.decay; }
  particles = particles.filter(p => p.life > 0);
}

// ---- the ring: the REAL gunmetal monolith, prerendered (kept from ringlab) ----
const ringCv = document.createElement('canvas');
const noiseCv = document.createElement('canvas');
let ringDirty = true;

function buildNoise() {
  noiseCv.width = noiseCv.height = 256;
  const c = noiseCv.getContext('2d');
  const im = c.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = 118 + (Math.random() - 0.5) * 255;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    im.data[i + 3] = 255;
  }
  c.putImageData(im, 0, 0);
}
function litHairline(c, cx, cy, r, base, lit, span) {
  c.lineWidth = 1;
  c.strokeStyle = 'rgba(225,235,250,' + base.toFixed(3) + ')';
  c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.stroke();
  const grd = span || 1.15;
  for (const [al, sp] of [[lit, grd], [lit * 0.5, grd * 1.7]]) {
    c.strokeStyle = 'rgba(225,235,250,' + al.toFixed(3) + ')';
    c.beginPath(); c.arc(cx, cy, r, LIGHT_A - sp, LIGHT_A + sp); c.stroke();
  }
}
function buildRing(g) {
  ringCv.width = W; ringCv.height = H;
  const c = ringCv.getContext('2d');
  const bh = Math.min(W, H) * 0.055 * D.bandW;
  const Rin = g.nodeR - bh, Rout = g.nodeR + bh;
  const rg = c.createRadialGradient(g.cx, g.cy, Rin, g.cx, g.cy, Rout);
  rg.addColorStop(0,    'rgb(3,5,9)');
  rg.addColorStop(0.07, gun(19));
  rg.addColorStop(0.32, gun(35));
  rg.addColorStop(0.46, gun(45));
  rg.addColorStop(0.62, gun(29));
  rg.addColorStop(0.9,  gun(11));
  rg.addColorStop(1,    'rgb(2,3,6)');
  c.lineWidth = bh * 2;
  c.strokeStyle = rg;
  c.beginPath(); c.arc(g.cx, g.cy, g.nodeR, 0, TAU); c.stroke();
  // one key light: lit sector lifts, far side dies — plus bore bounce ambient
  c.save();
  c.beginPath(); c.arc(g.cx, g.cy, Rout, 0, TAU); c.arc(g.cx, g.cy, Rin, 0, TAU, true); c.clip();
  const lx = g.cx + Math.cos(LIGHT_A) * g.nodeR, ly = g.cy + Math.sin(LIGHT_A) * g.nodeR;
  const dx2 = g.cx - Math.cos(LIGHT_A) * g.nodeR, dy2 = g.cy - Math.sin(LIGHT_A) * g.nodeR;
  const kl = c.createLinearGradient(lx, ly, dx2, dy2);
  kl.addColorStop(0, 'rgba(215,228,250,' + (0.13 * D.metal).toFixed(3) + ')');
  kl.addColorStop(0.45, 'rgba(215,228,250,0)');
  kl.addColorStop(0.55, 'rgba(0,0,0,0)');
  kl.addColorStop(1, 'rgba(0,0,0,0.30)');
  c.fillStyle = kl; c.fillRect(0, 0, W, H);
  const bb = c.createRadialGradient(g.cx, g.cy, Rin, g.cx, g.cy, Rin + bh * 0.8);
  bb.addColorStop(0, 'rgba(100,170,230,0.07)');
  bb.addColorStop(1, 'rgba(100,170,230,0)');
  c.fillStyle = bb; c.fillRect(0, 0, W, H);
  // brushed grain + machining marks, key-modulated
  const NSEG = 180;
  for (let i = 0; i < NSEG; i++) {
    const a0 = i / NSEG * TAU, a1 = (i + 1.15) / NSEG * TAU;
    const key = Math.pow(0.5 + 0.5 * Math.cos((a0 + a1) / 2 - LIGHT_A), 2.5);
    const grain = hash(i) - 0.5;
    const al = D.sheen * key * (0.05 + Math.max(0, grain) * 0.07);
    const dk = D.sheen * Math.max(0, -grain) * 0.10;
    c.lineWidth = bh * 2;
    if (al > 0.004) { c.strokeStyle = 'rgba(225,235,255,' + al.toFixed(3) + ')'; c.beginPath(); c.arc(g.cx, g.cy, g.nodeR, a0, a1); c.stroke(); }
    if (dk > 0.004) { c.strokeStyle = 'rgba(0,0,0,' + dk.toFixed(3) + ')'; c.beginPath(); c.arc(g.cx, g.cy, g.nodeR, a0, a1); c.stroke(); }
  }
  for (let i = 0; i < 240; i++) {
    const a = hash(i + 500) * TAU, len = 0.25 + hash(i + 900) * 0.6;
    const key = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.cos(a - LIGHT_A), 2);
    const r0 = Rin + hash(i + 700) * (1 - len) * bh * 2, r1 = r0 + len * bh * 0.5;
    c.strokeStyle = hash(i + 300) > 0.5 ? 'rgba(255,255,255,' + (0.02 * key).toFixed(3) + ')' : 'rgba(0,0,0,0.05)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(g.cx + Math.cos(a) * r0, g.cy + Math.sin(a) * r0);
    c.lineTo(g.cx + Math.cos(a) * r1, g.cy + Math.sin(a) * r1);
    c.stroke();
  }
  c.restore();
  // machined hairlines, engraved index scale, seams + flange bolts
  litHairline(c, g.cx, g.cy, Rin + 0.8, 0.10, 0.22 * D.metal);
  litHairline(c, g.cx, g.cy, g.nodeR - bh * 0.34, 0.035, 0.10 * D.metal);
  litHairline(c, g.cx, g.cy, g.nodeR + bh * 0.34, 0.035, 0.12 * D.metal);
  litHairline(c, g.cx, g.cy, Rout - bh * 0.16, 0.04, 0.14 * D.metal);
  c.strokeStyle = 'rgba(0,0,0,0.55)'; c.lineWidth = 1.2;
  c.beginPath(); c.arc(g.cx, g.cy, Rout - 0.6, 0, TAU); c.stroke();
  for (let dg = 0; dg < 360; dg += 3) {
    const a = dg * TAU / 360, major = dg % 30 === 0;
    const r1 = Rout - bh * 0.08, r0 = r1 - (major ? bh * 0.22 : bh * 0.1);
    c.strokeStyle = 'rgba(190,205,225,' + (major ? 0.16 : 0.07) + ')';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(g.cx + Math.cos(a) * r0, g.cy + Math.sin(a) * r0);
    c.lineTo(g.cx + Math.cos(a) * r1, g.cy + Math.sin(a) * r1);
    c.stroke();
  }
  for (let i = 0; i < 4; i++) {
    const a = i * TAU / 4 + TAU / 8, ca = Math.cos(a), sa = Math.sin(a);
    const key = 0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.cos(a - LIGHT_A), 2);
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(0,0,0,0.4)';
    c.beginPath(); c.moveTo(g.cx + ca * Rin, g.cy + sa * Rin); c.lineTo(g.cx + ca * Rout, g.cy + sa * Rout); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,' + (0.05 * key).toFixed(3) + ')';
    c.beginPath(); c.moveTo(g.cx + ca * Rin - sa, g.cy + sa * Rin + ca); c.lineTo(g.cx + ca * Rout - sa, g.cy + sa * Rout + ca); c.stroke();
    for (const off of [-0.028, 0.028]) {
      const ba = a + off, br = g.nodeR + bh * 0.62;
      const bx = g.cx + Math.cos(ba) * br, by = g.cy + Math.sin(ba) * br;
      c.fillStyle = gun(26 * key + 8);
      c.beginPath(); c.arc(bx, by, bh * 0.055, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 0.8;
      c.beginPath(); c.arc(bx, by, bh * 0.055, 0, TAU); c.stroke();
    }
  }
  ringDirty = false;
}

// ---- draw ----
function draw(g, dt) {
  LabBG.draw(ctx, g, ring);
  for (const d of dummies) drawDummy(d, g);
  if (ringDirty) buildRing(g);
  ctx.drawImage(ringCv, 0, 0);
  for (const n of nodes) drawArcNode(n, g);
  for (const b of bolts) drawBolt(b);
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = 'rgba(' + p.col + ',1)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (D.grain > 0.01) {
    ctx.globalAlpha = 0.05 * D.grain;
    const ox = (Math.floor(time * 24) * 97) % 256, oy = (Math.floor(time * 24) * 53) % 256;
    for (let yy = -oy; yy < H; yy += 256) for (let xx = -ox; xx < W; xx += 256)
      ctx.drawImage(noiseCv, xx, yy);
    ctx.globalAlpha = 1;
  }
  LabBG.vignette(ctx);
}

function drawDummy(d, g) {
  const rg = ring(Math.max(d.z, 0.02), g);
  const x = rg.x + Math.cos(d.a) * rg.r, y = rg.y + Math.sin(d.a) * rg.r;
  const size = u * 0.05 * clamp(rg.r / g.nodeR, 0.1, 2);
  const gl = ctx.createRadialGradient(x, y, 0, x, y, size * 2.4);
  gl.addColorStop(0, 'rgba(255,60,90,0.5)'); gl.addColorStop(1, 'rgba(255,60,90,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, y, size * 2.4, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.rotate(d.spin * 0.3);
  ctx.fillStyle = '#e8274b';
  ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.lineTo(-size, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---- THE NODE: an energy arc wrapping the band, bounded by metal bus-bars ----
function drawArcNode(n, g) {
  const bh = Math.min(W, H) * 0.055 * D.bandW;
  const a = n.angle;
  const zapK = clamp(n.dip - 0.75, 0, 0.25) * 4;          // 1 for the instant after firing
  // fry cycle, rb 1 → 0: the arc SNAPS SHUT to a sliver, smolders, grows back
  // to full width, and only then does the energy reignite
  const rb = n.deadT > 0 ? clamp(n.deadT / D.fryT, 0, 1) : 0;
  let spanK = 1, energyK = 1;
  if (rb > 0.88)      spanK = lerp(1, 0.045, smooth((1 - rb) / 0.12));   // the snap
  else if (rb > 0.45) spanK = 0.045;                                     // dead sliver
  else if (rb > 0.1) {                                                   // regrowth, slight overshoot
    const gt = (0.45 - rb) / 0.35;
    const eb = 1 + 2.70158 * Math.pow(gt - 1, 3) + 1.70158 * Math.pow(gt - 1, 2);
    spanK = 0.045 + 0.955 * eb;
  }
  if (rb > 0.1)      energyK = 0;                                        // grown but cold
  else if (rb > 0)   energyK = smooth((0.1 - rb) / 0.1) * (0.35 + 0.65 * Math.random()); // ignition sputter
  const span = D.span * Math.max(spanK, 0.04);
  // energy level: breathes at idle, rises with threat, drains after a zap
  const L = clamp((1 - D.dip * smooth(clamp(n.dip, 0, 1)))
    * (1 + D.breath * 0.4 * Math.sin(time * 2.1 + n.phase)) + n.threat * 0.25 + zapK, 0.15, 1.6) * D.energy * energyK;
  const barA = bh * D.barW * 0.6 / g.nodeR;               // bars eat a little of the span
  const ea0 = a - span, ea1 = a + span;
  const ia0 = ea0 + barA, ia1 = ea1 - barA;               // the live sector between the bars
  const live = L > 0.05 && ia1 - ia0 > 0.012;             // collapsed or cold: no plasma to draw
  // wake: a sliding arc smears its energy along the band
  const tl = clamp(Math.abs(n.trailV) * 10, 0, 1.2);
  if (tl > 0.04) {
    const dir = Math.sign(n.trailV) || 1;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(' + n.col + ',0.18)';
    ctx.lineWidth = bh * 1.4;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, a - dir * (span + tl), a - dir * span, dir < 0); ctx.stroke();
  }
  // surface wash: the band's metal glows under the plasma sheet
  if (live) {
  ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(' + n.col + ',' + clamp(0.10 * L, 0, 0.5).toFixed(3) + ')';
  ctx.lineWidth = bh * 1.9;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, ia0, ia1); ctx.stroke();
  ctx.strokeStyle = 'rgba(' + n.col + ',' + clamp(0.16 * L, 0, 0.7).toFixed(3) + ')';
  ctx.lineWidth = bh * 0.9;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, ia0, ia1); ctx.stroke();
  // outer halo: soft light escaping past the band edges
  ctx.strokeStyle = 'rgba(' + n.col + ',' + clamp(0.05 * L, 0, 0.3).toFixed(3) + ')';
  ctx.lineWidth = bh * 3.1;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, ia0, ia1); ctx.stroke();
  // filaments: live electricity crawling bar-to-bar around the band's surface
  ctx.lineCap = 'round';
  const NF = Math.round(D.fils);
  for (let f = 0; f < NF; f++) {
    const hot = f === 0;                                   // one white-hot lead filament
    const SEGS = 18;
    ctx.strokeStyle = hot
      ? 'rgba(255,255,255,' + clamp((0.5 + zapK * 0.5) * Math.min(1, L), 0, 1).toFixed(2) + ')'
      : 'rgba(' + n.col + ',' + clamp((0.3 + 0.25 * Math.random()) * Math.min(1, L), 0, 0.9).toFixed(2) + ')';
    ctx.lineWidth = hot ? Math.max(1.2, bh * 0.07) : Math.max(1, bh * 0.05);
    ctx.beginPath();
    for (let k = 0; k <= SEGS; k++) {
      const q = k / SEGS;
      const ang = lerp(ia0, ia1, q);
      const pinch = Math.sin(q * Math.PI);                 // filaments meet the bars at the band's center
      const frq = 6 + f * 2.6 + hash(f) * 3;               // each filament owns its own waveform
      const wob = Math.sin(q * span * 14 * frq / 7 + time * (5 + f * 1.7) + f * 2.3 + n.phase) * bh * D.wobble * pinch * (0.55 + hash(f + 9) * 0.7)
        + (Math.random() - 0.5) * bh * 0.14 * pinch * (1 + zapK * 2);
      const rr = g.nodeR + wob;
      const x = g.cx + Math.cos(ang) * rr, y = g.cy + Math.sin(ang) * rr;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  // stray sparks flick off the arc while it's agitated
  if (Math.random() < 0.1 + n.threat * 0.3 + zapK * 0.5) {
    const sa2 = rand(ia0, ia1);
    particles.push({
      x: g.cx + Math.cos(sa2) * (g.nodeR + rand(-bh, bh)),
      y: g.cy + Math.sin(sa2) * (g.nodeR + rand(-bh, bh)),
      vx: rand(-1, 1), vy: rand(-1, 1), life: rand(0.15, 0.35), decay: 3,
      col: n.col, size: rand(0.8, 1.6) });
  }
  } // end live
  // the bus-bars: machined metal ends that BIND the arc — radial bars laid
  // across the band, key-lit like the ring, with an emissive inner face
  for (const se of [-1, 1]) {
    const ea = se < 0 ? ea0 : ea1;
    const key = 0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.cos(ea - LIGHT_A), 2);
    const bw = bh * D.barW;                                // tangent width
    const ov = bh * 0.32;                                  // radial overhang past the band
    ctx.save();
    ctx.translate(g.cx + Math.cos(ea) * g.nodeR, g.cy + Math.sin(ea) * g.nodeR);
    ctx.rotate(ea);                                        // +x = radially outward
    // cast shadow onto the band, away from the key light
    const lightLocal = LIGHT_A - ea;
    ctx.save();
    ctx.translate(Math.cos(lightLocal + Math.PI) * 2.5, Math.sin(lightLocal + Math.PI) * 2.5);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-bh - ov, -bw / 2, (bh + ov) * 2, bw);
    ctx.restore();
    // bar body: dark machined steel, crowned like the ring's cross-section
    const bg2 = ctx.createLinearGradient(-bh - ov, 0, bh + ov, 0);
    bg2.addColorStop(0,    gun(14));
    bg2.addColorStop(0.28, gun(26 + 34 * key));
    bg2.addColorStop(0.5,  gun(38 + 30 * key));
    bg2.addColorStop(0.72, gun(22 + 20 * key));
    bg2.addColorStop(1,    gun(12));
    ctx.fillStyle = bg2;
    ctx.beginPath(); ctx.roundRect(-bh - ov, -bw / 2, (bh + ov) * 2, bw, bw * 0.18); ctx.fill();
    // machined edge highlight on the lit flank + bolt heads on the overhangs
    ctx.strokeStyle = 'rgba(225,235,255,' + (0.06 + 0.16 * key).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-bh - ov + 2, -bw / 2 + 0.8); ctx.lineTo(bh + ov - 2, -bw / 2 + 0.8); ctx.stroke();
    ctx.fillStyle = gun(30 * key + 12);
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.arc(sx * (bh + ov - bw * 0.32), 0, bw * 0.14, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(sx * (bh + ov - bw * 0.32), 0, bw * 0.14, 0, TAU); ctx.stroke();
    }
    // emissive inner face: the electrode edge the arc is born from
    const fy = -se * bw / 2;                               // the face looking INTO the arc
    ctx.strokeStyle = 'rgba(' + n.col + ',' + clamp(0.55 * L + zapK * 0.45, 0, 1).toFixed(2) + ')';
    ctx.lineWidth = Math.max(1.4, bw * 0.13);
    ctx.beginPath(); ctx.moveTo(-bh * 0.85, fy); ctx.lineTo(bh * 0.85, fy); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + clamp(0.35 * L + zapK * 0.6, 0, 1).toFixed(2) + ')';
    ctx.lineWidth = Math.max(0.8, bw * 0.05);
    ctx.beginPath(); ctx.moveTo(-bh * 0.6, fy); ctx.lineTo(bh * 0.6, fy); ctx.stroke();
    // contact glow pooling where the plasma meets the electrode
    const cg = ctx.createRadialGradient(0, fy, 0, 0, fy, bh * 0.8);
    cg.addColorStop(0, 'rgba(' + n.col + ',' + clamp(0.3 * L + zapK * 0.4, 0, 0.8).toFixed(2) + ')');
    cg.addColorStop(1, 'rgba(' + n.col + ',0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, fy, bh * 0.8, 0, TAU); ctx.fill();
    // fried: the electrode smolders amber, strengthening as the reboot completes
    if (rb > 0) {
      const emb = (0.18 + (1 - rb) * 0.4) * (Math.random() < 0.12 ? 1.8 : 1);
      ctx.strokeStyle = 'rgba(255,180,120,' + clamp(emb, 0, 0.9).toFixed(2) + ')';
      ctx.lineWidth = Math.max(1, bw * 0.08);
      ctx.beginPath(); ctx.moveTo(-bh * 0.7, fy); ctx.lineTo(bh * 0.7, fy); ctx.stroke();
    }
    ctx.restore();
    // the discharge leaps from the bars — remember their world positions
    const wt = { x: g.cx + Math.cos(ea) * g.nodeR, y: g.cy + Math.sin(ea) * g.nodeR };
    if (se < 0) n.tipA = wt; else n.tipB = wt;
  }
  // collapsed: a weak amber ember arcs across the sliver of a gap, sputtering
  if (rb > 0.1 && rb < 0.88) {
    if (Math.random() < 0.55) {
      ctx.strokeStyle = 'rgba(255,180,120,' + rand(0.25, 0.55).toFixed(2) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(n.tipA.x, n.tipA.y);
      for (let q = 1; q < 4; q++) {
        const t2 = q / 4;
        ctx.lineTo(lerp(n.tipA.x, n.tipB.x, t2) + rand(-2, 2), lerp(n.tipA.y, n.tipB.y, t2) + rand(-2, 2));
      }
      ctx.lineTo(n.tipB.x, n.tipB.y);
      ctx.stroke();
    }
    if (Math.random() < 0.2) particles.push({
      x: (n.tipA.x + n.tipB.x) / 2 + rand(-3, 3), y: (n.tipA.y + n.tipB.y) / 2 + rand(-3, 3),
      vx: rand(-0.8, 0.8), vy: rand(-0.8, 0.8), life: rand(0.2, 0.45), decay: 2.6,
      col: '255,180,120', size: rand(0.8, 1.5) });
  }
}

// ---- zap: both bars strike the target inside the arc ----
function drawBolt(b) {
  const n = nodes[b.i], k = b.t / D.zapT, fade = 1 - k;
  for (const tip of [n.tipA, n.tipB]) {
    for (const [lw, al, colr] of [[u * 0.008, 0.3 * fade, n.col], [u * 0.003, 0.95 * fade, '255,255,255']]) {
      ctx.strokeStyle = 'rgba(' + colr + ',' + al.toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, lw);
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      const dx = b.tx - tip.x, dy = b.ty - tip.y, len = Math.hypot(dx, dy);
      for (let q = 1; q < 7; q++) {
        const t2 = q / 7;
        ctx.lineTo(tip.x + dx * t2 + (Math.random() - 0.5) * len * 0.12 * fade,
                   tip.y + dy * t2 + (Math.random() - 0.5) * len * 0.12 * fade);
      }
      ctx.lineTo(b.tx, b.ty);
      ctx.stroke();
    }
  }
}

// ---- loop ----
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const g = geo();
  if (!paused) step(dt, g);
  draw(g, dt);
  requestAnimationFrame(tick);
}

// ---- panel wiring ----
const slidersEl = document.getElementById('sliders'), outEl = document.getElementById('out');
function readout() {
  const lines = Object.keys(K).map(k => '  ' + k + ': ' + (K[k].step >= 1 ? K[k].v : K[k].v.toFixed(2)) + ',');
  outEl.textContent = 'const ARCFX = {\n' + lines.join('\n') + '\n};';
}
for (const key in K) {
  const k = K[key], row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<label>' + k.lbl + ' <b id="v_' + key + '">' + k.v + '</b></label>' +
    '<input type="range" style="grid-column:1/-1" id="s_' + key + '" min="' + k.min +
    '" max="' + k.max + '" step="' + k.step + '" value="' + k.v + '">';
  slidersEl.appendChild(row);
  row.querySelector('input').addEventListener('input', e => {
    k.v = +e.target.value;
    document.getElementById('v_' + key).textContent = k.v;
    if (k.ring) ringDirty = true;
    readout();
  });
}
readout();
document.getElementById('bPause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'play' : 'pause'; };
document.getElementById('bZapL').onclick = () => zap(0);
document.getElementById('bZapR').onclick = () => zap(1);
document.getElementById('bFryL').onclick = () => fry(0);
document.getElementById('bFryR').onclick = () => fry(1);
document.getElementById('bCopy').onclick = () => navigator.clipboard.writeText(outEl.textContent);

// drag an arc along the ring; click open space to send a hostile at that angle
cv.addEventListener('pointerdown', e => {
  const g = geo();
  const a = Math.atan2(e.clientY - g.cy, e.clientX - g.cx);
  const rr = Math.hypot(e.clientX - g.cx, e.clientY - g.cy);
  for (let i = 0; i < 2; i++) {
    if (Math.abs(angDiff(a, nodes[i].angle)) < D.span * 1.2 && Math.abs(rr - g.nodeR) < u * 0.08) { dragging = i; return; }
  }
  const near = Math.abs(angDiff(a, nodes[0].angle)) < Math.abs(angDiff(a, nodes[1].angle)) ? 0 : 1;
  spawnDummy(near, a);
});
cv.addEventListener('pointermove', e => {
  if (dragging < 0) return;
  const g = geo();
  nodes[dragging].angle = Math.atan2(e.clientY - g.cy, e.clientX - g.cx);
});
addEventListener('pointerup', () => {
  if (dragging < 0) return;
  const n = nodes[dragging];
  n.baseA = n.angle - 0.25 * Math.sin(time * 0.28 + n.phase);
  dragging = -1;
});

function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; u = Math.min(W, H); ringDirty = true; buildNoise(); LabBG.resize(W, H); }
addEventListener('resize', resize);
resize();
// snapshot mode (?t=2.5&freeze&zap&fry=0.7): fast-forward, optionally fire
// both arcs; fry=N freezes the cyan node with N seconds left in its fry cycle
const Q = new URLSearchParams(location.search);
if (Q.has('t') || Q.has('zap') || Q.has('fry')) {
  const g = geo();
  for (let t = +Q.get('t') || 0; t > 0; t -= 1 / 60) step(1 / 60, g);
  if (Q.has('zap')) { zap(0); zap(1); }
  if (Q.has('fry')) nodes[0].deadT = clamp(+Q.get('fry') || 1, 0.01, D.fryT);
  paused = Q.has('freeze');
  if (paused) document.getElementById('bPause').textContent = 'play';
}
requestAnimationFrame(tick);
</script>
</body>

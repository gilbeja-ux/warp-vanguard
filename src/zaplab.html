<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATA DEFENDERS — FX LAB · zapper picker</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060f; overflow: hidden;
    font: 12px/1.4 system-ui, sans-serif; color: #9fb2c8; }
  canvas { display: block; position: fixed; inset: 0; }
  #panel { position: fixed; top: 10px; right: 10px; width: 250px; max-height: calc(100% - 20px);
    overflow-y: auto; background: rgba(6,10,22,0.88); border: 1px solid #1c2740;
    border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(4px); }
  #panel h1 { font-size: 13px; letter-spacing: 2px; color: #8fe0ff; margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: 1fr 44px; gap: 6px; align-items: center; margin: 7px 0; }
  .row label { grid-column: 1 / -1; display: flex; justify-content: space-between; color: #7d90a8; }
  .row label b { color: #d0e4ff; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #4d9bff; }
  .btns { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
  button { background: #101a30; color: #bfeaff; border: 1px solid #27395e; border-radius: 6px;
    padding: 5px 10px; font: 600 11px system-ui; cursor: pointer; }
  button:hover { background: #18264a; }
  pre { background: #060a14; border: 1px solid #1c2740; border-radius: 6px; padding: 8px;
    font-size: 10px; color: #7ee262; white-space: pre-wrap; user-select: all; margin: 8px 0 0; }
  #tag { position: fixed; left: 14px; top: 12px; color: #33507a; letter-spacing: 3px; font-size: 11px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tag">FX LAB — ZAPPER PICKER (four candidate devices on the game's ring · click to send a hostile)</div>
<div id="panel">
  <h1>ZAPPER DECK</h1>
  <div class="btns">
    <button data-z="0">zap EYE</button>
    <button data-z="1">zap STUDS</button>
    <button data-z="2">zap VANES</button>
    <button data-z="3">zap BEAM</button>
  </div>
  <div id="sliders"></div>
  <div class="btns">
    <button id="bPause">pause</button>
    <button id="bCopy">copy values</button>
  </div>
  <pre id="out"></pre>
</div>
<script src="labbg.js"></script>
<script>
'use strict';
// Round 2: the IRIS aperture won — these are four ways to CONNECT it to its
// discharge arc, riding the game's existing ring language (emissive ring,
// coverage gauge, pantograph mounting + a new seating cradle).
//   A EYE   — the bolt is born in the aperture: snap open, muzzle flash, fire
//   B STUDS — rim electrodes crackle at idle, feeder arcs converge on a zap
//   C VANES — twin focus vanes hold a live arc (the old EMP-prong language)
//   D BEAM  — a faint guide beam always touches the wall; the zap rides it
const TAU = Math.PI * 2;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, u = 0;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };

// ---- knobs ----
const K = {
  scale:  { v: 1.00, min: 0.7, max: 1.6, step: 0.05, lbl: 'device scale' },
  glowK:  { v: 1.00, min: 0.2, max: 2,   step: 0.05, lbl: 'glow intensity' },
  spinK:  { v: 1.00, min: 0,   max: 3,   step: 0.1,  lbl: 'animation speed' },
  arcK:   { v: 1.00, min: 0,   max: 2,   step: 0.05, lbl: 'idle arc intensity' },
  zapT:   { v: 0.28, min: 0.1, max: 0.6, step: 0.02, lbl: 'zap bolt life (s)' },
};
const D = new Proxy({}, { get: (_, k) => K[k].v });

// ---- game tunnel math ----
const geo = () => {
  const nodeR = Math.min(W, H) * 0.44;
  const R0 = Math.hypot(W, H) / 2 * 1.08;
  return { cx: W / 2, cy: H / 2, nodeR, R0, hitZ: (R0 / nodeR - 1) / 6 };
};
function ring(z, g) {
  const s = 1 / (1 + z * 6);
  return { x: g.cx, y: g.cy, r: g.R0 * s, s };
}
const railRadius = g => g.nodeR - Math.min(W, H) * 0.055 * 0.86; // the game's rail

// ---- the four candidates, alternating the game's two node colors ----
const DESIGNS = ['EYE', 'STUDS', 'VANES', 'BEAM'];
const nodes = DESIGNS.map((name, i) => ({
  name, design: i,
  baseA: Math.PI * (0.62 + i * 0.28), phase: i * 1.7,
  col: i % 2 === 0 ? '111,227,255' : '255,255,255',
  angle: 0, prevA: 0, trailV: 0, recoil: 0, threat: 0, spin: rand(0, TAU),
  tipA: { x: 0, y: 0 }, tipB: { x: 0, y: 0 },
}));
for (const n of nodes) { n.angle = n.prevA = n.baseA; }

// ---- sim state ----
let dummies = [], bolts = [], particles = [];
let nextSpawn = 0.8, spawnTgt = 0, paused = false, time = 0;

function spawnDummy(i, a) {
  const n = nodes[i];
  dummies.push({ a: a !== undefined ? a : n.angle + rand(-0.2, 0.2), z: 2.2, tgt: i, spin: rand(0, TAU) });
}
function zap(i, tx, ty) {
  const n = nodes[i], g = geo();
  n.recoil = 1;
  if (tx === undefined) {
    tx = g.cx + Math.cos(n.angle) * g.nodeR; ty = g.cy + Math.sin(n.angle) * g.nodeR;
  }
  bolts.push({ i, tx, ty, t: 0 });
  for (let p = 0; p < 12; p++) particles.push({
    x: tx, y: ty, vx: rand(-2.5, 2.5), vy: rand(-2.5, 2.5),
    life: rand(0.3, 0.6), decay: 2.2, col: p % 3 ? n.col : '255,255,255', size: rand(1, 2.4) });
}

// ---- sim ----
function step(dt, g) {
  time += dt;
  LabBG.step(dt);
  for (const n of nodes) {
    n.angle = n.baseA + 0.12 * Math.sin(time * 0.3 + n.phase); // gentle patrol
    const vel = angDiff(n.angle, n.prevA);
    n.trailV = n.trailV * 0.8 + vel * 0.2;
    n.prevA = n.angle;
    n.spin += dt * D.spinK * (1 + n.recoil * 4);
    if (n.recoil > 0) n.recoil = Math.max(0, n.recoil - dt * 3.5);
    let th = 0;
    for (const d of dummies) {
      const near = clamp(1 - Math.abs(angDiff(d.a, n.angle)) / 0.9, 0, 1) *
                   clamp((0.7 - d.z) / 0.7 + 0.35, 0, 1);
      th = Math.max(th, near);
    }
    n.threat += (th - n.threat) * Math.min(1, dt * 8);
  }
  if (dummies.length < 2) {
    nextSpawn -= dt;
    if (nextSpawn <= 0) { spawnDummy(spawnTgt); spawnTgt = (spawnTgt + 1) % 4; nextSpawn = rand(0.9, 1.4); }
  }
  for (const d of dummies) {
    d.z -= dt * 1.35; d.spin += dt * 4;
    if (d.z <= g.hitZ + 0.02) {
      const rg = ring(Math.max(d.z, 0.02), g);
      zap(d.tgt, rg.x + Math.cos(d.a) * rg.r, rg.y + Math.sin(d.a) * rg.r);
      d.dead = true;
    }
  }
  dummies = dummies.filter(d => !d.dead);
  for (const b of bolts) b.t += dt;
  bolts = bolts.filter(b => b.t < D.zapT);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt * p.decay; }
  particles = particles.filter(p => p.life > 0);
}

// ---- draw ----
function draw(g, dt) {
  LabBG.draw(ctx, g, ring);
  for (const d of dummies) drawDummy(d, g);
  // the game's node ring, verbatim from fxlab
  ctx.strokeStyle = 'rgba(110,227,255,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, 0, TAU); ctx.stroke();
  for (const n of nodes) drawNode(n, g);
  for (const b of bolts) drawBolt(b);
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = 'rgba(' + p.col + ',1)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  LabBG.vignette(ctx);
}

function drawDummy(d, g) {
  const rg = ring(Math.max(d.z, 0.02), g);
  const x = rg.x + Math.cos(d.a) * rg.r, y = rg.y + Math.sin(d.a) * rg.r;
  const size = u * 0.05 * clamp(rg.r / g.nodeR, 0.1, 2);
  const gl = ctx.createRadialGradient(x, y, 0, x, y, size * 2.4);
  gl.addColorStop(0, 'rgba(255,60,90,0.5)'); gl.addColorStop(1, 'rgba(255,60,90,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, y, size * 2.4, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.rotate(d.spin * 0.3);
  ctx.fillStyle = '#e8274b';
  ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.lineTo(-size, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---- shared carriage: everything the game already draws around the device ----
function drawNode(n, g) {
  const bzn = Math.min(W, H) * 0.055;
  const railR = railRadius(g);
  const s = Math.min(W, H) * 0.038 * D.scale;
  const rr2 = railR - (n.recoil || 0) * s * 0.55;        // zap recoil kicks the sled inward
  const x = g.cx + Math.cos(n.angle) * rr2;
  const y = g.cy + Math.sin(n.angle) * rr2;
  const kick = clamp(n.recoil, 0, 1);
  // lightcycle trail (game code, simplified)
  const tl = clamp(Math.abs(n.trailV) * 10, 0, 1.5);
  if (tl > 0.04) {
    const dir = Math.sign(n.trailV) || 1;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(' + n.col + ',0.3)'; ctx.lineWidth = s * 1.5;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, railR, n.angle - dir * tl, n.angle, dir < 0); ctx.stroke();
    ctx.strokeStyle = 'rgba(240,252,255,0.55)'; ctx.lineWidth = s * 0.4;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, railR, n.angle - dir * tl, n.angle, dir < 0); ctx.stroke();
  }
  // coverage gauge on the ring (game code, fixed tolerance)
  const cov = 0.314, rw = bzn * 0.24;
  ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(' + n.col + ',0.22)'; ctx.lineWidth = rw * 1.7;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, n.angle - cov, n.angle + cov); ctx.stroke();
  ctx.strokeStyle = 'rgba(' + n.col + ',0.55)'; ctx.lineWidth = 1.2;
  for (const rr3 of [g.nodeR - rw, g.nodeR + rw]) {
    ctx.beginPath(); ctx.arc(g.cx, g.cy, rr3, n.angle - cov, n.angle + cov); ctx.stroke();
  }
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(' + n.col + ',0.8)';
  for (const ea of [n.angle - cov, n.angle + cov]) {
    ctx.beginPath();
    ctx.moveTo(g.cx + Math.cos(ea) * (g.nodeR - rw * 1.5), g.cy + Math.sin(ea) * (g.nodeR - rw * 1.5));
    ctx.lineTo(g.cx + Math.cos(ea) * (g.nodeR + rw * 1.5), g.cy + Math.sin(ea) * (g.nodeR + rw * 1.5));
    ctx.stroke();
  }
  ctx.lineCap = 'round';
  // presence glow (game language)
  const gl = ctx.createRadialGradient(x, y, 0, x, y, s * 2.6);
  gl.addColorStop(0, 'rgba(' + n.col + ',' + (0.6 * Math.min(1, D.glowK)).toFixed(2) + ')');
  gl.addColorStop(1, 'rgba(' + n.col + ',0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, y, s * 2.6, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(n.angle);                                   // +x = outward, +y = along the rail
  // pantograph shoes: the game's mounting — struts + contact pads on the ring
  const dRing = g.nodeR - rr2;
  ctx.strokeStyle = 'rgba(' + n.col + ',0.5)';
  ctx.lineWidth = Math.max(1.2, s * 0.1);
  for (const sy of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 0.92, sy * s * 0.42);
    ctx.lineTo(dRing - s * 0.16, sy * s * 0.66);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  for (const sy of [-1, 1]) {
    ctx.beginPath(); ctx.arc(dRing, sy * s * 0.66, Math.max(1.4, s * 0.11), 0, TAU); ctx.fill();
  }
  // THE DEVICE — the only thing that changes between candidates
  [drawEye, drawStuds, drawVanes, drawBeamIris][n.design](n, s, kick);
  ctx.restore();
  // label under the carriage
  const lx = g.cx + Math.cos(n.angle) * (rr2 - s * 2.6);
  const ly = g.cy + Math.sin(n.angle) * (rr2 - s * 2.6);
  ctx.font = '600 ' + Math.round(u * 0.014) + 'px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(159,178,200,0.6)';
  ctx.fillText(String.fromCharCode(65 + n.design) + ' · ' + n.name, lx, ly);
}

// tip helper: store world coords of the firing points (local frame math)
function tips(n, s, x1, y1, x2, y2) {
  const g = geo();
  const railR = railRadius(g);
  const rr2 = railR - (n.recoil || 0) * s * 0.55;
  const cx2 = g.cx + Math.cos(n.angle) * rr2, cy2 = g.cy + Math.sin(n.angle) * rr2;
  const ca = Math.cos(n.angle), sa = Math.sin(n.angle);
  n.tipA = { x: cx2 + ca * x1 - sa * y1, y: cy2 + sa * x1 + ca * y1 };
  n.tipB = { x: cx2 + ca * x2 - sa * y2, y: cy2 + sa * x2 + ca * y2 };
}

// ---- shared iris core: aperture, blades, housing + seating cradle ----
function irisBase(n, s, kick) {
  // seating cradle: braces tying the housing into the pantograph roots —
  // the eye is mounted hardware, not a floating disc
  ctx.fillStyle = 'rgba(140,165,195,0.75)';
  for (const sy of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * 0.34, sy * s * 0.30); ctx.lineTo(s * 0.96, sy * s * 0.40);
    ctx.lineTo(s * 0.96, sy * s * 0.50); ctx.lineTo(s * 0.26, sy * s * 0.48);
    ctx.closePath(); ctx.fill();
  }
  const ap = s * (0.1 + kick * 0.22);            // aperture radius: snaps open to fire
  const core = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.5);
  core.addColorStop(0, kick > 0.3 ? '#ffffff' : 'rgba(' + n.col + ',0.95)');
  core.addColorStop(0.4, 'rgba(' + n.col + ',' + (0.5 + kick * 0.5).toFixed(2) + ')');
  core.addColorStop(1, 'rgba(' + n.col + ',0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, s * 0.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(180,205,235,0.9)';     // six blades orbiting the core
  ctx.lineWidth = Math.max(2, s * (0.3 - kick * 0.12));
  const bladeR = ap + s * 0.18;
  for (let k = 0; k < 6; k++) {
    const a0 = n.spin * 0.7 + k * TAU / 6;
    ctx.beginPath(); ctx.arc(0, 0, bladeR, a0, a0 + TAU / 6 * 0.72); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(140,165,195,0.8)';     // housing ring + lugs
  ctx.lineWidth = Math.max(1.6, s * 0.1);
  ctx.beginPath(); ctx.arc(0, 0, s * 0.58, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(140,165,195,0.9)';
  for (let k = 0; k < 4; k++) {
    const a0 = k * TAU / 4 + TAU / 8;
    ctx.save(); ctx.rotate(a0); ctx.fillRect(s * 0.54, -s * 0.07, s * 0.14, s * 0.14); ctx.restore();
  }
  ctx.fillStyle = kick > 0.3 ? '#ffffff' : 'rgba(' + n.col + ',1)'; // the open eye
  ctx.beginPath(); ctx.arc(0, 0, ap, 0, TAU); ctx.fill();
  return ap;
}

// ---- A · EYE: the bolt is born in the aperture itself ----
function drawEye(n, s, kick) {
  const ap = irisBase(n, s, kick);
  if (kick > 0.05) {                             // muzzle flash blooming out of the pupil
    const mf = ctx.createRadialGradient(0, 0, 0, 0, 0, s * (0.4 + kick * 0.9));
    mf.addColorStop(0, 'rgba(255,255,255,' + (0.8 * kick).toFixed(2) + ')');
    mf.addColorStop(0.4, 'rgba(' + n.col + ',' + (0.5 * kick).toFixed(2) + ')');
    mf.addColorStop(1, 'rgba(' + n.col + ',0)');
    ctx.fillStyle = mf;
    ctx.beginPath(); ctx.arc(0, 0, s * (0.4 + kick * 0.9), 0, TAU); ctx.fill();
  }
  // idle: a pupil glint wandering the aperture rim — the eye is awake
  const ga = n.spin * 1.3;
  ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + n.threat * 0.4).toFixed(2) + ')';
  ctx.beginPath(); ctx.arc(Math.cos(ga) * ap * 0.7, Math.sin(ga) * ap * 0.7, Math.max(0.8, ap * 0.2), 0, TAU); ctx.fill();
  tips(n, s, 0, 0, s * 0.04, 0);                 // both strands leave the pupil
}

// ---- B · STUDS: rim electrodes gather the charge, then it converges ----
function drawStuds(n, s, kick) {
  irisBase(n, s, kick);
  const SR = s * 0.66;
  const studs = [];
  for (let k = 0; k < 6; k++) {
    const a0 = k * TAU / 6 + TAU / 12;
    studs.push([Math.cos(a0) * SR, Math.sin(a0) * SR]);
    ctx.fillStyle = 'rgba(200,220,245,0.95)';
    ctx.beginPath(); ctx.arc(studs[k][0], studs[k][1], Math.max(1.2, s * 0.055), 0, TAU); ctx.fill();
  }
  // idle: micro-arcs crawl between neighboring studs, more when threatened
  if (Math.random() < (0.25 + n.threat * 0.5) * D.arcK) {
    const k = (Math.random() * 6) | 0, p0 = studs[k], p1 = studs[(k + 1) % 6];
    ctx.strokeStyle = 'rgba(' + n.col + ',0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]);
    for (let q = 1; q < 4; q++) {
      const t2 = q / 4;
      ctx.lineTo(p0[0] + (p1[0] - p0[0]) * t2 + rand(-2, 2), p0[1] + (p1[1] - p0[1]) * t2 + rand(-2, 2));
    }
    ctx.lineTo(p1[0], p1[1]); ctx.stroke();
  }
  // zap: feeder arcs collapse from the studs into the eye
  if (kick > 0.05) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * kick).toFixed(2) + ')';
    ctx.lineWidth = 1.2;
    for (let k = 0; k < 6; k += 2) {
      const p0 = studs[k];
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]);
      for (let q = 1; q < 3; q++) {
        const t2 = q / 3;
        ctx.lineTo(p0[0] * (1 - t2) + rand(-2.5, 2.5), p0[1] * (1 - t2) + rand(-2.5, 2.5));
      }
      ctx.lineTo(0, 0); ctx.stroke();
    }
  }
  tips(n, s, 0, 0, s * 0.04, 0);
}

// ---- C · VANES: twin focus vanes hold a live arc (EMP-prong lineage) ----
function drawVanes(n, s, kick) {
  irisBase(n, s, kick);
  const vx = s * 1.02, vy = s * 0.4;             // vane tips, reaching toward the wall
  ctx.lineCap = 'round';
  for (const sy of [-1, 1]) {
    ctx.strokeStyle = 'rgba(180,205,235,0.9)';
    ctx.lineWidth = Math.max(1.6, s * 0.1);
    ctx.beginPath();
    ctx.moveTo(s * 0.42, sy * s * 0.32);
    ctx.lineTo(s * 0.78, sy * s * 0.42);
    ctx.lineTo(vx, sy * vy);
    ctx.stroke();
    ctx.fillStyle = 'rgba(' + n.col + ',0.95)';
    ctx.beginPath(); ctx.arc(vx, sy * vy, Math.max(1.3, s * 0.08), 0, TAU); ctx.fill();
  }
  // the live arc between the vane tips — restless, white-hot on a zap
  if (D.arcK > 0.02) {
    for (const [lw2, al2] of [[s * (kick > 0.2 ? 0.3 : 0.2), 0.22], [s * (kick > 0.2 ? 0.13 : 0.07), 0.9]]) {
      ctx.strokeStyle = kick > 0.2 ? 'rgba(255,255,255,' + al2 + ')'
        : 'rgba(' + n.col + ',' + (al2 * (0.5 + Math.random() * 0.5) * D.arcK).toFixed(2) + ')';
      ctx.lineWidth = Math.max(1, lw2);
      ctx.beginPath();
      ctx.moveTo(vx, -vy);
      for (let q = 1; q < 5; q++) {
        ctx.lineTo(vx + (Math.random() * 0.24 + kick * 0.15) * s, -vy + vy * 2 * q / 5 + rand(-1, 1) * s * 0.12);
      }
      ctx.lineTo(vx, vy);
      ctx.stroke();
    }
  }
  tips(n, s, vx, -vy, vx, vy);
}

// ---- D · BEAM: a guide beam always touches the wall; the zap rides it ----
function drawBeamIris(n, s, kick) {
  irisBase(n, s, kick);
  const g = geo();
  const reach = g.nodeR - (railRadius(g) - (n.recoil || 0) * s * 0.55) + s * 0.5; // past the ring
  const flick = 0.75 + Math.sin(n.spin * 6) * 0.15 + n.threat * 0.3;
  // soft guide column out of the eye, brightening with threat and fire
  for (const [lw2, al2] of [[s * 0.2, 0.10], [s * 0.07, 0.28], [s * 0.025, 0.5]]) {
    ctx.strokeStyle = 'rgba(' + n.col + ',' + Math.min(1, (al2 * flick + kick * 0.4)).toFixed(2) + ')';
    ctx.lineWidth = Math.max(1, lw2 * (1 + kick));
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 0.2, 0); ctx.lineTo(reach, 0); ctx.stroke();
  }
  // faint touch-point splash where the beam meets the ring
  ctx.fillStyle = 'rgba(' + n.col + ',' + (0.25 * flick + kick * 0.5).toFixed(2) + ')';
  ctx.beginPath(); ctx.arc(reach, 0, s * (0.09 + kick * 0.12), 0, TAU); ctx.fill();
  tips(n, s, s * 0.2, 0, reach * 0.55, 0);       // the zap rides the beam line
}

// ---- zap bolts: jagged lightning for the arc variants, a clean burn for BEAM ----
function drawBolt(b) {
  const n = nodes[b.i], k = b.t / D.zapT, fade = 1 - k;
  const jit = [0.12, 0.12, 0.1, 0.015][n.design];
  for (const tip of [n.tipA, n.tipB]) {
    for (const [lw, al, colr] of [[u * 0.008, 0.3 * fade, n.col], [u * 0.003, 0.95 * fade, '255,255,255']]) {
      ctx.strokeStyle = 'rgba(' + colr + ',' + al.toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, lw);
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      const dx = b.tx - tip.x, dy = b.ty - tip.y, len = Math.hypot(dx, dy);
      for (let q = 1; q < 7; q++) {
        const t2 = q / 7;
        ctx.lineTo(tip.x + dx * t2 + (Math.random() - 0.5) * len * jit * fade,
                   tip.y + dy * t2 + (Math.random() - 0.5) * len * jit * fade);
      }
      ctx.lineTo(b.tx, b.ty);
      ctx.stroke();
    }
  }
}

// ---- loop ----
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const g = geo();
  if (!paused) step(dt, g);
  draw(g, dt);
  requestAnimationFrame(tick);
}

// ---- panel wiring ----
const slidersEl = document.getElementById('sliders'), outEl = document.getElementById('out');
function readout() {
  const lines = Object.keys(K).map(k => '  ' + k + ': ' + K[k].v.toFixed(2) + ',');
  outEl.textContent = 'const ZAPFX = {\n' + lines.join('\n') + '\n};';
}
for (const key in K) {
  const k = K[key], row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<label>' + k.lbl + ' <b id="v_' + key + '">' + k.v + '</b></label>' +
    '<input type="range" style="grid-column:1/-1" id="s_' + key + '" min="' + k.min +
    '" max="' + k.max + '" step="' + k.step + '" value="' + k.v + '">';
  slidersEl.appendChild(row);
  row.querySelector('input').addEventListener('input', e => {
    k.v = +e.target.value;
    document.getElementById('v_' + key).textContent = k.v;
    readout();
  });
}
readout();
for (const b of document.querySelectorAll('[data-z]')) b.onclick = () => zap(+b.dataset.z);
document.getElementById('bPause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'play' : 'pause'; };
document.getElementById('bCopy').onclick = () => navigator.clipboard.writeText(outEl.textContent);
cv.addEventListener('pointerdown', e => { // click: send a hostile at the nearest device
  const g = geo();
  const a = Math.atan2(e.clientY - g.cy, e.clientX - g.cx);
  let best = 0, bd = 9;
  for (let i = 0; i < 4; i++) {
    const d2 = Math.abs(angDiff(a, nodes[i].angle));
    if (d2 < bd) { bd = d2; best = i; }
  }
  spawnDummy(best, a);
});

function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; u = Math.min(W, H); LabBG.resize(W, H); }
addEventListener('resize', resize);
resize();
// snapshot mode (?t=2.5&freeze&zap): fast-forward, optionally fire all four
const Q = new URLSearchParams(location.search);
if (Q.has('t') || Q.has('zap')) {
  const g = geo();
  for (let t = +Q.get('t') || 0; t > 0; t -= 1 / 60) step(1 / 60, g);
  if (Q.has('zap')) for (let i = 0; i < 4; i++) zap(i);
  paused = Q.has('freeze');
  if (paused) document.getElementById('bPause').textContent = 'play';
}
requestAnimationFrame(tick);
</script>

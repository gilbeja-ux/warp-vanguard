<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATA DEFENDERS — FX LAB · ring &amp; maglev nodes</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060f; overflow: hidden;
    font: 12px/1.4 system-ui, sans-serif; color: #9fb2c8; }
  canvas { display: block; position: fixed; inset: 0; }
  #panel { position: fixed; top: 10px; right: 10px; width: 250px; max-height: calc(100% - 20px);
    overflow-y: auto; background: rgba(6,10,22,0.88); border: 1px solid #1c2740;
    border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(4px); }
  #panel h1 { font-size: 13px; letter-spacing: 2px; color: #8fe0ff; margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: 1fr 44px; gap: 6px; align-items: center; margin: 7px 0; }
  .row label { grid-column: 1 / -1; display: flex; justify-content: space-between; color: #7d90a8; }
  .row label b { color: #d0e4ff; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #4d9bff; }
  .btns { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
  button { background: #101a30; color: #bfeaff; border: 1px solid #27395e; border-radius: 6px;
    padding: 5px 10px; font: 600 11px system-ui; cursor: pointer; }
  button:hover { background: #18264a; }
  #bStyle { border-color: #4d9bff; }
  pre { background: #060a14; border: 1px solid #1c2740; border-radius: 6px; padding: 8px;
    font-size: 10px; color: #7ee262; white-space: pre-wrap; user-select: all; margin: 8px 0 0; }
  #tag { position: fixed; left: 14px; top: 12px; color: #33507a; letter-spacing: 3px; font-size: 11px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tag">FX LAB — RING &amp; MAGLEV NODES (drag a node · click to send a hostile)</div>
<div id="panel">
  <h1>MAGLEV DECK</h1>
  <div class="btns">
    <button id="bStyle">style: REAL ⇄</button>
  </div>
  <div id="sliders"></div>
  <div class="btns">
    <button id="bPause">pause</button>
    <button id="bZapL">zap cyan</button>
    <button id="bZapR">zap white</button>
    <button id="bCopy">copy values</button>
  </div>
  <pre id="out"></pre>
</div>
<script src="labbg.js"></script>
<script>
'use strict';
// A pocket copy of the game's tunnel math + the redesigned ring/node hardware,
// rendered in TWO competing styles (toggle button, or ?style=digital).
//
// REAL is built from photographic reference (lens barrels, plasma discharge
// tubes, maglev bogies, Marx generators):
//   - matte near-black metal; value contrast lives at machined edges only
//   - ONE key light (LIGHT_A): the lit sector glints, the far side goes dead
//   - hairline speculars on every machined edge, knurl bands, engraved marks
//   - plasma = soft striated blobs behind glass with a long specular streak
//   - capacitor stack = dark decks; the charge glows in the GAPS
//   - levitation = a tight dark shadow line under a wrapping skirt
//   - film grain + vignette finish
// DIGITAL is the same geometry as pure signal: wireframe, scanlines, ticks.
const TAU = Math.PI * 2;
const LIGHT_A = -TAU * 0.31;            // world key-light azimuth (top-left)
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, u = 0;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = t => t * t * (3 - 2 * t);
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };

// ---- knobs ----
const K = {
  bandW:   { v: 0.90, min: 0.4,  max: 1.6, step: 0.05, lbl: 'ring band width', ring: 1 },
  metal:   { v: 1.00, min: 0.5,  max: 1.6, step: 0.05, lbl: 'metal brightness', ring: 1 },
  sheen:   { v: 0.55, min: 0,    max: 1,   step: 0.05, lbl: 'brushed sheen (real)', ring: 1 },
  railGlow:{ v: 0.50, min: 0,    max: 1,   step: 0.05, lbl: 'rail glow', ring: 1 },
  gap:     { v: 0.45, min: 0.1,  max: 1.2, step: 0.05, lbl: 'maglev gap (×size)' },
  bobAmp:  { v: 0.30, min: 0,    max: 1,   step: 0.05, lbl: 'hover bob amount' },
  bobSpd:  { v: 1.20, min: 0,    max: 4,   step: 0.1,  lbl: 'hover bob speed' },
  repulse: { v: 0.35, min: 0,    max: 1,   step: 0.05, lbl: 'repulsor glow' },
  cellIdle:{ v: 0.78, min: 0.3,  max: 1,   step: 0.02, lbl: 'cell idle level' },
  breath:  { v: 0.05, min: 0,    max: 0.2, step: 0.01, lbl: 'cell breathing' },
  dip:     { v: 0.30, min: 0,    max: 0.6, step: 0.02, lbl: 'zap dip depth' },
  refill:  { v: 1.20, min: 0.3,  max: 3,   step: 0.1,  lbl: 'refill time (s)' },
  waveAmp: { v: 0.50, min: 0,    max: 1,   step: 0.05, lbl: 'plasma unrest (cyan)' },
  segs:    { v: 9,    min: 5,    max: 14,  step: 1,    lbl: 'capacitor decks' },
  arcMax:  { v: 0.50, min: 0,    max: 1,   step: 0.05, lbl: 'containment shimmer' },
  zapT:    { v: 0.28, min: 0.1,  max: 0.6, step: 0.02, lbl: 'zap bolt life (s)' },
  grain:   { v: 0.50, min: 0,    max: 1,   step: 0.05, lbl: 'film grain (real)' },
};
const D = new Proxy({}, { get: (_, k) => K[k].v });
const Q = new URLSearchParams(location.search);
let STYLE = Q.get('style') === 'digital' ? 'digital' : 'real';

// ---- simplified tunnel (no swerve: every ring concentric) ----
const geo = () => {
  const nodeR = Math.min(W, H) * 0.44;
  const R0 = Math.hypot(W, H) / 2 * 1.08;
  return { cx: W / 2, cy: H / 2, nodeR, R0, hitZ: (R0 / nodeR - 1) / 6 };
};
function ring(z, g) {
  const s = 1 / (1 + z * 6);
  return { x: g.cx, y: g.cy, r: g.R0 * s, s };
}

// neutral dark-metal shade — l is luminance 0..255 before the metal knob
const gun = l => { l *= D.metal; return 'rgb(' + Math.round(l * 0.92) + ',' + Math.round(l * 0.96) + ',' + Math.round(Math.min(255, l * 1.04)) + ')'; };
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---- the two machines ----
const nodes = [
  { baseA: Math.PI * 0.8, phase: 0.0, kind: 'fluid', col: '111,227,255',
    bright: '#c9f6ff', mid: '#4fdcff', tag: 'FL·01' },
  { baseA: Math.PI * 1.3, phase: 2.1, kind: 'tesla', col: '235,245,255',
    bright: '#ffffff', mid: '#dfe9f5', tag: 'TS·02' },
];
for (const n of nodes) {
  n.angle = n.baseA; n.prevA = n.baseA; n.trailV = 0;
  n.dip = 0;            // 1 right after a zap, decays over refill time
  n.sprX = 0; n.sprV = 0; // maglev suspension spring (radial, + = compressed)
  n.threat = 0;         // 0..1 nearest-hostile agitation
  n.bubbles = [];       // stray sparks drifting in the plasma tube
  n.tipA = { x: 0, y: 0 }; n.tipB = { x: 0, y: 0 }; // emitter tips, world coords
}

// ---- sim state ----
let dummies = [], bolts = [], particles = [], impacts = [];
let nextSpawn = 0.8, spawnTgt = 0, paused = false, dragging = -1, time = 0;

function spawnDummy(i, a) {
  const n = nodes[i];
  dummies.push({ a: a !== undefined ? a : n.angle + rand(-0.3, 0.3), z: 2.2, tgt: i, spin: rand(0, TAU) });
}
function zap(i, tx, ty, ta) {
  const n = nodes[i], g = geo();
  n.dip = 1;
  n.sprV += 9;                       // slam the suspension toward the rail
  if (tx === undefined) {
    ta = n.angle;
    tx = g.cx + Math.cos(ta) * g.nodeR; ty = g.cy + Math.sin(ta) * g.nodeR;
  }
  bolts.push({ i, tx, ty, t: 0 });
  impacts.push({ x: tx, y: ty, a: ta, t: 0, col: n.col });
  for (let p = 0; p < 14; p++) particles.push({
    x: tx, y: ty, vx: rand(-2.5, 2.5), vy: rand(-2.5, 2.5),
    life: rand(0.3, 0.6), decay: 2.2, col: p % 3 ? n.col : '255,255,255', size: rand(1, 2.6) });
}

// ---- sim ----
function step(dt, g) {
  time += dt;
  LabBG.step(dt);
  for (let i = 0; i < 2; i++) {
    const n = nodes[i];
    if (dragging !== i) n.angle = n.baseA + 0.3 * Math.sin(time * 0.28 + n.phase);
    const vel = angDiff(n.angle, n.prevA);
    n.trailV = n.trailV * 0.8 + vel * 0.2;
    n.prevA = n.angle;
    const kSpr = 90, cSpr = 7;
    n.sprV += (-kSpr * n.sprX - cSpr * n.sprV) * dt;
    n.sprX += n.sprV * dt;
    if (n.dip > 0) n.dip = Math.max(0, n.dip - dt / D.refill);
    let th = 0;
    for (const d of dummies) {
      const near = clamp(1 - Math.abs(angDiff(d.a, n.angle)) / 1.1, 0, 1) *
                   clamp((0.7 - d.z) / 0.7 + 0.35, 0, 1);
      th = Math.max(th, near);
    }
    n.threat += (th - n.threat) * Math.min(1, dt * 8);
  }
  if (dummies.length < 2) { nextSpawn -= dt; if (nextSpawn <= 0) { spawnDummy(spawnTgt); spawnTgt = 1 - spawnTgt; nextSpawn = rand(1.1, 1.7); } }
  for (const d of dummies) {
    d.z -= dt * 1.35; d.spin += dt * 4;
    if (d.z <= g.hitZ + 0.02) {
      const rg = ring(Math.max(d.z, 0.02), g);
      zap(d.tgt, rg.x + Math.cos(d.a) * rg.r, rg.y + Math.sin(d.a) * rg.r, d.a);
      d.dead = true;
    }
  }
  dummies = dummies.filter(d => !d.dead);
  for (const b of bolts) b.t += dt;
  bolts = bolts.filter(b => b.t < D.zapT);
  for (const im of impacts) im.t += dt;
  impacts = impacts.filter(im => im.t < 0.45);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt * p.decay; }
  particles = particles.filter(p => p.life > 0);
  const cn = nodes[0];
  if (Math.random() < dt * (2 + cn.threat * 8)) cn.bubbles.push({ y: rand(-0.2, 0.2), x: rand(-0.8, 0.8), dir: Math.random() < 0.5 ? -1 : 1, r: rand(0.02, 0.05), life: 1 });
  for (const b of cn.bubbles) { b.y += b.dir * dt * 0.55; b.life -= dt * 0.5; }
  cn.bubbles = cn.bubbles.filter(b => b.life > 0 && Math.abs(b.y) < 1.2);
}

// ---- the ring: prerendered ----
const ringCv = document.createElement('canvas');
const noiseCv = document.createElement('canvas');
let ringDirty = true;
const railRadius = g => g.nodeR - Math.min(W, H) * 0.055 * D.bandW * 0.5;

function buildNoise() { // static sensor grain, tiled with a per-frame offset
  noiseCv.width = noiseCv.height = 256;
  const c = noiseCv.getContext('2d');
  const im = c.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = 118 + (Math.random() - 0.5) * 255;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    im.data[i + 3] = 255;
  }
  c.putImageData(im, 0, 0);
}

// a hairline circle whose brightness follows the key light: a faint full ring
// plus a brighter glint over the lit sector — the lens-barrel look
function litHairline(c, cx, cy, r, base, lit, span) {
  c.lineWidth = 1;
  c.strokeStyle = 'rgba(225,235,250,' + base.toFixed(3) + ')';
  c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.stroke();
  const grd = span || 1.15;
  for (const [al, sp] of [[lit, grd], [lit * 0.5, grd * 1.7]]) {
    c.strokeStyle = 'rgba(225,235,250,' + al.toFixed(3) + ')';
    c.beginPath(); c.arc(cx, cy, r, LIGHT_A - sp, LIGHT_A + sp); c.stroke();
  }
}

function buildRing(g) {
  ringCv.width = W; ringCv.height = H;
  const c = ringCv.getContext('2d');
  const bh = Math.min(W, H) * 0.055 * D.bandW;
  const Rin = g.nodeR - bh, Rout = g.nodeR + bh;
  const railR = Rin + bh * 0.5;
  if (STYLE === 'digital') {
    c.fillStyle = 'rgba(30,60,100,0.10)';
    c.beginPath(); c.arc(g.cx, g.cy, Rout, 0, TAU); c.arc(g.cx, g.cy, Rin, 0, TAU, true); c.fill();
    c.strokeStyle = 'rgba(120,200,255,0.55)'; c.lineWidth = 1.4;
    c.beginPath(); c.arc(g.cx, g.cy, Rout, 0, TAU); c.stroke();
    c.beginPath(); c.arc(g.cx, g.cy, Rin, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(120,200,255,0.09)'; c.lineWidth = 1;
    for (const rr of [g.nodeR - bh * 0.33, g.nodeR + bh * 0.33]) {
      c.beginPath(); c.arc(g.cx, g.cy, rr, 0, TAU); c.stroke();
    }
    for (let dg = 0; dg < 360; dg += 2) {
      const a = dg * TAU / 360, major = dg % 30 === 0;
      const r1 = Rout - 2, r0 = major ? Rout - bh * 0.55 : Rout - bh * 0.22;
      c.strokeStyle = major ? 'rgba(120,200,255,0.35)' : 'rgba(120,200,255,0.12)';
      c.lineWidth = major ? 1.4 : 1;
      c.beginPath();
      c.moveTo(g.cx + Math.cos(a) * r0, g.cy + Math.sin(a) * r0);
      c.lineTo(g.cx + Math.cos(a) * r1, g.cy + Math.sin(a) * r1);
      c.stroke();
    }
    c.strokeStyle = 'rgba(120,200,255,' + (0.25 + 0.35 * D.railGlow).toFixed(3) + ')';
    c.lineWidth = 2; c.setLineDash([6, 6]);
    c.beginPath(); c.arc(g.cx, g.cy, railR, 0, TAU); c.stroke();
    c.setLineDash([]);
    ringDirty = false;
    return;
  }
  // ==== REAL: matte near-black machined collar under one key light ====
  // base cross-band values: dark, with only a modest crown
  const rg = c.createRadialGradient(g.cx, g.cy, Rin, g.cx, g.cy, Rout);
  rg.addColorStop(0,    'rgb(3,5,9)');
  rg.addColorStop(0.07, gun(19));
  rg.addColorStop(0.32, gun(35));
  rg.addColorStop(0.46, gun(45));
  rg.addColorStop(0.62, gun(29));
  rg.addColorStop(0.9,  gun(11));
  rg.addColorStop(1,    'rgb(2,3,6)');
  c.lineWidth = bh * 2;
  c.strokeStyle = rg;
  c.beginPath(); c.arc(g.cx, g.cy, g.nodeR, 0, TAU); c.stroke();
  // ONE key light: a directional wash clipped to the band — the lit sector
  // lifts, the far side dies into black. This is what the flat version lacked.
  c.save();
  c.beginPath(); c.arc(g.cx, g.cy, Rout, 0, TAU); c.arc(g.cx, g.cy, Rin, 0, TAU, true); c.clip();
  const lx = g.cx + Math.cos(LIGHT_A) * g.nodeR, ly = g.cy + Math.sin(LIGHT_A) * g.nodeR;
  const dx2 = g.cx - Math.cos(LIGHT_A) * g.nodeR, dy2 = g.cy - Math.sin(LIGHT_A) * g.nodeR;
  const kl = c.createLinearGradient(lx, ly, dx2, dy2);
  kl.addColorStop(0, 'rgba(215,228,250,' + (0.13 * D.metal).toFixed(3) + ')');
  kl.addColorStop(0.45, 'rgba(215,228,250,0)');
  kl.addColorStop(0.55, 'rgba(0,0,0,0)');
  kl.addColorStop(1, 'rgba(0,0,0,0.30)');
  c.fillStyle = kl; c.fillRect(0, 0, W, H);
  // bore bounce: the tunnel's cold glow grazes the inner third of the collar —
  // this ambient is what keeps the unlit sector from dying entirely
  const bb = c.createRadialGradient(g.cx, g.cy, Rin, g.cx, g.cy, Rin + bh * 0.8);
  bb.addColorStop(0, 'rgba(100,170,230,0.07)');
  bb.addColorStop(1, 'rgba(100,170,230,0)');
  c.fillStyle = bb; c.fillRect(0, 0, W, H);
  // brushed grain, key-modulated and whisper-quiet
  const NSEG = 180;
  for (let i = 0; i < NSEG; i++) {
    const a0 = i / NSEG * TAU, a1 = (i + 1.15) / NSEG * TAU;
    const key = Math.pow(0.5 + 0.5 * Math.cos((a0 + a1) / 2 - LIGHT_A), 2.5);
    const grain = hash(i) - 0.5;
    const al = D.sheen * key * (0.05 + Math.max(0, grain) * 0.07);
    const dk = D.sheen * Math.max(0, -grain) * 0.10;
    c.lineWidth = bh * 2;
    if (al > 0.004) { c.strokeStyle = 'rgba(225,235,255,' + al.toFixed(3) + ')'; c.beginPath(); c.arc(g.cx, g.cy, g.nodeR, a0, a1); c.stroke(); }
    if (dk > 0.004) { c.strokeStyle = 'rgba(0,0,0,' + dk.toFixed(3) + ')'; c.beginPath(); c.arc(g.cx, g.cy, g.nodeR, a0, a1); c.stroke(); }
  }
  // radial machining marks
  for (let i = 0; i < 240; i++) {
    const a = hash(i + 500) * TAU, len = 0.25 + hash(i + 900) * 0.6;
    const key = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.cos(a - LIGHT_A), 2);
    const r0 = Rin + hash(i + 700) * (1 - len) * bh * 2, r1 = r0 + len * bh * 0.5;
    c.strokeStyle = hash(i + 300) > 0.5 ? 'rgba(255,255,255,' + (0.02 * key).toFixed(3) + ')' : 'rgba(0,0,0,0.05)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(g.cx + Math.cos(a) * r0, g.cy + Math.sin(a) * r0);
    c.lineTo(g.cx + Math.cos(a) * r1, g.cy + Math.sin(a) * r1);
    c.stroke();
  }
  c.restore();
  // machined hairlines — the lens-barrel read: faint rings, glints in the light
  litHairline(c, g.cx, g.cy, Rin + 0.8,        0.10, 0.22 * D.metal);
  litHairline(c, g.cx, g.cy, railR + bh * 0.24, 0.04, 0.10 * D.metal);
  litHairline(c, g.cx, g.cy, g.nodeR + bh * 0.34, 0.035, 0.12 * D.metal);
  litHairline(c, g.cx, g.cy, Rout - bh * 0.16, 0.04, 0.14 * D.metal);
  c.strokeStyle = 'rgba(0,0,0,0.55)'; c.lineWidth = 1.2;      // outer chamfer falls off
  c.beginPath(); c.arc(g.cx, g.cy, Rout - 0.6, 0, TAU); c.stroke();
  c.beginPath(); c.arc(g.cx, g.cy, g.nodeR + bh * 0.31, 0, TAU); c.stroke(); // groove shadow twin
  // engraved index scale near the outer edge — etched paint, mostly uniform
  for (let dg = 0; dg < 360; dg += 3) {
    const a = dg * TAU / 360, major = dg % 30 === 0;
    const r1 = Rout - bh * 0.08, r0 = r1 - (major ? bh * 0.22 : bh * 0.1);
    c.strokeStyle = 'rgba(190,205,225,' + (major ? 0.16 : 0.07) + ')';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(g.cx + Math.cos(a) * r0, g.cy + Math.sin(a) * r0);
    c.lineTo(g.cx + Math.cos(a) * r1, g.cy + Math.sin(a) * r1);
    c.stroke();
  }
  // four seams with a bolt pair each — flange hardware, barely lit
  for (let i = 0; i < 4; i++) {
    const a = i * TAU / 4 + TAU / 8, ca = Math.cos(a), sa = Math.sin(a);
    const key = 0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.cos(a - LIGHT_A), 2);
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(0,0,0,0.4)';
    c.beginPath(); c.moveTo(g.cx + ca * Rin, g.cy + sa * Rin); c.lineTo(g.cx + ca * Rout, g.cy + sa * Rout); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,' + (0.05 * key).toFixed(3) + ')';
    c.beginPath(); c.moveTo(g.cx + ca * Rin - sa, g.cy + sa * Rin + ca); c.lineTo(g.cx + ca * Rout - sa, g.cy + sa * Rout + ca); c.stroke();
    for (const off of [-0.028, 0.028]) {
      const ba = a + off, br = g.nodeR + bh * 0.62;
      const bx = g.cx + Math.cos(ba) * br, by = g.cy + Math.sin(ba) * br;
      c.fillStyle = gun(26 * key + 8);
      c.beginPath(); c.arc(bx, by, bh * 0.055, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 0.8;
      c.beginPath(); c.arc(bx, by, bh * 0.055, 0, TAU); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,' + (0.2 * key).toFixed(3) + ')';
      c.beginPath(); c.arc(bx, by, bh * 0.04, LIGHT_A - 1, LIGHT_A + 1); c.stroke();
    }
  }
  // the maglev rail: a deep machined groove; energy is a whisper until used
  c.lineWidth = bh * 0.4; c.strokeStyle = 'rgba(1,2,5,0.95)';
  c.beginPath(); c.arc(g.cx, g.cy, railR, 0, TAU); c.stroke();
  c.lineWidth = 2; c.strokeStyle = 'rgba(0,0,0,0.5)';
  c.beginPath(); c.arc(g.cx, g.cy, railR - bh * 0.19, 0, TAU); c.stroke();
  c.lineWidth = 1; c.strokeStyle = 'rgba(120,180,230,' + (0.06 + 0.14 * D.railGlow).toFixed(3) + ')';
  c.beginPath(); c.arc(g.cx, g.cy, railR, 0, TAU); c.stroke();
  ringDirty = false;
}

// ---- draw ----
function draw(g, dt) {
  LabBG.draw(ctx, g, ring);
  for (const d of dummies) drawDummy(d, g);
  if (ringDirty) buildRing(g);
  ctx.drawImage(ringCv, 0, 0);
  const railR = railRadius(g);
  const bh = Math.min(W, H) * 0.055 * D.bandW;
  if (STYLE === 'digital') {
    ctx.strokeStyle = 'rgba(140,220,255,' + (0.3 + 0.3 * D.railGlow).toFixed(3) + ')';
    ctx.lineWidth = 2; ctx.setLineDash([3, 14]); ctx.lineDashOffset = -time * 40;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, railR, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  for (let i = 0; i < 2; i++) {
    const n = nodes[i];
    const wake = clamp(0.25 + Math.abs(n.trailV) * 14, 0.25, 1) * D.railGlow * (STYLE === 'real' ? 0.5 : 1);
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(' + n.col + ',' + (wake * 0.45).toFixed(3) + ')';
    ctx.lineWidth = STYLE === 'real' ? 1.4 : 2;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, railR, n.angle - 0.32, n.angle + 0.32); ctx.stroke();
    const cov = 0.314;
    ctx.lineCap = 'butt';
    if (STYLE === 'real') { // recessed light strip, dim until it matters
      ctx.strokeStyle = 'rgba(' + n.col + ',' + (0.05 + n.threat * 0.06).toFixed(3) + ')';
      ctx.lineWidth = bh * 0.24;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bh * 0.62, n.angle - cov, n.angle + cov); ctx.stroke();
      ctx.strokeStyle = 'rgba(' + n.col + ',' + (0.35 + n.threat * 0.3).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bh * 0.62, n.angle - cov, n.angle + cov); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(' + n.col + ',0.2)';
      ctx.lineWidth = bh * 0.5;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bh * 0.45, n.angle - cov, n.angle + cov); ctx.stroke();
      ctx.strokeStyle = 'rgba(' + n.col + ',0.7)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bh * 0.68, n.angle - cov, n.angle + cov); ctx.stroke();
    }
    for (const ea of [n.angle - cov, n.angle + cov]) {
      ctx.strokeStyle = 'rgba(' + n.col + ',' + (STYLE === 'real' ? 0.3 : 0.7) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(g.cx + Math.cos(ea) * (g.nodeR + bh * 0.45), g.cy + Math.sin(ea) * (g.nodeR + bh * 0.45));
      ctx.lineTo(g.cx + Math.cos(ea) * (g.nodeR + bh * 0.82), g.cy + Math.sin(ea) * (g.nodeR + bh * 0.82));
      ctx.stroke();
    }
    ctx.lineCap = 'round';
  }
  for (let i = 0; i < 2; i++) drawNode(nodes[i], g);
  for (const b of bolts) drawBolt(b, g);
  for (const im of impacts) {
    const k = im.t / 0.45;
    ctx.strokeStyle = 'rgba(' + im.col + ',' + (0.7 * (1 - k)).toFixed(3) + ')';
    ctx.lineWidth = 2.5 * (1 - k);
    ctx.beginPath(); ctx.arc(im.x, im.y, 6 + k * u * 0.05, 0, TAU); ctx.stroke();
  }
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = 'rgba(' + p.col + ',1)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (STYLE === 'real' && D.grain > 0.01) { // photographic finish
    ctx.globalAlpha = 0.05 * D.grain;
    const ox = (Math.floor(time * 24) * 97) % 256, oy = (Math.floor(time * 24) * 53) % 256;
    for (let yy = -oy; yy < H; yy += 256) for (let xx = -ox; xx < W; xx += 256)
      ctx.drawImage(noiseCv, xx, yy);
    ctx.globalAlpha = 1;
  }
  LabBG.vignette(ctx);
}

function drawDummy(d, g) {
  const rg = ring(Math.max(d.z, 0.02), g);
  const x = rg.x + Math.cos(d.a) * rg.r, y = rg.y + Math.sin(d.a) * rg.r;
  const size = u * 0.05 * clamp(rg.r / g.nodeR, 0.1, 2);
  const gl = ctx.createRadialGradient(x, y, 0, x, y, size * 2.4);
  gl.addColorStop(0, 'rgba(255,60,90,0.35)'); gl.addColorStop(1, 'rgba(255,60,90,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, y, size * 2.4, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.rotate(d.spin * 0.3);
  ctx.fillStyle = '#c2213f';
  ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.lineTo(-size, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---- shared node geometry ----
function nodeGeom(n, g) {
  const s = Math.min(W, H) * 0.038;
  const railR = railRadius(g);
  const bh = Math.min(W, H) * 0.055 * D.bandW;
  const bob = D.bobAmp * 0.22 * Math.sin(time * D.bobSpd + n.phase * 3);
  const effGap = Math.max(0.05, D.gap * (1 + bob) - clamp(n.sprX, -0.5, 1) * D.gap * 0.85);
  const rn = railR - s * (0.15 + effGap);
  const x = g.cx + Math.cos(n.angle) * rn, y = g.cy + Math.sin(n.angle) * rn;
  const dRail = railR - rn;
  const armX = dRail + bh + s * 0.32;
  const L = clamp(D.cellIdle + D.breath * Math.sin(time * 2.1 + n.phase)
    - D.dip * smooth(clamp(n.dip, 0, 1)) + n.threat * 0.02 * Math.sin(time * 21), 0.06, 1);
  return { s, railR, bh, effGap, rn, x, y, dRail, armX, L,
    agit: n.threat, zapK: clamp(n.dip - 0.75, 0, 0.25) * 4,
    lightK: clamp(-Math.cos(n.angle - LIGHT_A), 0, 1) }; // does the bore face catch the key light?
}
function housingPath(n, s) {
  ctx.beginPath();
  if (n.kind === 'fluid') {
    const r = s * 0.5;
    ctx.moveTo(s * 0.15, -s * 1.35 + r);
    ctx.arcTo(s * 0.15, -s * 1.35, s * 0.15 - r, -s * 1.35, r);
    ctx.lineTo(-s * 1.2 + r, -s * 1.35);
    ctx.arcTo(-s * 1.2, -s * 1.35, -s * 1.2, -s * 1.35 + r, r);
    ctx.lineTo(-s * 1.2, s * 1.35 - r);
    ctx.arcTo(-s * 1.2, s * 1.35, -s * 1.2 + r, s * 1.35, r);
    ctx.lineTo(s * 0.15 - r, s * 1.35);
    ctx.arcTo(s * 0.15, s * 1.35, s * 0.15, s * 1.35 - r, r);
  } else {
    ctx.moveTo(s * 0.15, -s * 1.0);
    ctx.lineTo(-s * 0.3, -s * 1.35); ctx.lineTo(-s * 0.95, -s * 1.35);
    ctx.lineTo(-s * 1.2, -s * 0.95); ctx.lineTo(-s * 1.2, s * 0.95);
    ctx.lineTo(-s * 0.95, s * 1.35); ctx.lineTo(-s * 0.3, s * 1.35);
    ctx.lineTo(s * 0.15, s * 1.0);
  }
  ctx.closePath();
}
function armPath(n, sy, gm) { // guide shoe: a slim bearing block riding over the band
  const { s, armX } = gm;
  const x0 = -s * 0.12, x1 = armX + s * 0.06;
  ctx.beginPath();
  if (n.kind === 'fluid') {                     // rounded tip
    ctx.moveTo(x0, sy * s * 0.70);
    ctx.lineTo(x1 - s * 0.22, sy * s * 0.72);
    ctx.quadraticCurveTo(x1, sy * s * 0.73, x1, sy * s * 0.87);
    ctx.quadraticCurveTo(x1, sy * s * 1.01, x1 - s * 0.22, sy * s * 1.02);
    ctx.lineTo(x0, sy * s * 1.04);
  } else {                                      // chamfered tip
    ctx.moveTo(x0, sy * s * 0.70);
    ctx.lineTo(x1 - s * 0.14, sy * s * 0.72);
    ctx.lineTo(x1, sy * s * 0.78);
    ctx.lineTo(x1, sy * s * 0.96);
    ctx.lineTo(x1 - s * 0.14, sy * s * 1.02);
    ctx.lineTo(x0, sy * s * 1.04);
  }
  ctx.closePath();
}
function storeTip(n, sy, gm) {
  const ty = sy * gm.s * 0.87;
  const wt = { x: gm.x + Math.cos(n.angle) * gm.armX - Math.sin(n.angle) * ty,
               y: gm.y + Math.sin(n.angle) * gm.armX + Math.cos(n.angle) * ty };
  if (sy < 0) n.tipA = wt; else n.tipB = wt;
}
function drawField(n, gm) {
  const { s, armX, agit, zapK } = gm;
  const shim = D.arcMax * (0.35 + agit * 0.65) + zapK;
  if (shim < 0.03) return;
  const dim = STYLE === 'real' ? 0.55 : 1;
  const bulge = armX + s * (0.3 + zapK * 0.3);
  if (n.kind === 'fluid') {
    ctx.strokeStyle = 'rgba(' + n.col + ',' + clamp((0.1 + shim * 0.22) * dim, 0, 0.6).toFixed(3) + ')';
    ctx.lineWidth = s * (0.05 + shim * 0.05);
    ctx.beginPath();
    ctx.moveTo(armX, -s * 0.87);
    for (let k2 = 1; k2 <= 10; k2++) {
      const q = k2 / 10, arch = Math.sin(q * Math.PI);
      ctx.lineTo(armX + arch * (bulge - armX + s * 0.12 * Math.sin(time * 7 + q * 9) * (0.5 + agit)),
        -s * 0.87 + s * 1.74 * q);
    }
    ctx.stroke();
  } else if (Math.random() < 0.35 + shim * 0.6) {
    for (let arc2 = 0; arc2 < 1 + (agit > 0.4 ? 1 : 0); arc2++) {
      ctx.strokeStyle = 'rgba(' + n.col + ',' + clamp((0.14 + shim * 0.4) * dim, 0, 0.9).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, s * 0.05);
      ctx.beginPath();
      ctx.moveTo(armX, -s * 0.87);
      for (let k2 = 1; k2 < 6; k2++) {
        const q = k2 / 6;
        ctx.lineTo(bulge + (Math.random() - 0.5) * s * 0.3, -s * 0.87 + s * 1.74 * q);
      }
      ctx.lineTo(armX, s * 0.87);
      ctx.stroke();
    }
  }
}

function drawNode(n, g) {
  const gm = nodeGeom(n, g);
  if (STYLE === 'real') drawNodeReal(n, gm);
  else drawNodeDigital(n, gm);
}

// ================= REAL: a physical machine =================
function drawNodeReal(n, gm) {
  const { s, x, y, dRail, armX, bh, zapK, L, agit, lightK } = gm;
  const wx0 = -s * 0.92, wx1 = -s * 0.38, wy = s * 1.02;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(n.angle);                    // +x = radially outward, +y = along the rail
  // levitation reads as SHADOW: a wide soft occlusion plus a tight dark line
  // hugging the rail — the Transrapid lesson. Glow is secondary.
  ctx.save();
  ctx.translate(dRail + bh * 0.35, 0); ctx.scale(0.5, 1.7);
  const sh = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
  sh.addColorStop(0, 'rgba(0,0,0,0.42)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(dRail, -s * 0.95); ctx.lineTo(dRail, s * 0.95); ctx.stroke();
  const spec = 0.25 + 0.75 * lightK;
  // yoke plates: solid machined clamps wrapping the band, maglev-bogie style
  const lightLocal = LIGHT_A - n.angle;
  for (const sy of [-1, 1]) {
    ctx.save();                                  // cast shadow onto the band first
    ctx.translate(Math.cos(lightLocal + Math.PI) * 2.5, Math.sin(lightLocal + Math.PI) * 2.5);
    armPath(n, sy, gm);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
    ctx.restore();
    armPath(n, sy, gm);
    const yg = ctx.createLinearGradient(-s * 0.12, 0, armX + s * 0.08, 0);
    yg.addColorStop(0, gun(18 + 40 * spec));
    yg.addColorStop(0.45, gun(14));
    yg.addColorStop(1, gun(8));
    ctx.fillStyle = yg; ctx.fill();
    // flank catch-light on the bore-facing edge
    ctx.strokeStyle = 'rgba(220,235,255,' + (0.04 + 0.14 * spec).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-s * 0.12, sy * s * 0.70); ctx.lineTo(armX - s * 0.2, sy * s * 0.715);
    ctx.stroke();
    ctx.fillStyle = gun(30);                     // one seating rivet on the shoe
    ctx.beginPath(); ctx.arc(dRail * 0.4, sy * s * 0.87, s * 0.035, 0, TAU); ctx.fill();
    // emitter: an inset glowing slot on the shoe's outer face
    const ty = sy * s * 0.87;
    const x1 = armX + s * 0.06;
    ctx.fillStyle = 'rgb(3,5,9)';
    ctx.fillRect(x1 - s * 0.16, ty - s * 0.15, s * 0.11, s * 0.30);
    ctx.fillStyle = 'rgba(' + n.col + ',' + (0.85 + zapK * 0.15).toFixed(2) + ')';
    ctx.fillRect(x1 - s * 0.135, ty - s * 0.12, s * 0.055, s * 0.24);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + zapK * 0.5).toFixed(2) + ')';
    ctx.fillRect(x1 - s * 0.125, ty - s * 0.09, s * 0.03, s * 0.18);
    const og = ctx.createRadialGradient(x1 - s * 0.11, ty, 0, x1 - s * 0.11, ty, s * 0.3 * (1 + zapK));
    og.addColorStop(0, 'rgba(' + n.col + ',' + (0.3 + zapK * 0.4).toFixed(2) + ')');
    og.addColorStop(1, 'rgba(' + n.col + ',0)');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(x1 - s * 0.11, ty, s * 0.3 * (1 + zapK), 0, TAU); ctx.fill();
    storeTip(n, sy, gm);
  }
  drawField(n, gm);
  // repulsor pads: hardware first, light second
  for (const sy of [-1, 1]) {
    const px = s * 0.18, py = sy * s * 0.55;
    ctx.fillStyle = gun(24);
    ctx.beginPath();
    ctx.moveTo(px, py - s * 0.2); ctx.lineTo(px + s * 0.16, py - s * 0.13);
    ctx.lineTo(px + s * 0.16, py + s * 0.13); ctx.lineTo(px, py + s * 0.2);
    ctx.closePath(); ctx.fill();
    const heat = D.repulse * (0.2 + 0.5 * clamp(Math.abs(n.trailV) * 10, 0, 1)) + zapK * 0.5;
    if (heat > 0.03) {
      ctx.save(); ctx.translate((px + s * 0.16 + dRail) / 2, py); ctx.scale(1, 0.45);
      const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.34);
      pg.addColorStop(0, 'rgba(' + n.col + ',' + clamp(heat * 0.55, 0, 0.8).toFixed(3) + ')');
      pg.addColorStop(1, 'rgba(' + n.col + ',0)');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.34, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  // hull: matte near-black; the value story is one narrow specular falling
  // into shadow, with the key light deciding how much it gets
  const hg = ctx.createLinearGradient(-s * 1.2, 0, s * 0.15, 0);
  hg.addColorStop(0,    gun(22));
  hg.addColorStop(0.05, gun(26 + 70 * spec));
  hg.addColorStop(0.13, gun(28));
  hg.addColorStop(0.42, gun(16));
  hg.addColorStop(0.8,  gun(10));
  hg.addColorStop(1,    gun(7));
  housingPath(n, s);
  ctx.fillStyle = hg; ctx.fill();
  // bore bounce rim along the inner edge — cool ambient, always on
  ctx.strokeStyle = 'rgba(120,180,230,' + (0.10 + L * 0.08).toFixed(3) + ')';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-s * 1.19, -s * 0.9); ctx.lineTo(-s * 1.19, s * 0.9); ctx.stroke();
  housingPath(n, s); ctx.save(); ctx.clip();
  const ao = ctx.createLinearGradient(0, -s * 1.35, 0, s * 1.35);
  ao.addColorStop(0, 'rgba(0,0,0,0.34)'); ao.addColorStop(0.22, 'rgba(0,0,0,0)');
  ao.addColorStop(0.78, 'rgba(0,0,0,0)'); ao.addColorStop(1, 'rgba(0,0,0,0.34)');
  ctx.fillStyle = ao; ctx.fillRect(-s * 1.25, -s * 1.4, s * 1.45, s * 2.8);
  if (n.kind === 'tesla') {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.03 * spec).toFixed(3) + ')';
    ctx.beginPath(); ctx.moveTo(s * 0.15, -s * 1.0); ctx.lineTo(-s * 0.3, -s * 1.35);
    ctx.lineTo(-s * 0.3, s * 1.35); ctx.lineTo(s * 0.15, s * 1.0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 1.35); ctx.lineTo(-s * 0.3, s * 1.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.95, -s * 1.35); ctx.lineTo(-s * 0.95, s * 1.35); ctx.stroke();
  } else {
    for (const sy of [-1, 1]) {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-s * 1.18, sy * s * 0.62); ctx.lineTo(s * 0.13, sy * s * 0.62); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.04 * spec).toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(-s * 1.18, sy * s * 0.62 + 1); ctx.lineTo(s * 0.13, sy * s * 0.62 + 1); ctx.stroke();
    }
  }
  // knurled grip band aft of the cell — the lens-barrel texture read
  for (let yy = s * 0.72; yy < s * 1.0; yy += 1.5) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.035 * spec).toFixed(3) + ')'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(-s * 1.1, yy); ctx.lineTo(s * 0.08, yy); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.moveTo(-s * 1.1, yy + 0.7); ctx.lineTo(s * 0.08, yy + 0.7); ctx.stroke();
  }
  // engraved unit marking — etched paint, like a lens index
  ctx.save();
  ctx.translate(s * 0.0, -s * 0.72); ctx.rotate(Math.PI / 2);
  ctx.font = '600 ' + Math.max(4, s * 0.15).toFixed(1) + 'px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(200,214,232,0.34)';
  ctx.fillText(n.tag, 0, 0);
  ctx.restore();
  ctx.restore(); // hull clip
  // the fuel cell: recessed bezel, then the live physics behind glass
  ctx.fillStyle = 'rgb(3,5,9)';
  ctx.beginPath(); ctx.roundRect(wx0 - s * 0.07, -wy - s * 0.07, (wx1 - wx0) + s * 0.14, wy * 2 + s * 0.14, s * 0.12); ctx.fill();
  ctx.strokeStyle = 'rgba(220,235,255,' + (0.04 + 0.1 * lightK).toFixed(3) + ')'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(wx0 - s * 0.07, -wy); ctx.lineTo(wx0 - s * 0.07, wy); ctx.stroke();
  drawCellReal(n, gm, wx0, wx1, wy);
  // the cell lights its own hardware — emissive spill sells the material
  for (const [rr, al] of [[s * 0.8, 0.06 + L * 0.12], [s * 1.6, 0.03 + L * 0.06]]) {
    const spill = ctx.createRadialGradient((wx0 + wx1) / 2, 0, 0, (wx0 + wx1) / 2, 0, rr);
    spill.addColorStop(0, 'rgba(' + n.col + ',' + al.toFixed(3) + ')');
    spill.addColorStop(1, 'rgba(' + n.col + ',0)');
    ctx.fillStyle = spill;
    ctx.beginPath(); ctx.arc((wx0 + wx1) / 2, 0, rr, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(' + n.col + ',0.8)';
  ctx.beginPath(); ctx.arc(s * 0.02, -s * 0.55, s * 0.03, 0, TAU); ctx.fill();
  ctx.restore();
}

// the two energies, drawn from the discharge-tube and Marx-generator photos
function drawCellReal(n, gm, wx0, wx1, wy) {
  const { s, L, agit } = gm;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(wx0, -wy, wx1 - wx0, wy * 2, s * 0.09); ctx.clip();
  ctx.fillStyle = 'rgb(2,4,8)'; ctx.fillRect(wx0, -wy, wx1 - wx0, wy * 2);
  const cxm = (wx0 + wx1) / 2;
  if (n.kind === 'fluid') {
    // a discharge tube: faint gas fill, then soft striated plasma blobs —
    // real plasma has no hard edges, only halation
    ctx.fillStyle = 'rgba(' + n.col + ',' + (0.06 + L * 0.06).toFixed(3) + ')';
    ctx.fillRect(wx0, -wy, wx1 - wx0, wy * 2);
    const hl = L * (wy - s * 0.1);
    // one continuous column of light first — the striations ride ON it
    const colG = ctx.createLinearGradient(0, -hl, 0, hl);
    colG.addColorStop(0, 'rgba(' + n.col + ',0)');
    colG.addColorStop(0.18, 'rgba(' + n.col + ',0.55)');
    colG.addColorStop(0.5, 'rgba(' + n.col + ',0.75)');
    colG.addColorStop(0.82, 'rgba(' + n.col + ',0.55)');
    colG.addColorStop(1, 'rgba(' + n.col + ',0)');
    ctx.fillStyle = colG;
    ctx.fillRect(wx0 + s * 0.06, -hl, wx1 - wx0 - s * 0.12, hl * 2);
    const NB = 6;
    for (let k = 0; k < NB; k++) {
      const q = k / (NB - 1) * 2 - 1;                             // -1..1
      const yy = q * hl * 0.72 + Math.sin(time * (1.6 + agit * 5) + k * 2.1 + n.phase) * s * 0.05 * (1 + agit * 2) * D.waveAmp;
      const rr = s * (0.30 + 0.06 * Math.sin(time * 2.3 + k * 1.7)) * (1 - Math.abs(q) * 0.2);
      for (const [rm, al] of [[rr, 0.6], [rr * 0.5, 0.9]]) {
        const bg = ctx.createRadialGradient(cxm, yy, 0, cxm, yy, rm);
        bg.addColorStop(0, 'rgba(' + n.col + ',' + al.toFixed(2) + ')');
        bg.addColorStop(0.55, 'rgba(' + n.col + ',' + (al * 0.4).toFixed(2) + ')');
        bg.addColorStop(1, 'rgba(' + n.col + ',0)');
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(cxm, yy, rm, 0, TAU); ctx.fill();
      }
      // white-hot kernel in the middle blobs
      if (Math.abs(q) < 0.7) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.65 * (1 - Math.abs(q) * 0.8)).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(cxm, yy, rr * 0.2, 0, TAU); ctx.fill();
      }
    }
    // stray sparks riding the column
    ctx.fillStyle = 'rgba(230,250,255,0.6)';
    for (const b of n.bubbles) {
      if (Math.abs(b.y) * wy > hl) continue;
      ctx.beginPath(); ctx.arc(cxm + b.x * s * 0.14, b.y * wy, b.r * s * 1.6, 0, TAU); ctx.fill();
    }
  } else {
    // a Marx stack: dark metal decks; the charge lives in the gaps between
    const N = Math.round(D.segs);
    const deckH = (wy * 2) / N, gapH = Math.max(1.2, deckH * 0.18);
    const litF = L * N;
    for (let k = 0; k < N; k++) {                 // glowing gaps first
      const yTop = -wy + k * deckH;
      if (k > 0 && k <= litF) {
        const live = k > litF - 1;                // topmost charged gap crackles
        const flick = live ? 0.35 + 0.65 * Math.random() : 1;
        const gg = ctx.createRadialGradient(cxm, yTop, 0, cxm, yTop, s * 0.36);
        gg.addColorStop(0, 'rgba(' + n.col + ',' + (0.85 * flick).toFixed(2) + ')');
        gg.addColorStop(1, 'rgba(' + n.col + ',0)');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(cxm, yTop, s * 0.36, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.95 * flick).toFixed(2) + ')';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(wx0 + 2, yTop); ctx.lineTo(wx1 - 2, yTop); ctx.stroke();
      }
    }
    for (let k = 0; k < N; k++) {                 // then the metal decks over them
      const yTop = -wy + k * deckH;
      const dg = ctx.createLinearGradient(wx0, 0, wx1, 0);
      dg.addColorStop(0, gun(20)); dg.addColorStop(0.35, gun(30)); dg.addColorStop(1, gun(11));
      ctx.fillStyle = dg;
      ctx.fillRect(wx0 + 1, yTop + gapH / 2, wx1 - wx0 - 2, deckH - gapH);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(wx0 + 1, yTop + gapH / 2 + 0.5); ctx.lineTo(wx1 - 1, yTop + gapH / 2 + 0.5); ctx.stroke();
    }
    if (Math.random() < 0.1 + agit * 0.5 && litF > 1) {  // a spark jumps a charged gap
      const k = 1 + Math.floor(Math.random() * Math.min(N - 1, litF));
      const yg = -wy + k * deckH;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(wx0 + 2, yg);
      for (let q = 1; q <= 4; q++) ctx.lineTo(wx0 + (wx1 - wx0) * q / 4, yg + (Math.random() - 0.5) * gapH * 1.6);
      ctx.stroke();
    }
  }
  // the glass: ONE long specular streak down the tube + a faint echo —
  // this line is what makes it read as glass in the reference photo
  ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.lineWidth = Math.max(1, s * 0.035);
  ctx.beginPath(); ctx.moveTo(wx0 + (wx1 - wx0) * 0.3, -wy + 2); ctx.lineTo(wx0 + (wx1 - wx0) * 0.3, wy - 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = Math.max(1, s * 0.06);
  ctx.beginPath(); ctx.moveTo(wx0 + (wx1 - wx0) * 0.72, -wy + 2); ctx.lineTo(wx0 + (wx1 - wx0) * 0.72, wy - 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;    // inner shadow ring
  ctx.strokeRect(wx0 + 1, -wy + 1, wx1 - wx0 - 2, wy * 2 - 2);
  ctx.restore();
  // dark end collars silhouetted against the glow, like tube caps
  ctx.fillStyle = 'rgb(6,9,15)';
  for (const sy of [-1, 1]) {
    ctx.fillRect(wx0 - s * 0.03, sy * wy - (sy > 0 ? s * 0.14 : 0), (wx1 - wx0) + s * 0.06, s * 0.14);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 0.8;
  for (const sy of [-1, 1]) {
    const yc = sy * wy - sy * s * 0.14;
    ctx.beginPath(); ctx.moveTo(wx0 - s * 0.03, yc); ctx.lineTo(wx1 + s * 0.03, yc); ctx.stroke();
  }
}

// ================= DIGITAL: a hologram of the same machine =================
function drawNodeDigital(n, gm) {
  const { s, x, y, dRail, armX, L, zapK } = gm;
  const halo = ctx.createRadialGradient(x, y, 0, x, y, s * 2.2);
  halo.addColorStop(0, 'rgba(' + n.col + ',' + (0.07 + zapK * 0.1).toFixed(3) + ')');
  halo.addColorStop(1, 'rgba(' + n.col + ',0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(x, y, s * 2.2, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(n.angle);
  ctx.lineCap = 'round';
  for (const sy of [-1, 1]) {
    armPath(n, sy, gm);
    ctx.fillStyle = 'rgba(' + n.col + ',0.06)'; ctx.fill();
    armPath(n, sy, gm);
    ctx.strokeStyle = 'rgba(' + n.col + ',0.8)'; ctx.lineWidth = 1.2; ctx.stroke();
    const ty = sy * s * 0.87;
    const x1 = armX + s * 0.06;                  // emitter bar as a holo slot
    ctx.strokeStyle = 'rgba(' + n.col + ',0.8)'; ctx.lineWidth = 1;
    ctx.strokeRect(x1 - s * 0.16, ty - s * 0.15, s * 0.11, s * 0.30);
    ctx.fillStyle = n.bright;
    ctx.fillRect(x1 - s * 0.135, ty - s * 0.11 * (1 + zapK * 0.4), s * 0.06, s * 0.22 * (1 + zapK * 0.4));
    storeTip(n, sy, gm);
  }
  drawField(n, gm);
  for (const sy of [-1, 1]) {
    const py = sy * s * 0.55, px = s * 0.2;
    for (let k = 0; k < 3; k++) {
      const q = (k + (time * 2 % 1)) / 3;
      const fx = px + (dRail - px) * q;
      ctx.strokeStyle = 'rgba(' + n.col + ',' + (D.repulse * 0.9 * (1 - q)).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(fx, py, s * 0.16, -1.1, 1.1); ctx.stroke();
    }
  }
  housingPath(n, s);
  ctx.fillStyle = 'rgba(' + n.col + ',0.05)'; ctx.fill();
  housingPath(n, s); ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(' + n.col + ',0.06)'; ctx.lineWidth = 1;
  for (let yy = -s * 1.35; yy < s * 1.35; yy += 3) {
    ctx.beginPath(); ctx.moveTo(-s * 1.25, yy); ctx.lineTo(s * 0.2, yy); ctx.stroke();
  }
  ctx.restore();
  housingPath(n, s);
  ctx.strokeStyle = 'rgba(' + n.col + ',0.8)'; ctx.lineWidth = 1.2; ctx.stroke();
  if (n.kind === 'tesla') {
    ctx.strokeStyle = 'rgba(' + n.col + ',0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 1.35); ctx.lineTo(-s * 0.3, s * 1.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.95, -s * 1.35); ctx.lineTo(-s * 0.95, s * 1.35); ctx.stroke();
  }
  if (Math.random() < 0.05) {
    ctx.save(); ctx.translate(rand(-1, 1) * s * 0.1, 0);
    housingPath(n, s);
    ctx.strokeStyle = 'rgba(' + n.col + ',0.25)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
  const wx0 = -s * 0.92, wx1 = -s * 0.38, wy = s * 1.02;
  drawCellDigital(n, gm, wx0, wx1, wy);
  ctx.strokeStyle = 'rgba(' + n.col + ',0.7)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(wx0, -wy, wx1 - wx0, wy * 2, s * 0.09); ctx.stroke();
  for (let k = 0; k <= 4; k++) {
    const yy = -wy + wy * 2 * k / 4;
    ctx.beginPath(); ctx.moveTo(wx1 + s * 0.06, yy); ctx.lineTo(wx1 + s * 0.12, yy); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(' + n.col + ',0.9)';
  ctx.beginPath(); ctx.moveTo(wx1 + s * 0.14, -wy + wy * 2 * (1 - L));
  ctx.lineTo(wx1 + s * 0.26, -wy + wy * 2 * (1 - L) - s * 0.06);
  ctx.lineTo(wx1 + s * 0.26, -wy + wy * 2 * (1 - L) + s * 0.06);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawCellDigital(n, gm, wx0, wx1, wy) {
  const { s, L, agit } = gm;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(wx0, -wy, wx1 - wx0, wy * 2, s * 0.09); ctx.clip();
  ctx.fillStyle = 'rgba(8,16,30,0.6)';
  ctx.fillRect(wx0, -wy, wx1 - wx0, wy * 2);
  if (n.kind === 'fluid') {
    const hl = L * (wy - s * 0.06);
    const amp = s * 0.1 * D.waveAmp * (0.6 + agit * 2.2);
    const men = (endY, dir) => {
      for (let k2 = 0; k2 <= 8; k2++) {
        const q = k2 / 8, wx = wx0 + (wx1 - wx0) * q;
        const yy = endY + dir * amp * Math.sin(time * (3 + agit * 6) + q * 5 + n.phase + dir * 2);
        k2 ? ctx.lineTo(wx, yy) : ctx.moveTo(wx, yy);
      }
    };
    ctx.fillStyle = 'rgba(' + n.col + ',0.28)';
    ctx.beginPath(); men(-hl, -1);
    ctx.lineTo(wx1, hl);
    for (let k2 = 8; k2 >= 0; k2--) {
      const q = k2 / 8, wx = wx0 + (wx1 - wx0) * q;
      ctx.lineTo(wx, hl + amp * Math.sin(time * (3 + agit * 6) + q * 5 + n.phase + 2));
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(230,250,255,0.85)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); men(-hl, -1); ctx.stroke();
    ctx.beginPath(); men(hl, 1); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; // oscilloscope trace
    ctx.beginPath();
    for (let k2 = 0; k2 <= 12; k2++) {
      const q = k2 / 12, wx = wx0 + (wx1 - wx0) * q;
      const yy = Math.sin(q * 9 + time * 6) * hl * 0.5;
      k2 ? ctx.lineTo(wx, yy) : ctx.moveTo(wx, yy);
    }
    ctx.stroke();
  } else {
    const N = Math.round(D.segs), gap2 = s * 0.045;
    const segH = (wy * 2 - gap2 * (N - 1)) / N;
    const litF = L * N;
    for (let k2 = 0; k2 < N; k2++) {
      const y0 = -wy + k2 * (segH + gap2);
      const lit = k2 + 1 <= litF ? 1 : k2 < litF ? litF - k2 : 0;
      if (lit <= 0) {
        ctx.strokeStyle = 'rgba(' + n.col + ',0.2)'; ctx.lineWidth = 1;
        ctx.strokeRect(wx0 + 1.5, y0, wx1 - wx0 - 3, segH);
        continue;
      }
      const flick = lit < 1 ? (0.35 + 0.65 * Math.random()) * lit : 1;
      ctx.fillStyle = 'rgba(' + n.col + ',' + (0.55 * flick).toFixed(3) + ')';
      ctx.fillRect(wx0 + 1.5, y0, wx1 - wx0 - 3, segH);
    }
  }
  ctx.restore();
}

// ---- discharges: each lineage speaks its own electricity ----
function drawBolt(b, g) {
  const n = nodes[b.i], k = b.t / D.zapT, fade = 1 - k;
  for (const tip of [n.tipA, n.tipB]) {
    if (n.kind === 'fluid') {
      for (const [lw, al, colr] of [[u * 0.014, 0.22 * fade, n.col], [u * 0.006, 0.55 * fade, n.col], [u * 0.0025, 0.95 * fade, '255,255,255']]) {
        ctx.strokeStyle = 'rgba(' + colr + ',' + al.toFixed(3) + ')';
        ctx.lineWidth = Math.max(1, lw);
        ctx.beginPath();
        ctx.moveTo(tip.x, tip.y);
        const dx = b.tx - tip.x, dy = b.ty - tip.y;
        const nx = -dy, ny = dx;
        for (let q = 1; q <= 12; q++) {
          const t2 = q / 12, wob = Math.sin(t2 * 4.5 + time * 18) * Math.sin(t2 * Math.PI) * 0.025 * fade;
          ctx.lineTo(tip.x + dx * t2 + nx * wob, tip.y + dy * t2 + ny * wob);
        }
        ctx.stroke();
      }
    } else {
      for (const [lw, al, colr] of [[u * 0.009, 0.3 * fade, n.col], [u * 0.0035, 0.95 * fade, '255,255,255']]) {
        ctx.strokeStyle = 'rgba(' + colr + ',' + al.toFixed(3) + ')';
        ctx.lineWidth = Math.max(1, lw);
        ctx.beginPath();
        ctx.moveTo(tip.x, tip.y);
        const dx = b.tx - tip.x, dy = b.ty - tip.y, len = Math.hypot(dx, dy);
        for (let q = 1; q < 7; q++) {
          const t2 = q / 7;
          ctx.lineTo(tip.x + dx * t2 + (Math.random() - 0.5) * len * 0.1 * fade,
                     tip.y + dy * t2 + (Math.random() - 0.5) * len * 0.1 * fade);
        }
        ctx.lineTo(b.tx, b.ty);
        ctx.stroke();
      }
    }
  }
}

// ---- loop ----
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const g = geo();
  if (!paused) step(dt, g);
  draw(g, dt);
  requestAnimationFrame(tick);
}

// ---- panel wiring ----
const slidersEl = document.getElementById('sliders'), outEl = document.getElementById('out');
function readout() {
  const lines = Object.keys(K).map(k => '  ' + k + ': ' + (K[k].step >= 1 ? K[k].v : K[k].v.toFixed(2)) + ',');
  outEl.textContent = 'const RINGFX = { // style: ' + STYLE + '\n' + lines.join('\n') + '\n};';
}
for (const key in K) {
  const k = K[key], row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<label>' + k.lbl + ' <b id="v_' + key + '">' + k.v + '</b></label>' +
    '<input type="range" style="grid-column:1/-1" id="s_' + key + '" min="' + k.min +
    '" max="' + k.max + '" step="' + k.step + '" value="' + k.v + '">';
  slidersEl.appendChild(row);
  row.querySelector('input').addEventListener('input', e => {
    k.v = +e.target.value;
    document.getElementById('v_' + key).textContent = k.v;
    if (k.ring) ringDirty = true;
    readout();
  });
}
readout();
const styleBtn = document.getElementById('bStyle');
function syncStyle() { styleBtn.textContent = 'style: ' + STYLE.toUpperCase() + ' ⇄'; ringDirty = true; readout(); }
styleBtn.onclick = () => { STYLE = STYLE === 'real' ? 'digital' : 'real'; syncStyle(); };
syncStyle();
document.getElementById('bPause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'play' : 'pause'; };
document.getElementById('bZapL').onclick = () => zap(0);
document.getElementById('bZapR').onclick = () => zap(1);
document.getElementById('bCopy').onclick = () => navigator.clipboard.writeText(outEl.textContent);

cv.addEventListener('pointerdown', e => {
  const g = geo(), railR = railRadius(g), s = Math.min(W, H) * 0.038;
  for (let i = 0; i < 2; i++) {
    const n = nodes[i];
    const nx = g.cx + Math.cos(n.angle) * (railR - s), ny = g.cy + Math.sin(n.angle) * (railR - s);
    if (Math.hypot(e.clientX - nx, e.clientY - ny) < s * 2.4) { dragging = i; return; }
  }
  const a = Math.atan2(e.clientY - g.cy, e.clientX - g.cx);
  const near = Math.abs(angDiff(a, nodes[0].angle)) < Math.abs(angDiff(a, nodes[1].angle)) ? 0 : 1;
  spawnDummy(near, a);
});
cv.addEventListener('pointermove', e => {
  if (dragging < 0) return;
  const g = geo();
  nodes[dragging].angle = Math.atan2(e.clientY - g.cy, e.clientX - g.cx);
});
addEventListener('pointerup', () => {
  if (dragging < 0) return;
  const n = nodes[dragging];
  n.baseA = n.angle - 0.3 * Math.sin(time * 0.28 + n.phase);
  dragging = -1;
});

function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; u = Math.min(W, H); ringDirty = true; buildNoise(); LabBG.resize(W, H); }
addEventListener('resize', resize);
resize();
// snapshot mode (?t=2.5&freeze&zap&style=digital): fast-forward, optionally
// fire both nodes and freeze — headless-screenshot bait, same contract as fxlab
if (Q.has('t') || Q.has('zap')) {
  const g = geo();
  for (let t = +Q.get('t') || 0; t > 0; t -= 1 / 60) step(1 / 60, g);
  if (Q.has('zap')) { zap(0); zap(1); }
  paused = Q.has('freeze');
  if (paused) document.getElementById('bPause').textContent = 'play';
}
requestAnimationFrame(tick);
</script>
</body>

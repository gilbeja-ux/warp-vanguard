        const eCol = en.type === 'heavy' ? '#d465ff' : en.lock === 0 ? '#4d9bff'
          : en.lock === 1 ? '#eef6ff' : '#ff8ba0';
        burst(px2, py2, eCol, 26, 5.5);
        burst(px2, py2, `rgb(${wv.col})`, 20, 4);
        burst(px2, py2, '#ffffff', 14, 6.5);
        rimFX.push({ a: en.angle, t: 0.4, col: wv.col });
        wv.kills++;
        score += Math.round(60 * mutMul()); // flat bounty — no combo, no zap credit
      }
    }
    if (wv.z > SPAWN_Z && wv.kills) popup(W / 2, H * 0.4, 'PULSE PURGE ×' + wv.kills, '#8fe0ff');
  }
  pulseWaves = pulseWaves.filter(wv => wv.z <= SPAWN_Z);
  enemies = enemies.filter(e => !e.dead && (e.type === 'strip' || e.z > 0.03)); // strip heads outlive z=0 while the tail crosses
  for (const fx2 of rimFX) fx2.t -= dt;
  rimFX = rimFX.filter(fx2 => fx2.t > 0);
  for (const n of nodes) n.recoil = Math.max(0, (n.recoil || 0) - dt * 4);

  // power-up orbs ride the stream; catching one at the ring arms its effect
  for (const p of pickups) {
    p.z -= L.speed * 0.9 * sdt;
    p.spin += dt * 2;
    if (!p.done && p.z <= g.hitZ) {
      p.done = true;
      if (p.tut && tut && !(covers(nodes[0], p.angle) || covers(nodes[1], p.angle))) {
        tut.retry = 'pickup'; tut.t = 0; // missed the practice relay — again
      }
      if (covers(nodes[0], p.angle) || covers(nodes[1], p.angle)) {
        p.dead = true;
        fx[p.kind] = PICKUPS[p.kind].dur;
        const { x, y } = ringXY(p.angle);
        burst(x, y, '#ffd24a', 24, 4);
        popup(x, y, PICKUPS[p.kind].label, '#ffd24a');
        if (p.kind === 'slow') sfx.slowDown(); else sfx.pick();
        buzz(15);
      }
    }
  }
  pickups = pickups.filter(p => !p.dead && p.z > 0.03);

  // the firewall core duel
  if (boss) {
    updateBossFight(dt, g);
    if (!boss || state !== S.PLAY) return; // victory mid-update
  }

  if (integrity <= 0) { endLevel(false); return; }
  if (!tut && !endless && levelT >= L.duration) {
    if (L.boss) { if (!boss) spawnBoss(); }
    else if (enemies.length === 0) endLevel(true);
  }
}

// ---------- drawing ----------

// the wall lattice: longitudinal seams + depth hoops that stream at EXACTLY
// the traffic speed. leaks sit in its cells and ride its hoops — structural
// proof that they are holes in a surface, not sprites in the bore
const SEAMS = 14, SEAM_OFF = 0.12, HOOP_SPACING = 0.28;
function drawLattice(g) {
  if (state === S.MENU) return;
  ctx.save();
  ctx.lineCap = 'butt';
  const rFar = ring(SPAWN_Z, g).r, rNear = ring(Math.max(0.02, g.hitZ * 0.4), g).r;
  for (let i = 0; i < SEAMS; i++) {
    const a = i / SEAMS * TAU + SEAM_OFF;
    const fx2 = g.cx + Math.cos(a) * rFar, fy2 = g.cy + Math.sin(a) * rFar;
    const nx2 = g.cx + Math.cos(a) * rNear, ny2 = g.cy + Math.sin(a) * rNear;
    const grd = ctx.createLinearGradient(fx2, fy2, nx2, ny2);
    grd.addColorStop(0, 'rgba(90,170,235,0)');
    grd.addColorStop(0.3, 'rgba(90,170,235,0.26)');
    grd.addColorStop(1, 'rgba(90,170,235,0.08)');
    ctx.strokeStyle = grd;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(fx2, fy2); ctx.lineTo(nx2, ny2); ctx.stroke();
  }
  // hoops riding toward the viewer in lockstep with the traffic
  const off = ((wallDist % HOOP_SPACING) + HOOP_SPACING) % HOOP_SPACING;
  for (let z = SPAWN_Z - off; z > g.hitZ * 0.4; z -= HOOP_SPACING) {
    const rr = ring(z, g);
    const a = clamp((SPAWN_Z - 0.05 - z) / 0.4, 0, 1) * 0.26;
    ctx.strokeStyle = `rgba(120,200,255,${a.toFixed(2)})`;
    ctx.lineWidth = Math.max(0.8, rr.r / g.nodeR * 1.5);
    ctx.beginPath(); ctx.arc(g.cx, g.cy, rr.r, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawTunnel(g) {
  // the wall is one dense annulus of data, stamped at receding depths —
  // the inside of a fiber optic line packed with traffic, not clean geometry
  const N = 10;
  for (let i = N - 1; i >= 0; i--) {
    const z = (((i - tunnelScroll) % N) + N) % N / N;
    const rg = ring(z, g);
    const hs = rg.r / 0.75; // texture band mid-radius maps onto this depth's wall radius
    if (hs < 5) continue;
    const a = (1 - z) * 0.85 + 0.08;
    ctx.save();
    ctx.translate(rg.x, rg.y);
    ctx.rotate(i * 0.55); // each depth band has its own FIXED twist — a spinning wall would shear under the leaks
    ctx.globalAlpha = a;
    if (wallTex) ctx.drawImage(wallTex, -hs, -hs, hs * 2, hs * 2);
    ctx.restore();
    // the nearest band keeps sliding past the viewer and fades — no pop at the wrap
    if (z > 0.85 && wallTex) {
      const z2 = z - 1;
      const rg2 = ring(z2, g);
      const hs2 = rg2.r / 0.75;
      const a2 = clamp(1 + z2 / 0.15, 0, 1) * 0.9;
      if (a2 > 0.01) {
        ctx.save();
        ctx.translate(rg2.x, rg2.y);
        ctx.rotate(i * 0.55);
        ctx.globalAlpha = a2;
        ctx.drawImage(wallTex, -hs2, -hs2, hs2 * 2, hs2 * 2);
        ctx.restore();
      }
    }
  }
  ctx.globalAlpha = 1;
  // vanish point glow
  // warm-white vanish point — the golden river converges into it
  const far = ring(1, g);
  const grad = ctx.createRadialGradient(far.x, far.y, 0, far.x, far.y, far.r * 4.5);
  grad.addColorStop(0, 'rgba(255,244,220,0.6)');
  grad.addColorStop(0.35, 'rgba(255,200,110,0.16)');
  grad.addColorStop(0.7, 'rgba(90,160,255,0.07)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(far.x - far.r * 4.5, far.y - far.r * 4.5, far.r * 9, far.r * 9);
}

// streaming gold data particles (the "payload" river at tunnel bottom)
let streaks = [];
function initStreaks() {
  streaks = [];
  const nGold = lowFX ? 90 : 190, nAmbient = lowFX ? 50 : 110;
  for (let i = 0; i < nGold; i++) {
    streaks.push({
      z: Math.random(),
      a: Math.PI / 2 + rand(-0.55, 0.55),          // biased to bottom
      gold: true, sp: rand(0.92, 1.12), ord: i / nGold // draw order — the river thins with integrity
    });
  }
  for (let i = 0; i < nAmbient; i++) {
    streaks.push({ z: Math.random(), a: Math.random() * TAU, gold: false, amber: Math.random() < 0.22, sp: rand(0.88, 1.08) });
  }
}
initStreaks();
function drawStreaks(g, dt) {
  // a wounded payload is a thinner, dimmer river
  const riverK = state === S.PLAY ? 0.35 + 0.65 * clamp(integrity / 100, 0, 1) : 1;
  for (const st of streaks) {
    const wsp = 1 + (warpT / 0.9) * 5; // warp-dive stretch
    st.z -= dt * (state === S.PLAY ? trafficSpeed : 0.4) * st.sp * wsp; // the river flows WITH the traffic
    if (st.z <= -0.08) { st.z = 1; if (st.gold) st.a = Math.PI / 2 + rand(-0.55, 0.55); }
    if (st.gold && st.ord > riverK) continue;
    const r1 = ring(st.z, g), r2 = ring(Math.min(st.z + (st.gold ? 0.05 : 0.09) * (1 + (warpT / 0.9) * 3), 1), g);
    const rr1 = st.gold ? r1.r * rand(0.86, 0.99) : r1.r * 0.97;
    const x1 = r1.x + Math.cos(st.a) * rr1, y1 = r1.y + Math.sin(st.a) * rr1;
    const x2 = r2.x + Math.cos(st.a) * r2.r * 0.95, y2 = r2.y + Math.sin(st.a) * r2.r * 0.95;
    const al = Math.min(1 - st.z, 1.05) * (st.gold ? 0.75 : 0.3) * clamp(1 + st.z / 0.1, 0, 1);
    ctx.strokeStyle = st.gold ? `rgba(255,196,88,${al.toFixed(2)})`
      : st.amber ? `rgba(255,185,90,${al.toFixed(2)})` : `rgba(140,215,255,${al.toFixed(2)})`;
    ctx.lineWidth = st.gold ? lerp(0.5, 2.6, 1 - st.z) : 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // hot core on the nearest gold particles
    if (st.gold && st.z < 0.35) {
      ctx.strokeStyle = `rgba(255,238,190,${(al * 0.7).toFixed(2)})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }
}

// ---------- enemy bodies: GLITCH, painted ON the wall ----------
// decals live in (angle x depth) space and project as annular arcs around the
// tunnel axis, so they foreshorten with the bore — genuinely attached to the
// wall, not billboards hovering in it.
function wallPatch(g, a, halfA, z0, z1, col, alpha) {
  const r0 = ring(Math.max(Math.min(z0, z1), 0.02), g).r; // nearer edge (bigger radius)
  const r1 = ring(Math.max(Math.max(z0, z1), 0.02), g).r;
  const rm = (r0 + r1) / 2;
  if (rm < 3) return;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col;
  ctx.lineCap = 'butt';
  ctx.lineWidth = Math.max(0.7, r0 - r1);
  ctx.beginPath(); ctx.arc(g.cx, g.cy, rm, a - halfA, a + halfA); ctx.stroke();
}
function drawNailBreach(en, g, fade, PAL) {
  const rg = ring(Math.max(en.z, 0.02), g);
  const x = rg.x + Math.cos(en.angle) * rg.r, y = rg.y + Math.sin(en.angle) * rg.r;
  const wallW = clamp(rg.r / g.nodeR, 0.06, 2);
  const mul = en.sizeMul || 1;
  const S = Math.min(W, H) * 0.05 * wallW * mul;      // nail scale, wall-foreshortened
  const seed = en.spin * 13.7;
  const lockKind = en.lock !== undefined, heavy = en.type === 'heavy';
  // into-the-bore direction (toward the axis) and the wall tangent
  const ux = (g.cx - x) / (rg.r || 1), uy = (g.cy - y) / (rg.r || 1);
  const tx2 = -uy, ty2 = ux;
  const tanA = Math.atan2(ty2, tx2);

  // impact cracks in the wall around the puncture (locks are clean punches)
  if (!lockKind && wallW > 0.12) {
    ctx.lineCap = 'round';
    for (let c = 0; c < (heavy ? 4 : 2); c++) {
      const h1 = Math.sin(seed * 7 + c * 5.13);
      const dirA = h1 > 0 ? 1 : -1;
      const flick = 0.5 + 0.4 * Math.sin(time * (4 + c) + seed + c * 2.1);
      ctx.strokeStyle = `rgba(${PAL.glow},${(fade * 0.45 * flick).toFixed(2)})`;
      ctx.lineWidth = Math.max(0.8, wallW * 1.8);
      ctx.beginPath();
      let a = en.angle + dirA * 0.02, z = en.z + Math.sin(seed * 11 + c * 3.7) * 0.02;
      let started = false;
      for (let sN = 0; sN <= 2; sN++) {
        const rr = ring(Math.max(z, 0.02), g).r;
        const px2 = g.cx + Math.cos(a) * rr, py2 = g.cy + Math.sin(a) * rr;
        started ? ctx.lineTo(px2, py2) : ctx.moveTo(px2, py2);
        started = true;
        a += dirA * (0.028 + 0.015 * Math.sin(seed * 3 + c * 7 + sN * 4.2));
        z += 0.016 * Math.sin(seed * 5 + c * 9 + sN * 2.6);
      }
      ctx.stroke();
    }
  }

  // scorched puncture where it punched through
  wallPatch(g, en.angle, 0.030 * mul, en.z - 0.02 * mul, en.z + 0.02 * mul, '#05060f', fade * 0.8);

  // breach ripple: an impact ring expanding across the wall surface —
  // squashed to the wall's local foreshortening so it lies ON the surface
  const rip = (time * 0.8 + seed) % 1;
  ctx.strokeStyle = `rgba(${PAL.glow},${(fade * 0.5 * (1 - rip)).toFixed(2)})`;
  ctx.lineWidth = Math.max(1, S * 0.1);
  ctx.beginPath();
  ctx.ellipse(x, y, S * (0.7 + rip * 1.8), S * (0.7 + rip * 1.8) * 0.36, tanA, 0, TAU);
  ctx.stroke();

  // grounding pass: contact shadow + the tap's light bleeding into the wall —
  // the transition between hardware and surface goes soft and organic
  wallPatch(g, en.angle, 0.06 * mul, en.z - 0.045 * mul, en.z + 0.045 * mul, '#000208', fade * 0.35);
  ctx.globalCompositeOperation = 'lighter';
  wallPatch(g, en.angle, 0.10 * mul, en.z - 0.075 * mul, en.z + 0.075 * mul, `rgba(${PAL.glow},0.5)`, fade * 0.13);
  ctx.globalCompositeOperation = 'source-over';

  // hex port plate — machined tap hardware bolted flush to the wall
  const hexR = S * 0.72;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tanA);
  ctx.scale(1, 0.36); // squash to the wall's local foreshortening
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const ha = i / 6 * TAU + Math.PI / 6;
    i ? ctx.lineTo(Math.cos(ha) * hexR, Math.sin(ha) * hexR) : ctx.moveTo(Math.cos(ha) * hexR, Math.sin(ha) * hexR);
  }
  ctx.closePath();
  const plate = ctx.createLinearGradient(-hexR, 0, hexR, 0);
  plate.addColorStop(0, '#1a2334');
  plate.addColorStop(0.5, '#0a0e1a');
  plate.addColorStop(1, '#141b2b');
  ctx.globalAlpha = fade * 0.88; // a ghost of the wall texture stays visible through the plate
  ctx.fillStyle = plate; ctx.fill();
  ctx.globalAlpha = fade;
  ctx.strokeStyle = `rgba(${PAL.glow},0.9)`;
  ctx.lineWidth = Math.max(1, S * 0.09);
  ctx.stroke();
  // fastener points on alternating corners
  ctx.fillStyle = 'rgba(190,215,240,0.75)';
  for (let i = 0; i < 3; i++) {
    const ha = i / 3 * TAU + Math.PI / 6;
    ctx.beginPath(); ctx.arc(Math.cos(ha) * hexR * 0.72, Math.sin(ha) * hexR * 0.72, Math.max(0.7, S * 0.07), 0, TAU); ctx.fill();
  }
  if (lockKind || heavy) { // outer machined ring on keyed/armored taps
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ha = i / 6 * TAU + Math.PI / 6;
      i ? ctx.lineTo(Math.cos(ha) * hexR * 1.32, Math.sin(ha) * hexR * 1.32) : ctx.moveTo(Math.cos(ha) * hexR * 1.32, Math.sin(ha) * hexR * 1.32);
    }
    ctx.closePath();
    ctx.strokeStyle = PAL.lights[0];
    ctx.lineWidth = Math.max(0.7, S * 0.05);
    ctx.globalAlpha = fade * (0.5 + 0.3 * Math.sin(time * 4 + seed));
    ctx.stroke();
    ctx.globalAlpha = fade;
  }
  ctx.restore();

  // the wall's own hoops run OVER the plate's edges — the hardware sits IN the
  // surface, and the surface keeps going
  ctx.globalAlpha = fade * 0.3;
  ctx.strokeStyle = 'rgba(120,200,255,0.9)';
  ctx.lineWidth = Math.max(0.6, wallW * 1.2);
  for (const dz2 of [-0.028, 0.028]) {
    const rr3 = ring(Math.max(en.z + dz2 * mul, 0.02), g).r;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, rr3, en.angle - 0.045 * mul, en.angle + 0.045 * mul); ctx.stroke();
  }
  ctx.globalAlpha = fade;

  // probe needle: a slim tap driven through toward the payload stream
  const L2 = S * (heavy ? 1.7 : 1.35);
  const nw = S * 0.14;
  const tipX = x + ux * L2, tipY = y + uy * L2;
  ctx.beginPath(); // dark shaft
  ctx.moveTo(x + tx2 * nw, y + ty2 * nw);
  ctx.lineTo(tipX, tipY);
  ctx.lineTo(x - tx2 * nw, y - ty2 * nw);
  ctx.closePath();
  ctx.fillStyle = '#141b2b'; ctx.fill();
  ctx.strokeStyle = 'rgba(170,195,225,0.55)';
  ctx.lineWidth = Math.max(0.6, S * 0.045);
  ctx.stroke();
  // specular edge on one flank
  ctx.strokeStyle = 'rgba(220,238,255,0.65)';
  ctx.lineWidth = Math.max(0.5, S * 0.04);
  ctx.beginPath(); ctx.moveTo(x + tx2 * nw * 0.7, y + ty2 * nw * 0.7); ctx.lineTo(tipX, tipY); ctx.stroke();
  // light guide up the shaft: the siphon, running base-ward (data flowing OUT)
  ctx.strokeStyle = `rgba(${PAL.glow},0.95)`;
  ctx.lineWidth = Math.max(0.8, S * 0.07);
  ctx.setLineDash([S * 0.22, S * 0.16]);
  ctx.lineDashOffset = time * S * 2.2; // flow from tip toward the plate
  ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(x, y); ctx.stroke();
  ctx.setLineDash([]);
  // status LED on the plate — comm blink, unique per tap
  const blink = Math.sin(time * 7 + seed) > (lockKind ? 0.2 : 0.55);
  if (blink) {
    ctx.fillStyle = PAL.lights[0];
    ctx.beginPath(); ctx.arc(x - ux * S * 0.34, y - uy * S * 0.34, Math.max(0.8, S * 0.09), 0, TAU); ctx.fill();
  }
  // tip: a fine hot point, not a bloom
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(tipX, tipY, Math.max(0.7, S * 0.09), 0, TAU); ctx.fill();
  ctx.strokeStyle = `rgba(${PAL.glow},0.55)`;
  ctx.lineWidth = Math.max(0.5, S * 0.05);
  ctx.beginPath(); ctx.arc(tipX, tipY, Math.max(1.2, S * 0.17), 0, TAU); ctx.stroke();

  // breach particles: type-colored sparks spraying off the impact
  if (!lowFX && en.z < 1.6 && Math.random() < 0.3 * fade) {
    particles.push({
      x: x + tx2 * rand(-1, 1) * S * 0.7, y: y + ty2 * rand(-1, 1) * S * 0.7,
      vx: ux * rand(0.3, 1) + tx2 * rand(-0.6, 0.6), vy: uy * rand(0.3, 1) + ty2 * rand(-0.6, 0.6),
      life: 0.35, decay: 2.8, color: `rgb(${PAL.glow})`, size: rand(0.6, 1.2) * Math.max(0.5, wallW)
    });
  }
  // gold payload specks being siphoned into the puncture
  if (!lowFX && en.z < 1.5 && Math.random() < 0.35 * fade) {
    const sa = en.angle + rand(-1, 1) * 0.14;
    const sz = en.z + rand(-0.08, 0.08);
    const rr2 = ring(Math.max(sz, 0.02), g).r;
    const sx = g.cx + Math.cos(sa) * rr2, sy = g.cy + Math.sin(sa) * rr2;
    particles.push({ x: sx, y: sy, vx: (x - sx) * 0.09, vy: (y - sy) * 0.09,
      life: 0.4, decay: 2.6, color: '#ffd24a', size: rand(0.6, 1.3) * wallW * 1.6 });
  }
  ctx.globalAlpha = fade;
}
// the data stream ribbon: a luminous curved band on the wall. the hot marker is
// where it crosses the ring — that point must stay covered head to tail
function drawStrip(en, g, fade) {
  const segs = 16;
  const dim = en.failed ? 0.28 : 1;
  // while a node rides the ribbon it takes that node's color — live feedback
  const gN = en.failed ? 0 : (en.traceGlow || 0) * 0.85;
  const nc = en.traceNode === 1 ? [255, 255, 255] : [111, 227, 255];
  const mix = (r0, g0, b0) =>
    `rgba(${Math.round(lerp(r0, nc[0], gN))},${Math.round(lerp(g0, nc[1], gN))},${Math.round(lerp(b0, nc[2], gN))},1)`;
  const cBase = mix(255, 60, 90), cHi = mix(255, 170, 188);
  for (let s2 = 0; s2 < segs; s2++) {
    const k0 = s2 / segs * en.len, k1 = (s2 + 1) / segs * en.len;
    const z0 = en.z + k0, z1 = en.z + k1;
    if (z1 <= g.hitZ * 0.55 || z0 >= SPAWN_Z - 0.03) continue;
    const aMid = stripAngle(en, (k0 + k1) / 2);
    const flow = 0.5 + 0.4 * Math.sin(time * 9 - s2 * 0.9);
    wallPatch(g, aMid, 0.055, z0, z1 + 0.005, cBase, fade * 0.7 * dim);
    wallPatch(g, aMid, 0.021, z0, z1 + 0.005, cHi, fade * flow * dim);
  }
  // trace marker at the ring crossing
  if (!en.failed && en.z <= g.hitZ && en.z + en.len >= g.hitZ) {
    const aReq = stripAngle(en, g.hitZ - en.z);
    const px2 = g.cx + Math.cos(aReq) * g.nodeR, py2 = g.cy + Math.sin(aReq) * g.nodeR;
    const mr = Math.min(W, H) * 0.032;
    ctx.globalAlpha = 1;
    const tg = ctx.createRadialGradient(px2, py2, 0, px2, py2, mr);
    tg.addColorStop(0, en.tracing ? 'rgba(255,255,255,0.95)' : 'rgba(255,130,150,0.85)');
    tg.addColorStop(1, 'rgba(255,60,90,0)');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(px2, py2, mr, 0, TAU); ctx.fill();
    ctx.strokeStyle = en.tracing ? 'rgba(255,255,255,0.9)' : 'rgba(255,120,140,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px2, py2, mr * 0.45 * (1 + Math.sin(time * 8) * 0.15), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = fade;
}

function drawEnemy(en, g) {
  const rg = ring(Math.max(en.z, 0.02), g);
  const x = rg.x + Math.cos(en.angle) * rg.r;
  const y = rg.y + Math.sin(en.angle) * rg.r;
  // size tracks the WALL geometry (rg.r/nodeR), not raw z — bodies scale in
  // lockstep with the ring they sit on, so they read as glued to the tunnel
  let size = Math.min(W, H) * 0.06 * clamp(rg.r / g.nodeR, 0.1, 2) * (en.sizeMul || 1);
  const near = 1 - en.z;
  // missed traps balloon past the ring and dissolve; fresh ones fade in from the deep
  let fade = en.resolved ? clamp(en.z / g.hitZ, 0, 1) : 1;
  fade *= clamp((SPAWN_Z - 0.05 - en.z) / 0.3, 0, 1); // smooth entrance at the horizon
  if (fade <= 0.005) return;
  if (en.resolved) size *= 1 + (1 - clamp(en.z / g.hitZ, 0, 1)) * 1.6;
  // per-type palettes — the color IS the gameplay language: red = any node,
  // blue/white = matching node, purple = both nodes, orange = it moves
  const PAL = en.type === 'frag'
    ? { glow: '90,110,140',
        shades: ['#2b3242', '#151a26', '#3a4354', '#0d1119', '#232a38'],
        lights: ['#4a5568', '#5a6a80', '#3a4354'] }
    : en.type === 'heavy'
    ? { glow: '200,70,255',
        shades: ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8', '#c44af0'],
        lights: ['#eab8ff', '#f3d4ff', '#d98cff'] }
    : en.lock === 0
    ? { glow: '80,170,255',
        shades: ['#2f7fe0', '#1c4fae', '#4d9bff', '#12398a', '#3f8af0'],
        lights: ['#a8ccff', '#d0e4ff', '#7db2ff'] }
    : en.lock === 1
    ? { glow: '225,240,255',
        shades: ['#c8d6e6', '#9fb2c8', '#e8f2fc', '#8194ab', '#d5e2f0'],
        lights: ['#ffffff', '#eef6ff', '#dbe8f6'] }
    : { glow: '255,60,90',
        shades: ['#e8274b', '#ff5a3c', '#d81f6e', '#b3123a', '#ff8c5a'],
        lights: ['#ff9db0', '#ffc9d4', '#ff8ba0'] };

  ctx.save();
  ctx.globalAlpha = fade;

  if (en.type === 'strip') { // ribbons draw themselves entirely on the wall
    drawStrip(en, g, fade);
    ctx.restore();
    return;
  }

  const spr = SPRITES[en.lock === 0 ? 'lock0' : en.lock === 1 ? 'lock1' : en.type];

  // hot glow at the wall point — except payload packets, which swallow light
  const pulse = 1 + Math.sin(en.spin * 2) * 0.08;
  const gl = ctx.createRadialGradient(x, y, 0, x, y, size * 2.4 * pulse);
  if (en.type === 'frag') {
    gl.addColorStop(0, 'rgba(1,2,8,0.75)');
    gl.addColorStop(0.55, 'rgba(2,4,12,0.35)');
    gl.addColorStop(1, 'rgba(4,6,16,0)');
  } else {
    gl.addColorStop(0, `rgba(${PAL.glow},0.5)`);
    gl.addColorStop(0.5, `rgba(${PAL.glow},0.16)`);
    gl.addColorStop(1, `rgba(${PAL.glow},0)`);
  }
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, y, size * 2.4 * pulse, 0, TAU); ctx.fill();

  if (spr) {
    // sprite skin replaces the procedural body (glow + sigils stay live)
    ctx.drawImage(spr, x - size * 1.7, y - size * 1.7, size * 3.4, size * 3.4);
  } else if (en.type === 'frag') {
    // payload packet: a void-black rounded diamond FLOATING in the bore — the
    // payload rides the stream; only corruption clings to the walls
    ctx.save();
    ctx.translate(x, y);
    const pr = size * (1 + Math.sin(en.spin * 2) * 0.06);
    ctx.rotate(en.spin * 0.3);
    const diamond = r => {
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(r * 0.55, -r * 0.55, r, 0);
      ctx.quadraticCurveTo(r * 0.55, r * 0.55, 0, r);
      ctx.quadraticCurveTo(-r * 0.55, r * 0.55, -r, 0);
      ctx.quadraticCurveTo(-r * 0.55, -r * 0.55, 0, -r);
      ctx.closePath();
    };
    // near-featureless black core, the faintest nebular sheen deep inside
    diamond(pr);
    const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, pr);
    fg.addColorStop(0, '#0a0c1a');
    fg.addColorStop(0.55, '#04050d');
    fg.addColorStop(1, '#010104');
    ctx.fillStyle = fg; ctx.fill();
    ctx.fillStyle = 'rgba(90,70,160,0.12)';
    ctx.beginPath(); ctx.ellipse(-pr * 0.25, -pr * 0.2, pr * 0.5, pr * 0.35, 0.6, 0, TAU); ctx.fill();
    // event-horizon rim: dim inner band under a hairline pale edge
    diamond(pr * 0.94);
    ctx.strokeStyle = 'rgba(70,85,120,0.5)'; ctx.lineWidth = Math.max(1.5, pr * 0.12); ctx.stroke();
    diamond(pr);
    ctx.strokeStyle = 'rgba(185,200,230,0.8)'; ctx.lineWidth = Math.max(0.8, pr * 0.045); ctx.stroke();
    // a slow glint crawling the rim — light caught on the edge
    const ga = en.spin * 0.9;
    const gr = pr * (1 - 0.22 * Math.pow(Math.sin(2 * ga), 2));
    const gx = Math.cos(ga) * gr, gy = Math.sin(ga) * gr;
    const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, pr * 0.3);
    gg.addColorStop(0, 'rgba(220,235,255,0.7)');
    gg.addColorStop(1, 'rgba(220,235,255,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(gx, gy, pr * 0.3, 0, TAU); ctx.fill();
    ctx.restore();
  } else {
    drawNailBreach(en, g, fade, PAL);
  }
  // warp-in flash as it drops out of the deep
  if (en.age < 0.3) {
    const wa = 1 - en.age / 0.3;
    ctx.strokeStyle = 'rgba(255,255,255,' + (wa * 0.8).toFixed(2) + ')';
    ctx.lineWidth = Math.max(1, size * 0.15 * wa);
    ctx.beginPath(); ctx.arc(x, y, size * (1.2 + (1 - wa) * 1.6), 0, TAU); ctx.stroke();
  }
  // heavy: dual-lock sigil — orbiting dots in the two node colors, telegraphing "both nodes"
  if (en.type === 'heavy' && near > 0.15) {
    const sa = clamp((near - 0.15) / 0.3, 0, 1) * fade;
    const oa = en.spin * 1.4, or2 = size * 1.08;
    ctx.globalAlpha = sa * 0.55;
    ctx.strokeStyle = 'rgba(230,245,255,0.9)'; ctx.lineWidth = Math.max(0.8, size * 0.05);
    ctx.beginPath(); ctx.arc(x, y, or2, 0, TAU); ctx.stroke();
    ctx.globalAlpha = sa;
    const ds = Math.max(1.5, size * 0.13);
    ctx.fillStyle = 'rgb(111,227,255)';
    ctx.beginPath(); ctx.arc(x + Math.cos(oa) * or2, y + Math.sin(oa) * or2, ds, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x + Math.cos(oa + Math.PI) * or2, y + Math.sin(oa + Math.PI) * or2, ds, 0, TAU); ctx.fill();
    ctx.globalAlpha = fade;
  }
  // color lock sigil — a single orbiting dot in the required node's color
  if (en.lock !== undefined && near > 0.15) {
    const sa = clamp((near - 0.15) / 0.3, 0, 1) * fade;
    const col = en.lock === 0 ? 'rgb(111,227,255)' : '#ffffff';
    ctx.globalAlpha = sa * 0.55;
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(0.8, size * 0.055);
    ctx.beginPath(); ctx.arc(x, y, size * 1.05, 0, TAU); ctx.stroke();
    ctx.globalAlpha = sa;
    const oa2 = en.spin * 1.4, ds2 = Math.max(1.5, size * 0.13);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x + Math.cos(oa2) * size * 1.05, y + Math.sin(oa2) * size * 1.05, ds2, 0, TAU); ctx.fill();
    ctx.globalAlpha = fade;
  }
  ctx.restore();
}

// arrival pings: a pulse on the rim where something is about to land
function drawArrivalPings(g) {
  if (state === S.MENU) return;
  const pr = g.nodeR + Math.min(W, H) * 0.055 * 0.9;
  const mark = (a, col, z) => {
    if (z <= g.hitZ) return;
    const p2 = clamp(1 - (z - g.hitZ) / 0.28, 0, 1);
    if (p2 <= 0) return;
    const al = p2 * (0.35 + 0.4 * (Math.sin(time * (6 + p2 * 10)) * 0.5 + 0.5));
    ctx.strokeStyle = 'rgba(' + col + ',' + al.toFixed(2) + ')';
    ctx.lineWidth = 3 + p2 * 2;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(g.cx, g.cy, pr, a - 0.09, a + 0.09); ctx.stroke();
  };
  for (const en of enemies) {
    if (en.dead || en.resolved) continue;
    const col = en.type === 'frag' ? '140,150,170'
      : en.type === 'heavy' ? '200,70,255'
      : en.lock === 0 ? '80,170,255'
      : en.lock === 1 ? '240,248,255'
      : '255,60,90';
    mark(en.angle, col, en.z);
  }
  for (const p of pickups) if (!p.done) mark(p.angle, '255,210,74', p.z);
}

// lightning arcs from node carriages to zapped traps — jagged, fast fade
function drawBolts() {
  for (const b of bolts) {
    const a = clamp(b.life / b.max, 0, 1);
    const dx = b.x2 - b.x1, dy = b.y2 - b.y1;
    const dl = Math.hypot(dx, dy) || 1;
    const nx = -dy / dl, ny = dx / dl;
    ctx.lineCap = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? 'rgba(140,215,255,' + (a * 0.85).toFixed(2) + ')' : 'rgba(255,255,255,' + a.toFixed(2) + ')';
      ctx.lineWidth = pass === 0 ? 4 : 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      const segs = 7;
      for (let i = 1; i < segs; i++) {
        const t = i / segs;
        const off = (Math.random() - 0.5) * 16 * a;
        ctx.lineTo(b.x1 + dx * t + nx * off, b.y1 + dy * t + ny * off);
      }
      ctx.lineTo(b.x2, b.y2);
      ctx.stroke();
    }
  }
}

// golden power-up orb with a kind-specific icon
function drawPickup(p, g) {
  const rg = ring(Math.max(p.z, 0.02), g);
  const x = rg.x + Math.cos(p.angle) * rg.r, y = rg.y + Math.sin(p.angle) * rg.r;
  const size = Math.min(W, H) * 0.042 * clamp(rg.r / g.nodeR, 0.12, 1.6);
  let fade = clamp((SPAWN_Z - 0.05 - p.z) / 0.3, 0, 1);
  if (p.done) fade *= clamp(p.z / g.hitZ, 0, 1);
  if (fade <= 0.005) return;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(x, y);
  const pulse = 1 + Math.sin(time * 5 + p.spin) * 0.1;
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2.6 * pulse);
  gl.addColorStop(0, 'rgba(255,210,74,0.55)');
  gl.addColorStop(1, 'rgba(255,210,74,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 0, size * 2.6 * pulse, 0, TAU); ctx.fill();
  ctx.rotate(p.spin * 0.6);
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a2 = i / 6 * TAU;
    i ? ctx.lineTo(Math.cos(a2) * size, Math.sin(a2) * size) : ctx.moveTo(Math.cos(a2) * size, Math.sin(a2) * size);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(60,40,5,0.85)'; ctx.fill();
  ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = Math.max(1, size * 0.14); ctx.stroke();
  ctx.rotate(-p.spin * 0.6);
  ctx.strokeStyle = '#ffe9b0'; ctx.fillStyle = '#ffe9b0';
  ctx.lineWidth = Math.max(1, size * 0.12); ctx.lineCap = 'round';
  const s2 = size * 0.52;
  if (p.kind === 'slow') { // hourglass
    ctx.beginPath();
    ctx.moveTo(-s2 * 0.7, -s2); ctx.lineTo(s2 * 0.7, -s2); ctx.lineTo(-s2 * 0.7, s2); ctx.lineTo(s2 * 0.7, s2);
    ctx.closePath(); ctx.stroke();
  } else if (p.kind === 'wide') { // widening arcs
    ctx.beginPath(); ctx.arc(0, 0, s2 * 0.55, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s2 * 1.05, -0.7, 0.7); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s2 * 0.55, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s2 * 1.05, Math.PI - 0.7, Math.PI + 0.7); ctx.stroke();
  } else { // lightning bolt
    ctx.beginPath();
    ctx.moveTo(s2 * 0.3, -s2); ctx.lineTo(-s2 * 0.45, s2 * 0.15); ctx.lineTo(0, s2 * 0.15);
    ctx.lineTo(-s2 * 0.3, s2); ctx.lineTo(s2 * 0.45, -0.15 * s2); ctx.lineTo(0, -0.15 * s2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// energy wall strung between the two ends of a barrier pair — drawn under the traps
function drawLineBeam(en, g) {
  const p = en.partner;
  if (!p || (en.dead && p.dead)) return;
  const rg = ring(Math.max(en.z, 0.02), g);
  let fade = en.resolved ? clamp(en.z / g.hitZ, 0, 1) : 1;
  fade *= clamp((SPAWN_Z - 0.05 - en.z) / 0.3, 0, 1);
  if (fade <= 0.005) return;
  // a live crack RUNNING ALONG THE WALL between the two ruptures — take the
  // short way around, marching dashes sell the energy
  const d = angDiff(p.angle, en.angle);
  const lw = Math.max(1.5, clamp(rg.r / g.nodeR, 0.08, 2) * 6);
  ctx.save();
  ctx.lineCap = 'round';
  ctx.globalAlpha = fade * 0.5;
  ctx.strokeStyle = 'rgba(255,60,90,0.75)';
  ctx.lineWidth = lw * 2.2;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, rg.r, en.angle, en.angle + d, d < 0); ctx.stroke();
  ctx.globalAlpha = fade * 0.9;
  ctx.strokeStyle = 'rgba(255,180,195,0.95)';
  ctx.lineWidth = Math.max(1, lw * 0.55);
  ctx.setLineDash([lw * 2.2, lw * 1.4]);
  ctx.lineDashOffset = -time * 90 * Math.sign(d || 1);
  ctx.beginPath(); ctx.arc(g.cx, g.cy, rg.r, en.angle, en.angle + d, d < 0); ctx.stroke();
  ctx.setLineDash([]);
  // stray sparks arcing off the fissure
  if (!lowFX && Math.random() < 0.3 * fade) {
    const sa = en.angle + d * Math.random();
    burst(g.cx + Math.cos(sa) * rg.r, g.cy + Math.sin(sa) * rg.r, '#ff8ba0', 1, 1.4);
  }
  ctx.restore();
}

// the firewall core — flying deep in the tunnel, plus its bullet-hell return fire
function drawBoss(g) {
  const b = boss;
  // orbs first: race from the core's depth out to the ring, growing with perspective
  const railR = g.nodeR - Math.min(W, H) * 0.055 * 0.86;
  for (const sh of b.shots) {
    const k = clamp(sh.t / sh.dur, 0, 1);
    const z = lerp(sh.zb, g.hitZ, k);
    const rg = ring(z, g);
    const tu = Math.cos(sh.th) * (railR / g.nodeR), tv = Math.sin(sh.th) * (railR / g.nodeR);
    const x = rg.x + lerp(sh.u0, tu, k) * rg.r;
    const y = rg.y + lerp(sh.v0, tv, k) * rg.r;
    const os = Math.min(W, H) * 0.055 * rg.s;
    const og = ctx.createRadialGradient(x, y, 0, x, y, os * 2);
    og.addColorStop(0, 'rgba(255,220,255,0.9)');
    og.addColorStop(0.4, 'rgba(212,101,255,0.55)');
    og.addColorStop(1, 'rgba(212,101,255,0)');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(x, y, os * 2, 0, TAU); ctx.fill();
    // glitch shard: chromatic-split square, not an orb
    const qs = Math.max(1.5, os * 0.5);
    ctx.fillStyle = 'rgba(212,101,255,0.55)';
    ctx.fillRect(x - qs - qs * 0.5, y - qs, qs * 2, qs * 2);
    ctx.fillRect(x - qs + qs * 0.5, y - qs, qs * 2, qs * 2);
    ctx.fillStyle = '#f3d4ff';
    ctx.fillRect(x - qs, y - qs, qs * 2, qs * 2);
  }
  // the CORE: the mother-corruption — a dense mosaic in the shared glitch
  // language (screen-aligned, like every enemy), tearing harder as it dies
  const size = b.sSize * (1 + Math.sin(b.spin * 1.6) * 0.04);
  ctx.save();
  ctx.globalAlpha = 0.72 + 0.28 * (1 - clamp(b.z, 0, 1)); // deeper = hazier
  ctx.translate(b.sx, b.sy);
  const haze = ctx.globalAlpha;
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2.6);
  gl.addColorStop(0, 'rgba(210,80,255,0.5)');
  gl.addColorStop(0.5, 'rgba(255,60,90,0.16)');
  gl.addColorStop(1, 'rgba(255,60,90,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 0, size * 2.6, 0, TAU); ctx.fill();
  const flash = b.hurtT > 0 ? b.hurtT / 0.15 : 0;
  const dmg = 1 - clamp(b.hp / b.maxHp, 0, 1);
  const seed = b.spin * 3.3;
  const tear = Math.sin(time * 2.3 + seed) > 0.9 - dmg * 0.5 ? 1 : 0;
  const split = size * (0.06 + tear * 0.12 + dmg * 0.05);
  const ext = size * 1.15; // mosaic half-extent
  // chromatic ghosts of the whole mass first
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(200,70,255,0.35)';
  ctx.fillRect(-ext - split, -ext, ext * 2, ext * 2);
  ctx.fillRect(-ext + split, -ext, ext * 2, ext * 2);
  ctx.globalCompositeOperation = 'source-over';
  // 4×4 corrupted cells — rows shear on tears, each cell flickers on its own
  const SH = ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8', '#c44af0'];
  const cs = ext * 2 / 4;
  for (let r = 0; r < 4; r++) {
    const rowJ = Math.sin(time * 9 + seed + r * 2.6) * size * (0.04 + tear * 0.18 + dmg * 0.08);
    for (let c = 0; c < 4; c++) {
      const fl = 0.55 + 0.45 * Math.sin(time * 7 + seed + r * 2.7 + c * 1.3);
      const inner = (r === 1 || r === 2) && (c === 1 || c === 2); // hot heart cells
      ctx.fillStyle = flash > 0.3 ? '#ffffff' : inner ? (fl > 0.8 ? '#f3d4ff' : '#d465ff') : SH[(r * 4 + c) % SH.length];
      ctx.globalAlpha = haze * (inner ? 0.95 : 0.45 + 0.5 * fl);
      ctx.fillRect(-ext + c * cs + cs * 0.04 + rowJ, -ext + r * cs + cs * 0.04, cs * 0.92, cs * 0.92);
    }
  }
  ctx.globalAlpha = haze;
  // white arc-sliver crossing the mass — the corruption arcing
  ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.55 * (Math.sin(time * 15 + seed) * 0.5 + 0.5) + flash * 0.15).toFixed(2) + ')';
  ctx.fillRect(Math.sin(time * 11 + seed) * size * 0.3 - size, (Math.sin(time * 3.7 + seed) * 0.7) * size, size * 2, size * 0.1);
  ctx.restore();
}
// the fused ray cannon: aim barrel + a straight perspective-tapered beam
function drawBeam(g) {
  const b = boss;
  if (!b || b.mergeT < 1) return;
  const seg = beamGeometry(g);
  const size = Math.min(W, H) * 0.038;
  const heatCol = heat < 0.5 ? '140,225,255' : heat < 0.8 ? '255,190,90' : '255,90,70';
  const bAng = Math.atan2(seg.ty - seg.sy, seg.tx - seg.sx);
  // barrel tracks the ray
  ctx.save();
  ctx.translate(seg.sx, seg.sy);
  ctx.rotate(bAng);
  ctx.fillStyle = '#0d1626';
  roundRect(0, -size * 0.24, size * 1.5, size * 0.48, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(' + heatCol + ',0.9)'; ctx.lineWidth = 1.5;
  roundRect(0, -size * 0.24, size * 1.5, size * 0.48, 4); ctx.stroke();
  ctx.fillStyle = 'rgba(' + heatCol + ',' + (0.35 + heat * 0.6).toFixed(2) + ')';
  ctx.fillRect(size * 0.25, -size * 0.12, size * 1.1 * heat, size * 0.24); // heat window
  ctx.restore();
  if (!beamActive) return;
  // endpoint: the core when the ray connects, else the wall/deep exit
  const hit = beamHitCore(g);
  const dx = seg.tx - seg.sx, dy = seg.ty - seg.sy;
  const len = Math.hypot(dx, dy) || 1;
  let ex, ey, endScale;
  if (hit) {
    ex = seg.sx + dx / len * hit.t;
    ey = seg.sy + dy / len * hit.t;
    endScale = Math.max(0.15, ring(b.z, g).s / ring(g.hitZ, g).s);
  } else {
    ex = seg.tx; ey = seg.ty;
    endScale = Math.max(0.12, seg.endS);
  }
  const bx0 = seg.sx + Math.cos(bAng) * size * 1.4, by0 = seg.sy + Math.sin(bAng) * size * 1.4;
  const wob = Math.sin(time * 40) * 1.5;
  ctx.lineCap = 'round';
  const SEGS = 10;
  for (const [wBase, col] of [[13 + wob, 'rgba(' + heatCol + ',0.30)'], [6, 'rgba(' + heatCol + ',0.7)'], [2.2, 'rgba(255,255,255,0.95)']]) {
    ctx.strokeStyle = col;
    for (let i = 1; i <= SEGS; i++) {
      const t0 = (i - 1) / SEGS, t1 = i / SEGS;
      ctx.lineWidth = Math.max(0.4, wBase * lerp(1, endScale, (t0 + t1) / 2));
      ctx.beginPath();
      ctx.moveTo(lerp(bx0, ex, t0), lerp(by0, ey, t0));
      ctx.lineTo(lerp(bx0, ex, t1), lerp(by0, ey, t1));
      ctx.stroke();
    }
  }
  if (hit) { // impact bloom on the core
    const ig = ctx.createRadialGradient(b.sx, b.sy, 0, b.sx, b.sy, b.sSize * 1.5);
    ig.addColorStop(0, 'rgba(255,255,255,0.85)');
    ig.addColorStop(0.4, 'rgba(' + heatCol + ',0.5)');
    ig.addColorStop(1, 'rgba(' + heatCol + ',0)');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(b.sx, b.sy, b.sSize * 1.5, 0, TAU); ctx.fill();
  } else if (seg.zExit < 0.99) { // scorch spark where the ray rakes the tunnel wall
    ctx.fillStyle = 'rgba(' + heatCol + ',0.7)';
    ctx.beginPath(); ctx.arc(ex, ey, Math.max(2, 9 * endScale), 0, TAU); ctx.fill();
    if (Math.random() < 0.4) burst(ex, ey, '#ffd9a0', 1, 2);
  }
}

function drawNodes(g) {
  const bzn = Math.min(W, H) * 0.055;
  const railR = g.nodeR - bzn * 0.86;             // carriages ride the rails on the ring's inner face
  const nearR = { x: g.cx, y: g.cy, r: railR };
  const fused = boss && boss.mergeT >= 1;
  for (let i = 0; i < 2; i++) {
    if (fused && i === 1) continue; // one combined cannon carriage
    const n = nodes[i];
    const size = Math.min(W, H) * 0.038 * (fused ? 1.35 : 1);
    const rr2 = nearR.r - (n.recoil || 0) * size * 0.55; // zap recoil kicks the sled inward
    const x = nearR.x + Math.cos(n.angle) * rr2;
    const y = nearR.y + Math.sin(n.angle) * rr2;
    const cCol = fused ? '160,240,255' : i === 0 ? '111,227,255' : '255,255,255';
    // intro: each carriage materializes when the forming ring reaches it
    if (state === S.PLAY || state === S.PAUSE) {
      const p2 = clamp(introT / 2.0, 0, 1);
      const sw2 = (1 - Math.pow(1 - p2, 3)) * Math.PI;
      if (sw2 < Math.PI - 0.001 && Math.abs(angDiff(n.angle, -Math.PI / 2)) > sw2) {
        n.formAt = introT; n.prevA = n.angle;
        continue;
      }
      if (!n.formedFx && introT < INTRO_DUR + 1) {
        n.formedFx = true;
        burst(x, y, i === 0 ? '#6fe3ff' : '#ffffff', 16, 4);
      }
    }
    const formAge = introT - (n.formAt || 0);
    const eb = t2 => 1 + 2.70158 * Math.pow(t2 - 1, 3) + 1.70158 * Math.pow(t2 - 1, 2); // easeOutBack
    const fscale = formAge < 0.35 ? Math.max(0.01, eb(clamp(formAge / 0.35, 0, 1))) : 1;
    // lightcycle ribbon trail
    const vel = angDiff(n.angle, n.prevA === undefined ? n.angle : n.prevA);
    n.trailV = (n.trailV || 0) * 0.8 + vel * 0.2;
    n.prevA = n.angle;
    const tl = clamp(Math.abs(n.trailV) * 10, 0, 1.5);
    if (tl > 0.04) {
      const dir = Math.sign(n.trailV) || 1;
      ctx.lineCap = 'round';
      ctx.strokeStyle = `rgba(${cCol},0.3)`;
      ctx.lineWidth = size * 1.5;
      ctx.beginPath();
      ctx.arc(nearR.x, nearR.y, nearR.r, n.angle - dir * tl, n.angle, dir < 0);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(240,252,255,0.55)';
      ctx.lineWidth = size * 0.4;
      ctx.beginPath();
      ctx.arc(nearR.x, nearR.y, nearR.r, n.angle - dir * tl, n.angle, dir < 0);
      ctx.stroke();
    }
    // thruster sparks shed off a fast-sliding sled
    if (state === S.PLAY && Math.abs(n.trailV || 0) > 0.06 && Math.random() < 0.6) {
      const back = n.angle - Math.sign(n.trailV || 1) * 0.12;
      particles.push({
        x: nearR.x + Math.cos(back) * nearR.r, y: nearR.y + Math.sin(back) * nearR.r,
        vx: rand(-0.5, 0.5), vy: rand(-0.5, 0.5), life: 0.5, decay: 2.5,
        color: i === 0 ? '#6fe3ff' : '#ffffff', size: rand(1, 2.2)
      });
    }
    // coverage arc hint — drawn on the ring itself; grows/shrinks with wide-arc
    if (!fused) {
    const cov = 0.314 * tolVis;
    const wideGlow = clamp((tolVis - 1) / 0.7, 0, 1);
    ctx.beginPath();
    ctx.arc(nearR.x, nearR.y, g.nodeR, n.angle - cov, n.angle + cov);
    ctx.strokeStyle = `rgba(${cCol},${(0.5 + wideGlow * 0.3).toFixed(2)})`;
    ctx.lineWidth = 4 + wideGlow * 2.5; ctx.lineCap = 'round'; ctx.stroke();
    if (wideGlow > 0.02) { // golden shimmer while the arc is overcharged
      ctx.beginPath();
      ctx.arc(nearR.x, nearR.y, g.nodeR + 5, n.angle - cov, n.angle + cov);
      ctx.strokeStyle = `rgba(255,210,74,${(wideGlow * (0.35 + Math.sin(time * 6) * 0.15)).toFixed(2)})`;
      ctx.lineWidth = 2; ctx.stroke();
    }
    }
    // glow
    const gl = ctx.createRadialGradient(x, y, 0, x, y, size * 2.6);
    gl.addColorStop(0, `rgba(${cCol},0.6)`);
    gl.addColorStop(1, `rgba(${cCol},0)`);
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(x, y, size * 2.6, 0, TAU); ctx.fill();
    // aperture lens — pure focused signal, no hull: the clean counterpoint to
    // the torn glitch artifacts it erases
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(n.angle); // +x = radially outward, +y = along the rail
    ctx.scale(fscale, fscale); // pop-in overshoot during the intro
    const kick = clamp(n.recoil || 0, 0, 1); // zap: the iris clamps, the core flares
    // fingertip halo while the lens is being dragged (immersive scheme)
    if (n.held) {
      ctx.strokeStyle = `rgba(${cCol},${(0.3 + Math.sin(time * 5) * 0.1).toFixed(2)})`;
      ctx.lineWidth = Math.max(2, size * 0.18);
      ctx.beginPath(); ctx.arc(0, 0, size * 1.65, 0, TAU); ctx.stroke();
    }
    // outer aperture ring + a faint second ring for optic depth
    ctx.strokeStyle = `rgba(${cCol},0.95)`;
    ctx.lineWidth = Math.max(1.5, size * 0.14);
    ctx.beginPath(); ctx.arc(0, 0, size * 1.12, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(${cCol},0.28)`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, size * 1.35, 0, TAU); ctx.stroke();
    // iris blades: segmented arcs spinning slowly, snapping tight on a zap
    const bladeR = size * (0.74 - kick * 0.18);
    const irisA = time * 0.6 + kick * 1.2;
    ctx.strokeStyle = `rgba(${cCol},0.8)`;
    ctx.lineWidth = Math.max(2, size * 0.3);
    ctx.lineCap = 'butt';
    for (let k = 0; k < 6; k++) {
      const a0 = irisA + k / 6 * TAU;
      ctx.beginPath(); ctx.arc(0, 0, bladeR, a0, a0 + TAU / 6 * 0.62); ctx.stroke();
    }
    ctx.lineCap = 'round';
    // lens core — flares white while the zap discharges
    const coreR = size * (0.4 + kick * 0.22) * (1 + Math.sin(time * 3 + i) * 0.05);
    const cg2 = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
    cg2.addColorStop(0, '#ffffff');
    cg2.addColorStop(0.55, kick > 0.25 ? '#ffffff' : `rgba(${cCol},0.95)`);
    cg2.addColorStop(1, `rgba(${cCol},0)`);
    ctx.fillStyle = cg2;
    ctx.beginPath(); ctx.arc(0, 0, coreR, 0, TAU); ctx.fill();
    // focus ticks along the rail axis — the optic's grip on its track
    ctx.strokeStyle = `rgba(${cCol},0.55)`;
    ctx.lineWidth = Math.max(1.5, size * 0.12);
    ctx.beginPath(); ctx.moveTo(0, -size * 1.35); ctx.lineTo(0, -size * 1.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, size * 1.35); ctx.lineTo(0, size * 1.7); ctx.stroke();
    ctx.restore();
  }
  if (settings.controls === 2 && !fused) drawControlArcs(g);
  drawPulseOrbs(g);
}

// a ready orb tapped: unleash that node's wave from the ring into the deep
function firePulse(i) {
  pulseCharge[i] = 0;
  pulseWaves.push({ z: geo().hitZ, kills: 0, i, col: i === 0 ? '111,227,255' : '240,248,255' });
  shake = Math.min(shake + 0.7, 1);
  tone(880, 0.7, 'sawtooth', 0.12, 60); // long falling surge
  sfx.perfect();
  buzz([30, 30, 90]);
}
// the wave: a white-hot front racing down the tunnel, dragging a glowing wake
// that fills the whole cave behind it
function drawPulseWave(g) {
  for (const wv of pulseWaves) {
    const a = clamp(1.25 - wv.z, 0.15, 1);
    ctx.lineCap = 'round';
    // wake: rings trailing from the front back toward the player, melting away
    for (let k = 5; k >= 1; k--) {
      const zT = wv.z - k * 0.055;
      if (zT <= g.hitZ * 0.8) continue;
      const rt = ring(zT, g);
      const ka = a * (1 - k / 6) * 0.3;
      ctx.lineWidth = Math.max(2, (14 + k * 7) * rt.s * 3);
      ctx.strokeStyle = `rgba(${wv.col},${ka.toFixed(2)})`;
      ctx.beginPath(); ctx.arc(rt.x, rt.y, rt.r, 0, TAU); ctx.stroke();
    }
    // front: layered hot ring + a forward glow washing the cave ahead
    const rg = ring(wv.z, g);
    const fg = ctx.createRadialGradient(rg.x, rg.y, rg.r * 0.35, rg.x, rg.y, rg.r * 1.15);
    fg.addColorStop(0, 'rgba(0,0,0,0)');
    fg.addColorStop(0.85, `rgba(${wv.col},${(a * 0.16).toFixed(2)})`);
    fg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r * 1.2, 0, TAU); ctx.fill();
    for (const [w2, col] of [
      [22, `rgba(${wv.col},${(a * 0.3).toFixed(2)})`],
      [9, `rgba(${wv.col},${(a * 0.7).toFixed(2)})`],
      [3, `rgba(255,255,255,${(a * 0.95).toFixed(2)})`]
    ]) {
      ctx.lineWidth = Math.max(1, w2 * rg.s * 3);
      ctx.strokeStyle = col;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, TAU); ctx.stroke();
    }
  }
}
// per-node charge orbs in the pad cores — a progress ring while banking,
// full bloom + breathing + pings when ready to fire
function drawPulseOrbs(g) {
  if (boss) return; // the duel owns the pads
  for (let i = 0; i < 2; i++) {
    const frac = clamp(pulseCharge[i] / PULSE_MAX, 0, 1);
    if (frac <= 0.02) continue;
    const d = dialCenter(i === 0 ? 'L' : 'R');
    const col = i === 0 ? '111,227,255' : '255,255,255';
    const ready = frac >= 1;
    const pu = ready ? 1 + Math.sin(time * 6 + i) * 0.14 : 1;
    const r = d.r * (0.12 + frac * 0.24) * pu;
    // charge progress ring — reads at a glance how full the bank is
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(${col},0.25)`;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.44, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(${col},${ready ? 0.95 : 0.7})`;
    ctx.lineWidth = ready ? 5 : 4;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.44, -Math.PI / 2, -Math.PI / 2 + frac * TAU); ctx.stroke();
    // the orb itself
    const og = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, r * 2.4);
    og.addColorStop(0, `rgba(255,255,255,${ready ? 1 : 0.45 + frac * 0.35})`);
    og.addColorStop(0.4, `rgba(${col},${ready ? 0.85 : 0.3 + frac * 0.35})`);
    og.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(d.x, d.y, r * 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = ready ? '#ffffff' : `rgba(${col},0.9)`;
    ctx.beginPath(); ctx.arc(d.x, d.y, r * 0.5, 0, TAU); ctx.fill();
    // orbiting charge motes while banking; radiant spikes when ready
    if (!ready) {
      for (let k = 0; k < 3; k++) {
        const ma = time * 2.2 + i * 2 + k / 3 * TAU;
        ctx.fillStyle = `rgba(${col},0.8)`;
        ctx.beginPath();
        ctx.arc(d.x + Math.cos(ma) * r * 1.5, d.y + Math.sin(ma) * r * 1.5, Math.max(1.5, r * 0.14), 0, TAU);
        ctx.fill();
      }
    } else {
      ctx.strokeStyle = `rgba(255,255,255,${(0.5 + Math.sin(time * 6) * 0.3).toFixed(2)})`;
      ctx.lineWidth = 2;
      for (let k = 0; k < 6; k++) {
        const sa = time * 0.7 + k / 6 * TAU;
        ctx.beginPath();
        ctx.moveTo(d.x + Math.cos(sa) * r * 1.15, d.y + Math.sin(sa) * r * 1.15);
        ctx.lineTo(d.x + Math.cos(sa) * r * 1.7, d.y + Math.sin(sa) * r * 1.7);
        ctx.stroke();
      }
      // attention pings: expanding rings breathing off the orb
      const k2 = (time * 0.9 + i * 0.5) % 1;
      ctx.strokeStyle = `rgba(${col},${(0.7 * (1 - k2)).toFixed(2)})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(d.x, d.y, r * (1.3 + k2 * 2.2), 0, TAU); ctx.stroke();
    }
  }
}

// the ARCS scheme's side strips: track + rails, a center-berth notch, and a
// thumb showing where the node sits on its ±180° range
function drawControlArcs(g) {
  const { rA, span, bz } = arcGeom(g);
  for (let i = 0; i < 2; i++) {
    const base = arcBase(i);
    const col = i === 0 ? '111,227,255' : '255,255,255';
    const n = nodes[i];
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(${col},${n.held ? 0.3 : 0.16})`;
    ctx.lineWidth = bz * 0.85;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, rA, base - span, base + span); ctx.stroke();
    ctx.strokeStyle = `rgba(${col},0.4)`;
    ctx.lineWidth = 1.5;
    for (const rr of [rA - bz * 0.42, rA + bz * 0.42]) {
      ctx.beginPath(); ctx.arc(g.cx, g.cy, rr, base - span, base + span); ctx.stroke();
    }
    // position scale: center notch = near side, half ticks = top/bottom of the
    // rim, end ticks = the far side (full 180° throw)
    const tickAt = (t, wMul, al) => {
      const a = base + arcDir(i) * Math.asin(clamp(t * ARC_THROW() / rA, -1, 1));
      ctx.strokeStyle = `rgba(${col},${al})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(g.cx + Math.cos(a) * (rA - bz * 0.42 * wMul), g.cy + Math.sin(a) * (rA - bz * 0.42 * wMul));
      ctx.lineTo(g.cx + Math.cos(a) * (rA + bz * 0.42 * wMul), g.cy + Math.sin(a) * (rA + bz * 0.42 * wMul));
      ctx.stroke();
    };
    tickAt(0, 1, 0.7);       // default berth
    tickAt(0.5, 0.6, 0.45);  // top of the rim
    tickAt(-0.5, 0.6, 0.45); // bottom of the rim
    tickAt(1, 1, 0.55);      // far side, over the top
    tickAt(-1, 1, 0.55);     // far side, under the bottom
    // thumb rides at the fingertip's height, exactly matching the input
    const t = clamp(angDiff(n.angle, base) / Math.PI, -1, 1) * arcDir(i);
    const ta = base + arcDir(i) * Math.asin(clamp(t * ARC_THROW() / rA, -1, 1));
    const tx = g.cx + Math.cos(ta) * rA, ty = g.cy + Math.sin(ta) * rA;
    const ts = bz * (n.held ? 0.4 : 0.3);
    const tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, ts * 2.2);
    tg.addColorStop(0, `rgba(${col},0.6)`);
    tg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(tx, ty, ts * 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = n.color;
    ctx.beginPath(); ctx.arc(tx, ty, ts, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(240,252,255,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(tx, ty, ts, 0, TAU); ctx.stroke();
  }
}

function drawDials() {
  // immersive/arcs schemes drive the lenses directly — no dials unless the
  // duel's fused cannon needs its fire stick back
  if (settings.controls !== 0 && !(boss && boss.mergeT >= 1)) return;
  for (let i = 0; i < 2; i++) {
    const side = i === 0 ? 'L' : 'R';
    const d = dialCenter(side);
    const n = nodes[i];
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU);
    ctx.strokeStyle = i === 0 ? 'rgba(77,141,255,0.85)' : 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU);
    ctx.fillStyle = 'rgba(10,20,45,0.35)'; ctx.fill();
    // boss duel: the right dial is the fire stick — heat ring + aim knob
    const fireStick = boss && boss.mergeT >= 1 && side === 'R';
    if (fireStick) {
      const hcol = heat < 0.5 ? '111,227,255' : heat < 0.8 ? '255,180,80' : '255,70,70';
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(' + hcol + ',' + (overheat ? (Math.sin(time * 12) > 0 ? 0.95 : 0.3) : 0.85).toFixed(2) + ')';
      ctx.lineWidth = 5;
      if (heat > 0.005) {
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r + 7, -Math.PI / 2, -Math.PI / 2 + heat * TAU); ctx.stroke();
      }
      if (overheat) {
        ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,80,80,0.9)'; ctx.font = '700 11px Audiowide, system-ui';
        ctx.fillText('OVERHEAT', d.x, d.y - d.r - 14);
        ctx.textAlign = 'left';
      }
    }
    // knob — during the duel the right knob is the stick position itself
    const kx = fireStick ? d.x + beamAim.x * d.r : d.x + Math.cos(n.angle) * d.r;
    const ky = fireStick ? d.y + beamAim.y * d.r : d.y + Math.sin(n.angle) * d.r;
    const ks = d.r * 0.3;
    const gl = ctx.createRadialGradient(kx, ky, 0, kx, ky, ks * 2);
    gl.addColorStop(0, i === 0 ? 'rgba(77,141,255,0.6)' : 'rgba(255,255,255,0.55)');
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(kx, ky, ks * 2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(kx, ky, ks, 0, TAU);
    ctx.fillStyle = n.color; ctx.fill();
    ctx.strokeStyle = i === 0 ? '#7db2ff' : '#9fc4e0'; ctx.lineWidth = 2; ctx.stroke();
    // radar blips: live enemy positions — angle matches the tunnel, radius = how close they are
    const blipXY = en => {
      const rr = d.r * (1 - clamp(en.z, 0, 1) * 0.85);
      return { x: d.x + Math.cos(en.angle) * rr, y: d.y + Math.sin(en.angle) * rr };
    };
    for (const en of enemies) {
      if (en.dead || en.resolved) continue;
      const { x: bx, y: by } = blipXY(en);
      const bs = (2.5 + (1 - en.z) * 4) * (en.type === 'heavy' ? 1.5 : 1);
      const urgent = en.z < 0.35 && Math.sin(time * 10) > 0; // blink when close
      const al = urgent || en.z >= 0.35 ? 0.95 : 0.4;
      // barrier pairs show their wall on the radar too
      if (en.lineLead && en.partner && !en.partner.dead) {
        const p2 = blipXY(en.partner);
        ctx.strokeStyle = `rgba(255,80,110,${al * 0.6})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
      ctx.fillStyle = en.type === 'frag'
        ? `rgba(140,150,170,${al})`
        : en.type === 'heavy'
        ? `rgba(200,80,255,${al})`
        : en.lock === 0
        ? `rgba(80,170,255,${al})`
        : en.lock === 1
        ? `rgba(240,248,255,${al})`
        : `rgba(220,50,50,${al})`;
      ctx.fillRect(bx - bs / 2, by - bs / 2, bs, bs);
    }
    // golden pickup blips
    for (const p of pickups) {
      if (p.done) continue;
      const { x: gx, y: gy } = blipXY(p);
      ctx.fillStyle = 'rgba(255,210,74,0.9)';
      ctx.beginPath(); ctx.arc(gx, gy, 2.5 + (1 - p.z) * 2, 0, TAU); ctx.fill();
    }
    // the firewall core: oversized blinking blip at its tunnel position
    if (boss) {
      const rr2 = d.r * clamp(boss.rad || 0, 0, 1) * 0.85;
      const bx2 = d.x + Math.cos(boss.ang || 0) * rr2, by2 = d.y + Math.sin(boss.ang || 0) * rr2;
      ctx.fillStyle = Math.sin(time * 8) > 0 ? 'rgba(210,80,255,0.95)' : 'rgba(210,80,255,0.45)';
      const bs2 = 7;
      ctx.fillRect(bx2 - bs2 / 2, by2 - bs2 / 2, bs2, bs2);
    }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- holographic HUD kit ----------
// chamfered slab — corners cut on the top-left / bottom-right diagonal
function techRect(x, y, w, h, cut) {
  ctx.beginPath();
  ctx.moveTo(x + cut, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + h - cut);
  ctx.lineTo(x + w - cut, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + cut);
  ctx.closePath();
}
// floating bracket corners, like a target lock
function cornerBrackets(x, y, w, h, len, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
  ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
  ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
  ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);
  ctx.stroke();
}
// cluster of small + marks — HUD garnish
function plusCluster(x, y, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  const s = 3.5, gap = 12;
  for (let i = 0; i < 8; i++) {
    if (i === 3 || i === 6) continue; // ragged edge, like the mock
    const cx2 = x + (i % 4) * gap, cy2 = y + ((i / 4) | 0) * gap;
    ctx.beginPath();
    ctx.moveTo(cx2 - s, cy2); ctx.lineTo(cx2 + s, cy2);
    ctx.moveTo(cx2, cy2 - s); ctx.lineTo(cx2, cy2 + s);
    ctx.stroke();
  }
}
// glass console panel with a luminous header band; returns the header height
function techPanel(x, y, w, h, title) {
  const cut = 16;
  techRect(x, y, w, h, cut);
  ctx.fillStyle = 'rgba(4,14,30,0.92)'; ctx.fill();
  ctx.shadowColor = 'rgba(95,215,255,0.55)'; ctx.shadowBlur = lowFX ? 0 : 16;
  ctx.strokeStyle = 'rgba(110,210,255,0.65)'; ctx.lineWidth = 1.5;
  techRect(x, y, w, h, cut); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(110,210,255,0.16)'; ctx.lineWidth = 1;
  techRect(x + 4, y + 4, w - 8, h - 8, cut - 3); ctx.stroke();
  const hh = 32;
  ctx.save();
  techRect(x, y, w, h, cut); ctx.clip();
  const hg = ctx.createLinearGradient(x, y, x + w * 0.85, y);
  hg.addColorStop(0, 'rgba(80,190,255,0.35)');
  hg.addColorStop(1, 'rgba(80,190,255,0.02)');
  ctx.fillStyle = hg; ctx.fillRect(x, y, w, hh);
  ctx.strokeStyle = 'rgba(120,220,255,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y + hh); ctx.lineTo(x + w, y + hh); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#cfeeff';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  ctx.font = '700 13px Audiowide, system-ui'; ctx.textAlign = 'left';
  ctx.fillText(title, x + 20, y + 21);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  cornerBrackets(x - 7, y - 7, w + 14, h + 14, 14, 'rgba(120,220,255,0.55)');
  return hh;
}

// level intro: title card + 3-2-1 countdown in the center while the ring forms
// — drawn as the frame's last pass so no rim/HUD layer can obscure the text
function drawIntroCard() {
  const L = LV || LEVELS[levelIdx];
  if (introT < INTRO_DUR + 0.5) {
    const t = introT;
    ctx.textAlign = 'center';
    if (t < INTRO_DUR) {
      const inA = clamp(t / 0.35, 0, 1);
      const outA = clamp((INTRO_DUR - t) / 0.45, 0, 1);
      const scale = 0.85 + 0.15 * (1 - Math.pow(1 - inA, 3));
      ctx.save();
      ctx.translate(W / 2, H * 0.30);
      ctx.scale(scale, scale);
      ctx.globalAlpha = Math.min(inA, outA);
      try { ctx.letterSpacing = '6px'; } catch (e) {}
      ctx.fillStyle = 'rgba(200,235,255,0.85)'; ctx.font = '600 13px Audiowide, system-ui';
      ctx.fillText(endless ? 'SURVIVE' : qual ? 'TRAINING' : 'LEVEL ' + (levelIdx + 1), 0, -34);
      ctx.fillStyle = '#eafaff'; ctx.font = '800 ' + Math.min(W * 0.055, 32) + 'px Audiowide, system-ui';
      ctx.shadowColor = '#5fd7ff'; ctx.shadowBlur = 24;
      ctx.fillText(L.name, 0, 0);
      ctx.shadowBlur = 0;
      try { ctx.letterSpacing = '0px'; } catch (e) {}
      if (L.hint) {
        ctx.fillStyle = '#ffb8c8'; ctx.font = '600 12px Audiowide, system-ui';
        ctx.fillText(L.hint, 0, 26);
      }
      ctx.restore();
      const cd = t - 0.7;
      if (cd >= 0) { // 3 … 2 … 1, slamming in on the second
        const idx = Math.min(Math.floor(cd), 2);
        const ct = cd - idx;
        const pop = 1.9 - 0.9 * Math.min(ct / 0.22, 1);
        const ca = ct < 0.15 ? ct / 0.15 : clamp((1 - ct) / 0.35, 0, 1);
        ctx.save();
        ctx.translate(W / 2, H * 0.52);
        ctx.scale(pop, pop);
        ctx.globalAlpha = ca;
        ctx.fillStyle = '#ffd24a';
        ctx.font = '800 ' + Math.min(W * 0.09, 54) + 'px Audiowide, system-ui';
        ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 26;
        ctx.fillText(3 - idx, 0, 18);
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    } else { // GO! flash as the stream goes live
      const gt = (t - INTRO_DUR) / 0.5;
      ctx.save();
      ctx.translate(W / 2, H * 0.52);
      ctx.scale(1 + gt * 0.6, 1 + gt * 0.6);
      ctx.globalAlpha = 1 - gt;
      ctx.fillStyle = '#7ee262';
      ctx.font = '800 ' + Math.min(W * 0.09, 54) + 'px Audiowide, system-ui';
      ctx.shadowColor = '#7ee262'; ctx.shadowBlur = 26;
      try { ctx.letterSpacing = '4px'; } catch (e) {}
      ctx.fillText('GO!', 0, 18);
      try { ctx.letterSpacing = '0px'; } catch (e) {}
      ctx.shadowBlur = 0;
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

function drawHUD(g) {
  const L = LV || LEVELS[levelIdx];
  const pad = 14;

  // left curved bar: LEVEL PROGRESS (green, hugs the node ring like the mock)
  // radius is clamped so the arc tips + stroke casing always stay on screen —
  // on wide phones the unclamped radius pushed the tips past the top edge
  const bw2 = Math.max(9, Math.min(W, H) * 0.024);
  const ELEV = Math.PI * 0.34; // how far above horizontal the arc tips rise
  const barR = Math.min(g.nodeR + Math.min(W, H) * 0.095, (H / 2 - bw2 - 8) / Math.sin(ELEV));
  const aL0 = Math.PI * 1.06, aL1 = Math.PI + ELEV; // lower-left → upper-left
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(240,250,255,0.85)'; ctx.lineWidth = bw2 + 5;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aL0, aL1); ctx.stroke();
  ctx.strokeStyle = '#050a12'; ctx.lineWidth = bw2 + 2;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aL0, aL1); ctx.stroke();
  // left arc: level progress · endless ramp · or the CORE's health during the duel
  const prog = boss ? clamp(boss.hp / boss.maxHp, 0, 1) : endless ? clamp(levelT / 150, 0, 1) : clamp(levelT / L.duration, 0, 1);
  if (prog > 0.005) {
    ctx.strokeStyle = boss ? '#d465ff' : endless ? '#ff9a3c' : '#7ee262';
    ctx.lineWidth = bw2 - 4;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aL0, aL0 + (aL1 - aL0) * prog); ctx.stroke();
  }

  // right curved bar: 4 life blocks — or a continuous hitpoint bar during the duel
  const aR0 = -Math.PI * 0.06, aR1 = -ELEV; // mirrored: lower-right → upper-right
  ctx.lineCap = 'butt';
  if (boss) {
    ctx.strokeStyle = 'rgba(15,28,48,0.8)'; ctx.lineWidth = bw2;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aR1, aR0); ctx.stroke();
    const hpF = clamp(integrity / 100, 0, 1);
    if (hpF > 0.005) {
      ctx.strokeStyle = hpF > 0.5 ? '#7ee262' : hpF > 0.25 ? '#ffb340' : '#ff4a5e';
      ctx.lineWidth = bw2;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aR0 - (aR0 - aR1) * hpF, aR0); ctx.stroke();
    }
  } else {
    const MAXM = 4, blocksLeft = Math.max(0, Math.ceil(integrity / 25));
    const span = (aR0 - aR1) / MAXM, gap2 = span * 0.07; // thin seams keep them reading as one bar
    for (let i = 0; i < MAXM; i++) {
      const s0 = aR0 - (i + 1) * span + gap2 / 2, s1 = aR0 - i * span - gap2 / 2;
      ctx.strokeStyle = i < blocksLeft ? '#8fc7ff' : 'rgba(15,28,48,0.8)';
      ctx.lineWidth = bw2;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, s0, s1); ctx.stroke();
    }
  }
  ctx.lineCap = 'round';

  // score (right)
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd24a'; ctx.font = '700 20px Audiowide, system-ui';
  ctx.fillText(score.toLocaleString(), W - pad - SAFE.r, H * 0.12 + 8);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '600 10px Audiowide, system-ui';
  ctx.fillText('SCORE', W - pad - SAFE.r, H * 0.12 + 24);
  if (combo >= 3) {
    ctx.fillStyle = '#ffd24a'; ctx.font = '700 14px Audiowide, system-ui';
    ctx.fillText('COMBO x' + Math.min(combo, 5), W - pad - SAFE.r, H * 0.12 + 48);
  }
  const mm = mutMul();
  if (mm > 1) {
    ctx.fillStyle = 'rgba(255,210,74,0.85)'; ctx.font = '700 11px Audiowide, system-ui';
    ctx.fillText('MODIFIERS ×' + (Math.round(mm * 100) / 100), W - pad - SAFE.r, H * 0.12 + 66);
  }
  ctx.textAlign = 'left';

  // pause button (top-left)
  pauseBtnRect = { x: 12 + SAFE.l, y: 12 + SAFE.t, w: 38, h: 38 };
  techRect(pauseBtnRect.x, pauseBtnRect.y, pauseBtnRect.w, pauseBtnRect.h, 8);
  ctx.fillStyle = 'rgba(6,20,40,0.6)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,220,255,0.55)'; ctx.lineWidth = 1.5;
  techRect(pauseBtnRect.x, pauseBtnRect.y, pauseBtnRect.w, pauseBtnRect.h, 8); ctx.stroke();
  ctx.fillStyle = 'rgba(220,245,255,0.92)';
  ctx.fillRect(pauseBtnRect.x + 12, pauseBtnRect.y + 11, 5, 16);
  ctx.fillRect(pauseBtnRect.x + 21, pauseBtnRect.y + 11, 5, 16);

  // resume countdown after unpausing
  if (resumeHold > 0) {
    const d2 = Math.max(1, Math.ceil(resumeHold / 0.3));
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = '#ffd24a';
    ctx.font = '800 ' + Math.min(W * 0.08, 46) + 'px Audiowide, system-ui';
    ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 20;
    ctx.fillText(d2, W / 2, H * 0.45);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  // active power-up chips (top center)
  const active = Object.keys(fx).filter(k => fx[k] > 0);
  active.forEach((k, i) => {
    const cw = 92, chh = 20;
    const x0 = W / 2 - (active.length * (cw + 8) - 8) / 2 + i * (cw + 8);
    const y0 = 14 + SAFE.t;
    techRect(x0, y0, cw, chh, 6);
    ctx.fillStyle = 'rgba(60,40,5,0.65)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,210,74,0.8)'; ctx.lineWidth = 1;
    techRect(x0, y0, cw, chh, 6); ctx.stroke();
    ctx.fillStyle = '#ffe9b0'; ctx.font = '700 10px Audiowide, system-ui'; ctx.textAlign = 'left';
    ctx.fillText(PICKUPS[k].label, x0 + 9, y0 + 14);
    ctx.fillStyle = 'rgba(255,210,74,0.9)';
    ctx.fillRect(x0, y0 + chh + 3, cw * clamp(fx[k] / PICKUPS[k].dur, 0, 1), 2);
  });

  // qualification prompts + guides
  if (tut && tut.stage >= 0) {
    const st = QUAL[tut.stage];
    const nn = a => Math.abs(angDiff(nodes[0].angle, a)) < Math.abs(angDiff(nodes[1].angle, a)) ? nodes[0] : nodes[1];
    let msg = null;
    if (st.card === 'move') msg = 'Slide BOTH thumbs around the dials';
    else if (tut.spawned === 'normal') msg = 'Align a node with the trap';
    else if (tut.spawned === 'heavy') msg = 'Pin it with BOTH nodes at once';
    else if (tut.spawned === 'line') msg = 'One node on EACH end of the wall';
    else if (tut.spawned === 'lock0') msg = 'Only the BLUE node can break this one';
    else if (tut.spawned === 'lock1') msg = 'Only the WHITE node can break this one';
    else if (tut.spawned === 'frag') msg = "It's friendly — DON'T zap it";
    else if (tut.spawned === 'pickup') msg = 'Catch the power-up with any node';
    if (msg) {
      const a = 0.75 + Math.sin(time * 4) * 0.25;
      ctx.textAlign = 'center';
      ctx.font = '700 ' + Math.min(W * 0.026, 17) + 'px Audiowide, system-ui';
      const tw = ctx.measureText(msg).width;
      ctx.fillStyle = 'rgba(9,20,40,0.72)';
      roundRect(W / 2 - tw / 2 - 16, H * 0.70 - 20, tw + 32, 30, 8); ctx.fill();
      ctx.fillStyle = 'rgba(190,240,255,' + a.toFixed(2) + ')';
      ctx.fillText(msg, W / 2, H * 0.70);
      ctx.textAlign = 'left';
    }
    const ten = enemies.find(e => e.tut && !e.dead && !e.resolved);
    if (ten) {
      if (ten.type === 'heavy') { drawGuideArc(nodes[0], ten.angle); drawGuideArc(nodes[1], ten.angle); }
      else if (ten.type === 'line') { drawGuideArc(nodes[0], ten.angle); if (ten.partner) drawGuideArc(nodes[1], ten.partner.angle); }
      else if (ten.lock !== undefined) drawGuideArc(nodes[ten.lock], ten.angle);
      else if (ten.type !== 'frag') drawGuideArc(nn(ten.angle), ten.angle);
    }
    const tp = pickups.find(p => p.tut && !p.done);
    if (tp) drawGuideArc(nn(tp.angle), tp.angle);
    if (st.card === 'move') { // pulse both dials
      for (const side of ['L', 'R']) {
        const d = dialCenter(side);
        const pr = d.r + 6 + Math.sin(time * 5) * 3;
        ctx.strokeStyle = side === 'L' ? 'rgba(111,227,255,0.8)' : 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(d.x, d.y, pr, 0, TAU); ctx.stroke();
      }
    }
  }
}

// ---------- briefing card (S.INFO) ----------
function infoCrystal(r, pal) {
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.9);
  gl.addColorStop(0, 'rgba(' + pal.glow + ',0.45)');
  gl.addColorStop(1, 'rgba(' + pal.glow + ',0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, TAU); ctx.fill();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU + time * 0.3;
    const rr = r * (0.78 + (i % 3) * 0.12);
    ctx.fillStyle = pal.shades[i % pal.shades.length];
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.30) * rr * 0.35, Math.sin(a - 0.30) * rr * 0.35);
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    ctx.lineTo(Math.cos(a + 0.30) * rr * 0.35, Math.sin(a + 0.30) * rr * 0.35);
    ctx.closePath(); ctx.fill();
  }
  const cg = ctx.createRadialGradient(-r * 0.1, -r * 0.12, 0, 0, 0, r * 0.45);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.55, pal.core);
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, TAU); ctx.fill();
}
const INFO_PAL = {
  boss:   { glow: '200,70,255',  shades: ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8', '#c44af0'], core: '#b03ae8' },
  normal: { glow: '255,60,90',   shades: ['#e8274b', '#ff5a3c', '#d81f6e', '#b3123a', '#ff8c5a'], core: '#ff5a3c' },
  heavy:  { glow: '200,70,255',  shades: ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8', '#c44af0'], core: '#b03ae8' },
  lock:   { glow: '80,170,255',  shades: ['#2f7fe0', '#1c4fae', '#4d9bff', '#12398a', '#3f8af0'], core: '#2f7fe0' },
  frag:   { glow: '90,110,140', shades: ['#2b3242', '#151a26', '#3a4354', '#0d1119', '#232a38'], core: '#2b3242' }
};
function drawInfoGlyph(kind, cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  if (kind === 'move') {
    ctx.strokeStyle = 'rgba(10,16,28,0.95)'; ctx.lineWidth = r * 0.34;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,220,255,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, TAU); ctx.stroke();
    const demoA = time * 1.2;
    for (const [a, col] of [[Math.PI + demoA, 'rgb(111,227,255)'], [demoA, '#ffffff']]) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, r * 0.18, 0, TAU); ctx.fill();
    }
  } else if (kind === 'pickup') {
    const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.9);
    gl.addColorStop(0, 'rgba(255,210,74,0.5)');
    gl.addColorStop(1, 'rgba(255,210,74,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, TAU); ctx.fill();
    ctx.rotate(time * 0.4);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(60,40,5,0.9)'; ctx.fill();
    ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = Math.max(2, r * 0.14); ctx.stroke();
    ctx.rotate(-time * 0.4);
    const s2 = r * 0.52;
    ctx.fillStyle = '#ffe9b0';
    ctx.beginPath();
    ctx.moveTo(s2 * 0.3, -s2); ctx.lineTo(-s2 * 0.45, s2 * 0.15); ctx.lineTo(0, s2 * 0.15);
    ctx.lineTo(-s2 * 0.3, s2); ctx.lineTo(s2 * 0.45, -0.15 * s2); ctx.lineTo(0, -0.15 * s2);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'frag') {
    const pr = r * 1.05;
    const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, pr * 1.8);
    gl.addColorStop(0, 'rgba(90,110,140,0.4)');
    gl.addColorStop(1, 'rgba(90,110,140,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, pr * 1.8, 0, TAU); ctx.fill();
    ctx.rotate(time * 0.25);
    ctx.beginPath();
    ctx.moveTo(0, -pr);
    ctx.quadraticCurveTo(pr * 0.55, -pr * 0.55, pr, 0);
    ctx.quadraticCurveTo(pr * 0.55, pr * 0.55, 0, pr);
    ctx.quadraticCurveTo(-pr * 0.55, pr * 0.55, -pr, 0);
    ctx.quadraticCurveTo(-pr * 0.55, -pr * 0.55, 0, -pr);
    ctx.closePath();
    const fg2 = ctx.createRadialGradient(-pr * 0.2, -pr * 0.25, 0, 0, 0, pr);
    fg2.addColorStop(0, '#2b3242');
    fg2.addColorStop(0.45, '#0d1119');
    fg2.addColorStop(1, '#02040a');
    ctx.fillStyle = fg2; ctx.fill();
    ctx.strokeStyle = 'rgba(140,150,170,0.55)'; ctx.lineWidth = Math.max(1.5, pr * 0.08); ctx.stroke();
    ctx.fillStyle = 'rgba(200,210,230,0.35)';
    ctx.beginPath(); ctx.ellipse(-pr * 0.22, -pr * 0.28, pr * 0.16, pr * 0.09, -0.6, 0, TAU); ctx.fill();
  } else if (kind === 'line') {
    const off = r * 1.05;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,60,90,0.6)'; ctx.lineWidth = r * 0.26;
    ctx.beginPath(); ctx.moveTo(-off, 0); ctx.lineTo(off, 0); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,180,195,0.9)'; ctx.lineWidth = r * 0.08;
    ctx.beginPath(); ctx.moveTo(-off, 0); ctx.lineTo(off, 0); ctx.stroke();
    for (const sx of [-off, off]) {
      ctx.save(); ctx.translate(sx, 0);
      infoCrystal(r * 0.55, INFO_PAL.normal);
      ctx.restore();
    }
  } else if (kind === 'boss') {
    // mini firewall-core: the same corrupted mosaic the duel shows
    const SH = ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8'];
    const ext = r * 1.05, cs = ext * 2 / 3;
    for (let rr = 0; rr < 3; rr++) for (let cc = 0; cc < 3; cc++) {
      const fl = 0.55 + 0.45 * Math.sin(time * 6 + rr * 2.7 + cc * 1.3);
      ctx.fillStyle = rr === 1 && cc === 1 ? '#f3d4ff' : SH[(rr * 3 + cc) % SH.length];
      ctx.globalAlpha = rr === 1 && cc === 1 ? 1 : 0.45 + 0.5 * fl;
      ctx.fillRect(-ext + cc * cs + cs * 0.05, -ext + rr * cs + cs * 0.05, cs * 0.9, cs * 0.9);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.5 * (Math.sin(time * 13) * 0.5 + 0.5)).toFixed(2) + ')';
    ctx.fillRect(Math.sin(time * 9) * r * 0.3 - r, Math.sin(time * 3.1) * r * 0.6, r * 2, r * 0.09);
    // both node colors demanded
    ctx.strokeStyle = 'rgba(230,245,255,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.45, 0, TAU); ctx.stroke();
    const oa = time * 1.4;
    ctx.fillStyle = 'rgb(111,227,255)';
    ctx.beginPath(); ctx.arc(Math.cos(oa) * r * 1.45, Math.sin(oa) * r * 1.45, r * 0.16, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(Math.cos(oa + Math.PI) * r * 1.45, Math.sin(oa + Math.PI) * r * 1.45, r * 0.16, 0, TAU); ctx.fill();
  } else {
    infoCrystal(r, INFO_PAL[kind] || INFO_PAL.normal);
    if (kind === 'heavy' || kind === 'boss') { // both node colors demanded
      ctx.strokeStyle = 'rgba(230,245,255,0.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.3, 0, TAU); ctx.stroke();
      const oa = time * 1.4;
      ctx.fillStyle = 'rgb(111,227,255)';
      ctx.beginPath(); ctx.arc(Math.cos(oa) * r * 1.3, Math.sin(oa) * r * 1.3, r * 0.16, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(Math.cos(oa + Math.PI) * r * 1.3, Math.sin(oa + Math.PI) * r * 1.3, r * 0.16, 0, TAU); ctx.fill();
    }
    if (kind === 'lock') { // single matching color
      ctx.strokeStyle = 'rgb(111,227,255)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.3, 0, TAU); ctx.stroke();
      const oa = time * 1.4;
      ctx.fillStyle = 'rgb(111,227,255)';

// marching dashed arc from a node toward the tutorial trap, with an arrowhead
function drawGuideArc(n, targetA) {
  const g2 = geo();
  const rr = g2.nodeR - Math.min(W, H) * 0.055 * 2.0;
  const d = angDiff(targetA, n.angle);
  if (Math.abs(d) < 0.3) return; // close enough — no guide needed
  const dir = Math.sign(d);
  const a0 = n.angle + dir * 0.12, a1 = n.angle + d * 0.82;
  ctx.save();
  ctx.strokeStyle = 'rgba(120,225,255,0.85)';
  ctx.lineWidth = 3;
  ctx.setLineDash([9, 9]);
  ctx.lineDashOffset = -time * 60 * dir;
  ctx.beginPath(); ctx.arc(g2.cx, g2.cy, rr, a0, a1, dir < 0); ctx.stroke();
  ctx.setLineDash([]);
  const hx = g2.cx + Math.cos(a1) * rr, hy = g2.cy + Math.sin(a1) * rr;
  ctx.translate(hx, hy); ctx.rotate(a1 + dir * Math.PI / 2);
  ctx.fillStyle = 'rgba(160,240,255,0.95)';
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function settingsTap(x, y, pid) {
  for (const t of pauseTogglesList) {
    if (x > t.x - 8 && x < t.x + t.w + 8 && y > t.y - 8 && y < t.y + t.h + 8) {

function pauseTap(x, y, pid) {
  if (settingsTap(x, y, pid)) return;
  for (const b of pauseButtonsList) {
    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) {
      sfx.tick();
      if (b.action === 'resume') { state = S.PLAY; resumeHold = 0.9; resumeDigit = 0; }
      else if (b.action === 'restart') { if (qual) startQualification(); else if (daily) startDaily(); else if (endless) startEndless(); else startLevel(levelIdx); }
      else { daily = false; Math.random = sysRandom; state = S.MENU; fadeT = 0.35; playTrack('menu'); }
      return;
    }
  }
}

function drawStars(cx, cy, count, size, t) {
  for (let i = 0; i < 3; i++) {
    const x = cx + (i - 1) * size * 2.6;
    const on = i < count && t > 0.4 + i * 0.35;
    ctx.save();
    ctx.translate(x, cy);
    const pop = on ? 1 + Math.max(0, 0.5 - (t - (0.4 + i * 0.35))) * 1.2 : 1;
    ctx.scale(pop, pop);
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k / 10 * TAU;
      const r = k % 2 === 0 ? size : size * 0.45;
      k === 0 ? ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = on ? '#ffd24a' : 'rgba(255,255,255,0.15)';
    ctx.fill();
    ctx.restore();
  }
}

// five-point star, filled gold when earned
function star5(cx, cy, r, filled) {
  ctx.beginPath();

    const rr = k % 2 === 0 ? r : r * 0.46;
    const px2 = cx + Math.cos(a) * rr, py2 = cy + Math.sin(a) * rr;
    k === 0 ? ctx.moveTo(px2, py2) : ctx.lineTo(px2, py2);
  }
  ctx.closePath();
  if (filled) {
    ctx.fillStyle = '#ffd24a'; ctx.fill();
    ctx.strokeStyle = 'rgba(90,60,0,0.55)'; ctx.lineWidth = 1; ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(235,248,255,0.8)'; ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round'; ctx.stroke(); ctx.lineJoin = 'miter';

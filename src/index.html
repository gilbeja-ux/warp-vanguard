        ctx.lineCap = 'round';
        ctx.strokeStyle = `rgba(${colD},${(0.22 * puls).toFixed(2)})`;
        ctx.lineWidth = uT * 0.05;
        ctx.beginPath(); ctx.arc(gT.cx, gT.cy, gT.nodeR, t.a - TOLm, t.a + TOLm); ctx.stroke();
        ctx.strokeStyle = `rgba(${colD},${(0.8 * puls).toFixed(2)})`;
        ctx.lineWidth = uT * 0.018;
        ctx.beginPath(); ctx.arc(gT.cx, gT.cy, gT.nodeR, t.a - TOLm, t.a + TOLm); ctx.stroke();
        // end caps + an inward chevron marking the slot center
        ctx.fillStyle = col;
        for (const e of [-1, 1]) {
          const ca = t.a + e * TOLm;
          ctx.beginPath(); ctx.arc(gT.cx + Math.cos(ca) * gT.nodeR, gT.cy + Math.sin(ca) * gT.nodeR, uT * 0.008, 0, TAU); ctx.fill();
        }
        const mR = gT.nodeR + uT * 0.045 * (1 + 0.12 * Math.sin(time * 5));
        const mx = gT.cx + Math.cos(t.a) * mR, my = gT.cy + Math.sin(t.a) * mR;
        ctx.translate(mx, my); ctx.rotate(t.a);   // chevron points inward, toward the bore
        ctx.beginPath(); ctx.moveTo(-uT * 0.014, -uT * 0.012); ctx.lineTo(0, 0); ctx.lineTo(-uT * 0.014, uT * 0.012);
        ctx.lineWidth = uT * 0.006; ctx.strokeStyle = col; ctx.stroke();
        ctx.restore();
        drawGuideArc(nodes[t.node], t.a, col);     // arrow from the node (hides on arrival)
        // hold-to-lock progress: a ring winding up while the node sits on target
        if (cov && holdFrac > 0) {
          ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(px, py, uT * 0.045, -Math.PI / 2, -Math.PI / 2 + holdFrac * TAU); ctx.stroke();
        }
      }
    }
    if (ten) {
      if (ten.type === 'heavy') { // both arrows converge on a half-blue/half-white dock spot
        drawGuideArc(nodes[0], ten.angle); drawGuideArc(nodes[1], ten.angle);
        drawDockSpot(ten.angle);
      }
      else if (ten.type === 'line') {
        // EITHER node may take EITHER end — everything guides in neutral cyan
        // so no colored lead reads as an assignment
        const NEU = 'rgba(140,220,255,0.9)';
        drawGuideArc(nodes[0], ten.angle, NEU); if (ten.partner) drawGuideArc(nodes[1], ten.partner.angle, NEU);
        if (ten.partner) { // parking spots on the rim + the arc they'll span, riding the rail
          const g2 = geo();
          const d = angDiff(ten.partner.angle, ten.angle);
          ctx.save();
          ctx.strokeStyle = 'rgba(140,220,255,0.6)'; ctx.lineWidth = 2.5;
          ctx.setLineDash([7, 6]); ctx.lineDashOffset = -time * 24;
          ctx.beginPath(); ctx.arc(g2.cx, g2.cy, g2.nodeR, ten.angle, ten.angle + d, d < 0); ctx.stroke();
          ctx.restore();
          drawParkSpot(ten.angle, 'rgba(140,220,255,0.85)');
          drawParkSpot(ten.partner.angle, 'rgba(140,220,255,0.85)');
        }
      }
      else if (ten.tut === 'volley') { // dock BOTH on the column's lane — one shot, whole column
        drawGuideArc(nodes[0], ten.angle); drawGuideArc(nodes[1], ten.angle);
        drawDockSpot(ten.angle);
      }
      else if (ten.lock !== undefined) drawGuideArc(nodes[ten.lock], ten.angle);
      // killers wear a landing signal — the drill is DODGE, the label says so
      else if (ten.type === 'frag') {
        drawKillerSignal(ten);
        drawRideLabel('STEER CLEAR!', ten, '#ffb066'); // from spawn, clears the title
      }
      else drawGuideArc(nn(ten.angle), ten.angle);
      if (st.card === 'normal' && ten.type === 'normal' && ten.lock === undefined) {
        // the tooltip tracks the trap's ANGLE from the moment it spawns, but
        // is held at a minimum radius so a dead-center (deep) enemy's label
        // never lands on the stage title holding the bore center
        drawRideLabel('INTERCEPT', ten, '#ffb0c0');
      }
      if (ten.type === 'strip' && ten.tracing) {
        // the ribbon FEEDS the orb: ride progress winds a gold meter around
        // the destined pad — cause and effect on the same screen, and the
        // meter closing is the exact moment PULSE CHARGED pops
        const gS = geo();
        const ni = ten.traceNode || 0;
        const dS = dialCenter(ni === 0 ? 'L' : 'R');
        const fr = clamp((gS.hitZ - ten.z) / ten.len, 0, 1);
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(255,210,74,' + (0.6 + Math.sin(time * 8) * 0.25).toFixed(2) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(dS.x, dS.y, dS.r + 12, -Math.PI / 2, -Math.PI / 2 + fr * TAU); ctx.stroke();
      }
    }
    const tp = pickups.find(p => p.tut && !p.done);
    if (tp) drawGuideArc(nn(tp.angle), tp.angle);
    for (const lt of latches) { // the practice clamp warns from its landing arc
      const gL = geo();
      const rrL = gL.nodeR - Math.min(W, H) * 0.11;
      drawTutText('STEER CLEAR!', gL.cx + Math.cos(lt.a) * rrL, gL.cy + Math.sin(lt.a) * rrL,
        '#ffb066', Math.round(Math.min(W, H) * 0.028));
    }
    if (st.card === 'move') { // emphasize the dials — the ghost hints which way to drag
      const A = tut.aim, TOLm = ARCFX.span * tolVis;
      for (let i = 0; i < 2; i++) {
        const d = dialCenter(i === 0 ? 'L' : 'R');
        const pr = d.r + 6 + Math.sin(time * 5) * 3;
        ctx.strokeStyle = `rgba(${NODE_COLS[i]},0.8)`;
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(d.x, d.y, pr, 0, TAU); ctx.stroke();
        // a gesture ghost laps THIS dial toward its target, retiring on arrival
        const tgt = A.targets && A.targets.find(t => t.node === i);
        if (tgt && Math.abs(angDiff(nodes[i].angle, tgt.a)) > TOLm)
          drawDialComet(i, Math.sign(angDiff(tgt.a, nodes[i].angle)) || 1);
      }
    }
    if (tut.spawned === 'pulse') { // a banked pulse waits on the dial — ring the ready core
      for (let i = 0; i < 2; i++) {
        if (pulseCharge[i] < PULSE_MAX || nodes[i].deadT > 0) continue;
        const d = dialCenter(i === 0 ? 'L' : 'R');
        const pr = d.r * 0.5 + 8 + Math.sin(time * 6) * 4;
        ctx.strokeStyle = `rgba(${NODE_COLS[i]},0.85)`;
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(d.x, d.y, pr, 0, TAU); ctx.stroke();
        if (tut.frozen) { // the hold: the whole run waits on this tap
          const bob = Math.sin(time * 6) * 5;
          // big, breathing, unmissable — the one instruction on a frozen
          // screen. Fixed raster size breathing via SMOOTH ctx.scale (per-
          // frame font-px rounding stepped visibly) at steady alpha (the
          // drawTutText 5Hz flicker read as chopping). Clamped on-screen.
          const u2 = Math.min(W, H);
          const bpx = Math.round(u2 * 0.042);
          const br = 1 + 0.06 * Math.sin(time * 3.2);
          ctx.save();
          ctx.font = '700 ' + bpx + 'px Audiowide, system-ui';
          const halfT = ctx.measureText('FIRE PULSE NOW!').width / 2 + 10;
          ctx.translate(clamp(d.x, halfT * br, W - halfT * br), d.y - d.r - u2 * 0.085 + bob);
          ctx.scale(br, br);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
          ctx.strokeStyle = 'rgba(2,4,12,0.85)'; ctx.lineWidth = 4;
          ctx.strokeText('FIRE PULSE NOW!', 0, 0);
          ctx.fillStyle = '#8fe0ff';
          ctx.fillText('FIRE PULSE NOW!', 0, 0);
          ctx.restore();
          ctx.save();
          ctx.translate(d.x, d.y - d.r * 0.62 - 12 + bob);
          ctx.fillStyle = 'rgba(143,224,255,0.95)';
          ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(-7, -6); ctx.lineTo(7, -6); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }
    }
  }
}

// ---------- briefing card (S.INFO) ----------
function infoCrystal(r, pal) {
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.9);
  gl.addColorStop(0, 'rgba(' + pal.glow + ',0.45)');
  gl.addColorStop(1, 'rgba(' + pal.glow + ',0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, TAU); ctx.fill();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU + time * 0.3;
    const rr = r * (0.78 + (i % 3) * 0.12);
    ctx.fillStyle = pal.shades[i % pal.shades.length];
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.30) * rr * 0.35, Math.sin(a - 0.30) * rr * 0.35);
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    ctx.lineTo(Math.cos(a + 0.30) * rr * 0.35, Math.sin(a + 0.30) * rr * 0.35);
    ctx.closePath(); ctx.fill();
  }
  const cg = ctx.createRadialGradient(-r * 0.1, -r * 0.12, 0, 0, 0, r * 0.45);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.55, pal.core);
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, TAU); ctx.fill();
}
const INFO_PAL = {

// a miniature of the live tap hardware, for briefing cards
function infoTap(r, pal, double) {
  ctx.save();

  ctx.save();
  ctx.scale(1, 0.5);
  ctx.beginPath();

    const ha = i / 6 * TAU + Math.PI / 6;

  }

    ctx.globalAlpha = 1;

  ctx.strokeStyle = `rgba(${pal.glow},0.95)`;

  ctx.setLineDash([r * 0.28, r * 0.2]);

function drawInfoGlyph(kind, cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  if (kind === 'move') {
    ctx.strokeStyle = 'rgba(10,16,28,0.95)'; ctx.lineWidth = r * 0.34;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,220,255,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, TAU); ctx.stroke();
    const demoA = time * 1.2; // demo dots orbit opposite ways, like the drill asks
    for (const [a, col] of [[Math.PI + demoA, 'rgb(80,170,255)'], [-demoA, '#ffffff']]) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, r * 0.18, 0, TAU); ctx.fill();
    }
  } else if (kind === 'pickup') {
    const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.9);
    gl.addColorStop(0, 'rgba(255,210,74,0.5)');
    gl.addColorStop(1, 'rgba(255,210,74,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, TAU); ctx.fill();
    ctx.rotate(time * 0.4);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(60,40,5,0.9)'; ctx.fill();
    ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = Math.max(2, r * 0.14); ctx.stroke();
    ctx.rotate(-time * 0.4);
    const s2 = r * 0.52;
    ctx.fillStyle = '#ffe9b0';
    ctx.beginPath();
    ctx.moveTo(s2 * 0.3, -s2); ctx.lineTo(-s2 * 0.45, s2 * 0.15); ctx.lineTo(0, s2 * 0.15);
    ctx.lineTo(-s2 * 0.3, s2); ctx.lineTo(s2 * 0.45, -0.15 * s2); ctx.lineTo(0, -0.15 * s2);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'frag') {
    // the same failing body the bore shows — the card that TEACHES the killer
    // can't be the one surface still drawing a clean diamond. Its clock is raw
    // time at a fixed rate, which is safe here: the packet's cadence is
    // constant by design, so there is no state-dependent rate to leap.
    voidPacket(r * 1.05, time * 0.25, time, 7.3);
  } else if (kind === 'line') {
    // two taps torn open along a running crack
    const off = r * 1.15;
    ctx.strokeStyle = 'rgba(255,60,90,0.6)'; ctx.lineWidth = Math.max(2, r * 0.16);
    ctx.setLineDash([r * 0.4, r * 0.28]);
    ctx.lineDashOffset = -time * r * 2;
    ctx.beginPath(); ctx.moveTo(-off, 0); ctx.lineTo(off, 0); ctx.stroke();
    ctx.setLineDash([]);
    for (const sx of [-off, off]) {
      ctx.save(); ctx.translate(sx, 0);
      infoTap(r * 0.5, INFO_PAL.normal, false);
      ctx.restore();
    }
  } else if (kind === 'wall') {
    // the rim wall: a hazard-striped clamp arc seizing part of the rail
    ctx.lineCap = 'butt';
    ctx.strokeStyle = 'rgba(255,120,30,0.5)';
    ctx.lineWidth = r * 0.6;
    ctx.beginPath(); ctx.arc(0, r * 1.1, r * 1.9, -Math.PI * 0.78, -Math.PI * 0.22); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,154,60,0.95)';
    ctx.lineWidth = r * 0.34;
    ctx.beginPath(); ctx.arc(0, r * 1.1, r * 1.9, -Math.PI * 0.78, -Math.PI * 0.22); ctx.stroke();
    ctx.strokeStyle = 'rgba(30,12,4,0.7)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 6; k++) {
      const a = -Math.PI * 0.72 + k * Math.PI * 0.09;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.03) * r * 1.62, r * 1.1 + Math.sin(a - 0.03) * r * 1.62);
      ctx.lineTo(Math.cos(a + 0.03) * r * 2.18, r * 1.1 + Math.sin(a + 0.03) * r * 2.18);

      ctx.lineWidth = w2;
      ctx.beginPath();
      for (let k = 0; k <= 20; k++) {
        const t = k / 20;

        const y = Math.sin(t * 4.2 + time * 2.5) * r * 0.5;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    const my2 = Math.sin(0.5 * 4.2 + time * 2.5) * r * 0.5;
    const tg2 = ctx.createRadialGradient(0, my2, 0, 0, my2, r * 0.55);
    tg2.addColorStop(0, 'rgba(255,255,255,0.95)');
    tg2.addColorStop(1, 'rgba(255,60,90,0)');
    ctx.fillStyle = tg2;
    ctx.beginPath(); ctx.arc(0, my2, r * 0.55, 0, TAU); ctx.fill();
  } else if (kind === 'pulse') {
    // a charged pad orb, pinging
    const pu = 1 + Math.sin(time * 6) * 0.12;
    const og2 = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.3 * pu);
    og2.addColorStop(0, 'rgba(255,255,255,0.95)');
    og2.addColorStop(0.4, `rgba(${NODE_COLS[0]},0.8)`);
    og2.addColorStop(1, `rgba(${NODE_COLS[0]},0)`);
    ctx.fillStyle = og2;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.3 * pu, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.32 * pu, 0, TAU); ctx.fill();
    const k2 = (time * 0.9) % 1;
    ctx.strokeStyle = `rgba(${NODE_COLS[0]},${(0.7 * (1 - k2)).toFixed(2)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * (0.6 + k2 * 1.3), 0, TAU); ctx.stroke();
  } else if (kind === 'boss') {
    // mini firewall-core: the same corrupted mosaic the duel shows
    const SH = ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8'];
    const ext = r * 1.05, cs = ext * 2 / 3;
    for (let rr = 0; rr < 3; rr++) for (let cc = 0; cc < 3; cc++) {
      const fl = 0.55 + 0.45 * Math.sin(time * 6 + rr * 2.7 + cc * 1.3);
      ctx.fillStyle = rr === 1 && cc === 1 ? '#f3d4ff' : SH[(rr * 3 + cc) % SH.length];
      ctx.globalAlpha = rr === 1 && cc === 1 ? 1 : 0.45 + 0.5 * fl;
      ctx.fillRect(-ext + cc * cs + cs * 0.05, -ext + rr * cs + cs * 0.05, cs * 0.9, cs * 0.9);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.5 * (Math.sin(time * 13) * 0.5 + 0.5)).toFixed(2) + ')';
    ctx.fillRect(Math.sin(time * 9) * r * 0.3 - r, Math.sin(time * 3.1) * r * 0.6, r * 2, r * 0.09);
    ctx.strokeStyle = 'rgba(230,245,255,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.45, 0, TAU); ctx.stroke();
    const oa = time * 1.4;
    ctx.fillStyle = 'rgb(80,170,255)';
    ctx.beginPath(); ctx.arc(Math.cos(oa) * r * 1.45, Math.sin(oa) * r * 1.45, r * 0.16, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(Math.cos(oa + Math.PI) * r * 1.45, Math.sin(oa + Math.PI) * r * 1.45, r * 0.16, 0, TAU); ctx.fill();
  } else {
    // the live threat models: tap hardware in the type's color
    const pal = kind === 'heavy' ? INFO_PAL.heavy : kind === 'lock' ? INFO_PAL.lock : INFO_PAL.normal;
    infoTap(r * (kind === 'heavy' ? 1.15 : 1), pal, kind === 'heavy' || kind === 'lock');
    if (kind === 'heavy') { // both node colors demanded
      ctx.strokeStyle = 'rgba(230,245,255,0.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, TAU); ctx.stroke();
      const oa = time * 1.4;
      ctx.fillStyle = 'rgb(80,170,255)';
      ctx.beginPath(); ctx.arc(Math.cos(oa) * r * 1.6, Math.sin(oa) * r * 1.6, r * 0.16, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(Math.cos(oa + Math.PI) * r * 1.6, Math.sin(oa + Math.PI) * r * 1.6, r * 0.16, 0, TAU); ctx.fill();
    }
    if (kind === 'lock') { // single matching color
      ctx.strokeStyle = 'rgb(80,170,255)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, TAU); ctx.stroke();
      const oa = time * 1.4;
      ctx.fillStyle = 'rgb(80,170,255)';
      ctx.beginPath(); ctx.arc(Math.cos(oa) * r * 1.6, Math.sin(oa) * r * 1.6, r * 0.16, 0, TAU); ctx.fill();

}
// victory sweep: a cleansing wave rolls from the ring to the horizon and the
// whole tunnel settles into a "cleared" calm behind it
function drawClearSweep(g) {
  if ((state !== S.END && !replaying) || !endWin || endSweep < 0) return;
  const zS = Math.min(endSweep, SPAWN_Z);
  const rg = ring(zS, g);
  const washT = clamp((endSweep - g.hitZ) / (SPAWN_Z - g.hitZ), 0, 1);
  // the WASH: everything behind the front stays green — the line is secure.
  // Breathes very slightly so it reads as a live field, not a color filter.
  const br = 1 + Math.sin(time * 1.6) * 0.06;
  const grad = ctx.createRadialGradient(g.cx, g.cy, Math.max(1, rg.r), g.cx, g.cy, Math.max(W, H) * 0.8);
  grad.addColorStop(0, `rgba(126,226,98,${(0.24 * br * (0.6 + washT * 0.4)).toFixed(3)})`);
  grad.addColorStop(0.45, `rgba(120,225,150,${(0.13 * br).toFixed(3)})`);
  grad.addColorStop(1, 'rgba(120,225,150,0.05)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // secured hoops: calm green rings drifting through the washed zone
  ctx.lineCap = 'butt';
  for (let i = 0; i < 5; i++) {
    const zq = ((i / 5 + time * 0.045) % 1) * zS;
    if (zq < 0.03) continue;
    const hr = ring(zq, g);
    ctx.strokeStyle = `rgba(160,255,170,${(0.10 * (1 - zq / SPAWN_Z)).toFixed(3)})`;
    ctx.lineWidth = Math.max(0.8, hr.r / g.nodeR * 1.6);
    ctx.beginPath(); ctx.arc(g.cx, g.cy, hr.r, 0, TAU); ctx.stroke();
  }
  // clean-traffic motes: sparse green packets drifting home through the bore
  ctx.fillStyle = 'rgba(200,255,200,0.75)';
  for (let i = 0; i < 10; i++) {
    const zq = ((i * 0.617 + time * 0.06) % 1) * zS;
    if (zq < 0.05) continue;
    const mrr = ring(zq, g);
    const ma = i * 2.399 + time * 0.1;
    const rr2 = mrr.r * (0.35 + (i % 4) * 0.16);
    ctx.beginPath();
    ctx.arc(g.cx + Math.cos(ma) * rr2, g.cy + Math.sin(ma) * rr2, Math.max(0.7, mrr.s * 4), 0, TAU);
    ctx.fill();
  }
  if (endSweep < SPAWN_Z) {
    // bright wake trailing right behind the front — fresh wash
    for (let k = 1; k <= 4; k++) {
      const zw = zS - k * 0.09;
      if (zw <= 0.02) continue;
      const wr = ring(zw, g);
      ctx.strokeStyle = `rgba(150,240,140,${(0.30 * (1 - k / 5)).toFixed(2)})`;
      ctx.lineWidth = Math.max(1.5, 10 * wr.s * 3 * (1 - k / 6));
      ctx.beginPath(); ctx.arc(g.cx, g.cy, wr.r, 0, TAU); ctx.stroke();
    }
    // the wavefront itself
    ctx.lineCap = 'round';
    for (const [w2, col] of [
      [22, 'rgba(126,226,98,0.30)'],
      [8, 'rgba(126,226,98,0.65)'],
      [3, 'rgba(240,255,235,0.95)']
    ]) {
      ctx.lineWidth = Math.max(1, w2 * rg.s * 3);
      ctx.strokeStyle = col;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, rg.r, 0, TAU); ctx.stroke();
    }
  }
}

function drawInfoCard() {
  const c = INFO_CARDS[infoCard];
  if (!c) return;
  const g = geo();
  // ZOOM in, ZOOM out — the disc flies up to the operator and back away
  const inQ = clamp((time - infoShownAt) / 0.28, 0, 1);
  const outQ = infoOutAt ? clamp((time - infoOutAt) / 0.18, 0, 1) : 0;
  const pop = 1 - Math.pow(1 - inQ, 3);
  ctx.save();
  ctx.globalAlpha = Math.min(pop, 1 - outQ);
  // gentle dim — drawn UNSCALED so the field dims evenly while the disc flies
  ctx.fillStyle = 'rgba(3,6,14,0.45)'; ctx.fillRect(0, 0, W, H);
  const bk = 1.70158; // ease-out-back: the zoom lands with a breath of overshoot
  const zin = 1 + (bk + 1) * Math.pow(inQ - 1, 3) + bk * Math.pow(inQ - 1, 2);
  const sc2 = (0.3 + 0.7 * zin) * (1 - 0.75 * outQ * outQ);
  ctx.translate(g.cx, g.cy); ctx.scale(sc2, sc2); ctx.translate(-g.cx, -g.cy);
  const R = g.nodeR * 0.9;
  const maxW = g.nodeR * 2 * 0.6; // text never wider than 60% of the ring
  const bg = ctx.createRadialGradient(g.cx, g.cy, R * 0.25, g.cx, g.cy, R);
  bg.addColorStop(0, 'rgba(6,11,24,0.93)');
  bg.addColorStop(0.82, 'rgba(5,9,20,0.88)');
  bg.addColorStop(1, 'rgba(5,9,20,0)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, R, 0, TAU); ctx.fill();
  // tech border: thin ring with four drifting accent arcs
  ctx.strokeStyle = 'rgba(120,200,255,0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(140,230,255,0.75)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    const a = k / 4 * TAU + Math.PI / 4 + time * 0.15;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, a - 0.22, a + 0.22); ctx.stroke();
  }
  // shrink type until it honors the width budget
  const fit = (weight, px2, text) => {
    let fs = px2 + 1;
    do { fs--; ctx.font = weight + ' ' + fs + 'px Audiowide, system-ui'; }
    while (fs > 8 && ctx.measureText(text).width > maxW);
    return fs;
  };
  const isStory = /^story/.test(infoCard);
  ctx.textAlign = 'center';
  if (isStory) drawStoryDisc(c, g, R);
  else { // FIELD BRIEFING: a threat model, named, with its drill
    try { ctx.letterSpacing = '3px'; } catch (e) {}
    ctx.fillStyle = 'rgba(140,210,255,0.7)';
    fit('700', 11, 'FIELD BRIEFING');
    ctx.fillText('FIELD BRIEFING', g.cx, g.cy - R * 0.64);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    drawInfoGlyph(infoCard, g.cx, g.cy - R * 0.33, Math.min(R * 0.16, 40));
    ctx.fillStyle = '#eafaff';
    try { ctx.letterSpacing = '2px'; } catch (e) {}
    fit('800', 22, c.title);
    ctx.fillText(c.title, g.cx, g.cy + R * 0.06);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    ctx.fillStyle = 'rgba(190,225,255,0.88)';
    const cl = c.lines || [];
    let lf = 15;
    do { lf--; ctx.font = '500 ' + lf + 'px Audiowide, system-ui'; }
    while (lf > 8 && Math.max(0, ...cl.map(l => ctx.measureText(l).width)) > maxW);
    cl.forEach((ln, i) => ctx.fillText(ln, g.cx, g.cy + R * 0.2 + i * (lf + 3)));
  }
  // a mission disc spends its middle on art and readings, so the hint sits lower
  // and quieter — down where the disc has narrowed to little else
  const tapY = g.cy + R * (isStory ? 0.79 : 0.66);
  ctx.fillStyle = 'rgba(140,230,255,' + (0.5 + Math.sin(time * 4) * 0.3).toFixed(2) + ')';
  try { ctx.letterSpacing = isStory ? '2px' : '3px'; } catch (e) {}
  fit('700', isStory ? 9 : 12, 'TAP TO CONTINUE');
  ctx.fillText('TAP TO CONTINUE', g.cx, tapY);
  if (gpSeen) drawPadHint(g.cx + ctx.measureText('TAP TO CONTINUE').width / 2 + 22, tapY - 4, 'A');
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.textAlign = 'left';
  ctx.restore();
}

// break a sentence to a pixel width under the CURRENT font — returns the rows
// rather than drawing them, so a caller can size a panel to its own text
function wrapRows(text, maxW) {
  const rows = [];
  let line = '';
  for (const w of String(text).split(/\s+/)) {
    if (!w) continue;
    const test = line ? line + ' ' + w : w;
    if (line && ctx.measureText(test).width > maxW) { rows.push(line); line = w; }
    else line = test;
  }
  if (line) rows.push(line);
  return rows;
}

// ---- the mission disc ----
// The keyframe fills the disc wall to wall, masked by the disc itself — the same
// treatment the case-file carousel gives a campaign's map image. The plot line
// rides a caption bar across the art's lower edge, full disc width. Below the
// art, two readings of what you're flying into. One thing said per mission; the
// in-run comms carry the scene from here.
function drawStoryDisc(c, g, R) {
  const li = +infoCard.slice(5);
  const L = LEVELS[li];
  const Rc = R * 0.965;              // the mask: just inside the border ring
  const artB = g.cy + R * 0.34;      // the art's bottom edge
  const half = y => Math.sqrt(Math.max(1, Rc * Rc - y * y)); // the chord, half-width
  // measure the plot line FIRST — the caption bar is sized by its own wrap, and
  // its width is the disc's chord at the bar's lowest point, not a panel edge
  const body = c.line || (c.lines || []).join(' ');
  let ls = Math.max(10, Math.min(16, Math.round(R * 0.095))), rows = [], tw = 0;
  for (;;) {
    ctx.font = '500 ' + ls + 'px Audiowide, system-ui';
    tw = half(R * 0.34) * 2 - R * 0.16;
    rows = wrapRows(body, tw);
    if (rows.length <= 2 || ls <= 9) break;
    ls--;
  }
  const lh = ls + 5, bh = rows.length * lh + 16;
  const aTop = g.cy - Rc, aH = artB - aTop;
  ctx.save();
  ctx.beginPath(); ctx.arc(g.cx, g.cy, Rc, 0, TAU); ctx.clip();
  const im = discArtImg(L);
  if (im) { // cover-fit the keyframe across the full disc width
    const s = Math.max(Rc * 2 / im.w, aH / im.h);
    ctx.drawImage(im.img, g.cx - im.w * s / 2, aTop + aH / 2 - im.h * s / 2, im.w * s, im.h * s);
  } else { // no keyframe on disk yet — the relay's own tint stands in
    const tint = (L && L.tint) || '80,160,255';
    const wg = ctx.createLinearGradient(g.cx, aTop, g.cx, artB);
    wg.addColorStop(0, 'rgba(' + tint + ',0.34)');
    wg.addColorStop(1, 'rgba(4,9,20,0.95)');
    ctx.fillStyle = wg; ctx.fillRect(g.cx - Rc, aTop, Rc * 2, aH);
    drawInfoGlyph(infoCard, g.cx, aTop + (aH - bh) * 0.5, Math.min(aH * 0.16, 30));
  }
  // the grade the ENGINE adds, so 40 authored keyframes read as one show: the
  // relay's tint, scanlines, a vignette. Art ships clean — see the disc spec.
  if (L && L.tint) { ctx.fillStyle = 'rgba(' + L.tint + ',0.13)'; ctx.fillRect(g.cx - Rc, aTop, Rc * 2, aH); }
  ctx.fillStyle = 'rgba(2,6,14,0.22)';
  for (let sy = aTop + (Math.floor(time * 8) % 3); sy < artB; sy += 3) ctx.fillRect(g.cx - Rc, sy, Rc * 2, 1);
  const vg = ctx.createRadialGradient(g.cx, aTop + aH * 0.42, aH * 0.3, g.cx, aTop + aH * 0.42, Rc * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(2,5,12,0.62)');
  ctx.fillStyle = vg; ctx.fillRect(g.cx - Rc, aTop, Rc * 2, aH);
  // the caption bar rides the art's lower edge, full disc width — the mask gives
  // it curved ends, so it reads as part of the disc rather than a floating panel
  const bTop = artB - bh;
  const cg = ctx.createLinearGradient(g.cx, bTop, g.cx, artB);
  cg.addColorStop(0, 'rgba(3,7,16,0.80)');
  cg.addColorStop(0.35, 'rgba(3,7,16,0.94)');
  cg.addColorStop(1, 'rgba(3,7,16,0.94)');
  ctx.fillStyle = cg; ctx.fillRect(g.cx - Rc, bTop, Rc * 2, bh);
  ctx.restore();
  // the art covered the disc's rim — lay the ring and its accent arcs back over
  ctx.strokeStyle = 'rgba(120,200,255,0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(140,230,255,0.75)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    const a = k / 4 * TAU + Math.PI / 4 + time * 0.15;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, a - 0.22, a + 0.22); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(140,230,255,0.20)'; ctx.lineWidth = 1; // art meets caption
  ctx.beginPath();
  ctx.moveTo(g.cx - half(artB - g.cy), artB - 0.5);
  ctx.lineTo(g.cx + half(artB - g.cy), artB - 0.5);
  ctx.stroke();
  // the line types itself in, teletype ticking under it
  let budget = Math.max(0, Math.floor((time - infoShownAt - 0.25) * 46));
  const total = body.length;
  const shown = Math.min(budget, total);
  if (shown !== typeN && shown < total) {
    if (shown % 2 === 0) tone(1900 + (shown % 5) * 60, 0.012, 'square', 0.022);
    typeN = shown;
  }
  ctx.font = '500 ' + ls + 'px Audiowide, system-ui';
  ctx.fillStyle = 'rgba(222,242,255,0.96)';
  let cursorPlaced = false;
  rows.forEach((ln, i) => {
    const take = Math.max(0, Math.min(ln.length, budget));
    budget -= ln.length + 1; // the wrap ate a space
    let cursor = '';
    if (!cursorPlaced && take < ln.length) { cursor = '▌'; cursorPlaced = true; }
    ctx.fillText(ln.slice(0, take) + cursor, g.cx, bTop + 9 + ls + i * lh);
  });
  if (!L) return;
  // the readings: the number, its name under it in a quieter size
  const numY = artB + R * 0.17, labY = numY + R * 0.10;
  const numPx = Math.max(11, Math.round(R * 0.105));
  const labPx = Math.max(7, Math.round(R * 0.055));
  const colX = R * 0.38;
  const stat = (dx, num, label, col) => {
    ctx.font = '700 ' + numPx + 'px Audiowide, system-ui';
    ctx.fillStyle = col;
    ctx.fillText(num, g.cx + dx, numY);
    try { ctx.letterSpacing = '0.5px'; } catch (e) {}
    ctx.font = '700 ' + labPx + 'px Audiowide, system-ui';
    ctx.fillStyle = 'rgba(146,192,232,0.68)';
    ctx.fillText(label, g.cx + dx, labY);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
  };
  stat(-colX, Math.round(L.duration) + 's', 'FIBER LENGTH', 'rgba(230,246,255,0.94)');
  stat(colX, String(levelThreats(L, li)), 'DETECTED THREATS', 'rgba(255,210,74,0.96)');
}

// TAP TO FIRE rides the charged pad during the hold
// a tutorial label that rides an enemy's ANGLE but stays clear of the bore
// center: placed just outside the body, but never nearer than minR to the
// axis, so a deep (near-center) enemy's label can't collide with the title
function drawRideLabel(text, en, col) {
  const g2 = geo();
  const rg2 = ring(Math.max(en.z, 0.02), g2);
  const off = Math.min(W, H) * (0.075 + Math.sin(time * 4) * 0.006);
  const R = Math.max(rg2.r + off, Math.min(W, H) * 0.26);
  drawTutText(text, g2.cx + Math.cos(en.angle) * R, g2.cy + Math.sin(en.angle) * R,
    col, Math.round(Math.min(W, H) * 0.028));
}
function drawTutText(text, x, y, col, px) { // one pulsing outlined line
  ctx.save();
  ctx.font = '700 ' + px + 'px Audiowide, system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.8 + Math.sin(time * 5) * 0.2;
  ctx.strokeStyle = 'rgba(2,4,12,0.85)'; ctx.lineWidth = 4;

  ctx.fillStyle = col;

  ctx.restore();
}

// the gesture ghost: a comet laps the dial rim in the drill direction — it
// teaches the THUMB MOTION itself, not just the goal (blue clockwise, white
// counter, matching the lap meters)
function drawDialComet(i, dir) {
  const d = dialCenter(i === 0 ? 'L' : 'R');
  const w = dir || (i === 0 ? 1 : -1);
  const col = NODE_COLS[i];
  const a = -Math.PI / 2 + time * 2.2 * w;
  for (let k = 0; k < 7; k++) {
    const ta = a - w * k * 0.11;
    ctx.globalAlpha = (1 - k / 7) * 0.75;
    ctx.fillStyle = 'rgba(' + col + ',1)';
    ctx.beginPath();
    ctx.arc(d.x + Math.cos(ta) * d.r, d.y + Math.sin(ta) * d.r, Math.max(1.5, 4.5 - k * 0.55), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// marching dashed arc from a node toward the tutorial trap, with an arrowhead.
// col overrides the node's color — barriers guide in NEUTRAL cyan because
// either node may take either end; a colored lead would read as an assignment
function drawGuideArc(n, targetA, col) {
  const g2 = geo();
  const rr = g2.nodeR - Math.min(W, H) * 0.055 * 2.0;
  const d = angDiff(targetA, n.angle);
  if (Math.abs(d) < 0.3) return; // close enough — no guide needed
  const dir = Math.sign(d);
  const a0 = n.angle + dir * 0.12, a1 = n.angle + d * 0.82;
  const blue = n === nodes[0]; // arc wears its node's color so pupils know whose lead it is
  ctx.save();
  ctx.strokeStyle = col || (blue ? 'rgba(95,150,255,0.9)' : 'rgba(255,255,255,0.8)');
  ctx.lineWidth = 3;
  ctx.setLineDash([9, 9]);
  ctx.lineDashOffset = -time * 60 * dir;
  ctx.beginPath(); ctx.arc(g2.cx, g2.cy, rr, a0, a1, dir < 0); ctx.stroke();
  ctx.setLineDash([]);
  const hx = g2.cx + Math.cos(a1) * rr, hy = g2.cy + Math.sin(a1) * rr;
  ctx.translate(hx, hy); ctx.rotate(a1 + dir * Math.PI / 2);
  ctx.fillStyle = col || (blue ? 'rgba(150,190,255,0.95)' : 'rgba(255,255,255,0.95)');
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// QUALIFIED ceremony: lock-in pulses ripple out from the bore and the stamp
// settles in — the boot ceremony's language, closing the loop it opened
function drawQualCeremony(t) {
  const g2 = geo();
  for (const [d, col] of [[0, '140,230,255'], [0.35, '255,255,255']]) {
    const q = clamp((t - d) / 1.1, 0, 1);
    if (q <= 0 || q >= 1) continue;
    ctx.strokeStyle = 'rgba(' + col + ',' + (0.5 * (1 - q)).toFixed(2) + ')';
    ctx.lineWidth = 3 - q * 2;
    ctx.beginPath(); ctx.arc(g2.cx, g2.cy, g2.nodeR * (1 + q * 0.75), 0, TAU); ctx.stroke();
  }
  const q2 = clamp((t - 0.3) / 0.5, 0, 1);
  if (q2 <= 0) return;
  const s = 1 + 0.5 * Math.pow(1 - q2, 2); // stamps down from oversized
  const al = q2 * (t > 2.9 ? clamp((3.4 - t) / 0.5, 0, 1) : 1);
  ctx.save();
  ctx.translate(g2.cx, g2.cy); ctx.scale(s, s);
  ctx.textAlign = 'center';
  try { ctx.letterSpacing = '6px'; } catch (e) {}
  const fs = fitPx('QUALIFIED', 700, Math.round(g2.nodeR * 0.30), g2.nodeR * 1.7, 12);
  ctx.font = '700 ' + fs + 'px Audiowide, system-ui';
  ctx.shadowColor = 'rgba(120,225,255,0.8)'; ctx.shadowBlur = 22 * al;
  ctx.fillStyle = 'rgba(228,249,255,' + al.toFixed(2) + ')';
  ctx.fillText('QUALIFIED', 0, -fs * 0.1);
  ctx.shadowBlur = 0;
  try { ctx.letterSpacing = '2px'; } catch (e) {}
  ctx.font = '700 ' + Math.max(9, Math.round(fs * 0.32)) + 'px Audiowide, system-ui';
  ctx.fillStyle = 'rgba(150,215,240,' + (al * 0.9).toFixed(2) + ')';
  ctx.fillText('THE LANE IS YOURS TO CLEAR', 0, fs * 0.72);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.textAlign = 'left';
  ctx.restore();
}

// tutorial dock spot: a half-blue/half-white disc on the rim where BOTH
// nodes must meet — the heavy drill's destination, split like its crew
function drawDockSpot(a) {
  const g2 = geo();
  const px = g2.cx + Math.cos(a) * g2.nodeR, py = g2.cy + Math.sin(a) * g2.nodeR;

// tutorial parking spot: a dashed ring on the rim in the color of the node

function drawParkSpot(a, col) {

// mini landing signal for tutorial node killers, in the rim wall's hazard
// language: once a defender has been fried by one, killers telegraph the arc
// they'll land on — the drill becomes DODGE, not decode
function drawKillerSignal(e) {
  const g2 = geo();
  const near = 1 - clamp((e.z - 1) / (SPAWN_Z - 1), 0, 1); // 0 far → 1 landing
  const span = 0.13, blink = 0.5 + 0.5 * Math.sin(time * 9);

  ctx.strokeStyle = 'rgba(255,150,60,' + ((0.35 + 0.45 * near) * (0.55 + 0.45 * blink)).toFixed(2) + ')';
  ctx.lineWidth = 4;
  ctx.setLineDash([6, 5]);
  ctx.lineDashOffset = -time * 30;
  ctx.beginPath(); ctx.arc(g2.cx, g2.cy, g2.nodeR, e.angle - span, e.angle + span); ctx.stroke();
  ctx.restore();
}

// one audio channel row: label · angular toggle · tick-marked slider (shared by pause + menu)
function settingRow(label, key, volKey, y, px, pw, tox) {
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(160,225,255,0.95)';
  try { ctx.letterSpacing = '2px'; } catch (e) {}
  ctx.font = '700 12px Audiowide, system-ui';
  ctx.fillText(label, px + 24, y + 4);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  // angular toggle slab — column sits clear of the widest Audiowide label
  const tx = px + (tox || 162), tw = 52, th = 24, on = settings[key];
  techRect(tx, y - th / 2, tw, th, 6);
  ctx.fillStyle = on ? 'rgba(40,140,210,0.55)' : 'rgba(255,255,255,0.06)'; ctx.fill();
  ctx.strokeStyle = on ? 'rgba(140,230,255,0.8)' : 'rgba(120,180,255,0.3)'; ctx.lineWidth = 1.5;
  techRect(tx, y - th / 2, tw, th, 6); ctx.stroke();
  const ks = th - 9;
  ctx.fillStyle = on ? '#dff6ff' : 'rgba(160,190,230,0.45)';
  ctx.fillRect(on ? tx + tw - ks - 4.5 : tx + 4.5, y - ks / 2, ks, ks);
  pauseTogglesList.push({ x: tx, y: y - th / 2, w: tw, h: th, key });
  if (!volKey) return; // toggle-only row (e.g. haptics)
  // volume rail with depth ticks and a diamond cursor
  const sx = tx + tw + 26, sw2 = px + pw - 36 - sx;
  ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(120,200,255,0.16)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + sw2, y); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,200,255,0.35)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 8; i++) {
    const tx2 = sx + sw2 * i / 8;
    ctx.beginPath(); ctx.moveTo(tx2, y + 6); ctx.lineTo(tx2, y + 10); ctx.stroke();
  }
  const v = settings[volKey];
  ctx.strokeStyle = on ? 'rgba(111,227,255,0.9)' : 'rgba(120,150,200,0.3)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + sw2 * v, y); ctx.stroke();
  ctx.save();
  ctx.translate(sx + sw2 * v, y); ctx.rotate(Math.PI / 4);
  ctx.fillStyle = on ? '#eafaff' : 'rgba(200,210,230,0.5)';
  ctx.fillRect(-6, -6, 12, 12);
  ctx.strokeStyle = on ? 'rgba(111,227,255,0.9)' : 'rgba(160,190,230,0.4)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(-6, -6, 12, 12);
  ctx.restore();
  ctx.lineCap = 'round';
  pauseSlidersList.push({ x: sx, y, w: sw2, key: volKey });
}
// shared toggle/slider hit test — returns true if the tap landed on a control
function settingsTap(x, y, pid) {
  for (const t of pauseTogglesList) {
    if (x > t.x - 8 && x < t.x + t.w + 8 && y > t.y - 8 && y < t.y + t.h + 8) {
      settings[t.key] = !settings[t.key];
      applySettings(); pressUI(t); return true;
    }
  }
  for (const s of pauseSlidersList) {
    if (x > s.x - 14 && x < s.x + s.w + 14 && Math.abs(y - s.y) < 20) {
      settings[s.key] = clamp((x - s.x) / s.w, 0, 1); applySettings();
      pauseDrag[pid] = s; return true;
    }
  }
  return false;
}

// ---------- popup glitch-build (the panel de-rezzes IN, like a decompiled body) --
// Reuses the run's decompile language (see drawGhost): while a panel opens or
// closes it renders to an offscreen buffer and blits back as horizontal strips
// that fly in from a sideways offset, flicker, and lock — the reverse of an
// enemy tearing apart. q eases 0..1 toward the panel's open flag; at q>=1 the
// panel draws straight to screen, crisp. Drawers wrap their panel body in
// popRender(); the full-screen dim stays outside it (never glitched).
const POPFX = {};
const POP_STRIPS = 22;           // horizontal slices the panel resolves in as
// deterministic per-index noise — NO Math.random(): draw must not touch the
// seeded sim stream (a panel can be dissolving during a live PLAY frame).
const popFrac = n => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };
function popFxQ(key, flag) {
  const e = POPFX[key] || (POPFX[key] = { q: 0 });
  e.q = clamp(e.q + (flag ? 1 : -1) * frameDt / 0.26, 0, 1); // ~0.26s each way — a touch longer so the build reads
  return e.q;
}
const popLive = key => !!POPFX[key] && POPFX[key].q > 0;
function popReset() { for (const k in POPFX) POPFX[k].q = 0; } // hard-clear so a panel can't linger open across a state change

let popBuf = null; // offscreen the panel is captured into during the transition
function popEnsureBuf() { // sized to DEVICE pixels so captured text stays crisp on retina
  const w = Math.max(1, Math.ceil(W * DPR)), h = Math.max(1, Math.ceil(H * DPR));
  if (!popBuf) popBuf = document.createElement('canvas');
  if (popBuf.width !== w || popBuf.height !== h) { popBuf.width = w; popBuf.height = h; }
  return popBuf;
}
// Draw `content` (the panel's crisp pixels, in game-space coords) and present it
// with the glitch build/dissolve. px,py,pw,ph bound the panel; a margin captures
// borders + edge glow. At q>=1 content() is drawn straight to screen (crisp).
function popRender(q, px, py, pw, ph, content) {
  if (q >= 1) { content(); return; }                 // settled — no glitch, full sharpness
  const M = 22;                                       // capture margin for borders / edge bars
  const rx = Math.max(0, Math.floor(px - M)), ry = Math.max(0, Math.floor(py - M));
  const rw = Math.min(Math.ceil(W) - rx, Math.ceil(pw + M * 2)), rh = Math.min(Math.ceil(H) - ry, Math.ceil(ph + M * 2));
  const buf = popEnsureBuf(), b = buf.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);               // panel painted in game coords at device resolution (crisp)
  b.clearRect(rx, ry, rw, rh);
  const prev = ctx; ctx = b;                          // redirect the panel painters into the buffer
  try { content(); } finally { ctx = prev; }
  // content() ALSO registers the panel's tap targets, so it must run every frame
  // the panel is drawn — including the opening/closing frames where q≤0 (the
  // caller clears its hit-lists at the top and repopulates them in content). Only
  // the visible blit below is gated on q>0, so a closed panel shows nothing.
  if (q <= 0) return;
  // blit back as strips: each flies in from a sideways offset, flickers, and locks.
  // source rects are in DEVICE px (buf space); dest rects in game px (main ctx scales them).
  const n = POP_STRIPS, sh = rh / n, D = DPR;
  for (let i = 0; i < n; i++) {
    const t0 = popFrac(i + 1) * 0.5;                  // scrambled start; wide overlap = smooth stream, not a sweep
    const a = clamp((q - t0) / 0.5, 0, 1);            // 0 = not yet, 1 = locked
    if (a <= 0) continue;
    const ease = 1 - Math.pow(1 - a, 3);              // ease-out cubic: strips decelerate into place
    const dir = popFrac(i * 3.7) < 0.5 ? -1 : 1;      // fly in from alternating sides
    const jx = (1 - ease) * dir * rw * 0.55;          // sideways offset collapses to 0
    const fl = a < 0.92 ? (0.55 + 0.45 * popFrac(i * 5.1 + Math.floor(time * 32))) : 1; // flicker only mid-flight
    const sy = ry + i * sh, srcY = sy * D, srcH = sh * D, srcX = rx * D, srcW = rw * D;
    ctx.save();
    // chromatic fringe while travelling — a doubled ghost + cyan/magenta edges, fading as it locks
    const split = (1 - ease) * 9;
    if (split > 0.6) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = ease * fl * 0.45;
      ctx.drawImage(buf, srcX, srcY, srcW, srcH, rx + jx - split, sy, rw, sh);
      ctx.drawImage(buf, srcX, srcY, srcW, srcH, rx + jx + split, sy, rw, sh);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(0,200,255,0.35)';  ctx.fillRect(rx + jx - split, sy, 2, sh);
      ctx.fillStyle = 'rgba(255,40,120,0.32)'; ctx.fillRect(rx + jx + rw - 2 + split, sy, 2, sh);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = ease * fl;
    ctx.drawImage(buf, srcX, srcY, srcW, srcH, rx + jx, sy, rw, sh); // the strip itself
    if (a < 0.85) { // a hot leading edge rides each strip mid-flight (the print head)
      ctx.globalAlpha = (1 - a) * 0.7;
      ctx.fillStyle = 'rgba(160,245,255,0.9)';
      ctx.fillRect(rx + jx, sy, rw, 1.4);
    }
    ctx.restore();
  }
}

function drawPause() {
  const q = popFxQ('pause', state === S.PAUSE);
  pauseButtonsList = []; pauseSlidersList = []; pauseTogglesList = [];
  ctx.fillStyle = 'rgba(3,6,14,' + (0.78 * q).toFixed(2) + ')'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W * 0.74, 540), ph = Math.min(H * 0.86, 300);
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  popRender(q, px, py, pw, ph, () => {
    ctx.save();
    techPanel(px, py, pw, ph, 'SYSTEM PAUSED');
    // the FIELD GUIDE key rides the header bar — one tap away
    const gk = { x: px + pw - 44, y: py + 6, w: 30, h: 20, action: 'guide', cut: 5 };
    techRect(gk.x, gk.y, gk.w, gk.h, 5);
    ctx.fillStyle = 'rgba(30,120,190,0.30)'; ctx.fill();
    ctx.strokeStyle = 'rgba(140,230,255,0.75)'; ctx.lineWidth = 1.2;
    techRect(gk.x, gk.y, gk.w, gk.h, 5); ctx.stroke();
    ctx.fillStyle = '#dff6ff'; ctx.font = '700 12px Audiowide, system-ui'; ctx.textAlign = 'center';
    ctx.fillText('?', gk.x + gk.w / 2, gk.y + 14.5);
    ctx.textAlign = 'left';
    settingRow('SFX',        'sound',     'soundVol', py + 70,  px, pw);
    settingRow('MUSIC',      'music',     'musicVol', py + 108, px, pw);
    settingRow('HAPTICS',    'haptics',   null,       py + 146, px, pw);
    // TRACK: the run's music, named and skippable — the only place the player can
    // change it, because here the world is frozen and a mistap costs nothing. (It
    // took the slot a decorative console readout used to hold.)
    const trkRow = typeof runTrack === 'number' && trackCount() > 1 ? py + 188 : 0;
    if (trkRow) {
      ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(160,225,255,0.95)';
      try { ctx.letterSpacing = '2px'; } catch (e) {}
      ctx.font = '700 12px Audiowide, system-ui';
      ctx.fillText('TRACK', px + 24, trkRow + 4);
      try { ctx.letterSpacing = '0px'; } catch (e) {}
      const kw = 30, kh = 24, kx0 = px + 162, kx1 = px + pw - 36 - kw;
      for (const [kx, glyph] of [[kx0, '◀'], [kx1, '▶']]) {
        techRect(kx, trkRow - kh / 2, kw, kh, 6);
        ctx.fillStyle = 'rgba(40,140,210,0.35)'; ctx.fill();
        ctx.strokeStyle = 'rgba(140,230,255,0.7)'; ctx.lineWidth = 1.5;
        techRect(kx, trkRow - kh / 2, kw, kh, 6); ctx.stroke();
        ctx.fillStyle = '#dff6ff'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
        ctx.fillText(glyph, kx + kw / 2, trkRow + 4);
      }
      const nx0 = kx0 + kw + 8, nw = kx1 - 8 - nx0;
      const nm = trackName(runTrack) || 'TRACK ' + (runTrack + 1);
      ctx.textAlign = 'center';
      ctx.font = '700 ' + fitPx(nm, '700', 12, nw, 8) + 'px Audiowide, system-ui';
      ctx.fillStyle = settings.music ? 'rgba(234,250,255,0.95)' : 'rgba(150,180,210,0.45)';
      ctx.fillText(nm, nx0 + nw / 2, trkRow + 4);
      ctx.textAlign = 'left';
    }

    const bh = 44, gap = 12, bw = (pw - 48 - gap * 2) / 3;
    let bx = px + 24; const by = py + ph - bh - 20;
    [['RESUME', 'resume', true], ['RESTART', 'restart', false], ['QUIT', 'menu', false]].forEach(([label, action, primary]) => {
      button(bx, by, bw, bh, label, primary);
      pauseButtonsList.push({ x: bx, y: by, w: bw, h: bh, action, cut: Math.min(12, bh * 0.28) });
      bx += bw + gap;
    });
    // registered AFTER the three main keys so RESUME keeps the pad focus
    pauseButtonsList.push(gk);
    if (trkRow) {
      const kw = 30, kh = 24;
      pauseButtonsList.push({ x: px + 162, y: trkRow - kh / 2, w: kw, h: kh, action: 'trkPrev', cut: 6 });
      pauseButtonsList.push({ x: px + pw - 36 - kw, y: trkRow - kh / 2, w: kw, h: kh, action: 'trkNext', cut: 6 });

// step the run's soundtrack by hand. Walks the pool in order (not the bag) so
// ◀/▶ are predictable, and drops any free-flow preload — the seam is now measured
// from THIS take, not the one the player just left.
function skipTrack(dir) {
  const n = trackCount();
  if (typeof runTrack !== 'number' || n < 2) return;
  runTrack = ((runTrack + dir) % n + n) % n;
  dropPreload();
  playTrack(runTrack);
}
function pauseTap(x, y, pid) {
  if (settingsTap(x, y, pid)) return;
  for (const b of pauseButtonsList) {
    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) {
      pressUI(b);
      if (b.action === 'guide') { enterGuide('pause'); }
      else if (b.action === 'trkPrev' || b.action === 'trkNext') skipTrack(b.action === 'trkNext' ? 1 : -1);
      else if (b.action === 'resume') { state = S.PLAY; resumeHold = 0.9; resumeDigit = 0; }
      else if (b.action === 'restart') { if (qual) startQualification(); else if (daily) startDaily(); else if (endless) startEndless(); else startLevel(levelIdx); }
      else { // QUIT rides the same drive-back the end-screen MENU key uses
        daily = false; Math.random = sysRandom;
        // training lives in Story Mode now → zoom back out onto its disc
        if (qual) { menuScreen = 'camps'; campScroll = campScrollTgt = 0; campPendingSync = null; }
        else menuScreen = endless ? 'flow' : 'map';
        if (!endless && !qual) mapSel = Math.min(PROG.unlocked - 1, LEVELS.length - 1);
        state = S.MENU; fadeT = 0.35;
        menuFx = qual ? { kind: 'discOut', t: 0, dur: 0.55, disc: 0 } // the training disc recedes into its slot (reverse of the dive-in)
          : menuScreen === 'map' ? { kind: 'panelsIn', t: 0, dur: 0.6, dir: 1, zoom: true }
          : { kind: 'spinIn', t: 0, dur: 0.5, dir: 1, zoom: true };
      }
      return;
    }
  }
}

// ---------- FIELD GUIDE (S.GUIDE): one page — know your enemy ----------
// The pause header's ? key and the home screen's ? key open a single-screen
// lineup: every trap type rendered LIVE by the real body renderers, one line
// of guidance under each, and the volley tip at the foot. No navigation —
// tap anywhere (or Esc / B / START) to hand back to whoever opened it.
// wall geometry that lands a live body at (sx, sy): a ring of radius rr passes
// through the point at hitZ exactly (see geo()/ring()), so the real renderers
// paint the specimen "on the wall" of a little private bore
function archWallG(sx, sy, rr, a) {
  return { cx: sx - Math.cos(a) * rr, cy: sy - Math.sin(a) * rr, R0: rr * 2.5, nodeR: rr, hitZ: 0.25, sw: 0, swy: 0 };
}
const ARCH_SPECIMENS = {}; // cached caged bodies — their fx phase lives on them
function archBody(key, mk) { return ARCH_SPECIMENS[key] || (ARCH_SPECIMENS[key] = mk()); }
// drawEnemy sizes bodies off min(W,H) — the SCREEN — so a specimen would ignore
// its cell entirely and only the ring around it would grow. Rebase the scale on
// the cell radius (0.135·min side is the reference cell these k values were
// drawn against), so art and cage grow together.
const archArtK = (r, k) => k * r / (Math.min(W, H) * 0.135);
function archTapSpec(key, type, lock, cx, cy, r, k) {
  // mounted at the BOTTOM of the private bore (angle +π/2, axis above), so the
  // body reads floor-standing: drill rising into the bore, beam venting down
  const en = archBody(key, () => ({ type, lock, z: 0.25, z0: SPAWN_Z, angle: Math.PI / 2, arch: true,
    sizeMul: type === 'frag' ? 0.8 : type === 'heavy' ? 1.2 : 1, speedMul: 1,
    spin: 0, spinMul: 1, age: 9, dead: false, resolved: false, failed: false, partner: null }));
  en.spin = time * (type === 'heavy' ? 0.45 : 1);
  const g2 = archWallG(cx, cy, r * 2.4, Math.PI / 2);
  ctx.save();
  const s = archArtK(r, k);
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  drawEnemy(en, g2);
  ctx.restore();
}
// (the dashed containment ring is gone — it cost every specimen the room it
// enclosed, and the bodies read better at full size with their label beneath)
// the lineup — color IS the guidance, so each caption wears its type's ink
const GUIDE_ITEMS = [
  { cap: ['HIT WITH', 'ANY EMITTER'], col: '255,96,120',
    draw: (cx, cy, r) => archTapSpec('n1', 'normal', undefined, cx, cy, r, 0.5) },
  { cap: ['HIT WITH', 'BOTH EMITTERS'], col: '212,101,255',
    draw: (cx, cy, r) => archTapSpec('hv', 'heavy', undefined, cx, cy, r, 0.46) },
  { cap: ['HIT WITH', 'BLUE ⊕'], col: '80,170,255',
    draw: (cx, cy, r) => archTapSpec('lk0', 'normal', 0, cx, cy, r, 0.5) },
  { cap: ['HIT WITH', 'WHITE ⊖'], col: '235,245,255',
    draw: (cx, cy, r) => archTapSpec('lk1', 'normal', 1, cx, cy, r, 0.5) },
  { cap: ['DANGER!', 'STEER CLEAR'], col: '160,175,200',
    draw: (cx, cy, r) => archTapSpec('frag', 'frag', undefined, cx, cy, r, 0.95) },
  { cap: ['RIDE IT TO', 'CHARGE PULSE'], col: '255,210,74',
    draw: (cx, cy, r) => { // the ribbon in its true 3D form: a STATIC snake of
      // wall arcs receding into a private bore (real wallPatch projection),
      // with a ride-light sweeping it head-to-tail, letting go, and looping
      // the bore is offset so the ribbon it carries lands CENTRED in the cage,
      // like every other specimen (the strip only ever hangs below its axis)
      const g2 = { cx, cy: cy - r * 0.65, R0: r * 2.85, nodeR: r * 1.14, hitZ: 0.25, sw: 0, swy: 0 };
      const segs = 26, zN = 0.32, zF = 0.92;
      const T = 4, t = time % T;
      const front = clamp(t / 2.6, 0, 1);                       // the ride, head to tail
      const fadeOut = t < 2.7 ? 1 : clamp(1 - (t - 2.7) / 1.2, 0, 1); // then it lets go
      ctx.save();
      for (let s2 = 0; s2 < segs; s2++) {
        const p0 = s2 / segs, pm = (s2 + 0.5) / segs;
        const z0 = zN + p0 * (zF - zN), z1 = zN + (p0 + 1 / segs) * (zF - zN);
        const aMid = Math.PI / 2 + 0.4 * Math.sin((pm - 0.5) * 3.6); // fixed centered S — no drift
        wallPatch(g2, aMid, 0.26, z0, z1 + 0.02, 'rgba(255,180,40,1)', 0.42);
        const lit = clamp((front - p0) * 5, 0, 1) * fadeOut;
        if (lit > 0.02) {
          wallPatch(g2, aMid, 0.17, z0, z1 + 0.02, 'rgba(255,235,170,1)', lit);
          if (lit < 0.95) // the hot frontier — where the node is riding right now
            wallPatch(g2, aMid, 0.09, z0, z1 + 0.02, 'rgba(255,255,255,1)', (1 - lit) * fadeOut);
        }

    } },
];
let guideCloseRect = null;
function enterGuide(from) { guide = { from, t: 0, closing: 0 }; state = S.GUIDE; sfx.tick(); }
function closeGuide() {
  if (!guide || guide.closing) return;
  guide.closing = 1e-4;
  sfx.tick();
}
function guidePointer(P) { // one pager: any tap hands back (the X is an affordance)
  if (!guide || guide.closing || guide.t < 0.25) return;
  const c = guideCloseRect;
  if (c && P.x > c.x - 8 && P.x < c.x + c.w + 8 && P.y > c.y - 8 && P.y < c.y + c.h + 8) pressUI(c);
  closeGuide();
}
function drawGuide(g) {
  guideCloseRect = null;
  if (!guide) return;
  guide.t += frameDt; // UI clock — the sim never runs here
  if (guide.closing) {
    guide.closing += frameDt;
    if (guide.closing >= 0.18) { // hand back to whoever opened the page
      state = guide.from === 'pause' ? S.PAUSE : S.MENU;
      guide = null;
      return;
    }
  }
  const inQ = smoothT(clamp(guide.t / 0.28, 0, 1));
  const outQ = guide.closing ? clamp(guide.closing / 0.18, 0, 1) : 0;
  const master = Math.min(inQ, 1 - outQ);
  // gentle dim so the lineup reads over the live bore
  ctx.fillStyle = 'rgba(3,6,14,' + (0.62 * master).toFixed(2) + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  const sc2 = 0.9 + 0.1 * inQ - 0.06 * outQ; // a breath of zoom, briefing-disc style
  ctx.translate(W / 2, H / 2); ctx.scale(sc2, sc2); ctx.translate(-W / 2, -H / 2);
  ctx.globalAlpha = master;
  ctx.textAlign = 'center';
  // ---- layout: the page FILLS the safe rect. Nothing is pinned to a fixed
  // screen fraction — every size is grown until it hits the room actually
  // available, so a phone gets the largest lineup its glass can carry. ----
  const U = Math.min(W, H);
  const mL = 10 + SAFE.l, mR = 10 + SAFE.r, mT = 8 + SAFE.t, mB = 13 + SAFE.b;
  const n = GUIDE_ITEMS.length;
  const colW = (W - mL - mR) / n;
  const gap = Math.max(6, U * 0.03);
  // title: grows into the width the close key leaves clear on both flanks
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  const titlePx = fitPx('FIELD GUIDE // KNOW YOUR ENEMY', '700', Math.round(U * 0.055), W - 2 * (mL + 46), 10);
  const titleY = mT + titlePx;
  ctx.fillStyle = 'rgba(140,210,255,0.8)';
  ctx.font = '700 ' + titlePx + 'px Audiowide, system-ui';
  ctx.fillText('FIELD GUIDE // KNOW YOUR ENEMY', W / 2, titleY);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  // ONE caption size for the whole lineup: the widest line anywhere sets it, so
  // no item's guidance reads smaller than its neighbour's (measured WITH the
  // caption letter-spacing, since that's what the drawn width will carry)
  try { ctx.letterSpacing = '1px'; } catch (e) {}
  let capFs = Math.round(U * 0.06);
  for (const it of GUIDE_ITEMS)
    for (const ln of it.cap) capFs = Math.min(capFs, fitPx(ln, '700', capFs, colW - 8));
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  // foot: the tip fills the safe width, but never shouts over the guidance it
  // supports — the captions ARE the page. The dismiss hint tucks under it.
  const TIP = 'TIP: DOCK BOTH NODES TOGETHER TO FIRE A SHOT';
  try { ctx.letterSpacing = '2px'; } catch (e) {}
  const tipPx = fitPx(TIP, '700', Math.round(Math.min(U * 0.06, capFs * 1.35)), W - mL - mR, 9);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  const hintPx = clamp(Math.round(U * 0.028), 9, 15);
  const hintY = H - mB;
  const tipY = hintY - hintPx - gap * 0.9;
  // A plain row: specimen, its two lines underneath. With no ring drawn around
  // them the bodies answer only to their own footprint, so they take four
  // fifths of the column — the plates never meet, and the glows that do are
  // soft light. Height is the other ceiling: whatever the band leaves once the
  // captions have their two lines.
  const capH = capFs * 2 + 5;
  const capGap = gap * 0.6;
  const bandTop = titleY + gap, bandBot = tipY - tipPx - gap;
  const bandH = bandBot - bandTop;
  // a body is NOT a circle: the drill reaches high, the plate sits low. Budget
  // the two directions separately so the label tucks under the plate instead of
  // floating where a ring's rim used to be.
  const ART_UP = 0.85, ART_DN = 0.45;
  const cellR = Math.max(12, Math.min(colW * 0.85, U * 0.42,
    (bandH - capH - capGap) / (ART_UP + ART_DN)));
  const blockH = cellR * (ART_UP + ART_DN) + capGap + capH;
  const cyS = bandTop + (bandH - blockH) / 2 + cellR * ART_UP;
  const capY = cyS + cellR * ART_DN + capGap + capFs;
  const x0 = W / 2 - colW * n / 2;
  GUIDE_ITEMS.forEach((it, i) => {
    const cx = x0 + colW * (i + 0.5);
    it.draw(cx, cyS, cellR);
    ctx.textAlign = 'center';
    try { ctx.letterSpacing = '1px'; } catch (e) {}
    ctx.fillStyle = `rgb(${it.col})`;
    ctx.font = '700 ' + capFs + 'px Audiowide, system-ui';
    it.cap.forEach((ln, li) => ctx.fillText(ln, cx, capY + li * (capFs + 5)));
    try { ctx.letterSpacing = '0px'; } catch (e) {}
  });
  // the tip + the way out
  try { ctx.letterSpacing = '2px'; } catch (e) {}
  ctx.fillStyle = '#ffd24a';
  ctx.font = '700 ' + tipPx + 'px Audiowide, system-ui';
  ctx.fillText(TIP, W / 2, tipY);
  ctx.fillStyle = 'rgba(140,230,255,' + (0.45 + Math.sin(time * 4) * 0.25).toFixed(2) + ')';
  ctx.font = '700 ' + hintPx + 'px Audiowide, system-ui';
  ctx.fillText('TAP TO CONTINUE', W / 2, hintY);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.textAlign = 'left';
  ctx.restore();
  // close key (where the pause key lives in-run), steady outside the zoom
  ctx.save();
  ctx.globalAlpha = master;
  guideCloseRect = { x: 12 + SAFE.l, y: 12 + SAFE.t, w: 38, h: 38 };
  const ck = guideCloseRect;
  techRect(ck.x, ck.y, ck.w, ck.h, 8);
  ctx.fillStyle = 'rgba(6,20,40,0.6)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,220,255,0.55)'; ctx.lineWidth = 1.5;
  techRect(ck.x, ck.y, ck.w, ck.h, 8); ctx.stroke();
  ctx.strokeStyle = 'rgba(200,240,255,0.9)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ck.x + 13, ck.y + 13); ctx.lineTo(ck.x + 25, ck.y + 25);
  ctx.moveTo(ck.x + 25, ck.y + 13); ctx.lineTo(ck.x + 13, ck.y + 25);
  ctx.stroke();
  ctx.restore();
}


function drawStars(cx, cy, count, size, t) {
  for (let i = 0; i < 3; i++) {
    const x = cx + (i - 1) * size * 2.6;
    const on = i < count && t > 0.4 + i * 0.35;
    ctx.save();
    ctx.translate(x, cy);
    const pop = on ? 1 + Math.max(0, 0.5 - (t - (0.4 + i * 0.35))) * 1.2 : 1;

function drawMenuHome(ccx, ccy, R) {

  // bottom corners (training moved into Story Mode as its lead disc).

    { mode: 'campaign', name: 'STORY MODE', glyph: 'C', cap: 'the investigation · ' + LEVELS.length + ' relays',

  };

  // BOTTOM labels (flipped) INward, so a single radius offsets the two halves

// case-file carousel: every campaign is a DISC — a bore-ringed lens whose
// top third is the route map and whose lower two thirds carry the dossier —
// laid out in a horizontal, scrollable line. SYNC STREAM zooms the disc up
// into the tunnel and opens its relay map.
let campScroll = 0, campScrollTgt = 0; // disc index at stage center (eased)

const CAMPS_SOON = []; // teaser discs — all five campaigns now ship real
function drawMenuCamps(ccx, ccy, R) {
  // entry/exit: the row flies in from the LEFT on arrival and out to the
  // RIGHT on back — the mode wheel spins on the other side of the crossfade
  let rowOff = 0, rowAl = 1;
  if (menuFx && menuFx.kind === 'spinIn') { const q = clamp(menuFx.t / menuFx.dur, 0, 1); rowOff = W * 0.7 * Math.pow(1 - q, 2); rowAl = q; } // in from the RIGHT
  if (menuFx && menuFx.kind === 'spinOut') { const q = clamp(menuFx.t / menuFx.dur, 0, 1); rowOff = W * 0.7 * q * q; rowAl = 1 - q; }
  // sync zoom: the chosen disc swells into the tunnel; the rest fall away
  let zoomI = -1, zq = 0;
  if (menuFx && menuFx.kind === 'discZoom') { zoomI = menuFx.disc; zq = clamp(menuFx.t / menuFx.dur, 0, 1); }
  if (menuFx && menuFx.kind === 'discOut') { zoomI = menuFx.disc; zq = 1 - clamp(menuFx.t / menuFx.dur, 0, 1); }
  const total = discCount();
  const R2 = Math.min(H * 0.34, W * 0.185);
  const dx = R2 * 2.3;
  ctx.save();
  ctx.globalAlpha = rowAl;
  ctx.textAlign = 'center';
  // screen title — same voice as LEADERBOARD (800 Audiowide, wide tracking)
  try { ctx.letterSpacing = '4px'; } catch (e) {}
  const tfs = Math.max(14, Math.round(Math.min(H * 0.045, W * 0.032, (ccy - R2) * 0.42)));
  ctx.font = '800 ' + tfs + 'px Audiowide, system-ui';
  ctx.fillStyle = 'rgba(207,232,255,' + (0.92 * rowAl * (1 - zq)).toFixed(2) + ')';
  ctx.fillText('SELECT CASE FILE', ccx, ccy - R2 - 30);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  // every disc titles at ONE size: the tightest fit across the whole row
  let uniT = Math.round(R2 * 0.17);
  for (let i = 0; i < total; i++) {
    const d = discAt(i);
    const t2 = d.kind === 'train' ? 'DEFENDER TRAINING' : d.kind === 'camp' ? d.pk.title : CAMPS_SOON[d.si];
    uniT = Math.min(uniT, fitPx(t2, 800, Math.round(R2 * 0.17), R2 * 1.5, 10));
  }
  let zx = 0, zy = 0, zr = 0; // the zooming disc draws LAST, over its siblings
  for (let i = 0; i < total; i++) {
    const cx2 = ccx + (i - campScroll) * dx + rowOff;
    if (cx2 < -R2 * 1.6 || cx2 > W + R2 * 1.6) continue; // off-stage
    if (i === zoomI && zq > 0) { zx = cx2; zy = ccy; zr = R2; continue; }
    if (zq > 0) ctx.globalAlpha = rowAl * (1 - zq); // siblings fall away
    drawCampDisc(i, cx2, ccy, R2, 0, uniT);
    ctx.globalAlpha = rowAl;

    // draw at BASE size under a smooth scale transform — text px stay fixed,
    // so nothing jitters while the disc swells into the lens
    const ze = zq * zq, k = lerp(R2, mapR(), ze) / R2;
    ctx.save();
    ctx.translate(lerp(zx, ccx, ze), lerp(zy, ccy, ze));

    drawCampDisc(zoomI, 0, 0, R2, zq, uniT);

  if (zq === 0 && total * dx > W * 0.9) {
    const hy = ccy + R2 + 30;
    ctx.font = '700 11px Audiowide, system-ui';
    for (const [dir, sym, on] of [[-1, '\u2039', campScrollTgt > 0], [1, '\u203a', campScrollTgt < total - 1]]) {
      if (!on) continue;
      const hx = ccx + dir * R2 * 1.6;
      const hb = { x: hx - 17, y: hy - 17, w: 34, h: 34 };
      techRect(hb.x, hb.y, hb.w, hb.h, 8);
      ctx.fillStyle = 'rgba(8,22,44,0.7)'; ctx.fill();
      ctx.strokeStyle = 'rgba(120,210,255,0.5)'; ctx.lineWidth = 1.2;
      techRect(hb.x, hb.y, hb.w, hb.h, 8); ctx.stroke();
      ctx.fillStyle = '#cfeaff';
      ctx.font = '700 18px Audiowide, system-ui';
      ctx.fillText(sym, hx, hy + 6);
      menuButtons.push({ ...hb, scrollDir: dir });
    }
    for (let i = 0; i < total; i++) { // position dots
      ctx.beginPath();
      ctx.arc(ccx + (i - (total - 1) / 2) * 14, hy + 1, i === Math.round(campScrollTgt) ? 3.2 : 2, 0, TAU);
      ctx.fillStyle = i === Math.round(campScrollTgt) ? 'rgba(140,230,255,0.95)' : 'rgba(120,180,255,0.35)';
      ctx.fill();

  ctx.restore();
  ctx.globalAlpha = 1;

// key for the currently-selected board — matches boardKey() the runs are stored under

    { kind: 'mode', mode: 'daily', label: 'DAILY STREAM', sel: boardSel.mode === 'daily' },

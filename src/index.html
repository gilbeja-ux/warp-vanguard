<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#03060e">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icons/wv-192.png?v=13">
<link rel="icon" type="image/png" sizes="512x512" href="icons/wv-512.png?v=13">
<link rel="apple-touch-icon" href="icons/wv-mask-192.png?v=13">
<title>Warp Vanguard</title>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  @font-face {
    font-family: 'Audiowide';
    src: url('fonts/audiowide.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#03060e; touch-action:none;
    font-family:'Audiowide', 'Segoe UI', system-ui, -apple-system, sans-serif; user-select:none; -webkit-user-select:none; }
  canvas { display:block; position:fixed; inset:0; outline:none; -webkit-tap-highlight-color:transparent; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<!-- THE BUILD'S OWN FINGERPRINT. scripts/build.js stamps the real sim id in
     here on the way into dist/; served straight out of src/ (the dev server) it
     stays null, which means "unknown" and switches the check off. It cannot
     live in src/game/ because the id is a hash OF those files — a stamp inside
     the thing being hashed changes the hash it is recording. -->
<script>window.__SIM_ID = null; /* build-stamped */</script>
<script src="campaigns.js"></script>
<script src="audio/music/tracks.js"></script>
<script src="game/00-core.js"></script>
<script src="game/10-audio.js"></script>
<script src="game/11-music.js"></script>
<script src="game/12-sfx.js"></script>
<script src="game/20-background.js"></script>
<script src="game/30-campaigns.js"></script>
<script src="game/31-leaderboard.js"></script>
<script src="game/32-save.js"></script>
<script src="game/33-loader.js"></script>
<script src="game/40-state.js"></script>
<script src="game/41-geometry.js"></script>
<script src="game/50-enemies.js"></script>
<script src="game/51-linter.js"></script>
<script src="game/52-bosses.js"></script>
<script src="game/60-input.js"></script>
<script src="game/61-replay.js"></script>
<script src="game/70-update.js"></script>
<script src="game/71-gamepad.js"></script>
<script src="game/72-tick.js"></script>
<script src="game/80-tunnel.js"></script>
<script src="game/81-station3d.js"></script>
<script src="game/82-destinations.js"></script>

<script src="game/85-enemy-art.js"></script>
<script src="game/90-hud.js"></script>
<script src="game/91-briefing.js"></script>
<script src="game/92-guide.js"></script>
<script src="game/93-board.js"></script>
<script src="game/94-galaxy.js"></script>
<script src="game/95-menu.js"></script>
<script src="game/98-profiler.js"></script>
<script src="game/99-boot.js"></script>
<script>
// ---------- soundtrack manifest ----------
// The menu has its own piece; it is NOT in the run pool. The pool is whatever
// sits in src/audio/music/ — window.MUSIC_TRACKS is generated from that folder
// by scripts/build.js, and each track's title is derived from its filename. So
// adding music is: drop the file in, `npm run build`. Renaming it retitles it.
// Nothing here needs editing per track.
window.MUSIC_DATA = {
  menu: 'audio/Warp Lane Drift.mp3', // the long take — doesn't lap the browser
  levels: window.MUSIC_TRACKS || []
};
</script>
</body>
</html>

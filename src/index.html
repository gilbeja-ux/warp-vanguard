let menuCache = null;
function buildMenuCache() {
  if (!W || !H) return;
  menuCache = document.createElement('canvas');
  menuCache.width = W * DPR; menuCache.height = H * DPR;
  withCanvas(menuCache, () => {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    paintMenuStatic();
  });
}

function drawMenu(g) {
  menuButtons = [];
  if (!menuCache) buildMenuCache();
  if (menuCache) ctx.drawImage(menuCache, 0, 0, W, H);
  const { ccx, ccy, R, bw, bh, gap, listY, contentH, viewH, maxScroll } = menuGeom();

  ctx.font = '10px monospace'; ctx.textAlign = 'left';
  // bottom-left: diagnostic carousel — count up fast, hold ~5s, then the next block
  // in the bar lights up white and a fresh count begins
  const CYCLE = 6.5, COUNT = 1.5;
  const cyc = Math.floor(time / CYCLE), ct = time - cyc * CYCLE;
  const cp = clamp(ct / COUNT, 0, 1);
  const activeBlk = cyc % 4;
  const grp = i => {
    const tgt = ((cyc * 7919 + i * 337) % 90) + 10; // stable per-cycle targets, 10–99
    return String(Math.floor(tgt * cp)).padStart(2, '0');
  };
  ctx.fillStyle = 'rgba(120,210,255,0.55)';
  ctx.fillText(grp(0) + '.' + grp(1) + '.' + grp(2), 20, H - 20);
  for (let i = 0; i < 4; i++) {
    const active = i === activeBlk;
    const blink = active && cp < 1 && Math.sin(time * 14) > 0; // flickers while counting
    ctx.fillStyle = active
      ? (blink ? 'rgba(235,250,255,0.35)' : 'rgba(235,250,255,0.9)')
      : 'rgba(120,210,255,0.3)';
    ctx.fillRect(20 + i * 15, H - 40, 11, 5);
  }
  // bottom-right: live nav coordinates drifting as we ride the tunnel
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(120,210,255,0.5)';
  ctx.fillText(String(Math.floor(44589 + time * 12.4) % 100000).padStart(5, '0'), W - 20, H - 34);
  ctx.fillText(String(Math.floor(45895 + time * 31.7) % 100000).padStart(5, '0'), W - 20, H - 22);

  // fullscreen key (left of the gear; hidden when already chromeless)
  menuFsRect = null;
  if (!inStandalone() && !(document.fullscreenElement || document.webkitFullscreenElement)) {
    menuFsRect = { x: W - 96 - SAFE.r, y: 12 + SAFE.t, w: 38, h: 38 };
    const f = menuFsRect;
    techRect(f.x, f.y, f.w, f.h, 8);
    ctx.fillStyle = 'rgba(6,20,40,0.6)'; ctx.fill();
    ctx.strokeStyle = 'rgba(120,220,255,0.55)'; ctx.lineWidth = 1.5;
    techRect(f.x, f.y, f.w, f.h, 8); ctx.stroke();
    // expand-arrows icon
    ctx.strokeStyle = 'rgba(200,240,255,0.9)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const [cx2, cy2, dx, dy] of [[f.x + 11, f.y + 11, -1, -1], [f.x + 27, f.y + 11, 1, -1], [f.x + 11, f.y + 27, -1, 1], [f.x + 27, f.y + 27, 1, 1]]) {
      ctx.beginPath();
      ctx.moveTo(cx2 + dx * 3, cy2 + dy * 3); ctx.lineTo(cx2 - dx * 2, cy2 + dy * 3);
      ctx.moveTo(cx2 + dx * 3, cy2 + dy * 3); ctx.lineTo(cx2 + dx * 3, cy2 - dy * 2);
      ctx.stroke();
    }
  }

  // audio config key (top-right)
  menuGearRect = { x: W - 50 - SAFE.r, y: 12 + SAFE.t, w: 38, h: 38 };
  const r = menuGearRect;
  techRect(r.x, r.y, r.w, r.h, 8);
  ctx.fillStyle = 'rgba(6,20,40,0.6)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,220,255,0.55)'; ctx.lineWidth = 1.5;
  techRect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
  ctx.strokeStyle = 'rgba(200,240,255,0.9)'; ctx.lineWidth = 1.5;
  const knobX = [r.x + 24, r.x + 13, r.x + 27];
  for (let i = 0; i < 3; i++) {
    const gy = r.y + 11 + i * 8;
    ctx.beginPath(); ctx.moveTo(r.x + 8, gy); ctx.lineTo(r.x + 30, gy); ctx.stroke();
    ctx.fillStyle = '#dff6ff';
    ctx.fillRect(knobX[i] - 2.5, gy - 3.5, 5, 7);
  }

  // scroll thumb — bright arc segment tracking the list position
  menuScroll = clamp(menuScroll, 0, maxScroll);
  const trackA0 = -0.42 * Math.PI, trackA1 = 0.42 * Math.PI;
  const span = (trackA1 - trackA0) * clamp(viewH / contentH, 0.15, 1);
  const soff = maxScroll > 0 ? (menuScroll / maxScroll) * ((trackA1 - trackA0) - span) : 0;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#4db6ff'; ctx.lineWidth = 7;
  ctx.shadowColor = 'rgba(90,200,255,0.8)'; ctx.shadowBlur = lowFX ? 0 : 8;
  ctx.beginPath(); ctx.arc(ccx, ccy, R + 9, trackA0 + soff, trackA0 + soff + span); ctx.stroke();
  ctx.shadowBlur = 0;

  // scrollable level list inside the disc — drag to scroll, tap to launch
  ctx.save();
  ctx.beginPath();
  ctx.rect(ccx - bw / 2 - 30, listY - 4, bw + 60, viewH + 8);
  ctx.clip();
  const endlessOpen = progress.stars[LEVELS.length - 1] > 0; // clear the campaign to unlock
  for (let i = 0; i <= LEVELS.length + 3; i++) {
    const by = listY + i * (bh + gap) - menuScroll;
    if (by + bh < listY - 6 || by > listY + viewH + 6) continue;
    const bx = ccx - bw / 2;
    if (i === 0) { // training run — always open, highlighted until cleared
      levelKey(bx, by, bw, bh, 'Q', 'QUALIFICATION', -1, false, !progress.tutorialDone);
      if (progress.tutorialDone) { // cleared check
        ctx.strokeStyle = '#7ee262'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bx + bw - 40, by + bh / 2 + 1);
        ctx.lineTo(bx + bw - 33, by + bh / 2 + 8);
        ctx.lineTo(bx + bw - 20, by + bh / 2 - 8);
        ctx.stroke();
      }
      menuButtons.push({ x: bx, y: by, w: bw, h: bh, qual: true, locked: false });
    } else if (i <= LEVELS.length) {
      const li = i - 1;
      const locked = li + 1 > progress.unlocked;
      levelKey(bx, by, bw, bh, li + 1, LEVELS[li].name, progress.stars[li], locked, li + 1 === progress.unlocked && progress.tutorialDone);
      if (!locked && (progress.bests[li] || 0) > 0) {
        ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,210,74,0.75)'; ctx.font = '700 9px Audiowide, system-ui';
        ctx.fillText('BEST ' + progress.bests[li].toLocaleString(), bx + bw - 14, by + bh - 5);
        ctx.textAlign = 'left';
      }
      menuButtons.push({ x: bx, y: by, w: bw, h: bh, level: li, locked });
    } else if (i === LEVELS.length + 2) { // one seeded run per day
      const dailyOpen = progress.unlocked >= 4;
      levelKey(bx, by, bw, bh, '◈', 'DAILY STREAM', -1, !dailyOpen, false);
      const D = progress.daily;
      if (dailyOpen && D && (D.streak || D.best)) {
        ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,210,74,0.85)'; ctx.font = '700 10px Audiowide, system-ui';
        ctx.fillText((D.streak > 1 ? 'STREAK ' + D.streak + '  ·  ' : '') + 'BEST ' + (D.best || 0).toLocaleString(), bx + bw - 14, by + bh - 8);
        ctx.textAlign = 'left';
      }
      menuButtons.push({ x: bx, y: by, w: bw, h: bh, daily: true, locked: !dailyOpen });
    } else if (i === LEVELS.length + 3) { // TEMPORARY: BOSS TEST dev key
      levelKey(bx, by, bw, bh, '⚔', 'BOSS TEST (DEV)', -1, false, false);
      menuButtons.push({ x: bx, y: by, w: bw, h: bh, bossTest: true, locked: false });
    } else {
      levelKey(bx, by, bw, bh, '∞', 'ENDLESS STREAM', -1, !endlessOpen, endlessOpen);
      if (endlessOpen && progress.best > 0) {
        ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,210,74,0.85)'; ctx.font = '700 10px Audiowide, system-ui';
        ctx.fillText('BEST ' + progress.best.toLocaleString(), bx + bw - 14, by + bh - 8);
        ctx.textAlign = 'left';
      }
      menuButtons.push({ x: bx, y: by, w: bw, h: bh, endless: true, locked: !endlessOpen });
    }
  }
  ctx.restore();
  ctx.textAlign = 'left';

  // score modifiers — the campaign reward for players chasing numbers
  menuMutRects = [];
  if (progress.stars[LEVELS.length - 1] > 0) {
    const MUTS = [['oneLife', '1 LIFE', '×2'], ['fast', 'FAST STREAM', '×1.5'], ['noPickups', 'NO PICKUPS', '×1.3']];
    let my2 = H * 0.56;
    ctx.font = '700 10px Audiowide, system-ui';
    ctx.fillStyle = 'rgba(120,210,255,0.75)';
    try { ctx.letterSpacing = '2px'; } catch (e) {}
    ctx.fillText('MODIFIERS', 26 + SAFE.l, my2 - 10);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    for (const [key, label, mult] of MUTS) {
      const r2 = { x: 26 + SAFE.l, y: my2, w: 128, h: 24, key };
      const on = mutators[key];
      techRect(r2.x, r2.y, r2.w, r2.h, 6);
      ctx.fillStyle = on ? 'rgba(120,80,10,0.55)' : 'rgba(6,20,40,0.55)';
      ctx.fill();
      ctx.strokeStyle = on ? 'rgba(255,210,74,0.9)' : 'rgba(120,180,255,0.35)';
      ctx.lineWidth = 1.5;
      techRect(r2.x, r2.y, r2.w, r2.h, 6); ctx.stroke();
      ctx.fillStyle = on ? '#ffe9b0' : 'rgba(160,200,240,0.7)';
      ctx.font = '700 10px Audiowide, system-ui';
      ctx.fillText(label, r2.x + 10, r2.y + 16);
      ctx.textAlign = 'right';
      ctx.fillStyle = on ? '#ffd24a' : 'rgba(160,200,240,0.5)';
      ctx.fillText(mult, r2.x + r2.w - 8, r2.y + 16);
      ctx.textAlign = 'left';
      menuMutRects.push(r2);
      my2 += 30;
    }
    const mm2 = mutMul();
    if (mm2 > 1) {
      ctx.fillStyle = '#ffd24a'; ctx.font = '700 11px Audiowide, system-ui';
      ctx.fillText('SCORE ×' + (Math.round(mm2 * 100) / 100), 26 + SAFE.l, my2 + 12);
    }
  }

  if (menuSettings) drawMenuSettings();
}

// audio config overlay on the main menu — same controls as the pause panel
function drawMenuSettings() {
  pauseSlidersList = []; pauseTogglesList = []; menuSetButtons = [];
  ctx.fillStyle = 'rgba(3,6,14,0.62)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W * 0.72, 520), ph = Math.min(H * 0.84, 340);
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  menuSetPanel = { x: px, y: py, w: pw, h: ph };
  techPanel(px, py, pw, ph, 'SYSTEM CONFIG');
  settingRow('SFX',     'sound',   'soundVol', py + 76,  px, pw);
  settingRow('MUSIC',   'music',   'musicVol', py + 120, px, pw);
  settingRow('HAPTICS', 'haptics', null,       py + 164, px, pw);
  controlsRow(py + 208, px, pw);
  const bw = 160, bh = 42;
  button(W / 2 - bw / 2, py + ph - bh - 20, bw, bh, 'CLOSE', true);

function drawEnd(g) {
  endButtons = [];
  const ph = (a, b2) => clamp((endT - a) / (b2 - a), 0, 1);
  // losses resolve fast; wins get the full ceremony
  const T = endWin
    ? { panel0: 0.15, panel1: 0.55, cnt0: 0.55, cnt1: 1.75, stars: 0.75, stats: 1.8 }
    : { panel0: 0.05, panel1: 0.40, cnt0: 0.35, cnt1: 1.00, stars: 99,   stats: 1.0 };
  const btnAt = endBtnAt();

  // the live scene keeps breathing beneath — dim it in, don't cut
  ctx.fillStyle = 'rgba(3,6,14,' + (0.72 * ph(0, 0.45)).toFixed(2) + ')';
  ctx.fillRect(0, 0, W, H);
  if (endWin && endT < 0.35) { // victory flash seals the run
    ctx.fillStyle = 'rgba(126,226,98,' + (0.28 * (1 - endT / 0.35)).toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  const pA = ph(T.panel0, T.panel1);
  if (pA <= 0.001) return;

  // build button list first so the report panel can wrap everything
  const list = [];
  if (endWin && levelIdx + 1 < LEVELS.length) list.push({ label: 'NEXT LEVEL ▸', action: 'next', primary: true });
  list.push({ label: endWin ? 'REPLAY' : 'RETRY', action: 'retry', primary: !endWin });
  list.push({ label: 'MENU', action: 'menu', primary: false });
  const bh = 50;
  const panelBottom = (isLandscape() ? H * 0.66 + bh : H * 0.62 + list.length * (bh + 14) - 14) + 24;
  const pw = Math.min(W * 0.88, 700), pTop = H * 0.13;

  ctx.save();
  const sc = 0.96 + 0.04 * (1 - Math.pow(1 - pA, 3));
  ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
  ctx.globalAlpha = pA;
  techPanel(W / 2 - pw / 2, pTop, pw, panelBottom - pTop, 'MISSION REPORT  //  ' + (endless ? (daily ? 'DAILY STREAM' : 'ENDLESS STREAM') : qual ? 'QUALIFICATION' : LEVELS[levelIdx].name));

  ctx.textAlign = 'center';
  // banner slams in
  const tPop = 1 + 0.22 * (1 - ph(T.panel0, T.panel0 + 0.3));
  const endCol = endless ? '#ffb340' : qual && endWin ? '#7ee262' : endWin ? '#69e05c' : '#ff4a5e';
  ctx.save();
  ctx.translate(W / 2, H * 0.25 + 14);
  ctx.scale(tPop, tPop);
  ctx.fillStyle = endCol;
  try { ctx.letterSpacing = '4px'; } catch (e) {}
  ctx.font = '800 ' + Math.min(W * 0.08, 38) + 'px Audiowide, system-ui';
  ctx.shadowColor = endCol; ctx.shadowBlur = 22;
  ctx.fillText(endless ? 'STREAM SEVERED' : qual ? (endWin ? 'QUALIFIED' : 'TRAINING ABORTED') : endWin ? 'PAYLOAD DELIVERED' : 'PAYLOAD CORRUPTED', 0, 0);
  ctx.shadowBlur = 0;
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.restore();

  // stars pop one by one, each with a chime
  if (endWin && !qual) {
    drawStars(W / 2, H * 0.36, endStars, Math.min(W, H) * 0.045, endT - T.stars);
    let popped = 0;
    for (let i = 0; i < endStars; i++) if (endT - T.stars > 0.4 + i * 0.35) popped++;
    if (popped > endFxStars) { endFxStars = popped; tone(760 + popped * 220, 0.2, 'triangle', 0.13, 900 + popped * 260); }
  }

  // the score counts itself up
  const cntP = 1 - Math.pow(1 - ph(T.cnt0, T.cnt1), 3);
  const shown = Math.round(score * cntP);
  const counting = cntP > 0 && cntP < 1 && score > 0;
  if (counting && time - endTickT > 0.07) { endTickT = time; tone(1500, 0.025, 'square', 0.035); }
  ctx.fillStyle = '#eaf4ff';
  ctx.font = '700 ' + (26 + (counting ? 2 : 0)) + 'px Audiowide, system-ui';
  ctx.fillText(shown.toLocaleString(), W / 2, H * 0.47);
  ctx.fillStyle = 'rgba(160,215,255,0.7)'; ctx.font = '600 11px Audiowide, system-ui';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  ctx.fillText('SCORE', W / 2, H * 0.47 + 20);
  try { ctx.letterSpacing = '0px'; } catch (e) {}

  // stats + best reveal after the count settles
  ctx.globalAlpha = pA * ph(T.stats, T.stats + 0.3);
  ctx.fillStyle = 'rgba(140,210,255,0.65)'; ctx.font = '11px monospace';
  ctx.fillText('zapped: ' + zaps + '   //   perfect: ' + perfects + '   //   missed: ' + misses + '   //   integrity: ' + Math.round(integrity) + '%', W / 2, H * 0.47 + 44);
  if (endless) {
    ctx.fillStyle = score >= (progress.best || 0) && score > 0 ? '#ffd24a' : 'rgba(255,210,74,0.7)';
    ctx.font = '700 13px Audiowide, system-ui';
    ctx.fillText((score >= (progress.best || 0) && score > 0 ? 'NEW BEST  ' : 'BEST  ') + (progress.best || 0).toLocaleString(), W / 2, H * 0.47 + 68);
  } else if (!qual && (endWin || (progress.bests[levelIdx] || 0) > 0)) {
    ctx.fillStyle = endNewBest ? '#ffd24a' : 'rgba(255,210,74,0.7)';
    ctx.font = '700 13px Audiowide, system-ui';
    ctx.fillText((endNewBest ? 'NEW BEST  ' : 'BEST  ') + (progress.bests[levelIdx] || 0).toLocaleString(), W / 2, H * 0.47 + 68);
  }

  // buttons slide up last
  const bA = ph(btnAt, btnAt + 0.4);
  if (bA > 0.001) {
    ctx.globalAlpha = pA * bA;
    const rise = 14 * (1 - bA);
    if (isLandscape()) {
      const bw = Math.min(W * 0.24, 210), gap = 16;
      const total = list.length * bw + (list.length - 1) * gap;
      let bx = W / 2 - total / 2;
      const by = H * 0.66;
      for (const b of list) {
        button(bx, by + rise, bw, bh, b.label, b.primary);
        endButtons.push({ x: bx, y: by, w: bw, h: bh, action: b.action });
        bx += bw + gap;
      }
    } else {
      const bw = Math.min(W * 0.6, 260);
      let by = H * 0.62;
      for (const b of list) {
        button(W / 2 - bw / 2, by + rise, bw, bh, b.label, b.primary);
        endButtons.push({ x: W / 2 - bw / 2, y: by, w: bw, h: bh, action: b.action });
        by += bh + 14;
      }
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ---------- perf watchdog: shed visual load if the frame rate slips ----------
function perfWatch(rawDt) {
  if (lowFX || time < 5 || rawDt > 0.5) return; // ignore startup jank + tab-switch gaps
  perfAcc += rawDt; perfN++; perfWin += rawDt;
  if (perfWin >= 2) { // ~2s rolling window
    if (perfAcc / perfN > 1 / 42) { // sustained under ~42fps → permanently shed load
      lowFX = true;
      initStreaks();
      wallSnips.length = Math.min(wallSnips.length, 14);
    }
    perfAcc = 0; perfN = 0; perfWin = 0;
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const rawDt = (now - last) / 1000;
  const dt = clamp(rawDt, 0, 0.05); // clock can step backwards (timer quirks) — never simulate in reverse
  last = now;
  perfWatch(rawDt);
  update(dt);

  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 6, rand(-1, 1) * shake * 6);

  // background
  ctx.clearRect(-20, -20, W + 40, H + 40);
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawLiveBg(dt);

  const g = geo();

  // the tunnel fills the whole screen — no clipping, we're inside it
  drawTunnel(g);
  drawLattice(g);
  drawWallCode(g, dt);
  drawStreaks(g, dt);
  // warm glow rising off the golden river
  const rgl = ctx.createRadialGradient(g.cx, H * 0.95, 0, g.cx, H * 0.95, Math.min(W, H) * 0.75);
  rgl.addColorStop(0, 'rgba(255,180,70,0.12)');
  rgl.addColorStop(1, 'rgba(255,180,70,0)');
  ctx.fillStyle = rgl;
  ctx.fillRect(0, 0, W, H);

  // atmospheric depth fog — mid-distance haze inside the tunnel
  const fogG = ctx.createRadialGradient(g.cx, g.cy, g.nodeR * 0.1, g.cx, g.cy, g.nodeR * 1.4);
  fogG.addColorStop(0, 'rgba(10,22,48,0)');
  fogG.addColorStop(0.45, 'rgba(10,22,48,0.12)');
  fogG.addColorStop(1, 'rgba(10,22,48,0)');
  ctx.fillStyle = fogG;
  ctx.fillRect(0, 0, W, H);

  // node holder ring: thick matte black like the mock, with faked soft shadow for depth
  const bz = Math.min(W, H) * 0.055;
  // during the level intro the ring sweeps into existence from the top
  const ringP = (state === S.PLAY || state === S.PAUSE) ? clamp(introT / 2.0, 0, 1) : 1;
  const ringSweep = (1 - Math.pow(1 - ringP, 3)) * Math.PI;
  const ringForming = ringSweep < Math.PI - 0.001;
  if (ringForming) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(g.cx, g.cy);
    ctx.arc(g.cx, g.cy, g.nodeR * 2.2, -Math.PI / 2 - ringSweep, -Math.PI / 2 + ringSweep);
    ctx.closePath();
    ctx.clip();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = bz * 3.0;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = bz * 2.2;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = bz * 1.6;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU);
  ctx.strokeStyle = 'rgba(3,6,11,0.96)'; ctx.lineWidth = bz; ctx.stroke();
  // cold specular catch on the upper-left of the ring
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz - 1.5, Math.PI * 0.95, Math.PI * 1.55);
  ctx.strokeStyle = 'rgba(180,230,255,0.30)'; ctx.lineWidth = 2; ctx.stroke();
  // warm river light reflecting off the ring's lower edge
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + 1.5, Math.PI * 0.28, Math.PI * 0.72);
  ctx.strokeStyle = 'rgba(255,190,100,0.28)'; ctx.lineWidth = 2.5; ctx.stroke();
  // maglev rails on the ring's inner face — the node carriages ride these
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR - bz * 0.62, 0, TAU);
  ctx.strokeStyle = 'rgba(120,220,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR - bz * 1.1, 0, TAU);
  ctx.strokeStyle = 'rgba(120,220,255,0.20)'; ctx.lineWidth = 1; ctx.stroke();
  if (ringForming) {
    ctx.restore();
    // white-hot formation heads racing along both directions
    for (const s2 of [-1, 1]) {
      const ha = -Math.PI / 2 + s2 * ringSweep;
      const hx = g.cx + Math.cos(ha) * (g.nodeR + bz / 2), hy = g.cy + Math.sin(ha) * (g.nodeR + bz / 2);
      const hg2 = ctx.createRadialGradient(hx, hy, 0, hx, hy, bz * 1.4);
      hg2.addColorStop(0, 'rgba(235,250,255,0.95)');
      hg2.addColorStop(0.4, 'rgba(120,220,255,0.5)');
      hg2.addColorStop(1, 'rgba(120,220,255,0)');
      ctx.fillStyle = hg2;
      ctx.beginPath(); ctx.arc(hx, hy, bz * 1.4, 0, TAU); ctx.fill();
      if (state === S.PLAY && Math.random() < 0.5) burst(hx, hy, '#bfeaff', 2, 2.5);
    }
  }

  // reactive rim: zaps and misses light the segment they happened on
  for (const fx2 of rimFX) {
    const al = Math.min(1, (fx2.t / 0.45) * 0.85);
    ctx.strokeStyle = 'rgba(' + fx2.col + ',' + al.toFixed(2) + ')';
    ctx.lineWidth = bz * 0.7;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, fx2.a - 0.3, fx2.a + 0.3); ctx.stroke();
  }
  // a wounded rim sputters
  if (state === S.PLAY && integrity <= 25 && Math.random() < 0.25) {
    const ra = Math.random() * TAU;
    burst(g.cx + Math.cos(ra) * (g.nodeR + bz / 2), g.cy + Math.sin(ra) * (g.nodeR + bz / 2), '#8fc7ff', 2, 2);
  }
  if (state !== S.MENU) drawArrivalPings(g);

  // traps render over the ring — missed ones fly past the player and fade
  const sorted = enemies.slice().sort((a, b) => b.z - a.z);
  for (const en of sorted) if (en.lineLead) drawLineBeam(en, g); // beams sit under the traps
  for (const en of sorted) drawEnemy(en, g);
  for (const p of pickups) drawPickup(p, g);
  drawPulseWave(g);
  if (boss && state !== S.MENU) drawBoss(g);

  if (state !== S.MENU) drawNodes(g);
  if (state !== S.MENU && boss) drawBeam(g);

  // particles + popups (over everything)
  ctx.lineCap = 'round';
  for (const p of particles) {
    // data bits: fine streaks along their motion, not blobs — light in fiber
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = Math.max(0.5, p.size * 0.6);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 2.4 - 0.5, p.y - p.vy * 2.4 - 0.5);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  drawBolts();
  ctx.textAlign = 'center';
  for (const p of popups) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color; ctx.font = '700 15px Audiowide, system-ui';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // cinematic vignette + color grade (under the HUD so controls stay crisp)
  if (vignetteCanvas) ctx.drawImage(vignetteCanvas, 0, 0, W, H);
  const grade = ctx.createLinearGradient(0, 0, 0, H);
  grade.addColorStop(0, 'rgba(18,55,110,0.10)');   // cool up top
  grade.addColorStop(0.55, 'rgba(0,0,0,0)');
  grade.addColorStop(1, 'rgba(255,150,50,0.08)');  // warm river light below
  ctx.fillStyle = grade;
  ctx.fillRect(0, 0, W, H);

  if (state === S.PLAY) { drawHUD(g); drawDials(); drawIntroCard(); }
  else if (state === S.PAUSE) { drawHUD(g); drawDials(); drawIntroCard(); drawPause(); }
  else if (state === S.INFO) { drawHUD(g); drawDials(); drawIntroCard(); drawInfoCard(); }
  else if (state === S.MENU) drawMenu(g);
  else drawEnd(g);

  // system-critical glitches — the screen itself degrades with the payload
  if (state === S.PLAY && integrity <= 50) {
    const gi = (50 - integrity) / 50;
    if (Math.random() < 0.15 + gi * 0.35) {
      for (let i = 0; i < 1 + gi * 3; i++) {
        const gy = Math.random() * H, gh = rand(2, 6 + gi * 10);
        ctx.fillStyle = 'rgba(90,220,255,' + (0.04 + gi * 0.07).toFixed(2) + ')';
        ctx.fillRect(0, gy, W, gh);
        ctx.fillStyle = 'rgba(255,60,80,' + (0.03 + gi * 0.06).toFixed(2) + ')';
        ctx.fillRect(rand(-30, 30), gy + gh, W, 2);
      }
    }
    if (integrity <= 25) { // heartbeat vignette on the last block
      const pulse = (Math.sin(time * 5) * 0.5 + 0.5) * 0.22;
      const hv = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
      hv.addColorStop(0, 'rgba(255,40,60,0)');
      hv.addColorStop(1, 'rgba(255,40,60,' + pulse.toFixed(2) + ')');
      ctx.fillStyle = hv; ctx.fillRect(0, 0, W, H);
    }
  }

  // red damage vignette
  if (redFlash > 0) {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    v.addColorStop(0, 'rgba(255,40,60,0)');
    v.addColorStop(1, `rgba(255,40,60,${(redFlash * 0.4).toFixed(2)})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  // screen-stitch fade between scenes
  if (fadeT > 0) {
    fadeT = Math.max(0, fadeT - rawDt);
    ctx.fillStyle = 'rgba(2,4,10,' + (fadeT / 0.35 * 0.9).toFixed(2) + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
// offline capability + PWA installability (no-op on insecure origins)
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// try to start the soundtrack right away — the Capacitor app WebView allows it;
// desktop browsers that block autoplay simply start it on the first tap instead
// (deferred a tick: the MUSIC_DATA manifest script below hasn't parsed yet)
setTimeout(() => { if (state === S.MENU) playTrack('menu'); }, 0);
</script>
<script>
// ---------- soundtrack manifest ----------
// menu: View From The Dashboard · L1: Sub Level Three · L2: Steel and Rain · L3: Terminal Velocity
window.MUSIC_DATA = {
  menu: 'audio/View_From_The_Dashboard.mp3',
  levels: [
    'audio/Sub_Level_Three.mp3',
    'audio/Steel_and_Rain.mp3',
    'audio/Terminal_Velocity.mp3'
  ]
};
</script>
</body>

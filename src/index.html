<script>
'use strict';

// ============================================================
// WARP LANE: VANGUARD SQUADRON — dual-thumb radial defense
// ============================================================

const canvas = document.getElementById('game');
// canvas text falls back to system-ui until the display font arrives — force it early
if (document.fonts && document.fonts.load) document.fonts.load('16px Audiowide').catch(() => {});
let ctx = canvas.getContext('2d'); // rebindable so offscreen layers can reuse the painters
let W = 0, H = 0, DPR = 1;
let SAFE = { t: 0, b: 0, l: 0, r: 0 }; // safe-area insets mapped into game space
function withCanvas(cv, fn) {
  const o = ctx; ctx = cv.getContext('2d');
  try { fn(); } finally { ctx = o; }
}

let ROT = false; // landscape-only: on portrait screens the whole game renders rotated 90°
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  ROT = ch > cw;
  W = ROT ? ch : cw; H = ROT ? cw : ch;
  canvas.width = cw * DPR; canvas.height = ch * DPR;
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  if (ROT) ctx.setTransform(0, DPR, -DPR, 0, cw * DPR, 0);
  else ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // notch / home-indicator insets, rotated with the game when in portrait
  try {
    const cs = getComputedStyle(document.documentElement);
    const px = v => parseFloat(cs.getPropertyValue(v)) || 0;
    const st = px('--sat'), sb = px('--sab'), sl = px('--sal'), sr = px('--sar');
    SAFE = ROT ? { l: st, r: sb, t: sr, b: sl } : { t: st, b: sb, l: sl, r: sr };
  } catch (e) { SAFE = { t: 0, b: 0, l: 0, r: 0 }; }
  buildBackground();
  buildMenuCache();
  syncUiLayer();
}
window.addEventListener('resize', resize);
// map screen-space pointer coords into (possibly rotated) game space
function evPos(e) {
  return ROT ? { x: e.clientY, y: window.innerWidth - e.clientX } : { x: e.clientX, y: e.clientY };
}

// ---------- DOM overlay layer (text entry over the canvas) ----------
// The game is drawn on a canvas — and rotated 90° in portrait (ROT) — so a plain
// <input> can't sit at screen coords. This layer is transformed to match the
// canvas exactly, giving a DOM plane whose coordinates ARE game (W×H) space. We
// only ever mount ONE input in it at a time (name / email / OTP), so the native
// mobile keyboard handles text; the canvas draws everything else. Positioned in
// game px, it lines up on top of whatever panel field opened it.
let uiLayer = null, overlayEl = null;
function ensureUiLayer() {
  if (uiLayer) return uiLayer;
  uiLayer = document.createElement('div');
  uiLayer.style.cssText = 'position:fixed;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:50;';
  document.body.appendChild(uiLayer);
  syncUiLayer();
  return uiLayer;
}
// keep the layer's box + rotation glued to the current canvas transform
function syncUiLayer() {
  if (!uiLayer) return;
  uiLayer.style.width = W + 'px'; uiLayer.style.height = H + 'px';
  // ROT canvas maps game (gx,gy) → css (innerWidth - gy, gx); this is that map
  uiLayer.style.transform = ROT ? 'translate(' + window.innerWidth + 'px,0) rotate(90deg)' : 'none';
}
// mount a text field at game-space rect {x,y,w,h}. opts: value, placeholder,
// type ('text'|'email'), maxLength, onInput(v), onEnter(v). Returns the element.
function overlayInput(rect, opts) {
  ensureUiLayer(); hideOverlay();
  const el = document.createElement('input');
  el.type = opts.type || 'text';
  el.value = opts.value || ''; el.placeholder = opts.placeholder || '';
  if (opts.maxLength) el.maxLength = opts.maxLength;
  el.autocapitalize = 'off'; el.autocomplete = opts.autocomplete || 'off'; el.spellcheck = false;
  el.enterKeyHint = 'done'; el.inputMode = opts.type === 'email' ? 'email' : 'text';
  el.style.cssText = 'position:absolute;box-sizing:border-box;pointer-events:auto;'
    + 'left:' + rect.x + 'px;top:' + rect.y + 'px;width:' + rect.w + 'px;height:' + rect.h + 'px;'
    + 'background:rgba(6,20,40,0.92);border:1.5px solid rgba(140,230,255,0.8);border-radius:6px;'
    + 'color:#eafaff;font:600 15px Audiowide, system-ui;letter-spacing:1px;padding:0 12px;outline:none;';
  el.addEventListener('input', () => { if (opts.onInput) opts.onInput(el.value); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (opts.onEnter) opts.onEnter(el.value); } });
  uiLayer.appendChild(el);
  overlayEl = el;
  setTimeout(() => { try { el.focus(); } catch (e) {} }, 0);

}
function hideOverlay() { if (overlayEl) { try { overlayEl.remove(); } catch (e) {} overlayEl = null; } }
const overlayValue = () => overlayEl ? overlayEl.value : '';

// ---------- utils ----------
const TAU = Math.PI * 2;
// build stamp: derived from the script's own byte length, so it shifts with
// ANY code change — shown on the home screen to catch stale cached builds
const BUILD = (() => {
  try { return (document.currentScript.textContent.length % 46656).toString(36).toUpperCase().padStart(3, '0'); }
  catch (e) { return '---'; }
})();
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- audio ----------
let AC = null, sfxGain = null;
// smooth sfx-bus envelope (0 = muted, 1 = full). Slammed to 0 for the replay
// enter + while the scrub knob is held, then eased back to 1 so sound doesn't
// pop in. Applied to sfxGain every frame (see the frame loop); music is separate.
let sfxFade = 1, sfxFadeTgt = 1, sfxFadeRate = 6; // rate: snappy (6) for scrub, slow (~1s) for the replay enter
function sfxBusGain() { return (settings.sound ? settings.soundVol : 0) * sfxFade; }
const settings = {
  sound: true, soundVol: 0.8, music: true, musicVol: 0.32, haptics: true // music sits low so sonar and cues read
};
// score-chase modifiers — unlocked with the campaign, toggled on the menu
const mutators = { oneLife: false, fast: false, noPickups: false };
const mutMul = () => (mutators.oneLife ? 2 : 1) * (mutators.fast ? 1.5 : 1) * (mutators.noPickups ? 1.3 : 1);
function applySettings() {
  saveState();
  if (sfxGain) sfxGain.gain.value = sfxBusGain();
  updateMusic(); // volumes live on the takes; nudge now for instant slider feedback
}
function initAC() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain();
    if (AC.createDynamicsCompressor) { // glue the layers, catch hot peaks
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 4;
      comp.attack.value = 0.003; comp.release.value = 0.15;
      sfxGain.connect(comp); comp.connect(AC.destination);
    } else sfxGain.connect(AC.destination);
    applySettings();
    loadSamples(); // recorded sfx decode in the background; synths cover until then
  } catch (e) {}
}
function audio() {
  initAC();
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  // during the boot splash its score owns the mix — the menu track would land
  // on top of it; splashAudioTry() picks the take up once the context runs
  if (SPLASH.on) return AC;
  // NO TRACK CHOICE HERE. A gesture unlocks the context and nothing more — what
  // plays is decided by game state in updateMusic, so the soundtrack can't depend
  // on which screen a tap happened to land on.
  return AC;
}
// a MENU screen for soundtrack purposes: the menu itself, and the field guide
// when it was opened from the home screen rather than mid-run
const menuScreenNow = () => state === S.MENU || (state === S.GUIDE && (!guide || guide.from !== 'pause'));
function tone(freq, dur, type, vol, slideTo, dest, delay, pan) {
  if (simMuted) return;
  const ac = AC; if (!ac || !sfxGain) return;
  const t0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol || 0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let tail = g;
  if (pan && ac.createStereoPanner) {
    const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
    g.connect(p); tail = p;
  }
  o.connect(g); tail.connect(dest || sfxGain); o.start(t0); o.stop(t0 + dur);
}
// filtered noise burst — the electric texture tones can't make. A cached
// noise buffer runs through a swept bandpass with a tight envelope.
let noiseBuf = null;
function crackle(dur, f0, f1, q, vol, delay, pan) {
  if (simMuted) return;
  const ac = AC; if (!ac || !sfxGain || !ac.createBuffer) return;
  const t0 = ac.currentTime + (delay || 0);
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = q;
  bp.frequency.setValueAtTime(f0, t0);
  if (f1) bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let tail = g;
  if (pan && ac.createStereoPanner) {
    const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
    g.connect(p); tail = p;
  }
  src.connect(bp); bp.connect(g); tail === g ? g.connect(sfxGain) : tail.connect(sfxGain);
  src.start(t0); src.stop(t0 + dur);
}
// the tunnel's own voice: a low filtered-noise bed + sub hum, breathing
// slowly — barely there, but silence feels dead without it
let ambNodes = null;
function ambient(on) {
  const ac = AC; if (!ac || !sfxGain || !ac.createBuffer) return;
  if (on && !ambNodes) {
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; lp.Q.value = 0.4;
    const g = ac.createGain(); g.gain.value = 0;
    const hum = ac.createOscillator(); hum.type = 'sine'; hum.frequency.value = 55;
    const hg = ac.createGain(); hg.gain.value = 0.014;
    const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.13;
    const lg = ac.createGain(); lg.gain.value = 0.008;
    src.connect(lp); lp.connect(g); g.connect(sfxGain);
    hum.connect(hg); hg.connect(g);
    lfo.connect(lg); if (g.gain.setTargetAtTime) lg.connect(g.gain);
    src.start(); hum.start(); lfo.start();
    if (g.gain.setTargetAtTime) g.gain.setTargetAtTime(0.025, ac.currentTime, 1.2);
    else g.gain.value = 0.025;
    ambNodes = { src, hum, lfo, g };
  }
  if (!on && ambNodes) {
    const an = ambNodes; ambNodes = null;
    an.g.gain.setTargetAtTime ? an.g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.4) : (an.g.gain.value = 0);
    setTimeout(() => { try { an.src.stop(); an.hum.stop(); an.lfo.stop(); } catch (e) {} }, 1600);
  }
}
// the stream-trace drone: a rolling tone that climbs as the ribbon is ridden
// head to tail — resolve with sfx.traced() on completion
let stripOsc = null;
function stripSound(on, prog) {
  const ac = AC; if (!ac || !sfxGain) return;
  if (simMuted && on) return; // don't start/sustain the drone during the muted pre-run
  if (on && !stripOsc) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = 220; g.gain.value = 0;
    const lfo = ac.createOscillator(), lg = ac.createGain(); // the "rolling"
    lfo.type = 'sine'; lfo.frequency.value = 7; lg.gain.value = 9;
    lfo.connect(lg);
    if (o.frequency.setTargetAtTime) lg.connect(o.frequency);
    o.connect(g); g.connect(sfxGain); o.start(); lfo.start();
    stripOsc = { o, g, lfo };
  }
  if (!on && stripOsc) {
    const so = stripOsc; stripOsc = null;
    so.g.gain.setTargetAtTime ? so.g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.04) : (so.g.gain.value = 0);
    setTimeout(() => { try { so.o.stop(); so.lfo.stop(); } catch (e) {} }, 250);
    return;
  }
  if (on && stripOsc) {
    const f = 220 * Math.pow(4, clamp(prog || 0, 0, 1)); // 220Hz filling up to 880Hz
    if (stripOsc.o.frequency.setTargetAtTime) {
      stripOsc.o.frequency.setTargetAtTime(f, ac.currentTime, 0.035);
      stripOsc.g.gain.setTargetAtTime(0.075, ac.currentTime, 0.06);
    } else { stripOsc.o.frequency.value = f; stripOsc.g.gain.value = 0.075; }
  }
}
// whisper-quiet approach blip, stereo-panned to the threat's angle
function sonarTick(freq, pan) {
  const ac = AC; if (!ac || !sfxGain || state !== S.PLAY || simMuted) return; // muted stat pre-run schedules these at a frozen clock → a squawk; skip them
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.045, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.05);
  let tail = g;
  if (ac.createStereoPanner) {
    const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
    g.connect(p); tail = p;
  }
  o.connect(g); tail.connect(sfxGain); o.start(); o.stop(ac.currentTime + 0.05);
}
// ---------- soundtrack (MUSIC_DATA is injected in a script at the end of this file) ----------
// menu: Midnight Terminal Wait · runs: a shuffled draw from src/audio/music/
// Web Audio looper: each track is decoded to a buffer and looped sample-accurately
// (native <audio loop> always has an audible seam on mp3). Encoder padding is
// trimmed via loopStart/loopEnd. One decoded track is held in memory at a time —
// except across a free-flow crossfade, which briefly holds two.
let musicGain = null, musicSrc = null, musicSrcGain = null, musicFilter = null;
let musicLift = 1; // max-combo streaks brighten the mix a touch
let musicStartAt = 0, beatPeriod = 0, musicCut = 16000, musicLoopDur = 0;
let currentTrackKey = null, musicLoadKey = null;
// The menu piece is the one track the player returns to over and over, and it is

// That is what makes leaving a run switch to menu music INSTANTLY instead of
// after a fetch and a decode.
let menuBuf = null;
let musicRetryIn = 0;    // backoff before re-asking for a track whose load died
let musicHoldFor = 0;    // seconds of quiet still owed to the deploy fade-out before the run's track may come in
let warmKey = null, warmBuf = null; // the run's take, decoding (or decoded) under the deploy silence
let runMusicOn = false;  // does the RUN own the bus? false from deploy until the start sequence, and again once it ends
let holdVol = 1;         // eased 1→0 while the pause card holds the track
let musicFade = 1; // 0→1 whenever a track starts from silence
let musicRate = 1; // eased playback rate — slow-mo drags the track down with it
let replayMusicVol = 1; // eased music multiplier: 0 while a replay is paused / scrubbing / exiting
const musicVolume = () => settings.music ? settings.musicVol : 0;
const MUSIC_FADEIN = 2.2; // seconds to fade a track in
const MUSIC_FADEOUT = 1.0; // seconds the outgoing track takes to bow out on a switch
const MUSIC_XFADE = 4.0;  // seconds two takes overlap when free flow chains the next track
const MUSIC_LEAD = 14;    // seconds before the seam the next track starts fetching + decoding
// a manifest entry is normally a bare url; { file, name } overrides the title
function trackEntry(k) {
  const md = window.MUSIC_DATA;
  const e = k === 'menu' ? md.menu : md.levels[k];
  return typeof e === 'string' ? { file: e } : (e || { file: '' });
}
const trackUrl = k => encodeURI(trackEntry(k).file); // the folder's filenames carry spaces
// THE FILENAME IS THE TITLE. src/audio/music/ is the single source of truth:
// drop a track in, `npm run build` lists it, and its name comes straight off the
// file — so renaming the mp3 renames the track, with nothing else to keep in sync.
const NAME_CACHE = {};
function prettyTrackName(file) {
  if (NAME_CACHE[file] !== undefined) return NAME_CACHE[file];
  const base = decodeURIComponent(String(file)).split('/').pop().replace(/\.[a-z0-9]+$/i, '');

function trackName(k) {
  const e = trackEntry(k);

}
const trackCount = () => (window.MUSIC_DATA && window.MUSIC_DATA.levels.length) || 1;

// and a refill never hands back the track that is already on air. Draws from
// sysRandom, NOT Math.random — campaign/daily reseed Math.random for the sim, and
// spending from that stream would desync replay verification.

function pickTrack() {
  const n = trackCount();
  if (!trackBag.length) {
    trackBag = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) { const j = (sysRandom() * (i + 1)) | 0; const t = trackBag[i]; trackBag[i] = trackBag[j]; trackBag[j] = t; }

// ---- free-flow crossfade: two takes alive at once, one rising under the other ----

// ---- NOW PLAYING: the track names itself, briefly, and gets out of the way ----

let npT = 99, npName = '';

    [523, 659, 784, 1047].forEach((f, i) => {
      tone(f, 0.24, 'triangle', 0.12, f * 1.01, null, i * 0.14);
      tone(f * 2, 0.16, 'sine', 0.045, null, null, i * 0.14);
    });
    tone(1319, 0.7, 'triangle', 0.10, null, null, 0.56);
    tone(2637, 0.5, 'sine', 0.04, null, null, 0.56);
    tone(330, 0.8, 'sine', 0.07, null, null, 0.56);
  },
  traced() { // stream held to the end — resolve the rising trace tone
    tone(880, 0.09, 'sine', 0.12, 1047);
    tone(1319, 0.14, 'sine', 0.10, 1760, null, 0.07);
    tone(2637, 0.10, 'triangle', 0.05, 3136, null, 0.13);
  },
  fail() {
    if (playSample('fail')) return;
    [330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sawtooth', 0.1), i * 180));
  },
  tick() { // techy UI click: a crisp tap with a tiny body
    if (playSample('ui')) return;
    tone(2200, 0.02, 'square', 0.05, 1400);
    tone(660, 0.035, 'sine', 0.045, 480, null, 0.006);
  }
};

// ---------- background (deep data-space behind the tunnel walls) ----------
let bgCanvas = null, vignetteCanvas = null, wallTex = null, wallCloud = null;
let ringFxCv = null, grainCv = null; // prerendered monolith ring + film-grain tile
let bgMotes = [], glitchT = 0, glitchY = 0, nextGlitch = 3;
let litPanels = [], wallSnips = [];
// (randCode is retired with the fiber theme — there is no binary on a lane wall.
// The wall's motion is carried by streaked starlight and the marker trains below.)
function buildBackground() {
  // live layer state
  bgMotes = [];
  for (let i = 0; i < 18; i++) {
    bgMotes.push({ x: Math.random() * W, y: Math.random() * H, sp: rand(4, 14), r: rand(0.6, 1.8), ph: rand(0, TAU), white: Math.random() < 0.3 });
  }
  litPanels = [];
  // marker trains streaming along the lane wall: runs of chevrons, the way a
  // charted corridor is signed. They ride the traffic clock, so they read as
  // ground rushing past rather than as decoration.
  wallSnips = [];
  for (let i = 0; i < 30; i++) {
    wallSnips.push({
      a: Math.random() * TAU, z: Math.random(), n: 4 + (Math.random() * 6 | 0),
      amber: Math.random() < 0.22, sp: rand(0.7, 1.4),
      dir: Math.random() < 0.6 ? -1 : 1 // -1 = incoming (toward player), +1 = outgoing
    });
  }
  // vignette cache
  vignetteCanvas = document.createElement('canvas');
  vignetteCanvas.width = W * DPR; vignetteCanvas.height = H * DPR;
  const v = vignetteCanvas.getContext('2d');
  v.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vg = v.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  v.fillStyle = vg; v.fillRect(0, 0, W, H);

  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
  const b = bgCanvas.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);
  // deep navy base — the void the lane is threaded through. It stays near-black:
  // the hyperspace references only go blue during the JUMP, and cruise is dark.
  b.fillStyle = '#020510'; b.fillRect(0, 0, W, H);

  // --- NEBULAS: the furthest thing there is ---
  // Warm gold-brown dust and cold teal wisps, heavily desaturated and mottled.
  // Baked into the static background on purpose: at that distance nothing moves
  // perceptibly, so this costs nothing per frame — and the deep field's stars and
  // wisps parallax in FRONT of it, which is what gives the sky its depth order.
  //
  // Clustered rather than scattered. An even wash of blobs reads as a gradient;
  // three or four centres with fall-off around them read as structure.
  {
    const neb = [
      { x: W * 0.17, y: H * 0.34, r: Math.min(W, H) * 0.52, col: '150,112,58', n: 26 },  // warm dust
      { x: W * 0.30, y: H * 0.74, r: Math.min(W, H) * 0.40, col: '128,96,52', n: 18 },
      { x: W * 0.72, y: H * 0.58, r: Math.min(W, H) * 0.44, col: '48,132,140', n: 20 },  // cold teal wisp
      { x: W * 0.86, y: H * 0.22, r: Math.min(W, H) * 0.33, col: '60,110,150', n: 14 }
    ];
    b.save();
    b.globalCompositeOperation = 'lighter';
    for (const cl2 of neb) {
      for (let i = 0; i < cl2.n; i++) {
        // gaussian-ish clustering: two uniforms averaged pull blobs toward centre
        const ang = Math.random() * TAU;
        const rad = cl2.r * (Math.random() + Math.random()) * 0.5;
        const bx = cl2.x + Math.cos(ang) * rad, by = cl2.y + Math.sin(ang) * rad * 0.72;
        const br = cl2.r * rand(0.16, 0.44);
        const al = 0.012 + Math.random() * 0.030; // barely there, individually
        const gr2 = b.createRadialGradient(bx, by, 0, bx, by, br);
        gr2.addColorStop(0, `rgba(${cl2.col},${al.toFixed(4)})`);
        gr2.addColorStop(0.5, `rgba(${cl2.col},${(al * 0.42).toFixed(4)})`);
        gr2.addColorStop(1, `rgba(${cl2.col},0)`);
        b.fillStyle = gr2;
        b.beginPath(); b.arc(bx, by, br, 0, TAU); b.fill();
      }
    }
    b.restore();
    // mottling: dark voids punched back through the cloud so it has holes and
    // filaments instead of reading as airbrushed haze
    for (let i = 0; i < 90; i++) {
      const bx = Math.random() * W, by = Math.random() * H;
      const br = Math.min(W, H) * rand(0.04, 0.17);
      const gr2 = b.createRadialGradient(bx, by, 0, bx, by, br);
      gr2.addColorStop(0, `rgba(2,5,16,${(0.10 + Math.random() * 0.22).toFixed(3)})`);
      gr2.addColorStop(1, 'rgba(2,5,16,0)');
      b.fillStyle = gr2;
      b.beginPath(); b.arc(bx, by, br, 0, TAU); b.fill();
    }
  }

  // --- the lane wall texture: starlight smeared by transit, stamped at many depths ---
  //
  // The one change that turns a cable into a warp lane: the grain runs RADIALLY,
  // not concentrically. The old wall was hundreds of arc dashes lying ACROSS the
  // direction of travel — stacked circuitry, unmistakably the inside of a duct.
  // Every primitive here runs ALONG it instead, so each depth stamp lines its
  // streaks up with the next and they read as one continuous smear pulled past
  // the hull. Same annulus, same stamping, same twist per depth: only the grain
  // rotated 90°.
  const TS = Math.min(1024, Math.round(Math.min(W, H) * 1.7));
  const half = TS / 2;
  wallTex = document.createElement('canvas');
  wallTex.width = TS; wallTex.height = TS;
  const t = wallTex.getContext('2d');
  t.translate(half, half);
  const inR = half * 0.55, outR = half * 0.98;
  // star colours, not circuit colours: mostly cold, a minority warm, a rare
  // violet. No amber-heavy mix — amber belonged to the data read.
  const pick = (al) => {
    const r = Math.random();
    return r < 0.10 ? `rgba(255,196,130,${al})`   // warm giants
      : r < 0.16 ? `rgba(200,170,255,${al})`      // rare violet
      : r < 0.55 ? `rgba(236,246,255,${al})`      // cold white
      : `rgba(150,205,255,${al})`;                // blue-white
  };
  // WARP LINES: stars coming at the viewer fast enough to smear into light.
  //
  // The hard-won rule here: a glowing line is NOT one wide stroke. A wide stroke
  // is a capsule — square-capped it reads as a rectangle, round-capped it reads
  // as a rectangle with rounded corners, and either way it reads as a flat
  // SURFACE sliding past. Both earlier cuts failed on exactly that.
  //
  // A glowing line is a STACK of narrow additive strokes running light blue on
  // the outside to white-hot at the centre. The widest pass here is ~3px; the
  // brightness comes from the stack and the colour ramp, never from width. Every
  // pass fades to nothing at both ends, so a streak tapers instead of stopping.
  const WARP_PASSES = [
    [2.4, '110,180,255', 0.15],   // outer halo — light blue
    [1.9, '165,212,255', 0.26],
    [1.1, '215,238,255', 0.55],
    [0.5, '255,255,255', 1.00]    // core — white hot
  ];
  t.globalCompositeOperation = 'lighter';
  t.lineCap = 'round';
  for (let i = 0; i < 860; i++) {
    const a0 = Math.random() * TAU;
    const r0 = rand(inR, outR - 8);
    // longer overall than before: at warp the smear IS the read
    const len = Math.random() < 0.24 ? rand(95, 275) : rand(20, 95);
    const r1 = Math.min(outR, r0 + len);
    const al = 0.13 + Math.random() * 0.40;
    // calibre is capped hard: 2.4 x 1.5 = 3.6px at the very widest halo. Above
    // roughly 4px a stroke stops reading as a line and starts reading as a surface,
    // and that threshold is what both earlier cuts blew through.
    const wk = Math.random() < 0.13 ? rand(1.15, 1.5) : rand(0.55, 1.05);
    t.save(); t.rotate(a0);
    for (const [w, col, aMul] of WARP_PASSES) {
      const a2 = al * aMul;
      if (a2 < 0.006) continue;
      const grd = t.createLinearGradient(r0, 0, r1, 0);
      grd.addColorStop(0, `rgba(${col},0)`);
      grd.addColorStop(0.30, `rgba(${col},${a2.toFixed(3)})`);
      grd.addColorStop(0.62, `rgba(${col},${(a2 * 0.85).toFixed(3)})`);
      grd.addColorStop(1, `rgba(${col},0)`);
      t.strokeStyle = grd;
      t.lineWidth = w * wk;
      t.beginPath(); t.moveTo(r0, 0); t.lineTo(r1, 0); t.stroke();
    }
    // the head: the star still resolving to a point ahead of its own smear
    if (len > 55) {
      const hr = 2.0 * wk;
      const hg = t.createRadialGradient(r1, 0, 0, r1, 0, hr * 3.2);
      hg.addColorStop(0, `rgba(255,255,255,${Math.min(1, al * 1.5).toFixed(3)})`);
      hg.addColorStop(0.28, `rgba(200,230,255,${(al * 0.5).toFixed(3)})`);
      hg.addColorStop(1, 'rgba(110,180,255,0)');
      t.fillStyle = hg;
      t.beginPath(); t.arc(r1, 0, hr * 3.2, 0, TAU); t.fill();
    }
    t.restore();
  }
  t.globalCompositeOperation = 'source-over';
  // point stars: far enough off-axis that transit has not stretched them. These
  // keep the wall from collapsing into pure lines.
  for (let i = 0; i < 300; i++) {
    const rr = rand(inR, outR), a0 = Math.random() * TAU;
    t.fillStyle = pick((0.12 + Math.random() * 0.42).toFixed(2));
    t.save(); t.rotate(a0);
    t.beginPath(); t.arc(rr, 0, Math.random() < 0.12 ? rand(1.4, 2.4) : rand(0.4, 1.1), 0, TAU); t.fill();
    t.restore();
  }
  // (the "dust haze" pass is GONE. It was 4–11px wide strokes, which is precisely
  // the calibre that reads as a flat rounded-rectangle sliding through the bore no
  // matter how it is capped. Depth comes from the warp-line stack and the point
  // stars now; nothing in this texture is wider than about 3px.)

  // --- the TURBULENCE layer: roiling plasma in the throat (hyperspace reference) ---
  // Streaked starlight alone reads as Star Trek warp — clean, fast, empty. The
  // hyperspace look is VOLUMETRIC: a lane wall that boils. This is a second
  // texture of soft blobs stretched along the direction of travel, composited
  // additively over the streaks and stamped with the same depth bands.
  //
  // It is DELIBERATELY featureless. drawTunnel's per-band twist is fixed because
  // "a spinning wall would shear under the leaks" — enemies are painted on the
  // wall at fixed angles. So the churn cannot come from rotation. It comes from
  // per-band alpha breathing at different phases (see drawTunnel), which needs a
  // texture with no trackable features or the shear becomes visible.
  wallCloud = document.createElement('canvas');
  wallCloud.width = TS; wallCloud.height = TS;
  const cl = wallCloud.getContext('2d');
  cl.translate(half, half);
  cl.globalCompositeOperation = 'lighter';
  // A circular clip, because this is a SQUARE canvas holding a round wall. Blobs
  // stretched radially used to run off the sheet and get chopped by its corners,
  // and a chopped soft blob is a hard straight edge — the other half of the
  // "moving rectangles". Extents are constrained below as well, so this is only
  // insurance; if it ever does bite, it bites along the wall's own curve.
  cl.save();
  cl.beginPath(); cl.arc(0, 0, half * 0.995, 0, TAU); cl.clip();
  for (let i = 0; i < 190; i++) {
    const a0 = Math.random() * TAU;
    const stretch = rand(1.6, 3.0);          // elongated along travel — never round
    const rad = rand(half * 0.05, half * 0.11);
    // keep the whole ellipse on the sheet: its radial reach is rad*stretch
    const reach = rad * stretch;
    const hi = outR - reach;
    const lo = Math.min(inR * 0.92, hi);
    const rr = hi > lo ? rand(lo, hi) : lo;
    const r2 = Math.random();
    const col = r2 < 0.16 ? '190,225,255' : r2 < 0.34 ? '120,180,255' : '70,130,225';
    const al = 0.035 + Math.random() * 0.075;
    cl.save();
    cl.rotate(a0); cl.translate(rr, 0); cl.scale(stretch, 1);
    const bg = cl.createRadialGradient(0, 0, 0, 0, 0, rad);
    bg.addColorStop(0, `rgba(${col},${al.toFixed(3)})`);
    bg.addColorStop(0.45, `rgba(${col},${(al * 0.42).toFixed(3)})`);
    bg.addColorStop(1, `rgba(${col},0)`);
    cl.fillStyle = bg;
    cl.beginPath(); cl.arc(0, 0, rad, 0, TAU); cl.fill();
    cl.restore();
  }
  cl.restore(); // close the circular clip
  buildRingFx();
}
// the node holder ring, reborn as a dark machined monolith (arc lab design):
// matte gunmetal under ONE key light — the lit sector glints, the far side
// dies — with machined hairlines, an engraved index scale, seams and flange
// bolts. Static, so it prerenders once per resize.
function buildRingFx() {
  const nodeR = Math.min(W, H) * 0.44, cx = W / 2, cy = H / 2;
  const bh = Math.min(W, H) * 0.055 * ARCFX.bandW;
  const Rin = nodeR - bh, Rout = nodeR + bh;
  ringFxCv = document.createElement('canvas');
  ringFxCv.width = W * DPR; ringFxCv.height = H * DPR;
  const c = ringFxCv.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const hairline = (r, base, lit) => { // faint full ring + a glint in the lit sector
    c.lineWidth = 1;
    c.strokeStyle = `rgba(225,235,250,${base.toFixed(3)})`;
    c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.stroke();
    for (const [al, sp] of [[lit, 1.15], [lit * 0.5, 1.95]]) {
      c.strokeStyle = `rgba(225,235,250,${al.toFixed(3)})`;
      c.beginPath(); c.arc(cx, cy, r, LIGHT_A - sp, LIGHT_A + sp); c.stroke();
    }
  };
  // torus value structure: dark edges, a modest crown
  const rg = c.createRadialGradient(cx, cy, Rin, cx, cy, Rout);
  rg.addColorStop(0,    'rgb(3,5,9)');
  rg.addColorStop(0.07, arcGun(19));
  rg.addColorStop(0.32, arcGun(35));
  rg.addColorStop(0.46, arcGun(45));
  rg.addColorStop(0.62, arcGun(29));
  rg.addColorStop(0.9,  arcGun(11));
  rg.addColorStop(1,    'rgb(2,3,6)');
  c.lineWidth = bh * 2;
  c.strokeStyle = rg;
  c.beginPath(); c.arc(cx, cy, nodeR, 0, TAU); c.stroke();
  // key-light wash + bore bounce ambient, clipped to the band
  c.save();
  c.beginPath(); c.arc(cx, cy, Rout, 0, TAU); c.arc(cx, cy, Rin, 0, TAU, true); c.clip();
  const kl = c.createLinearGradient(cx + Math.cos(LIGHT_A) * nodeR, cy + Math.sin(LIGHT_A) * nodeR,
    cx - Math.cos(LIGHT_A) * nodeR, cy - Math.sin(LIGHT_A) * nodeR);
  kl.addColorStop(0, `rgba(215,228,250,${(0.13 * ARCFX.metal).toFixed(3)})`);
  kl.addColorStop(0.45, 'rgba(215,228,250,0)');
  kl.addColorStop(0.55, 'rgba(0,0,0,0)');
  kl.addColorStop(1, 'rgba(0,0,0,0.30)');
  c.fillStyle = kl; c.fillRect(0, 0, W, H);
  const bb = c.createRadialGradient(cx, cy, Rin, cx, cy, Rin + bh * 0.8);
  bb.addColorStop(0, 'rgba(100,170,230,0.07)');
  bb.addColorStop(1, 'rgba(100,170,230,0)');
  c.fillStyle = bb; c.fillRect(0, 0, W, H);
  // brushed grain (whisper-quiet at low sheen) + radial machining marks
  for (let i = 0; i < 180; i++) {
    const a0 = i / 180 * TAU, a1 = (i + 1.15) / 180 * TAU;
    const key = Math.pow(0.5 + 0.5 * Math.cos((a0 + a1) / 2 - LIGHT_A), 2.5);
    const grain = arcHash(i) - 0.5;
    const al = ARCFX.sheen * key * (0.05 + Math.max(0, grain) * 0.07);
    const dk = ARCFX.sheen * Math.max(0, -grain) * 0.10;
    c.lineWidth = bh * 2;
    if (al > 0.004) { c.strokeStyle = `rgba(225,235,255,${al.toFixed(3)})`; c.beginPath(); c.arc(cx, cy, nodeR, a0, a1); c.stroke(); }
    if (dk > 0.004) { c.strokeStyle = `rgba(0,0,0,${dk.toFixed(3)})`; c.beginPath(); c.arc(cx, cy, nodeR, a0, a1); c.stroke(); }
  }
  for (let i = 0; i < 240; i++) {
    const a = arcHash(i + 500) * TAU, len = 0.25 + arcHash(i + 900) * 0.6;
    const key = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.cos(a - LIGHT_A), 2);
    const r0 = Rin + arcHash(i + 700) * (1 - len) * bh * 2, r1 = r0 + len * bh * 0.5;
    c.strokeStyle = arcHash(i + 300) > 0.5 ? `rgba(255,255,255,${(0.02 * key).toFixed(3)})` : 'rgba(0,0,0,0.05)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    c.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    c.stroke();
  }
  c.restore();
  // machined hairlines + engraved index scale + seams with flange bolts
  hairline(Rin + 0.8, 0.10, 0.22 * ARCFX.metal);
  hairline(nodeR - bh * 0.34, 0.035, 0.10 * ARCFX.metal);
  hairline(nodeR + bh * 0.34, 0.035, 0.12 * ARCFX.metal);
  hairline(Rout - bh * 0.16, 0.04, 0.14 * ARCFX.metal);
  c.strokeStyle = 'rgba(0,0,0,0.55)'; c.lineWidth = 1.2;
  c.beginPath(); c.arc(cx, cy, Rout - 0.6, 0, TAU); c.stroke();
  for (let dg = 0; dg < 360; dg += 3) {
    const a = dg * TAU / 360, major = dg % 30 === 0;
    const r1 = Rout - bh * 0.08, r0 = r1 - (major ? bh * 0.22 : bh * 0.1);
    c.strokeStyle = `rgba(190,205,225,${major ? 0.16 : 0.07})`;
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    c.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    c.stroke();
  }
  for (let i = 0; i < 4; i++) {
    const a = i * TAU / 4 + TAU / 8, ca = Math.cos(a), sa = Math.sin(a);
    const key = 0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.cos(a - LIGHT_A), 2);
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(0,0,0,0.4)';
    c.beginPath(); c.moveTo(cx + ca * Rin, cy + sa * Rin); c.lineTo(cx + ca * Rout, cy + sa * Rout); c.stroke();
    c.strokeStyle = `rgba(255,255,255,${(0.05 * key).toFixed(3)})`;
    c.beginPath(); c.moveTo(cx + ca * Rin - sa, cy + sa * Rin + ca); c.lineTo(cx + ca * Rout - sa, cy + sa * Rout + ca); c.stroke();
    for (const off of [-0.028, 0.028]) {
      const ba = a + off, br = nodeR + bh * 0.62;
      const bx = cx + Math.cos(ba) * br, by = cy + Math.sin(ba) * br;
      c.fillStyle = arcGun(26 * key + 8);
      c.beginPath(); c.arc(bx, by, bh * 0.055, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 0.8;
      c.beginPath(); c.arc(bx, by, bh * 0.055, 0, TAU); c.stroke();
    }
  }
  // film-grain tile for the photographic finish (guarded for the test stub)
  grainCv = document.createElement('canvas');
  grainCv.width = grainCv.height = 256;
  const gc = grainCv.getContext('2d');
  const im = gc.createImageData && gc.createImageData(256, 256);
  if (im && im.data) {
    for (let i = 0; i < im.data.length; i += 4) {
      const v = 118 + (Math.random() - 0.5) * 255;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
      im.data[i + 3] = 255;
    }
    gc.putImageData(im, 0, 0);
  } else grainCv = null;
}
// animated background layer: drifting motes + rare glitch scanlines (kept subtle)
function drawLiveBg(dt) {
  for (const m of bgMotes) {
    m.y -= m.sp * dt;
    if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
    const al = 0.06 + (Math.sin(time * 2 + m.ph) * 0.5 + 0.5) * 0.1;
    ctx.fillStyle = m.white ? `rgba(255,255,255,${al.toFixed(2)})` : `rgba(120,220,255,${al.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }
  nextGlitch -= dt;
  if (nextGlitch <= 0) { glitchT = 0.12; glitchY = Math.random() * H; nextGlitch = rand(2.5, 6.5); }
  if (glitchT > 0) {
    glitchT -= dt;
    ctx.fillStyle = 'rgba(90,220,255,0.05)';
    ctx.fillRect(0, glitchY, W, 3);
    ctx.fillStyle = 'rgba(255,140,40,0.05)';
    ctx.fillRect(0, glitchY + 7, W, 2);
  }
}
// binary / hex snippets racing along the tunnel axis — glyph by glyph, in true perspective,
// flowing both toward and away from the player like live traffic on the line
// lane marker trains: runs of chevrons signed along the wall, streaming at the
// traffic speed. Replaces the binary glyph traffic of the fiber theme — same
// machinery, same cadence, but a chevron points and a digit does not, so the

      ctx.moveTo(-w * 0.45, -w * 0.42);

// ---------- geometry ----------
function geo() {
  const cx = W / 2, cy = H / 2;
  const nodeR = Math.min(W, H) * 0.44;            // the fixed node holder ring — nearly touches top/bottom
  // CANONICAL CORE: the near ring is pinned at 2.5× the node ring, so hitZ is ALWAYS
  // 0.25 no matter the screen aspect. That makes the reaction window (spawn→ring travel
  // time) and the whole playfield identical on every device — fair leaderboard, portable
  // replays — while the ring keeps its full on-screen size and the background fills the
  // rest of the screen. (Previously R0 = hypot(W,H)/2·1.08, which drifted hitZ 0.12–0.25
  // across aspect ratios; at 16:9 that formula already landed on ~2.5×, so this is a
  // no-op at the tuned aspect and only corrects the off-16:9 cases.)
  const R0 = nodeR * 2.5;
  const hitZ = (R0 / nodeR - 1) / 6;              // ≡ 0.25 exactly, independent of aspect
  // meander disabled: a straight bore keeps every depth ring concentric, so
  // wall decals project as clean annular arcs (a REAL tunnel, not an effect)
  const sw = 0, swy = 0;
  return { cx, cy, R0, nodeR, hitZ, sw, swy };
}
// depth z: 0 = past the player, 1 = far end. Swerve is anchored at the node ring
// (q=0 there), so traps always arrive exactly on the ring.
function ring(z, g) {
  // depth falloff. The linear term is CANONICAL up to the node ring — at z=hitZ
  // the extra term is exactly 0, so r(hitZ) === nodeR and hitZ stays 0.25 on
  // every screen. Past the ring a quadratic kicks in so the bore actually
  // CONVERGES: the far end runs off to a near-point instead of sitting at a
  // third of the ring, and traffic enters the horizon genuinely tiny and grows
  // the whole way in. Purely projective — z, hitboxes and timing are untouched.
  const d = Math.max(0, z - g.hitZ);
  const s = 1 / (1 + z * 6 + d * d * 5);
  let q = (z - g.hitZ) / (1 - g.hitZ);
  if (q < 0) q *= 0.4; // gentle opposite parallax for the wall rushing past the ring
  const off = Math.min(W, H) * 0.25;
  return { x: g.cx + g.sw * off * q, y: g.cy + g.swy * off * 0.7 * q, r: g.R0 * s, s };
}

// typography helpers: text lives INSIDE the bore — shrink to the clear chord
function ringChord(y, margin) {
  const g2 = geo();
  const dy = Math.abs(y - g2.cy);

function arcText(text, cx2, cy2, r, midA, px, fill, weight, maxArc, flipOv) {
  ctx.font = (weight || '800') + ' ' + px + 'px Audiowide, system-ui';
  while (px > 8 && ctx.measureText(text).width > (maxArc || TAU) * r * 0.86) {
    px--; ctx.font = (weight || '800') + ' ' + px + 'px Audiowide, system-ui';
  }
  // lower half reads outward-up. Animated callers pass flipOv locked to the
  // RESTING angle so a spin can't toggle the orientation mid-flight
  const flip = flipOv === undefined ? Math.sin(midA) > 0 : flipOv;
  const total = ctx.measureText(text).width;
  let a = midA + (flip ? 1 : -1) * (total / 2) / r;
  ctx.fillStyle = fill;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'center';
  for (const ch of text) {
    const w2 = ctx.measureText(ch).width;
    const da = (w2 / 2) / r * (flip ? -1 : 1);
    a += da;
    ctx.save();
    ctx.translate(cx2 + Math.cos(a) * r, cy2 + Math.sin(a) * r);
    ctx.rotate(a + (flip ? -Math.PI / 2 : Math.PI / 2));

    if (ctx.measureText(text).width <= maxW) return p2;

function bootRingS(g) {

  // level, the ring stays out of view — it only comes flying once play starts
  if ((state !== S.PLAY && state !== S.PAUSE && state !== S.INFO) || introT >= BOOT_LOCK) return 1;

// the beam is a straight screen-space ray: from the cannon toward where the
// stick-deflected direction exits the tunnel (far end or wall). Hit testing
// runs against this exact ray, so what you see is what you hit.
function beamGeometry(g) {
  const z0 = g.hitZ;
  const railR = g.nodeR - Math.min(W, H) * 0.055 * 0.86;
  const A = nodes[0].angle;
  const sx = g.cx + Math.cos(A) * railR, sy = g.cy + Math.sin(A) * railR;
  const u0x = Math.cos(A), u0y = Math.sin(A);
  let zExit = 1.0;
  for (let z = z0 + 0.02; z < 1; z += 0.02) {
    if (Math.hypot(u0x + beamAim.x * BEAM_S * (z - z0), u0y + beamAim.y * BEAM_S * (z - z0)) > 1.02) { zExit = z; break; }
  }
  const rg = ring(zExit, g);
  const tx = rg.x + (u0x + beamAim.x * BEAM_S * (zExit - z0)) * rg.r;
  const ty = rg.y + (u0y + beamAim.y * BEAM_S * (zExit - z0)) * rg.r;
  return { sx, sy, tx, ty, zExit, endS: rg.s / ring(z0, g).s };
}
// distance/reach test of the core against the ray; null when clear
function beamHitCore(g) {
  const b = boss;
  const seg = beamGeometry(g);
  const dx = seg.tx - seg.sx, dy = seg.ty - seg.sy;
  const len = Math.hypot(dx, dy) || 1;
  const t = ((b.sx - seg.sx) * dx + (b.sy - seg.sy) * dy) / len;
  const perp = Math.abs((-dy * (b.sx - seg.sx) + dx * (b.sy - seg.sy)) / len);
  if (t > 0 && seg.zExit >= b.z - 0.03 && perp < b.sSize * 1.25) return { seg, t: Math.min(t, len) };
  return null;
}
// project the triad formation into screen space — shared by ceremony, fight
// and drawing so the bodies, links and bearings never disagree
function layoutTriad(g) {
  const b = boss;
  b.u = Math.cos(b.ang) * b.rad;
  b.v = Math.sin(b.ang) * b.rad;
  let n2 = 0, ax = 0, ay = 0;
  for (const c of b.cores) {
    if (c.dead) continue;
    const ca = b.formA + c.i * (TAU / 3);
    c.z = b.z + Math.sin(time * 1.7 + c.i * 2.1) * 0.04;
    c.u = b.u + Math.cos(ca) * b.formR;
    c.v = b.v + Math.sin(ca) * b.formR + Math.sin(time * 2.3 + c.i) * 0.03;
    const rg = ring(c.z, g);
    c.sx = rg.x + c.u * rg.r;
    c.sy = rg.y + c.v * rg.r;
    c.sSize = Math.min(W, H) * 0.30 * rg.s * 0.55; // mini bodies of the same machine
    c.bear = Math.atan2(c.sy - g.cy, c.sx - g.cx);  // ring bearing — bolt routing key
    c.introT = b.introT; // the eyes ignite together during the ceremony
    n2++; ax += c.sx; ay += c.sy;
  }
  if (n2) { // the centroid carries the shared fields (HUD, fallbacks)
    b.sx = ax / n2; b.sy = ay / n2;
    b.sSize = b.cores.find(c => !c.dead).sSize;
  }
}
// THE DOCKABLE-ARC LAW: the largest wall-free arc if a latch also landed at
// `cand` (undefined = just the current walls). Live latches AND grapples still
// in flight all count; each occupies half-span + node tolerance to a side.
function latchFreeArc(cand) {
  const occ = [];
  for (const lt of latches) occ.push(lt.a);
  if (boss) for (const sh of boss.shots) if (sh.latch && !sh.done) occ.push(sh.th);
  if (cand !== undefined) occ.push(cand);
  if (!occ.length) return TAU;
  const HALF = 0.5 + WALL_TOL;
  const as = occ.map(a => ((a % TAU) + TAU) % TAU).sort((x, y) => x - y);
  let best = 0;
  for (let i = 0; i < as.length; i++) {
    const a1 = (i + 1 < as.length ? as[i + 1] : as[0] + TAU) - HALF;
    best = Math.max(best, a1 - (as[i] + HALF));
  }
  return best;
}
// pick a harassment angle that leaves the law intact; null = no legal arc now
function triadLatchAngle() {
  let th = nodes[Math.random() < 0.5 ? 0 : 1].angle + (Math.random() < 0.5 ? -1 : 1) * rand(0.55, 1.0);
  for (let k = 0; k < 10; k++) {
    if (latchFreeArc(th) >= TRIAD_FREE_ARC) return th;
    th += 2.399963; // deterministic golden hop, like clearOfWalls
  }

}
// dart + grapple resolution at the rail — identical physics for every boss
function resolveBossShots(dt, g, railR) {

      sh.done = true;

      if (sh.latch) { // the grapple bites into the rail (dart WAS the telegraph)
        latches.push({ a: sh.th, span0: 0.5, t: 0, dur: 3, tele: 0, arm: 0.25 });
        burst(hx, hy, '#ff9a3c', 18, 4);

function updateBossFight(dt, g) {
  const b = boss;
  const bd = BOSS_DEFS[b.kind];
  b.spin += dt * 2;
  b.hurtT = Math.max(0, b.hurtT - dt);
  const z0 = g.hitZ;
  const railR = g.nodeR - Math.min(W, H) * 0.055 * 0.86;

  // its eye ignites, it speaks — and only then does the duel begin
  if (b.introT < BOSS_CER) {
    b.introT = Math.min(BOSS_CER, b.introT + dt);
    const q = b.introT / BOSS_CER;
    b.z = lerp(1.55, b.kind === 'spinner' ? 0.5 : 0.55, 1 - Math.pow(1 - q, 2));
    b.ang += dt * 0.35;
    b.rad = b.kind === 'spinner' ? 0.12 * (1 - q) : 0.12; // the beacon claims the exact center
    b.u = Math.cos(b.ang) * b.rad;
    b.v = Math.sin(b.ang) * b.rad;
    const brg0 = ring(b.z, g);
    b.sx = brg0.x + b.u * brg0.r; b.sy = brg0.y + b.v * brg0.r;
    b.sSize = Math.min(W, H) * 0.30 * brg0.s;
    if (b.kind === 'triad') { // the triangle unfolds as it surfaces
      b.formA += dt * 0.5;
      b.formR = lerp(0.05, 0.30, q);
      layoutTriad(g);
      for (const c of b.cores) c.spin += dt * 2;
    }
    if (!b.cer1) { b.cer1 = true; tone(30, 2.6, 'sine', 0.16, 55); crackle(2.4, 60, 260, 1, 0.35); }
    if (!b.cer2 && b.introT > 1.5) { // the eye ignites; it speaks
      b.cer2 = true;
      sfx.bossOnline(); buzz([40, 60, 90]);
      commCur = { s: 'CORE', m: bd.speak }; commT = 0;
    }
    if (b.introT >= BOSS_CER) {
      popup(W / 2, H * 0.30, bd.online, '#d465ff');
      shake = 1; buzz([30, 40, 60]);
      tone(160, 0.5, 'sawtooth', 0.14, 60);
    }

  }

  if (b.kind === 'triad')   { updateTriadFight(dt, g);   resolveBossShots(dt, g, railR); return; }
  if (b.kind === 'spinner') { updateSpinnerFight(dt, g); resolveBossShots(dt, g, railR); return; }

  b.retarget -= dt;

    b.retarget = rand(0.9, 1.7) * (b.phase2 ? 0.75 : 1);
    b.tAng = Math.random() * TAU;
    b.tRad = rand(0.1, 0.6);
    b.tZ = rand(z0 + 0.28, z0 + 0.55);
  }
  b.ang += angDiff(b.tAng, b.ang) * Math.min(1, dt * 2.2);
  b.rad = lerp(b.rad, b.tRad, Math.min(1, dt * 2.2));
  b.z = lerp(b.z, b.tZ, Math.min(1, dt * 1.6));
  b.u = Math.cos(b.ang) * b.rad;
  b.v = Math.sin(b.ang) * b.rad + Math.sin(time * 2.3) * 0.05;
  const brg = ring(b.z, g);
  b.sx = brg.x + b.u * brg.r;
  b.sy = brg.y + b.v * brg.r;
  b.sSize = Math.min(W, H) * 0.30 * brg.s;

    const A = nodes[Math.random() < 0.5 ? 0 : 1].angle;
    const fireOrb = th => b.shots.push({ u0: b.u, v0: b.v, zb: b.z, th, t: 0, dur: rand(1.0, 1.35) });
    const roll = Math.random();
    if (roll < 0.45) fireOrb(A + rand(-0.12, 0.12)); // aimed
    else if (roll < 0.8) { const sp = rand(0.3, 0.45); fireOrb(A - sp); fireOrb(A); fireOrb(A + sp); } // fan
    else { const off = rand(0.5, 0.9); fireOrb(A - off); fireOrb(A + off); fireOrb(A + rand(-0.15, 0.15)); } // pincer

  b.latchT = (b.latchT === undefined ? 5 : b.latchT) - dt;

    b.latchT = rand(5.5, 8) * (b.phase2 ? 0.75 : 1);
    const th = nodes[0].angle + (Math.random() < 0.5 ? -1 : 1) * rand(0.55, 1.0);
    b.shots.push({ u0: b.u, v0: b.v, zb: b.z, th, t: 0, dur: 1.15, latch: true });

// ---------- triad: BADGE ZERO's private core — one machine in three bodies ----------
// scarce docking is the fight: the ring stays ridden with rail latches (two at
// once) while the bodies spray telegraphed dart fans. The bolt hunts whichever
// body you AIM at; three bolts each, and the survivors only get angrier.
function updateTriadFight(dt, g) {
  const b = boss;
  const z0 = g.hitZ;
  const down = 3 - b.cores.reduce((n2, c) => n2 + (c.dead ? 0 : 1), 0);
  const rage = 1 + down * 0.25; // each lost body speeds the rest up
  // the triangle wheels around the bore as one machine
  b.formA += dt * 0.35 * rage;
  b.retarget -= dt * rage;
  if (b.retarget <= 0) {
    b.retarget = rand(1.1, 2.0);
    b.tAng = Math.random() * TAU;
    b.tRad = rand(0.06, 0.34);
    b.tZ = rand(z0 + 0.32, z0 + 0.58);
  }
  b.ang += angDiff(b.tAng, b.ang) * Math.min(1, dt * 1.8);
  b.rad = lerp(b.rad, b.tRad, Math.min(1, dt * 1.8));
  b.z = lerp(b.z, b.tZ, Math.min(1, dt * 1.4));
  layoutTriad(g);
  for (const c of b.cores) {
    if (c.dead) continue;
    c.spin += dt * (2 + down * 0.7);
    c.hurtT = Math.max(0, c.hurtT - dt);
  }
  for (const bm of b.booms) bm.t += dt;
  b.booms = b.booms.filter(bm => bm.t < 0.9);

  // then a five-dart spray with dodgeable gaps
  b.volleyT -= dt;
  if (b.volleyT <= 0) {
    b.volleyT = rand(2.6, 3.6) / rage;
    let c = null; // round-robin across the LIVING bodies
    for (let k = 0; k < 3 && !c; k++) {
      const cand = b.cores[b.volleyN++ % 3];
      if (!cand.dead) c = cand;
    }
    if (c) c.chargeT = 0.55; // the glow IS the warning
  }
  for (const c of b.cores) {
    if (c.dead || !(c.chargeT > 0)) continue;
    c.chargeT -= dt;
    if (c.chargeT <= 0) { // the spray flies
      const base = nodes[Math.random() < 0.5 ? 0 : 1].angle + rand(-0.2, 0.2);
      for (let k = -2; k <= 2; k++) {
        b.shots.push({ u0: c.u, v0: c.v, zb: c.z, th: base + k * 0.5, t: 0, dur: rand(1.05, 1.25) });
      }
      sfx.bossShot();
    }
  }

  // passes the dockable-arc law first: a wall-free arc >= TRIAD_FREE_ARC must
  // survive, so a firing window always exists somewhere on the ring
  b.latchT -= dt;
  const pend = b.shots.reduce((n2, sh) => n2 + (sh.latch && !sh.done ? 1 : 0), 0);
  if (b.latchT <= 0 && latches.length + pend < 2) {
    const th = triadLatchAngle();
    if (th !== null) {
      b.latchT = rand(2.4, 3.6) / rage;
      const c = b.cores.find(c2 => !c2.dead) || b;
      b.shots.push({ u0: c.u, v0: c.v, zb: c.z, th, t: 0, dur: 1.15, latch: true });
      sfx.bossShot();
    } else b.latchT = 0.8; // no legal arc right now — retry shortly
  }
}
// ---------- spinner: THE BEACON — a lighthouse in the bore ----------
// beam rounds: telegraph, then a full-circle sweep the player must outrun with
// BOTH nodes. Completing the rotation overloads the beacon itself — that's the
// only damage it takes (bolts fizzle on its shield). Between sweeps it throws
// a zappable intrusion wave with a rim-wall latch riding along.
function spawnSpinnerWave() {
  const b = boss;
  // the latch lands first so the wave spawns around it (reachability law)
  const th = nodes[0].angle + Math.PI + rand(-0.8, 0.8);
  latches.push({ a: th, span0: 0.5, t: 0, dur: 3, tele: 0.9, arm: 0.4, z0: SPAWN_Z });

  // FAIRNESS: the wave is a CONVOY, not a wall. At most TWO hostiles share an
  // arrival window (one per node), window partners land a half-ring apart so
  // both are reachable, and windows arrive ~0.85s apart down the pipe.
  const n2 = 3 + Math.min(3, b.round); // the waves thicken round by round
  const gapZ = 0.85 * (LV.speed || 0.5) * (mutators.fast ? 1.35 : 1);

  for (let k = 0; k < n2; k++) {
    const w = k >> 1; // window index — two seats per window
    let a;
    if (k & 1) { // seat 2: opposite-ish — and NEVER stacked on the partner,
      a = clearOfWalls(prevA + Math.PI + rand(-0.6, 0.6)); // even when a wall
      for (let h = 0; h < 6 && Math.abs(angDiff(a, prevA)) < 1.2; h++)
        a = clearOfWalls(a + 2.399963); // hop shifted it — hop until honestly apart
    } else a = clearOfWalls(prevA + 2.4 + rand(-0.4, 0.4)); // fresh window: hop onward
    const en2 = spawnEnemy(a, 'normal');
    en2.lock = undefined;
    en2.z = SPAWN_Z + w * gapZ; // stagger the windows down the pipe

function updateSpinnerFight(dt, g) {
  const b = boss;

  b.z = lerp(b.z, 0.5, Math.min(1, dt * 1.2));

      popup(W / 2, H * 0.3, 'SWEEP ' + (b.round + 1) + '/' + b.maxHp, '#ffd24a');

    }

      }
    }
    if (b.swept >= TAU) { // full rotation — the discharge overloads the BEACON
      b.round++;

      burst(b.sx, b.sy, '#ffd24a', 26, 5);
      popup(b.sx, b.sy - b.sSize, 'OVERLOAD ' + b.round + '/' + b.maxHp, '#ffd24a');
      shake = 1;

      crackle(0.4, 2400, 400, 3, 0.8);

      }
      b.mode = 'adds';
      b.modeT = 14; // the add phase can't stall the fight forever

      b.mode = 'tele';
      b.modeT = 1.7;
      tone(960, 0.04, 'sine', 0.06); tone(960, 0.04, 'sine', 0.06, null, null, 0.16);
    }
  }
}

// ---------- particles ----------
function burst(x, y, color, n, spd) {

    const a = Math.random() * TAU, v = rand(0.3, 1) * spd;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: rand(1.2, 2.6), color, size: rand(0.7, 1.8) });
  }

// the decompile: a killed hostile doesn't explode — the body GLITCHES OUT in

    if (!bootNodeSample) { // sign-off clicks — only when no whir is carrying the ramp
      tone(1500, 0.014, 'square', 0.05);
      tone(215, 0.07, 'square', 0.05); tone(260, 0.07, 'square', 0.04);
      tone(1250, 0.02, 'square', 0.06, null, null, 0.09);
      tone(1250, 0.02, 'square', 0.06, null, null, 0.18);
    }
    buzz(15);
  }
  // holding at the gate: a quiet standby pip keeps the console alive
  if (stageNow === 3 && !introLatch && inIntro) {
    gatePip -= dt;
    if (gatePip <= 0) { gatePip = 1.1; tone(960, 0.03, 'sine', 0.03); }
  }

  // effect timers run on real time; hit-stop scales the game clock
  fx.wide = Math.max(0, fx.wide - dt);
  fx.auto = Math.max(0, fx.auto - dt);
  fx.chain = Math.max(0, fx.chain - dt);
  tolVis += ((fx.wide > 0 ? 1.36 : 1) - tolVis) * Math.min(1, dt * 6);
  // intercepted transmissions: the investigation chatters over the line at
  // scripted times — deterministic levels keep them in sync with the action
  if (!endless && !qual && !tut && levelIdx >= 0 && !boss) {
    const cl = COMMS[levelIdx] || [];
    if (commNext < cl.length && levelT >= cl[commNext].t) { commCur = cl[commNext++]; commT = 0; }
  }
  if (commCur) { commT += dt; if (commT > 6) commCur = null; }
  let sdt = dt;
  if (hitStop > 0) { hitStop = Math.max(0, hitStop - dt); sdt *= 0.12; }
  if (tut && tut.frozen) sdt = 0; // the TAP-TO-FIRE hold: the world stands still
  if (boss && boss.dying !== undefined) sdt *= 0.25; // the kill plays in slow motion
  if (!tut && !inIntro) levelT += sdt;

  // keyboard control (desktop testing) — controls always run at full speed
  const kSpd = 4.5 * dt;
  if (keys['a'] || keys['A']) nodes[0].angle -= kSpd;
  if (keys['d'] || keys['D']) nodes[0].angle += kSpd;
  if (!boss) {
    if (keys['ArrowLeft'])  nodes[1].angle -= kSpd;
    if (keys['ArrowRight']) nodes[1].angle += kSpd;
  }

  if (!inIntro) {
    if (tut) updateTutorial(sdt);
    else if (levelT < L.duration) { trySpawn(sdt); runBeats(); } // stop spawning once the run distance is covered
  }
  if (burstQ) {
    burstQ.t -= sdt;
    if (burstQ.t <= 0) { spawnEnemy(); burstQ.left--; burstQ.t = 0.35; if (!burstQ.left) burstQ = null; }
  }
  if (patternQ.length) { // choreographed volleys ride the real-time beat grid
    for (const q of patternQ) q.t -= dt;
    while (patternQ.length && patternQ[0].t <= 0) spawnEnemy(patternQ.shift().angle);
  }
  if (!inIntro) pickupT -= sdt;
  if (!tut && pickupT <= 0) { pickupT = srand(20, 32); if (!mutators.noPickups) spawnPickup(); }
  // golden bonus streams ride in on their own clock, once the campaign has
  // taught them (level 5+) — free flow gets them throughout. None spawn near
  // a level's end: a ribbon must have time to be ridden AND spent
  if (!inIntro && !tut && !boss && (endless || levelIdx >= 4)) {
    ribbonT -= sdt;
    if (ribbonT <= 0) {
      // the ribbon also RESPECTS the ledger: it won't enter a window where a
      // dual-node arrival is already booked — it waits for a clean stretch
      if ((endless || levelT < L.duration - 14) && spawnAllowed('strip')) {
        ribbonT = srand(26, 40);
        spawnStrip();
      } else ribbonT = 2.5; // busy lane — try again shortly
    }
  }

  const g = geo();

  const waveMul = mutators.fast ? 1.35 : 1; // constant clock — surges live in endless L.speed
  trafficSpeed = L.speed * waveMul; // tunnel bands, hoops, river and glyphs all ride this
  const TOL = ARCFX.span * tolVis; // the arc IS the window — same span the node renders
  // a rebooting node (node-killer hit) covers nothing until it's back online
  const covers = (n, a) => !(n.deadT > 0) && Math.abs(angDiff(n.angle, a)) < TOL;
  const ringXY = a => ({ x: g.cx + Math.cos(a) * g.nodeR, y: g.cy + Math.sin(a) * g.nodeR });
  const railR = g.nodeR - Math.min(W, H) * 0.055 * 0.86;
  const nodeXY = n => ({ x: g.cx + Math.cos(n.angle) * railR, y: g.cy + Math.sin(n.angle) * railR });
  const nearest = a => Math.abs(angDiff(nodes[0].angle, a)) < Math.abs(angDiff(nodes[1].angle, a)) ? nodes[0] : nodes[1];

  // node-killer reboot: a fried optic counts down, then pops back online
  for (const n of nodes) if (n.deadT > 0) {
    const prevDead = n.deadT;
    n.deadT = Math.max(0, n.deadT - dt);
    // the reboot take whirs while the optic spins back up, timed so its
    // ENDING lands on the node popping back online
    const rs = sampleTrim.restart;
    const rebootAt = rs ? Math.min(2, rs.end - rs.start) : 0;
    if (sampleBufs.restart && prevDead >= rebootAt && n.deadT < rebootAt)
      playSample('restart', 1, Math.cos(n.angle) * 0.6);
    if (n.deadT === 0) {
      n.formAt = introT; // replay the materialize pop — the lens re-forms
      const p2 = nodeXY(n);
      burst(p2.x, p2.y, n === nodes[0] ? NODE_HEX[0] : NODE_HEX[1], 20, 4);
      popup(p2.x, p2.y - 22, 'NODE ONLINE', '#8fe0ff');
      if (!sampleBufs.restart) sfx.heal(); // synth stand-in when samples are absent
      buzz(15);
    }
  }

  // rim walls: telegraph (dashed arc arms) -> bite -> 3s burn-off. A node
  // sliding into the live clamp fries, node-killer style — route around it
  if (!inIntro) for (const lt of latches) lt.t += dt;
  latches = latches.filter(lt => lt.t < lt.tele + lt.dur);
  const fused = boss && boss.mergeT >= 1;
  for (const lt of latches) {
    if (!lt.bit && lt.t >= lt.tele) { // the wall bites into the rail
      lt.bit = true;
      if (lt.tele > 0) {
        const hp2 = ringXY(lt.a);
        burst(hp2.x, hp2.y, '#ff9a3c', 18, 4);
        popup(hp2.x, hp2.y - 20, 'RAIL LATCHED', '#ffb478');
        tone(140, 0.3, 'sawtooth', 0.12, 70);
        crackle(0.3, 2400, 500, 4, 0.6);
        buzz(25);
      }
    }
    const lt2 = lt.t - lt.tele;
    if (lt2 < lt.arm) continue; // a beat of grace before it can hurt
    const half = lt.span0 * (1 - lt2 / lt.dur);
    for (let i = 0; i < 2; i++) {
      if (fused && i === 1) continue; // one fused carriage in the duel
      if (nodes[i].deadT > 0) continue;
      if (Math.abs(angDiff(nodes[i].angle, lt.a)) < half) { // crossed the clamp
        nodes[i].deadT = 2;
        if (fused) nodes[1].deadT = 2;
        const p2 = nodeXY(nodes[i]);
        burst(p2.x, p2.y, '#ff9a3c', 22, 4);
        popup(p2.x, p2.y - 24, fused ? 'CANNON FRIED' : 'NODE FRIED', '#ffb478');
        sfx.fry(Math.cos(nodes[i].angle) * 0.6);
        redFlash = Math.max(redFlash, 0.5);
        shake = Math.min(shake + 0.5, 1);
        buzz([40, 30, 60]);
      }
    }
  }

  // UNITE-VOLLEY: docking both nodes together sacrifices ALL other coverage
  // for half a second — the charge — then a focused bolt fires straight into
  // the bore. In the duel the bolt homes on the core instead.
  volley.cd = Math.max(0, volley.cd - dt);
  const bothAlive = !(nodes[0].deadT > 0) && !(nodes[1].deadT > 0);
  // hysteresis: docking engages inside 0.26 rad, but once charging, only a
  // DECISIVE split (0.45) releases — thumb jitter on glass can't fire it
  const dockGap = Math.abs(angDiff(nodes[0].angle, nodes[1].angle));
  const docked = state === S.PLAY && !inIntro && bothAlive
    && !(boss && (boss.introT < BOSS_CER || boss.dying !== undefined))
    && dockGap < (volley.charge > 0 ? 0.45 : 0.26);
  if (docked && volley.cd <= 0) {
    if (volley.charge === 0) { crackle(0.5, 300, 2200, 2, 0.28); buzz(8); } // capacitor whine
    volley.charge = Math.min(0.5, volley.charge + dt);
    // the shot goes where you're AIMING while docked
    volley.aimA = nodes[0].angle + angDiff(nodes[1].angle, nodes[0].angle) / 2;
    if (volley.charge >= 0.5) fireVolley(g); // half a second of full commitment, then it flies
  } else if (volley.charge > 0) {
    tone(600, 0.08, 'sine', 0.04, 380); // fizzle — dock broken before the charge completed
    volley.charge = 0;
  }
  for (const sh of volley.shots) {
    if (sh.dead) continue;
    if (sh.homing) { // duel bolt: rides the wire straight to the core
      sh.t += dt / 0.55;
      if (!boss) { sh.dead = true; continue; }
      if (sh.t >= 1) { sh.dead = true; bossVolleyHit(sh); }
      continue;
    }
    sh.z += dt * 2.4;
    if (sh.z > (sh.reach || SPAWN_Z)) { sh.dead = true; continue; } // spent at the horizon
    for (const en of enemies) {
      if (en.dead || en.resolved || en.failed || en.type === 'strip') continue;
      // the bolt only answers to SINGLE plain reds and heavy armor — barrier
      // pairs and color-locked taps are keyed work for the nodes themselves
      if (en.type === 'line' || en.partner || en.lock !== undefined) continue;
      if (Math.abs(angDiff(en.angle, sh.a)) > 0.30 || Math.abs(en.z - sh.z) > 0.09) continue;
      const rgV = ring(Math.max(en.z, 0.02), g);
      const vx = rgV.x + Math.cos(en.angle) * rgV.r, vy = rgV.y + Math.sin(en.angle) * rgV.r;
      if (en.type === 'frag') {
        // shooting a trap REPLICATES it — one becomes two. The lesson costs.
        sh.dead = true;
        en.dead = true;
        for (const s3 of [-1, 1]) {
          enemies.push({ type: 'frag', lock: undefined, z: Math.min(SPAWN_Z - 0.06, en.z + 0.22),
            angle: en.angle + s3 * 0.32, sizeMul: 0.8, speedMul: 1,
            spin: Math.random() * TAU, spinMul: 1, age: 0, dead: false, partner: null });
        }
        burst(vx, vy, '#4a5568', 26, 4);
        burst(vx, vy, '#ff9a3c', 12, 3);
        popup(vx, vy, 'TRAP REPLICATED ×2', '#ff9a3c');
        tone(150, 0.3, 'sawtooth', 0.13, 60);
        crackle(0.3, 2600, 500, 3, 0.7);
        shake = Math.min(shake + 0.5, 1);
        buzz([30, 30, 50]);

      }
      // volley kills pay a flat bounty — no combo, no zap credit, no pulse
      // feed: interception stays the scoring game, this is a TOOL
      en.dead = true;
      const vb = Math.round((en.type === 'heavy' ? 250 : 60) * mutMul());
      score += vb;
      decompile(en.angle, en.z, en);
      popup(vx, vy, (en.type === 'heavy' ? 'ARMOR DOWN +' : '+') + vb, '#bfeaff');
      if (en.tut) popup(vx, vy - 30, 'NEUTRALIZED', '#7ee262'); // the label's verb, answered
      rimFX.push({ a: en.angle, t: 0.4, col: '140,225,255' });
      const volleyZapSampled = sfx.zap(1, Math.cos(en.angle) * 0.6);
      buzz(en.type === 'heavy' ? 25 : 12);
      spawnKillStreak(en.angle, en.z);
      lastKillBeat(en);
      if (en.type === 'heavy') { // armor stops the bolt; reds it punches through
        if (!volleyZapSampled) tone(110, 0.2, 'square', 0.13, 60); // synth-era armor thump
        sh.dead = true;
        break;
      }
    }
  }
  volley.shots = volley.shots.filter(sh => !sh.dead);

  let stripProg = -1; // >= 0 while a node is riding a stream this frame
  for (const en of enemies) {
    en.z -= L.speed * waveMul * (en.speedMul || 1) * sdt;
    en.spin += sdt * 4 * (en.spinMul || 1);
    en.age += sdt;
    if (en.drift) en.angle += en.drift * sdt;

    // sonar tick: a quiet geiger blip per hostile, panned to its angle,
    // accelerating as it closes — the wave is audible before it's urgent
    if (!en.dead && !en.resolved && !en.failed && en.type !== 'frag' && en.type !== 'strip' && en.z > g.hitZ && en.z < 1.9) {
      en.tickT = (en.tickT || 0) - sdt;
      if (en.tickT <= 0) {
        const tArr = (en.z - g.hitZ) / (trafficSpeed * (en.speedMul || 1));
        en.tickT = clamp(tArr * 0.38, 0.14, 1.25);
        sonarTick(1150 + 350 * clamp(1 - tArr / 1.5, 0, 1), Math.cos(en.angle) * 0.75);
      }
    }

    if (en.type === 'strip') {
      // data stream: keep a node ON the ring-crossing point from head to tail
      en.tracing = false;
      if (!en.dead && !en.failed && en.z <= g.hitZ && en.z + en.len >= g.hitZ) {
        const aReq = stripAngle(en, g.hitZ - en.z);
        const on0 = covers(nodes[0], aReq), on1 = covers(nodes[1], aReq);
        if (on0 || on1 || fx.auto > 0) {
          en.offT = 0;
          en.tracing = true;
          stripProg = clamp((g.hitZ - en.z) / en.len, 0, 1); // drives the trace drone
          en.traceNode = on0 ? 0 : on1 ? 1 : en.traceNode || 0;
          en.traceT = (en.traceT || 0) + sdt;
          if (en.traceT > 0.14) { // score ticks while riding the line
            en.traceT -= 0.14;
            score += Math.round(20 * mutMul());
            const hp = ringXY(aReq);
            burst(hp.x, hp.y, '#ffd24a', 2, 2.5);
          }
        } else if ((en.offT = (en.offT || 0) + sdt) < 0.18) {

          // doesn't break the stream — staying off it does
        } else if (en.tut) { // practice stream: no penalty, run the drill again
          if (tut) { tut.retry = en.tut; tut.t = 0; }
          en.dead = true;
          const hp = ringXY(aReq);
          popup(hp.x, hp.y, 'STAY ON THE STREAM — AGAIN', '#ff9a3c');
          sfx.miss();
        } else {
          // the bonus fizzles — a missed opportunity, never a wound
          en.failed = true;
          const hp = ringXY(aReq);
          burst(hp.x, hp.y, '#ffd24a', 8, 2.5);
          popup(hp.x, hp.y, 'STREAM LOST', 'rgba(255,225,160,0.85)');
          tone(520, 0.14, 'sine', 0.05, 390);
        }
      }
      if (!en.dead && en.z + en.len < g.hitZ) { // tail cleared the ring
        en.dead = true;
        if (!en.failed) {
          const pts = Math.round(250 * mutMul());
          score += pts;
          const aEnd = stripAngle(en, en.len);
          const hp = ringXY(aEnd);
          burst(hp.x, hp.y, '#ffd24a', 26, 4);
          burst(hp.x, hp.y, '#ffffff', 14, 5);
          rimFX.push({ a: aEnd, t: 0.5, col: '255,210,74' });
          sfx.traced();
          // a full ride buys a full pulse for the node that rode it
          const ni = en.traceNode !== undefined ? en.traceNode
            : Math.abs(angDiff(nodes[0].angle, aEnd)) < Math.abs(angDiff(nodes[1].angle, aEnd)) ? 0 : 1;
          pulseCharge[ni] = PULSE_MAX; // the ride banks a full pulse — tutorial included
          popup(hp.x, hp.y, 'PULSE CHARGED +' + pts, '#ffe9b0');
          sfx.perfect();
          buzz(30);
        }
      }
      // the ribbon lights up in the tracing node's color, fading in and out
      en.traceGlow = clamp((en.traceGlow || 0) + (en.tracing ? sdt * 5 : -sdt * 3), 0, 1);
      continue; // ribbons never enter the zap/miss resolution below
    }

    if (!en.dead && !en.resolved && en.z <= g.hitZ) {
      // node killer: a hacker trap — touching it IS the mistake
      if (en.type === 'frag') {
        const touched = covers(nodes[0], en.angle) || covers(nodes[1], en.angle);
        const { x: fx2, y: fy } = ringXY(en.angle);
        if (touched) {
          en.dead = true;
          burst(fx2, fy, '#4a5568', 22, 3.5);
          if (en.tut && en.touchMe) { // the lesson: feel the fry, no penalty beyond it
            if (tut) tut.fragTaught = true;
            for (const n of nodes) if (covers(n, en.angle)) n.deadT = 2;
            popup(fx2, fy, 'FRIED — 2s REBOOT. now you know', '#ff9a3c');
            sfx.fry(Math.cos(en.angle) * 0.7);
            buzz([40, 40, 60]);
          } else if (en.tut) { // practice: it fries here too — dodge means dodge
            if (tut) { tut.retry = en.tut; tut.t = 0; }
            for (const n of nodes) if (covers(n, en.angle)) n.deadT = 2;
            popup(fx2, fy, 'FRIED — dodge it. AGAIN', '#ff9a3c');
            sfx.fry(Math.cos(en.angle) * 0.7);
            buzz([40, 40, 60]);
          } else {
            combo = 0; comboHeal = 0; fragsHit++;
            if (!shieldAbsorb(fx2, fy)) {
              // the trap fries every node that touched it — 2s forced reboot
              for (const n of nodes) if (covers(n, en.angle)) n.deadT = 2;
              popup(fx2, fy, 'NODE FRIED — REBOOTING', '#ff4a5e');
              redFlash = 1; shake = Math.min(shake + 0.6, 1);
              sfx.fry(Math.cos(en.angle) * 0.7);
              buzz([40, 40, 60]);
            }
          }
        } else {
          en.resolved = true;
          if (en.tut && en.touchMe) { // the lesson requires contact — again
            if (tut) { tut.retry = en.tut; tut.t = 0; }
            popup(fx2, fy, 'TOUCH it this once — feel what it does', '#ff9a3c');
          } else {
            const bonus = Math.round(50 * mutMul());
            score += bonus;
            popup(fx2, fy, (en.tut ? 'DODGED +' : 'trap avoided +') + bonus, en.tut ? '#7ee262' : '#9aa7bd');
          }
        }
        continue;
      }
      let hit = false;
      const boltPairs = []; // [node, targetAngle] — where the lightning jumps from/to
      if (fx.auto > 0) {
        hit = true; // auto-zap: the firewall clears anything crossing the ring
        if (en.partner) boltPairs.push([nodes[0], en.angle], [nodes[1], en.partner.angle]);
        else boltPairs.push([nearest(en.angle), en.angle]);
      } else if (en.type === 'heavy') {
        // heavy armor: a charged volley still cracks it early — and BOTH
        // arcs docked on its lane break it together at the rim. One node
        // alone still bounces off.
        hit = covers(nodes[0], en.angle) && covers(nodes[1], en.angle);
        if (hit) boltPairs.push([nodes[0], en.angle], [nodes[1], en.angle]);
      } else if (en.type === 'line') {
        // barrier: one node on each end, either assignment
        const p = en.partner;
        if (covers(nodes[0], en.angle) && covers(nodes[1], p.angle)) { hit = true; boltPairs.push([nodes[0], en.angle], [nodes[1], p.angle]); }
        else if (covers(nodes[1], en.angle) && covers(nodes[0], p.angle)) { hit = true; boltPairs.push([nodes[1], en.angle], [nodes[0], p.angle]); }
      } else if (en.lock !== undefined) {
        // color-locked: only the matching node can break it
        hit = covers(nodes[en.lock], en.angle);
        if (hit) boltPairs.push([nodes[en.lock], en.angle]);
      } else {
        const shooter = covers(nodes[0], en.angle) ? nodes[0] : covers(nodes[1], en.angle) ? nodes[1] : null;
        hit = !!shooter;
        if (shooter) boltPairs.push([shooter, en.angle]);
      }
      const { x: ex, y: ey } = ringXY(en.angle);
      if (hit) {
        en.dead = true;
        if (combo === 0) comboStartT = levelT;                       // a new streak begins
        combo++;
        if (combo > maxCombo) { maxCombo = combo; maxComboStart = comboStartT; } // this streak owns the record
        if (comboStartT === maxComboStart) maxComboSec = levelT - maxComboStart; // extend the record streak's span
        // precision grading: dead-center coverage doubles the take (never via auto-zap)
        let err = 0;
        for (const [n, a] of boltPairs) err = Math.max(err, Math.abs(angDiff(n.angle, a)));
        const perfect = fx.auto <= 0 && boltPairs.length > 0 && err < TOL * 0.35;
        if (perfect) perfects++;
        const base = en.type === 'heavy' ? 250 : en.type === 'line' ? 300 : en.lock !== undefined ? 150 : 100;
        const pts = Math.round(base * (perfect ? 2 : 1) * mutMul()) * scoreMul();
        score += pts; zaps++;
        // each shooter banks the zap into ITS orb (both, on a shared kill) —
        // choosing which node fires is choosing which pulse you charge
        if (!en.tut) {
          const fed = new Set();
          for (const [n2] of boltPairs) fed.add(n2 === nodes[0] ? 0 : 1);
          for (const fi of fed) {
            if (pulseCharge[fi] >= PULSE_MAX) continue;
            pulseCharge[fi] = Math.min(PULSE_MAX, pulseCharge[fi] + Math.min(combo, 5));
            if (pulseCharge[fi] >= PULSE_MAX) {
              popup(W / 2, H * 0.35, (fi === 0 ? 'BLUE' : 'WHITE') + ' PULSE CHARGED — TAP ITS CORE', '#8fe0ff');
              sfx.heal();
              buzz(15);
            }
          }
        }
        // max-combo streaks knit the payload back together
        const cap = mutators.oneLife ? 25 : 100;
        if (combo >= 5 && integrity < cap) {
          comboHeal++;
          if (comboHeal >= 5) {
            comboHeal = 0;
            integrity = Math.min(cap, integrity + 25);
            popup(ex, ey - 26, 'INTEGRITY RESTORED', '#8fc7ff');
            rimFX.push({ a: en.angle, t: 0.6, col: '143,199,255' });
            sfx.heal();
            buzz(12);
          }
        }
        decompile(en.angle, g.hitZ, en);
        if (en.partner) {
          en.partner.dead = true;
          decompile(en.partner.angle, g.hitZ, en.partner);
        }
        for (const [n, a] of boltPairs) {
          const t0 = ringXY(a);
          // the discharge leaps from BOTH bus-bars onto the target between them
          if (n.tipA) spawnBolt(n.tipA.x, n.tipA.y, t0.x, t0.y);
          if (n.tipB) spawnBolt(n.tipB.x, n.tipB.y, t0.x, t0.y);
          n.recoil = 1; // the arc flares white...
          n.dip = 1;    // ...and its energy visibly drains, then recovers
          rimFX.push({ a, t: 0.45, col: '140,225,255' });
        }
        // chain overdrive: the kill arcs to the nearest other hostile and
        // takes it too — locks and armor don't stop raw lightning
        if (!en.tut && fx.chain > 0) {
          let cBest = null, cd = 9;
          for (const c of enemies) {
            if (c === en || c === en.partner || c.dead || c.resolved || c.failed) continue;
            if (c.type === 'frag' || c.type === 'strip') continue; // never into payloads or ribbons
            const dA = Math.abs(angDiff(c.angle, en.angle));
            if (dA < cd) { cd = dA; cBest = c; }
          }
          if (cBest) {
            cBest.dead = true;
            if (cBest.partner) cBest.partner.dead = true;
            const rg2 = ring(Math.max(cBest.z, 0.02), g);
            const bx = g.cx + Math.cos(cBest.angle) * rg2.r, by = g.cy + Math.sin(cBest.angle) * rg2.r;
            spawnBolt(ex, ey, bx, by);
            decompile(cBest.angle, cBest.z, cBest, 0.8);
            const cb = cBest.type === 'heavy' ? 250 : cBest.type === 'line' ? 300 : cBest.lock !== undefined ? 150 : 100;
            const cpts = Math.round(cb * 0.5 * mutMul());
            score += cpts; zaps++;
            popup(bx, by, 'CHAIN +' + cpts, '#d8b4ff');
            spawnKillStreak(cBest.angle, cBest.z);
            tone(1976, 0.1, 'triangle', 0.08, 2960);
          }
        }
        if (en.type === 'line' && en.partner) { // the wall snaps
          const p3 = ringXY(en.partner.angle);
          for (let k2 = 1; k2 < 4; k2++) burst(lerp(ex, p3.x, k2 / 4), lerp(ey, p3.y, k2 / 4), '#ff8ba0', 6, 3);
        }
        // no hit-stop, no screen shake on routine kills — the streak, rim
        // flash and haptics carry it
        spawnKillStreak(en.angle, en.z);
        lastKillBeat(en);
        popup(ex, ey, (perfect ? 'PERFECT +' : '+') + pts + (combo >= 3 ? '  x' + scoreMul() : ''), perfect ? '#ffe9b0' : '#bfeaff');
        if (en.tut === 'volley' && tut && !tut.retry) {
          // the lesson is the VOLLEY — a plain zap kills the trap but not
          // the stage; the column returns until one charged shot clears it
          tut.retry = 'volley';
          popup(ex, ey - 30, 'DOCK BOTH — FIRE THE VOLLEY', '#ffb066');
        }
        else if (en.tut) popup(ex, ey - 30, 'INTERCEPTED', '#7ee262'); // the label's verb, answered
        // no screen shake on a clean kill — the rim flash + haptics carry it;
        // the tunnel only twitches when something goes WRONG
        const zapSampled = sfx.zap(combo, Math.cos(en.angle) * 0.7);
        // synth-era accents — the recorded hit stands alone
        if (!zapSampled && en.type === 'heavy') tone(110, 0.2, 'square', 0.13, 60); // armor thump
        if (!zapSampled && en.lock !== undefined) tone(1568, 0.12, 'triangle', 0.09, 1976); // key chime
        buzz(en.type === 'normal' ? 18 : 30);
      } else {
        en.resolved = true; // slips past the ring and flies by the player
        if (en.partner) en.partner.resolved = true; // the pair fails as one
        if (en.tut) {
          if (tut) { tut.retry = en.tut; tut.t = 0; } // practice trap: no penalty, try again
        } else {
          misses++; combo = 0; comboHeal = 0;
          if (!shieldAbsorb(ex, ey, en.angle)) {
            integrity = Math.max(0, integrity - 25); // 4 mistakes = corrupted payload
            burst(ex, ey, '#ff4a5e', 20, 3);
            popup(ex, ey, 'DATA STOLEN', '#ff4a5e');
            redFlash = 1; shake = Math.min(shake + 0.6, 1);
            rimFX.push({ a: en.angle, t: 0.55, col: '255,74,94' });
            sfx.miss(Math.cos(en.angle) * 0.7);
            buzz([40, 40, 60]);
          }
        }
      }
    }
  }
  stripSound(stripProg >= 0, stripProg); // the trace drone lives and dies here

  // free-run surges: every 100s the stream steps up (capped) — and it never
  // arrives unannounced: "SPEEDING UP IN 4..3..2..1", then the surge
  if (endless && !boss) {
    const surge = Math.floor(levelT / 100);
    const toNext = (surge + 1) * 100 - levelT;
    if (surge < 6 && toNext <= 4.2) {
      const cnt = Math.ceil(toNext);
      if (cnt !== surgeCount) { surgeCount = cnt; sfx.count(); } // HUD draws the big digits
    }
    if (surge !== surgeLevel) {
      surgeLevel = surge; surgeCount = -1;
      if (surge > 0 && surge <= 6) {
        popup(W / 2, H * 0.26, 'STREAM SURGE' + (surge === 6 ? ' — MAX' : ''), '#ff9a3c');
        surgeWaveZ = SPAWN_Z; // the surge rides in from the deep
        sfx.speedUp();
        buzz(20);
      }
    }
  }
  // the surge wavefront races from the horizon to the rim
  if (surgeWaveZ > 0) {
    surgeWaveZ -= dt * (SPAWN_Z - g.hitZ) / 0.9;
    if (surgeWaveZ <= g.hitZ) {
      surgeWaveZ = -1;
      shake = Math.min(shake + 0.45, 1); // it slams past the ring
    }
  }

  // pulse waves sweep down the tunnel, molecularizing every trap they pass
  for (const wv of pulseWaves) {
    wv.z += dt * 1.6;
    for (const en of enemies) {
      // never purge payloads or the golden bonus ribbon — the wave that the
      // ribbon itself charged shouldn't eat the next one
      if (en.dead || en.resolved || en.type === 'frag' || en.type === 'strip') continue;
      if (en.z <= wv.z) {
        en.dead = true;
        if (en.partner) en.partner.dead = true;
        const rg2 = ring(Math.max(en.z, 0.02), g);
        const px2 = rg2.x + Math.cos(en.angle) * rg2.r, py2 = rg2.y + Math.sin(en.angle) * rg2.r;
        // the body decompiles; a spray in the wave's own color signs the sweep
        decompile(en.angle, en.z, en);
        burst(px2, py2, `rgb(${wv.col})`, 12, 4);
        rimFX.push({ a: en.angle, t: 0.4, col: wv.col });
        spawnKillStreak(en.angle, en.z);
        wv.kills++;
        score += Math.round(60 * mutMul()); // flat bounty — no combo, no zap credit
      }
    }
    if (wv.z > SPAWN_Z && wv.kills) popup(W / 2, H * 0.4, 'PULSE PURGE ×' + wv.kills, '#8fe0ff');
  }
  pulseWaves = pulseWaves.filter(wv => wv.z <= SPAWN_Z);
  enemies = enemies.filter(e => !e.dead && (e.type === 'strip' || e.z > 0.03)); // strip heads outlive z=0 while the tail crosses
  for (const fx2 of rimFX) fx2.t -= dt;

        const selr = r.rank === boardSelRank, you = r.player_id === meId, cy2 = ey + rowH / 2 + fRow * 0.36;
        card(rowX, ey, rowW, rowH, selr);
        ctx.textAlign = 'left'; ctx.font = '700 ' + fRow + 'px Audiowide, system-ui';
        ctx.fillStyle = '#8fd8ff'; ctx.fillText(r.rank, rowX + rowW * 0.045, cy2);
        ctx.fillStyle = you ? '#ffd24a' : '#f2f9ff';
        ctx.fillText(('' + (r.player_name || 'ANON')).slice(0, 16), rowX + rowW * 0.045 + fRow * 2.2, cy2, rowW * 0.50);
        ctx.textAlign = 'right'; ctx.fillStyle = '#ffd24a';
        ctx.fillText((r.score || 0).toLocaleString(), rowX + rowW * 0.955, cy2);
        menuButtons.push({ x: rowX, y: ey, w: rowW, h: rowH, boardRow: r.rank });
      }
      ey += rowFullH;
    }
    ctx.restore();
  }
  // ---- the black circle-segment caps, OVER the rows (entries slide under them) ----
  const capSeg = (y0, y1) => { // solid black segment of the disc between two horizontal edges
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
    ctx.fillStyle = '#04070d'; ctx.fillRect(cx - R, y0, R * 2, y1 - y0);
    ctx.restore();
  };
  // top cap: the title zone (the text itself draws LAST, on top of the ring)
  capSeg(cy - R, capTopY);
  // bottom cap: a smaller segment carrying Show my Run — only when I'm on this board
  if (mine) {
    capSeg(capBotY, cy + R);
    ctx.font = '700 ' + fShow + 'px Audiowide, system-ui';
    const tw = ctx.measureText('Show my Run').width;
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(90,190,255,0.95)';
    ctx.fillText('Show my Run', cx, showBase);
    menuButtons.push({ x: cx - tw / 2 - 14, y: capBotY, w: tw + 28, h: cy + R - capBotY, boardShowMe: mine.rank });
  }

  // the thick matte-black ring band — drawn OVER the rows so they pass beneath
  // it, exactly like the in-game bore ring (no lit edges, per the design)
  ctx.strokeStyle = '#05090f'; ctx.lineWidth = bz;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();

  // the TITLE — topmost, over the ring, seated inside its perimeter
  ctx.font = '800 ' + fTitle + 'px Audiowide, system-ui';
  try { ctx.letterSpacing = '4px'; } catch (e) {}
  ctx.textAlign = 'center'; ctx.fillStyle = '#cfe8ff';
  ctx.fillText('LEADERBOARD', cx, titleBase);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.restore(); // end ring circle-in transform

  // ================= RIGHT: selected entry details (count-up, ring-aligned) =================
  const sel = bd && bd.rows && bd.rows.find(r => r.rank === boardSelRank);
  if (sel) {
    ctx.save(); // right column (each card flies in individually below)
    // count-up: the numbers race from 0 to their values when the selection changes
    const pnow = (typeof performance !== 'undefined' && performance.now ? performance.now() : 0) / 1000;
    const dkey = (bd ? bd.key : '') + '#' + boardSelRank;
    if (dkey !== boardDetailKey) { boardDetailKey = dkey; boardDetailT = pnow; }
    const ap = clamp((pnow - boardDetailT) / 0.6, 0, 1), easeUp = 1 - (1 - ap) * (1 - ap);
    const AN = v => Math.round((v || 0) * easeUp);

    // each card LEFT-aligns to the ring's RIGHT rim at its own height (the mirror
    // of the left column's arch), stood off the rim like the left column
    const archL = yv => ringR(yv) + Math.max(18, W * 0.014), rEdge = W - SAFE.r - 8;
    let dy = 12 + SAFE.t; // top-aligned with the back key
    const nameCardH = Math.min(H * 0.082, 66);
    { ctx.save(); ctx.translate(boardRowOff(0, 'right'), 0);
      const lX = archL(dy + nameCardH / 2), nm = ('' + (sel.player_name || 'ANON')).slice(0, 16);
      ctx.font = '700 ' + fName + 'px Audiowide, system-ui';
      const nameW = Math.min(Math.min(bk.x - 12, rEdge) - lX, ctx.measureText(nm).width + 36); // shrink to fit the name
      card(lX, dy, nameW, nameCardH, false);
      ctx.textAlign = 'left'; ctx.fillStyle = '#f2f9ff';
      ctx.fillText(nm, lX + 16, dy + nameCardH / 2 + fName * 0.36, nameW - 28);
      ctx.restore(); }
    dy += nameCardH + cardGap;

    const threats = (sel.zaps || 0) + (sel.misses || 0);
    const pct = sel.zaps ? Math.round((sel.perfects || 0) / sel.zaps * 100) : 0;
    const comboSec = Math.round(sel.combo_sec || 0);
    // [label, final value (sizes the card so it doesn't grow mid-count), animated display]
    const details = [
      ['Log Date', fmtDate(sel.created_at), fmtDate(sel.created_at)],
      ['Total Score', (sel.score || 0).toLocaleString(), AN(sel.score).toLocaleString()],
      ['Max. Combo', 'x' + (sel.max_combo || 0) + (comboSec ? ' (' + comboSec + 'sec)' : ''),
                     'x' + AN(sel.max_combo) + (comboSec ? ' (' + AN(comboSec) + 'sec)' : '')],
      ['Hits', (sel.zaps || 0) + ' / ' + threats, AN(sel.zaps) + ' / ' + AN(threats)],
      ['Perfect', (sel.perfects || 0) + ' (' + pct + '%)', AN(sel.perfects) + ' (' + AN(pct) + '%)'],
    ];
    // vertical budget: name + 5 detail cards + the Replay button (same height as a
    // detail card) must all fit above the screen bottom
    const bottom = H - SAFE.b - H * 0.025;
    const dCardH = Math.min(Math.min(H * 0.092, 76), (bottom - dy - 6 * cardGap) / 6);
    details.forEach(([label, fin, disp], i) => {
      ctx.save(); ctx.translate(boardRowOff(i + 1, 'right'), 0);
      const lX = archL(dy + dCardH / 2);
      ctx.font = '700 ' + fVal + 'px Audiowide, system-ui'; const wV = ctx.measureText(fin).width;
      ctx.font = '600 ' + fLab + 'px Audiowide, system-ui'; const wL = ctx.measureText(label).width;
      const cw = Math.min(rEdge - lX, Math.max(wV, wL) + 36); // content-fit
      card(lX, dy, cw, dCardH, false);
      ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(232,245,255,0.94)'; ctx.font = '600 ' + fLab + 'px Audiowide, system-ui';
      ctx.fillText(label, lX + 16, dy + dCardH * 0.40);
      ctx.fillStyle = '#ffd24a'; ctx.font = '700 ' + fVal + 'px Audiowide, system-ui';
      ctx.fillText(disp, lX + 16, dy + dCardH * 0.82, cw - 32);
      ctx.restore();
      dy += dCardH + cardGap;
    });

    // Replay — the primary action: the standard dark card, but a GOLD outline
    // (+ faint gold glow) marks it as the button, in line with the rest of the UI
    const can = !!sel.trace_id, repH2 = dCardH, repY = dy, repX = archL(repY + repH2 / 2), cyR = repY + repH2 / 2;
    const rf = F(H * 0.032), tri = repH2 * 0.24, triX = repX + repH2 * 0.55;
    ctx.font = '800 ' + rf + 'px Audiowide, system-ui';
    const repW = Math.min(rEdge - repX, triX + tri + 16 + ctx.measureText('Replay').width + 20 - repX);
    ctx.save(); ctx.translate(boardRowOff(6, 'right'), 0);
    ctx.globalAlpha = can ? 1 : 0.4;
    techRect(repX, repY, repW, repH2, 8); ctx.fillStyle = 'rgba(8,18,36,0.82)'; ctx.fill();
    ctx.shadowColor = 'rgba(255,210,74,0.45)'; ctx.shadowBlur = can ? 12 : 0;
    ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2.2; techRect(repX, repY, repW, repH2, 8); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd24a'; // gold play triangle
    ctx.beginPath(); ctx.moveTo(triX - tri * 0.7, cyR - tri); ctx.lineTo(triX - tri * 0.7, cyR + tri); ctx.lineTo(triX + tri, cyR); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f2f9ff'; ctx.textAlign = 'left'; ctx.fillText('Replay', triX + tri + 16, cyR + rf * 0.36);
    ctx.globalAlpha = 1;
    ctx.restore();
    if (can) menuButtons.push({ x: repX, y: repY, w: repW, h: repH2, boardReplaySel: sel });
    ctx.restore(); // end right column
  }
  ctx.textAlign = 'left';
}

// ---------- campaign route map ----------
// the ring becomes a LENS over the LANE CHART — the network seen from above
// the plane. The relay list rides the left column, the dossier the right, and
// selecting a relay glides the lens along the route.
//
// The chart is a DEFENDED volume. The core systems sit at its heart, wrapped in
// concentric PATROL CORDONS, each one thinner than the last. Case 01 flies its
// lanes inside that core; every case after it spirals further out into weaker
// cover until the last one runs dark past the final cordon — which is exactly
// why a lane carries more interdictors the further out you work.
let cityBase = null, cityTop = null, mapCamX = 0, mapCamY = 0, mapCamSnap = true, mapZoom = 1;
const mapR = () => menuGeom().R * 0.92; // the lens rim MATCHES the mode wheel — seamless crossfade
const CITY_W = 3400, CITY_H = 2050;
const CITY_CORE = { x: CITY_W * 0.5, y: CITY_H * 0.5 };
const ISO_W = 16, ISO_H = 8; // iso tile half-width / half-height
// the ground is an iso plane: a CIRCLE painted on it reads as a 2:1 ellipse on
// the sheet, so ground distance counts y at double weight
const groundR = (x, y) => Math.hypot(x - CITY_CORE.x, (y - CITY_CORE.y) * 2);
// The patrol cordons ARE the case bands: CORDON 01 is the belt case 01 works,
// CORDON 02 the belt case 02 works, and so on out. buildCity fits each cordon
// to the relays that actually landed there, so the chart and the dossier never
// disagree about how much escort cover a run still has.
const RING_NAMES = ['INNER CORDON', 'PATROL SHELL', 'OUTER PICKET', 'THE FRINGE', 'DARK TRANSIT'];
const CORE_NAME = 'CORE SYSTEMS', DARK_ZONE = 'DARK TRANSIT';
let RINGS = []; // [{ r0, r1, name }] per case band, innermost first
// escort coverage: total at the core, gone by the far edge. This is the number
// the dossier quotes — and the reason the traffic thickens as you go out.
const shieldAt = r => Math.round(100 * clamp(1 - Math.pow(clamp(r / 1450, 0, 1), 1.4), 0, 1));
// the drift: a wide dust band sweeping the southern volume. Every case wraps
// far enough around the core to span it at least once.
const harborY = x => CITY_H * 0.70 + Math.sin(x * 0.0021) * 92 + Math.sin(x * 0.0049 + 2.1) * 30;
const HARBOR_H = 120;
const inHarbor = (x, y, pad) => y > harborY(x) - (pad || 0) && y < harborY(x) + HARBOR_H + (pad || 0);
// the debris stream: down out of the north, bending west of the trade spine and
// emptying into the drift. Junctions keep off it; the trunk lanes span it.
const riverX = y => CITY_W * 0.34 + Math.sin(y * 0.0034) * 175 + Math.sin(y * 0.0071 + 1.1) * 55 + (y - CITY_H * 0.5) * 0.28;
const RIVER_W = 42; // half-width
const inRiver = (x, y, pad) => y < harborY(x) + HARBOR_H * 0.5 && Math.abs(x - riverX(y)) < RIVER_W + (pad || 0);
const inWater = (x, y, pad) => inHarbor(x, y, pad) || inRiver(x, y, pad);
// where each case finally delivers — the terminus past its last relay
const CITY_TERMS = {
  'investigation': ['CID', 'CID INTAKE'],
  'going-deeper': ['IA', 'INTERNAL AFFAIRS'],
  'signal-lost': ['BCN', 'REACH BEACON'],
  'the-bait': ['HIVE', 'THE APIARY'],
  'shutdown': ['SYS', 'ARCHITECT CORE']
};
// one chain per campaign: { pts: [...relays, terminus], segs: [...runs] }.
// The chains are links of ONE spiral, so a case begins exactly where the last
// one delivered.
let CITY_CHAINS = [];
// two offscreen layers: BASE (ground grid, streets, harbor, the perimeters) and
// TOP (the building wireframe). The live route draws between them, so the data
// infrastructure reads as underground — ghosting through the towers.
function buildCity() {
  const rng = mulberry32(0xC17C0DE);
  const jxy = (a, b) => ({ x: ISO_H * (b - a), y: ISO_H * 0.5 * (a + b) }); // lattice -> px
  const vAt = (x, y) => ({ a: (y - x / 2) / ISO_H, b: (y + x / 2) / ISO_H }); // px -> lattice
  const CV = vAt(CITY_CORE.x, CITY_CORE.y);
  // lane bands in the two iso families (slope ±0.5): dense traffic in close,
  // long empty hauls out in the sprawl
  const mkBands = (lo, hi, vc) => {
    const out = [];
    for (let v = lo; v < hi;) {
      const d = Math.min(1, Math.abs(v - vc) / 225);
      const major = rng() < 0.6;
      out.push({ v: Math.round(v), major, grand: major && rng() < 0.2 });
      v += 4.8 + d * 4.8 + rng() * 3.3;
    }
    let gap = 0; // avenues never bunch: force a trunk at least every third street
    for (const b of out) { if (b.major) gap = 0; else if (++gap >= 3) { b.major = true; gap = 0; } }
    return out;
  };
  const bands1 = mkBands(-CITY_W / 2 / ISO_H - 8, CITY_H / ISO_H + 8, CV.a); // v1 = (y - x/2)/ISO_H (slope +0.5)
  const bands2 = mkBands(-8, (CITY_H + CITY_W / 2) / ISO_H + 8, CV.b);      // v2 = (y + x/2)/ISO_H (slope -0.5)
  const trunks1 = bands1.filter(b => b.major), trunks2 = bands2.filter(b => b.major);
  // relays sit on trunk-lane crossings, clear of the drift, inside the sheet
  const junc = [];
  for (const t1 of trunks1) for (const t2 of trunks2) {
    const p2 = jxy(t1.v, t2.v);
    if (p2.x < 110 || p2.x > CITY_W - 110 || p2.y < 100 || p2.y > CITY_H - 100) continue;
    if (inWater(p2.x, p2.y, 20)) continue;
    junc.push({ a: t1.v, b: t2.v, x: p2.x, y: p2.y });
  }

  // ---- THE SPIRAL: one continuous journey outward through the perimeters ----
  // Relay g sits a little further from the core than relay g-1, and the walk
  // never doubles back, so difficulty and distance-from-cover rise together.
  const counts = (CAMPAIGNS.length ? CAMPAIGNS : [{ levels: new Array(8) }]).map(p => p.levels.length);
  const total = counts.reduce((n, c) => n + c, 0);
  const R0 = 215, R1 = 1180, dr = (R1 - R0) / total;
  const used = new Set();
  const pts = [];
  let ang = -2.35; // start north-west of the core, then wind anticlockwise out
  for (let g = 0; g <= total; g++) {
    const f = g / total;
    const rad = R0 + (R1 - R0) * f;
    // a hop of about L world px — longer hauls the further out you work. (A run
    // then DOG-LEGS along the streets, so it covers roughly twice L on the
    // ground.) Splitting L between the radial and tangential directions on a
    // 2:1 ellipse keeps every run about the same size in the lens.
    const L = 120 + 135 * f;
    const prev = pts[pts.length - 1];
    const prevR = prev ? groundR(prev.x, prev.y) : -1e9;
    const ix = CITY_CORE.x + Math.cos(ang) * rad;
    const iy = CITY_CORE.y + Math.sin(ang) * rad * 0.5; // iso squash
    // The SCHEDULE is authoritative: a relay lands on the trunk crossing nearest
    // its point on the spiral and may stray no further than D from it, so the
    // harbor or a used street can knock one relay sideways without ever bending
    // the walk as a whole. Among the candidates, keep a real run's worth of
    // distance from the last relay and stay off its streets.
    const D = Math.max(210, L * 0.7);
    let best = null, bs = 1e9;
    for (const j of junc) {
      if (used.has(j)) continue;
      const d = Math.hypot(j.x - ix, (j.y - iy) * 1.7);
      if (d > D) continue;
      let s = d;
      if (prev) s += Math.max(0, L * 0.8 - Math.hypot(j.x - prev.x, j.y - prev.y)) * 3;
      for (const q of pts) { // a shared street would force two runs down one avenue
        if (Math.hypot(q.x - j.x, q.y - j.y) < 520 && (q.a === j.a || q.b === j.b)) s += 70;
      }
      if (s < bs) { bs = s; best = j; }
    }
    if (!best) { // nothing in reach (deep water, a pocket of used crossings): widen
      bs = 1e9;  // the net, but pay to fall back toward cover. The schedule picks
                 // the walk up again on the next hop either way.
      for (const j of junc) {
        if (used.has(j)) continue;
        const s = Math.hypot(j.x - ix, (j.y - iy) * 1.7) + Math.max(0, prevR - groundR(j.x, j.y)) * 1.5;
        if (s < bs) { bs = s; best = j; }
      }
    }
    if (!best) break;
    used.add(best);
    pts.push(best);
    const st = Math.abs(Math.sin(ang)), ct = Math.abs(Math.cos(ang));
    const perTh = Math.max(60, rad * Math.hypot(st, ct * 0.5)); // |dP/dθ|
    const perR = Math.hypot(ct, st * 0.5);                      // |dP/dr|
    ang += Math.sqrt(Math.max(1, L * L - Math.pow(perR * dr, 2))) / perTh;
  }

  // ---- cable runs: every hop dog-legs along the avenues ----
  // A candidate is a list of lattice CORNERS between the two relays. Cornering
  // in the water or spearing another relay's junction is disqualifying; after
  // that, the shortest run wins.
  const corner = (a, b) => ({ a, b, p: jxy(a, b) });
  const between = (bands, lo, hi, n) => {
    const pool = bands.filter(t => t.v > Math.min(lo, hi) + 2 && t.v < Math.max(lo, hi) - 2);
    const out = [];
    for (let k = 0; k < n && pool.length; k++) out.push(pool[Math.floor(rng() * pool.length)].v);
    return out;
  };
  const spears = (fam, at, lo, hi) => pts.some(j => {
    const on = Math.abs((fam === 1 ? j.a : j.b) - at) < 0.8;
    const t2 = fam === 1 ? j.b : j.a;
    return on && t2 > Math.min(lo, hi) + 0.8 && t2 < Math.max(lo, hi) - 0.8;
  });
  const score = (A2, B2, cs) => {
    let s = 0, a3 = A2.a, b3 = A2.b;
    for (const c of cs.concat([B2])) {
      if (c.a !== a3 && c.b !== b3) s += 1e6;               // not a legal leg
      else if (c.a !== a3) { if (spears(2, b3, a3, c.a)) s += 1e5; s += Math.abs(c.a - a3); }
      else { if (spears(1, a3, b3, c.b)) s += 1e5; s += Math.abs(c.b - b3); }
      a3 = c.a; b3 = c.b;
    }
    let x0 = Math.min(A2.x, B2.x), x1 = Math.max(A2.x, B2.x);
    let y0 = Math.min(A2.y, B2.y), y1 = Math.max(A2.y, B2.y);
    for (const c of cs) {
      if (c.p.x < 60 || c.p.x > CITY_W - 60 || c.p.y < 60 || c.p.y > CITY_H - 60) s += 1e6;
      if (inWater(c.p.x, c.p.y, 10)) s += 4000;             // no junction box in the water
      if (pts.some(j => j !== A2 && j !== B2 && Math.abs(j.a - c.a) < 0.8 && Math.abs(j.b - c.b) < 0.8)) s += 1e5;
      x0 = Math.min(x0, c.p.x); x1 = Math.max(x1, c.p.x);
      y0 = Math.min(y0, c.p.y); y1 = Math.max(y1, c.p.y);
    }
    // the lens frames the whole run: a route that sprawls costs zoom, so a
    // COMPACT one wins ties outright
    return s + Math.max(x1 - x0, y1 - y0) * 0.3;
  };
  const nearest = (bands, v) => bands.reduce((w, t) => Math.abs(t.v - v) < Math.abs(w - v) ? t.v : w, 1e9);
  const segs = [];
  for (let k = 0; k + 1 < pts.length; k++) {
    const A2 = pts[k], B2 = pts[k + 1];
    const cands = [[corner(A2.a, B2.b)], [corner(B2.a, A2.b)]];
    for (const t of between(bands2, A2.b, B2.b, 4)) cands.push([corner(A2.a, t), corner(B2.a, t)]);
    for (const t of between(bands1, A2.a, B2.a, 4)) cands.push([corner(t, A2.b), corner(t, B2.b)]);
    const ma = nearest(bands1, (A2.a + B2.a) / 2), mb = nearest(bands2, (A2.b + B2.b) / 2);
    cands.push([corner(A2.a, mb), corner(ma, mb), corner(ma, B2.b)]);
    cands.push([corner(ma, A2.b), corner(ma, mb), corner(B2.a, mb)]);
    const win = cands.slice().sort((c1, c2) => score(A2, B2, c1) - score(A2, B2, c2))[0];
    segs.push([{ x: A2.x, y: A2.y }].concat(win.map(c => c.p), [{ x: B2.x, y: B2.y }]));
  }
  CITY_CHAINS = counts.map((n, ci) => {
    const base = counts.slice(0, ci).reduce((s, v) => s + v, 0);
    const cp = pts.slice(base, base + n + 1), cs = segs.slice(base, base + n);
    // a sheet too small to seat every relay would strand a late case — hold the
    // last junction it did find rather than hand back nothing
    while (cp.length < n + 1) cp.push(cp[cp.length - 1] || pts[pts.length - 1]);
    while (cs.length < n) cs.push([cp[cs.length], cp[cs.length + 1]]);
    return { pts: cp, segs: cs };
  });
  // ---- fit a perimeter to each case band ----
  // A band runs from the midpoint below its relays to the midpoint above them,
  // so the ellipse the player sees really does enclose the run they are looking
  // at, and cover falls case by case instead of jittering relay by relay.
  const mids = CITY_CHAINS.map(ch => {
    const rs = ch.pts.map(p2 => groundR(p2.x, p2.y)).sort((m, n2) => m - n2);
    return rs[Math.floor(rs.length / 2)];
  });
  RINGS = mids.map((m, i) => ({
    r0: i ? (mids[i - 1] + m) / 2 : Math.max(120, m * 0.62),
    r1: i + 1 < mids.length ? (m + mids[i + 1]) / 2 : m * 1.24,
    name: RING_NAMES[Math.min(i, RING_NAMES.length - 1)]
  }));

  // ---------- BASE: ground grid, streets, harbor, the perimeters ----------
  cityBase = document.createElement('canvas');
  cityBase.width = CITY_W; cityBase.height = CITY_H;
  withCanvas(cityBase, () => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, CITY_W, CITY_H);
    ctx.lineCap = 'butt';
    ctx.fillStyle = '#02060f'; ctx.fillRect(0, 0, CITY_W, CITY_H);
    // the core burns: a wide cyan haze pooled across the inner systems
    isoRadial(0, 760, ['rgba(24,120,190,0.18)', 'rgba(16,80,150,0.07)', 'rgba(6,20,50,0)']);
    // the survey grid — the lattice the whole chart is plotted on
    ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(70,190,255,0.07)';
    for (let k = -CITY_W * 0.5; k < CITY_H; k += ISO_H * 2) {
      ctx.beginPath(); ctx.moveTo(0, k); ctx.lineTo(CITY_W, k + CITY_W * 0.5); ctx.stroke();
    }
    for (let k = 0; k < CITY_H + CITY_W * 0.5; k += ISO_H * 2) {
      ctx.beginPath(); ctx.moveTo(0, k); ctx.lineTo(CITY_W, k - CITY_W * 0.5); ctx.stroke();
    }
    // lanes, in three tiers by traffic rating: a minor lane is a single lit
    // line, a trunk lane gets a charted corridor between two markers, and the
    // grand trunks get a wide corridor with a dashed centreline.
    const roadRun = (v, slope, off) => { // one line of the family, offset across
      ctx.moveTo(0, ISO_H * v + off);
      ctx.lineTo(CITY_W, ISO_H * v + off + slope * CITY_W);
    };
    const street = (b, slope) => {
      const w = b.grand ? 8 : b.major ? 4 : 0;
      if (w) { // roadbed: a dark surface the block edges read against
        ctx.beginPath();
        ctx.moveTo(0, ISO_H * b.v - w); ctx.lineTo(CITY_W, ISO_H * b.v - w + slope * CITY_W);
        ctx.lineTo(CITY_W, ISO_H * b.v + w + slope * CITY_W); ctx.lineTo(0, ISO_H * b.v + w);
        ctx.closePath();
        ctx.fillStyle = 'rgba(10,30,58,0.55)'; ctx.fill();
      }
      ctx.strokeStyle = b.grand ? 'rgba(150,240,255,0.68)' : b.major ? 'rgba(130,235,255,0.55)' : 'rgba(90,190,250,0.24)';
      ctx.lineWidth = w ? 1.8 : 1.4;
      ctx.beginPath();
      if (w) { roadRun(b.v, slope, -w); roadRun(b.v, slope, w); } else roadRun(b.v, slope, 0);
      ctx.stroke();
      if (b.grand) { // median down the middle of the boulevard
        ctx.strokeStyle = 'rgba(120,215,255,0.34)'; ctx.lineWidth = 1.2;
        ctx.setLineDash([16, 14]);
        ctx.beginPath(); roadRun(b.v, slope, 0); ctx.stroke();
        ctx.setLineDash([]);
      }
    };
    for (const b of bands1) street(b, 0.5);
    for (const b of bands2) street(b, -0.5);
    // the warp net: the lanes' own carrier beneath the corridors, with junctions
    const cable = (v, slope) => {
      ctx.strokeStyle = 'rgba(80,240,205,0.32)'; ctx.lineWidth = 2;
      ctx.setLineDash([12, 8]);
      ctx.beginPath(); ctx.moveTo(0, ISO_H * v); ctx.lineTo(CITY_W, ISO_H * v + slope * CITY_W); ctx.stroke();
      ctx.setLineDash([]);
    };
    for (const t of trunks1) cable(t.v, 0.5);
    for (const t of trunks2) cable(t.v, -0.5);
    ctx.strokeStyle = 'rgba(80,240,205,0.5)'; ctx.lineWidth = 1.4;
    for (const j of junc) {
      ctx.beginPath();
      ctx.moveTo(j.x, j.y - 5); ctx.lineTo(j.x + 5, j.y); ctx.lineTo(j.x, j.y + 5); ctx.lineTo(j.x - 5, j.y);
      ctx.closePath(); ctx.stroke();
    }
    // the DRIFT: a wide dust band across the south and a debris stream coming
    // down to meet it. Unnavigable — no lane is charted through it and no
    // junction is ever sited in it. Both are cut as ONE path, so the trunk
    // lanes can be re-stroked through it in a single clipped pass, and every
    // crossing becomes a lit SPAN for free.
    const waterPath = () => {
      ctx.beginPath();
      ctx.moveTo(0, harborY(0));
      for (let x2 = 0; x2 <= CITY_W; x2 += 32) ctx.lineTo(x2, harborY(x2));
      for (let x2 = CITY_W; x2 >= 0; x2 -= 32) ctx.lineTo(x2, harborY(x2) + HARBOR_H);
      ctx.closePath();
      const yEnd = y2 => harborY(riverX(y2)) + HARBOR_H * 0.5;
      let y1 = 0;
      while (y1 < CITY_H && y1 < yEnd(y1)) y1 += 24;
      ctx.moveTo(riverX(0) - RIVER_W, 0);
      for (let y2 = 0; y2 <= y1; y2 += 24) ctx.lineTo(riverX(y2) - RIVER_W, y2);
      for (let y2 = y1; y2 >= 0; y2 -= 24) ctx.lineTo(riverX(y2) + RIVER_W, y2);
      ctx.closePath();
    };
    ctx.save();
    waterPath();
    ctx.fillStyle = 'rgba(13,9,32,0.95)'; ctx.fill();     // dust swallows the starlight
    ctx.strokeStyle = 'rgba(178,132,255,0.42)'; ctx.lineWidth = 2; ctx.stroke(); // the drift edge
    ctx.clip();
    for (let r2 = 0; r2 < 6; r2++) { // dust lanes combed by the drift
      ctx.strokeStyle = `rgba(168,120,255,${(0.13 + r2 * 0.025).toFixed(2)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let x2 = 0; x2 <= CITY_W; x2 += 26) {
        const yy = harborY(x2) + 14 + r2 * 17 + Math.sin(x2 * 0.014 + r2 * 2.2) * 4;
        x2 ? ctx.lineTo(x2, yy) : ctx.moveTo(x2, yy);
      }
      ctx.stroke();
    }
    for (let c3 = -1; c3 <= 1; c3++) { // the debris stream, running down into it
      ctx.strokeStyle = `rgba(185,145,255,${(0.30 - Math.abs(c3) * 0.10).toFixed(2)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let y2 = 0; y2 <= CITY_H; y2 += 22) {
        const xx = riverX(y2) + c3 * RIVER_W * 0.52 + Math.sin(y2 * 0.03 + c3) * 3;
        y2 ? ctx.lineTo(xx, y2) : ctx.moveTo(xx, y2);
      }
      ctx.stroke();
    }
    // grit suspended in the band — what makes it unnavigable rather than merely dark
    for (let k = 0; k < 520; k++) {
      const x2 = rng() * CITY_W, y2 = harborY(x2) + rng() * HARBOR_H;
      ctx.fillStyle = `rgba(205,175,255,${(0.10 + rng() * 0.26).toFixed(2)})`;
      ctx.fillRect(x2, y2, rng() < 0.2 ? 2 : 1, 1);
    }
    // hulks adrift in it: whatever tried the crossing and did not finish
    for (let x2 = 60; x2 < CITY_W; x2 += 150 + rng() * 190) {
      const hy = harborY(x2) + 12 + rng() * (HARBOR_H - 30), tilt = (rng() - 0.5) * 0.9;
      const L2 = 13 + rng() * 12;
      ctx.strokeStyle = `rgba(200,160,255,${(0.26 + rng() * 0.18).toFixed(2)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(x2, hy, L2, L2 * 0.3, tilt, 0, TAU); ctx.stroke();
      ctx.beginPath(); // a snapped spar, so the silhouette reads as wreck not rock
      ctx.moveTo(x2 - Math.cos(tilt) * L2 * 0.5, hy - Math.sin(tilt) * L2 * 0.5);
      ctx.lineTo(x2 - Math.cos(tilt) * L2 * 0.5 - Math.sin(tilt) * 9, hy - Math.sin(tilt) * L2 * 0.5 + Math.cos(tilt) * 9);
      ctx.stroke();
    }
    // the SPANS: every trunk lane re-drawn inside the drift, burning brighter —
    // the charted crossings are the only safe way through
    ctx.strokeStyle = 'rgba(160,240,255,0.85)'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (const b of bands1) if (b.major) { roadRun(b.v, 0.5, -(b.grand ? 8 : 4)); roadRun(b.v, 0.5, b.grand ? 8 : 4); }
    for (const b of bands2) if (b.major) { roadRun(b.v, -0.5, -(b.grand ? 8 : 4)); roadRun(b.v, -0.5, b.grand ? 8 : 4); }
    ctx.stroke();
    ctx.restore();
    cityBloom(cityBase, 5, 0.7);
    cityFalloff();
    // ---- the patrol cordons, drawn OVER the geography: they are the escort
    // picket, not the lanes. Each cordon is one case's band, and the cover it
    // still holds is printed on it.
    const ringCol = i => i < 1 ? '126,226,98' : i < 3 ? '255,200,80' : '255,110,110';
    const perimeter = (r, col, a) => {
      ctx.save();
      ctx.strokeStyle = `rgba(${col},${a.toFixed(2)})`;
      ctx.lineWidth = 3;
      ctx.setLineDash([26, 16]);
      isoEllipse(r); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = `rgba(${col},${(a * 0.28).toFixed(2)})`;
      ctx.lineWidth = 11;
      isoEllipse(r); ctx.stroke();
      ctx.fillStyle = `rgba(${col},${(a * 0.9).toFixed(2)})`; // picket stations stud the cordon
      for (let k = 0; k < 24; k++) {
        const a2 = k / 24 * TAU;
        ctx.fillRect(CITY_CORE.x + Math.cos(a2) * r - 2.5, CITY_CORE.y + Math.sin(a2) * r * 0.5 - 2.5, 5, 5);
      }
      ctx.restore();
    };
    if (RINGS.length) perimeter(RINGS[0].r0, '126,226,98', 0.75); // the core wall
    RINGS.forEach((ring, i) => {
      const col = ringCol(i), q = 1 - i / Math.max(1, RINGS.length);
      perimeter(ring.r1, col, 0.28 + q * 0.34);
      // the band reads its own name and what it is still holding
      const lr = (ring.r0 + ring.r1) / 2;
      const lx = CITY_CORE.x - lr * 0.74, ly = CITY_CORE.y - lr * 0.5 * 0.74 - 8;
      ctx.textAlign = 'left';
      ctx.fillStyle = `rgba(${col},${(0.45 + q * 0.35).toFixed(2)})`;
      ctx.font = '700 13px Audiowide, system-ui';
      ctx.fillText('CORDON 0' + (i + 1) + ' · ' + ring.name, lx, ly);
      ctx.fillStyle = 'rgba(150,205,255,0.55)';
      ctx.font = '500 10px Audiowide, system-ui';
      ctx.fillText('COVER ' + shieldAt(ring.r1) + '-' + shieldAt(ring.r0) + '%', lx, ly + 14);
    });
    ctx.textAlign = 'left';
    ctx.fillStyle = `rgba(126,226,98,0.75)`;
    ctx.font = '700 12px Audiowide, system-ui';
    if (RINGS.length) ctx.fillText(CORE_NAME, CITY_CORE.x - RINGS[0].r0 * 0.5, CITY_CORE.y - RINGS[0].r0 * 0.26 - 8);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,120,120,0.45)';
    ctx.font = '700 15px Audiowide, system-ui';
    ctx.fillText('— ' + DARK_ZONE + ' · NO COVER —', CITY_CORE.x - 700, CITY_CORE.y - 760);
    // landmarks: survey tags pinned to the geography
    const tag = (x2, y2, txt) => {
      // a landmark never crowds a relay — the route is the loudest thing here
      if (pts.some(j => Math.abs(j.x - x2) < 120 && Math.abs(j.y - y2) < 46)) return;
      ctx.strokeStyle = 'rgba(150,210,255,0.55)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 + 9, y2 - 9); ctx.lineTo(x2 + 15, y2 - 9); ctx.stroke();
      ctx.fillStyle = 'rgba(175,225,255,0.72)'; ctx.font = '600 11px Audiowide, system-ui';
      ctx.textAlign = 'left';
      ctx.fillText(txt, x2 + 19, y2 - 5);
    };
    const at = (ang2, rad2) => ({ x: CITY_CORE.x + Math.cos(ang2) * rad2, y: CITY_CORE.y + Math.sin(ang2) * rad2 * 0.5 });
    const t1 = at(-2.35, 150); tag(t1.x, t1.y, 'OMNISERVE YARDS');
    tag(CITY_CORE.x + 60, CITY_CORE.y - 40, 'THE SPINE · CORE EXCHANGE');
    const t3 = at(0.9, 420); tag(t3.x, t3.y, 'TRADE SPINE');
    const t4 = at(2.4, 640); tag(t4.x, t4.y, 'OLD MOORINGS');
    const t5 = at(-1.1, 980); tag(t5.x, t5.y, 'TRANSIT EXCHANGE');
    tag(CITY_W * 0.36, harborY(CITY_W * 0.36) + HARBOR_H + 26, 'THE DRIFT');
    tag(CITY_W * 0.74, harborY(CITY_W * 0.74) + HARBOR_H + 40, 'OUTER SPRAWL');
    const t6 = at(-2.0, 1240); tag(t6.x, t6.y, 'THE DARK EDGE');
    const t7 = at(2.55, 1180); tag(t7.x, t7.y, 'THE SUBLANES');
    // the far field: the further out, the less there is but stars
    for (let k = 0; k < 900; k++) {
      const x2 = rng() * CITY_W, y2 = rng() * CITY_H;
      const gr = groundR(x2, y2);
      if (gr < 700 || inWater(x2, y2, 0)) continue;
      const a = clamp((gr - 700) / 1100, 0, 1) * (0.2 + rng() * 0.5);
      ctx.fillStyle = rng() < 0.12 ? `rgba(255,150,200,${a.toFixed(2)})` : `rgba(190,240,255,${a.toFixed(2)})`;
      const s = rng() < 0.15 ? 2.5 : 1.5;
      ctx.fillRect(x2, y2, s, s);
    }
  });

  // ---------- TOP: the building wireframe ----------
  cityTop = document.createElement('canvas');
  cityTop.width = CITY_W; cityTop.height = CITY_H;
  withCanvas(cityTop, () => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, CITY_W, CITY_H);
    // wMul widens the footprint (slab blocks), lift stacks a tower on a podium
    const box = (x, y, h, a, col, wMul, lift, bands) => {
      wMul = wMul || 1; lift = lift || 0;
      const hw = ISO_W * wMul, hh = ISO_H * wMul;
      const y0 = y - lift;
      const N = { x, y: y0 - hh }, E = { x: x + hw, y: y0 }, S2 = { x, y: y0 + hh }, W2 = { x: x - hw, y: y0 };
      const T = { N: { x: N.x, y: N.y - h }, E: { x: E.x, y: E.y - h }, S: { x: S2.x, y: S2.y - h }, W: { x: W2.x, y: W2.y - h } };
      // pure neon blueprint: no opaque faces — a whisper of tint on the roof
      ctx.fillStyle = `rgba(${col},0.10)`;
      ctx.beginPath(); ctx.moveTo(T.N.x, T.N.y); ctx.lineTo(T.E.x, T.E.y); ctx.lineTo(T.S.x, T.S.y); ctx.lineTo(T.W.x, T.W.y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = `rgba(${col},${a.toFixed(2)})`;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(T.N.x, T.N.y); ctx.lineTo(T.E.x, T.E.y); ctx.lineTo(T.S.x, T.S.y); ctx.lineTo(T.W.x, T.W.y); ctx.closePath();
      ctx.moveTo(W2.x, W2.y); ctx.lineTo(T.W.x, T.W.y);
      ctx.moveTo(S2.x, S2.y); ctx.lineTo(T.S.x, T.S.y);
      ctx.moveTo(E.x, E.y); ctx.lineTo(T.E.x, T.E.y);
      ctx.stroke();
      if (bands && h > 20) { // floor bands ladder up the two lit faces
        ctx.strokeStyle = `rgba(${col},${(a * 0.4).toFixed(2)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let fy = 9; fy < h - 5; fy += 8) {
          ctx.moveTo(W2.x, W2.y - fy); ctx.lineTo(S2.x, S2.y - fy); ctx.lineTo(E.x, E.y - fy);
        }
        ctx.stroke();

    };

    // what keeps the sprawl from reading as one repeated cube.
    const terrace = (x, y, h, col) => {
      const along = rng() < 0.5 ? 1 : -1;
      for (let k = -1; k <= 1; k++) {
        if (rng() < 0.22) continue;
        box(x + k * ISO_W * 0.56, y + k * ISO_H * 0.56 * along,
            h * (0.9 + rng() * 0.8), 0.4 + rng() * 0.24, col, 0.26 + rng() * 0.12);
      }
    };
    // a courtyard block: four wings around an open middle
    const courtyard = (x, y, h, a, col) => {
      const w = 0.42;
      for (const [ox, oy] of [[1, 1], [-1, -1], [1, -1], [-1, 1]]) {
        if (rng() < 0.15) continue;
        box(x + ox * ISO_W * 0.5, y + oy * ISO_H * 0.5, h * (0.75 + rng() * 0.5), a + rng() * 0.15, col, w);
      }
    };
    const streetAt = (r2, c2) => {
      const off = r2 % 2; // odd rows sit half a tile east
      const v1 = r2 - 2 * c2 - off, v2 = r2 + 2 * c2 + off;
      const clear = b => b.grand ? 3.4 : b.major ? 2.6 : 1.7;
      return bands1.some(b => Math.abs(v1 - b.v) < clear(b)) ||
             bands2.some(b => Math.abs(v2 - b.v) < clear(b));
    };
    const rows2 = Math.ceil(CITY_H / ISO_H) + 2, cols2 = Math.ceil(CITY_W / (ISO_W * 2)) + 2;
    const skip = new Set();
    for (let r2 = 0; r2 < rows2; r2++) {
      for (let c2 = 0; c2 < cols2; c2++) {
        if (skip.has(r2 * 1000 + c2)) continue;
        const bx2 = c2 * ISO_W * 2 + (r2 % 2) * ISO_W, by2 = r2 * ISO_H;
        if (inWater(bx2, by2, 12)) continue;    // water
        if (streetAt(r2, c2)) continue;         // roads stay open
        // districts fall off from the core: a wall of towers downtown, then
        // slab housing, then sprawl, then scattered lights in the dark
        const gr = groundR(bx2, by2);
        // district noise — three octaves, so parks and towers break up at BLOCK
        // scale. One long wave would hand the lens a whole screen of nothing.
        const zone = clamp((Math.sin(bx2 * 0.0068 + 1.3) + Math.sin(by2 * 0.0106)
                          + Math.sin((bx2 + by2) * 0.0037 + 2.2)) * 0.5, -1, 1);
        let prof;
        if (gr < 210) prof = 'core';
        else if (gr < 430) prof = zone < -0.94 ? 'park' : 'cbd';
        else if (gr < 660) prof = zone < -0.86 ? 'park' : zone > 0.1 ? 'cbd' : 'dense';
        else if (gr < 910) prof = zone < -0.8 ? 'park' : zone > 0.25 ? 'dense' : 'mid';
        else if (gr < 1170) prof = zone > 0.35 ? 'mid' : 'low';
        else prof = 'edge';
        // a rare hot tower burns magenta against all that cyan
        const col = rng() < 0.012 ? '255,95,175' : '120,215,255';
        // BLOCK noise: a second, much tighter field that scales every height in
        // a cluster together. Without it each lot rolls its own dice and the
        // skyline comes out as one flat carpet of near-identical boxes.
        const blk = (Math.sin(bx2 * 0.021 + by2 * 0.017) + Math.sin(bx2 * 0.009 - by2 * 0.028 + 2.1)) * 0.5;
        const hs = 0.45 + 0.95 * (blk * 0.5 + 0.5); // 0.45x .. 1.4x
        if (prof === 'core' || prof === 'cbd') {
          if (rng() < (prof === 'core' ? 0.24 : 0.36)) continue; // plazas and light wells
          const spire = rng() < (prof === 'core' ? 0.38 : 0.22);
          const tall = prof === 'core' ? 84 : 52;
          const h = (spire ? tall + rng() * 76 : 30 + rng() * rng() * tall) * hs;
          const roll = rng();
          if (roll < 0.3) {          // setback tower: podium, shaft, crown
            box(bx2, by2, 11 + rng() * 8, 0.45, col, 1.3 + rng() * 0.35);
            const mid = h * (0.55 + rng() * 0.2);
            box(bx2, by2, mid, spire ? 0.95 : 0.62, col, 0.8, 15, true);
            box(bx2, by2, h - mid, spire ? 0.95 : 0.6, col, 0.52, 15 + mid, true);
          } else if (roll < 0.42 && c2 + 1 < cols2) { // office slab across two lots
            skip.add(r2 * 1000 + c2 + 1);
            box(bx2 + ISO_W, by2, h * 0.5, 0.5 + rng() * 0.2, col, 1.75, 0, true);
          } else if (roll < 0.52) {  // low-rise infill between the towers
            box(bx2, by2, 9 + rng() * 12, 0.4 + rng() * 0.2, col, 0.9 + rng() * 0.5);
          } else box(bx2, by2, h, spire ? 0.95 : 0.52 + rng() * 0.3, col, spire ? 0.7 + rng() * 0.16 : 0.78 + rng() * 0.5, 0, h > 44);
          if (h > 78) { // antenna + beacon
            ctx.strokeStyle = 'rgba(170,235,255,0.85)'; ctx.lineWidth = 1.3;
            ctx.beginPath(); ctx.moveTo(bx2, by2 - ISO_H - h); ctx.lineTo(bx2, by2 - ISO_H - h - 13); ctx.stroke();
            ctx.fillStyle = 'rgba(255,120,140,0.95)';
            ctx.fillRect(bx2 - 1.5, by2 - ISO_H - h - 16, 3, 3);
          }
        } else if (prof === 'dense') {
          if (rng() < 0.26) continue;
          const roll = rng();
          if (roll < 0.28 && c2 + 1 < cols2) { // residential slab, two lots wide
            skip.add(r2 * 1000 + c2 + 1);
            box(bx2 + ISO_W, by2, (21 + rng() * 28) * hs, 0.52, col, 1.7, 0, true);
          } else if (roll < 0.42) courtyard(bx2, by2, (14 + rng() * 16) * hs, 0.44, col);
          else if (roll < 0.54) box(bx2, by2, (40 + rng() * 34) * hs, 0.6, col, 0.6, 0, true); // a tower among the walk-ups
          else if (roll < 0.66) terrace(bx2, by2, (12 + rng() * 12) * hs, col);
          else box(bx2, by2, (17 + rng() * 26) * hs, 0.44 + rng() * 0.26, col, 0.85 + rng() * 0.45, 0, true);
        } else if (prof === 'mid') {
          if (rng() < 0.3) continue;
          const roll = rng();
          if (roll < 0.3) terrace(bx2, by2, (10 + rng() * 11) * hs, col);
          else if (roll < 0.42) courtyard(bx2, by2, (9 + rng() * 11) * hs, 0.4, col);
          else if (roll < 0.5) box(bx2, by2, (26 + rng() * 26) * hs, 0.55, col, 0.6, 0, true); // an estate block
          else box(bx2, by2, (11 + rng() * 23) * hs, 0.42 + rng() * 0.26, col, 0.8 + rng() * 0.5, 0, rng() < 0.3);
        } else if (prof === 'low') {
          if (rng() < 0.44) continue;
          if (rng() < 0.55) terrace(bx2, by2, (8 + rng() * 10) * hs, col);
          else box(bx2, by2, (11 + rng() * 17) * hs, 0.34 + rng() * 0.2, col, 0.6 + rng() * 0.5);
        } else if (prof === 'edge') { // past the last ring: clumps, ruins, dark lots
          if (zone < 0.05 || rng() < 0.68) continue;
          if (rng() < 0.4) terrace(bx2, by2, 6 + rng() * 8, col);
          else box(bx2, by2, 8 + rng() * 12, 0.24 + rng() * 0.16, col, 0.55 + rng() * 0.6);
          if (rng() < 0.03) box(bx2, by2, 44 + rng() * 30, 0.5, col, 0.7, 0, true); // a lone mast
        } else { // park: open ground under a canopy of groves
          if (rng() < 0.05) { // a lake, with the far bank catching the light
            ctx.fillStyle = 'rgba(6,26,54,0.9)';
            ctx.beginPath(); ctx.ellipse(bx2, by2, ISO_W * (0.9 + rng() * 0.7), ISO_H * (0.9 + rng() * 0.7), 0, 0, TAU); ctx.fill();
            ctx.strokeStyle = 'rgba(105,210,255,0.4)'; ctx.lineWidth = 1.2; ctx.stroke();
          } else {
            ctx.strokeStyle = `rgba(90,215,175,${(0.26 + rng() * 0.2).toFixed(2)})`; ctx.lineWidth = 1.2;
            ctx.beginPath();

    ctx.strokeStyle = `rgba(220,140,140,${(0.28 + hq * 0.5).toFixed(2)})`;

    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

    ctx.strokeStyle = 'rgba(212,101,255,0.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(menuHold.x, menuHold.y, 26, -Math.PI / 2, -Math.PI / 2 + p * TAU);
    ctx.stroke();
    ctx.restore();

}

// word-wrap fill text within maxW, left-aligned; uses the current ctx font
function wrapText(text, x, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); line = w; y += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, y);
  return y;
}

function drawEnd(g) {
  endButtons = [];
  const ph = (a, b2) => clamp((endT - a) / (b2 - a), 0, 1);
  // wins let the clear-sweep roll first; losses resolve fast
  const T = endWin
    ? { panel0: 0.95, panel1: 1.4, cnt0: 1.4, cnt1: 2.55, stars: 1.6, stats: 2.6 }
    : { panel0: 0.05, panel1: 0.40, cnt0: 0.35, cnt1: 1.00, stars: 99,   stats: 1.0 };
  const btnAt = endBtnAt();

  // the live (now cleared) scene keeps breathing beneath — dim it gently
  ctx.fillStyle = 'rgba(3,6,14,' + (0.5 * (endWin ? ph(0.75, 1.2) : ph(0, 0.45))).toFixed(2) + ')';
  ctx.fillRect(0, 0, W, H);
  if (endWin && endT < 0.35) { // victory flash seals the run
    ctx.fillStyle = 'rgba(126,226,98,' + (0.28 * (1 - endT / 0.35)).toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  const pA = ph(T.panel0, T.panel1);
  if (pA <= 0.001) return;

  const R = g.nodeR * 0.94;
  const maxW = g.nodeR * 2 * 0.62;
  const endCol = endless ? '#ffb340' : endWin ? '#69e05c' : '#ff4a5e';
  const endColRgb = endless ? '255,179,64' : endWin ? '105,224,92' : '255,74,94';
  const fit = (weight, px2, text) => {
    let fs = px2 + 1;
    do { fs--; ctx.font = weight + ' ' + fs + 'px Audiowide, system-ui'; }
    while (fs > 8 && ctx.measureText(text).width > maxW);
    return fs;
  };

  ctx.save();
  ctx.globalAlpha = pA;
  // the report lives INSIDE the ring
  const bg = ctx.createRadialGradient(g.cx, g.cy, R * 0.25, g.cx, g.cy, R);
  bg.addColorStop(0, 'rgba(6,11,24,0.93)');
  bg.addColorStop(0.82, 'rgba(5,9,20,0.88)');
  bg.addColorStop(1, 'rgba(5,9,20,0)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = `rgba(${endColRgb},0.35)`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, 0, TAU); ctx.stroke();
  ctx.strokeStyle = `rgba(${endColRgb},0.8)`; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    const a = k / 4 * TAU + Math.PI / 4 + time * 0.12;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, a - 0.22, a + 0.22); ctx.stroke();
  }

  ctx.textAlign = 'center';
  // mode line
  const modeName = endless ? (daily ? 'DAILY STREAM' : 'ENDLESS STREAM') : qual ? 'QUALIFICATION' : LEVELS[levelIdx].name;
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  ctx.fillStyle = 'rgba(140,210,255,0.7)';
  fit('700', 11, 'MISSION REPORT  //  ' + modeName);
  ctx.fillText('MISSION REPORT  //  ' + modeName, g.cx, g.cy - R * 0.64);
  try { ctx.letterSpacing = '0px'; } catch (e) {}

  // banner slams in
  const tPop = 1 + 0.22 * (1 - ph(T.panel0, T.panel0 + 0.3));
  const banner = endless ? 'STREAM SEVERED' : qual ? (endWin ? 'QUALIFIED' : 'TRAINING ABORTED') : endWin ? 'PAYLOAD DELIVERED' : 'PAYLOAD CORRUPTED';
  ctx.save();
  ctx.translate(g.cx, g.cy - R * 0.38);
  ctx.scale(tPop, tPop);
  ctx.fillStyle = endCol;
  try { ctx.letterSpacing = '4px'; } catch (e) {}
  fit('800', 30, banner);
  ctx.shadowColor = endCol; ctx.shadowBlur = 22;
  ctx.fillText(banner, 0, 0);
  ctx.shadowBlur = 0;
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.restore();

  // stars pop one by one, each with a chime
  if (endWin && !qual && !endless) {
    drawStars(g.cx, g.cy - R * 0.16, endStars, Math.min(W, H) * 0.045, endT - T.stars);

  if (counting && time - endTickT > 0.07) { endTickT = time; tone(1500, 0.025, 'square', 0.035); }
  ctx.fillStyle = '#eaf4ff';
  ctx.font = '700 ' + (28 + (counting ? 2 : 0)) + 'px Audiowide, system-ui';
  ctx.fillText(shown.toLocaleString(), g.cx, g.cy + R * 0.1);
  ctx.fillStyle = 'rgba(160,215,255,0.7)'; ctx.font = '600 11px Audiowide, system-ui';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  ctx.fillText('SCORE', g.cx, g.cy + R * 0.1 + 20);
  try { ctx.letterSpacing = '0px'; } catch (e) {}

  // stats + best reveal after the count settles
  ctx.globalAlpha = pA * ph(T.stats, T.stats + 0.3);
  ctx.fillStyle = 'rgba(140,210,255,0.65)'; ctx.font = '11px monospace';
  ctx.fillText('zapped ' + zaps + '   //   perfect ' + perfects, g.cx, g.cy + R * 0.36);
  ctx.fillText('missed ' + misses + '   //   integrity ' + Math.round(integrity) + '%', g.cx, g.cy + R * 0.36 + 17);
  const bestVal = endless ? (daily ? (progress.daily && progress.daily.best) : progress.best) : PROG.bests[levelIdx];
  const isNew = endless ? (score >= (bestVal || 0) && score > 0) : endNewBest;
  if ((endless || (!qual && (endWin || (bestVal || 0) > 0))) && bestVal !== undefined) {
    ctx.fillStyle = isNew ? '#ffd24a' : 'rgba(255,210,74,0.7)';
    ctx.font = '700 13px Audiowide, system-ui';
    ctx.fillText((isNew ? 'NEW BEST  ' : 'BEST  ') + (bestVal || 0).toLocaleString(), g.cx, g.cy + R * 0.36 + 44);
  }
  // the investigation advances: one case-note line per secured relay

    const bw = Math.min(Math.max(margin * 0.82, 120), 200), bh = 50;

    const primary = endWin && !endless && !qual && levelIdx + 1 < LEVELS.length

    const secondary = [];
    if (primary.action === 'next') secondary.push({ label: 'REPLAY', action: 'retry' });
    secondary.push({ label: 'MENU', action: 'menu' });
    const bcut = Math.min(12, bh * 0.28); // the button()'s own chamfer — the focus ring matches it

    if (!gated) endButtons.push({ x: rx - bw / 2, y: g.cy - bh / 2, w: bw, h: bh, action: primary.action, cut: bcut });
    let sy = g.cy - (secondary.length * bh + (secondary.length - 1) * 14) / 2;

  // (bA), the run's board rank leads, the rest dims back behind a scrim, and the
  // handle card owns the screen; Continue stays gated (above) until save/skip.

  nameEntryBtns = [];

    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.save();
    ctx.translate(g.cx, cy0 + 66); ctx.scale(0.82 + 0.18 * to, 0.82 + 0.18 * to);

      const big = '#' + rk, sub = '  / ' + LB_SHOW;

      ctx.font = '600 14px Audiowide, system-ui'; const wS = ctx.measureText(sub).width;

    ctx.save();
    // the whole band bathed in energy + an aura radiating past it
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(120,210,255,${(br2 * 0.30).toFixed(2)})`;
    ctx.lineWidth = shBh * 2.1;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, sh0, sh1); ctx.stroke();
    ctx.strokeStyle = `rgba(120,210,255,${(br2 * 0.12).toFixed(2)})`;
    ctx.lineWidth = shBh * 3.8;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, sh0, sh1); ctx.stroke();
    // both machined lips lit hard
    ctx.strokeStyle = `rgba(160,230,255,${(br2 * 0.95).toFixed(2)})`;
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, Rout, sh0, sh1); ctx.stroke();
    ctx.beginPath(); ctx.arc(g.cx, g.cy, Rin, sh0, sh1); ctx.stroke();
    ctx.strokeStyle = `rgba(160,230,255,${(br2 * 0.45).toFixed(2)})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, Rout + 4, sh0, sh1); ctx.stroke();
    if (spQ < 1) { // the racing fronts: white-hot heads + a spark shower
      for (const fa of [sh0, sh1]) {
        const fx2 = g.cx + Math.cos(fa) * g.nodeR, fy2 = g.cy + Math.sin(fa) * g.nodeR;
        const fg = ctx.createRadialGradient(fx2, fy2, 0, fx2, fy2, shBh * 1.1);
        fg.addColorStop(0, 'rgba(255,255,255,0.95)');
        fg.addColorStop(0.4, 'rgba(160,230,255,0.5)');
        fg.addColorStop(1, 'rgba(160,230,255,0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(fx2, fy2, shBh * 1.1, 0, TAU); ctx.fill();
        if (state === S.PLAY && Math.random() < 0.5) particles.push({
          x: fx2, y: fy2, vx: rand(-1.5, 1.5), vy: rand(-1.5, 1.5),
          life: rand(0.2, 0.4), decay: 2.8, color: '#bfeaff', size: rand(0.8, 1.8) });
      }
    }
    // scintillation: animated grain INSIDE the band — the glow gets a living
    // texture, like charge boiling in the metal (reuses the film-grain tile)
    if (grainCv && !lowFX) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(g.cx, g.cy, Rout + 3, sh0, sh1);
      ctx.arc(g.cx, g.cy, Rin - 3, sh1, sh0, true);
      ctx.closePath();
      ctx.clip();
      ctx.globalCompositeOperation = 'lighter';
      for (const [spd, sc, al] of [[41, 1, 0.10], [67, 0.5, 0.07]]) { // two speeds, two grains
        ctx.globalAlpha = al * br2 * 1.7;
        const ox = (Math.floor(time * spd) * 97) % 256, oy = (Math.floor(time * spd) * 53) % 256;
        const ts = 256 * sc;
        for (let yy = -oy * sc; yy < H; yy += ts) for (let xx = -ox * sc; xx < W; xx += ts)
          ctx.drawImage(grainCv, xx, yy, ts, ts);
      }
      ctx.restore();
    }
    ctx.restore();
  }
  if (shieldFlashT > 0 && state !== S.MENU && !inGuide) {
    // the catch: the sheath drains around the collar INTO the breach point,
    // brightening as it concentrates, and cracks white where it lands
    const shBh = Math.min(W, H) * 0.055 * ARCFX.bandW;
    const sr = g.nodeR + shBh;
    const q = 1 - shieldFlashT / 0.5;
    const half = Math.PI * (1 - q * q);            // ease in as it collapses
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(120,210,255,${(0.2 + q * 0.3).toFixed(2)})`;   // the glow itself drains
    ctx.lineWidth = shBh * 2.1;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, shieldHitA - half, shieldHitA + half); ctx.stroke();
    ctx.strokeStyle = `rgba(190,240,255,${(0.65 + q * 0.35).toFixed(2)})`;
    ctx.lineWidth = 2.5 + q * 4;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, sr, shieldHitA - half, shieldHitA + half); ctx.stroke();
    const hx = g.cx + Math.cos(shieldHitA) * sr, hy = g.cy + Math.sin(shieldHitA) * sr;
    ctx.strokeStyle = `rgba(255,255,255,${(0.9 * (1 - q)).toFixed(2)})`;
    ctx.lineWidth = 1.4;
    for (let k = 0; k < 3; k++) {                  // white cracks at the catch
      const ra2 = Math.random() * TAU;
      let px2 = hx, py2 = hy;
      ctx.beginPath(); ctx.moveTo(px2, py2);
      for (let k2 = 0; k2 < 3; k2++) {
        px2 += Math.cos(ra2) * shBh * 0.5 + rand(-3, 3);
        py2 += Math.sin(ra2) * shBh * 0.5 + rand(-3, 3);
        ctx.lineTo(px2, py2);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // traps render over the ring — missed ones fly past the player and fade
  const sorted = inGuide ? [] : enemies.slice().sort((a, b) => b.z - a.z);
  for (const en of sorted) if (en.lineLead) drawLineBeam(en, g); // beams sit under the traps
  for (const en of sorted) drawEnemy(en, g);
  for (const gh of inGuide ? [] : ghosts) drawGhost(gh, g); // dead bodies de-rezzing in place
  for (const p of inGuide ? [] : pickups) drawPickup(p, g);
  if (!inGuide) drawPulseWave(g);
  drawClearSweep(g);
  if (boss && state !== S.MENU && !inGuide) drawBoss(g);

  if (state !== S.MENU && !inGuide) drawNodes(g);
  if (state !== S.MENU && !inGuide) drawVolley(g);

  // particles + popups (over everything)
  ctx.lineCap = 'round';
  for (const p of inGuide ? [] : particles) {
    // data bits: fine streaks along their motion, not blobs — light in fiber
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = Math.max(0.5, p.size * 0.6);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 2.4 - 0.5, p.y - p.vy * 2.4 - 0.5);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (ripples.length && !inGuide) { // the healed wash, soaking into the wall
    const gD = geo();
    for (const rp of ripples) {
      const k = rp.t / DECOMP.rippleT, rg = ring(rp.z, gD);
      const sc = clamp(rg.r / gD.nodeR, 0.1, 2); // wall-lockstep scale, like the bodies
      const A = DECOMP.rippleR * rp.mul * (1 - Math.pow(1 - k, 3)); // angular reach along the ring
      const zd = A * 0.34 * (1 + 6 * rp.z) / 6;  // axial reach, sized so the loop reads round ON the wall
      // the wash is a disc drawn ON the cylinder: every sample point is an
      // (angle, z) wall coordinate projected through ring(), so the patch
      // bends around the bore and foreshortens with depth — geometry, not a decal
      ctx.beginPath();
      for (let i = 0; i <= 28; i++) {
        const ph = i / 28 * TAU;
        const th = rp.a + A * Math.cos(ph);
        const r2 = ring(Math.max(0.012, rp.z + zd * Math.sin(ph)), gD);
        const sx = r2.x + Math.cos(th) * r2.r, sy = r2.y + Math.sin(th) * r2.r;
        i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
      }
      ctx.closePath();
      // healed: a neon-green wash that soaks the wall and drains away
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(57,255,20,' + (DECOMP.fill * (1 - k)).toFixed(3) + ')';
      ctx.fill();
      ctx.globalAlpha = (1 - k) * DECOMP.edge;
      ctx.strokeStyle = 'rgba(57,255,20,1)';
      ctx.lineWidth = Math.max(0.8, 3 * sc * (1 - k));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (!inGuide) drawBolts();
  if (killStreaks.length && !inGuide) { // reprogrammed packets tracing home along the wall
    const g2 = geo(), u = Math.min(W, H);
    const P = (aa, z) => { const rg = ring(z, g2); return { x: rg.x + Math.cos(aa) * rg.r, y: rg.y + Math.sin(aa) * rg.r, s: rg.s }; };
    ctx.globalCompositeOperation = 'lighter';
    const DUR = 0.15, RUN = 0.62; // a comet: one hot zip down the bore, gone in a blink
    for (const st of killStreaks) {
      const q = st.t / DUR;
      const heat = Math.pow(1 - q, 1.5);              // the head loses heat as it runs
      const glob = q < 0.7 ? 1 : (1 - q) / 0.3;       // the tail snuffs right after
      const zHead = st.z + RUN * (1 - Math.pow(1 - q, 2));   // the head eases forward
      const zTail = Math.max(st.z, zHead - RUN * (0.30 + 0.5 * q)); // the tail lets go late
      if (zTail >= SPAWN_Z) continue;
      const SEG = 6;
      for (let i = 0; i < SEG; i++) {
        const f0 = i / SEG, f1 = (i + 1) / SEG; // 0 = tail, 1 = head
        const z0 = Math.min(lerp(zTail, zHead, f0), SPAWN_Z), z1 = Math.min(lerp(zTail, zHead, f1), SPAWN_Z);
        const wa0 = 0.075 * (0.35 + f0 * 0.65), wa1 = 0.075 * (0.35 + f1 * 0.65); // fat at the head
        const c00 = P(st.a - wa0, z0), c01 = P(st.a + wa0, z0);
        const c11 = P(st.a + wa1, z1), c10 = P(st.a - wa1, z1);
        ctx.globalAlpha = glob * (0.30 + 0.70 * heat) * (0.05 + 0.14 * f0);
        ctx.fillStyle = 'rgb(126,226,98)';
        ctx.beginPath();
        ctx.moveTo(c00.x, c00.y); ctx.lineTo(c01.x, c01.y);
        ctx.lineTo(c11.x, c11.y); ctx.lineTo(c10.x, c10.y);
        ctx.closePath(); ctx.fill();
      }
      // white-hot filament along the spine, brightest at the head
      ctx.lineCap = 'round';
      for (let i = 0; i < SEG; i++) {
        const p0 = P(st.a, lerp(zTail, zHead, i / SEG)), p1 = P(st.a, Math.min(lerp(zTail, zHead, (i + 1) / SEG), SPAWN_Z));
        ctx.globalAlpha = glob * heat * (0.08 + 0.40 * (i / SEG));
        ctx.strokeStyle = 'rgba(228,255,220,0.95)';
        ctx.lineWidth = u * 0.0045 * (0.5 + (i / SEG));
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
      }
      ctx.lineCap = 'butt';
      const hp = P(st.a, Math.min(zHead, SPAWN_Z)); // the head: a hot green mote
      const hr = u * 0.016 * (hp.s / 0.4) * (0.45 + 0.55 * heat); // it shrinks as it cools
      const gl = ctx.createRadialGradient(hp.x, hp.y, 0, hp.x, hp.y, hr);
      gl.addColorStop(0, 'rgba(235,255,230,' + (0.8 * glob * heat).toFixed(2) + ')');
      gl.addColorStop(1, 'rgba(126,226,98,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(hp.x, hp.y, hr, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'center';
  for (const p of inGuide ? [] : popups) {
    const al = clamp(p.life, 0, 1);
    ctx.font = '700 15px Audiowide, system-ui';
    const tw = ctx.measureText(p.text).width;
    const px = clamp(p.x, tw / 2 + 12, W - tw / 2 - 12); // plates stay on screen
    ctx.globalAlpha = al * 0.72; // backing plate so popups read over any traffic
    ctx.fillStyle = 'rgba(4,10,22,0.9)';
    roundRect(px - tw / 2 - 9, p.y - 15, tw + 18, 21, 6); ctx.fill();
    ctx.globalAlpha = al * 0.5;
    ctx.strokeStyle = p.color; ctx.lineWidth = 1;
    roundRect(px - tw / 2 - 9, p.y - 15, tw + 18, 21, 6); ctx.stroke();
    ctx.globalAlpha = al;
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, px, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // cinematic vignette + color grade (under the HUD so controls stay crisp)
  if (vignetteCanvas) ctx.drawImage(vignetteCanvas, 0, 0, W, H);
  // film-grain finish (ARCFX.grain) — skipped on struggling devices
  if (grainCv && !lowFX && state !== S.MENU) {
    ctx.globalAlpha = 0.05 * ARCFX.grain;
    const gox = (Math.floor(time * 24) * 97) % 256, goy = (Math.floor(time * 24) * 53) % 256;
    for (let gy = -goy; gy < H; gy += 256) for (let gx = -gox; gx < W; gx += 256)
      ctx.drawImage(grainCv, gx, gy);
    ctx.globalAlpha = 1;
  }
  const grade = ctx.createLinearGradient(0, 0, 0, H);
  grade.addColorStop(0, 'rgba(18,55,110,0.10)');   // cool up top
  grade.addColorStop(0.55, 'rgba(0,0,0,0)');
  grade.addColorStop(1, 'rgba(255,150,50,0.08)');  // warm river light below
  ctx.fillStyle = grade;
  ctx.fillRect(0, 0, W, H);

  // per-level color identity: each relay tints the air at the edges
  if ((state === S.PLAY || state === S.PAUSE || state === S.INFO) && LV && LV.tint) {
    const tg2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    tg2.addColorStop(0, `rgba(${LV.tint},0)`);
    tg2.addColorStop(1, `rgba(${LV.tint},0.11)`);
    ctx.fillStyle = tg2;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === S.PLAY) {
    drawHUD(g); drawDials(); drawIntroCard(); drawNowPlaying();
    if (popLive('pause')) drawPause(); // resume: the panel erases behind its scan
    if (worldFx) ctx.restore(); // end the replay world fly-in (board overlay is NOT zoomed)
    // leaderboard<->player transition: the board rides ON TOP of the (paused)
    // replay — its cards fly out / the ring zooms into the lens, revealing the run
    if (replayXfer && replayPkg) { menuButtons = []; drawMenuBoard(); }
  }
  else if (state === S.PAUSE) { drawHUD(g); drawDials(); drawIntroCard(); drawPause(); }
  else if (state === S.INFO) { drawHUD(g); drawDials(); drawIntroCard(); drawInfoCard(); }
  else if (state === S.GUIDE) drawGuide(g);
  else if (state === S.MENU) {
    if (SPLASH.on && SPLASH.t < SPL.wheel) { /* boot stage one: only the tunnel
      breathes behind the badge — the menu waits for its wheel cue */ }
    else if (menuFx && menuFx.kind === 'launch') {
      const q = clamp(menuFx.t / menuFx.dur, 0, 1), e2 = q * q;
      ctx.save();
      ctx.translate(g.cx, g.cy); ctx.scale(1 + e2 * 1.7, 1 + e2 * 1.7); ctx.translate(-g.cx, -g.cy);
      ctx.globalAlpha = 1 - e2;
      drawMenu(g);
      ctx.restore();
    } else if (menuFx && menuFx.zoom) {
      // launch, run backwards: the menu lives BEHIND the run, so returning
      // from a level it drives back into view — oversized and faint, settling
      const q = clamp(menuFx.t / menuFx.dur, 0, 1), e2 = (1 - q) * (1 - q);
      ctx.save();
      ctx.translate(g.cx, g.cy); ctx.scale(1 + e2 * 1.7, 1 + e2 * 1.7); ctx.translate(-g.cx, -g.cy);
      ctx.globalAlpha = 1 - e2;
      drawMenu(g);
      ctx.restore();
    } else drawMenu(g);
  }
  else drawEnd(g);
  drawGpHints();

  // system-critical glitches — the screen itself degrades with the payload
  if (state === S.PLAY && integrity <= 50) {
    const gi = (50 - integrity) / 50;
    if (Math.random() < 0.15 + gi * 0.35) {
      for (let i = 0; i < 1 + gi * 3; i++) {
        const gy = Math.random() * H, gh = rand(2, 6 + gi * 10);
        ctx.fillStyle = 'rgba(90,220,255,' + (0.04 + gi * 0.07).toFixed(2) + ')';
        ctx.fillRect(0, gy, W, gh);
        ctx.fillStyle = 'rgba(255,60,80,' + (0.03 + gi * 0.06).toFixed(2) + ')';
        ctx.fillRect(rand(-30, 30), gy + gh, W, 2);
      }
    }
    if (integrity <= 25) { // heartbeat vignette on the last block
      const pulse = (Math.sin(time * 5) * 0.5 + 0.5) * 0.22;
      const hv = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
      hv.addColorStop(0, 'rgba(255,40,60,0)');
      hv.addColorStop(1, 'rgba(255,40,60,' + pulse.toFixed(2) + ')');
      ctx.fillStyle = hv; ctx.fillRect(0, 0, W, H);
    }
  }

  // red damage vignette
  if (redFlash > 0) {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    v.addColorStop(0, 'rgba(255,40,60,0)');
    v.addColorStop(1, `rgba(255,40,60,${(redFlash * 0.4).toFixed(2)})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  // screen-stitch fade between scenes
  if (fadeT > 0) {
    fadeT = Math.max(0, fadeT - rawDt);
    ctx.fillStyle = 'rgba(2,4,10,' + (fadeT / 0.35 * 0.9).toFixed(2) + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  drawTrans(); // transitions + press feedback ride over everything
  drawMenuBadgeTop(g); // …except the logo, which rides over the press feedback
  drawSplash(rawDt); // …and the boot splash curtains the whole stage at launch

  ctx.restore();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
// offline capability + PWA installability (no-op on insecure origins)
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// boot: the splash decodes its score and tries to run it right away — the
// Capacitor app WebView allows it; desktop browsers that block autoplay let
// the first tap unlock it mid-sequence. Contexts without the splash (headless
// tests, the editor) keep the old behavior: straight to the menu track.
// (deferred a tick: the MUSIC_DATA manifest script below hasn't parsed yet)
setTimeout(() => {
  if (SPLASH.on) splashBoot();
  else if (state === S.MENU) playTrack('menu');
}, 0);
</script>
<script>
// ---------- soundtrack manifest ----------
// The menu has its own piece; it is NOT in the run pool. The pool is whatever
// sits in src/audio/music/ — window.MUSIC_TRACKS is generated from that folder
// by scripts/build.js, and each track's title is derived from its filename. So
// adding music is: drop the file in, `npm run build`. Renaming it retitles it.
// Nothing here needs editing per track.
window.MUSIC_DATA = {
  menu: 'audio/Midnight_Terminal_Wait.mp3',
  levels: window.MUSIC_TRACKS || []
};
</script>
</body>
</html>

const canvas = document.getElementById('game');

// ---------- utils ----------
const TAU = Math.PI * 2;

const BUILD = (() => {

let AC = null, sfxGain = null;
const settings = {
  sound: true, soundVol: 0.8, music: true, musicVol: 0.32, haptics: true, // music sits low so sonar and cues read

const CONTROL_NAMES = ['DIALS', 'IMMERSIVE', 'ARCS'];
// launch focus: the pads (DIALS) are THE control scheme — skill play, trained

const ALT_CONTROLS = false;
// score-chase modifiers — unlocked with the campaign, toggled on the menu
const mutators = { oneLife: false, fast: false, noPickups: false };
const mutMul = () => (mutators.oneLife ? 2 : 1) * (mutators.fast ? 1.5 : 1) * (mutators.noPickups ? 1.3 : 1);

}

function audio() {

let noiseBuf = null;

// the stream-trace drone: a rolling tone that climbs as the ribbon is ridden

// whisper-quiet approach blip, stereo-panned to the threat's angle
function sonarTick(freq, pan) {

  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;

// ---------- soundtrack (MUSIC_DATA is injected in a script at the end of this file) ----------
// menu: View From The Dashboard · L1: Sub Level Three · L2: Steel and Rain · L3: Terminal Velocity
// Web Audio looper: each track is decoded to a buffer and looped sample-accurately
// (native <audio loop> always has an audible seam on mp3). Encoder padding is
// trimmed via loopStart/loopEnd. One decoded track is held in memory at a time.

let currentTrackKey = null, musicLoadKey = null;

    try { musicSrc.disconnect(); } catch (e) {}

// estimate the track's beat period (sec) — energy-flux autocorrelation over 60–180 BPM
function detectBeat(buf) {

// snap a spawn delay so the trap ARRIVES at the ring on a beat
function beatQuantize(delay, travel) {

  const pos = AC.currentTime - musicStartAt;
  const arrive = pos + delay + (travel || 0);

  // wall decals project as clean annular arcs (a REAL tunnel, not an effect)

        crackle(0.3, 2400, 500, 4, 0.6);
        buzz(25);
      }
    }
    const lt2 = lt.t - lt.tele;
    if (lt2 < lt.arm) continue; // a beat of grace before it can hurt
    const half = lt.span0 * (1 - lt2 / lt.dur);
    for (let i = 0; i < 2; i++) {
      if (fused && i === 1) continue; // one fused carriage in the duel
      if (nodes[i].deadT > 0) continue;
      if (Math.abs(angDiff(nodes[i].angle, lt.a)) < half) { // crossed the clamp
        nodes[i].deadT = 2;
        if (fused) nodes[1].deadT = 2;
        const p2 = nodeXY(nodes[i]);
        burst(p2.x, p2.y, '#ff9a3c', 22, 4);
        popup(p2.x, p2.y - 24, fused ? 'CANNON FRIED' : 'NODE FRIED', '#ffb478');
        sfx.fry(Math.cos(nodes[i].angle) * 0.6);
        redFlash = Math.max(redFlash, 0.5);
        shake = Math.min(shake + 0.5, 1);
        buzz([40, 30, 60]);
      }
    }
  }

  // UNITE-VOLLEY: docking both nodes together sacrifices ALL other coverage
  // for half a second — the charge — then a focused bolt fires straight into
  // the bore. In the duel the bolt homes on the core instead.
  volley.cd = Math.max(0, volley.cd - dt);
  const bothAlive = !(nodes[0].deadT > 0) && !(nodes[1].deadT > 0);
  // hysteresis: docking engages inside 0.26 rad, but once charging, only a
  // DECISIVE split (0.45) releases — thumb jitter on glass can't fire it
  const dockGap = Math.abs(angDiff(nodes[0].angle, nodes[1].angle));
  const docked = state === S.PLAY && !inIntro && bothAlive
    && !(boss && (boss.introT < BOSS_CER || boss.dying !== undefined))
    && dockGap < (volley.charge > 0 ? 0.45 : 0.26);
  if (docked && volley.cd <= 0) {
    if (volley.charge === 0) { crackle(0.5, 300, 2200, 2, 0.28); buzz(8); } // capacitor whine
    volley.charge = Math.min(0.5, volley.charge + dt);
    // the shot goes where you're AIMING while docked
    volley.aimA = nodes[0].angle + angDiff(nodes[1].angle, nodes[0].angle) / 2;
    if (volley.charge >= 0.5) fireVolley(g); // half a second of full commitment, then it flies
  } else if (volley.charge > 0) {
    tone(600, 0.08, 'sine', 0.04, 380); // fizzle — dock broken before the charge completed
    volley.charge = 0;
  }
  for (const sh of volley.shots) {
    if (sh.dead) continue;
    if (sh.homing) { // duel bolt: rides the wire straight to the core
      sh.t += dt / 0.55;
      if (!boss) { sh.dead = true; continue; }
      if (sh.t >= 1) { sh.dead = true; bossVolleyHit(sh); }
      continue;
    }
    sh.z += dt * 2.4;
    if (sh.z > (sh.reach || SPAWN_Z)) { sh.dead = true; continue; } // spent at the horizon
    for (const en of enemies) {
      if (en.dead || en.resolved || en.failed || en.type === 'strip') continue;
      // the bolt only answers to SINGLE plain reds and heavy armor — barrier
      // pairs and color-locked taps are keyed work for the nodes themselves
      if (en.type === 'line' || en.partner || en.lock !== undefined) continue;
      if (Math.abs(angDiff(en.angle, sh.a)) > 0.30 || Math.abs(en.z - sh.z) > 0.09) continue;
      const rgV = ring(Math.max(en.z, 0.02), g);
      const vx = rgV.x + Math.cos(en.angle) * rgV.r, vy = rgV.y + Math.sin(en.angle) * rgV.r;
      if (en.type === 'frag') {
        // shooting a trap REPLICATES it — one becomes two. The lesson costs.
        sh.dead = true;
        en.dead = true;
        for (const s3 of [-1, 1]) {
          enemies.push({ type: 'frag', lock: undefined, z: Math.min(SPAWN_Z - 0.06, en.z + 0.22),
            angle: en.angle + s3 * 0.32, sizeMul: 0.8, speedMul: 1,
            spin: Math.random() * TAU, spinMul: 1, age: 0, dead: false, partner: null });
        }
        burst(vx, vy, '#4a5568', 26, 4);
        burst(vx, vy, '#ff9a3c', 12, 3);
        popup(vx, vy, 'TRAP REPLICATED ×2', '#ff9a3c');
        tone(150, 0.3, 'sawtooth', 0.13, 60);
        crackle(0.3, 2600, 500, 3, 0.7);
        shake = Math.min(shake + 0.5, 1);
        buzz([30, 30, 50]);
        break; // the bolt died on the trap
      }
      // volley kills pay a flat bounty — no combo, no zap credit, no pulse
      // feed: interception stays the scoring game, this is a TOOL
      en.dead = true;
      const vb = Math.round((en.type === 'heavy' ? 250 : 60) * mutMul());
      score += vb;
      burst(vx, vy, en.type === 'heavy' ? '#d465ff' : '#bfeaff', 22, 5);
      burst(vx, vy, '#ffffff', 12, 5.5);
      popup(vx, vy, (en.type === 'heavy' ? 'ARMOR DOWN +' : '+') + vb, '#bfeaff');
      rimFX.push({ a: en.angle, t: 0.4, col: '140,225,255' });
      sfx.zap(1, Math.cos(en.angle) * 0.6);
      buzz(en.type === 'heavy' ? 25 : 12);
      spawnKillStreak(en.angle, en.z);
      lastKillBeat(en);
      if (en.type === 'heavy') { // armor stops the bolt; reds it punches through
        tone(110, 0.2, 'square', 0.13, 60);
        sh.dead = true;
        break;
      }
    }
  }
  volley.shots = volley.shots.filter(sh => !sh.dead);

  let stripProg = -1; // >= 0 while a node is riding a stream this frame
  for (const en of enemies) {
    en.z -= L.speed * waveMul * (en.speedMul || 1) * sdt;
    en.spin += sdt * 4 * (en.spinMul || 1);
    en.age += sdt;
    if (en.drift) en.angle += en.drift * sdt;

    // sonar tick: a quiet geiger blip per hostile, panned to its angle,
    // accelerating as it closes — the wave is audible before it's urgent
    if (!en.dead && !en.resolved && !en.failed && en.type !== 'frag' && en.type !== 'strip' && en.z > g.hitZ && en.z < 1.9) {
      en.tickT = (en.tickT || 0) - sdt;
      if (en.tickT <= 0) {
        const tArr = (en.z - g.hitZ) / (trafficSpeed * (en.speedMul || 1));
        en.tickT = clamp(tArr * 0.38, 0.14, 1.25);
        sonarTick(1150 + 350 * clamp(1 - tArr / 1.5, 0, 1), Math.cos(en.angle) * 0.75);
      }
    }

    if (en.type === 'strip') {
      // data stream: keep a node ON the ring-crossing point from head to tail
      en.tracing = false;
      if (!en.dead && !en.failed && en.z <= g.hitZ && en.z + en.len >= g.hitZ) {
        const aReq = stripAngle(en, g.hitZ - en.z);
        const on0 = covers(nodes[0], aReq), on1 = covers(nodes[1], aReq);
        if (on0 || on1 || fx.auto > 0) {
          en.offT = 0;
          en.tracing = true;
          stripProg = clamp((g.hitZ - en.z) / en.len, 0, 1); // drives the trace drone
          en.traceNode = on0 ? 0 : on1 ? 1 : en.traceNode || 0;
          en.traceT = (en.traceT || 0) + sdt;
          if (en.traceT > 0.14) { // score ticks while riding the line
            en.traceT -= 0.14;
            score += Math.round(20 * mutMul());
            const hp = ringXY(aReq);
            burst(hp.x, hp.y, '#ffd24a', 2, 2.5);
          }
        } else if ((en.offT = (en.offT || 0) + sdt) < 0.18) {
          // forgiveness window: a brief slip (or the crossing's first frames)
          // doesn't break the stream — staying off it does
        } else if (en.tut) { // practice stream: no penalty, run the drill again
          if (tut) { tut.retry = en.tut; tut.t = 0; }
          en.dead = true;
          const hp = ringXY(aReq);
          popup(hp.x, hp.y, 'STAY ON THE STREAM — AGAIN', '#ff9a3c');
          sfx.miss();
        } else {
          // the bonus fizzles — a missed opportunity, never a wound
          en.failed = true;
          const hp = ringXY(aReq);
          burst(hp.x, hp.y, '#ffd24a', 8, 2.5);
          popup(hp.x, hp.y, 'STREAM LOST', 'rgba(255,225,160,0.85)');
          tone(520, 0.14, 'sine', 0.05, 390);
        }
      }
      if (!en.dead && en.z + en.len < g.hitZ) { // tail cleared the ring
        en.dead = true;
        if (!en.failed) {
          const pts = Math.round(250 * mutMul());
          score += pts;
          const aEnd = stripAngle(en, en.len);
          const hp = ringXY(aEnd);
          burst(hp.x, hp.y, '#ffd24a', 26, 4);
          burst(hp.x, hp.y, '#ffffff', 14, 5);
          rimFX.push({ a: aEnd, t: 0.5, col: '255,210,74' });
          sfx.traced();
          // a full ride buys a full pulse for the node that rode it
          const ni = en.traceNode !== undefined ? en.traceNode
            : Math.abs(angDiff(nodes[0].angle, aEnd)) < Math.abs(angDiff(nodes[1].angle, aEnd)) ? 0 : 1;
          pulseCharge[ni] = PULSE_MAX; // the ride banks a full pulse — tutorial included
          popup(hp.x, hp.y, 'PULSE CHARGED +' + pts, '#ffe9b0');
          sfx.perfect();
          buzz(30);
        }
      }
      // the ribbon lights up in the tracing node's color, fading in and out
      en.traceGlow = clamp((en.traceGlow || 0) + (en.tracing ? sdt * 5 : -sdt * 3), 0, 1);
      continue; // ribbons never enter the zap/miss resolution below
    }

    if (!en.dead && !en.resolved && en.z <= g.hitZ) {
      // node killer: a hacker trap — touching it IS the mistake
      if (en.type === 'frag') {
        const touched = covers(nodes[0], en.angle) || covers(nodes[1], en.angle);
        const { x: fx2, y: fy } = ringXY(en.angle);
        if (touched) {
          en.dead = true;
          burst(fx2, fy, '#4a5568', 22, 3.5);
          if (en.tut && en.touchMe) { // the lesson: feel the fry, no penalty beyond it
            if (tut) tut.fragTaught = true;
            for (const n of nodes) if (covers(n, en.angle)) n.deadT = 2;
            popup(fx2, fy, 'FRIED — 2s REBOOT. now you know', '#ff9a3c');
            sfx.fry(Math.cos(en.angle) * 0.7);
            buzz([40, 40, 60]);
          } else if (en.tut) { // practice: it fries here too — dodge means dodge
            if (tut) { tut.retry = en.tut; tut.t = 0; }
            for (const n of nodes) if (covers(n, en.angle)) n.deadT = 2;
            popup(fx2, fy, 'FRIED — dodge it. AGAIN', '#ff9a3c');
            sfx.fry(Math.cos(en.angle) * 0.7);
            buzz([40, 40, 60]);
          } else {
            combo = 0; comboHeal = 0; fragsHit++;
            if (!shieldAbsorb(fx2, fy)) {
              // the trap fries every node that touched it — 2s forced reboot
              for (const n of nodes) if (covers(n, en.angle)) n.deadT = 2;
              popup(fx2, fy, 'NODE FRIED — REBOOTING', '#ff4a5e');
              redFlash = 1; shake = Math.min(shake + 0.6, 1);
              sfx.fry(Math.cos(en.angle) * 0.7);
              buzz([40, 40, 60]);
            }
          }
        } else {
          en.resolved = true;
          if (en.tut && en.touchMe) { // the lesson requires contact — again
            if (tut) { tut.retry = en.tut; tut.t = 0; }
            popup(fx2, fy, 'TOUCH it this once — feel what it does', '#ff9a3c');
          } else {
            const bonus = Math.round(50 * mutMul());
            score += bonus;
            popup(fx2, fy, 'trap avoided +' + bonus, '#9aa7bd');
          }
        }
        continue;
      }
      let hit = false;
      const boltPairs = []; // [node, targetAngle] — where the lightning jumps from/to
      if (fx.auto > 0) {
        hit = true; // auto-zap: the firewall clears anything crossing the ring
        if (en.partner) boltPairs.push([nodes[0], en.angle], [nodes[1], en.partner.angle]);
        else boltPairs.push([nearest(en.angle), en.angle]);
      } else if (en.type === 'heavy') {
        // heavy armor: no zap breaks it — only a charged volley (or a purge)
        // brings it down BEFORE it lands. At the rim it simply breaches.
        hit = false;
      } else if (en.type === 'line') {
        // barrier: one node on each end, either assignment
        const p = en.partner;
        if (covers(nodes[0], en.angle) && covers(nodes[1], p.angle)) { hit = true; boltPairs.push([nodes[0], en.angle], [nodes[1], p.angle]); }
        else if (covers(nodes[1], en.angle) && covers(nodes[0], p.angle)) { hit = true; boltPairs.push([nodes[1], en.angle], [nodes[0], p.angle]); }
      } else if (en.lock !== undefined) {
        // color-locked: only the matching node can break it
        hit = covers(nodes[en.lock], en.angle);
        if (hit) boltPairs.push([nodes[en.lock], en.angle]);
      } else {
        const shooter = covers(nodes[0], en.angle) ? nodes[0] : covers(nodes[1], en.angle) ? nodes[1] : null;
        hit = !!shooter;
        if (shooter) boltPairs.push([shooter, en.angle]);
      }
      const { x: ex, y: ey } = ringXY(en.angle);
      if (hit) {
        en.dead = true;
        combo++;
        // precision grading: dead-center coverage doubles the take (never via auto-zap)
        let err = 0;
        for (const [n, a] of boltPairs) err = Math.max(err, Math.abs(angDiff(n.angle, a)));
        const perfect = fx.auto <= 0 && boltPairs.length > 0 && err < TOL * 0.35;
        if (perfect) perfects++;
        const base = en.type === 'heavy' ? 250 : en.type === 'line' ? 300 : en.lock !== undefined ? 150 : 100;
        const pts = Math.round(base * (perfect ? 2 : 1) * mutMul()) * Math.min(combo, 5);
        score += pts; zaps++;
        // each shooter banks the zap into ITS orb (both, on a shared kill) —
        // choosing which node fires is choosing which pulse you charge
        if (!en.tut) {
          const fed = new Set();
          for (const [n2] of boltPairs) fed.add(n2 === nodes[0] ? 0 : 1);
          for (const fi of fed) {
            if (pulseCharge[fi] >= PULSE_MAX) continue;
            pulseCharge[fi] = Math.min(PULSE_MAX, pulseCharge[fi] + Math.min(combo, 5));
            if (pulseCharge[fi] >= PULSE_MAX) {
              popup(W / 2, H * 0.35, (fi === 0 ? 'BLUE' : 'WHITE') + ' PULSE CHARGED — TAP ITS CORE', '#8fe0ff');
              sfx.heal();
              buzz(15);
            }
          }
        }
        // max-combo streaks knit the payload back together
        const cap = mutators.oneLife ? 25 : 100;
        if (combo >= 5 && integrity < cap) {
          comboHeal++;
          if (comboHeal >= 5) {
            comboHeal = 0;
            integrity = Math.min(cap, integrity + 25);
            popup(ex, ey - 26, 'INTEGRITY RESTORED', '#8fc7ff');
            rimFX.push({ a: en.angle, t: 0.6, col: '143,199,255' });
            sfx.heal();
            buzz(12);
          }
        }
        burst(ex, ey, '#bfeaff', 26, 4);
        burst(ex, ey, '#ffffff', 14, 5);
        if (en.partner) {
          en.partner.dead = true;
          const p2 = ringXY(en.partner.angle);
          burst(p2.x, p2.y, '#bfeaff', 26, 4);
          burst(p2.x, p2.y, '#ffffff', 14, 5);
        }
        for (const [n, a] of boltPairs) {
          const s0 = nodeXY(n), t0 = ringXY(a);
          spawnBolt(s0.x, s0.y, t0.x, t0.y);
          n.recoil = 1; // the carriage kicks back
          rimFX.push({ a, t: 0.45, col: '140,225,255' });
        }
        // chain overdrive: the kill arcs to the nearest other hostile and
        // takes it too — locks and armor don't stop raw lightning
        if (!en.tut && fx.chain > 0) {
          let cBest = null, cd = 9;
          for (const c of enemies) {
            if (c === en || c === en.partner || c.dead || c.resolved || c.failed) continue;
            if (c.type === 'frag' || c.type === 'strip') continue; // never into payloads or ribbons
            const dA = Math.abs(angDiff(c.angle, en.angle));
            if (dA < cd) { cd = dA; cBest = c; }
          }
          if (cBest) {
            cBest.dead = true;
            if (cBest.partner) cBest.partner.dead = true;
            const rg2 = ring(Math.max(cBest.z, 0.02), g);
            const bx = g.cx + Math.cos(cBest.angle) * rg2.r, by = g.cy + Math.sin(cBest.angle) * rg2.r;
            spawnBolt(ex, ey, bx, by);
            burst(bx, by, '#d8b4ff', 18, 3.5);
            burst(bx, by, '#ffffff', 10, 4);
            const cb = cBest.type === 'heavy' ? 250 : cBest.type === 'line' ? 300 : cBest.lock !== undefined ? 150 : 100;
            const cpts = Math.round(cb * 0.5 * mutMul());
            score += cpts; zaps++;
            popup(bx, by, 'CHAIN +' + cpts, '#d8b4ff');
            spawnKillStreak(cBest.angle, cBest.z);
            tone(1976, 0.1, 'triangle', 0.08, 2960);
          }
        }
        if (en.type === 'heavy') burst(ex, ey, '#d465ff', 16, 5.5); // armor plates fly
        if (en.type === 'line' && en.partner) { // the wall snaps
          const p3 = ringXY(en.partner.angle);
          for (let k2 = 1; k2 < 4; k2++) burst(lerp(ex, p3.x, k2 / 4), lerp(ey, p3.y, k2 / 4), '#ff8ba0', 6, 3);
        }
        if (en.lock !== undefined) burst(ex, ey, en.lock === 0 ? '#4d9bff' : '#eef6ff', 14, 4.5);
        // no hit-stop, no screen shake on routine kills — the streak, rim
        // flash and haptics carry it
        spawnKillStreak(en.angle, en.z);
        lastKillBeat(en);
        popup(ex, ey, (perfect ? 'PERFECT +' : '+') + pts + (combo >= 3 ? '  x' + Math.min(combo, 5) : ''), perfect ? '#ffe9b0' : '#bfeaff');
        // no screen shake on a clean kill — the rim flash + haptics carry it;
        // the tunnel only twitches when something goes WRONG
        sfx.zap(combo, Math.cos(en.angle) * 0.7);
        if (en.type === 'heavy') tone(110, 0.2, 'square', 0.13, 60); // armor thump
        if (en.lock !== undefined) tone(1568, 0.12, 'triangle', 0.09, 1976); // key chime
        if (perfect) sfx.perfect();
        buzz(en.type === 'normal' ? 18 : 30);
      } else {
        en.resolved = true; // slips past the ring and flies by the player
        if (en.partner) en.partner.resolved = true; // the pair fails as one
        if (en.tut) {
          if (tut) { tut.retry = en.tut; tut.t = 0; } // practice trap: no penalty, try again
        } else {
          misses++; combo = 0; comboHeal = 0;
          if (!shieldAbsorb(ex, ey, en.angle)) {
            integrity = Math.max(0, integrity - 25); // 4 mistakes = corrupted payload
            burst(ex, ey, '#ff4a5e', 20, 3);
            popup(ex, ey, 'DATA STOLEN', '#ff4a5e');
            redFlash = 1; shake = Math.min(shake + 0.6, 1);
            rimFX.push({ a: en.angle, t: 0.55, col: '255,74,94' });
            sfx.miss(Math.cos(en.angle) * 0.7);
            buzz([40, 40, 60]);
          }
        }
      }
    }
  }
  stripSound(stripProg >= 0, stripProg); // the trace drone lives and dies here

  // free-run surges: every 100s the stream steps up (capped) — and it never
  // arrives unannounced: "SPEEDING UP IN 4..3..2..1", then the surge
  if (endless && !boss) {
    const surge = Math.floor(levelT / 100);
    const toNext = (surge + 1) * 100 - levelT;
    if (surge < 6 && toNext <= 4.2) {
      const cnt = Math.ceil(toNext);
      if (cnt !== surgeCount) { surgeCount = cnt; sfx.count(); } // HUD draws the big digits
    }
    if (surge !== surgeLevel) {
      surgeLevel = surge; surgeCount = -1;
      if (surge > 0 && surge <= 6) {
        popup(W / 2, H * 0.26, 'STREAM SURGE' + (surge === 6 ? ' — MAX' : ''), '#ff9a3c');
        surgeWaveZ = SPAWN_Z; // the surge rides in from the deep
        sfx.speedUp();
        buzz(20);
      }
    }
  }
  // the surge wavefront races from the horizon to the rim
  if (surgeWaveZ > 0) {
    surgeWaveZ -= dt * (SPAWN_Z - g.hitZ) / 0.9;
    if (surgeWaveZ <= g.hitZ) {
      surgeWaveZ = -1;
      shake = Math.min(shake + 0.45, 1); // it slams past the ring
    }
  }

  // pulse waves sweep down the tunnel, molecularizing every trap they pass
  for (const wv of pulseWaves) {
    wv.z += dt * 1.6;
    for (const en of enemies) {
      // never purge payloads or the golden bonus ribbon — the wave that the
      // ribbon itself charged shouldn't eat the next one
      if (en.dead || en.resolved || en.type === 'frag' || en.type === 'strip') continue;
      if (en.z <= wv.z) {
        en.dead = true;
        if (en.partner) en.partner.dead = true;
        const rg2 = ring(Math.max(en.z, 0.02), g);
        const px2 = rg2.x + Math.cos(en.angle) * rg2.r, py2 = rg2.y + Math.sin(en.angle) * rg2.r;
        // to molecules: a dense three-layer disintegration
        const eCol = en.type === 'heavy' ? '#d465ff' : en.lock === 0 ? '#4d9bff'
          : en.lock === 1 ? '#eef6ff' : '#ff8ba0';
        burst(px2, py2, eCol, 26, 5.5);
        burst(px2, py2, `rgb(${wv.col})`, 20, 4);
        burst(px2, py2, '#ffffff', 14, 6.5);
        rimFX.push({ a: en.angle, t: 0.4, col: wv.col });
        spawnKillStreak(en.angle, en.z);
        wv.kills++;
        score += Math.round(60 * mutMul()); // flat bounty — no combo, no zap credit
      }
    }
    if (wv.z > SPAWN_Z && wv.kills) popup(W / 2, H * 0.4, 'PULSE PURGE ×' + wv.kills, '#8fe0ff');
  }
  pulseWaves = pulseWaves.filter(wv => wv.z <= SPAWN_Z);
  enemies = enemies.filter(e => !e.dead && (e.type === 'strip' || e.z > 0.03)); // strip heads outlive z=0 while the tail crosses
  for (const fx2 of rimFX) fx2.t -= dt;
  rimFX = rimFX.filter(fx2 => fx2.t > 0);
  for (const n of nodes) n.recoil = Math.max(0, (n.recoil || 0) - dt * 4);

  // power-up orbs ride the stream; catching one at the ring arms its effect
  for (const p of pickups) {
    p.z -= L.speed * 0.9 * sdt;
    p.spin += dt * 2;
    p.age = (p.age || 0) + sdt;
    if (!p.done && p.z <= g.hitZ) {
      p.done = true;
      if (p.tut && tut && !(covers(nodes[0], p.angle) || covers(nodes[1], p.angle))) {
        tut.retry = 'pickup'; tut.t = 0; // missed the practice relay — again
      }
      if (covers(nodes[0], p.angle) || covers(nodes[1], p.angle)) {
        p.dead = true;
        const { x, y } = ringXY(p.angle);
        if (p.kind === 'shield') {
          shieldCharge = 1;
          sfx.shieldUp();
        } else if (p.kind === 'inject') { // both purge orbs snap to ready
          pulseCharge = [PULSE_MAX, PULSE_MAX];
          sfx.heal();
        } else {
          fx[p.kind] = PICKUPS[p.kind].dur;
          sfx.pick();
        }
        burst(x, y, '#ffd24a', 24, 4);
        popup(x, y, PICKUPS[p.kind].label, '#ffd24a');
        buzz(15);
      }
    }
  }
  pickups = pickups.filter(p => !p.dead && p.z > 0.03);

  // the firewall core duel
  if (boss) {
    updateBossFight(dt, g);
    if (!boss || state !== S.PLAY) return; // victory mid-update
  }

  if (integrity <= 0) { endLevel(false); return; }
  if (!tut && !endless && levelT >= L.duration) {
    if (L.boss) { if (!boss) spawnBoss(); }
    else if (enemies.length === 0) endLevel(true);
  }
}

// ---------- drawing ----------

// the wall lattice: longitudinal seams + depth hoops that stream at EXACTLY
// the traffic speed. leaks sit in its cells and ride its hoops — structural
// proof that they are holes in a surface, not sprites in the bore
const SEAMS = 14, SEAM_OFF = 0.12, HOOP_SPACING = 0.28;
function drawLattice(g) {
  if (state === S.MENU) return;
  ctx.save();
  ctx.lineCap = 'butt';
  const rFar = ring(SPAWN_Z, g).r, rNear = ring(Math.max(0.02, g.hitZ * 0.4), g).r;
  for (let i = 0; i < SEAMS; i++) {
    const a = i / SEAMS * TAU + SEAM_OFF;
    const fx2 = g.cx + Math.cos(a) * rFar, fy2 = g.cy + Math.sin(a) * rFar;
    const nx2 = g.cx + Math.cos(a) * rNear, ny2 = g.cy + Math.sin(a) * rNear;
    const grd = ctx.createLinearGradient(fx2, fy2, nx2, ny2);
    grd.addColorStop(0, 'rgba(90,170,235,0)');
    grd.addColorStop(0.3, 'rgba(90,170,235,0.26)');
    grd.addColorStop(1, 'rgba(90,170,235,0.08)');
    ctx.strokeStyle = grd;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(fx2, fy2); ctx.lineTo(nx2, ny2); ctx.stroke();
  }
  // hoops riding toward the viewer in lockstep with the traffic
  const off = ((wallDist % HOOP_SPACING) + HOOP_SPACING) % HOOP_SPACING;
  for (let z = SPAWN_Z - off; z > g.hitZ * 0.4; z -= HOOP_SPACING) {
    const rr = ring(z, g);
    const a = clamp((SPAWN_Z - 0.05 - z) / 0.4, 0, 1) * 0.26;
    ctx.strokeStyle = `rgba(120,200,255,${a.toFixed(2)})`;
    ctx.lineWidth = Math.max(0.8, rr.r / g.nodeR * 1.5);
    ctx.beginPath(); ctx.arc(g.cx, g.cy, rr.r, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

// range rings: a projected instrument, not wall geometry — three dashed
// hairlines marking 1s / 2s / 3s from the rim at the CURRENT traffic speed.
// On wave levels they breathe apart and together as the stream surges.
// shared gate for the per-enemy depth instrumentation (rings + countdown tags)
// 0→1 as a hostile closes its last ~1.5s to the rim; 1 inside the zap zone.
// The body itself carries the urgency — LED, glow, sparks all key off this.
function urgency(en, g) {
  if (en.resolved || en.failed || en.type === 'frag' || en.type === 'strip') return 0;
  if (en.z <= g.hitZ) return 1;
  const spd = trafficSpeed * (en.speedMul || 1);
  if (spd <= 0) return 0;
  return clamp(1 - (en.z - g.hitZ) / spd / 1.5, 0, 1);
}

function rangeInfo(en, g) {
  if (en.dead || en.resolved || en.failed || en.type === 'frag') return null; // payloads stay calm
  if (en.z <= g.hitZ) return null; // already in the zone — the body itself is the alarm
  const spd = trafficSpeed * (en.speedMul || 1);
  if (spd <= 0) return null;
  const t = (en.z - g.hitZ) / spd;
  // fade in from the horizon like the body, sharpen as arrival closes in
  let al = clamp((SPAWN_Z - 0.05 - en.z) / 0.3, 0, 1) * clamp(1.15 - t * 0.22, 0.3, 1);
  if (t < 1) al *= 0.8 + 0.2 * Math.sin(time * 12); // last second: urgent flicker
  if (al <= 0.02) return null;
  const glow = en.type === 'strip' ? '255,210,74' // golden bonus, not a threat
    : en.type === 'heavy' ? '200,70,255'
    : en.lock === 0 ? '80,170,255'
    : en.lock === 1 ? '225,240,255'
    : '255,60,90';
  return { t, al, glow, rr: ring(en.z, g) };
}

// the surge announcement made visible: an amber wavefront rolling OUT of the
// deep toward the player, wake trailing behind it (deeper z)
function drawSurgeWave(g) {
  if (surgeWaveZ <= 0 || state !== S.PLAY) return;
  const rg = ring(surgeWaveZ, g);
  ctx.save();
  ctx.lineCap = 'round';
  for (let k = 4; k >= 1; k--) { // wake, deeper than the front
    const zw = surgeWaveZ + k * 0.09;
    if (zw >= SPAWN_Z) continue;
    const wr = ring(zw, g);
    ctx.strokeStyle = `rgba(255,154,60,${(0.25 * (1 - k / 5)).toFixed(2)})`;
    ctx.lineWidth = Math.max(1.5, 9 * wr.s * 3 * (1 - k / 6));
    ctx.beginPath(); ctx.arc(g.cx, g.cy, wr.r, 0, TAU); ctx.stroke();
  }
  for (const [w2, col] of [
    [18, 'rgba(255,154,60,0.30)'],
    [7, 'rgba(255,180,80,0.65)'],
    [2.5, 'rgba(255,240,210,0.95)']
  ]) {
    ctx.lineWidth = Math.max(1, w2 * rg.s * 3);
    ctx.strokeStyle = col;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, rg.r, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawRangeRings(g) {
  // each hostile projects a depth line onto the tunnel at its front edge —
  // brightest at the body, fading as it wraps around the bore
  if (state !== S.PLAY && state !== S.PAUSE && state !== S.INFO) return;
  if (boss && boss.mergeT >= 1) return; // the duel has its own instrumentation
  ctx.save();
  ctx.lineCap = 'butt';
  for (const en of enemies) {
    const ri = rangeInfo(en, g);
    if (!ri) continue;
    const mul = en.sizeMul || 1;
    const rr = ring(Math.max(en.z - 0.055 * mul, 0.02), g).r;
    const a0 = en.type === 'strip' ? stripAngle(en, 0) : en.angle;
    ctx.lineWidth = Math.max(1.1, rr / g.nodeR * 2.1);
    const segs = 16, span = Math.PI;
    for (let s2 = 0; s2 < segs; s2++) {
      const f0 = s2 / segs, f1 = (s2 + 1) / segs;
      const al = ri.al * 0.8 * Math.pow(1 - f0, 1.35);
      if (al <= 0.012) break;
      ctx.strokeStyle = `rgba(${ri.glow},${al.toFixed(2)})`;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, rr, a0 + f0 * span, a0 + f1 * span); ctx.stroke();
      ctx.beginPath(); ctx.arc(g.cx, g.cy, rr, a0 - f1 * span, a0 - f0 * span); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawTunnel(g) {
  // the wall is one dense annulus of data, stamped at receding depths —
  // the inside of a fiber optic line packed with traffic, not clean geometry
  const N = 10;
  for (let i = N - 1; i >= 0; i--) {
    const z = (((i - tunnelScroll) % N) + N) % N / N;
    const rg = ring(z, g);
    const hs = rg.r / 0.75; // texture band mid-radius maps onto this depth's wall radius
    if (hs < 5) continue;
    const a = (1 - z) * 0.85 + 0.08;
    ctx.save();
    ctx.translate(rg.x, rg.y);
    ctx.rotate(i * 0.55); // each depth band has its own FIXED twist — a spinning wall would shear under the leaks
    ctx.globalAlpha = a;
    if (wallTex) ctx.drawImage(wallTex, -hs, -hs, hs * 2, hs * 2);
    ctx.restore();
    // the nearest band keeps sliding past the viewer and fades — no pop at the wrap
    if (z > 0.85 && wallTex) {
      const z2 = z - 1;
      const rg2 = ring(z2, g);
      const hs2 = rg2.r / 0.75;
      const a2 = clamp(1 + z2 / 0.15, 0, 1) * 0.9;
      if (a2 > 0.01) {
        ctx.save();
        ctx.translate(rg2.x, rg2.y);
        ctx.rotate(i * 0.55);
        ctx.globalAlpha = a2;
        ctx.drawImage(wallTex, -hs2, -hs2, hs2 * 2, hs2 * 2);
        ctx.restore();
      }
    }
  }
  ctx.globalAlpha = 1;
  // vanish point glow
  // warm-white vanish point — the golden river converges into it
  const far = ring(1, g);
  const grad = ctx.createRadialGradient(far.x, far.y, 0, far.x, far.y, far.r * 4.5);
  grad.addColorStop(0, 'rgba(255,244,220,0.6)');
  grad.addColorStop(0.35, 'rgba(255,200,110,0.16)');
  grad.addColorStop(0.7, 'rgba(90,160,255,0.07)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(far.x - far.r * 4.5, far.y - far.r * 4.5, far.r * 9, far.r * 9);
}

// streaming gold data particles (the "payload" river at tunnel bottom)
let streaks = [];
function initStreaks() {
  streaks = [];
  const nGold = lowFX ? 90 : 190, nAmbient = lowFX ? 50 : 110;
  for (let i = 0; i < nGold; i++) {
    streaks.push({
      z: Math.random(),
      a: Math.PI / 2 + rand(-0.55, 0.55),          // biased to bottom
      gold: true, sp: rand(0.92, 1.12), ord: i / nGold // draw order — the river thins with integrity
    });
  }
  for (let i = 0; i < nAmbient; i++) {
    streaks.push({ z: Math.random(), a: Math.random() * TAU, gold: false, amber: Math.random() < 0.22, sp: rand(0.88, 1.08) });
  }
}
initStreaks();
function drawStreaks(g, dt) {
  // a wounded payload is a thinner, dimmer river
  const riverK = state === S.PLAY ? 0.35 + 0.65 * clamp(integrity / 100, 0, 1) : 1;
  for (const st of streaks) {
    const wsp = 1 + (warpT / 0.9) * 5; // warp-dive stretch
    st.z -= dt * (state === S.PLAY ? trafficSpeed : 0.4) * st.sp * wsp; // the river flows WITH the traffic
    if (st.z <= -0.08) { st.z = 1; if (st.gold) st.a = Math.PI / 2 + rand(-0.55, 0.55); }
    if (st.gold && st.ord > riverK) continue;
    const r1 = ring(st.z, g), r2 = ring(Math.min(st.z + (st.gold ? 0.05 : 0.09) * (1 + (warpT / 0.9) * 3), 1), g);
    const rr1 = st.gold ? r1.r * rand(0.86, 0.99) : r1.r * 0.97;
    const x1 = r1.x + Math.cos(st.a) * rr1, y1 = r1.y + Math.sin(st.a) * rr1;
    const x2 = r2.x + Math.cos(st.a) * r2.r * 0.95, y2 = r2.y + Math.sin(st.a) * r2.r * 0.95;
    const al = Math.min(1 - st.z, 1.05) * (st.gold ? 0.75 : 0.3) * clamp(1 + st.z / 0.1, 0, 1);
    ctx.strokeStyle = st.gold ? `rgba(255,196,88,${al.toFixed(2)})`
      : st.amber ? `rgba(255,185,90,${al.toFixed(2)})` : `rgba(140,215,255,${al.toFixed(2)})`;
    ctx.lineWidth = st.gold ? lerp(0.5, 2.6, 1 - st.z) : 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // hot core on the nearest gold particles
    if (st.gold && st.z < 0.35) {
      ctx.strokeStyle = `rgba(255,238,190,${(al * 0.7).toFixed(2)})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }
}

// ---------- enemy bodies: GLITCH, painted ON the wall ----------
// decals live in (angle x depth) space and project as annular arcs around the
// tunnel axis, so they foreshorten with the bore — genuinely attached to the
// wall, not billboards hovering in it.
function wallPatch(g, a, halfA, z0, z1, col, alpha) {
  const r0 = ring(Math.max(Math.min(z0, z1), 0.02), g).r; // nearer edge (bigger radius)
  const r1 = ring(Math.max(Math.max(z0, z1), 0.02), g).r;
  const rm = (r0 + r1) / 2;
  if (rm < 3) return;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col;
  ctx.lineCap = 'butt';
  ctx.lineWidth = Math.max(0.7, r0 - r1);
  ctx.beginPath(); ctx.arc(g.cx, g.cy, rm, a - halfA, a + halfA); ctx.stroke();
}
function drawNailBreach(en, g, fade, PAL) {
  const rg = ring(Math.max(en.z, 0.02), g);
  const x = rg.x + Math.cos(en.angle) * rg.r, y = rg.y + Math.sin(en.angle) * rg.r;
  const wallW = clamp(rg.r / g.nodeR, 0.06, 2);
  const mul = en.sizeMul || 1;
  const S = Math.min(W, H) * 0.05 * wallW * mul;      // nail scale, wall-foreshortened
  const seed = en.spin * 13.7;
  const lockKind = en.lock !== undefined, heavy = en.type === 'heavy';
  // into-the-bore direction (toward the axis) and the wall tangent
  const ux = (g.cx - x) / (rg.r || 1), uy = (g.cy - y) / (rg.r || 1);
  const tx2 = -uy, ty2 = ux;
  const tanA = Math.atan2(ty2, tx2);

  // impact cracks in the wall around the puncture (locks are clean punches)
  if (!lockKind && wallW > 0.12) {
    ctx.lineCap = 'round';
    for (let c = 0; c < (heavy ? 4 : 2); c++) {
      const h1 = Math.sin(seed * 7 + c * 5.13);
      const dirA = h1 > 0 ? 1 : -1;
      const flick = 0.5 + 0.4 * Math.sin(time * (4 + c) + seed + c * 2.1);
      ctx.strokeStyle = `rgba(${PAL.glow},${(fade * 0.45 * flick).toFixed(2)})`;
      ctx.lineWidth = Math.max(0.8, wallW * 1.8);
      ctx.beginPath();
      let a = en.angle + dirA * 0.02, z = en.z + Math.sin(seed * 11 + c * 3.7) * 0.02;
      let started = false;
      for (let sN = 0; sN <= 2; sN++) {
        const rr = ring(Math.max(z, 0.02), g).r;
        const px2 = g.cx + Math.cos(a) * rr, py2 = g.cy + Math.sin(a) * rr;
        started ? ctx.lineTo(px2, py2) : ctx.moveTo(px2, py2);
        started = true;
        a += dirA * (0.028 + 0.015 * Math.sin(seed * 3 + c * 7 + sN * 4.2));
        z += 0.016 * Math.sin(seed * 5 + c * 9 + sN * 2.6);
      }
      ctx.stroke();
    }
  }

  // scorched puncture where it punched through
  wallPatch(g, en.angle, 0.030 * mul, en.z - 0.02 * mul, en.z + 0.02 * mul, '#05060f', fade * 0.8);

  // breach ripple: an impact ring expanding across the wall surface —
  // squashed to the wall's local foreshortening so it lies ON the surface
  const urg = urgency(en, g); // 0→1 over the last ~1.5s — everything below leans on it
  const rip = (time * (0.8 + urg * 1.3) + seed) % 1;
  ctx.strokeStyle = `rgba(${PAL.glow},${(fade * (0.5 + urg * 0.3) * (1 - rip)).toFixed(2)})`;
  ctx.lineWidth = Math.max(1, S * 0.1);
  ctx.beginPath();
  ctx.ellipse(x, y, S * (0.7 + rip * 1.8), S * (0.7 + rip * 1.8) * 0.36, tanA, 0, TAU);
  ctx.stroke();

  // grounding pass: contact shadow + the tap's light bleeding into the wall —
  // the transition between hardware and surface goes soft and organic
  wallPatch(g, en.angle, 0.06 * mul, en.z - 0.045 * mul, en.z + 0.045 * mul, '#000208', fade * 0.35);
  ctx.globalCompositeOperation = 'lighter';
  wallPatch(g, en.angle, 0.10 * mul, en.z - 0.075 * mul, en.z + 0.075 * mul, `rgba(${PAL.glow},0.5)`, fade * 0.13);
  ctx.globalCompositeOperation = 'source-over';

  // hex port plate — machined tap hardware bolted flush to the wall
  const hexR = S * 0.72;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tanA);
  ctx.scale(1, 0.36); // squash to the wall's local foreshortening
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const ha = i / 6 * TAU + Math.PI / 6;
    i ? ctx.lineTo(Math.cos(ha) * hexR, Math.sin(ha) * hexR) : ctx.moveTo(Math.cos(ha) * hexR, Math.sin(ha) * hexR);
  }
  ctx.closePath();
  const plate = ctx.createLinearGradient(-hexR, 0, hexR, 0);
  plate.addColorStop(0, '#1a2334');
  plate.addColorStop(0.5, '#0a0e1a');
  plate.addColorStop(1, '#141b2b');
  ctx.globalAlpha = fade * 0.88; // a ghost of the wall texture stays visible through the plate
  ctx.fillStyle = plate; ctx.fill();
  ctx.globalAlpha = fade;
  ctx.strokeStyle = `rgba(${PAL.glow},0.9)`;
  ctx.lineWidth = Math.max(1, S * 0.09);
  ctx.stroke();
  // fastener points on alternating corners
  ctx.fillStyle = 'rgba(190,215,240,0.75)';
  for (let i = 0; i < 3; i++) {
    const ha = i / 3 * TAU + Math.PI / 6;
    ctx.beginPath(); ctx.arc(Math.cos(ha) * hexR * 0.72, Math.sin(ha) * hexR * 0.72, Math.max(0.7, S * 0.07), 0, TAU); ctx.fill();
  }
  if (lockKind || heavy) { // outer machined ring on keyed/armored taps
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ha = i / 6 * TAU + Math.PI / 6;
      i ? ctx.lineTo(Math.cos(ha) * hexR * 1.32, Math.sin(ha) * hexR * 1.32) : ctx.moveTo(Math.cos(ha) * hexR * 1.32, Math.sin(ha) * hexR * 1.32);
    }
    ctx.closePath();
    ctx.strokeStyle = PAL.lights[0];
    ctx.lineWidth = Math.max(0.7, S * 0.05);
    ctx.globalAlpha = fade * (0.5 + 0.3 * Math.sin(time * 4 + seed));
    ctx.stroke();
    ctx.globalAlpha = fade;
  }
  ctx.restore();

  // the wall's own hoops run OVER the plate's edges — the hardware sits IN the
  // surface, and the surface keeps going
  ctx.globalAlpha = fade * 0.3;
  ctx.strokeStyle = 'rgba(120,200,255,0.9)';
  ctx.lineWidth = Math.max(0.6, wallW * 1.2);
  for (const dz2 of [-0.028, 0.028]) {
    const rr3 = ring(Math.max(en.z + dz2 * mul, 0.02), g).r;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, rr3, en.angle - 0.045 * mul, en.angle + 0.045 * mul); ctx.stroke();
  }
  ctx.globalAlpha = fade;

  // probe needle: a slim tap driven through toward the payload stream
  const L2 = S * (heavy ? 1.7 : 1.35);
  const nw = S * 0.14;
  const tipX = x + ux * L2, tipY = y + uy * L2;
  ctx.beginPath(); // dark shaft
  ctx.moveTo(x + tx2 * nw, y + ty2 * nw);
  ctx.lineTo(tipX, tipY);
  ctx.lineTo(x - tx2 * nw, y - ty2 * nw);
  ctx.closePath();
  ctx.fillStyle = '#141b2b'; ctx.fill();
  ctx.strokeStyle = 'rgba(170,195,225,0.55)';
  ctx.lineWidth = Math.max(0.6, S * 0.045);
  ctx.stroke();
  // specular edge on one flank
  ctx.strokeStyle = 'rgba(220,238,255,0.65)';
  ctx.lineWidth = Math.max(0.5, S * 0.04);
  ctx.beginPath(); ctx.moveTo(x + tx2 * nw * 0.7, y + ty2 * nw * 0.7); ctx.lineTo(tipX, tipY); ctx.stroke();
  // light guide up the shaft: the siphon, running base-ward (data flowing OUT)
  ctx.strokeStyle = `rgba(${PAL.glow},0.95)`;
  ctx.lineWidth = Math.max(0.8, S * 0.07);
  ctx.setLineDash([S * 0.22, S * 0.16]);
  ctx.lineDashOffset = time * S * 2.2; // flow from tip toward the plate
  ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(x, y); ctx.stroke();
  ctx.setLineDash([]);
  // status LED on the plate — comm blink, unique per tap; panic-flashes as it
  // closes on the rim so the nearest threat is always the loudest one
  const blink = Math.sin(time * (7 + urg * 14) + seed) > (lockKind ? 0.2 : 0.55) - urg * 0.5;
  if (blink) {
    ctx.fillStyle = urg > 0.6 ? '#ffffff' : PAL.lights[0];
    ctx.beginPath(); ctx.arc(x - ux * S * 0.34, y - uy * S * 0.34, Math.max(0.8, S * 0.09) * (1 + urg * 0.7), 0, TAU); ctx.fill();
  }
  // tip: a fine hot point, not a bloom
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(tipX, tipY, Math.max(0.7, S * 0.09), 0, TAU); ctx.fill();
  ctx.strokeStyle = `rgba(${PAL.glow},0.55)`;
  ctx.lineWidth = Math.max(0.5, S * 0.05);
  ctx.beginPath(); ctx.arc(tipX, tipY, Math.max(1.2, S * 0.17), 0, TAU); ctx.stroke();

  // breach particles: type-colored sparks spraying off the impact — the spray
  // thickens as arrival closes in
  if (!lowFX && en.z < 1.6 && Math.random() < (0.3 + urg * 0.45) * fade) {
    particles.push({
      x: x + tx2 * rand(-1, 1) * S * 0.7, y: y + ty2 * rand(-1, 1) * S * 0.7,
      vx: ux * rand(0.3, 1) + tx2 * rand(-0.6, 0.6), vy: uy * rand(0.3, 1) + ty2 * rand(-0.6, 0.6),
      life: 0.35, decay: 2.8, color: `rgb(${PAL.glow})`, size: rand(0.6, 1.2) * Math.max(0.5, wallW)
    });
  }
  // gold payload specks being siphoned into the puncture
  if (!lowFX && en.z < 1.5 && Math.random() < 0.35 * fade) {
    const sa = en.angle + rand(-1, 1) * 0.14;
    const sz = en.z + rand(-0.08, 0.08);
    const rr2 = ring(Math.max(sz, 0.02), g).r;
    const sx = g.cx + Math.cos(sa) * rr2, sy = g.cy + Math.sin(sa) * rr2;
    particles.push({ x: sx, y: sy, vx: (x - sx) * 0.09, vy: (y - sy) * 0.09,
      life: 0.4, decay: 2.6, color: '#ffd24a', size: rand(0.6, 1.3) * wallW * 1.6 });
  }
  ctx.globalAlpha = fade;
}
// the data stream ribbon: a luminous curved band on the wall. the hot marker is
// where it crosses the ring — that point must stay covered head to tail
function drawStrip(en, g, fade) {
  const segs = 16;
  const dim = en.failed ? 0.28 : 1;
  // GOLDEN bonus ribbon; while a node rides it, it takes that node's color
  const gN = en.failed ? 0 : (en.traceGlow || 0) * 0.85;
  const nc = en.traceNode === 1 ? [255, 255, 255] : [111, 227, 255];
  const mix = (r0, g0, b0) =>
    `rgba(${Math.round(lerp(r0, nc[0], gN))},${Math.round(lerp(g0, nc[1], gN))},${Math.round(lerp(b0, nc[2], gN))},1)`;
  const cBase = mix(255, 180, 40), cHi = mix(255, 235, 170);
  for (let s2 = 0; s2 < segs; s2++) {
    const k0 = s2 / segs * en.len, k1 = (s2 + 1) / segs * en.len;
    const z0 = en.z + k0, z1 = en.z + k1;
    if (z1 <= g.hitZ * 0.55 || z0 >= SPAWN_Z - 0.03) continue;
    const aMid = stripAngle(en, (k0 + k1) / 2);
    const flow = 0.5 + 0.4 * Math.sin(time * 9 - s2 * 0.9);
    wallPatch(g, aMid, 0.055, z0, z1 + 0.005, cBase, fade * 0.7 * dim);
    wallPatch(g, aMid, 0.021, z0, z1 + 0.005, cHi, fade * flow * dim);
  }
  // trace marker at the ring crossing
  if (!en.failed && en.z <= g.hitZ && en.z + en.len >= g.hitZ) {
    const aReq = stripAngle(en, g.hitZ - en.z);
    const px2 = g.cx + Math.cos(aReq) * g.nodeR, py2 = g.cy + Math.sin(aReq) * g.nodeR;
    const mr = Math.min(W, H) * 0.032;
    ctx.globalAlpha = 1;
    const tg = ctx.createRadialGradient(px2, py2, 0, px2, py2, mr);
    tg.addColorStop(0, en.tracing ? 'rgba(255,255,255,0.95)' : 'rgba(255,225,150,0.85)');
    tg.addColorStop(1, 'rgba(255,180,40,0)');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(px2, py2, mr, 0, TAU); ctx.fill();
    ctx.strokeStyle = en.tracing ? 'rgba(255,255,255,0.9)' : 'rgba(255,210,110,0.75)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px2, py2, mr * 0.45 * (1 + Math.sin(time * 8) * 0.15), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = fade;
}

// birth fade: everything materializes over its first ~0.35s (alpha 0→1 plus a
// touch of scale) so nothing ever POPS into existence — deep horizon spawns
// and early-clamped mid-bore drops alike emerge from the glow. Draw-only:
// zero effect on hitboxes or timing.
const birthFade = o => clamp((o.age || 0) / 0.35, 0, 1);
function drawEnemy(en, g) {
  const rg = ring(Math.max(en.z, 0.02), g);
  const x = rg.x + Math.cos(en.angle) * rg.r;
  const y = rg.y + Math.sin(en.angle) * rg.r;
  const birth = birthFade(en);
  // size tracks the WALL geometry (rg.r/nodeR), not raw z — bodies scale in
  // lockstep with the ring they sit on, so they read as glued to the tunnel
  let size = Math.min(W, H) * 0.06 * clamp(rg.r / g.nodeR, 0.1, 2) * (en.sizeMul || 1) * (0.85 + 0.15 * birth);
  const near = 1 - en.z;
  // missed traps balloon past the ring and dissolve; fresh ones fade in from the deep
  let fade = en.resolved ? clamp(en.z / g.hitZ, 0, 1) : 1;
  fade *= clamp((SPAWN_Z - 0.05 - en.z) / 0.3, 0, 1); // smooth entrance at the horizon
  fade *= birth;
  if (fade <= 0.005) return;
  if (en.resolved) size *= 1 + (1 - clamp(en.z / g.hitZ, 0, 1)) * 1.6;
  // per-type palettes — the color IS the gameplay language: red = any node,
  // blue/white = matching node, purple = both nodes, orange = it moves
  const PAL = en.type === 'frag'
    ? { glow: '90,110,140',
        shades: ['#2b3242', '#151a26', '#3a4354', '#0d1119', '#232a38'],
        lights: ['#4a5568', '#5a6a80', '#3a4354'] }
    : en.type === 'heavy'
    ? { glow: '200,70,255',
        shades: ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8', '#c44af0'],
        lights: ['#eab8ff', '#f3d4ff', '#d98cff'] }
    : en.lock === 0
    ? { glow: '80,170,255',
        shades: ['#2f7fe0', '#1c4fae', '#4d9bff', '#12398a', '#3f8af0'],
        lights: ['#a8ccff', '#d0e4ff', '#7db2ff'] }
    : en.lock === 1
    ? { glow: '225,240,255',
        shades: ['#c8d6e6', '#9fb2c8', '#e8f2fc', '#8194ab', '#d5e2f0'],
        lights: ['#ffffff', '#eef6ff', '#dbe8f6'] }
    : { glow: '255,60,90',
        shades: ['#e8274b', '#ff5a3c', '#d81f6e', '#b3123a', '#ff8c5a'],
        lights: ['#ff9db0', '#ffc9d4', '#ff8ba0'] };

  ctx.save();
  ctx.globalAlpha = fade;

  if (en.type === 'strip') { // ribbons draw themselves entirely on the wall
    drawStrip(en, g, fade);
    ctx.restore();
    return;
  }

  const spr = SPRITES[en.lock === 0 ? 'lock0' : en.lock === 1 ? 'lock1' : en.type];

  // hot glow at the wall point — except payload packets, which swallow light.
  // the glow breathes harder as arrival closes in: near threats burn brightest
  const urg = urgency(en, g);
  const pulse = 1 + Math.sin(en.spin * 2) * 0.08 + urg * 0.1 * Math.sin(time * 10);
  const gl = ctx.createRadialGradient(x, y, 0, x, y, size * 2.4 * pulse);
  if (en.type === 'frag') {
    gl.addColorStop(0, 'rgba(1,2,8,0.75)');
    gl.addColorStop(0.55, 'rgba(2,4,12,0.35)');
    gl.addColorStop(1, 'rgba(4,6,16,0)');
  } else {
    gl.addColorStop(0, `rgba(${PAL.glow},${(0.5 + urg * 0.3).toFixed(2)})`);
    gl.addColorStop(0.5, `rgba(${PAL.glow},${(0.16 + urg * 0.12).toFixed(2)})`);
    gl.addColorStop(1, `rgba(${PAL.glow},0)`);
  }
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, y, size * 2.4 * pulse, 0, TAU); ctx.fill();

  if (spr) {
    // sprite skin replaces the procedural body (glow + sigils stay live)
    ctx.drawImage(spr, x - size * 1.7, y - size * 1.7, size * 3.4, size * 3.4);
  } else if (en.type === 'frag') {
    // payload packet: a void-black rounded diamond FLOATING in the bore — the
    // payload rides the stream; only corruption clings to the walls
    ctx.save();
    ctx.translate(x, y);
    const pr = size * (1 + Math.sin(en.spin * 2) * 0.06);
    ctx.rotate(en.spin * 0.3);
    const diamond = r => {
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(r * 0.55, -r * 0.55, r, 0);
      ctx.quadraticCurveTo(r * 0.55, r * 0.55, 0, r);
      ctx.quadraticCurveTo(-r * 0.55, r * 0.55, -r, 0);
      ctx.quadraticCurveTo(-r * 0.55, -r * 0.55, 0, -r);
      ctx.closePath();
    };
    // near-featureless black core, the faintest nebular sheen deep inside
    diamond(pr);
    const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, pr);
    fg.addColorStop(0, '#0a0c1a');
    fg.addColorStop(0.55, '#04050d');
    fg.addColorStop(1, '#010104');
    ctx.fillStyle = fg; ctx.fill();
    ctx.fillStyle = 'rgba(90,70,160,0.12)';
    ctx.beginPath(); ctx.ellipse(-pr * 0.25, -pr * 0.2, pr * 0.5, pr * 0.35, 0.6, 0, TAU); ctx.fill();
    // event-horizon rim: dim inner band under a hairline pale edge
    diamond(pr * 0.94);
    ctx.strokeStyle = 'rgba(70,85,120,0.5)'; ctx.lineWidth = Math.max(1.5, pr * 0.12); ctx.stroke();
    diamond(pr);
    ctx.strokeStyle = 'rgba(185,200,230,0.8)'; ctx.lineWidth = Math.max(0.8, pr * 0.045); ctx.stroke();
    // a slow glint crawling the rim — light caught on the edge
    const ga = en.spin * 0.9;
    const gr = pr * (1 - 0.22 * Math.pow(Math.sin(2 * ga), 2));
    const gx = Math.cos(ga) * gr, gy = Math.sin(ga) * gr;
    const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, pr * 0.3);
    gg.addColorStop(0, 'rgba(220,235,255,0.7)');
    gg.addColorStop(1, 'rgba(220,235,255,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(gx, gy, pr * 0.3, 0, TAU); ctx.fill();
    ctx.restore();
  } else {
    drawNailBreach(en, g, fade, PAL);
  }
  // warp-in flash as it drops out of the deep
  if (en.age < 0.3) {
    const wa = 1 - en.age / 0.3;
    ctx.strokeStyle = 'rgba(255,255,255,' + (wa * 0.8).toFixed(2) + ')';
    ctx.lineWidth = Math.max(1, size * 0.15 * wa);
    ctx.beginPath(); ctx.arc(x, y, size * (1.2 + (1 - wa) * 1.6), 0, TAU); ctx.stroke();
  }
  // heavy: dual-lock sigil — orbiting dots in the two node colors, telegraphing "both nodes"
  if (en.type === 'heavy' && near > 0.15) {
    const sa = clamp((near - 0.15) / 0.3, 0, 1) * fade;
    const oa = en.spin * 1.4, or2 = size * 1.08;
    ctx.globalAlpha = sa * 0.55;
    ctx.strokeStyle = 'rgba(230,245,255,0.9)'; ctx.lineWidth = Math.max(0.8, size * 0.05);
    ctx.beginPath(); ctx.arc(x, y, or2, 0, TAU); ctx.stroke();
    ctx.globalAlpha = sa;
    const ds = Math.max(1.5, size * 0.13);
    ctx.fillStyle = 'rgb(111,227,255)';
    ctx.beginPath(); ctx.arc(x + Math.cos(oa) * or2, y + Math.sin(oa) * or2, ds, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x + Math.cos(oa + Math.PI) * or2, y + Math.sin(oa + Math.PI) * or2, ds, 0, TAU); ctx.fill();
    ctx.globalAlpha = fade;
  }
  // color lock sigil — a single orbiting dot in the required node's color
  if (en.lock !== undefined && near > 0.15) {
    const sa = clamp((near - 0.15) / 0.3, 0, 1) * fade;
    const col = en.lock === 0 ? 'rgb(111,227,255)' : '#ffffff';
    ctx.globalAlpha = sa * 0.55;
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(0.8, size * 0.055);
    ctx.beginPath(); ctx.arc(x, y, size * 1.05, 0, TAU); ctx.stroke();
    ctx.globalAlpha = sa;
    const oa2 = en.spin * 1.4, ds2 = Math.max(1.5, size * 0.13);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x + Math.cos(oa2) * size * 1.05, y + Math.sin(oa2) * size * 1.05, ds2, 0, TAU); ctx.fill();
    ctx.globalAlpha = fade;
  }
  ctx.restore();
}

// arrival pings: a pulse on the rim where something is about to land
function drawArrivalPings(g) {
  if (state === S.MENU) return;
  const pr = g.nodeR + Math.min(W, H) * 0.055 * 0.9;
  const mark = (a, col, z) => {
    if (z <= g.hitZ) return;
    const p2 = clamp(1 - (z - g.hitZ) / 0.28, 0, 1);
    if (p2 <= 0) return;
    const al = p2 * (0.35 + 0.4 * (Math.sin(time * (6 + p2 * 10)) * 0.5 + 0.5));
    ctx.strokeStyle = 'rgba(' + col + ',' + al.toFixed(2) + ')';
    ctx.lineWidth = 3 + p2 * 2;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(g.cx, g.cy, pr, a - 0.09, a + 0.09); ctx.stroke();
  };
  for (const en of enemies) {
    if (en.dead || en.resolved) continue;
    const col = en.type === 'frag' ? '140,150,170'
      : en.type === 'heavy' ? '200,70,255'
      : en.lock === 0 ? '80,170,255'
      : en.lock === 1 ? '240,248,255'
      : '255,60,90';
    mark(en.angle, col, en.z);
  }
  for (const p of pickups) if (!p.done) mark(p.angle, '255,210,74', p.z);
}

// lightning arcs from node carriages to zapped traps — jagged, fast fade
function drawBolts() {
  for (const b of bolts) {
    const a = clamp(b.life / b.max, 0, 1);
    const dx = b.x2 - b.x1, dy = b.y2 - b.y1;
    const dl = Math.hypot(dx, dy) || 1;
    const nx = -dy / dl, ny = dx / dl;
    ctx.lineCap = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? 'rgba(140,215,255,' + (a * 0.85).toFixed(2) + ')' : 'rgba(255,255,255,' + a.toFixed(2) + ')';
      ctx.lineWidth = pass === 0 ? 4 : 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      const segs = 7;
      for (let i = 1; i < segs; i++) {
        const t = i / segs;
        const off = (Math.random() - 0.5) * 16 * a;
        ctx.lineTo(b.x1 + dx * t + nx * off, b.y1 + dy * t + ny * off);
      }
      ctx.lineTo(b.x2, b.y2);
      ctx.stroke();
    }
  }
}

// golden power-up orb with a kind-specific icon
function drawPickup(p, g) {
  const rg = ring(Math.max(p.z, 0.02), g);
  const x = rg.x + Math.cos(p.angle) * rg.r, y = rg.y + Math.sin(p.angle) * rg.r;
  const size = Math.min(W, H) * 0.042 * clamp(rg.r / g.nodeR, 0.12, 1.6);
  let fade = clamp((SPAWN_Z - 0.05 - p.z) / 0.3, 0, 1);
  fade *= birthFade(p); // materialize, never pop
  if (p.done) fade *= clamp(p.z / g.hitZ, 0, 1);
  if (fade <= 0.005) return;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(x, y);
  const pulse = 1 + Math.sin(time * 5 + p.spin) * 0.1;
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2.6 * pulse);
  gl.addColorStop(0, 'rgba(255,210,74,0.55)');
  gl.addColorStop(1, 'rgba(255,210,74,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 0, size * 2.6 * pulse, 0, TAU); ctx.fill();
  ctx.rotate(p.spin * 0.6);
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a2 = i / 6 * TAU;
    i ? ctx.lineTo(Math.cos(a2) * size, Math.sin(a2) * size) : ctx.moveTo(Math.cos(a2) * size, Math.sin(a2) * size);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(60,40,5,0.85)'; ctx.fill();
  ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = Math.max(1, size * 0.14); ctx.stroke();
  ctx.rotate(-p.spin * 0.6);
  ctx.strokeStyle = '#ffe9b0'; ctx.fillStyle = '#ffe9b0';
  ctx.lineWidth = Math.max(1, size * 0.12); ctx.lineCap = 'round';
  const s2 = size * 0.52;
  if (p.kind === 'shield') { // heater shield
    ctx.beginPath();
    ctx.moveTo(0, -s2);
    ctx.lineTo(s2 * 0.8, -s2 * 0.5); ctx.lineTo(s2 * 0.8, s2 * 0.15);
    ctx.quadraticCurveTo(s2 * 0.8, s2 * 0.7, 0, s2);
    ctx.quadraticCurveTo(-s2 * 0.8, s2 * 0.7, -s2 * 0.8, s2 * 0.15);
    ctx.lineTo(-s2 * 0.8, -s2 * 0.5);
    ctx.closePath(); ctx.stroke();
  } else if (p.kind === 'inject') { // charged orb, ready core
    ctx.beginPath(); ctx.arc(0, 0, s2 * 0.95, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s2 * 0.38, 0, TAU); ctx.fill();
  } else if (p.kind === 'chain') { // twin bolts — the arc jumps
    for (const ox of [-s2 * 0.42, s2 * 0.42]) {
      ctx.beginPath();
      ctx.moveTo(ox + s2 * 0.2, -s2 * 0.75); ctx.lineTo(ox - s2 * 0.3, s2 * 0.1); ctx.lineTo(ox, s2 * 0.1);
      ctx.lineTo(ox - s2 * 0.2, s2 * 0.75); ctx.lineTo(ox + s2 * 0.3, -0.1 * s2); ctx.lineTo(ox, -0.1 * s2);
      ctx.closePath(); ctx.fill();
    }
  } else if (p.kind === 'wide') { // widening arcs
    ctx.beginPath(); ctx.arc(0, 0, s2 * 0.55, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s2 * 1.05, -0.7, 0.7); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s2 * 0.55, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s2 * 1.05, Math.PI - 0.7, Math.PI + 0.7); ctx.stroke();
  } else { // lightning bolt
    ctx.beginPath();
    ctx.moveTo(s2 * 0.3, -s2); ctx.lineTo(-s2 * 0.45, s2 * 0.15); ctx.lineTo(0, s2 * 0.15);
    ctx.lineTo(-s2 * 0.3, s2); ctx.lineTo(s2 * 0.45, -0.15 * s2); ctx.lineTo(0, -0.15 * s2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// energy wall strung between the two ends of a barrier pair — drawn under the traps
function drawLineBeam(en, g) {
  const p = en.partner;
  if (!p || (en.dead && p.dead)) return;
  const rg = ring(Math.max(en.z, 0.02), g);
  let fade = en.resolved ? clamp(en.z / g.hitZ, 0, 1) : 1;
  fade *= clamp((SPAWN_Z - 0.05 - en.z) / 0.3, 0, 1);
  if (fade <= 0.005) return;
  // a live crack RUNNING ALONG THE WALL between the two ruptures — take the
  // short way around, marching dashes sell the energy
  const d = angDiff(p.angle, en.angle);
  const lw = Math.max(1.5, clamp(rg.r / g.nodeR, 0.08, 2) * 6);
  ctx.save();
  ctx.lineCap = 'round';
  ctx.globalAlpha = fade * 0.5;
  ctx.strokeStyle = 'rgba(255,60,90,0.75)';
  ctx.lineWidth = lw * 2.2;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, rg.r, en.angle, en.angle + d, d < 0); ctx.stroke();
  ctx.globalAlpha = fade * 0.9;
  ctx.strokeStyle = 'rgba(255,180,195,0.95)';
  ctx.lineWidth = Math.max(1, lw * 0.55);
  ctx.setLineDash([lw * 2.2, lw * 1.4]);
  ctx.lineDashOffset = -time * 90 * Math.sign(d || 1);
  ctx.beginPath(); ctx.arc(g.cx, g.cy, rg.r, en.angle, en.angle + d, d < 0); ctx.stroke();
  ctx.setLineDash([]);
  // stray sparks arcing off the fissure
  if (!lowFX && Math.random() < 0.3 * fade) {
    const sa = en.angle + d * Math.random();
    burst(g.cx + Math.cos(sa) * rg.r, g.cy + Math.sin(sa) * rg.r, '#ff8ba0', 1, 1.4);
  }
  ctx.restore();
}

// the firewall core — flying deep in the tunnel, plus its bullet-hell return fire
// boss rail clamps: molten orange arcs seizing part of the ring — crossing one
// fries the cannon. They burn away from both ends and are gone within 3s.
function drawLatches(g, bz) {
  if (!latches.length) return;
  ctx.save();
  ctx.lineCap = 'butt';
  for (const lt of latches) {
    // the carpet is CONTINUOUS: its depth-length is exactly dur seconds of
    // travel, so what remains on the tunnel is what remains of the clamp —
    // one object approaching, crossing, and being consumed at the ring.
    // (boss grapples have tele=0: no carpet, the dart is their telegraph)
    if (lt.tele > 0) {
      const z0 = lt.z0 || 1.35;
      const v2 = (z0 - g.hitZ) / lt.tele;      // approach speed
      const len = v2 * lt.dur;                 // 3s worth of carpet
      const headZ = z0 - v2 * lt.t;
      const tailZ = headZ + len;
      const zA = Math.max(headZ, g.hitZ), zB = Math.min(tailZ, 2.08);
      if (zB > zA + 0.01) {
        const fadeIn = clamp(lt.t / 0.35, 0, 1);
        // the carpet's width at depth z = the clamp's width at the moment that
        // piece reaches the ring — a tapering tongue whose shape IS the timer,
        // matching the rim arc exactly as it feeds through
        const wAt = z => lt.span0 * clamp(1 - (lt.t + (z - g.hitZ) / v2 - lt.tele) / lt.dur, 0, 1);
        // rendered in the game's own light language — no painted fill: a
        // colonnade of luminous amber hazard bars (the tunnel's hoop grammar,
        // clipped to the wedge) glued to the body and marching in with it,
        // over a faint warm haze that marks the closed AREA
        ctx.globalCompositeOperation = 'lighter';
        for (let s2 = 0; s2 < 6; s2++) { // the haze
          const bz0 = headZ + len * s2 / 6, bz1 = headZ + len * (s2 + 1) / 6;
          const sz0 = Math.max(bz0, g.hitZ), sz1 = Math.min(bz1, 2.05);
          if (sz1 <= sz0 + 0.004) continue;
          const hwH = wAt(Math.max((bz0 + bz1) / 2, g.hitZ)) * 0.9;
          if (hwH <= 0.006) continue;
          const alH = fadeIn * clamp((SPAWN_Z - 0.05 - sz0) / 0.35, 0, 1);
          wallPatch(g, lt.a, hwH, sz0, sz1 + 0.004, 'rgba(255,60,90,1)', alH * 0.09);
        }
        const BARS = 9;
        for (let k2 = 0; k2 <= BARS; k2++) { // the bars: threat-red ALARM lights,
          // adjacent bars strobing in antiphase — a warning, never an invitation
          // (gold belongs to bonuses; this must read nothing like the ribbon)
          const bzM = headZ + len * k2 / BARS;
          if (bzM < g.hitZ || bzM > 2.05) continue;
          const hw = wAt(bzM) * 0.94;
          if (hw <= 0.006) continue;
          const strobe = 0.55 + 0.45 * Math.sin(time * 5.5 + (k2 % 2) * Math.PI);
          const al = fadeIn * clamp((SPAWN_Z - 0.05 - bzM) / 0.35, 0, 1) * strobe;
          if (al < 0.02) continue;
          wallPatch(g, lt.a, hw, bzM, bzM + 0.028, 'rgba(255,60,90,1)', al * 0.8);
          wallPatch(g, lt.a, hw, bzM, bzM + 0.012, 'rgba(255,170,185,1)', al * 0.5); // hot core line
        }
        ctx.globalCompositeOperation = 'source-over';
        if (headZ > g.hitZ) { // red-hot leading edge, until it docks
          const rgF = ring(Math.max(headZ, 0.02), g);
          const hwF = wAt(headZ);
          ctx.globalAlpha = 0.8 * fadeIn;
          ctx.strokeStyle = 'rgba(255,190,200,0.95)';
          ctx.lineWidth = Math.max(1.2, 3.5 * rgF.s * 3);
          ctx.beginPath(); ctx.arc(g.cx, g.cy, rgF.r, lt.a - hwF, lt.a + hwF); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
    if (lt.t < lt.tele) { // still inbound: landing zone dashed on the rim
      const q = lt.t / lt.tele;
      ctx.strokeStyle = `rgba(255,154,60,${(0.25 + q * 0.35 + Math.sin(time * 16) * 0.15).toFixed(2)})`;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 7]);
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, lt.a - lt.span0, lt.a + lt.span0); ctx.stroke();
      ctx.setLineDash([]);
      continue;
    }
    const lt2 = lt.t - lt.tele;
    const half = lt.span0 * (1 - lt2 / lt.dur);
    if (half <= 0.01) continue;
    const arm = lt2 < lt.arm; // landing blink — a beat of grace before it bites
    let al = arm ? (Math.sin(time * 30) > 0 ? 0.9 : 0.25) : 0.9;
    const ending = clamp((lt.dur - lt2) / 0.6, 0, 1);
    if (ending < 1) al *= (Math.sin(time * 24) > 0 ? 1 : 0.5) * (0.5 + ending * 0.5); // blinking out — clear soon

    ctx.strokeStyle = `rgba(255,154,60,${al.toFixed(2)})`;
    ctx.lineWidth = bz * 0.55;

    ctx.strokeStyle = `rgba(30,12,4,${(al * 0.6).toFixed(2)})`;

      ctx.beginPath();
      ctx.moveTo(g.cx + Math.cos(a2 - 0.022) * (g.nodeR + bz * 0.15), g.cy + Math.sin(a2 - 0.022) * (g.nodeR + bz * 0.15));
      ctx.lineTo(g.cx + Math.cos(a2 + 0.022) * (g.nodeR + bz * 0.85), g.cy + Math.sin(a2 + 0.022) * (g.nodeR + bz * 0.85));

    for (const s2 of [-1, 1]) {

  ctx.restore();
}

function drawBoss(g) {
  const b = boss;
  // orbs first: race from the core's depth out to the ring, growing with perspective
  const railR = g.nodeR - Math.min(W, H) * 0.055 * 0.86;
  for (const sh of b.shots) {
    const k = clamp(sh.t / sh.dur, 0, 1);
    const posAt = kk => {
      const z = lerp(sh.zb, g.hitZ, kk);
      const rg = ring(z, g);
      const tu = Math.cos(sh.th) * (railR / g.nodeR), tv = Math.sin(sh.th) * (railR / g.nodeR);
      return { x: rg.x + lerp(sh.u0, tu, kk) * rg.r, y: rg.y + lerp(sh.v0, tv, kk) * rg.r, s: rg.s };
    };
    const p = posAt(k), p2 = posAt(Math.min(1, k + 0.05));
    const dirA = Math.atan2(p2.y - p.y, p2.x - p.x); // it flies point-first
    const os = Math.min(W, H) * 0.055 * p.s;
    // grapples burn orange; darts are threat-red, glitching violet for a frame
    const oc = sh.latch ? '255,154,60'
      : Math.sin(time * 11 + sh.th * 5.7) > 0.86 ? '212,101,255' : '255,60,90';
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(dirA);
    // motion trail streaking behind the dart
    const tg = ctx.createLinearGradient(-os * 6, 0, os * 1.2, 0);
    tg.addColorStop(0, `rgba(${oc},0)`);
    tg.addColorStop(1, `rgba(${oc},0.55)`);
    ctx.strokeStyle = tg;
    ctx.lineWidth = Math.max(1.5, os * 0.5);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-os * 6, 0); ctx.lineTo(os * 0.6, 0); ctx.stroke();
    // the dart: a dark needle with a hot edge — hull, not a bubble
    ctx.fillStyle = 'rgba(10,4,18,0.95)';
    ctx.strokeStyle = `rgba(${oc},0.9)`;
    ctx.lineWidth = Math.max(1, os * 0.14);
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(os * 2.1, 0);
    ctx.lineTo(-os * 1.4, -os * 0.6);
    ctx.lineTo(-os * 0.7, 0);
    ctx.lineTo(-os * 1.4, os * 0.6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // white-hot tip
    const tp = ctx.createRadialGradient(os * 2.1, 0, 0, os * 2.1, 0, os * 1.1);
    tp.addColorStop(0, 'rgba(255,255,255,0.95)');
    tp.addColorStop(0.4, `rgba(${oc},0.5)`);
    tp.addColorStop(1, `rgba(${oc},0)`);
    ctx.fillStyle = tp;
    ctx.beginPath(); ctx.arc(os * 2.1, 0, os * 1.1, 0, TAU); ctx.fill();
    ctx.restore();
    if (sh.latch) { // where it will bite: the doomed stretch of rail blinks
      const halfP = 0.5 * clamp(sh.t / sh.dur, 0, 1);
      ctx.strokeStyle = `rgba(255,154,60,${(0.35 + Math.sin(time * 16) * 0.2).toFixed(2)})`;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 7]);
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + Math.min(W, H) * 0.0275, sh.th - halfP, sh.th + halfP); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  // ceremony/death staging: the arrival dims the world; the death collapses it
  const cerQ0 = b.introT < BOSS_CER ? clamp(b.introT / BOSS_CER, 0, 1) : 1;
  if (cerQ0 < 1) { // the tunnel's light drains as the truth surfaces
    ctx.fillStyle = `rgba(2,1,8,${(cerQ0 * 0.4).toFixed(2)})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (b.kind === 'triad' && b.dying === undefined) {
    // one machine in three bodies: the links go under the bodies
    drawTriadLinks(g);
    for (const c of b.cores) if (!c.dead) drawVoidCore(g, c);
    // charge telegraph: the firing body blooms before its dart spray
    for (const c of b.cores) {
      if (c.dead || !(c.chargeT > 0)) continue;
      const q = 1 - c.chargeT / 0.55;
      const cr2 = c.sSize * (1.5 + q * 0.9);
      const cg3 = ctx.createRadialGradient(c.sx, c.sy, 0, c.sx, c.sy, cr2);
      cg3.addColorStop(0, `rgba(255,120,150,${(0.30 + q * 0.45).toFixed(2)})`);
      cg3.addColorStop(1, 'rgba(255,60,90,0)');
      ctx.fillStyle = cg3;
      ctx.beginPath(); ctx.arc(c.sx, c.sy, cr2, 0, TAU); ctx.fill();
    }
    for (const bm of b.booms) { // mini implosions where a body went down
      const q = clamp(bm.t / 0.9, 0, 1);
      for (const [spd, col, w2] of [[1, '255,255,255', 2.5], [0.7, '212,101,255', 1.5]]) {
        const rr2 = q * spd * Math.min(W, H) * 0.45;
        if (rr2 < 2) continue;
        ctx.strokeStyle = `rgba(${col},${((1 - q) * 0.8).toFixed(2)})`;
        ctx.lineWidth = w2 + (1 - q) * 4;
        ctx.beginPath(); ctx.arc(bm.x, bm.y, rr2, 0, TAU); ctx.stroke();
      }
    }

    if (b.kind === 'spinner' && b.dying === undefined) drawSpinnerBeam(g); // the light, under the lamp
    drawVoidCore(g, b);
    if (b.kind === 'spinner' && b.shieldT > 0) { // bolt fizzle: the shield shimmer
      const q = 1 - b.shieldT / 0.6;
      ctx.save();
      ctx.strokeStyle = `rgba(143,224,255,${((1 - q) * 0.8).toFixed(2)})`;
      ctx.lineWidth = 2.5;
      const shR = b.sSize * (1.15 + q * 0.5);
      ctx.beginPath();
      for (let k = 0; k <= 6; k++) {
        const a2 = k / 6 * TAU + b.spin * 0.3;
        ctx[k ? 'lineTo' : 'moveTo'](b.sx + Math.cos(a2) * shR, b.sy + Math.sin(a2) * shR);
      }
      ctx.stroke();
      ctx.restore();
    }
  }
  drawBossOverlays(g);
}
// the CORE body: a rogue intelligence rendered as ABSENCE — a void sphere that
// eats the tunnel's light, warps the data fabric into itself, wears dark
// armor plates, and watches the player with a slit eye. Parameterized on a
// view `c` (the boss itself, or one of the triad's mini bodies) so all three

function drawVoidCore(g, c) {

  dk.addColorStop(0, 'rgba(2,1,8,0.8)');

  ctx.lineCap = 'round';
  for (let i = 0; i < 14; i++) {

    const al = Math.sin(ph * Math.PI) * (0.3 + dmg * 0.2) * haze;
    if (al < 0.02) continue;
    const a0 = i * 2.39 + b.spin * 0.7 + ph * 2.2;
    ctx.strokeStyle = `rgba(${gCol(i)},${al.toFixed(2)})`;

    ctx.scale(1, tilt);

      ctx.translate(Math.cos(a0) * size * rr, Math.sin(a0) * size * rr);
      ctx.rotate(a0 + Math.PI / 2);
      ctx.fillStyle = `rgba(8,4,16,${(0.92 * alMul).toFixed(2)})`;
      ctx.strokeStyle = `rgba(${gCol(k * 1.7 + dir)},${((0.5 + flash * 0.5) * alMul).toFixed(2)})`;
      ctx.lineWidth = Math.max(1, size * 0.03);
      ctx.beginPath(); // an angular shard of hull, not a neat tile
      ctx.moveTo(-size * 0.30, 0);
      ctx.lineTo(-size * 0.10, -size * 0.13);
      ctx.lineTo(size * 0.30, -size * 0.07);
      ctx.lineTo(size * 0.16, size * 0.12);

      ctx.restore();

    ctx.restore();

  plates(1.75, 0.6, -1, 0.55); // far track, behind the body
  // the void sphere — mostly absence, lit only at its horizon
  const sph = ctx.createRadialGradient(-size * 0.25, -size * 0.28, size * 0.1, 0, 0, size * 0.98);
  sph.addColorStop(0, 'rgba(26,12,44,1)');
  sph.addColorStop(0.55, 'rgba(9,4,18,1)');
  sph.addColorStop(1, 'rgba(3,1,8,1)');
  ctx.fillStyle = sph;
  ctx.beginPath(); ctx.arc(0, 0, size * 0.95, 0, TAU); ctx.fill();
  // event-horizon rim: hot crimson catch above (glitching violet), red below
  ctx.lineWidth = Math.max(1.5, size * 0.05);
  ctx.strokeStyle = `rgba(${gCol(2.4)},${(0.55 + flash * 0.45).toFixed(2)})`;
  ctx.beginPath(); ctx.arc(0, 0, size * 0.95, Math.PI * 0.8, Math.PI * 1.7); ctx.stroke();
  ctx.strokeStyle = `rgba(255,60,90,${(0.35 + dmg * 0.35).toFixed(2)})`;
  ctx.beginPath(); ctx.arc(0, 0, size * 0.95, Math.PI * 0.05, Math.PI * 0.55); ctx.stroke();
  // corruption lightning crawling the sphere when it tears or takes fire
  if (tear || flash > 0.4) {
    ctx.strokeStyle = `rgba(240,200,255,${(0.5 + flash * 0.4).toFixed(2)})`;
    ctx.lineWidth = Math.max(1, size * 0.02);
    ctx.beginPath();
    let lx = -size * 0.7, ly = Math.sin(time * 9 + seed) * size * 0.4;
    ctx.moveTo(lx, ly);
    for (let k2 = 1; k2 <= 5; k2++) {
      lx += size * 0.28;

      ctx.lineTo(lx, ly);

  // deterministic saccades — it re-fixates like something that thinks.
  const railR2 = g.nodeR - Math.min(W, H) * 0.055 * 0.86;
  const lkx = g.cx + Math.cos(nodes[0].angle) * railR2 - b.sx;
  const lky = g.cy + Math.sin(nodes[0].angle) * railR2 - b.sy;

  const sacT = Math.floor(time * (dieQ >= 0 ? 7 : 1.3)); // dying: the gaze panics

  wg.addColorStop(0, 'rgba(30,4,12,1)');
  wg.addColorStop(0.7, 'rgba(16,2,8,1)');
  wg.addColorStop(1, 'rgba(8,1,5,1)');
  ctx.fillStyle = wg;
  ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, TAU); ctx.fill();
  // stacked glass elements — each deeper ring shifts further toward the prey,
  // and that parallax is what makes it read as a BARREL, not a disc
  for (let j = 1; j <= 4; j++) {
    const rj = eyeR * (1 - j * 0.185);
    const ox = ex + ux2 * eyeR * 0.055 * j + (j > 2 ? sac1 * eyeR * 0.03 : 0);
    const oy = ey + uy2 * eyeR * 0.055 * j + (j > 2 ? sac2 * eyeR * 0.03 : 0);
    ctx.strokeStyle = `rgba(255,70,95,${(0.14 + j * 0.09 + flash * 0.2).toFixed(2)})`;
    ctx.lineWidth = Math.max(0.8, size * (0.014 + j * 0.004));
    ctx.beginPath(); ctx.arc(ox, oy, rj, 0, TAU); ctx.stroke();
    // cold glass glint riding the upper-left of each element
    ctx.strokeStyle = `rgba(210,230,255,${(0.05 + j * 0.02).toFixed(2)})`;
    ctx.lineWidth = Math.max(0.6, size * 0.01);
    ctx.beginPath(); ctx.arc(ox, oy, rj, Math.PI * 0.85, Math.PI * 1.35); ctx.stroke();
  }
  // aperture: a machined 7-blade iris around the sensor, contracting under fire
  const px3 = ex + ux2 * eyeR * 0.22 + sac1 * eyeR * 0.05;
  const py3 = ey + uy2 * eyeR * 0.22 + sac2 * eyeR * 0.05;
  const bR = eyeR * (0.34 - flash * 0.08);
  ctx.strokeStyle = `rgba(255,90,110,${(0.5 + flash * 0.4).toFixed(2)})`;
  ctx.lineWidth = Math.max(1, size * 0.02);
  ctx.beginPath();
  for (let k2 = 0; k2 < 7; k2++) {
    const a2 = k2 / 7 * TAU + b.spin * 0.25;
    ctx[k2 ? 'lineTo' : 'moveTo'](px3 + Math.cos(a2) * bR, py3 + Math.sin(a2) * bR);
  }
  ctx.closePath(); ctx.stroke();
  // the sensor at the bottom of the well — a small furious source, not a wash
  const sg = ctx.createRadialGradient(px3, py3, 0, px3, py3, bR * 0.85);
  sg.addColorStop(0, flash > 0.3 ? '#ffffff' : 'rgba(255,235,220,1)');
  sg.addColorStop(0.25, 'rgba(255,110,110,0.9)');
  sg.addColorStop(0.7, 'rgba(190,25,50,0.5)');
  sg.addColorStop(1, 'rgba(120,8,30,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(px3, py3, bR * 0.85, 0, TAU); ctx.fill();

  ctx.strokeStyle = 'rgba(255,180,190,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px3 - bR * 1.5, py3); ctx.lineTo(px3 + bR * 1.5, py3);
  ctx.moveTo(px3, py3 - bR * 1.5); ctx.lineTo(px3, py3 + bR * 1.5);
  ctx.stroke();
  // machined lens lip — red steel, glitching violet — with focus-ring ticks
  ctx.strokeStyle = `rgba(${gCol(0.3)},${(0.5 + flash * 0.4).toFixed(2)})`;
  ctx.lineWidth = Math.max(1.2, size * 0.035);
  ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,120,140,0.4)';
  ctx.lineWidth = Math.max(0.8, size * 0.015);
  for (let k2 = 0; k2 < 12; k2++) {
    const a2 = k2 / 12 * TAU;
    ctx.beginPath();
    ctx.moveTo(ex + Math.cos(a2) * eyeR * 0.93, ey + Math.sin(a2) * eyeR * 0.93);
    ctx.lineTo(ex + Math.cos(a2) * eyeR * 0.99, ey + Math.sin(a2) * eyeR * 0.99);
    ctx.stroke();
  }
  // specular catch on the glass — it's a lens, not a hole
  ctx.fillStyle = 'rgba(220,235,255,0.25)';
  ctx.beginPath(); ctx.ellipse(ex - eyeR * 0.42, ey - eyeR * 0.48, eyeR * 0.2, eyeR * 0.1, -0.6, 0, TAU); ctx.fill();
  ctx.restore(); // eye ignition/gutter alpha
  plates(1.4, 0.85, 1, 1); // near track, riding in front
  // chromatic ghost rims when tearing — it can't hold its own outline
  if (tear || dieQ > 0.2) {
    ctx.globalAlpha = haze * 0.5;
    for (const [gc, gs2] of [['255,60,90', 1], ['110,200,255', -1]]) {
      ctx.strokeStyle = `rgba(${gc},0.5)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(gs2 * size * 0.1, 0, size * 0.95, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = haze;
  }
  // beam contact: targeting brackets stamp onto the core — the same bracket
  // grammar as the boot callouts, so "designated" reads instantly
  if (b.hurtT > 0 && dieQ < 0) {
    const br = size * 1.25, armL = size * 0.3;
    ctx.strokeStyle = `rgba(255,255,255,${(0.45 + flash * 0.5).toFixed(2)})`;
    ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.moveTo(sx2 * br - sx2 * armL, sy2 * br);
      ctx.lineTo(sx2 * br, sy2 * br);
      ctx.lineTo(sx2 * br, sy2 * br - sy2 * armL);
      ctx.stroke();
    }
  }
  ctx.restore();
}
// arrival title stamp + death shockwaves — the shared ceremony dressing
function drawBossOverlays(g) {

  const cerQ = b.introT < BOSS_CER ? clamp(b.introT / BOSS_CER, 0, 1) : 1;
  // ARRIVAL: the name stamps in while the eye ignites
  if (cerQ < 1 && b.introT > 1.7) {
    const ta = clamp((b.introT - 1.7) / 0.25, 0, 1);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = ta;
    ctx.fillStyle = b.introT < 1.8 ? '#ffffff' : '#d465ff';
    try { ctx.letterSpacing = '5px'; } catch (e) {}
    const btpx = fitPx(bd.title, '800', Math.min(W * 0.05, 30), ringChord(H * 0.26), 13);
    ctx.font = '800 ' + btpx + 'px Audiowide, system-ui';

// mini landing signal for tutorial node killers, in the rim wall's hazard
// language: once a defender has been fried by one, killers telegraph the arc
// they'll land on — the drill becomes DODGE, not decode
function drawKillerSignal(e) {
  const g2 = geo();
  const near = 1 - clamp((e.z - 1) / (SPAWN_Z - 1), 0, 1); // 0 far → 1 landing
  const span = 0.13, blink = 0.5 + 0.5 * Math.sin(time * 9);
  ctx.save();
  ctx.lineCap = 'butt';
  // soft underglow, then striped hazard ticks — sharper as it closes in
  ctx.strokeStyle = 'rgba(255,120,40,' + (0.10 + 0.16 * near).toFixed(2) + ')';
  ctx.lineWidth = 11;
  ctx.beginPath(); ctx.arc(g2.cx, g2.cy, g2.nodeR, e.angle - span, e.angle + span); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,150,60,' + ((0.35 + 0.45 * near) * (0.55 + 0.45 * blink)).toFixed(2) + ')';
  ctx.lineWidth = 4;
  ctx.setLineDash([6, 5]);
  ctx.lineDashOffset = -time * 30;
  ctx.beginPath(); ctx.arc(g2.cx, g2.cy, g2.nodeR, e.angle - span, e.angle + span); ctx.stroke();
  ctx.restore();
}

// one audio channel row: label · angular toggle · tick-marked slider (shared by pause + menu)
function settingRow(label, key, volKey, y, px, pw, tox) {
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(160,225,255,0.95)';
  try { ctx.letterSpacing = '2px'; } catch (e) {}
  ctx.font = '700 12px Audiowide, system-ui';
  ctx.fillText(label, px + 24, y + 4);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  // angular toggle slab — column sits clear of the widest Audiowide label
  const tx = px + (tox || 162), tw = 52, th = 24, on = settings[key];
  techRect(tx, y - th / 2, tw, th, 6);
  ctx.fillStyle = on ? 'rgba(40,140,210,0.55)' : 'rgba(255,255,255,0.06)'; ctx.fill();
  ctx.strokeStyle = on ? 'rgba(140,230,255,0.8)' : 'rgba(120,180,255,0.3)'; ctx.lineWidth = 1.5;
  techRect(tx, y - th / 2, tw, th, 6); ctx.stroke();
  const ks = th - 9;
  ctx.fillStyle = on ? '#dff6ff' : 'rgba(160,190,230,0.45)';
  ctx.fillRect(on ? tx + tw - ks - 4.5 : tx + 4.5, y - ks / 2, ks, ks);
  pauseTogglesList.push({ x: tx, y: y - th / 2, w: tw, h: th, key });
  if (!volKey) return; // toggle-only row (e.g. haptics)
  // volume rail with depth ticks and a diamond cursor
  const sx = tx + tw + 26, sw2 = px + pw - 36 - sx;
  ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(120,200,255,0.16)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + sw2, y); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,200,255,0.35)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 8; i++) {
    const tx2 = sx + sw2 * i / 8;
    ctx.beginPath(); ctx.moveTo(tx2, y + 6); ctx.lineTo(tx2, y + 10); ctx.stroke();
  }
  const v = settings[volKey];
  ctx.strokeStyle = on ? 'rgba(111,227,255,0.9)' : 'rgba(120,150,200,0.3)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + sw2 * v, y); ctx.stroke();
  ctx.save();
  ctx.translate(sx + sw2 * v, y); ctx.rotate(Math.PI / 4);
  ctx.fillStyle = on ? '#eafaff' : 'rgba(200,210,230,0.5)';
  ctx.fillRect(-6, -6, 12, 12);
  ctx.strokeStyle = on ? 'rgba(111,227,255,0.9)' : 'rgba(160,190,230,0.4)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(-6, -6, 12, 12);
  ctx.restore();
  ctx.lineCap = 'round';
  pauseSlidersList.push({ x: sx, y, w: sw2, key: volKey });
}
// control scheme cycler — label · wide slab showing the active scheme
function controlsRow(y, px, pw) {

  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(160,225,255,0.95)';

  try { ctx.letterSpacing = '0px'; } catch (e) {}
  const tx = px + 162, tw = pw - 162 - 36, th = 26;
  techRect(tx, y - th / 2, tw, th, 6);
  ctx.fillStyle = 'rgba(40,140,210,0.35)'; ctx.fill();
  ctx.strokeStyle = 'rgba(140,230,255,0.7)'; ctx.lineWidth = 1.5;
  techRect(tx, y - th / 2, tw, th, 6); ctx.stroke();
  ctx.textAlign = 'center'; ctx.fillStyle = '#dff6ff';
  ctx.font = '700 12px Audiowide, system-ui';
  ctx.fillText(CONTROL_NAMES[settings.controls], tx + tw / 2, y + 4);

}
// shared toggle/slider hit test — returns true if the tap landed on a control
function settingsTap(x, y, pid) {
  for (const t of pauseTogglesList) {
    if (x > t.x - 8 && x < t.x + t.w + 8 && y > t.y - 8 && y < t.y + t.h + 8) {
      if (t.key === '__controls') settings.controls = (settings.controls + 1) % CONTROL_NAMES.length;
      else settings[t.key] = !settings[t.key];
      applySettings(); sfx.tick(); return true;
    }
  }
  for (const s of pauseSlidersList) {
    if (x > s.x - 14 && x < s.x + s.w + 14 && Math.abs(y - s.y) < 20) {
      settings[s.key] = clamp((x - s.x) / s.w, 0, 1); applySettings();
      pauseDrag[pid] = s; return true;
    }
  }
  return false;
}

function drawPause() {
  pauseButtonsList = []; pauseSlidersList = []; pauseTogglesList = [];
  ctx.fillStyle = 'rgba(3,6,14,0.78)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W * 0.74, 540), ph = Math.min(H * 0.86, ALT_CONTROLS ? 330 : 300);
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  techPanel(px, py, pw, ph, 'SYSTEM PAUSED');
  settingRow('SFX',        'sound',     'soundVol', py + 70,  px, pw);
  settingRow('MUSIC',      'music',     'musicVol', py + 108, px, pw);
  settingRow('HAPTICS',    'haptics',   null,       py + 146, px, pw);
  controlsRow(py + 184, px, pw);
  // live console readout, pure garnish
  ctx.fillStyle = 'rgba(120,210,255,0.35)'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
  ctx.fillText('m_fSfxVol = ' + settings.soundVol.toFixed(2) + 'f;   m_eInput = ' + CONTROL_NAMES[settings.controls] + ';', px + 24, py + (ALT_CONTROLS ? 214 : 184));

  const bh = 44, gap = 12, bw = (pw - 48 - gap * 2) / 3;
  let bx = px + 24; const by = py + ph - bh - 20;
  [['RESUME', 'resume', true], ['RESTART', 'restart', false], ['QUIT', 'menu', false]].forEach(([label, action, primary]) => {
    button(bx, by, bw, bh, label, primary);
    pauseButtonsList.push({ x: bx, y: by, w: bw, h: bh, action });
    bx += bw + gap;
  });
  ctx.textAlign = 'left';
}

function pauseTap(x, y, pid) {
  if (settingsTap(x, y, pid)) return;
  for (const b of pauseButtonsList) {
    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) {
      sfx.tick();
      if (b.action === 'resume') { state = S.PLAY; resumeHold = 0.9; resumeDigit = 0; }
      else if (b.action === 'restart') { if (qual) startQualification(); else if (daily) startDaily(); else if (endless) startEndless(); else startLevel(levelIdx); }
      else { // QUIT rides the same drive-back the end-screen MENU key uses
        daily = false; Math.random = sysRandom;
        menuScreen = qual ? 'home' : endless ? 'flow' : 'map';
        if (!endless && !qual) mapSel = Math.min(PROG.unlocked - 1, LEVELS.length - 1);
        state = S.MENU; fadeT = 0.35; playTrack('menu');
        menuFx = menuScreen === 'map' ? { kind: 'panelsIn', t: 0, dur: 0.6, dir: 1, zoom: true }
          : { kind: 'spinIn', t: 0, dur: 0.5, dir: 1, zoom: true };
      }
      return;
    }
  }
}

function drawStars(cx, cy, count, size, t) {
  for (let i = 0; i < 3; i++) {
    const x = cx + (i - 1) * size * 2.6;
    const on = i < count && t > 0.4 + i * 0.35;
    ctx.save();
    ctx.translate(x, cy);
    const pop = on ? 1 + Math.max(0, 0.5 - (t - (0.4 + i * 0.35))) * 1.2 : 1;
    ctx.scale(pop, pop);
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k / 10 * TAU;
      const r = k % 2 === 0 ? size : size * 0.45;
      k === 0 ? ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = on ? '#ffd24a' : 'rgba(255,255,255,0.15)';
    ctx.fill();
    ctx.restore();
  }
}

let menuCache = null, menuCacheScreen = null;

function drawMenuHome(ccx, ccy, R) {

      mid: -Math.PI / 2, locked: false, primary: !progress.tutorialDone, col: '111,227,255' },
    { mode: 'campaign', name: 'CAMPAIGN', glyph: 'C', cap: 'the investigation · ' + LEVELS.length + ' relays',

    { mode: 'flow', name: 'FREE FLOW', glyph: '∞', cap: flowOpen ? 'endless · daily challenge' : 'reach relay 04 to unlock',
      mid: -Math.PI / 2 - THIRD, locked: !flowOpen, primary: campDone, col: '255,210,74' }

// case-file carousel: every campaign is a DISC — a bore-ringed lens whose
// top third is the route map and whose lower two thirds carry the dossier —
// laid out in a horizontal, scrollable line. SYNC STREAM zooms the disc up
// into the tunnel and opens its relay map.
let campScroll = 0, campScrollTgt = 0; // disc index at stage center (eased)
const CAMPS_SOON = ['BLACK ICE', 'ZERO DAY']; // teaser discs
function drawMenuCamps(ccx, ccy, R) {
  // entry/exit: the row flies in from the LEFT on arrival and out to the
  // RIGHT on back — the mode wheel spins on the other side of the crossfade
  let rowOff = 0, rowAl = 1;
  if (menuFx && menuFx.kind === 'spinIn') { const q = clamp(menuFx.t / menuFx.dur, 0, 1); rowOff = W * 0.7 * Math.pow(1 - q, 2); rowAl = q; } // in from the RIGHT
  if (menuFx && menuFx.kind === 'spinOut') { const q = clamp(menuFx.t / menuFx.dur, 0, 1); rowOff = W * 0.7 * q * q; rowAl = 1 - q; }
  // sync zoom: the chosen disc swells into the tunnel; the rest fall away
  let zoomI = -1, zq = 0;
  if (menuFx && menuFx.kind === 'discZoom') { zoomI = menuFx.disc; zq = clamp(menuFx.t / menuFx.dur, 0, 1); }
  if (menuFx && menuFx.kind === 'discOut') { zoomI = menuFx.disc; zq = 1 - clamp(menuFx.t / menuFx.dur, 0, 1); }
  const total = CAMPAIGNS.length + CAMPS_SOON.length;
  const R2 = Math.min(H * 0.34, W * 0.185);
  const dx = R2 * 2.3;
  ctx.save();
  ctx.globalAlpha = rowAl;
  ctx.textAlign = 'center';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  ctx.font = '700 12px Audiowide, system-ui';
  ctx.fillStyle = 'rgba(140,215,255,' + (0.75 * rowAl * (1 - zq)).toFixed(2) + ')';
  ctx.fillText('SELECT CASE FILE', ccx, ccy - R2 - 34);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  // every disc titles at ONE size: the tightest fit across the whole row
  let uniT = Math.round(R2 * 0.17);
  for (let i = 0; i < total; i++) {
    const t2 = i < CAMPAIGNS.length ? CAMPAIGNS[i].title : CAMPS_SOON[i - CAMPAIGNS.length];
    uniT = Math.min(uniT, fitPx(t2, 800, Math.round(R2 * 0.17), R2 * 1.5, 10));
  }
  let zx = 0, zy = 0, zr = 0; // the zooming disc draws LAST, over its siblings
  for (let i = 0; i < total; i++) {
    const cx2 = ccx + (i - campScroll) * dx + rowOff;
    if (cx2 < -R2 * 1.6 || cx2 > W + R2 * 1.6) continue; // off-stage
    if (i === zoomI && zq > 0) { zx = cx2; zy = ccy; zr = R2; continue; }
    if (zq > 0) ctx.globalAlpha = rowAl * (1 - zq); // siblings fall away
    drawCampDisc(i, cx2, ccy, R2, 0, uniT);
    ctx.globalAlpha = rowAl;
  }
  if (zoomI >= 0 && zq > 0 && zr) {
    // draw at BASE size under a smooth scale transform — text px stay fixed,
    // so nothing jitters while the disc swells into the lens
    const ze = zq * zq, k = lerp(R2, mapR(), ze) / R2;
    ctx.save();
    ctx.translate(lerp(zx, ccx, ze), lerp(zy, ccy, ze));
    ctx.scale(k, k);
    drawCampDisc(zoomI, 0, 0, R2, zq, uniT);
    ctx.restore();
  }
  // scroll hints: chevrons + a dot per disc, only when something is off-stage
  if (zq === 0 && total * dx > W * 0.9) {
    const hy = ccy + R2 + 30;
    ctx.font = '700 11px Audiowide, system-ui';
    for (const [dir, sym, on] of [[-1, '\u2039', campScrollTgt > 0], [1, '\u203a', campScrollTgt < total - 1]]) {
      if (!on) continue;
      const hx = ccx + dir * R2 * 1.6;
      const hb = { x: hx - 17, y: hy - 17, w: 34, h: 34 };
      techRect(hb.x, hb.y, hb.w, hb.h, 8);
      ctx.fillStyle = 'rgba(8,22,44,0.7)'; ctx.fill();
      ctx.strokeStyle = 'rgba(120,210,255,0.5)'; ctx.lineWidth = 1.2;
      techRect(hb.x, hb.y, hb.w, hb.h, 8); ctx.stroke();
      ctx.fillStyle = '#cfeaff';
      ctx.font = '700 18px Audiowide, system-ui';
      ctx.fillText(sym, hx, hy + 6);
      menuButtons.push({ ...hb, scrollDir: dir });
    }
    for (let i = 0; i < total; i++) { // position dots
      ctx.beginPath();
      ctx.arc(ccx + (i - (total - 1) / 2) * 14, hy + 1, i === Math.round(campScrollTgt) ? 3.2 : 2, 0, TAU);
      ctx.fillStyle = i === Math.round(campScrollTgt) ? 'rgba(140,230,255,0.95)' : 'rgba(120,180,255,0.35)';
      ctx.fill();
    }
  }
  ctx.textAlign = 'left';
  ctx.restore();
  ctx.globalAlpha = 1;
}
// one campaign disc: a miniature bore. zq>0 = mid sync-zoom (contents fade
// as the disc becomes the tunnel itself)
function drawCampDisc(i, x, y, r, zq, tpx) {
  const real = i < CAMPAIGNS.length;
  const pk = real ? CAMPAIGNS[i] : null;
  const title = real ? pk.title : CAMPS_SOON[i - CAMPAIGNS.length];
  const cp = real ? (progress.camp[pk.id] || { unlocked: 1, stars: [] }) : null;
  const done = real && campaignCleared(pk.id);
  const active = real && pk === CAMP;
  const contentAl = 1 - zq;
  ctx.save();
  // the bore: deep radial well + concentric rings, ringed like the tunnel
  const well = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
  well.addColorStop(0, real ? 'rgba(30,48,84,0.95)' : 'rgba(16,22,36,0.95)');
  well.addColorStop(1, 'rgba(4,8,18,0.98)');
  ctx.fillStyle = well;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  for (let k = 1; k <= 3; k++) {
    ctx.strokeStyle = 'rgba(90,160,230,' + (0.10 - k * 0.02).toFixed(2) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, r * (1 - k * 0.16), 0, TAU); ctx.stroke();
  }
  ctx.strokeStyle = done ? 'rgba(126,226,98,0.8)' : active ? 'rgba(140,230,255,0.95)' : real ? 'rgba(120,180,255,0.45)' : 'rgba(110,140,180,0.3)';
  ctx.lineWidth = active ? 2.5 : 1.5;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(60,110,180,0.25)';
  ctx.beginPath(); ctx.arc(x, y, r * 1.05, 0, TAU); ctx.stroke();
  if (contentAl <= 0.02) { ctx.restore(); return; } // fully a tunnel now
  ctx.globalAlpha *= contentAl;
  ctx.beginPath(); ctx.arc(x, y, r * 0.97, 0, TAU); ctx.clip();
  // top third: the route map (stylized preview — seeded, stable per disc)
  const sepY = y - r / 3;
  ctx.fillStyle = 'rgba(8,18,36,0.85)';
  ctx.fillRect(x - r, y - r, r * 2, sepY - (y - r));
  const rng = mulberry32(0xD15C + i * 7919);
  if (real) { // the campaign's own map image, else the city render, cropped in
    const mh = sepY - (y - r);
    const im2 = campMapImg(pk);
    if (im2) {
      const sh2 = im2.w * (mh / (r * 2));
      ctx.drawImage(im2.img, 0, clamp((im2.h - sh2) / 2, 0, im2.h), im2.w, Math.min(sh2, im2.h), x - r, y - r, r * 2, mh);
    } else {
      if (!cityBase) buildCity();
      const sw2 = CITY_W, sh2 = sw2 * (mh / (r * 2));

      ctx.drawImage(cityBase, 0, sy2, sw2, sh2, x - r, y - r, r * 2, mh);

  }

    const pts = [];

    for (let k = 0; k < n; k++) {
      pts.push({ px: x - r * 0.62 + (k / (n - 1)) * r * 1.24, py: sepY - r * 0.14 - rng() * r * 0.42 });
    }

    ctx.strokeStyle = 'rgba(120,200,255,0.6)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    pts.forEach((p2, k) => k ? ctx.lineTo(p2.px, p2.py) : ctx.moveTo(p2.px, p2.py));
    ctx.stroke();
    ctx.setLineDash([]);
    pts.forEach((p2, k) => {
      const lit = cp.unlocked > Math.round(k * (pk.levels.length - 1) / Math.max(1, n - 1));
      ctx.fillStyle = lit ? 'rgba(140,230,255,0.95)' : 'rgba(90,130,180,0.5)';
      ctx.beginPath(); ctx.arc(p2.px, p2.py, 2.4, 0, TAU); ctx.fill();
    });
  } else { // static for the teasers
    ctx.fillStyle = 'rgba(120,170,230,0.25)';
    for (let k = 0; k < 26; k++) ctx.fillRect(x - r + rng() * r * 2, y - r + rng() * (r * 0.6), 2, 2);
  }
  ctx.strokeStyle = 'rgba(120,200,255,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x - r, sepY); ctx.lineTo(x + r, sepY); ctx.stroke();
  // dossier: big title, then the data lines
  ctx.textAlign = 'center';
  if (tpx === undefined) tpx = fitPx(title, 800, Math.round(r * 0.17), r * 1.5, 10);
  ctx.font = '800 ' + tpx + 'px Audiowide, system-ui';
  ctx.fillStyle = real ? '#eaf7ff' : 'rgba(150,175,210,0.8)';
  ctx.fillText(title, x, sepY + r * 0.22);
  ctx.font = '700 ' + Math.max(9, Math.round(r * 0.085)) + 'px Audiowide, system-ui';
  if (real) {
    const starSum = (cp.stars || []).reduce((a2, b2) => a2 + b2, 0);
    ctx.fillStyle = 'rgba(160,210,250,0.85)';
    ctx.fillText(pk.levels.length + ' RELAYS \u00b7 ' + '\u25b2'.repeat(pk.difficulty || 1) + ' \u00b7 \u2605 ' + starSum + '/' + pk.levels.length * 3, x, sepY + r * 0.44);
    ctx.fillStyle = done ? 'rgba(126,226,98,0.95)' : 'rgba(140,200,240,0.8)';
    ctx.fillText(done ? 'CASE CLOSED' : 'RELAY ' + Math.min(cp.unlocked || 1, pk.levels.length) + ' / ' + pk.levels.length, x, sepY + r * 0.62);
    // short description: the tagline carries the pitch
    ctx.font = '500 ' + Math.max(8, Math.round(r * 0.07)) + 'px Audiowide, system-ui';
    ctx.fillStyle = 'rgba(130,180,225,0.7)';
    ctx.fillText(pk.tagline || '', x, sepY + r * 0.78);
    // SYNC STREAM: the disc's own bottom segment — the circle edge IS the
    // button edge; a chord line separates it from the dossier
    const rr2 = r * 0.97, dSeg = r * 0.60;
    const aSeg = Math.asin(clamp(dSeg / rr2, 0, 1)); // chord intersection angle
    ctx.beginPath();
    ctx.arc(x, y, rr2, aSeg, Math.PI - aSeg);
    ctx.closePath();
    ctx.fillStyle = active ? 'rgba(40,120,190,0.5)' : 'rgba(14,40,72,0.8)'; ctx.fill();
    const chHalf = rr2 * Math.cos(aSeg);
    ctx.strokeStyle = 'rgba(140,230,255,0.75)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - chHalf, y + dSeg); ctx.lineTo(x + chHalf, y + dSeg); ctx.stroke();
    ctx.font = '700 ' + Math.max(10, Math.round(r * 0.085)) + 'px Audiowide, system-ui';
    ctx.fillStyle = '#dff4ff';
    ctx.fillText('\u25b6 SYNC STREAM', x, y + dSeg + (rr2 - dSeg) * 0.56);
    if (zq === 0) { // mid-zoom the disc is scenery, not a control
      menuButtons.push({ x: x - chHalf, y: y + dSeg, w: chHalf * 2, h: rr2 - dSeg, sync: i,
        seg: { cx: x, cy: y, r: rr2, d: dSeg } }); // press flash wears the segment shape
      menuButtons.push({ x: x - r, y: y - r, w: r * 2, h: r + dSeg, campDisc: i }); // body = bring to center
    }
  } else {
    ctx.fillStyle = 'rgba(150,175,210,0.75)';
    ctx.fillText('COMING SOON', x, sepY + r * 0.55);
    ctx.font = '500 ' + Math.max(8, Math.round(r * 0.07)) + 'px Audiowide, system-ui';
    ctx.fillStyle = 'rgba(120,150,190,0.55)';
    ctx.fillText('a new case is being prepared', x, sepY + r * 0.72);
  }
  ctx.textAlign = 'left';
  ctx.restore();
}
function drawMenuFlow() {
  const { ccx, ccy, R } = menuGeom();
  const endlessOpen = anyCampaignCleared();
  const dailyOpen = anyCampaignAt(4);
  const r1 = R * 0.92, r0 = R * 0.38;
  const D = progress.daily;
  let rot = 0, wheelAl = 1; // same spin choreography as the mode wheel
  if (menuFx && menuFx.kind === 'spinOut') { const q = clamp(menuFx.t / menuFx.dur, 0, 1); rot = (menuFx.dir || 1) * q * q * 1.5; wheelAl = 1 - q; }
  if (menuFx && menuFx.kind === 'spinIn') { const q = clamp(menuFx.t / menuFx.dur, 0, 1); rot = -(menuFx.dir || 1) * 1.5 * Math.pow(1 - q, 2); wheelAl = q; }
  const HALVES = [
    { key: 'endless', glyph: '∞', name: 'ENDLESS STREAM', mid: -Math.PI / 2, locked: !endlessOpen, col: '255,210,74',
      cap: endlessOpen ? 'procedural · no mercy' + (progress.best > 0 ? ' · BEST ' + progress.best.toLocaleString() : '') : 'clear the campaign to unlock' },
    { key: 'daily', glyph: '◈', name: 'DAILY STREAM', mid: Math.PI / 2, locked: !dailyOpen, col: '140,220,255',
      cap: dailyOpen ? 'one seeded run per day' + (D && D.best ? ' · BEST ' + D.best.toLocaleString() : '') : 'reach relay 04 to unlock' }
  ];
  ctx.save();
  ctx.globalAlpha = wheelAl;
  ctx.textAlign = 'center';
  for (const hv of HALVES) {
    const mid = hv.mid + rot;
    const a0 = mid - Math.PI / 2 + 0.03, a1 = mid + Math.PI / 2 - 0.03;
    ctx.beginPath();
    ctx.arc(ccx, ccy, r1, a0, a1);
    ctx.arc(ccx, ccy, r0, a1, a0, true);
    ctx.closePath();
    const hot = !hv.locked && hv.key === 'endless';
    ctx.fillStyle = hv.locked ? 'rgba(8,16,30,0.55)'
      : hot ? `rgba(${hv.col},${(0.09 + Math.sin(time * 2.5) * 0.03).toFixed(2)})` : 'rgba(10,24,48,0.42)';
    ctx.fill();
    ctx.strokeStyle = hv.locked ? 'rgba(90,130,170,0.3)' : `rgba(${hv.col},${hot ? 0.8 : 0.45})`;
    ctx.lineWidth = hot ? 2.5 : 1.5;
    ctx.stroke();
    const rm = (r0 + r1) / 2;
    const tx = ccx + Math.cos(mid) * rm, ty = ccy + Math.sin(mid) * rm;
    ctx.fillStyle = hv.locked ? 'rgba(140,170,200,0.35)' : `rgba(${hv.col},0.9)`;
    ctx.font = '800 ' + Math.round(R * 0.11) + 'px Audiowide, system-ui';
    ctx.fillText(hv.glyph, tx, ty + R * 0.035);
    arcText(hv.name, ccx, ccy, r1 - R * 0.135, mid, Math.round(R * 0.07),
      hv.locked ? 'rgba(150,180,210,0.45)' : '#eaf6ff', '800', Math.PI * 0.9);
    arcText(hv.cap, ccx, ccy, r0 + R * 0.075, mid, Math.max(8, Math.round(R * 0.04)),
      hv.locked ? 'rgba(140,170,200,0.4)' : 'rgba(160,215,255,0.75)', '500', Math.PI * 0.9);
    menuButtons.push({ sector: { cx: ccx, cy: ccy, r0, r1, a0: hv.mid - Math.PI / 2 + 0.03, a1: hv.mid + Math.PI / 2 - 0.03 },
      endless: hv.key === 'endless', daily: hv.key === 'daily', locked: hv.locked });
  }
  // hub
  ctx.beginPath(); ctx.arc(ccx, ccy, r0 - R * 0.03, 0, TAU);
  ctx.fillStyle = 'rgba(4,10,22,0.85)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,74,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,210,74,0.9)';
  try { ctx.letterSpacing = '2px'; } catch (e) {}
  ctx.font = '800 ' + Math.round(R * 0.062) + 'px Audiowide, system-ui';
  ctx.fillText('FREE', ccx, ccy - R * 0.02);
  ctx.fillText('FLOW', ccx, ccy + R * 0.05);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.restore();
  ctx.textAlign = 'left';

  // score modifiers — the campaign reward for players chasing numbers
  if (anyCampaignCleared()) {
    const MUTS = [['oneLife', '1 LIFE', '×2'], ['fast', 'FAST STREAM', '×1.5'], ['noPickups', 'NO PICKUPS', '×1.3']];
    let my2 = H * 0.56;
    ctx.font = '700 10px Audiowide, system-ui';
    ctx.fillStyle = 'rgba(120,210,255,0.75)';
    try { ctx.letterSpacing = '2px'; } catch (e) {}
    ctx.fillText('MODIFIERS', 26 + SAFE.l, my2 - 10);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    let mi = 0;
    const mutOff = i => { // same staggered fly-in/out grammar as the relay list

      if (menuFx.kind === 'spinOut' || menuFx.kind === 'launch') { const q = clamp((menuFx.t - i * 0.06) / 0.2, 0, 1); return -span * q * q; }
      return 0;

      const r2 = { x: 26 + SAFE.l + mutOff(mi++), y: my2, w: 128, h: 24, key };
      const on = mutators[key];

      ctx.fill();

      ctx.lineWidth = 1.5;
      techRect(r2.x, r2.y, r2.w, r2.h, 6); ctx.stroke();
      ctx.fillStyle = on ? '#ffe9b0' : 'rgba(160,200,240,0.7)';
      ctx.font = '700 10px Audiowide, system-ui';
      ctx.fillText(label, r2.x + 10, r2.y + 16);
      ctx.textAlign = 'right';
      ctx.fillStyle = on ? '#ffd24a' : 'rgba(160,200,240,0.5)';
      ctx.fillText(mult, r2.x + r2.w - 8, r2.y + 16);
      ctx.textAlign = 'left';
      menuMutRects.push(r2);
      my2 += 30;
    }
    const mm2 = mutMul();
    if (mm2 > 1) {
      ctx.fillStyle = '#ffd24a'; ctx.font = '700 11px Audiowide, system-ui';
      ctx.fillText('SCORE ×' + (Math.round(mm2 * 100) / 100), 26 + SAFE.l, my2 + 12);
    }
  }
}

// ---------- campaign route map ----------
// the ring becomes a LENS over an isometric wireframe city — the network's
// physical geography. The relay list rides the left column, the dossier the
// right, and selecting a relay glides the lens along the route.
let cityBase = null, cityTop = null, mapCamX = 0, mapCamY = 0, mapCamSnap = true, mapZoom = 1, menuResetArm = 0;
const mapR = () => menuGeom().R * 0.92; // the lens rim MATCHES the mode wheel — seamless crossfade
const CITY_W = 1600, CITY_H = 980;
let RELAY_W = [], ROUTE_SEGS = []; // filled by buildCity — relays sit ON cable junctions
const CITY_A = [], CITY_B = [];
// harbor: a wavy water band across the sheet — the skyline crowds its north bank
const harborY = x => CITY_H * 0.60 + Math.sin(x * 0.004) * 34;
const HARBOR_H = 64;
// two offscreen layers: BASE (streets, harbor, the buried cable grid) and TOP
// (the building wireframe). The live route draws between them, so the data
// infrastructure reads as underground — ghosting through translucent faces.
function buildCity() {
  const rng = mulberry32(0xC17C0DE);
  const HW = 16, HH = 8; // small tiles = a zoomed-out survey
  // street bands in the two iso families (slope ±0.5). value v: line y = ±0.5x + 13v
  const mkBands = (lo, hi) => {
    const out = [];
    let v = lo + 2 + rng() * 4;
    while (v < hi) { out.push({ v: Math.round(v), major: rng() < 0.5 }); v += 5 + rng() * 6; }
    return out;
  };
  const bands1 = mkBands(-95, 118); // v1 = r - 2c family (slope +0.5)
  const bands2 = mkBands(4, 218);   // v2 = r + 2c family (slope -0.5)
  const trunks1 = bands1.filter(b => b.major), trunks2 = bands2.filter(b => b.major);
  const jxy = (a, b) => ({ x: HH * (b - a), y: HH * 0.5 * (a + b) }); // trunk junction -> px
  // pick 10 route anchors (A, relays 1-8, B) on trunk junctions, west -> east,
  // serpentining north/south and staying out of the water
  const junc = [];
  for (const t1 of trunks1) for (const t2 of trunks2) {
    const p2 = jxy(t1.v, t2.v);
    if (p2.x < 70 || p2.x > CITY_W - 70 || p2.y < 90 || p2.y > CITY_H - 70) continue;
    const hy = harborY(p2.x);
    if (p2.y > hy - 26 && p2.y < hy + HARBOR_H + 26) continue;
    junc.push({ a: t1.v, b: t2.v, x: p2.x, y: p2.y });
  }
  // the run starts at OmniServe HQ in the far west and lands at Police HQ

  const IM = campMapImg(CAMP); // image-mode: the package brought its own world
  if (!IM && !cityBase) buildCity();
  const WW = IM ? IM.w : CITY_W, WH = IM ? IM.h : CITY_H;
  const SEGS = IM ? imgSegs() : ROUTE_SEGS;
  const RPT = i => IM ? imgPin(i) : relayW(i);
  const frontier = Math.min(PROG.unlocked - 1, LEVELS.length - 1);
  // camera: frame the ENTIRE selected run — center on its bounding box and
  // zoom out until it fits inside the lens
  const seg = SEGS[mapSel];
  let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
  for (const p2 of seg) {
    bx0 = Math.min(bx0, p2.x); by0 = Math.min(by0, p2.y);
    bx1 = Math.max(bx1, p2.x); by1 = Math.max(by1, p2.y);
  }
  // fit the WHOLE run in the CIRCULAR lens: zoom by the farthest point from
  // the bbox center, padded for relay markers (hexes, brackets, stars)
  const cbx = (bx0 + bx1) / 2, cby = (by0 + by1) / 2;
  let rMax = 1;
  for (const p2 of seg) rMax = Math.max(rMax, Math.hypot(p2.x - cbx, p2.y - cby));
  const zt = clamp((R - 58) / rMax, 0.3, 1);
  const Rz = R / Math.max(mapZoom, 0.01);
  const tx2 = clamp((bx0 + bx1) / 2, Math.min(Rz * 0.8, WW / 2), WW - Math.min(Rz * 0.8, WW / 2));
  const ty2 = clamp((by0 + by1) / 2, Math.min(Rz * 0.7, WH / 2), WH - Math.min(Rz * 0.7, WH / 2));
  if (mapCamSnap) { mapCamX = tx2; mapCamY = ty2; mapZoom = zt; mapCamSnap = false; }
  mapCamX += (tx2 - mapCamX) * 0.08;
  mapCamY += (ty2 - mapCamY) * 0.08;
  mapZoom += (zt - mapZoom) * 0.08;
  const wx = p2 => ccx + (p2.x - mapCamX) * mapZoom; // world -> screen (zoomed)
  const wy = p2 => ccy + (p2.y - mapCamY) * mapZoom;

  // ---- inside the lens ----
  // the map CIRCLES into view while the wheel circles out (and reverses):
  // forward arrives rotating clockwise; back departs counterclockwise
  let mapRot = 0, mapAl = 1, discRimAl = 0;
  if (menuFx && menuFx.kind === 'panelsIn') {
    const q = clamp(menuFx.t / 0.42, 0, 1);
    mapRot = -(menuFx.dir || 1) * 0.9 * Math.pow(1 - q, 2);
    mapAl = q;
    if (menuFx.fromDisc) { mapRot = 0; discRimAl = 1 - q; } // disc-born: pure crossfade, no spin
  } else if (menuFx && menuFx.kind === 'panelsOut') {
    const q = clamp(menuFx.t / menuFx.dur, 0, 1);
    mapRot = (menuFx.dir || -1) * 0.9 * q * q;
    mapAl = 1 - q;
    if (CAMPAIGNS.length > 1) discRimAl = q; // the disc rim rises to meet the shrink-out
  }
  ctx.save();
  ctx.beginPath(); ctx.arc(ccx, ccy, R - 5, 0, TAU); ctx.clip();
  if (mapRot !== 0 || mapAl < 1) {
    ctx.translate(ccx, ccy); ctx.rotate(mapRot); ctx.translate(-ccx, -ccy);
    ctx.globalAlpha = mapAl;
  }
  // LAYER 1: the world sheet — a package image, or the procedural city
  {
    const bx0 = ccx - mapCamX * mapZoom, by0 = ccy - mapCamY * mapZoom;
    const bw0 = WW * mapZoom, bh0 = WH * mapZoom;
    if (IM) {
      ctx.fillStyle = '#04070f';
      ctx.fillRect(ccx - R, ccy - R, R * 2, R * 2);
      ctx.drawImage(IM.img, bx0, by0, bw0, bh0);
      // readability veil — the route and relays stay the loudest layer
      ctx.fillStyle = 'rgba(4,10,22,0.28)';
      ctx.fillRect(ccx - R, ccy - R, R * 2, R * 2);
    } else {
      ctx.drawImage(cityBase, bx0, by0, bw0, bh0);
      // the city never ENDS: mirrored continuations above and below the sheet
      ctx.save();
      ctx.scale(1, -1);
      ctx.drawImage(cityBase, bx0, -by0, bw0, bh0);
      ctx.drawImage(cityBase, bx0, -(by0 + bh0 * 2), bw0, bh0);
      ctx.restore();
    }
  }
  // LAYER 2: each level's cable run, leading AWAY from its relay —
  // secured lines flow green with live data, unsecured wait as dashed blue
  ctx.lineCap = 'round';
  for (let k = 0; k < SEGS.length; k++) {
    const pts2 = SEGS[k];
    const done = PROG.stars[k] > 0;
    const trace = () => {
      ctx.beginPath();
      pts2.forEach((p2, pi) => pi ? ctx.lineTo(wx(p2), wy(p2)) : ctx.moveTo(wx(p2), wy(p2)));
      ctx.stroke();
    };
    const sel = k === mapSel;
    if (sel) { // the selected run glows under everything above it
      ctx.strokeStyle = done ? 'rgba(150,255,140,0.20)' : 'rgba(140,210,255,0.20)';
      ctx.lineWidth = 8; ctx.setLineDash([]);
      trace();
    }
    if (done) {
      if (!sel) { // secured but not in focus: a quiet green ghost
        ctx.strokeStyle = 'rgba(126,226,98,0.16)'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        trace();
      } else { // selected: solid green, chevrons marching toward the next relay
        ctx.strokeStyle = 'rgba(126,226,98,0.6)'; ctx.lineWidth = 2.5; ctx.setLineDash([]);
        trace();
        let Ltot = 0;
        for (let i = 1; i < pts2.length; i++) Ltot += Math.hypot(pts2[i].x - pts2[i - 1].x, pts2[i].y - pts2[i - 1].y);
        ctx.strokeStyle = 'rgba(215,255,185,0.9)';
        ctx.lineWidth = 1.5;
        const step = 38, ph2 = (time * 30) % step;
        for (let d = ph2 + 6; d < Ltot - 4; d += step) {
          const p0 = polyAt(pts2, d / Ltot), p1 = polyAt(pts2, Math.min(1, (d + 4) / Ltot));
          const ang = Math.atan2(wy(p1) - wy(p0), wx(p1) - wx(p0)); // screen-space heading
          const cxs = wx(p0), cys = wy(p0), ar = 4.5;
          ctx.beginPath();
          ctx.moveTo(cxs - Math.cos(ang - 0.55) * ar, cys - Math.sin(ang - 0.55) * ar);
          ctx.lineTo(cxs, cys);
          ctx.lineTo(cxs - Math.cos(ang + 0.55) * ar, cys - Math.sin(ang + 0.55) * ar);
          ctx.stroke();
        }
      }
    } else if (!sel) { // unsecured, unfocused: the faintest dashed plan
      ctx.strokeStyle = 'rgba(110,185,255,0.13)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 7]); ctx.lineDashOffset = 0;
      trace();
      ctx.setLineDash([]);
    } else { // selected + unsecured: dashed blue, breathing
      const br = 0.5 + 0.5 * Math.sin(time * 2.2); // slow breath
      ctx.strokeStyle = `rgba(120,195,255,${(0.10 + br * 0.16).toFixed(2)})`;
      ctx.lineWidth = 7 + br * 3; // soft halo swells and fades under the dashes
      ctx.setLineDash([]);
      trace();
      ctx.strokeStyle = `rgba(110,185,255,${(0.45 + br * 0.4).toFixed(2)})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 7]); ctx.lineDashOffset = 0;
      trace();
      ctx.setLineDash([]);
    }
  }
  // LAYER 3: the blueprint wireframe above — transparent, so the buried
  // cables stay readable through the whole city (procedural world only)
  if (!IM) {
    const bx0 = ccx - mapCamX * mapZoom, by0 = ccy - mapCamY * mapZoom;
    const bw0 = CITY_W * mapZoom, bh0 = CITY_H * mapZoom;
    ctx.drawImage(cityTop, bx0, by0, bw0, bh0);
    ctx.save();
    ctx.scale(1, -1);
    ctx.drawImage(cityTop, bx0, -by0, bw0, bh0);
    ctx.drawImage(cityTop, bx0, -(by0 + bh0 * 2), bw0, bh0);
    ctx.restore();
  }
  // destination: Police HQ / CID intake — the run's final delivery point
  // (city lore; image worlds carry only their own pins)
  if (!IM) {
    const pt = relayW(LEVELS.length);
    const ex2 = wx(pt), ey2 = wy(pt);
    const delivered = PROG.stars[LEVELS.length - 1] > 0;
    techRect(ex2 - 13, ey2 - 13, 26, 26, 6);
    ctx.fillStyle = 'rgba(8,24,46,0.92)'; ctx.fill();
    ctx.strokeStyle = delivered ? 'rgba(126,226,98,0.9)' : 'rgba(140,220,255,0.8)'; ctx.lineWidth = 1.5;
    techRect(ex2 - 13, ey2 - 13, 26, 26, 6); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = delivered ? '#c8ffb0' : '#eafaff'; ctx.font = '800 9px Audiowide, system-ui';
    ctx.fillText('CID', ex2, ey2 + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(140,200,255,0.75)'; ctx.font = '500 7px Audiowide, system-ui';
    ctx.fillText('POLICE HQ', ex2, ey2 + 24);
    ctx.textAlign = 'left';
  }
  // relay markers
  const nr = Math.min(W, H) * 0.03;
  for (let i = 0; i < LEVELS.length; i++) {
    const pt = RPT(i);
    const mx2 = wx(pt), my2 = wy(pt);
    if (Math.hypot(mx2 - ccx, my2 - ccy) > R + nr) continue; // outside the lens
    const locked = i + 1 > PROG.unlocked;
    const cleared = PROG.stars[i] > 0;
    const isFrontier = i === frontier && !cleared;
    const isBoss = !!LEVELS[i].boss;
    const r = nr * (isBoss ? 1.3 : 1);
    mapHex(mx2, my2, r);
    ctx.fillStyle = locked ? 'rgba(10,18,34,0.85)' : cleared ? 'rgba(16,50,72,0.92)' : 'rgba(12,30,55,0.92)';
    ctx.fill();
    if (isFrontier) ctx.strokeStyle = `rgba(255,210,74,${(0.7 + Math.sin(time * 4) * 0.3).toFixed(2)})`;
    else ctx.strokeStyle = locked ? 'rgba(120,180,255,0.25)' : isBoss ? 'rgba(212,101,255,0.85)' : 'rgba(111,227,255,0.85)';
    ctx.lineWidth = isFrontier ? 2 : 1.5;
    mapHex(mx2, my2, r); ctx.stroke();
    if (i === mapSel) { ctx.strokeStyle = 'rgba(240,252,255,0.9)'; ctx.lineWidth = 1.5; mapHex(mx2, my2, r + 5); ctx.stroke(); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = locked ? 'rgba(200,225,255,0.35)' : '#f2faff';
    ctx.font = '800 ' + Math.round(r * 0.75) + 'px Audiowide, system-ui';
    ctx.fillText(locked ? '·' : String(i + 1), mx2, my2 + 1);
    ctx.textBaseline = 'alphabetic';
    if (isBoss) {
      ctx.fillStyle = 'rgba(212,101,255,0.85)'; ctx.font = '700 7px Audiowide, system-ui';
      ctx.fillText('CORE', mx2, my2 - r - 5);
    }
    if (cleared) for (let k = 0; k < 3; k++) star5(mx2 - 11 + k * 11, my2 + r + 8, 4, k < PROG.stars[i]);
    ctx.textAlign = 'left';
    menuButtons.push({ x: mx2 - 20, y: my2 - 20, w: 40, h: 40, node: i, locked: false });
  }
  // lens optics: inner vignette + a slow radar sweep
  const vg = ctx.createRadialGradient(ccx, ccy, R * 0.55, ccx, ccy, R);
  vg.addColorStop(0, 'rgba(2,6,14,0)');
  vg.addColorStop(1, 'rgba(2,6,14,0.55)');
  ctx.fillStyle = vg;
  ctx.beginPath(); ctx.arc(ccx, ccy, R, 0, TAU); ctx.fill();
  const swA = time * 0.5;
  const swG = ctx.createLinearGradient(ccx, ccy, ccx + Math.cos(swA) * R, ccy + Math.sin(swA) * R);
  swG.addColorStop(0, 'rgba(111,227,255,0)');
  swG.addColorStop(1, 'rgba(111,227,255,0.25)');
  ctx.strokeStyle = swG; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(swA) * (R - 6), ccy + Math.sin(swA) * (R - 6)); ctx.stroke();
  ctx.restore();
  // lens rim
  ctx.strokeStyle = 'rgba(111,227,255,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(ccx, ccy, R - 5, 0, TAU); ctx.stroke();
  if (discRimAl > 0) { // the campaign disc's rim, mid-crossfade with the lens
    ctx.save();
    ctx.globalAlpha = discRimAl;
    ctx.strokeStyle = 'rgba(140,230,255,0.95)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(ccx, ccy, R, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(60,110,180,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(ccx, ccy, R * 1.05, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  drawMapList(ccx, ccy, R, frontier);
  ctx.save();
  ctx.translate(menuCardOff(), 0); // the dossier flows in from the right
  drawMapCard(mapSel, frontier, ccx, ccy, R);
  ctx.restore();

  // TEMPORARY: BOSS TEST dev key
  const dv = { x: W - 116 - SAFE.r, y: 58 + SAFE.t, w: 96, h: 24 };
  techRect(dv.x, dv.y, dv.w, dv.h, 6);
  ctx.fillStyle = 'rgba(6,20,40,0.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,180,255,0.35)'; ctx.lineWidth = 1;
  techRect(dv.x, dv.y, dv.w, dv.h, 6); ctx.stroke();
  ctx.fillStyle = 'rgba(160,200,240,0.7)'; ctx.font = '700 9px Audiowide, system-ui';
  ctx.fillText('⚔ BOSS (DEV)', dv.x + 9, dv.y + 16);
  menuButtons.push({ ...dv, bossTest: true, locked: false });
  // reset campaign (two-tap confirm)
  const rv = { x: dv.x, y: dv.y + 30, w: 96, h: 24 };
  const armed = time - menuResetArm < 2.5;
  techRect(rv.x, rv.y, rv.w, rv.h, 6);
  ctx.fillStyle = armed ? 'rgba(90,20,20,0.6)' : 'rgba(6,20,40,0.55)'; ctx.fill();
  ctx.strokeStyle = armed ? 'rgba(255,110,110,0.8)' : 'rgba(120,180,255,0.35)'; ctx.lineWidth = 1;
  techRect(rv.x, rv.y, rv.w, rv.h, 6); ctx.stroke();
  ctx.fillStyle = armed ? '#ffb0b0' : 'rgba(160,200,240,0.7)'; ctx.font = '700 8px Audiowide, system-ui';
  ctx.fillText(armed ? 'TAP TO CONFIRM' : '↺ RESET RUN', rv.x + 9, rv.y + 16);
  menuButtons.push({ ...rv, reset: true, locked: false });
}
// left column: the relay list — the selector that drives the lens
function drawMapList(ccx, ccy, R, frontier) {
  ctx.textAlign = 'left';
  const lx2 = 10 + SAFE.l * 0.6;
  const rows = LEVELS.length;
  const topY = 68 + SAFE.t, botY = H - 16; // list starts under brand + title + rule
  const gap2 = 6;
  const rh = clamp((botY - topY - (rows - 1) * gap2) / rows, 20, 34); // ALL rows fit — no scroll
  let ly2 = topY + Math.max(0, (botY - topY - (rows * (rh + gap2) - gap2)) / 2);
  // ONE width for every key; right edges land on the lens circle, so the
  // column stacks as an arc of identical keys hugging the rim
  const lw2 = Math.max(140, (ccx - (R + 14)) - lx2 - 8);
  for (let i = 0; i < rows; i++) {
    const dyC = (ly2 + rh / 2) - ccy;
    const lensL = Math.abs(dyC) < R + 14 ? ccx - Math.sqrt(Math.max(0, (R + 14) * (R + 14) - dyC * dyC)) : ccx - R * 0.2;
    const rx = lensL - 8 - lw2; // right-aligned to the rim
    const locked = i + 1 > PROG.unlocked;
    const sel = i === mapSel;
    ctx.save();
    ctx.translate(menuRowOff(i, rows), 0); // staggered fly-in from the left
    techRect(rx, ly2, lw2, rh, 6);
    ctx.fillStyle = sel ? 'rgba(30,120,190,0.4)' : locked ? 'rgba(90,160,255,0.04)' : 'rgba(10,36,64,0.5)';
    ctx.fill();
    ctx.strokeStyle = sel ? 'rgba(150,238,255,0.95)'
      : i === frontier && !locked ? 'rgba(255,210,74,0.6)'
      : locked ? 'rgba(120,180,255,0.15)' : 'rgba(95,200,255,0.4)';
    ctx.lineWidth = sel ? 1.5 : 1;
    techRect(rx, ly2, lw2, rh, 6); ctx.stroke();
    // title only — the dossier owns stars and stats
    ctx.fillStyle = locked ? 'rgba(220,240,255,0.3)' : '#f2faff';
    const nm = '0' + (i + 1) + '  ' + LEVELS[i].name;
    ctx.font = '700 ' + fitPx(nm, '700', 10, lw2 - (locked ? 34 : 18), 8) + 'px Audiowide, system-ui';
    ctx.textBaseline = 'middle';
    ctx.fillText(nm, rx + 10, ly2 + rh / 2 + 1);
    ctx.textBaseline = 'alphabetic';
    if (locked) padlock(rx + lw2 - 14, ly2 + rh / 2, 5);
    ctx.restore();
    menuButtons.push({ x: rx, y: ly2, w: lw2, h: rh, node: i, locked: false });
    ly2 += rh + gap2;
  }
}
function drawMapCard(li, frontier, ccx, ccy, R) {
  ctx.textAlign = 'left';
  const L2 = LEVELS[li];
  const locked = li + 1 > PROG.unlocked;
  const px2 = ccx + R + 12;
  const pw = Math.max(120, W - SAFE.r - 14 - px2);
  const ph = Math.min(H - 100, 236);
  const py2 = ccy - ph / 2;
  techRect(px2, py2, pw, ph, 10);
  ctx.fillStyle = 'rgba(5,14,30,0.82)'; ctx.fill();
  ctx.strokeStyle = locked ? 'rgba(120,180,255,0.25)' : 'rgba(111,227,255,0.45)'; ctx.lineWidth = 1.5;
  techRect(px2, py2, pw, ph, 10); ctx.stroke();
  ctx.fillStyle = locked ? 'rgba(220,240,255,0.5)' : 'rgba(140,200,255,0.6)';
  ctx.font = '700 9px Audiowide, system-ui';
  ctx.fillText('RELAY 0' + (li + 1), px2 + 14, py2 + 20);
  if (locked) {
    ctx.fillStyle = 'rgba(220,240,255,0.55)'; ctx.font = '700 12px Audiowide, system-ui';
    ctx.fillText('ENCRYPTED', px2 + 14, py2 + 44);
    ctx.fillStyle = 'rgba(160,200,240,0.45)'; ctx.font = '500 9px Audiowide, system-ui';
    ctx.fillText('secure the previous', px2 + 14, py2 + 64);
    ctx.fillText('relay to decrypt', px2 + 14, py2 + 78);
    padlock(px2 + pw / 2, py2 + ph - 40, 9);
    return;
  }
  ctx.fillStyle = '#f2faff'; ctx.font = '700 12px Audiowide, system-ui';
  ctx.fillText(L2.name, px2 + 14, py2 + 40);
  for (let k = 0; k < 3; k++) star5(px2 + 22 + k * 20, py2 + 56, 7, k < PROG.stars[li]);
  // fixed rows top-down, deploy pinned to the bottom — nothing overlaps
  ctx.fillStyle = 'rgba(160,215,255,0.8)'; ctx.font = '600 9px Audiowide, system-ui';
  ctx.fillText((L2.boss ? 'CORE DUEL · ' : '') + 'RUN ' + L2.duration + 's · TRAFFIC ' + Math.round(L2.speed * 100), px2 + 14, py2 + 78);
  if ((PROG.bests[li] || 0) > 0) {
    ctx.fillStyle = 'rgba(255,210,74,0.85)';
    ctx.fillText('BEST ' + PROG.bests[li].toLocaleString(), px2 + 14, py2 + 92);
  }
  const kinds = ['normal'];
  if (L2.heavies) kinds.push('heavy');
  if (L2.lines) kinds.push('line');
  if (L2.colors) kinds.push('lock');
  if (L2.walls) kinds.push('wall');
  if (L2.frags) kinds.push('frag');
  if (L2.boss) kinds.push('boss');
  ctx.fillStyle = 'rgba(140,200,255,0.55)'; ctx.font = '500 8px Audiowide, system-ui';
  ctx.fillText('EXPECTED TRAFFIC', px2 + 14, py2 + 110);
  kinds.forEach((k, ki) => {
    const col2 = ki % 5, row2 = Math.floor(ki / 5);
    drawInfoGlyph(k, px2 + 26 + col2 * 26, py2 + 128 + row2 * 26, 8);
  });
  const dw = pw - 24, dh = 34;
  const dx2 = px2 + 12, dy2 = py2 + ph - dh - 12;
  levelKey(dx2, dy2, dw, dh, '▶', 'DEPLOY', -1, false, li === frontier);
  menuButtons.push({ x: dx2, y: dy2, w: dw, h: dh, deploy: li, locked: false });
}

function drawEnd(g) {
  endButtons = [];
  const ph = (a, b2) => clamp((endT - a) / (b2 - a), 0, 1);
  // wins let the clear-sweep roll first; losses resolve fast
  const T = endWin
    ? { panel0: 0.95, panel1: 1.4, cnt0: 1.4, cnt1: 2.55, stars: 1.6, stats: 2.6 }
    : { panel0: 0.05, panel1: 0.40, cnt0: 0.35, cnt1: 1.00, stars: 99,   stats: 1.0 };
  const btnAt = endBtnAt();

  // the live (now cleared) scene keeps breathing beneath — dim it gently
  ctx.fillStyle = 'rgba(3,6,14,' + (0.5 * (endWin ? ph(0.75, 1.2) : ph(0, 0.45))).toFixed(2) + ')';
  ctx.fillRect(0, 0, W, H);
  if (endWin && endT < 0.35) { // victory flash seals the run
    ctx.fillStyle = 'rgba(126,226,98,' + (0.28 * (1 - endT / 0.35)).toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  const pA = ph(T.panel0, T.panel1);
  if (pA <= 0.001) return;

  const R = g.nodeR * 0.94;
  const maxW = g.nodeR * 2 * 0.62;
  const endCol = endless ? '#ffb340' : endWin ? '#69e05c' : '#ff4a5e';
  const endColRgb = endless ? '255,179,64' : endWin ? '105,224,92' : '255,74,94';
  const fit = (weight, px2, text) => {
    let fs = px2 + 1;
    do { fs--; ctx.font = weight + ' ' + fs + 'px Audiowide, system-ui'; }
    while (fs > 8 && ctx.measureText(text).width > maxW);
    return fs;
  };

  ctx.save();
  ctx.globalAlpha = pA;
  // the report lives INSIDE the ring
  const bg = ctx.createRadialGradient(g.cx, g.cy, R * 0.25, g.cx, g.cy, R);
  bg.addColorStop(0, 'rgba(6,11,24,0.93)');
  bg.addColorStop(0.82, 'rgba(5,9,20,0.88)');
  bg.addColorStop(1, 'rgba(5,9,20,0)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = `rgba(${endColRgb},0.35)`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, 0, TAU); ctx.stroke();
  ctx.strokeStyle = `rgba(${endColRgb},0.8)`; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    const a = k / 4 * TAU + Math.PI / 4 + time * 0.12;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, a - 0.22, a + 0.22); ctx.stroke();
  }

  ctx.textAlign = 'center';
  // mode line
  const modeName = endless ? (daily ? 'DAILY STREAM' : 'ENDLESS STREAM') : qual ? 'QUALIFICATION' : LEVELS[levelIdx].name;
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  ctx.fillStyle = 'rgba(140,210,255,0.7)';
  fit('700', 11, 'MISSION REPORT  //  ' + modeName);
  ctx.fillText('MISSION REPORT  //  ' + modeName, g.cx, g.cy - R * 0.64);
  try { ctx.letterSpacing = '0px'; } catch (e) {}

  // banner slams in
  const tPop = 1 + 0.22 * (1 - ph(T.panel0, T.panel0 + 0.3));
  const banner = endless ? 'STREAM SEVERED' : qual ? (endWin ? 'QUALIFIED' : 'TRAINING ABORTED') : endWin ? 'PAYLOAD DELIVERED' : 'PAYLOAD CORRUPTED';
  ctx.save();
  ctx.translate(g.cx, g.cy - R * 0.38);
  ctx.scale(tPop, tPop);
  ctx.fillStyle = endCol;
  try { ctx.letterSpacing = '4px'; } catch (e) {}
  fit('800', 30, banner);
  ctx.shadowColor = endCol; ctx.shadowBlur = 22;
  ctx.fillText(banner, 0, 0);
  ctx.shadowBlur = 0;
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.restore();

  // stars pop one by one, each with a chime
  if (endWin && !qual && !endless) {
    drawStars(g.cx, g.cy - R * 0.16, endStars, Math.min(W, H) * 0.045, endT - T.stars);
    let popped = 0;
    for (let i = 0; i < endStars; i++) if (endT - T.stars > 0.4 + i * 0.35) popped++;
    if (popped > endFxStars) { endFxStars = popped; tone(760 + popped * 220, 0.2, 'triangle', 0.13, 900 + popped * 260); }
  }

  // the score counts itself up
  const cntP = 1 - Math.pow(1 - ph(T.cnt0, T.cnt1), 3);
  const shown = Math.round(score * cntP);
  const counting = cntP > 0 && cntP < 1 && score > 0;
  if (counting && time - endTickT > 0.07) { endTickT = time; tone(1500, 0.025, 'square', 0.035); }
  ctx.fillStyle = '#eaf4ff';
  ctx.font = '700 ' + (28 + (counting ? 2 : 0)) + 'px Audiowide, system-ui';
  ctx.fillText(shown.toLocaleString(), g.cx, g.cy + R * 0.1);
  ctx.fillStyle = 'rgba(160,215,255,0.7)'; ctx.font = '600 11px Audiowide, system-ui';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  ctx.fillText('SCORE', g.cx, g.cy + R * 0.1 + 20);
  try { ctx.letterSpacing = '0px'; } catch (e) {}

  // stats + best reveal after the count settles
  ctx.globalAlpha = pA * ph(T.stats, T.stats + 0.3);
  ctx.fillStyle = 'rgba(140,210,255,0.65)'; ctx.font = '11px monospace';
  ctx.fillText('zapped ' + zaps + '   //   perfect ' + perfects, g.cx, g.cy + R * 0.36);
  ctx.fillText('missed ' + misses + '   //   integrity ' + Math.round(integrity) + '%', g.cx, g.cy + R * 0.36 + 17);
  const bestVal = endless ? (daily ? (progress.daily && progress.daily.best) : progress.best) : PROG.bests[levelIdx];
  const isNew = endless ? (score >= (bestVal || 0) && score > 0) : endNewBest;
  if ((endless || (!qual && (endWin || (bestVal || 0) > 0))) && bestVal !== undefined) {
    ctx.fillStyle = isNew ? '#ffd24a' : 'rgba(255,210,74,0.7)';
    ctx.font = '700 13px Audiowide, system-ui';
    ctx.fillText((isNew ? 'NEW BEST  ' : 'BEST  ') + (bestVal || 0).toLocaleString(), g.cx, g.cy + R * 0.36 + 44);
  }
  // the investigation advances: one case-note line per secured relay
  if (endWin && !endless && !qual && levelIdx >= 0 && CASE_NOTES[levelIdx]) {
    ctx.globalAlpha = pA * ph(1.15, 1.5);
    ctx.fillStyle = 'rgba(255,210,74,0.8)';
    ctx.font = '600 9px Audiowide, system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(CASE_NOTES[levelIdx], g.cx, g.cy + R * 0.36 + 62);
  }

  // buttons live OUTSIDE the ring, in the side margins
  const bA = ph(btnAt, btnAt + 0.4);
  if (bA > 0.001) {
    ctx.globalAlpha = pA * bA;
    const rise = 14 * (1 - bA);
    const margin = g.cx - g.nodeR;
    const bw = Math.min(Math.max(margin * 0.82, 120), 200), bh = 50;
    const lx = margin / 2, rx = W - margin / 2;
    const primary = endWin && !endless && !qual && levelIdx + 1 < LEVELS.length
      ? { label: 'NEXT LEVEL ▸', action: 'next' }
      : { label: endWin ? 'REPLAY' : 'RETRY', action: 'retry' };
    const secondary = [];
    if (primary.action === 'next') secondary.push({ label: 'REPLAY', action: 'retry' });
    secondary.push({ label: 'MENU', action: 'menu' });
    button(rx - bw / 2, g.cy - bh / 2 + rise, bw, bh, primary.label, true);
    endButtons.push({ x: rx - bw / 2, y: g.cy - bh / 2, w: bw, h: bh, action: primary.action });
    let sy = g.cy - (secondary.length * bh + (secondary.length - 1) * 14) / 2;
    for (const b of secondary) {
      button(lx - bw / 2, sy + rise, bw, bh, b.label, false);
      endButtons.push({ x: lx - bw / 2, y: sy, w: bw, h: bh, action: b.action });
      sy += bh + 14;
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ---------- perf watchdog: shed visual load if the frame rate slips ----------
function perfWatch(rawDt) {
  if (lowFX || time < 5 || rawDt > 0.5) return; // ignore startup jank + tab-switch gaps
  perfAcc += rawDt; perfN++; perfWin += rawDt;
  if (perfWin >= 2) { // ~2s rolling window
    if (perfAcc / perfN > 1 / 42) { // sustained under ~42fps → permanently shed load
      lowFX = true;
      initStreaks();
      wallSnips.length = Math.min(wallSnips.length, 14);
    }
    perfAcc = 0; perfN = 0; perfWin = 0;
  }
}

// ---------- main loop ----------
let last = performance.now();
// ---------- screen transitions + button press feedback ----------
// glitch: quick chromatic slice cut for menu screens. warp: a dive down the
// fiber for deploys. The action fires at the covered midpoint.
let trans = null;   // {mode, t, dur, mid, fired}
let uiPress = null; // {x,y,w,h | sector, t, fn}
// choreographed menu moves: the wheel spins out/in, map panels fly in/out,
// deploys LAUNCH the whole menu at the viewer
let menuFx = null;  // {kind:'spinOut'|'spinIn'|'panelsIn'|'panelsOut'|'launch', t, dur, to, action}
function startTrans(mode, fn) {
  if (trans) { if (fn) fn(); return; }
  trans = { mode, t: 0, dur: mode === 'warp' ? 0.62 : 0.26, mid: fn, fired: false };
  if (mode === 'warp') { tone(70, 0.55, 'sine', 0.13, 260); crackle(0.5, 200, 2600, 1.2, 0.4); }
  else crackle(0.09, 1200, 3200, 2, 0.35);
}
function pressUI(rect, fn) { // micro-interaction: flash NOW, act on the beat
  uiPress = Object.assign({ t: 0, fn }, rect);
  sfx.tick();
  buzz(8);
}
function tickUI(dt) {
  if (uiPress) {
    uiPress.t += dt;
    if (uiPress.t >= 0.09 && uiPress.fn) { const f = uiPress.fn; uiPress.fn = null; f(); }
    if (uiPress.t > 0.3) uiPress = null;
  }
  if (trans) {
    trans.t += dt;
    if (!trans.fired && trans.t >= trans.dur * 0.5) { trans.fired = true; if (trans.mid) trans.mid(); }
    if (trans.t >= trans.dur) trans = null;
  }
  campScroll += (campScrollTgt - campScroll) * Math.min(1, dt * 8); // carousel glide
  if (menuFx) {
    menuFx.t += dt;
    if (menuFx.t >= menuFx.dur) {
      const f = menuFx;
      menuFx = null;
      if (f.kind === 'spinOut') {
        menuScreen = f.to;
        menuFx = f.to === 'map' ? { kind: 'panelsIn', t: 0, dur: 0.6, dir: f.dir || 1 }
          : { kind: 'spinIn', t: 0, dur: 0.35, dir: f.dir || 1 };
      } else if (f.kind === 'discZoom') {
        // the disc became the tunnel — its relay map takes over
        menuScreen = 'map';
        menuFx = { kind: 'panelsIn', t: 0, dur: 0.6, dir: 1, fromDisc: true };
      } else if (f.kind === 'panelsOut') {
        // backing out of the map: with several campaigns the disc shrinks
        // back into its slot on the carousel; single campaign goes home
        if (CAMPAIGNS.length > 1) {
          menuScreen = 'camps';
          const di = Math.max(0, CAMPAIGNS.indexOf(CAMP));
          campScroll = campScrollTgt = di;
          menuFx = { kind: 'discOut', t: 0, dur: 0.5, disc: di };
        } else {
          menuScreen = 'home';
          menuFx = { kind: 'spinIn', t: 0, dur: 0.35, dir: -1 }; // back = counterclockwise
        }
      } else if (f.kind === 'launch' && f.action) f.action();
    }
  }
}
// map fly-ins: per-row offset from the left (staggered head to tail), dossier
// from the right — reversed on the way out and during a launch
function menuRowOff(i, rows) {
  if (!menuFx) return 0;
  const span = 220 + SAFE.l;
  if (menuFx.kind === 'panelsIn') {
    const q = clamp((menuFx.t - i / rows * 0.28) / 0.32, 0, 1);
    return -span * Math.pow(1 - q, 2);
  }
  if (menuFx.kind === 'panelsOut' || menuFx.kind === 'launch') {
    const q = clamp((menuFx.t - i / rows * 0.16) / 0.26, 0, 1);
    return -span * q * q;
  }
  return 0;
}
function menuCardOff() {
  if (!menuFx) return 0;
  const span = W * 0.42;
  if (menuFx.kind === 'panelsIn') return span * Math.pow(1 - clamp(menuFx.t / 0.45, 0, 1), 2);
  if (menuFx.kind === 'panelsOut' || menuFx.kind === 'launch') return span * Math.pow(clamp(menuFx.t / 0.3, 0, 1), 2);
  return 0;
}
function drawTrans() {
  if (uiPress && uiPress.t < 0.2) { // the pressed control flashes bright
    const pa = (1 - uiPress.t / 0.2) * 0.8;
    ctx.save();
    ctx.strokeStyle = `rgba(255,255,255,${pa.toFixed(2)})`;
    ctx.lineWidth = 2.5;
    if (uiPress.sector) {
      const sc = uiPress.sector;
      ctx.beginPath();
      ctx.arc(sc.cx, sc.cy, sc.r1, sc.a0, sc.a1);
      ctx.arc(sc.cx, sc.cy, sc.r0, sc.a1, sc.a0, true);
      ctx.closePath(); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${(pa * 0.16).toFixed(2)})`; ctx.fill();
    } else if (uiPress.seg) { // circle-segment keys flash in their own shape
      const sg = uiPress.seg;
      const a2 = Math.asin(clamp(sg.d / sg.r, 0, 1));
      ctx.beginPath();
      ctx.arc(sg.cx, sg.cy, sg.r, a2, Math.PI - a2);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${(pa * 0.16).toFixed(2)})`; ctx.fill();
    } else if (uiPress.w) {
      techRect(uiPress.x - 2, uiPress.y - 2, uiPress.w + 4, uiPress.h + 4, 8);
      ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${(pa * 0.16).toFixed(2)})`;
      techRect(uiPress.x - 2, uiPress.y - 2, uiPress.w + 4, uiPress.h + 4, 8); ctx.fill();
    }
    ctx.restore();
  }
  if (!trans) return;
  const q = trans.t / trans.dur;
  const cover = 1 - Math.abs(q * 2 - 1); // 0 -> 1 (switch) -> 0
  if (trans.mode === 'glitch') {
    ctx.fillStyle = `rgba(2,4,10,${(cover * 0.9).toFixed(2)})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    for (let i = 0; i < 9; i++) { // chromatic slices tearing sideways
      const y0 = i / 9 * H + Math.sin(i * 37.7 + trans.t * 90) * 4;
      const hh = H / 9 * (0.3 + 0.7 * Math.abs(Math.sin(i * 91.3 + trans.t * 47)));
      const off = Math.sin(i * 13.7 + trans.t * 71) * W * 0.2 * cover;
      ctx.fillStyle = i % 3 === 0 ? `rgba(255,60,90,${(cover * 0.22).toFixed(2)})`
        : i % 3 === 1 ? `rgba(111,227,255,${(cover * 0.22).toFixed(2)})`
        : `rgba(220,235,255,${(cover * 0.15).toFixed(2)})`;
      ctx.fillRect(off, y0, W, hh * cover);
    }
  } else { // warp: streaks stretch down the fiber, bloom at the switch
    const g2 = geo();
    ctx.fillStyle = `rgba(2,4,10,${(cover * 0.55).toFixed(2)})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    const ease = cover * cover;
    ctx.lineCap = 'round';
    for (let i = 0; i < 44; i++) {
      const a = i / 44 * TAU + Math.sin(i * 7.13) * 0.2;
      const r0 = (0.08 + (i * 0.618 % 1) * 0.9) * Math.min(W, H) * 0.7;
      const st = ease * Math.min(W, H) * (0.25 + (i * 0.377 % 1) * 0.55);
      ctx.strokeStyle = i % 4 === 0 ? `rgba(255,210,74,${(ease * 0.5).toFixed(2)})`
        : `rgba(140,215,255,${(ease * 0.55).toFixed(2)})`;
      ctx.lineWidth = 1 + ease * 2;
      ctx.beginPath();
      ctx.moveTo(g2.cx + Math.cos(a) * r0, g2.cy + Math.sin(a) * r0);
      ctx.lineTo(g2.cx + Math.cos(a) * (r0 + st), g2.cy + Math.sin(a) * (r0 + st));
      ctx.stroke();
    }
    const bloom = clamp(1 - Math.abs(q - 0.5) * 4, 0, 1);
    if (bloom > 0) {
      const bg2 = ctx.createRadialGradient(g2.cx, g2.cy, 0, g2.cx, g2.cy, Math.min(W, H) * 0.7);
      bg2.addColorStop(0, `rgba(235,248,255,${(bloom * 0.8).toFixed(2)})`);
      bg2.addColorStop(1, 'rgba(235,248,255,0)');
      ctx.fillStyle = bg2;
      ctx.fillRect(0, 0, W, H);
    }
  }
}

function frame(now) {
  const rawDt = (now - last) / 1000;
  let dt = clamp(rawDt, 0, 0.05); // clock can step backwards (timer quirks) — never simulate in reverse
  last = now;
  perfWatch(rawDt);
  // tunnel designer hook: editor.html feeds the sim clock (0 = hold the world,
  // draw only). The global never exists in the game — this line is inert here.
  if (globalThis.EDITOR_DRIVE) dt = EDITOR_DRIVE(dt);
  update(dt);
  if (state !== S.PLAY) stripSound(false, 0); // pause/menus never hold the drone
  ambient(state === S.PLAY); // the tunnel bed breathes only during play

  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 6, rand(-1, 1) * shake * 6);

  // background
  ctx.clearRect(-20, -20, W + 40, H + 40);
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawLiveBg(dt);

  const g = geo();

  // the tunnel fills the whole screen — no clipping, we're inside it
  drawTunnel(g);
  drawLattice(g);
  drawRangeRings(g);
  drawSurgeWave(g);
  drawWallCode(g, dt);
  drawStreaks(g, dt);
  // warm glow rising off the golden river
  const rgl = ctx.createRadialGradient(g.cx, H * 0.95, 0, g.cx, H * 0.95, Math.min(W, H) * 0.75);
  rgl.addColorStop(0, 'rgba(255,180,70,0.12)');
  rgl.addColorStop(1, 'rgba(255,180,70,0)');
  ctx.fillStyle = rgl;
  ctx.fillRect(0, 0, W, H);

  // atmospheric depth fog — mid-distance haze inside the tunnel
  const fogG = ctx.createRadialGradient(g.cx, g.cy, g.nodeR * 0.1, g.cx, g.cy, g.nodeR * 1.4);
  fogG.addColorStop(0, 'rgba(10,22,48,0)');
  fogG.addColorStop(0.45, 'rgba(10,22,48,0.12)');
  fogG.addColorStop(1, 'rgba(10,22,48,0)');
  ctx.fillStyle = fogG;
  ctx.fillRect(0, 0, W, H);

  // node holder ring: thick matte black like the mock, with faked soft shadow for depth
  const bz = Math.min(W, H) * 0.055;
  // boot: the ring launches from the operator's own viewpoint and flies INTO
  // the tunnel, braking into the dock — perspective-true (the same 1/(1+6z)
  // law as the traffic), so it reads as deploying hardware, not a UI transition
  const bootRing = (state === S.PLAY || state === S.PAUSE) && introT < INTRO_DUR + 1;
  const ringS = bootRingS(g);
  if (bootRing && introT < BOOT_LOCK) {
    const p = clamp(introT / BOOT_LOCK, 0, 1);
    // dock markers wait at the rim: hairline target circle + four braces
    const ba = 0.5 + 0.4 * p;
    ctx.setLineDash([3, 9]);
    ctx.strokeStyle = `rgba(160,220,255,${(ba * 0.35).toFixed(2)})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = `rgba(160,220,255,${(ba * 0.8).toFixed(2)})`;
    for (let k = 0; k < 4; k++) {
      const a2 = k * Math.PI / 2 + Math.PI / 4;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, a2 - 0.09, a2 + 0.09); ctx.stroke();
    }
  }
  if (ringS !== 1) {
    ctx.save();
    ctx.translate(g.cx, g.cy); ctx.scale(ringS, ringS); ctx.translate(-g.cx, -g.cy);
    ctx.globalAlpha = 0.35 + 0.65 * clamp(introT / BOOT_LOCK, 0, 1); // condenses out of the eye
  }
  if (state !== S.MENU) { // the PHYSICAL ring exists only in the game — menus
    // stay open so the boot's ring arrival lands with real contrast
    ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = bz * 3.0;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = bz * 2.2;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = bz * 1.6;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU);
    ctx.strokeStyle = 'rgba(3,6,11,0.96)'; ctx.lineWidth = bz; ctx.stroke();
    // cold specular catch on the upper-left of the ring
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz - 1.5, Math.PI * 0.95, Math.PI * 1.55);
    ctx.strokeStyle = 'rgba(180,230,255,0.30)'; ctx.lineWidth = 2; ctx.stroke();
    // warm river light reflecting off the ring's lower edge
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + 1.5, Math.PI * 0.28, Math.PI * 0.72);
    ctx.strokeStyle = 'rgba(255,190,100,0.28)'; ctx.lineWidth = 2.5; ctx.stroke();
    // maglev rails on the ring's inner face — the node carriages ride these
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR - bz * 0.62, 0, TAU);
    ctx.strokeStyle = 'rgba(120,220,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR - bz * 1.1, 0, TAU);
    ctx.strokeStyle = 'rgba(120,220,255,0.20)'; ctx.lineWidth = 1; ctx.stroke();
  }
  if (ringS !== 1) { ctx.restore(); ctx.globalAlpha = 1; }
  // the dock: a rim flare and white/blue shockwaves ring off the lock moment
  if (bootRing) {
    const lp = introT - BOOT_LOCK;
    if (lp >= 0 && lp < 0.85) {
      ctx.save(); ctx.lineCap = 'butt';
      const flare = clamp(1 - lp / 0.25, 0, 1);
      if (flare > 0) {
        ctx.strokeStyle = `rgba(235,250,255,${(flare * 0.85).toFixed(2)})`;
        ctx.lineWidth = bz * 0.5;
        ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, 0, TAU); ctx.stroke();
      }
      for (const [dly, col, dir, spread] of [
        [0, '235,250,255', 1, 0.5],    // white pulse out
        [0.12, '111,227,255', 1, 0.5], // blue pulse chasing it
        [0.06, '111,227,255', -1, 0.3] // faint blue pulse collapsing inward
      ]) {
        const q = (lp - dly) / 0.6;
        if (q <= 0 || q >= 1) continue;
        const e2 = 1 - Math.pow(1 - q, 2);
        ctx.strokeStyle = `rgba(${col},${((1 - q) * (dir > 0 ? 0.6 : 0.35)).toFixed(2)})`;
        ctx.lineWidth = 2.5 * (1 - q) + 0.5;
        ctx.beginPath();
        ctx.arc(g.cx, g.cy, (g.nodeR + bz / 2) * (1 + dir * e2 * spread), 0, TAU);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // reactive rim: zaps and misses light the segment they happened on
  for (const fx2 of rimFX) {
    const al = Math.min(1, (fx2.t / 0.45) * 0.85);
    ctx.strokeStyle = 'rgba(' + fx2.col + ',' + al.toFixed(2) + ')';
    ctx.lineWidth = bz * 0.7;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR + bz / 2, fx2.a - 0.3, fx2.a + 0.3); ctx.stroke();
  }
  // a wounded rim sputters
  if (state === S.PLAY && integrity <= 25 && Math.random() < 0.25) {
    const ra = Math.random() * TAU;
    burst(g.cx + Math.cos(ra) * (g.nodeR + bz / 2), g.cy + Math.sin(ra) * (g.nodeR + bz / 2), '#8fc7ff', 2, 2);
  }
  drawLatches(g, bz);
  if (state !== S.MENU) drawArrivalPings(g);
  if (shieldCharge > 0 && state !== S.MENU) {
    // the shield is a SECOND RAIL: an armed catch-ring standing just behind
    // the rim, visibly waiting to eat the next breach
    const sr = g.nodeR + Math.min(W, H) * 0.032;
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.15 * Math.sin(time * 3);
    ctx.strokeStyle = 'rgba(143,224,255,0.95)';
    ctx.lineWidth = Math.min(W, H) * 0.008;
    ctx.setLineDash([26, 14]);
    ctx.lineDashOffset = time * 26; // it patrols, slowly
    ctx.beginPath(); ctx.arc(g.cx, g.cy, sr, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha *= 0.35;
    ctx.lineWidth *= 3.2;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, sr, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (shieldFlashT > 0 && state !== S.MENU) { // the catch: the rail flares as it eats the breach
    const q = 1 - shieldFlashT / 0.5;
    ctx.save();
    ctx.globalAlpha = (1 - q) * 0.8;
    ctx.strokeStyle = 'rgba(143,224,255,1)';
    ctx.lineWidth = Math.min(W, H) * (0.012 - q * 0.008);
    ctx.beginPath(); ctx.arc(g.cx, g.cy, (g.nodeR + Math.min(W, H) * 0.032) * (1 + q * 0.25), 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // traps render over the ring — missed ones fly past the player and fade
  const sorted = enemies.slice().sort((a, b) => b.z - a.z);
  for (const en of sorted) if (en.lineLead) drawLineBeam(en, g); // beams sit under the traps
  for (const en of sorted) drawEnemy(en, g);
  for (const p of pickups) drawPickup(p, g);
  drawPulseWave(g);
  drawClearSweep(g);
  if (boss && state !== S.MENU) drawBoss(g);

  if (state !== S.MENU) drawNodes(g);
  if (state !== S.MENU) drawVolley(g);

  // particles + popups (over everything)
  ctx.lineCap = 'round';
  for (const p of particles) {
    // data bits: fine streaks along their motion, not blobs — light in fiber
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = Math.max(0.5, p.size * 0.6);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 2.4 - 0.5, p.y - p.vy * 2.4 - 0.5);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  drawBolts();
  if (killStreaks.length) { // reprogrammed packets tracing home along the wall
    const g2 = geo(), u = Math.min(W, H);
    const P = (aa, z) => { const rg = ring(z, g2); return { x: rg.x + Math.cos(aa) * rg.r, y: rg.y + Math.sin(aa) * rg.r, s: rg.s }; };
    ctx.globalCompositeOperation = 'lighter';
    const DUR = 0.55, RUN = 0.62; // a fixed stretch of the bore, mock-sized
    for (const st of killStreaks) {
      const q = st.t / DUR;
      const glob = q < 0.72 ? 1 : 1 - (q - 0.72) / 0.28;
      const zHead = st.z + RUN * (1 - Math.pow(1 - q, 2));   // the head eases forward
      const zTail = Math.max(st.z, zHead - RUN * (0.30 + 0.5 * q)); // the tail lets go late
      if (zTail >= SPAWN_Z) continue;
      const SEG = 6;
      for (let i = 0; i < SEG; i++) {
        const f0 = i / SEG, f1 = (i + 1) / SEG; // 0 = tail, 1 = head
        const z0 = Math.min(lerp(zTail, zHead, f0), SPAWN_Z), z1 = Math.min(lerp(zTail, zHead, f1), SPAWN_Z);
        const wa0 = 0.05 * (0.35 + f0 * 0.65), wa1 = 0.05 * (0.35 + f1 * 0.65); // fat at the head
        const c00 = P(st.a - wa0, z0), c01 = P(st.a + wa0, z0);
        const c11 = P(st.a + wa1, z1), c10 = P(st.a - wa1, z1);
        ctx.globalAlpha = glob * (0.12 + 0.30 * f0);
        ctx.fillStyle = 'rgb(126,226,98)';
        ctx.beginPath();
        ctx.moveTo(c00.x, c00.y); ctx.lineTo(c01.x, c01.y);
        ctx.lineTo(c11.x, c11.y); ctx.lineTo(c10.x, c10.y);
        ctx.closePath(); ctx.fill();
      }
      // white-hot filament along the spine, brightest at the head
      ctx.lineCap = 'round';
      for (let i = 0; i < SEG; i++) {
        const p0 = P(st.a, lerp(zTail, zHead, i / SEG)), p1 = P(st.a, Math.min(lerp(zTail, zHead, (i + 1) / SEG), SPAWN_Z));
        ctx.globalAlpha = glob * (0.15 + 0.7 * (i / SEG));
        ctx.strokeStyle = 'rgba(228,255,220,0.95)';
        ctx.lineWidth = u * 0.0035 * (0.5 + (i / SEG));
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
      }
      ctx.lineCap = 'butt';
      const hp = P(st.a, Math.min(zHead, SPAWN_Z)); // the head: a hot green mote
      const hr = u * 0.016 * (hp.s / 0.4);
      const gl = ctx.createRadialGradient(hp.x, hp.y, 0, hp.x, hp.y, hr);
      gl.addColorStop(0, 'rgba(235,255,230,' + (0.9 * glob).toFixed(2) + ')');
      gl.addColorStop(1, 'rgba(126,226,98,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(hp.x, hp.y, hr, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'center';
  for (const p of popups) {
    const al = clamp(p.life, 0, 1);
    ctx.font = '700 15px Audiowide, system-ui';
    const tw = ctx.measureText(p.text).width;
    const px = clamp(p.x, tw / 2 + 12, W - tw / 2 - 12); // plates stay on screen
    ctx.globalAlpha = al * 0.72; // backing plate so popups read over any traffic
    ctx.fillStyle = 'rgba(4,10,22,0.9)';
    roundRect(px - tw / 2 - 9, p.y - 15, tw + 18, 21, 6); ctx.fill();
    ctx.globalAlpha = al * 0.5;
    ctx.strokeStyle = p.color; ctx.lineWidth = 1;
    roundRect(px - tw / 2 - 9, p.y - 15, tw + 18, 21, 6); ctx.stroke();
    ctx.globalAlpha = al;
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, px, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // cinematic vignette + color grade (under the HUD so controls stay crisp)
  if (vignetteCanvas) ctx.drawImage(vignetteCanvas, 0, 0, W, H);
  const grade = ctx.createLinearGradient(0, 0, 0, H);
  grade.addColorStop(0, 'rgba(18,55,110,0.10)');   // cool up top
  grade.addColorStop(0.55, 'rgba(0,0,0,0)');
  grade.addColorStop(1, 'rgba(255,150,50,0.08)');  // warm river light below
  ctx.fillStyle = grade;
  ctx.fillRect(0, 0, W, H);

  // per-level color identity: each relay tints the air at the edges
  if ((state === S.PLAY || state === S.PAUSE || state === S.INFO) && LV && LV.tint) {
    const tg2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    tg2.addColorStop(0, `rgba(${LV.tint},0)`);
    tg2.addColorStop(1, `rgba(${LV.tint},0.11)`);
    ctx.fillStyle = tg2;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === S.PLAY) { drawHUD(g); drawDials(); drawIntroCard(); }
  else if (state === S.PAUSE) { drawHUD(g); drawDials(); drawIntroCard(); drawPause(); }
  else if (state === S.INFO) { drawHUD(g); drawDials(); drawIntroCard(); drawInfoCard(); }
  else if (state === S.MENU) {
    if (menuFx && menuFx.kind === 'launch') {
      const q = clamp(menuFx.t / menuFx.dur, 0, 1), e2 = q * q;
      ctx.save();
      ctx.translate(g.cx, g.cy); ctx.scale(1 + e2 * 1.7, 1 + e2 * 1.7); ctx.translate(-g.cx, -g.cy);
      ctx.globalAlpha = 1 - e2;
      drawMenu(g);
      ctx.restore();
    } else if (menuFx && menuFx.zoom) {
      // launch, run backwards: the menu lives BEHIND the run, so returning
      // from a level it drives back into view — oversized and faint, settling
      const q = clamp(menuFx.t / menuFx.dur, 0, 1), e2 = (1 - q) * (1 - q);
      ctx.save();
      ctx.translate(g.cx, g.cy); ctx.scale(1 + e2 * 1.7, 1 + e2 * 1.7); ctx.translate(-g.cx, -g.cy);
      ctx.globalAlpha = 1 - e2;
      drawMenu(g);
      ctx.restore();
    } else drawMenu(g);
  }
  else drawEnd(g);
  drawGpFocus(); // controller focus ring rides on top of whatever screen owns the buttons
  drawGpHints();

  // system-critical glitches — the screen itself degrades with the payload
  if (state === S.PLAY && integrity <= 50) {
    const gi = (50 - integrity) / 50;
    if (Math.random() < 0.15 + gi * 0.35) {
      for (let i = 0; i < 1 + gi * 3; i++) {
        const gy = Math.random() * H, gh = rand(2, 6 + gi * 10);
        ctx.fillStyle = 'rgba(90,220,255,' + (0.04 + gi * 0.07).toFixed(2) + ')';
        ctx.fillRect(0, gy, W, gh);
        ctx.fillStyle = 'rgba(255,60,80,' + (0.03 + gi * 0.06).toFixed(2) + ')';
        ctx.fillRect(rand(-30, 30), gy + gh, W, 2);
      }
    }
    if (integrity <= 25) { // heartbeat vignette on the last block
      const pulse = (Math.sin(time * 5) * 0.5 + 0.5) * 0.22;
      const hv = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
      hv.addColorStop(0, 'rgba(255,40,60,0)');
      hv.addColorStop(1, 'rgba(255,40,60,' + pulse.toFixed(2) + ')');
      ctx.fillStyle = hv; ctx.fillRect(0, 0, W, H);
    }
  }

  // red damage vignette
  if (redFlash > 0) {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    v.addColorStop(0, 'rgba(255,40,60,0)');
    v.addColorStop(1, `rgba(255,40,60,${(redFlash * 0.4).toFixed(2)})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  // screen-stitch fade between scenes
  if (fadeT > 0) {
    fadeT = Math.max(0, fadeT - rawDt);
    ctx.fillStyle = 'rgba(2,4,10,' + (fadeT / 0.35 * 0.9).toFixed(2) + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  drawTrans(); // transitions + press feedback ride over everything

  ctx.restore();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
// offline capability + PWA installability (no-op on insecure origins)
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// try to start the soundtrack right away — the Capacitor app WebView allows it;
// desktop browsers that block autoplay simply start it on the first tap instead
// (deferred a tick: the MUSIC_DATA manifest script below hasn't parsed yet)
setTimeout(() => { if (state === S.MENU) playTrack('menu'); }, 0);
</script>
<script>
// ---------- soundtrack manifest ----------
// menu: View From The Dashboard · L1: Sub Level Three · L2: Steel and Rain · L3: Terminal Velocity
window.MUSIC_DATA = {
  menu: 'audio/View_From_The_Dashboard.mp3',
  levels: [
    'audio/Sub_Level_Three.mp3',
    'audio/Steel_and_Rain.mp3',
    'audio/Terminal_Velocity.mp3'
  ]
};
</script>
</body>

}
// the triad's energy links: crackling filaments strung between the bodies —
// the visual proof this is ONE machine in three bodies. Deterministic sin
// jitter (no RNG, no allocations) keeps the crackle alive and phones happy.
function drawTriadLinks(g) {
  const b = boss;
  ctx.save();
  ctx.lineCap = 'round';
  const SEG = 7;
  for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {
    const c1 = b.cores[i], c2 = b.cores[j];
    if (c1.dead || c2.dead) continue; // a dead body drops its links
    let nx = -(c2.sy - c1.sy), ny = c2.sx - c1.sx;
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;
    const amp0 = Math.min(c1.sSize, c2.sSize) * 0.35;
    for (const [lw, col, amp] of [
      [Math.max(2, c1.sSize * 0.16), 'rgba(212,101,255,0.22)', 0.45],
      [Math.max(1, c1.sSize * 0.05), 'rgba(255,120,150,0.75)', 1]
    ]) {
      ctx.strokeStyle = col;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(c1.sx, c1.sy);
      for (let k = 1; k < SEG; k++) {
        const q = k / SEG;
        const off = Math.sin(time * 13 + k * 5.1 + i * 7 + j * 3) * Math.sin(q * Math.PI) * amp0 * amp;
        ctx.lineTo(lerp(c1.sx, c2.sx, q) + nx * off, lerp(c1.sy, c2.sy, q) + ny * off);
      }
      ctx.lineTo(c2.sx, c2.sy);
      ctx.stroke();
    }
    // a data pulse rides each link — one bloodstream through three bodies
    const pq = (time * 0.7 + (i * 2 + j) * 0.37) % 1;
    const px2 = lerp(c1.sx, c2.sx, pq), py2 = lerp(c1.sy, c2.sy, pq);
    const pr2 = Math.max(2, c1.sSize * 0.14);
    const pg2 = ctx.createRadialGradient(px2, py2, 0, px2, py2, pr2 * 2.2);
    pg2.addColorStop(0, 'rgba(255,255,255,0.9)');
    pg2.addColorStop(0.4, 'rgba(212,101,255,0.5)');
    pg2.addColorStop(1, 'rgba(212,101,255,0)');
    ctx.fillStyle = pg2;
    ctx.beginPath(); ctx.arc(px2, py2, pr2 * 2.2, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
// the BEACON's lighthouse beam — drawn as LIGHT, never a surface: a white-hot
// filament in a soft additive wedge from the lamp to beyond the ring, plus a
// hazard bloom where the light rakes the rail (the WYSIWYG danger readout)
function drawSpinnerBeam(g) {
  const b = boss;
  const A = b.beamA;
  const exR = g.R0 * 1.05; // past the ring — the light leaves the screen
  const ex = g.cx + Math.cos(A) * exR, ey2 = g.cy + Math.sin(A) * exR;
  if (b.mode === 'tele') { // the ghost line sweeps up: aim first, fire second
    const pl = 0.35 + Math.sin(time * 14) * 0.22;
    ctx.save();
    ctx.setLineDash([6, 9]);
    ctx.strokeStyle = `rgba(255,210,74,${pl.toFixed(2)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.lineTo(ex, ey2); ctx.stroke();
    ctx.setLineDash([]);
    for (let k = 1; k <= 3; k++) { // chevrons lead the coming rotation
      const a2 = A + b.beamDir * 0.18 * k;
      ctx.strokeStyle = `rgba(255,210,74,${(pl * (1 - k * 0.25)).toFixed(2)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, a2 - 0.035, a2 + 0.035); ctx.stroke();
    }
    ctx.restore();
    return;
  }
  if (b.mode !== 'sweep') return;
  ctx.save();
  // the glow wedge
  const wr = Math.hypot(ex - b.sx, ey2 - b.sy);
  const wg2 = ctx.createRadialGradient(b.sx, b.sy, b.sSize * 0.3, b.sx, b.sy, wr);
  wg2.addColorStop(0, 'rgba(255,244,200,0.5)');
  wg2.addColorStop(0.35, 'rgba(255,214,110,0.22)');
  wg2.addColorStop(1, 'rgba(255,190,80,0.05)');
  ctx.fillStyle = wg2;
  const HW = 0.16; // wedge half-angle
  ctx.beginPath();
  ctx.moveTo(b.sx, b.sy);
  ctx.lineTo(g.cx + Math.cos(A - HW) * exR, g.cy + Math.sin(A - HW) * exR);
  ctx.arc(g.cx, g.cy, exR, A - HW, A + HW);
  ctx.closePath(); ctx.fill();
  // the filament — constant angular speed, readable and fair
  ctx.lineCap = 'round';
  for (const [lw, col] of [[9, 'rgba(255,214,110,0.35)'], [4, 'rgba(255,240,200,0.8)'], [1.6, 'rgba(255,255,255,0.98)']]) {
    ctx.strokeStyle = col;
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.lineTo(ex, ey2); ctx.stroke();
  }
  // hazard bloom where the light crosses the ring
  ctx.strokeStyle = `rgba(255,120,60,${(0.55 + Math.sin(time * 22) * 0.2).toFixed(2)})`;
  ctx.lineWidth = Math.min(W, H) * 0.02;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.nodeR, A - SPIN_BEAM_HALF, A + SPIN_BEAM_HALF); ctx.stroke();
  const hx = g.cx + Math.cos(A) * g.nodeR, hy = g.cy + Math.sin(A) * g.nodeR;
  if (Math.random() < 0.5) burst(hx, hy, '#ffd9a0', 1, 2.5);
  ctx.restore();
}
// the fused ray cannon: aim barrel + a straight perspective-tapered beam
function drawBeam(g) {
  const b = boss;
  if (!b || b.mergeT < 1) return;
  const seg = beamGeometry(g);
  const size = Math.min(W, H) * 0.038;
  const heatCol = heat < 0.5 ? '140,225,255' : heat < 0.8 ? '255,190,90' : '255,90,70';
  const bAng = Math.atan2(seg.ty - seg.sy, seg.tx - seg.sx);
  // barrel tracks the ray
  ctx.save();
  ctx.translate(seg.sx, seg.sy);
  ctx.rotate(bAng);
  ctx.fillStyle = '#0d1626';
  roundRect(0, -size * 0.24, size * 1.5, size * 0.48, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(' + heatCol + ',0.9)'; ctx.lineWidth = 1.5;
  roundRect(0, -size * 0.24, size * 1.5, size * 0.48, 4); ctx.stroke();
  ctx.fillStyle = 'rgba(' + heatCol + ',' + (0.35 + heat * 0.6).toFixed(2) + ')';
  ctx.fillRect(size * 0.25, -size * 0.12, size * 1.1 * heat, size * 0.24); // heat window
  ctx.restore();
  if (!beamActive) return;
  // endpoint: the core when the ray connects, else the wall/deep exit
  const hit = beamHitCore(g);
  const dx = seg.tx - seg.sx, dy = seg.ty - seg.sy;
  const len = Math.hypot(dx, dy) || 1;
  let ex, ey, endScale;
  if (hit) {
    ex = seg.sx + dx / len * hit.t;
    ey = seg.sy + dy / len * hit.t;
    endScale = Math.max(0.15, ring(b.z, g).s / ring(g.hitZ, g).s);
  } else {
    ex = seg.tx; ey = seg.ty;
    endScale = Math.max(0.12, seg.endS);
  }
  const bx0 = seg.sx + Math.cos(bAng) * size * 1.4, by0 = seg.sy + Math.sin(bAng) * size * 1.4;
  const wob = Math.sin(time * 40) * 1.5;
  ctx.lineCap = 'round';
  const SEGS = 10;
  for (const [wBase, col] of [[13 + wob, 'rgba(' + heatCol + ',0.30)'], [6, 'rgba(' + heatCol + ',0.7)'], [2.2, 'rgba(255,255,255,0.95)']]) {
    ctx.strokeStyle = col;
    for (let i = 1; i <= SEGS; i++) {
      const t0 = (i - 1) / SEGS, t1 = i / SEGS;
      ctx.lineWidth = Math.max(0.4, wBase * lerp(1, endScale, (t0 + t1) / 2));
      ctx.beginPath();
      ctx.moveTo(lerp(bx0, ex, t0), lerp(by0, ey, t0));
      ctx.lineTo(lerp(bx0, ex, t1), lerp(by0, ey, t1));
      ctx.stroke();
    }
  }
  if (hit) { // impact bloom on the core
    const ig = ctx.createRadialGradient(b.sx, b.sy, 0, b.sx, b.sy, b.sSize * 1.5);
    ig.addColorStop(0, 'rgba(255,255,255,0.85)');
    ig.addColorStop(0.4, 'rgba(' + heatCol + ',0.5)');
    ig.addColorStop(1, 'rgba(' + heatCol + ',0)');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(b.sx, b.sy, b.sSize * 1.5, 0, TAU); ctx.fill();
  } else if (seg.zExit < 0.99) { // scorch spark where the ray rakes the tunnel wall
    ctx.fillStyle = 'rgba(' + heatCol + ',0.7)';
    ctx.beginPath(); ctx.arc(ex, ey, Math.max(2, 9 * endScale), 0, TAU); ctx.fill();
    if (Math.random() < 0.4) burst(ex, ey, '#ffd9a0', 1, 2);
  }
}

function drawNodes(g) {
  const bzn = Math.min(W, H) * 0.055;
  const railR = g.nodeR - bzn * 0.86;             // carriages ride the rails on the ring's inner face
  const nearR = { x: g.cx, y: g.cy, r: railR };
  const fused = boss && boss.mergeT >= 1;
  // boot: the carriages fly in mounted on the ring, one piece of hardware
  const bs0 = bootRingS(g);
  if (bs0 !== 1) {
    ctx.save();
    ctx.translate(g.cx, g.cy); ctx.scale(bs0, bs0); ctx.translate(-g.cx, -g.cy);
    ctx.globalAlpha = 0.35 + 0.65 * clamp(introT / BOOT_LOCK, 0, 1);
  }
  for (let i = 0; i < 2; i++) {
    if (fused && i === 1) continue; // one combined cannon carriage
    const n = nodes[i];
    const size = Math.min(W, H) * 0.038 * (fused ? 1.35 : 1);
    const rr2 = nearR.r - (n.recoil || 0) * size * 0.55; // zap recoil kicks the sled inward
    const x = nearR.x + Math.cos(n.angle) * rr2;
    const y = nearR.y + Math.sin(n.angle) * rr2;
    const cCol = fused ? '160,240,255' : i === 0 ? '111,227,255' : '255,255,255';
    // boot: dark through the flight, then a node-killer-style reboot ramp from
    // the dock to this node's online mark — same rb drives the same visuals
    // (amber progress ring, strengthening ember, sputter)
    const bootRb = state !== S.MENU && introT < INTRO_DUR
      ? clamp((BOOT_ON - introT) / (BOOT_ON - BOOT_LOCK), 0, 1) : 0;
    const rb = Math.max(clamp((n.deadT || 0) / 2, 0, 1), bootRb); // >0: fried / not yet powered
    const formAge = introT - (n.formAt || 0);
    const eb = t2 => 1 + 2.70158 * Math.pow(t2 - 1, 3) + 1.70158 * Math.pow(t2 - 1, 2); // easeOutBack
    const fscale = formAge < 0.35 ? Math.max(0.01, eb(clamp(formAge / 0.35, 0, 1))) : 1;
    // lightcycle ribbon trail
    const vel = angDiff(n.angle, n.prevA === undefined ? n.angle : n.prevA);
    n.trailV = (n.trailV || 0) * 0.8 + vel * 0.2;
    n.prevA = n.angle;
    const tl = clamp(Math.abs(n.trailV) * 10, 0, 1.5);
    if (tl > 0.04) {
      const dir = Math.sign(n.trailV) || 1;
      ctx.lineCap = 'round';
      ctx.strokeStyle = `rgba(${cCol},0.3)`;
      ctx.lineWidth = size * 1.5;
      ctx.beginPath();
      ctx.arc(nearR.x, nearR.y, nearR.r, n.angle - dir * tl, n.angle, dir < 0);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(240,252,255,0.55)';
      ctx.lineWidth = size * 0.4;
      ctx.beginPath();
      ctx.arc(nearR.x, nearR.y, nearR.r, n.angle - dir * tl, n.angle, dir < 0);
      ctx.stroke();
    }
    // thruster sparks shed off a fast-sliding sled
    if (state === S.PLAY && Math.abs(n.trailV || 0) > 0.06 && Math.random() < 0.6) {
      const back = n.angle - Math.sign(n.trailV || 1) * 0.12;
      particles.push({
        x: nearR.x + Math.cos(back) * nearR.r, y: nearR.y + Math.sin(back) * nearR.r,
        vx: rand(-0.5, 0.5), vy: rand(-0.5, 0.5), life: 0.5, decay: 2.5,
        color: i === 0 ? '#6fe3ff' : '#ffffff', size: rand(1, 2.2)
      });
    }
    // coverage window — the gauge language of the pads, miniaturized on the
    // ring: translucent track between hairline rails, end ticks marking the
    // EXACT edge of the zap window. Grows/shrinks with wide-arc.
    if (!fused) {
      const cov = 0.314 * tolVis;
      const wideGlow = clamp((tolVis - 1) / 0.7, 0, 1);
      const rw = bzn * 0.24; // half-width of the miniature gauge band
      const covDim = rb > 0 ? 0.25 : 1; // an offline node covers nothing
      ctx.lineCap = 'butt';
      ctx.strokeStyle = `rgba(${cCol},${((0.22 + wideGlow * 0.18) * covDim).toFixed(2)})`;

      ctx.strokeStyle = `rgba(${cCol},${(0.55 * covDim).toFixed(2)})`;
      ctx.lineWidth = 1.2;
      for (const rr3 of [g.nodeR - rw, g.nodeR + rw]) {

      }
      ctx.lineWidth = 2;
      ctx.strokeStyle = `rgba(${cCol},${(0.8 * covDim).toFixed(2)})`;
      for (const ea of [n.angle - cov, n.angle + cov]) { // window edge ticks
        ctx.beginPath();
        ctx.moveTo(nearR.x + Math.cos(ea) * (g.nodeR - rw * 1.5), nearR.y + Math.sin(ea) * (g.nodeR - rw * 1.5));

        ctx.lineWidth = Math.max(1, lw2);
        ctx.beginPath();
        ctx.moveTo(tpx, -tpy);

    if (!fused) {

        ctx.beginPath();
        ctx.moveTo(size * 0.92, sy * size * 0.42);
        ctx.lineTo(dRing - size * 0.16, sy * size * 0.66);
        ctx.stroke();
      }
      ctx.fillStyle = `rgba(255,255,255,${(0.55 + slideGlow * 0.45).toFixed(2)})`;
      for (const sy of [-1, 1]) {
        ctx.beginPath(); ctx.arc(dRing, sy * size * 0.66, Math.max(1.4, size * 0.11) * (1 + slideGlow * 0.5), 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }
  if (bs0 !== 1) { ctx.restore(); ctx.globalAlpha = 1; }
  if (settings.controls === 2 && !fused) drawControlArcs(g);
  drawPulseOrbs(g);
}

// the unite-volley releases: a focused bolt from the docked nodes
function fireVolley(g) {
  const reach = SPAWN_Z; // the bolt runs the whole tunnel
  volley.charge = 0;
  volley.cd = 1.25; // re-charge gap — shooting crowds is worse than zapping them
  const a = volley.aimA !== undefined ? volley.aimA
    : nodes[0].angle + angDiff(nodes[1].angle, nodes[0].angle) / 2;
  const sh = { a, z: g.hitZ, reach, dead: false };
  if (boss && boss.introT >= BOSS_CER && boss.dying === undefined) {
    sh.homing = true; sh.t = 0; // the duel bolt hunts the core itself
    const railR = g.nodeR - Math.min(W, H) * 0.055 * 0.86;
    sh.sx0 = g.cx + Math.cos(a) * railR; sh.sy0 = g.cy + Math.sin(a) * railR;
    if (boss.kind === 'triad') { // the bolt answers to the AIM: nearest body wins
      const c = nearestTriadCore(a);
      sh.coreI = c ? c.i : 0;
    }
  }
  volley.shots.push(sh);
  for (const n of nodes) n.recoil = 1;
  const hx = g.cx + Math.cos(a) * g.nodeR, hy = g.cy + Math.sin(a) * g.nodeR;
  burst(hx, hy, '#bfeaff', 20, 5);
  burst(hx, hy, '#ffffff', 12, 6);
  tone(1900, 0.03, 'square', 0.09);   // capacitor snap
  crackle(0.22, 2400, 400, 2, 0.6);   // discharge
  tone(90, 0.15, 'sine', 0.14, 55);   // sub kick
  buzz([15, 10, 25]);
}
// charge halo + the bolt comet riding the bore
function drawVolley(g) {
  if (volley.charge > 0.02) {
    const a = volley.aimA !== undefined ? volley.aimA
      : nodes[0].angle + angDiff(nodes[1].angle, nodes[0].angle) / 2;
    const q = volley.charge / 0.5; // 0..1 through the half-second charge
    const hx = g.cx + Math.cos(a) * g.nodeR, hy = g.cy + Math.sin(a) * g.nodeR;
    const cr = Math.min(W, H) * 0.05 * (0.4 + q * 0.6);
    const cg2 = ctx.createRadialGradient(hx, hy, 0, hx, hy, cr);
    cg2.addColorStop(0, `rgba(255,255,255,${(0.35 + q * 0.6).toFixed(2)})`);
    cg2.addColorStop(0.45, `rgba(140,225,255,${(0.3 + q * 0.4).toFixed(2)})`);
    cg2.addColorStop(1, 'rgba(140,225,255,0)');
    ctx.fillStyle = cg2;
    ctx.beginPath(); ctx.arc(hx, hy, cr, 0, TAU); ctx.fill();
    // charge ring — when it closes, the bolt flies
    ctx.strokeStyle = `rgba(255,255,255,${(0.5 + q * 0.45).toFixed(2)})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(hx, hy, cr * 0.8, -Math.PI / 2, -Math.PI / 2 + q * TAU); ctx.stroke();
    if (Math.random() < q * 0.7) burst(hx, hy, '#8fe0ff', 2, 2.5); // gathering sparks
  }
  for (const sh of volley.shots) {
    if (sh.dead) continue;
    let x, y, s;
    if (sh.homing && boss) { // screen-space sprint to its core (triad: the aimed body)
      const tc = boltTargetCore(sh);
      const e = sh.t * sh.t;
      x = lerp(sh.sx0, tc.sx, e); y = lerp(sh.sy0, tc.sy, e);
      s = 1 - sh.t * 0.5;
    } else {
      const rg = ring(sh.z, g);
      x = rg.x + Math.cos(sh.a) * rg.r; y = rg.y + Math.sin(sh.a) * rg.r;
      s = rg.s * 3;
    }
    const br = Math.max(3, Math.min(W, H) * 0.02 * s);
    const bg2 = ctx.createRadialGradient(x, y, 0, x, y, br * 2.6);
    bg2.addColorStop(0, 'rgba(255,255,255,0.95)');
    bg2.addColorStop(0.4, 'rgba(140,225,255,0.6)');
    bg2.addColorStop(1, 'rgba(140,225,255,0)');
    ctx.fillStyle = bg2;
    ctx.beginPath(); ctx.arc(x, y, br * 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, br * 0.55, 0, TAU); ctx.fill();
    if (!sh.homing) { // wavefront arc hugging the wall at the bolt's depth
      const rg = ring(sh.z, g);
      ctx.strokeStyle = 'rgba(140,225,255,0.7)';
      ctx.lineWidth = Math.max(1.5, 4 * rg.s * 3);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(g.cx, g.cy, rg.r, sh.a - 0.22, sh.a + 0.22); ctx.stroke();
    }
  }
}

// a ready orb tapped: unleash that node's wave from the ring into the deep
function firePulse(i) {
  pulseCharge[i] = 0;
  pulseWaves.push({ z: geo().hitZ, kills: 0, i, col: i === 0 ? '111,227,255' : '240,248,255' });
  shake = Math.min(shake + 0.7, 1);
  sfx.pulseFire();
  buzz([30, 30, 90]);
}
// the wave: a white-hot front racing down the tunnel, dragging a glowing wake
// that fills the whole cave behind it
function drawPulseWave(g) {
  for (const wv of pulseWaves) {
    const a = clamp(1.25 - wv.z, 0.15, 1);
    ctx.lineCap = 'round';
    // wake: rings trailing from the front back toward the player, melting away
    for (let k = 5; k >= 1; k--) {
      const zT = wv.z - k * 0.055;
      if (zT <= g.hitZ * 0.8) continue;
      const rt = ring(zT, g);
      const ka = a * (1 - k / 6) * 0.3;
      ctx.lineWidth = Math.max(2, (14 + k * 7) * rt.s * 3);
      ctx.strokeStyle = `rgba(${wv.col},${ka.toFixed(2)})`;
      ctx.beginPath(); ctx.arc(rt.x, rt.y, rt.r, 0, TAU); ctx.stroke();
    }
    // front: layered hot ring + a forward glow washing the cave ahead
    const rg = ring(wv.z, g);
    const fg = ctx.createRadialGradient(rg.x, rg.y, rg.r * 0.35, rg.x, rg.y, rg.r * 1.15);
    fg.addColorStop(0, 'rgba(0,0,0,0)');
    fg.addColorStop(0.85, `rgba(${wv.col},${(a * 0.16).toFixed(2)})`);
    fg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r * 1.2, 0, TAU); ctx.fill();
    for (const [w2, col] of [
      [22, `rgba(${wv.col},${(a * 0.3).toFixed(2)})`],
      [9, `rgba(${wv.col},${(a * 0.7).toFixed(2)})`],
      [3, `rgba(255,255,255,${(a * 0.95).toFixed(2)})`]
    ]) {
      ctx.lineWidth = Math.max(1, w2 * rg.s * 3);
      ctx.strokeStyle = col;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, TAU); ctx.stroke();
    }
  }
}
// per-node charge orbs in the pad cores — a progress ring while banking,
// full bloom + breathing + pings when ready to fire
function drawPulseOrbs(g) {
  if (boss) return; // the duel owns the pads
  for (let i = 0; i < 2; i++) {
    const frac = clamp(pulseCharge[i] / PULSE_MAX, 0, 1);
    if (frac <= 0.02) continue;
    const d = dialCenter(i === 0 ? 'L' : 'R');
    const col = i === 0 ? '111,227,255' : '255,255,255';
    const ready = frac >= 1;
    const pu = ready ? 1 + Math.sin(time * 6 + i) * 0.14 : 1;
    const r = d.r * (0.12 + frac * 0.24) * pu;
    // charge progress ring — reads at a glance how full the bank is
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(${col},0.25)`;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.44, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(${col},${ready ? 0.95 : 0.7})`;
    ctx.lineWidth = ready ? 5 : 4;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.44, -Math.PI / 2, -Math.PI / 2 + frac * TAU); ctx.stroke();
    // the orb itself
    const og = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, r * 2.4);
    og.addColorStop(0, `rgba(255,255,255,${ready ? 1 : 0.45 + frac * 0.35})`);
    og.addColorStop(0.4, `rgba(${col},${ready ? 0.85 : 0.3 + frac * 0.35})`);
    og.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(d.x, d.y, r * 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = ready ? '#ffffff' : `rgba(${col},0.9)`;
    ctx.beginPath(); ctx.arc(d.x, d.y, r * 0.5, 0, TAU); ctx.fill();
    // orbiting charge motes while banking; radiant spikes when ready
    if (!ready) {
      for (let k = 0; k < 3; k++) {
        const ma = time * 2.2 + i * 2 + k / 3 * TAU;
        ctx.fillStyle = `rgba(${col},0.8)`;
        ctx.beginPath();
        ctx.arc(d.x + Math.cos(ma) * r * 1.5, d.y + Math.sin(ma) * r * 1.5, Math.max(1.5, r * 0.14), 0, TAU);
        ctx.fill();
      }
    } else {
      ctx.strokeStyle = `rgba(255,255,255,${(0.5 + Math.sin(time * 6) * 0.3).toFixed(2)})`;
      ctx.lineWidth = 2;
      for (let k = 0; k < 6; k++) {
        const sa = time * 0.7 + k / 6 * TAU;
        ctx.beginPath();
        ctx.moveTo(d.x + Math.cos(sa) * r * 1.15, d.y + Math.sin(sa) * r * 1.15);
        ctx.lineTo(d.x + Math.cos(sa) * r * 1.7, d.y + Math.sin(sa) * r * 1.7);
        ctx.stroke();
      }
      // attention pings: expanding rings breathing off the orb
      const k2 = (time * 0.9 + i * 0.5) % 1;
      ctx.strokeStyle = `rgba(${col},${(0.7 * (1 - k2)).toFixed(2)})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(d.x, d.y, r * (1.3 + k2 * 2.2), 0, TAU); ctx.stroke();
    }
  }
}

// the ARCS scheme's side strips: track + rails, a center-berth notch, and a
// thumb showing where the node sits on its ±180° range
function drawControlArcs(g) {
  const { rA, span, bz } = arcGeom(g);
  for (let i = 0; i < 2; i++) {
    const base = arcBase(i);
    const col = i === 0 ? '111,227,255' : '255,255,255';
    const n = nodes[i];
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(${col},${n.held ? 0.3 : 0.16})`;
    ctx.lineWidth = bz * 0.85;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, rA, base - span, base + span); ctx.stroke();
    ctx.strokeStyle = `rgba(${col},0.4)`;
    ctx.lineWidth = 1.5;
    for (const rr of [rA - bz * 0.42, rA + bz * 0.42]) {
      ctx.beginPath(); ctx.arc(g.cx, g.cy, rr, base - span, base + span); ctx.stroke();
    }
    // position scale: center notch = near side, half ticks = top/bottom of the
    // rim, end ticks = the far side (full 180° throw)
    const tickAt = (t, wMul, al) => {
      const a = base + arcDir(i) * Math.asin(clamp(t * ARC_THROW() / rA, -1, 1));
      ctx.strokeStyle = `rgba(${col},${al})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(g.cx + Math.cos(a) * (rA - bz * 0.42 * wMul), g.cy + Math.sin(a) * (rA - bz * 0.42 * wMul));
      ctx.lineTo(g.cx + Math.cos(a) * (rA + bz * 0.42 * wMul), g.cy + Math.sin(a) * (rA + bz * 0.42 * wMul));
      ctx.stroke();
    };
    tickAt(0, 1, 0.7);       // default berth
    tickAt(0.5, 0.6, 0.45);  // top of the rim
    tickAt(-0.5, 0.6, 0.45); // bottom of the rim
    tickAt(1, 1, 0.55);      // far side, over the top
    tickAt(-1, 1, 0.55);     // far side, under the bottom
    // thumb rides at the fingertip's height, exactly matching the input
    const t = clamp(angDiff(n.angle, base) / Math.PI, -1, 1) * arcDir(i);
    const ta = base + arcDir(i) * Math.asin(clamp(t * ARC_THROW() / rA, -1, 1));
    const tx = g.cx + Math.cos(ta) * rA, ty = g.cy + Math.sin(ta) * rA;
    const ts = bz * (n.held ? 0.4 : 0.3);
    const tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, ts * 2.2);
    tg.addColorStop(0, `rgba(${col},0.6)`);
    tg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(tx, ty, ts * 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = n.color;
    ctx.beginPath(); ctx.arc(tx, ty, ts, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(240,252,255,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(tx, ty, ts, 0, TAU); ctx.stroke();
  }
}

function drawDials() {
  // immersive/arcs schemes drive the lenses directly — no dials unless the
  // duel's fused cannon needs its fire stick back
  if (settings.controls !== 0 && !(boss && boss.mergeT >= 1)) return;
  const bz = Math.min(W, H) * 0.055; // shared gauge width with the ARCS strips
  const booting = state === S.PLAY && introT < INTRO_DUR;
  const padsLive = introT >= BOOT_LOCK; // consoles start charging the moment the ring docks
  for (let i = 0; i < 2; i++) {
    const side = i === 0 ? 'L' : 'R';
    const d = dialCenter(side);
    const n = nodes[i];
    if (booting && !padsLive) { // dormant console: a dark ring, standing by
      ctx.strokeStyle = 'rgba(90,120,160,0.22)';
      ctx.lineWidth = bz * 0.85;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(120,150,185,0.45)';
      ctx.font = '600 9px Audiowide, system-ui';
      ctx.fillText('OFFLINE', d.x, d.y + 3);
      ctx.textAlign = 'left';
      continue;
    }
    const col = i === 0 ? '111,227,255' : '255,255,255';
    // console boot: power sweeps around the ring while the gauge condenses in,
    // on the same clock as the node reboot ramps
    const pw = booting ? clamp((introT - BOOT_LOCK) / (BOOT_ON - BOOT_LOCK), 0, 1) : 1;
    if (pw < 1) {
      ctx.strokeStyle = 'rgba(90,120,160,0.22)';
      ctx.lineWidth = bz * 0.85;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.stroke();
      ctx.lineCap = 'round';
      ctx.strokeStyle = `rgba(${col},0.8)`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, -Math.PI / 2, -Math.PI / 2 + pw * TAU); ctx.stroke();
      ctx.globalAlpha = 0.15 + 0.85 * pw;
    }
    const ptr = Object.values(pointers).find(q => q.side === side && q.lastA !== undefined);
    const held = !!ptr;
    ctx.lineCap = 'round';
    // radar backing
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU);
    ctx.fillStyle = 'rgba(10,20,45,0.35)'; ctx.fill();
    // 360° gauge — the ARCS strips' language wrapped full circle:
    // wide translucent track between two thin rails, compass ticks across it
    ctx.strokeStyle = `rgba(${col},${held ? 0.3 : 0.16})`;
    ctx.lineWidth = bz * 0.85;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(${col},0.4)`;
    ctx.lineWidth = 1.5;
    for (const rr of [d.r - bz * 0.42, d.r + bz * 0.42]) {
      ctx.beginPath(); ctx.arc(d.x, d.y, rr, 0, TAU); ctx.stroke();
    }
    for (let t = 0; t < 8; t++) { // majors at the cardinals, minors between
      const a2 = t / 8 * TAU, wMul = t % 2 === 0 ? 1 : 0.55;
      ctx.strokeStyle = `rgba(${col},${t % 2 === 0 ? 0.5 : 0.28})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(d.x + Math.cos(a2) * (d.r - bz * 0.42 * wMul), d.y + Math.sin(a2) * (d.r - bz * 0.42 * wMul));
      ctx.lineTo(d.x + Math.cos(a2) * (d.r + bz * 0.42 * wMul), d.y + Math.sin(a2) * (d.r + bz * 0.42 * wMul));
      ctx.stroke();
    }
    // boss duel: the right dial is the fire stick — heat ring + aim knob
    const fireStick = boss && boss.mergeT >= 1 && side === 'R';
    if (fireStick) {
      const hcol = heat < 0.5 ? '111,227,255' : heat < 0.8 ? '255,180,80' : '255,70,70';
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(' + hcol + ',' + (overheat ? (Math.sin(time * 12) > 0 ? 0.95 : 0.3) : 0.85).toFixed(2) + ')';
      ctx.lineWidth = 5;
      if (heat > 0.005) {
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r + 7, -Math.PI / 2, -Math.PI / 2 + heat * TAU); ctx.stroke();
      }
      if (overheat) {
        ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,80,80,0.9)'; ctx.font = '700 11px Audiowide, system-ui';
        ctx.fillText('OVERHEAT', d.x, d.y - d.r - 14);
        ctx.textAlign = 'left';
      }
    }
    // thumb — during the duel the right thumb is the stick position itself
    const kx = fireStick ? d.x + beamAim.x * d.r : d.x + Math.cos(n.angle) * d.r;
    const ky = fireStick ? d.y + beamAim.y * d.r : d.y + Math.sin(n.angle) * d.r;
    const ts = bz * (held || fireStick ? 0.4 : 0.3);
    const gl = ctx.createRadialGradient(kx, ky, 0, kx, ky, ts * 2.2);
    gl.addColorStop(0, `rgba(${col},0.6)`);
    gl.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(kx, ky, ts * 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = n.color;
    ctx.beginPath(); ctx.arc(kx, ky, ts, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(240,252,255,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(kx, ky, ts, 0, TAU); ctx.stroke();
    // virtual extension: a drifted grip re-projects the gauge under the finger —
    // the bigger wheel IS the fine-aim leverage, now visible
    if (held && !fireStick && ptr.px !== undefined) {
      const fr = Math.hypot(ptr.px - d.x, ptr.py - d.y);
      if (fr > d.r + bz * 0.7) {
        const fa = Math.atan2(ptr.py - d.y, ptr.px - d.x);
        ctx.setLineDash([9, 11]);
        ctx.strokeStyle = `rgba(${col},0.22)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(d.x, d.y, fr, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
        // spoke from the track out to the fingertip
        ctx.strokeStyle = `rgba(${col},0.3)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(d.x + Math.cos(fa) * (d.r + bz * 0.42), d.y + Math.sin(fa) * (d.r + bz * 0.42));
        ctx.lineTo(d.x + Math.cos(fa) * (fr - ts * 1.3), d.y + Math.sin(fa) * (fr - ts * 1.3));
        ctx.stroke();
        // ghost thumb riding the extended wheel, right under the finger
        ctx.strokeStyle = `rgba(${col},0.75)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(d.x + Math.cos(fa) * fr, d.y + Math.sin(fa) * fr, ts * 0.8, 0, TAU); ctx.stroke();
      }
    }
    if (booting && padsLive) {
      // the sweep completes, THEN the check lights it up
      const flash = introT >= BOOT_ON ? clamp(1 - (introT - BOOT_ON) / 0.4, 0, 1) : 0;
      if (flash > 0) {
        ctx.strokeStyle = `rgba(${col},${(flash * 0.8).toFixed(2)})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r + 6, 0, TAU); ctx.stroke();
      }
      if (introT >= INTRO_GATE - 0.01) { // awaiting operator: per-pad prompt
        const okI = padHold[i];
        ctx.strokeStyle = okI ? 'rgba(126,226,98,0.9)'
          : `rgba(255,210,74,${(0.45 + Math.sin(time * 5) * 0.3).toFixed(2)})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r + 9, 0, TAU); ctx.stroke();
        ctx.textAlign = 'center';
        ctx.fillStyle = okI ? 'rgba(126,226,98,0.9)' : 'rgba(255,210,74,0.85)';
        ctx.font = '700 10px Audiowide, system-ui';
        ctx.fillText(okI ? 'READY' : 'PLACE THUMB', d.x, d.y - d.r - 14);
        ctx.textAlign = 'left';
      }
    }
    // radar blips: live enemy positions — angle matches the tunnel, radius = how close they are
    const blipXY = en => {
      const rr = d.r * (1 - clamp(en.z, 0, 1) * 0.85);
      return { x: d.x + Math.cos(en.angle) * rr, y: d.y + Math.sin(en.angle) * rr };
    };
    for (const en of enemies) {
      if (en.dead || en.resolved) continue;
      const { x: bx, y: by } = blipXY(en);
      const bs = (2.5 + (1 - en.z) * 4) * (en.type === 'heavy' ? 1.5 : 1);
      const urgent = en.z < 0.35 && Math.sin(time * 10) > 0; // blink when close
      const al = urgent || en.z >= 0.35 ? 0.95 : 0.4;
      // barrier pairs show their wall on the radar too
      if (en.lineLead && en.partner && !en.partner.dead) {
        const p2 = blipXY(en.partner);
        ctx.strokeStyle = `rgba(255,80,110,${al * 0.6})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
      ctx.fillStyle = en.type === 'frag'
        ? `rgba(140,150,170,${al})`
        : en.type === 'heavy'
        ? `rgba(200,80,255,${al})`
        : en.lock === 0
        ? `rgba(80,170,255,${al})`
        : en.lock === 1
        ? `rgba(240,248,255,${al})`
        : `rgba(220,50,50,${al})`;
      ctx.fillRect(bx - bs / 2, by - bs / 2, bs, bs);
    }
    // golden pickup blips
    for (const p of pickups) {
      if (p.done) continue;
      const { x: gx, y: gy } = blipXY(p);
      ctx.fillStyle = 'rgba(255,210,74,0.9)';
      ctx.beginPath(); ctx.arc(gx, gy, 2.5 + (1 - p.z) * 2, 0, TAU); ctx.fill();
    }
    // the firewall core: oversized blinking blip at its tunnel position
    if (boss) {
      const rr2 = d.r * clamp(boss.rad || 0, 0, 1) * 0.85;
      const bx2 = d.x + Math.cos(boss.ang || 0) * rr2, by2 = d.y + Math.sin(boss.ang || 0) * rr2;
      ctx.fillStyle = Math.sin(time * 8) > 0 ? 'rgba(210,80,255,0.95)' : 'rgba(210,80,255,0.45)';
      const bs2 = 7;
      ctx.fillRect(bx2 - bs2 / 2, by2 - bs2 / 2, bs2, bs2);
    }
    ctx.globalAlpha = 1; // boot condense-in ends with this console
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- holographic HUD kit ----------
// chamfered slab — corners cut on the top-left / bottom-right diagonal
function techRect(x, y, w, h, cut) {
  ctx.beginPath();
  ctx.moveTo(x + cut, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + h - cut);
  ctx.lineTo(x + w - cut, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + cut);
  ctx.closePath();
}
// floating bracket corners, like a target lock
function cornerBrackets(x, y, w, h, len, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
  ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
  ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
  ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);
  ctx.stroke();
}
// cluster of small + marks — HUD garnish
function plusCluster(x, y, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  const s = 3.5, gap = 12;
  for (let i = 0; i < 8; i++) {
    if (i === 3 || i === 6) continue; // ragged edge, like the mock
    const cx2 = x + (i % 4) * gap, cy2 = y + ((i / 4) | 0) * gap;
    ctx.beginPath();
    ctx.moveTo(cx2 - s, cy2); ctx.lineTo(cx2 + s, cy2);
    ctx.moveTo(cx2, cy2 - s); ctx.lineTo(cx2, cy2 + s);
    ctx.stroke();
  }
}
// glass console panel with a luminous header band; returns the header height
function techPanel(x, y, w, h, title) {
  const cut = 16;
  techRect(x, y, w, h, cut);
  ctx.fillStyle = 'rgba(4,14,30,0.92)'; ctx.fill();
  ctx.shadowColor = 'rgba(95,215,255,0.55)'; ctx.shadowBlur = lowFX ? 0 : 16;
  ctx.strokeStyle = 'rgba(110,210,255,0.65)'; ctx.lineWidth = 1.5;
  techRect(x, y, w, h, cut); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(110,210,255,0.16)'; ctx.lineWidth = 1;
  techRect(x + 4, y + 4, w - 8, h - 8, cut - 3); ctx.stroke();
  const hh = 32;
  ctx.save();
  techRect(x, y, w, h, cut); ctx.clip();
  const hg = ctx.createLinearGradient(x, y, x + w * 0.85, y);
  hg.addColorStop(0, 'rgba(80,190,255,0.35)');
  hg.addColorStop(1, 'rgba(80,190,255,0.02)');
  ctx.fillStyle = hg; ctx.fillRect(x, y, w, hh);
  ctx.strokeStyle = 'rgba(120,220,255,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y + hh); ctx.lineTo(x + w, y + hh); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#cfeeff';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  ctx.font = '700 13px Audiowide, system-ui'; ctx.textAlign = 'left';
  ctx.fillText(title, x + 20, y + 21);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  cornerBrackets(x - 7, y - 7, w + 14, h + 14, 14, 'rgba(120,220,255,0.55)');
  return hh;
}

// level intro: title card + 3-2-1 countdown in the center while the ring forms
// — drawn as the frame's last pass so no rim/HUD layer can obscure the text
function drawIntroCard() {
  const L = LV || LEVELS[levelIdx];
  if (introT < INTRO_DUR + 0.5) {
    const t = introT;
    ctx.textAlign = 'center';
    if (t < INTRO_DUR) {
      const inA = clamp(t / 0.35, 0, 1);
      const outA = clamp((INTRO_DUR - t) / 0.45, 0, 1);
      const scale = 0.85 + 0.15 * (1 - Math.pow(1 - inA, 3));
      ctx.save();
      ctx.translate(W / 2, H * 0.30);
      ctx.scale(scale, scale);
      ctx.globalAlpha = Math.min(inA, outA);
      try { ctx.letterSpacing = '6px'; } catch (e) {}
      const titleMaxW = ringChord(H * 0.30) / scale;
      ctx.fillStyle = 'rgba(200,235,255,0.85)'; ctx.font = '600 13px Audiowide, system-ui';
      ctx.fillText(endless ? 'SURVIVE' : qual ? 'TRAINING' : 'LEVEL ' + (levelIdx + 1), 0, -34);
      const tpx = fitPx(L.name, '800', Math.min(W * 0.055, 32), titleMaxW, 15);
      ctx.fillStyle = '#eafaff'; ctx.font = '800 ' + tpx + 'px Audiowide, system-ui';
      ctx.shadowColor = '#5fd7ff'; ctx.shadowBlur = 24;
      ctx.fillText(L.name, 0, 0);
      ctx.shadowBlur = 0;
      try { ctx.letterSpacing = '0px'; } catch (e) {}
      if (L.hint) {
        const hpx = fitPx(L.hint, '600', 12, titleMaxW, 9);
        ctx.fillStyle = '#ffb8c8'; ctx.font = '600 ' + hpx + 'px Audiowide, system-ui';
        ctx.fillText(L.hint, 0, 26);
      }
      ctx.restore();
      // boot stage callouts, stamped like an ops console — no bounce, no chatter
      const stI = t >= INTRO_GATE ? 3 : t >= BOOT_LOCK ? 1 : 0;
      const stStart = [0, BOOT_LOCK, 0, INTRO_GATE][stI];
      const ct = t - stStart;
      const labels = ['LOCKING ON STREAM', 'ACTIVATING SYSTEMS', '', 'AWAITING OPERATOR'];
      const ly = H * 0.52;
      ctx.save();
      ctx.globalAlpha = stI === 3 ? 0.8 + Math.sin(time * 2.5) * 0.15 : Math.min(1, ct / 0.06);
      const lcol = stI === 3 ? '#ffd24a' : '#8fe0ff';
      ctx.fillStyle = ct < 0.07 ? '#ffffff' : lcol; // one-flash stamp, then steady
      try { ctx.letterSpacing = '5px'; } catch (e) {}
      const bpx = fitPx(labels[stI], '700', Math.min(W * 0.032, 19), ringChord(H * 0.52, 90), 11);
      ctx.font = '700 ' + bpx + 'px Audiowide, system-ui';
      ctx.shadowColor = lcol; ctx.shadowBlur = lowFX ? 0 : 10;
      try { ctx.letterSpacing = '5px'; } catch (e) {}
      ctx.fillText(labels[stI], W / 2, ly + 8);
      const lw2 = ctx.measureText(labels[stI]).width;
      try { ctx.letterSpacing = '0px'; } catch (e) {}
      ctx.shadowBlur = 0;
      // targeting brackets framing the callout
      const bx = lw2 / 2 + 18, by = 15, arm = 7;
      ctx.strokeStyle = stI === 3 ? 'rgba(255,210,74,0.6)' : 'rgba(143,224,255,0.55)';
      ctx.lineWidth = 1.5;
      for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        ctx.beginPath();
        ctx.moveTo(W / 2 + sx * bx - sx * arm, ly + sy * by);
        ctx.lineTo(W / 2 + sx * bx, ly + sy * by);
        ctx.lineTo(W / 2 + sx * bx, ly + sy * by - sy * arm);
        ctx.stroke();
      }
      ctx.restore();
      // monospace status readout under the callout — data garnish, ops style
      let sub = '', subT = stStart;
      if (stI === 0) {
        const rp = clamp(t / BOOT_LOCK, 0, 1); // distance left to the dock, same motion law
        const rngM = (1 - rp * rp * (3 - 2 * rp)) * 26;
        sub = 'RANGE ' + rngM.toFixed(1).padStart(5, '0') + ' M';
        subT = t; // live readout — never flash-stamps
      } else if (stI === 1) {
        if (t >= BOOT_ON) { sub = 'ALL SYSTEMS — ONLINE'; subT = BOOT_ON; }
        else if (t >= BOOT_LOCK + 0.3) { sub = 'CHARGING NODES + CONSOLES'; subT = BOOT_LOCK + 0.3; }
        else sub = 'DOCK CONFIRMED';
      }
      if (sub) {
        const sct = t - subT;
        ctx.globalAlpha = Math.min(1, sct / 0.05 + 0.4);
        ctx.fillStyle = sct < 0.07 ? 'rgba(235,250,255,0.95)' : 'rgba(150,200,235,0.75)';
        ctx.font = '600 12px ui-monospace, Menlo, monospace';
        ctx.fillText(sub + (Math.sin(time * 6) > 0 ? ' ▎' : '  '), W / 2, ly + 32);
      }
      if (stI === 3) { // the gate explains itself
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = 'rgba(200,235,255,0.8)';
        ctx.font = '500 11px Audiowide, system-ui';
        ctx.fillText(gpSeen ? 'HOLD BOTH STICKS — OPPOSITE SIDES' : 'PLACE BOTH THUMBS ON THE PADS', W / 2, ly + 32);
      }
    } else { // CONTROLS ACTIVE — the stream goes live (the CID says godspeed)
      const gt = (t - INTRO_DUR) / 0.6;
      ctx.save();
      ctx.translate(W / 2, H * 0.52);
      ctx.globalAlpha = 1 - gt * gt;
      ctx.fillStyle = gt < 0.1 ? '#ffffff' : '#7ee262';
      ctx.font = '800 ' + Math.min(W * 0.055, 34) + 'px Audiowide, system-ui';
      ctx.shadowColor = '#7ee262'; ctx.shadowBlur = 22;
      try { ctx.letterSpacing = (4 + gt * 6).toFixed(1) + 'px'; } catch (e) {}
      ctx.fillText('CONTROLS ACTIVE', 0, 14);
      try { ctx.letterSpacing = '0px'; } catch (e) {}
      ctx.shadowBlur = 0;
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

// procedural holo-portraits for the comm line — line-art busts in the
// speaker's color, scanlined and flickering like a tapped video feed.
// OMNI: suit + lapel pin · CID: peaked cap + badge · TRACE: hooded, face
// lost to glitch bars · CORE: nothing human, a spiked core
function drawCommFace(s, cx2, cy3, r, col) {
  ctx.save();
  ctx.translate(cx2, cy3);
  const flick = 0.8 + Math.sin(time * 13) * 0.1 + (Math.random() < 0.04 ? -0.3 : 0);
  ctx.globalAlpha *= Math.max(0.4, flick);
  ctx.strokeStyle = `rgba(${col},0.9)`;
  ctx.fillStyle = `rgba(${col},0.16)`;
  ctx.lineWidth = 1.4;
  ctx.lineJoin = 'round';
  if (s === 'CORE') { // the rogue firewall: a void disc, watching
    ctx.fillStyle = 'rgba(3,1,8,0.95)';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.88, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(${col},0.9)`;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.88, Math.PI * 0.75, Math.PI * 1.8); ctx.stroke(); // horizon rim
    ctx.strokeStyle = 'rgba(255,60,90,0.6)';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.88, Math.PI * 0.08, Math.PI * 0.5); ctx.stroke(); // red underglow
    const ig = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.62); // the HAL lens
    ig.addColorStop(0, 'rgba(255,240,225,0.98)');
    ig.addColorStop(0.25, 'rgba(255,110,110,0.95)');
    ig.addColorStop(0.6, 'rgba(170,25,55,0.9)');
    ig.addColorStop(1, 'rgba(40,4,16,0)');
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU); ctx.fill();
  } else if (s === 'TRACE') { // hooded silhouette
    ctx.beginPath();
    ctx.moveTo(-r, r * 1.05);
    ctx.quadraticCurveTo(-r * 1.05, -r * 0.55, 0, -r * 1.02);
    ctx.quadraticCurveTo(r * 1.05, -r * 0.55, r, r * 1.05);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(3,6,14,0.85)'; // void where the face should be
    ctx.beginPath(); ctx.arc(0, -r * 0.08, r * 0.5, 0, TAU); ctx.fill();
    for (const gy of [-0.28, 0, 0.24]) {  // glitch bars scanning the void
      const gw = r * (0.34 + Math.sin(time * 7 + gy * 9) * 0.14);
      ctx.beginPath(); ctx.moveTo(-gw, (gy - 0.08) * r); ctx.lineTo(gw, (gy - 0.08) * r); ctx.stroke();
    }
  } else { // OMNI / CID: head + shoulders, each with their uniform's tell
    ctx.beginPath(); ctx.arc(0, -r * 0.32, r * 0.42, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r * 0.95, r * 1.05);
    ctx.quadraticCurveTo(0, r * 0.05, r * 0.95, r * 1.05);
    ctx.fill(); ctx.stroke();
    if (s === 'CID') { // peaked cap seated ON the head, badge on the dome
      ctx.fillStyle = 'rgba(6,12,26,0.9)'; // solid crown so the head reads as capped
      ctx.beginPath();
      ctx.moveTo(-r * 0.62, -r * 0.52);
      ctx.quadraticCurveTo(0, -r * 1.1, r * 0.62, -r * 0.52);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r * 0.66, -r * 0.5); ctx.lineTo(r * 0.66, -r * 0.5); ctx.stroke();
      ctx.fillStyle = `rgba(${col},0.95)`;
      ctx.beginPath(); ctx.arc(0, -r * 0.74, r * 0.08, 0, TAU); ctx.fill();
    } else { // OMNI: corporate tie + lapel pin
      ctx.beginPath();
      ctx.moveTo(0, r * 0.22); ctx.lineTo(-r * 0.13, r * 0.52);
      ctx.lineTo(0, r * 0.95); ctx.lineTo(r * 0.13, r * 0.52);
      ctx.closePath(); ctx.stroke();
      ctx.fillStyle = `rgba(${col},0.95)`;
      ctx.beginPath(); ctx.arc(r * 0.48, r * 0.6, r * 0.07, 0, TAU); ctx.fill();
    }
  }
  ctx.strokeStyle = `rgba(${col},0.10)`; // transmission scanlines over the feed
  ctx.lineWidth = 1;
  for (let sy = -r; sy < r * 1.1; sy += 3) {
    ctx.beginPath(); ctx.moveTo(-r, sy); ctx.lineTo(r, sy); ctx.stroke();
  }
  ctx.restore();
}

function drawHUD(g) {
  const L = LV || LEVELS[levelIdx];
  const pad = 14;

  // left curved bar: LEVEL PROGRESS (green, hugs the node ring like the mock)
  // radius is clamped so the arc tips + stroke casing always stay on screen —
  // on wide phones the unclamped radius pushed the tips past the top edge
  const bw2 = Math.max(9, Math.min(W, H) * 0.024);
  // tips ride lower (0.34π → 0.28π) so the arcs can sit farther out without
  // clipping the screen edge — clear breathing room between bar and ring
  const ELEV = Math.PI * 0.28;
  const barR = Math.min(g.nodeR + Math.min(W, H) * 0.125, (H / 2 - bw2 - 8) / Math.sin(ELEV));
  const aL0 = Math.PI * 1.06, aL1 = Math.PI + ELEV; // lower-left → upper-left
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(240,250,255,0.85)'; ctx.lineWidth = bw2 + 5;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aL0, aL1); ctx.stroke();
  ctx.strokeStyle = '#050a12'; ctx.lineWidth = bw2 + 2;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aL0, aL1); ctx.stroke();
  // left arc: level progress · endless ramp · or the CORE's health during the duel
  const prog = boss ? clamp(boss.hp / boss.maxHp, 0, 1) : endless ? clamp(levelT / 150, 0, 1) : clamp(levelT / L.duration, 0, 1);
  if (prog > 0.005) {
    ctx.strokeStyle = boss ? '#d465ff' : endless ? '#ff9a3c' : '#7ee262';
    ctx.lineWidth = bw2 - 4;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aL0, aL0 + (aL1 - aL0) * prog); ctx.stroke();
  }

  // right curved bar: 4 life blocks — or a continuous hitpoint bar during the duel
  const aR0 = -Math.PI * 0.06, aR1 = -ELEV; // mirrored: lower-right → upper-right
  ctx.lineCap = 'butt';
  if (boss) {
    ctx.strokeStyle = 'rgba(15,28,48,0.8)'; ctx.lineWidth = bw2;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aR1, aR0); ctx.stroke();
    const hpF = clamp(integrity / 100, 0, 1);
    if (hpF > 0.005) {
      ctx.strokeStyle = hpF > 0.5 ? '#7ee262' : hpF > 0.25 ? '#ffb340' : '#ff4a5e';
      ctx.lineWidth = bw2;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, aR0 - (aR0 - aR1) * hpF, aR0); ctx.stroke();
    }
  } else {
    const MAXM = 4, blocksLeft = Math.max(0, Math.ceil(integrity / 25));
    const span = (aR0 - aR1) / MAXM, gap2 = span * 0.07; // thin seams keep them reading as one bar
    for (let i = 0; i < MAXM; i++) {
      const s0 = aR0 - (i + 1) * span + gap2 / 2, s1 = aR0 - i * span - gap2 / 2;
      ctx.strokeStyle = i < blocksLeft ? '#8fc7ff' : 'rgba(15,28,48,0.8)';
      ctx.lineWidth = bw2;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, barR, s0, s1); ctx.stroke();
    }
  }
  ctx.lineCap = 'round';

  // score (right)
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd24a'; ctx.font = '700 20px Audiowide, system-ui';
  ctx.fillText(score.toLocaleString(), W - pad - SAFE.r, H * 0.12 + 8);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '600 10px Audiowide, system-ui';
  ctx.fillText('SCORE', W - pad - SAFE.r, H * 0.12 + 24);
  if (combo >= 3) {
    ctx.fillStyle = '#ffd24a'; ctx.font = '700 14px Audiowide, system-ui';
    ctx.fillText('COMBO x' + Math.min(combo, 5), W - pad - SAFE.r, H * 0.12 + 48);
  }
  const mm = mutMul();
  if (mm > 1) {
    ctx.fillStyle = 'rgba(255,210,74,0.85)'; ctx.font = '700 11px Audiowide, system-ui';
    ctx.fillText('MODIFIERS ×' + (Math.round(mm * 100) / 100), W - pad - SAFE.r, H * 0.12 + 66);
  }
  ctx.textAlign = 'left';

  // pause button (top-left)
  pauseBtnRect = { x: 12 + SAFE.l, y: 12 + SAFE.t, w: 38, h: 38 };
  techRect(pauseBtnRect.x, pauseBtnRect.y, pauseBtnRect.w, pauseBtnRect.h, 8);
  ctx.fillStyle = 'rgba(6,20,40,0.6)'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,220,255,0.55)'; ctx.lineWidth = 1.5;
  techRect(pauseBtnRect.x, pauseBtnRect.y, pauseBtnRect.w, pauseBtnRect.h, 8); ctx.stroke();
  ctx.fillStyle = 'rgba(220,245,255,0.92)';
  ctx.fillRect(pauseBtnRect.x + 12, pauseBtnRect.y + 11, 5, 16);
  ctx.fillRect(pauseBtnRect.x + 21, pauseBtnRect.y + 11, 5, 16);

  // resume countdown after unpausing
  if (resumeHold > 0) {
    const d2 = Math.max(1, Math.ceil(resumeHold / 0.3));
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = '#ffd24a';
    ctx.font = '800 ' + Math.min(W * 0.08, 46) + 'px Audiowide, system-ui';
    ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 20;
    ctx.fillText(d2, W / 2, H * 0.45);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  // active power-up chips (top center) — each chip sizes to its own label;
  // an armed shield rides the row too (cyan, no timer: it waits, not ticks)
  const chips = Object.keys(fx).filter(k => fx[k] > 0)
    .map(k => ({ label: PICKUPS[k].label, frac: clamp(fx[k] / PICKUPS[k].dur, 0, 1) }));
  if (shieldCharge > 0) chips.unshift({ label: 'SHIELD ARMED', cyan: true });
  if (chips.length) {
    ctx.font = '700 10px Audiowide, system-ui';
    const cws = chips.map(c => Math.ceil(ctx.measureText(c.label).width) + 18);
    let x0 = W / 2 - (cws.reduce((a, b) => a + b, 0) + (chips.length - 1) * 8) / 2;
    chips.forEach((c, i) => {
      const cw = cws[i], chh = 20;
      const y0 = 14 + SAFE.t;
      techRect(x0, y0, cw, chh, 6);
      ctx.fillStyle = c.cyan ? 'rgba(8,38,58,0.65)' : 'rgba(60,40,5,0.65)'; ctx.fill();
      ctx.strokeStyle = c.cyan ? 'rgba(143,224,255,0.8)' : 'rgba(255,210,74,0.8)'; ctx.lineWidth = 1;
      techRect(x0, y0, cw, chh, 6); ctx.stroke();
      ctx.fillStyle = c.cyan ? '#d9f2ff' : '#ffe9b0'; ctx.textAlign = 'left';
      ctx.fillText(c.label, x0 + 9, y0 + 14);
      if (c.frac !== undefined) {
        ctx.fillStyle = 'rgba(255,210,74,0.9)';
        ctx.fillRect(x0, y0 + chh + 3, cw * c.frac, 2);
      }
      x0 += cw + 8;
    });
  }

  // intercepted transmission ticker — voices on the line you're guarding
  if (commCur && state === S.PLAY) {
    const SPK = SPKCOL; // speaker colors come with the campaign package
    const label = '\u00bb ' + commCur.s + ':';
    const chars = Math.floor(commT * 38);
    const txt = commCur.m.slice(0, chars);
    const fade = commT < 0.2 ? commT / 0.2 : clamp((6 - commT) / 0.8, 0, 1);
    ctx.save();
    ctx.globalAlpha = Math.min(1, fade);
    const cy2 = Math.max(14 + SAFE.t + 38, H * 0.185); // inside the bore's clear width
    const pr = 14, pb = pr * 2 + 8; // holo-portrait tile + its gap
    // shrink the line until portrait + chip + message fit the chord here
    let cfz = 10, lw2, tw2;
    for (; cfz >= 8; cfz--) {
      ctx.font = '700 ' + cfz + 'px Audiowide, system-ui';
      lw2 = ctx.measureText(label).width;
      ctx.font = '500 ' + cfz + 'px Audiowide, system-ui';
      tw2 = ctx.measureText(commCur.m).width;
      if (pb + lw2 + 6 + tw2 <= ringChord(cy2, 26)) break;
    }
    const x0 = W / 2 - (pb + lw2 + 6 + tw2) / 2 + pb;
    ctx.textAlign = 'left';
    const spkCol = SPK[commCur.s] || '160,215,255';
    // portrait tile, chamfered like the rest of the HUD chrome — the voice
    // gets a face, like a rough video call from inside the wire
    const bx = x0 - 6 - pb + 4, by = cy2 - 4 - pr;
    ctx.fillStyle = 'rgba(6,12,26,0.8)';
    techRect(bx, by, pr * 2, pr * 2, 5); ctx.fill();
    ctx.save();
    techRect(bx, by, pr * 2, pr * 2, 5); ctx.clip();
    drawCommFace(commCur.s, bx + pr, by + pr + 1.5, pr * 0.82, spkCol);
    ctx.restore();
    ctx.strokeStyle = `rgba(${spkCol},0.55)`; ctx.lineWidth = 1;
    techRect(bx, by, pr * 2, pr * 2, 5); ctx.stroke();
    ctx.fillStyle = `rgba(${spkCol},0.14)`;
    roundRect(x0 - 6, cy2 - 11, lw2 + 11, 15, 4); ctx.fill();
    ctx.strokeStyle = `rgba(${spkCol},0.5)`; ctx.lineWidth = 1;
    roundRect(x0 - 6, cy2 - 11, lw2 + 11, 15, 4); ctx.stroke();
    ctx.fillStyle = `rgba(${spkCol},0.95)`;
    ctx.font = '700 ' + cfz + 'px Audiowide, system-ui';
    ctx.fillText(label, x0, cy2);
    ctx.fillStyle = 'rgba(200,235,255,0.92)';
    ctx.font = '500 ' + cfz + 'px Audiowide, system-ui';
    ctx.fillText(txt + (chars < commCur.m.length ? '\u258c' : ''), x0 + lw2 + 6, cy2);
    ctx.restore();
  }

  // surge countdown: the header holds, the digits slam in beneath it
  if (endless && !boss && state === S.PLAY) {
    const surge = Math.floor(levelT / 100);
    const toNext = (surge + 1) * 100 - levelT;
    if (surge < 6 && toNext <= 4.2 && toNext > 0) {
      const cnt = Math.ceil(toNext);
      const ct = 1 - (toNext - Math.floor(toNext)); // 0..1 through the current second
      const pop = 1.6 - 0.6 * Math.min(ct / 0.25, 1);
      const al = ct < 0.12 ? ct / 0.12 : 1;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,154,60,0.92)';
      try { ctx.letterSpacing = '4px'; } catch (e) {}
      ctx.font = '700 ' + fitPx('SPEEDING UP', '700', 14, ringChord(H * 0.24, 60), 10) + 'px Audiowide, system-ui';
      ctx.fillText('SPEEDING UP', W / 2, H * 0.24);
      try { ctx.letterSpacing = '0px'; } catch (e) {}
      ctx.translate(W / 2, H * 0.36);
      ctx.scale(pop, pop);
      ctx.globalAlpha = al;
      ctx.fillStyle = '#ffd24a';
      ctx.font = '800 42px Audiowide, system-ui';
      ctx.shadowColor = '#ff9a3c'; ctx.shadowBlur = lowFX ? 0 : 20;
      ctx.fillText(cnt, 0, 14);
      ctx.shadowBlur = 0;
      ctx.restore();
      ctx.textAlign = 'left';
    }
  }

  // qualification guides — the arrows do ALL the teaching, no captions
  // (held until the boot ceremony hands over the controls)
  if (tut && tut.stage >= 0 && introT >= INTRO_DUR) {
    const st = QUAL[tut.stage];
    if (st.card === 'done') drawQualCeremony(tut.t);
    const nn = a => Math.abs(angDiff(nodes[0].angle, a)) < Math.abs(angDiff(nodes[1].angle, a)) ? nodes[0] : nodes[1];
    if (st.card === 'move') {
      // marching arrows lead each node onward (blue clockwise, white counter);
      // the lap meters wind the same way their node travels
      for (let i = 0; i < 2; i++) {
        const w = i === 0 ? 1 : -1;
        if (tut.moved[i] <= TAU) drawGuideArc(nodes[i], nodes[i].angle + w * 1.1);
        const d2 = dialCenter(i === 0 ? 'L' : 'R');
        ctx.strokeStyle = i === 0 ? 'rgba(95,150,255,0.9)' : 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(d2.x, d2.y, d2.r + 12, -Math.PI / 2, -Math.PI / 2 + w * clamp(tut.moved[i] / TAU, 0, 1) * TAU, i === 1);
        ctx.stroke();
      }
    }
    const ten = enemies.find(e => e.tut && !e.dead && !e.resolved);
    if (ten) {
      if (ten.type === 'heavy') { // both arrows converge on a half-blue/half-white dock spot
        drawGuideArc(nodes[0], ten.angle); drawGuideArc(nodes[1], ten.angle);
        drawDockSpot(ten.angle);
      }
      else if (ten.type === 'line') {
        drawGuideArc(nodes[0], ten.angle); if (ten.partner) drawGuideArc(nodes[1], ten.partner.angle);
        if (ten.partner) { // parking spots on the rim + the arc they'll span, riding the rail
          const g2 = geo();
          const d = angDiff(ten.partner.angle, ten.angle);
          ctx.save();
          ctx.strokeStyle = 'rgba(140,220,255,0.6)'; ctx.lineWidth = 2.5;
          ctx.setLineDash([7, 6]); ctx.lineDashOffset = -time * 24;
          ctx.beginPath(); ctx.arc(g2.cx, g2.cy, g2.nodeR, ten.angle, ten.angle + d, d < 0); ctx.stroke();
          ctx.restore();
          drawParkSpot(ten.angle, 'rgba(95,150,255,0.9)');
          drawParkSpot(ten.partner.angle, 'rgba(255,255,255,0.85)');
        }
      }
      else if (ten.lock !== undefined) drawGuideArc(nodes[ten.lock], ten.angle);
      // the killer teaches by contact: the arrow WALKS them into the first
      // one; every one after wears a landing signal so the drill is DODGE
      else if (ten.type === 'frag') { if (ten.touchMe) drawGuideArc(nn(ten.angle), ten.angle); else drawKillerSignal(ten); }
      else drawGuideArc(nn(ten.angle), ten.angle);
    }
    const tp = pickups.find(p => p.tut && !p.done);
    if (tp) drawGuideArc(nn(tp.angle), tp.angle);
    if (st.card === 'move') { // pulse both dials
      for (const side of ['L', 'R']) {
        const d = dialCenter(side);
        const pr = d.r + 6 + Math.sin(time * 5) * 3;
        ctx.strokeStyle = side === 'L' ? 'rgba(111,227,255,0.8)' : 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(d.x, d.y, pr, 0, TAU); ctx.stroke();
      }
    }
    if (tut.spawned === 'pulse') { // a banked pulse waits on the dial — ring the ready core
      for (let i = 0; i < 2; i++) {
        if (pulseCharge[i] < PULSE_MAX || nodes[i].deadT > 0) continue;
        const d = dialCenter(i === 0 ? 'L' : 'R');
        const pr = d.r * 0.5 + 8 + Math.sin(time * 6) * 4;
        ctx.strokeStyle = i === 0 ? 'rgba(111,227,255,0.85)' : 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(d.x, d.y, pr, 0, TAU); ctx.stroke();
      }
    }
  }
}

// ---------- briefing card (S.INFO) ----------
function infoCrystal(r, pal) {
  const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.9);
  gl.addColorStop(0, 'rgba(' + pal.glow + ',0.45)');
  gl.addColorStop(1, 'rgba(' + pal.glow + ',0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, TAU); ctx.fill();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU + time * 0.3;
    const rr = r * (0.78 + (i % 3) * 0.12);
    ctx.fillStyle = pal.shades[i % pal.shades.length];
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.30) * rr * 0.35, Math.sin(a - 0.30) * rr * 0.35);
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    ctx.lineTo(Math.cos(a + 0.30) * rr * 0.35, Math.sin(a + 0.30) * rr * 0.35);
    ctx.closePath(); ctx.fill();
  }
  const cg = ctx.createRadialGradient(-r * 0.1, -r * 0.12, 0, 0, 0, r * 0.45);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(0.55, pal.core);
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, TAU); ctx.fill();
}
const INFO_PAL = {
  boss:   { glow: '200,70,255',  shades: ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8', '#c44af0'], core: '#b03ae8' },
  normal: { glow: '255,60,90',   shades: ['#e8274b', '#ff5a3c', '#d81f6e', '#b3123a', '#ff8c5a'], core: '#ff5a3c' },
  heavy:  { glow: '200,70,255',  shades: ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8', '#c44af0'], core: '#b03ae8' },
  lock:   { glow: '80,170,255',  shades: ['#2f7fe0', '#1c4fae', '#4d9bff', '#12398a', '#3f8af0'], core: '#2f7fe0' },
  frag:   { glow: '90,110,140', shades: ['#2b3242', '#151a26', '#3a4354', '#0d1119', '#232a38'], core: '#2b3242' }
};
// a miniature of the live tap hardware, for briefing cards
function infoTap(r, pal, double) {
  ctx.save();
  ctx.rotate(0.55);
  // hex port plate, squashed for depth
  ctx.save();
  ctx.scale(1, 0.5);
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const ha = i / 6 * TAU + Math.PI / 6;
    i ? ctx.lineTo(Math.cos(ha) * r, Math.sin(ha) * r) : ctx.moveTo(Math.cos(ha) * r, Math.sin(ha) * r);
  }
  ctx.closePath();
  const plate = ctx.createLinearGradient(-r, 0, r, 0);
  plate.addColorStop(0, '#1a2334'); plate.addColorStop(0.5, '#0a0e1a'); plate.addColorStop(1, '#141b2b');
  ctx.fillStyle = plate; ctx.fill();
  ctx.strokeStyle = `rgba(${pal.glow},0.95)`; ctx.lineWidth = Math.max(1.5, r * 0.1); ctx.stroke();
  if (double) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ha = i / 6 * TAU + Math.PI / 6;
      i ? ctx.lineTo(Math.cos(ha) * r * 1.35, Math.sin(ha) * r * 1.35) : ctx.moveTo(Math.cos(ha) * r * 1.35, Math.sin(ha) * r * 1.35);
    }
    ctx.closePath();
    ctx.strokeStyle = pal.shades[2]; ctx.lineWidth = Math.max(1, r * 0.06);
    ctx.globalAlpha = 0.55 + 0.3 * Math.sin(time * 4);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = 'rgba(190,215,240,0.75)';
  for (let i = 0; i < 3; i++) {
    const ha = i / 3 * TAU + Math.PI / 6;
    ctx.beginPath(); ctx.arc(Math.cos(ha) * r * 0.72, Math.sin(ha) * r * 0.72, r * 0.08, 0, TAU); ctx.fill();
  }
  ctx.restore();
  // probe needle with its siphon light-guide
  const L2 = r * 1.7, nw = r * 0.17;
  ctx.beginPath(); ctx.moveTo(-nw, 0); ctx.lineTo(0, -L2); ctx.lineTo(nw, 0); ctx.closePath();
  ctx.fillStyle = '#141b2b'; ctx.fill();
  ctx.strokeStyle = 'rgba(170,195,225,0.55)'; ctx.lineWidth = Math.max(0.8, r * 0.06); ctx.stroke();
  ctx.strokeStyle = `rgba(${pal.glow},0.95)`;
  ctx.lineWidth = Math.max(1, r * 0.09);
  ctx.setLineDash([r * 0.28, r * 0.2]);
  ctx.lineDashOffset = time * r * 2.5;
  ctx.beginPath(); ctx.moveTo(0, -L2); ctx.lineTo(0, 0); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, -L2, Math.max(1, r * 0.11), 0, TAU); ctx.fill();
  ctx.restore();
}
function drawInfoGlyph(kind, cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  if (kind === 'move') {
    ctx.strokeStyle = 'rgba(10,16,28,0.95)'; ctx.lineWidth = r * 0.34;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,220,255,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, TAU); ctx.stroke();
    const demoA = time * 1.2; // demo dots orbit opposite ways, like the drill asks
    for (const [a, col] of [[Math.PI + demoA, 'rgb(111,227,255)'], [-demoA, '#ffffff']]) {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, r * 0.18, 0, TAU); ctx.fill();
    }
  } else if (kind === 'pickup') {
    const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.9);
    gl.addColorStop(0, 'rgba(255,210,74,0.5)');
    gl.addColorStop(1, 'rgba(255,210,74,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, TAU); ctx.fill();
    ctx.rotate(time * 0.4);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(60,40,5,0.9)'; ctx.fill();
    ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = Math.max(2, r * 0.14); ctx.stroke();
    ctx.rotate(-time * 0.4);
    const s2 = r * 0.52;
    ctx.fillStyle = '#ffe9b0';
    ctx.beginPath();
    ctx.moveTo(s2 * 0.3, -s2); ctx.lineTo(-s2 * 0.45, s2 * 0.15); ctx.lineTo(0, s2 * 0.15);
    ctx.lineTo(-s2 * 0.3, s2); ctx.lineTo(s2 * 0.45, -0.15 * s2); ctx.lineTo(0, -0.15 * s2);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'frag') {
    const pr = r * 1.05;
    ctx.rotate(time * 0.25);
    ctx.beginPath();
    ctx.moveTo(0, -pr);
    ctx.quadraticCurveTo(pr * 0.55, -pr * 0.55, pr, 0);
    ctx.quadraticCurveTo(pr * 0.55, pr * 0.55, 0, pr);
    ctx.quadraticCurveTo(-pr * 0.55, pr * 0.55, -pr, 0);
    ctx.quadraticCurveTo(-pr * 0.55, -pr * 0.55, 0, -pr);
    ctx.closePath();
    const fg2 = ctx.createRadialGradient(0, 0, 0, 0, 0, pr);
    fg2.addColorStop(0, '#0a0c1a');
    fg2.addColorStop(0.55, '#04050d');
    fg2.addColorStop(1, '#010104');
    ctx.fillStyle = fg2; ctx.fill();
    ctx.strokeStyle = 'rgba(185,200,230,0.8)'; ctx.lineWidth = Math.max(1.5, pr * 0.06); ctx.stroke();
    ctx.fillStyle = 'rgba(90,70,160,0.15)';
    ctx.beginPath(); ctx.ellipse(-pr * 0.25, -pr * 0.2, pr * 0.5, pr * 0.35, 0.6, 0, TAU); ctx.fill();
  } else if (kind === 'line') {
    // two taps torn open along a running crack
    const off = r * 1.15;
    ctx.strokeStyle = 'rgba(255,60,90,0.6)'; ctx.lineWidth = Math.max(2, r * 0.16);
    ctx.setLineDash([r * 0.4, r * 0.28]);
    ctx.lineDashOffset = -time * r * 2;
    ctx.beginPath(); ctx.moveTo(-off, 0); ctx.lineTo(off, 0); ctx.stroke();
    ctx.setLineDash([]);
    for (const sx of [-off, off]) {
      ctx.save(); ctx.translate(sx, 0);
      infoTap(r * 0.5, INFO_PAL.normal, false);
      ctx.restore();
    }
  } else if (kind === 'wall') {
    // the rim wall: a hazard-striped clamp arc seizing part of the rail
    ctx.lineCap = 'butt';
    ctx.strokeStyle = 'rgba(255,120,30,0.5)';
    ctx.lineWidth = r * 0.6;
    ctx.beginPath(); ctx.arc(0, r * 1.1, r * 1.9, -Math.PI * 0.78, -Math.PI * 0.22); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,154,60,0.95)';
    ctx.lineWidth = r * 0.34;
    ctx.beginPath(); ctx.arc(0, r * 1.1, r * 1.9, -Math.PI * 0.78, -Math.PI * 0.22); ctx.stroke();
    ctx.strokeStyle = 'rgba(30,12,4,0.7)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 6; k++) {
      const a = -Math.PI * 0.72 + k * Math.PI * 0.09;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.03) * r * 1.62, r * 1.1 + Math.sin(a - 0.03) * r * 1.62);
      ctx.lineTo(Math.cos(a + 0.03) * r * 2.18, r * 1.1 + Math.sin(a + 0.03) * r * 2.18);
      ctx.stroke();
    }
  } else if (kind === 'strip') {
    // the golden bonus stream: a flowing ribbon with its trace marker
    ctx.lineCap = 'round';
    for (const [w2, col, al] of [[r * 0.34, '255,180,40', 0.7], [r * 0.13, '255,235,170', 0.95]]) {
      ctx.strokeStyle = `rgba(${col},${al})`;
      ctx.lineWidth = w2;
      ctx.beginPath();
      for (let k = 0; k <= 20; k++) {
        const t = k / 20;
        const x = lerp(-r * 1.5, r * 1.5, t);
        const y = Math.sin(t * 4.2 + time * 2.5) * r * 0.5;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    const my2 = Math.sin(0.5 * 4.2 + time * 2.5) * r * 0.5;
    const tg2 = ctx.createRadialGradient(0, my2, 0, 0, my2, r * 0.55);
    tg2.addColorStop(0, 'rgba(255,255,255,0.95)');
    tg2.addColorStop(1, 'rgba(255,60,90,0)');
    ctx.fillStyle = tg2;
    ctx.beginPath(); ctx.arc(0, my2, r * 0.55, 0, TAU); ctx.fill();
  } else if (kind === 'pulse') {
    // a charged pad orb, pinging
    const pu = 1 + Math.sin(time * 6) * 0.12;
    const og2 = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.3 * pu);
    og2.addColorStop(0, 'rgba(255,255,255,0.95)');
    og2.addColorStop(0.4, 'rgba(111,227,255,0.8)');
    og2.addColorStop(1, 'rgba(111,227,255,0)');
    ctx.fillStyle = og2;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.3 * pu, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.32 * pu, 0, TAU); ctx.fill();
    const k2 = (time * 0.9) % 1;
    ctx.strokeStyle = `rgba(111,227,255,${(0.7 * (1 - k2)).toFixed(2)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * (0.6 + k2 * 1.3), 0, TAU); ctx.stroke();
  } else if (kind === 'boss') {
    // mini firewall-core: the same corrupted mosaic the duel shows
    const SH = ['#b03ae8', '#8a2ad4', '#d465ff', '#6f14b8'];
    const ext = r * 1.05, cs = ext * 2 / 3;
    for (let rr = 0; rr < 3; rr++) for (let cc = 0; cc < 3; cc++) {
      const fl = 0.55 + 0.45 * Math.sin(time * 6 + rr * 2.7 + cc * 1.3);
      ctx.fillStyle = rr === 1 && cc === 1 ? '#f3d4ff' : SH[(rr * 3 + cc) % SH.length];
      ctx.globalAlpha = rr === 1 && cc === 1 ? 1 : 0.45 + 0.5 * fl;
      ctx.fillRect(-ext + cc * cs + cs * 0.05, -ext + rr * cs + cs * 0.05, cs * 0.9, cs * 0.9);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.5 * (Math.sin(time * 13) * 0.5 + 0.5)).toFixed(2) + ')';
    ctx.fillRect(Math.sin(time * 9) * r * 0.3 - r, Math.sin(time * 3.1) * r * 0.6, r * 2, r * 0.09);
    ctx.strokeStyle = 'rgba(230,245,255,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.45, 0, TAU); ctx.stroke();
    const oa = time * 1.4;
    ctx.fillStyle = 'rgb(111,227,255)';
    ctx.beginPath(); ctx.arc(Math.cos(oa) * r * 1.45, Math.sin(oa) * r * 1.45, r * 0.16, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(Math.cos(oa + Math.PI) * r * 1.45, Math.sin(oa + Math.PI) * r * 1.45, r * 0.16, 0, TAU); ctx.fill();
  } else {
    // the live threat models: tap hardware in the type's color
    const pal = kind === 'heavy' ? INFO_PAL.heavy : kind === 'lock' ? INFO_PAL.lock : INFO_PAL.normal;
    infoTap(r * (kind === 'heavy' ? 1.15 : 1), pal, kind === 'heavy' || kind === 'lock');
    if (kind === 'heavy') { // both node colors demanded
      ctx.strokeStyle = 'rgba(230,245,255,0.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, TAU); ctx.stroke();
      const oa = time * 1.4;
      ctx.fillStyle = 'rgb(111,227,255)';
      ctx.beginPath(); ctx.arc(Math.cos(oa) * r * 1.6, Math.sin(oa) * r * 1.6, r * 0.16, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(Math.cos(oa + Math.PI) * r * 1.6, Math.sin(oa + Math.PI) * r * 1.6, r * 0.16, 0, TAU); ctx.fill();
    }
    if (kind === 'lock') { // single matching color
      ctx.strokeStyle = 'rgb(111,227,255)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, TAU); ctx.stroke();
      const oa = time * 1.4;
      ctx.fillStyle = 'rgb(111,227,255)';
      ctx.beginPath(); ctx.arc(Math.cos(oa) * r * 1.6, Math.sin(oa) * r * 1.6, r * 0.16, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}
// victory sweep: a cleansing wave rolls from the ring to the horizon and the
// whole tunnel settles into a "cleared" calm behind it
function drawClearSweep(g) {
  if (state !== S.END || !endWin || endSweep < 0) return;
  const zS = Math.min(endSweep, SPAWN_Z);
  const rg = ring(zS, g);
  const washT = clamp((endSweep - g.hitZ) / (SPAWN_Z - g.hitZ), 0, 1);
  // the WASH: everything behind the front stays green — the line is secure.
  // Breathes very slightly so it reads as a live field, not a color filter.
  const br = 1 + Math.sin(time * 1.6) * 0.06;
  const grad = ctx.createRadialGradient(g.cx, g.cy, Math.max(1, rg.r), g.cx, g.cy, Math.max(W, H) * 0.8);
  grad.addColorStop(0, `rgba(126,226,98,${(0.24 * br * (0.6 + washT * 0.4)).toFixed(3)})`);
  grad.addColorStop(0.45, `rgba(120,225,150,${(0.13 * br).toFixed(3)})`);
  grad.addColorStop(1, 'rgba(120,225,150,0.05)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // secured hoops: calm green rings drifting through the washed zone
  ctx.lineCap = 'butt';
  for (let i = 0; i < 5; i++) {
    const zq = ((i / 5 + time * 0.045) % 1) * zS;
    if (zq < 0.03) continue;
    const hr = ring(zq, g);
    ctx.strokeStyle = `rgba(160,255,170,${(0.10 * (1 - zq / SPAWN_Z)).toFixed(3)})`;
    ctx.lineWidth = Math.max(0.8, hr.r / g.nodeR * 1.6);
    ctx.beginPath(); ctx.arc(g.cx, g.cy, hr.r, 0, TAU); ctx.stroke();
  }
  // clean-traffic motes: sparse green packets drifting home through the bore
  ctx.fillStyle = 'rgba(200,255,200,0.75)';
  for (let i = 0; i < 10; i++) {
    const zq = ((i * 0.617 + time * 0.06) % 1) * zS;
    if (zq < 0.05) continue;
    const mrr = ring(zq, g);
    const ma = i * 2.399 + time * 0.1;
    const rr2 = mrr.r * (0.35 + (i % 4) * 0.16);
    ctx.beginPath();
    ctx.arc(g.cx + Math.cos(ma) * rr2, g.cy + Math.sin(ma) * rr2, Math.max(0.7, mrr.s * 4), 0, TAU);
    ctx.fill();
  }
  if (endSweep < SPAWN_Z) {
    // bright wake trailing right behind the front — fresh wash
    for (let k = 1; k <= 4; k++) {
      const zw = zS - k * 0.09;
      if (zw <= 0.02) continue;
      const wr = ring(zw, g);
      ctx.strokeStyle = `rgba(150,240,140,${(0.30 * (1 - k / 5)).toFixed(2)})`;
      ctx.lineWidth = Math.max(1.5, 10 * wr.s * 3 * (1 - k / 6));
      ctx.beginPath(); ctx.arc(g.cx, g.cy, wr.r, 0, TAU); ctx.stroke();
    }
    // the wavefront itself
    ctx.lineCap = 'round';
    for (const [w2, col] of [
      [22, 'rgba(126,226,98,0.30)'],
      [8, 'rgba(126,226,98,0.65)'],
      [3, 'rgba(240,255,235,0.95)']
    ]) {
      ctx.lineWidth = Math.max(1, w2 * rg.s * 3);
      ctx.strokeStyle = col;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, rg.r, 0, TAU); ctx.stroke();
    }
  }
}

function drawInfoCard() {
  const c = INFO_CARDS[infoCard];
  if (!c) return;
  const g = geo();
  // pop in, ease out — cards never just appear or vanish
  const inQ = clamp((time - infoShownAt) / 0.28, 0, 1);
  const outQ = infoOutAt ? clamp((time - infoOutAt) / 0.18, 0, 1) : 0;
  const pop = 1 - Math.pow(1 - inQ, 3);
  ctx.save();
  ctx.globalAlpha = Math.min(pop, 1 - outQ);
  const sc2 = (0.92 + 0.08 * pop) * (1 - 0.05 * outQ);
  ctx.translate(g.cx, g.cy); ctx.scale(sc2, sc2); ctx.translate(-g.cx, -g.cy);
  // gentle dim — the briefing lives INSIDE the ring, the field stays visible
  ctx.fillStyle = 'rgba(3,6,14,0.45)'; ctx.fillRect(-40, -40, W + 80, H + 80);
  const R = g.nodeR * 0.9;
  const maxW = g.nodeR * 2 * 0.6; // text never wider than 60% of the ring
  const bg = ctx.createRadialGradient(g.cx, g.cy, R * 0.25, g.cx, g.cy, R);
  bg.addColorStop(0, 'rgba(6,11,24,0.93)');
  bg.addColorStop(0.82, 'rgba(5,9,20,0.88)');
  bg.addColorStop(1, 'rgba(5,9,20,0)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, R, 0, TAU); ctx.fill();
  // tech border: thin ring with four drifting accent arcs
  ctx.strokeStyle = 'rgba(120,200,255,0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(140,230,255,0.75)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    const a = k / 4 * TAU + Math.PI / 4 + time * 0.15;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, R * 0.97, a - 0.22, a + 0.22); ctx.stroke();
  }
  // shrink type until it honors the width budget
  const fit = (weight, px2, text) => {
    let fs = px2 + 1;
    do { fs--; ctx.font = weight + ' ' + fs + 'px Audiowide, system-ui'; }
    while (fs > 8 && ctx.measureText(text).width > maxW);
    return fs;
  };
  const isStory = /^story/.test(infoCard);
  ctx.textAlign = 'center';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  const kicker = isStory ? 'CASE FILE // CID-2209' : 'FIELD BRIEFING';
  ctx.fillStyle = isStory ? 'rgba(255,210,74,0.8)' : 'rgba(140,210,255,0.7)';
  fit('700', 11, kicker);
  ctx.fillText(kicker, g.cx, g.cy - R * 0.64);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  drawInfoGlyph(infoCard, g.cx, g.cy - R * 0.33, Math.min(R * 0.16, 40));
  ctx.fillStyle = '#eafaff';
  try { ctx.letterSpacing = '2px'; } catch (e) {}
  fit('800', 22, c.title);
  ctx.fillText(c.title, g.cx, g.cy + R * 0.06);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.fillStyle = 'rgba(190,225,255,0.88)';
  let lf = 15;
  do { lf--; ctx.font = '500 ' + lf + 'px Audiowide, system-ui'; }
  while (lf > 8 && Math.max(...c.lines.map(l => ctx.measureText(l).width)) > maxW);
  if (isStory) { // the log TYPES itself in, teletype ticks under it
    let budget = Math.max(0, Math.floor((time - infoShownAt - 0.3) * 46));
    const total = c.lines.reduce((n, l) => n + l.length, 0);
    const shown = Math.min(budget, total);
    if (shown !== typeN && shown < total) {
      if (shown % 2 === 0) tone(1900 + (shown % 5) * 60, 0.012, 'square', 0.022);
      typeN = shown;
    }
    let cursorPlaced = false;
    c.lines.forEach((ln, i) => {
      const take = Math.max(0, Math.min(ln.length, budget));
      budget -= ln.length;
      let cursor = '';
      if (!cursorPlaced && take < ln.length) { cursor = '\u258c'; cursorPlaced = true; }
      ctx.fillText(ln.slice(0, take) + cursor, g.cx, g.cy + R * 0.2 + i * (lf + 3));
    });
  } else {
    c.lines.forEach((ln, i) => ctx.fillText(ln, g.cx, g.cy + R * 0.2 + i * (lf + 3)));
  }
  ctx.fillStyle = 'rgba(140,230,255,' + (0.5 + Math.sin(time * 4) * 0.3).toFixed(2) + ')';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  fit('700', 12, 'TAP TO CONTINUE');
  ctx.fillText('TAP TO CONTINUE', g.cx, g.cy + R * 0.66);
  if (gpSeen) drawPadHint(g.cx + ctx.measureText('TAP TO CONTINUE').width / 2 + 22, g.cy + R * 0.66 - 4, 'A');
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.textAlign = 'left';
  ctx.restore();
}

// marching dashed arc from a node toward the tutorial trap, with an arrowhead
function drawGuideArc(n, targetA) {
  const g2 = geo();
  const rr = g2.nodeR - Math.min(W, H) * 0.055 * 2.0;
  const d = angDiff(targetA, n.angle);
  if (Math.abs(d) < 0.3) return; // close enough — no guide needed
  const dir = Math.sign(d);
  const a0 = n.angle + dir * 0.12, a1 = n.angle + d * 0.82;
  const blue = n === nodes[0]; // arc wears its node's color so pupils know whose lead it is
  ctx.save();
  ctx.strokeStyle = blue ? 'rgba(95,150,255,0.9)' : 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 3;
  ctx.setLineDash([9, 9]);
  ctx.lineDashOffset = -time * 60 * dir;
  ctx.beginPath(); ctx.arc(g2.cx, g2.cy, rr, a0, a1, dir < 0); ctx.stroke();
  ctx.setLineDash([]);
  const hx = g2.cx + Math.cos(a1) * rr, hy = g2.cy + Math.sin(a1) * rr;
  ctx.translate(hx, hy); ctx.rotate(a1 + dir * Math.PI / 2);
  ctx.fillStyle = blue ? 'rgba(150,190,255,0.95)' : 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// QUALIFIED ceremony: lock-in pulses ripple out from the bore and the stamp
// settles in — the boot ceremony's language, closing the loop it opened
function drawQualCeremony(t) {
  const g2 = geo();
  for (const [d, col] of [[0, '140,230,255'], [0.35, '255,255,255']]) {
    const q = clamp((t - d) / 1.1, 0, 1);
    if (q <= 0 || q >= 1) continue;
    ctx.strokeStyle = 'rgba(' + col + ',' + (0.5 * (1 - q)).toFixed(2) + ')';
    ctx.lineWidth = 3 - q * 2;
    ctx.beginPath(); ctx.arc(g2.cx, g2.cy, g2.nodeR * (1 + q * 0.75), 0, TAU); ctx.stroke();
  }
  const q2 = clamp((t - 0.3) / 0.5, 0, 1);
  if (q2 <= 0) return;
  const s = 1 + 0.5 * Math.pow(1 - q2, 2); // stamps down from oversized
  const al = q2 * (t > 2.9 ? clamp((3.4 - t) / 0.5, 0, 1) : 1);
  ctx.save();
  ctx.translate(g2.cx, g2.cy); ctx.scale(s, s);
  ctx.textAlign = 'center';
  try { ctx.letterSpacing = '6px'; } catch (e) {}
  const fs = fitPx('QUALIFIED', 700, Math.round(g2.nodeR * 0.30), g2.nodeR * 1.7, 12);
  ctx.font = '700 ' + fs + 'px Audiowide, system-ui';
  ctx.shadowColor = 'rgba(120,225,255,0.8)'; ctx.shadowBlur = 22 * al;
  ctx.fillStyle = 'rgba(228,249,255,' + al.toFixed(2) + ')';
  ctx.fillText('QUALIFIED', 0, -fs * 0.1);
  ctx.shadowBlur = 0;
  try { ctx.letterSpacing = '2px'; } catch (e) {}
  ctx.font = '700 ' + Math.max(9, Math.round(fs * 0.32)) + 'px Audiowide, system-ui';
  ctx.fillStyle = 'rgba(150,215,240,' + (al * 0.9).toFixed(2) + ')';
  ctx.fillText('THE LINE IS YOURS TO GUARD', 0, fs * 0.72);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.textAlign = 'left';
  ctx.restore();
}

// tutorial dock spot: a half-blue/half-white disc on the rim where BOTH
// nodes must meet — the heavy drill's destination, split like its crew
function drawDockSpot(a) {
  const g2 = geo();
  const px = g2.cx + Math.cos(a) * g2.nodeR, py = g2.cy + Math.sin(a) * g2.nodeR;
  const r = Math.min(W, H) * 0.024;
  ctx.save();
  ctx.translate(px, py); ctx.rotate(a); // the split rides the rim's radial axis
  ctx.fillStyle = 'rgba(77,141,255,0.85)';
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI / 2, Math.PI * 1.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(200,240,255,0.75)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, r * (1.3 + Math.sin(time * 5) * 0.12), 0, TAU); ctx.stroke();

// tutorial parking spot: a dashed ring on the rim in the color of the node

function drawParkSpot(a, col) {

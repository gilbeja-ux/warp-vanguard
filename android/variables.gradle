ext {
    // 24 is Capacitor 8's floor (it was 22). Android 5.1 and 6.0 drop; Play Console
    // shows the count for this app, and in general it is under one percent.
    minSdkVersion = 24
    // API 36 (Android 16). Play's floor moves every 31 August to within a year of
    // the latest release; on 31 August 2026 that becomes 36, and Console already
    // reports the app as non-compliant. Past that date an out-of-date target
    // blocks UPDATES, not just new listings — so a closed test running on 35
    // would have been frozen mid-flight.
    //
    // THREE KNOCK-ONS AT THIS LEVEL, all checked rather than assumed:
    //   · EDGE-TO-EDGE IS NOW MANDATORY. At 35 an app could still opt out with
    //     windowOptOutEdgeToEdgeEnforcement; at 36 that flag is ignored. This
    //     game already lays its pads out against SAFE.l/r/b insets, which is why
    //     it survives the change — but it has to be seen on a gesture-nav device.
    //   · ORIENTATION LOCKS ARE IGNORED on large screens (≥600dp) — unless the app
    //     declares android:appCategory="game", which is the one exemption Google
    //     kept, and kept again for API 37. The manifest now declares it, so
    //     sensorLandscape IS honoured on tablets: the window manager rotates the
    //     activity and the game fills the display, no mattes. Drop that attribute
    //     and a portrait tablet falls back to the 90° "turn your device" transform,
    //     which is deliberate but is a far worse first impression on a tablet.
    //     Play Console flags the lock regardless. That is a large-screen quality
    //     score, not a release blocker, and it is knowingly accepted — clearing it
    //     would mean a real portrait layout for a twin-pad landscape game.
    //   · 16 KB PAGE SIZE for native libraries. Nothing here ships any:
    //     mergeReleaseNativeLibs reports NO-SOURCE, so there is nothing to align.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}
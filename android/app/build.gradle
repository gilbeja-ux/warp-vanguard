apply plugin: 'com.android.application'

// ---- RELEASE SIGNING ----
// Credentials live in android/key.properties, which is gitignored and never
// committed: the upload key cannot be replaced once the listing exists, so it
// stays out of the tree entirely. See key.properties.example and RELEASE-PLAN.
// When the file is absent — every dev machine, CI, `npm run apk` — the release
// build simply falls back to debug signing rather than failing, so nothing an
// author does day to day depends on holding the key.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('key.properties')
if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

android {
    namespace "com.warpvanguard.game"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.warpvanguard.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // VERSION IS GENERATED, NOT TYPED. scripts/sync-version.js writes these
        // two from package.json so the store build, the web build and the repo's
        // own version can never drift apart — versionCode must rise on EVERY
        // upload, forever, and a hand-edited number is how that gets missed.
        versionCode 10005
        versionName "1.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 ON. It was off on the theory that a WebView game has no Java worth
            // shrinking — but the bundle disagreed: 6.2MB of the 52MB upload is dex,
            // nearly all of it AndroidX and Capacitor the game never calls. Play
            // Console grades this ("App optimization: Low") and, more to the point,
            // every class in that dex is verified at cold start whether or not it
            // is ever used.
            //
            // The failure mode that kept it off is real and lives in proguard-rules.pro:
            // Capacitor finds plugins by REFLECTION, so nothing here is reachable by
            // the call graph R8 can see. Those keep rules are load-bearing — read the
            // reasoning there before touching them, and re-test the RELEASE build on
            // a device after any Capacitor upgrade, because a broken bridge is silent
            // at build time and fatal at launch.
            minifyEnabled true
            shrinkResources true
            // -optimize, not the plain file: the plain one carries -dontoptimize, which
            // leaves Console's "Optimization percentage" at zero even with R8 running.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        // ---- SIDELOAD: the release build, installable NEXT TO the store one ----
        // R8 breakage in a WebView app is silent at build time and fatal at launch,
        // so the only build worth testing is the one with minification on — which
        // `npm run apk` (debug) is not. initWith release copies R8, the keep rules,
        // the resource shrinker and the signing config verbatim: change nothing that
        // could make this pass where the real build would fail.
        //
        // The suffix is what actually lets it coexist with an installed Warp Vanguard
        // — Android keys installs on applicationId, not on the launcher label, and the
        // FileProvider authority is ${applicationId}-derived so it moves along with it.
        // The label lives in src/sideload/res so it overrides main's rather than
        // colliding with it the way a resValue would. The build type is not called
        // "tester" because Gradle reserves the `test` prefix for its own variants.
        sideload {
            initWith release
            applicationIdSuffix ".sideload"
            // the Capacitor subprojects only build release/debug; without this Gradle
            // fails variant resolution rather than falling back on its own.
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

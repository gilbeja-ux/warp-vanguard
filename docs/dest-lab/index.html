<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">
<title>Destinations Lab — Warp Lane</title>
<style>
  /* Desktop-only tuning tool for the things at the ends of lanes. NOT part of
     the store build. Chrome borrows the game's console language; the preview
     stage borrows the game's actual void, because the only honest background
     for a destination is the one it will be seen against. */
  @font-face {
    font-family: 'Audiowide';
    src: url('/fonts/audiowide.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }

  :root {
    --void:      #02040c;
    --shell:     #050a16;
    --panel:     #081226;
    --panel-2:   #0b1830;
    --panel-3:   #0f2140;
    --line:      #14305a;
    --line-soft: #0e2242;
    --ink:       #dcecff;
    --ink-2:     #a8c6e8;
    --ink-3:     #7b9bc2;
    --ink-4:     #4d6c93;  /* instrument labels — the quietest ink that still reads */
    --cyan:      #6fe3ff;
    --gold:      #ffd24a;
    --red:       #ff3c5a;
    --green:     #7ee262;
    --amber:     #ff9a3c;

    --display: 'Audiowide', 'Segoe UI', system-ui, sans-serif;
    --text: ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;

    --rail: 200px;
    --dials: 336px;
    --ease: cubic-bezier(.2, .7, .3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: var(--shell); color: var(--ink);
    font-family: var(--text); font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr) var(--dials);
    grid-template-rows: 52px minmax(0, 1fr);
    overflow: hidden;
  }
  ::selection { background: rgba(111, 227, 255, .26); }
  * { scrollbar-width: thin; scrollbar-color: #17304f transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #17304f; border: 3px solid var(--shell); border-radius: 6px; }

  /* ══ top bar ══════════════════════════════════════════════════════════ */
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: linear-gradient(180deg, #0a1730, #061020);
    border-bottom: 1px solid var(--line);
    position: relative; z-index: 30;
  }
  header::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(111,227,255,.5), transparent);
  }
  .brand {
    font-family: var(--display); font-size: 12px; letter-spacing: 3px;
    color: var(--cyan); text-transform: uppercase; white-space: nowrap;
  }
  .brand span { color: var(--ink-3); }
  .spacer { flex: 1; }

  .state {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    padding: 5px 10px; border-radius: 6px; border: 1px solid transparent;
    transition: color .2s var(--ease), border-color .2s var(--ease);
  }
  .state .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .state[data-s="dirty"] { color: var(--gold); }
  .state[data-s="ok"]    { color: var(--green); }
  .state[data-s="err"]   { color: var(--red); border-color: rgba(255,60,90,.4); }
  .state[data-s="busy"] .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  button {
    font-family: var(--text); font-size: 11px; letter-spacing: .8px;
    text-transform: uppercase; color: var(--ink-2);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    transition: all .16s var(--ease);
  }
  button:hover { background: var(--panel-3); color: var(--ink); border-color: #1d4173; }
  button:disabled { opacity: .35; cursor: default; }
  button.go { color: #041018; background: var(--cyan); border-color: var(--cyan); font-weight: 600; }
  button.go:hover { background: #9aeeff; color: #041018; }
  button.go:disabled { background: var(--panel-2); color: var(--ink-3); border-color: var(--line); }

  /* ══ the rail: every destination, by ID ═══════════════════════════════ */
  nav {
    background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 10px 0 40px;
  }
  .group {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--ink-4);
    padding: 14px 14px 6px;
  }
  .tab {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 12px 7px 14px; cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .14s var(--ease);
  }
  .tab:hover { background: var(--panel-2); }
  .tab.on { background: var(--panel-3); border-left-color: var(--cyan); }
  .tab .id {
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .5px;
    color: var(--cyan); width: 32px; flex: none;
  }
  .tab.on .id { color: #b6f2ff; }
  .tab .nm { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.on .nm { color: var(--ink); }
  .tab .chg {
    width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
    flex: none; margin-left: auto; box-shadow: 0 0 6px var(--gold); opacity: 0;
  }
  .tab.edited .chg { opacity: 1; }

  /* ══ the stage ════════════════════════════════════════════════════════ */
  main {
    background: var(--void); overflow-y: auto; position: relative;
    display: flex; flex-direction: column;
  }
  .stage-head {
    display: flex; align-items: baseline; gap: 12px;
    padding: 16px 22px 0; flex: none;
  }
  /* The one true step up. Everything else on this page is an instrument label
     separated by family, colour and tracking rather than by size — but the name
     of the thing you are tuning has to win outright, and 15px against 13px body
     was not a step, it was a wobble. */
  .stage-head h1 { font-family: var(--display); font-size: 20px; letter-spacing: 2px; color: var(--ink); font-weight: 400; }
  .stage-head .code {
    font-family: var(--mono); font-size: 11px; color: #041018; background: var(--cyan);
    padding: 2px 7px; border-radius: 4px; font-weight: 700; letter-spacing: 1px;
  }
  .stage-head .note { font-size: 11px; color: var(--ink-3); margin-left: auto; max-width: 46ch; text-align: right; line-height: 1.45; }

  .hero { flex: 1; display: grid; place-items: center; padding: 10px 22px; min-height: 300px; }
  .hero canvas { max-width: 100%; }
  .scales {
    flex: none; display: flex; gap: 20px; align-items: flex-end; justify-content: center;
    padding: 12px 22px 22px; border-top: 1px solid var(--line-soft);
    background: linear-gradient(180deg, rgba(8,18,38,.5), transparent);
  }
  .scale { text-align: center; }
  .scale canvas { display: block; margin: 0 auto 6px; }
  .scale span {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--ink-4);
  }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 4px 0; padding: 16px 22px 30px; width: 100%; }
  .cell { text-align: center; padding: 8px 4px; border-radius: 8px; cursor: pointer; transition: background .14s var(--ease); }
  .cell:hover { background: rgba(15,33,64,.6); }
  .cell canvas { display: block; margin: 0 auto 7px; }
  .cell b { display: block; font-family: var(--mono); font-size: 11px; color: var(--cyan); letter-spacing: 1px; }
  .cell span { display: block; font-size: 10px; color: var(--ink-3); }

  /* the mix tab's own furniture */
  .mixbar { display: flex; height: 34px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); width: 100%; max-width: 640px; }
  .mixbar div { display: grid; place-items: center; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: #04121c; }
  .ladder { width: 100%; max-width: 720px; margin-top: 22px; }
  .ladder .row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .ladder .cn { font-family: var(--mono); font-size: 10px; color: var(--ink-3); width: 120px; flex: none; text-align: right; }
  .ladder .k {
    font-family: var(--mono); font-size: 9px; letter-spacing: .5px; padding: 3px 0;
    border-radius: 3px; flex: 1; text-align: center; color: #04121c; font-weight: 700;
  }
  .k-planet { background: #6fe3ff; } .k-station { background: #c4d8f0; }
  .k-gate { background: #60e0d0; } .k-star { background: #ffd24a; }

  /* ══ the dials ════════════════════════════════════════════════════════ */
  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 0 0 60px;
  }
  .dials-head {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line-soft);
  }
  .dials-head b { font-family: var(--mono); font-size: 10px; letter-spacing: 1.6px; color: var(--ink-4); text-transform: uppercase; font-weight: 400; }
  .dials-head button { padding: 4px 8px; font-size: 10px; }

  .dial { padding: 9px 14px 11px; border-bottom: 1px solid rgba(14,34,66,.55); }
  .dial.edited { background: rgba(255,210,74,.045); box-shadow: inset 2px 0 0 var(--gold); }
  .dial > .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .dial .key { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
  .dial .lbl { font-size: 10px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dial .val {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--cyan);
    background: transparent; border: 1px solid transparent; border-radius: 4px;
    width: 68px; text-align: right; padding: 1px 4px;
  }
  .dial .val:hover { border-color: var(--line); }
  .dial .val:focus { outline: none; border-color: var(--cyan); background: var(--void); color: var(--ink); }
  .dial.edited .key { color: var(--gold); }

  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    background: var(--line); border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--ink-2); cursor: pointer; border: 2px solid var(--panel);
    box-shadow: 0 0 0 1px var(--line);
  }
  input[type=range]:hover::-webkit-slider-thumb { background: var(--cyan); }

  .rgb { display: flex; align-items: center; gap: 8px; }
  .rgb input[type=color] {
    -webkit-appearance: none; appearance: none; width: 40px; height: 26px;
    border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; padding: 0;
  }
  .rgb input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  .rgb input[type=color]::-webkit-color-swatch { border: none; border-radius: 3px; }
  .rgb .trip {
    flex: 1; font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    background: var(--void); border: 1px solid var(--line); border-radius: 5px;
    padding: 4px 7px;
  }
  .rgb .trip:focus { outline: none; border-color: var(--cyan); color: var(--ink); }

  .hint { padding: 12px 14px; font-size: 11px; color: var(--ink-4); line-height: 1.55; }
  .hint code { font-family: var(--mono); color: var(--ink-3); }

  .boot { grid-column: 1 / -1; grid-row: 2; display: grid; place-items: center; padding: 40px; }
  .boot p { font-family: var(--mono); font-size: 12px; color: var(--ink-3); max-width: 60ch; text-align: center; line-height: 1.7; }
  .boot p b { color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="brand">DESTINATIONS <span>/ LAB</span></div>
  <div class="state" id="state" data-s="ok"><i class="dot"></i><span id="stateTxt">in sync with the game</span></div>
  <div class="spacer"></div>
  <button id="btnBrief" title="Copy a plain-text list of what you changed, ready to paste into a chat">Copy brief</button>
  <button id="btnRevert" title="Throw away every change and reload from the game source">Revert all</button>
  <button id="btnApply" class="go" title="Write these values back into src/game/80-tunnel.js (DEST-DATA)">Write to game</button>
</header>

<nav id="rail"></nav>
<main id="stage"></main>
<aside id="dials"></aside>

<script>
'use strict';

/* ─────────────────────────────────────────────────────────────────────────
   The lab does not own a renderer. It lifts the marked regions out of the
   game's own source in src/game/ — the data tables, the deterministic pick,
   the planet pixel shader, the built stations and what lives at a destination
   — and evaluates them here. Every pixel on this page therefore comes off the
   game's own code. If the game changes, the lab changes with it; there is
   nothing to keep in sync by hand. (The regions are READ out of the whole
   concatenation and WRITTEN back to the one file that holds them, so a file
   boundary can move without the lab noticing.)
   ───────────────────────────────────────────────────────────────────────── */

let G = null;          // the evaluated game regions
let DEFAULTS = null;   // deep copy of the tables as the game source has them
let rev = 0;           // bumped on every edit; keys the sprite cache
let cur = 'ALL';
let dirty = false;

const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
// canvas cannot resolve var(), so the one label drawn INTO a canvas reads the
// token off the root rather than repeating the literal
const INK4 = getComputedStyle(document.documentElement).getPropertyValue('--ink-4').trim() || '#4d6c93';

/* ── dial metadata ───────────────────────────────────────────────────────
   [label, min, max, step] for a number, or [label, 'rgb'] for a 0–255 triple
   stored as an array, or [label, 'rgbs'] for one stored as an 'r,g,b' string.
   A key with no entry here still gets a dial — it just gets a generic range.
   A key NOT PRESENT on the object gets no dial at all, which is what keeps the
   lab from inventing fields the writer would then fail to find. */
const DIALS = {
  world: {
    z:     ['surface colour (LAND on a solid world)', 'rgb'],
    belt:  ['band colour (SEA on a land world)', 'rgb'],
    bf:    ['band count', 0.5, 32, 0.1],
    ba:    ['band strength (climate tint on solid worlds)', 0, 1, 0.01],
    atmo:  ['air colour', 'rgb'],
    ak:    ['air amount', 0, 3, 0.05],
    glow:  ['belt emission', 0, 2, 0.05],
    emis:  ['self-lit', 0, 1, 0.05],
    // Per-world terrain. Each one overrides the same dial in SHD, so a world can
    // be pulled away from the shared model without moving the other eight.
    terr:  ['surface model', 'enum', ['land', 'rock', 'ice', 'lava', 'dune']],
    seed:  ['which world this is', 0, 512, 1],
    sea:   ['how much of it is water', 0, 1, 0.01],
    terrF: ['feature scale (low = bigger)', 0.5, 12, 0.05],
    mtn:   ['mountain height', 0, 1, 0.01],
    arid:  ['equatorial desert', 0, 1, 0.01],
    cap:   ['ice caps start at |lat|', 0.3, 1, 0.01],
    cloud: ['cloud opacity', 0, 1, 0.01],
    cratF: ['crater density', 1, 20, 0.1],
    cratD: ['crater depth', 0, 1, 0.01],
    lavaLvl: ['melt coverage (high = thinner cracks)', 0.3, 1, 0.005],
    lavaK: ['melt glow', 0, 3, 0.05],
    bump:  ['relief strength', 0, 0.2, 0.002],
    // Two worlds are not a shaded ball at all.
    ring:   ['ring inner, outer (radii)', 'vec'],
    ringC:  ['ring colour', 'rgb'],
    ringA:  ['ring opacity', 0, 1, 0.01],
    field:  ['rocks in the swarm', 0, 300, 1],
    fieldR: ['how wide the swarm spreads', 0.2, 2, 0.01],
    fieldSq:['how flat the swarm is', 0.1, 1, 0.01]
  },
  // ── the built stations ──────────────────────────────────────────────
  // Geometry is code; these are the things that decide how it READS. The light
  // dials move all five builds at once, which is the point of them being here.
  S3D_LIGHT: {
    el:     ['camera elevation over the ring plane', 0.15, 1.2, 0.01],
    dist:   ['camera distance (lower = more perspective)', 3, 24, 0.5],
    lx:     ['sun X', -1, 1, 0.02],
    ly:     ['sun Y', -1, 1, 0.02],
    lz:     ['sun Z (low = grazing, and grazing is what shows relief)', -1, 1, 0.02],
    sun:    ['key strength', 0, 6, 0.05],
    sunG:   ['key green (warmth)', 0.6, 1.2, 0.01],
    sunB:   ['key blue (warmth)', 0.5, 1.2, 0.01],
    skyR:   ['ambient from above · red', 0, 0.4, 0.002],
    skyG:   ['ambient from above · green', 0, 0.4, 0.002],
    skyB:   ['ambient from above · blue', 0, 0.4, 0.002],
    gndR:   ['ambient from below · red', 0, 0.2, 0.002],
    gndG:   ['ambient from below · green', 0, 0.2, 0.002],
    gndB:   ['ambient from below · blue', 0, 0.2, 0.002],
    filR:   ['cold fill · red', 0, 0.5, 0.005],
    filG:   ['cold fill · green', 0, 0.5, 0.005],
    filB:   ['cold fill · blue', 0, 0.5, 0.005],
    filX:   ['fill direction X', -1, 1, 0.02],
    filY:   ['fill direction Y', -1, 1, 0.02],
    filZ:   ['fill direction Z', -1, 1, 0.02],
    shadowFloor: ['how much light survives inside a shadow', 0, 0.3, 0.002],
    aoK:    ['crevice occlusion strength', 0, 3, 0.05],
    aoR:    ['crevice occlusion reach (station radii)', 0.01, 0.3, 0.005],
    rimK:   ['star field wrapping the silhouette', 0, 0.4, 0.005],
    bloom:  ['bloom off the lit windows', 0, 3, 0.02],
    exposure: ['exposure', 0.1, 2, 0.02],
    lampK:  ['how hard a lamp lights its own hull', 0, 2, 0.02],
    lampR:  ['lamp reach (station radii)', 0.02, 0.5, 0.005],
    lampRef:['lamp knee — inside this the falloff levels off', 0.05, 1, 0.01],
    haloR:  ['halo radius, in lamp radii', 1, 12, 0.1],
    haloA:  ['halo peak', 0, 1.5, 0.01],
    coreA:  ['the bright centre', 0, 1.5, 0.01],
    chroma: ['refraction: the cold skirt outside the warm centre', 0, 1, 0.01],
    spike:  ['refraction: diffraction cross', 0, 1, 0.01],
    spikeL: ['cross length, in halo radii', 0.5, 8, 0.1],
    spikeMin: ['only lamps this many pixels across throw one', 0, 6, 0.1],
    detail:  ['how much hardware every build carries', 0.2, 1.6, 0.05],
    detailLow: ['...and what that becomes on a lowFX device', 0.2, 1, 0.05],
    bakeMs:  ['bake slice on a frame with room to spare (ms)', 1, 16, 0.5],
    bakeMin: ['...and the slice it gets on one without (ms)', 0, 8, 0.5]
  },
  S3D_WARP: {
    minPx:    ['skip the layer under this many pixels', 0, 40, 1],
    streaks:  ['filaments falling down the throat', 0, 48, 1],
    streakW:  ['filament width, sprite pixels', 0.4, 6, 0.1],
    len:      ['how far one filament reaches, in aperture radii', 0.05, 1, 0.01],
    speed:    ['how fast they fall', 0.02, 2, 0.02],
    swirl:    ['how far they twist on the way down', 0, 3, 0.05],
    bright:   ['filament peak', 0, 1.5, 0.01],
    core:     ['the standing glow they fall into', 0, 1, 0.01],
    pulse:    ['how deep the throat breathes', 0, 1, 0.01],
    pulseP:   ['...and its period, seconds', 0.4, 12, 0.1],
    grain:    ['film grain over the aperture', 0, 0.6, 0.005],
    grainPx:  ['grain size, sprite pixels', 1, 8, 0.5],
    grainFps: ['how often the grain reshuffles (film is 24)', 1, 30, 1],
    col:      ['field colour', 'rgbs']
  },
  S3D_LAMPS: {
    steadyK:  ['a steady light still breathes: how much', 0, 0.5, 0.005],
    steadyP:  ['...and how fast', 0.05, 3, 0.05],
    beaconP:  ['beacon period, seconds', 0.5, 12, 0.1],
    beaconD:  ['beacon dwell — higher holds it dark longer', 1, 10, 0.1],
    strobeP:  ['strobe period, seconds', 0.5, 10, 0.1],
    strobeW:  ['strobe flash width, as a fraction of the period', 0.005, 0.3, 0.005],
    strobeGap:['gap between the two flashes', 0.02, 0.5, 0.005],
    slowP:    ['slow light period, seconds', 0.5, 14, 0.1],
    slowOff:  ['...and how much of it is dark', 0.02, 0.6, 0.005]
  },
  DEST_LIFE: {
    n0:        ['features dealt, fewest', 0, 5, 1],
    n1:        ['features dealt, most', 0, 5, 1],
    vis0:      ['life fades in at R/nodeR', 0, 1, 0.01],
    vis1:      ['and reaches full after', 0.01, 1, 0.01],
    creep:     ['terminator swing (rad)', 0, 1, 0.005],
    creepRate: ['how slowly it swings', 0, 0.3, 0.001],
    nightK:    ['night limb darkening', 0, 1, 0.01],
    clus0:     ['city clusters, fewest', 0, 30, 1],
    clusN:     ['extra clusters', 0, 30, 1],
    perClus:   ['lights per cluster', 0, 30, 1],
    lightsO:   ['city light brightness', 0, 1, 0.01],
    lightsC:   ['city light colour', 'rgbs'],
    moonR:     ['moon size', 0, 0.5, 0.005],
    moonO:     ['moon distance, near/far', 'vec'],
    moonC:     ['moon colour', 'rgbs'],
    shipN:     ['departures, most', 0, 12, 1],
    shipO:     ['wake brightness', 0, 1, 0.01],
    shipPer:   ['gap between departures', 'vec'],
    arrK:      ['arrival radius (ring radii)', 0.1, 1.2, 0.01],
    compR:     ['companion size', 0, 0.6, 0.005],
    compV:     ['...varies either way by', 0, 1, 0.01],
    compD:     ['companion offset, near/far', 'vec'],
    compPar:   ['companion parallax', 1, 2.5, 0.01],
    compFin:   ['endpoint build, larger by', 1, 3, 0.01],
    twinkle:   ['deep-sky scintillation', 0, 1, 0.01],
    blinkP:    ['share of slow blinkers', 0, 1, 0.01]
  },
  PLANET_SHADE: {
    lz:            ['key light toward viewer', 0, 1.5, 0.01],

/* ── the rail ────────────────────────────────────────────────────────── */
function railItems() {
  const out = [{ g: 'OVERVIEW', id: 'ALL', n: 'contact sheet' }];
  out.push({ g: 'WORLDS', id: 'SHD', n: 'shared shading' });
  G.PLANET_TYPES.forEach(p => out.push({ id: p.id, n: p.n }));
  out.push({ id: G.PLANET_STAR.id, n: G.PLANET_STAR.n + ' (boss)' });
  out.push({ g: 'STATIONS 3D', id: G.S3D_LIGHT.id, n: 'light & material' });
  out.push({ id: G.S3D_LAMPS.id, n: 'how lights blink' });
  out.push({ id: G.S3D_WARP.id, n: 'the gate throat' });
  G.S3D_BUILDS.forEach(b => out.push({ id: 'B:' + b.id, n: b.n }));
  out.push({ g: 'THE PLACE', id: G.DEST_LIFE.id, n: 'what lives there' });
  out.push({ id: G.DEST_MIX.id, n: 'kind mix' });
  return out;
}

function buildRail() {
  const rail = $('#rail');
  rail.innerHTML = '';
  for (const it of railItems()) {
    if (it.g) {
      const h = document.createElement('div');
      h.className = 'group'; h.textContent = it.g;
      rail.appendChild(h);
    }
    const el = document.createElement('div');
    el.className = 'tab'; el.dataset.id = it.id;
    el.innerHTML = '<span class="id"></span><span class="nm"></span><i class="chg"></i>';
    el.querySelector('.id').textContent = it.id;
    el.querySelector('.nm').textContent = it.n;
    el.onclick = () => select(it.id);
    rail.appendChild(el);
  }
  markRail();
}

function markRail() {
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('on', el.dataset.id === cur);
    el.classList.toggle('edited', tabChanges(el.dataset.id).length > 0);
  });
}

/* ── which table does an ID point at ─────────────────────────────────── */
function target(id) {
  if (id === 'SHD') return { live: G.PLANET_SHADE, base: DEFAULTS.PLANET_SHADE, dials: DIALS.PLANET_SHADE, name: 'shared world shading' };
  if (id === 'SUN') return { live: G.PLANET_STAR, base: DEFAULTS.PLANET_STAR, dials: DIALS.world, name: G.PLANET_STAR.n };
  if (id === 'MIX') return { live: G.DEST_MIX, base: DEFAULTS.DEST_MIX, dials: DIALS.DEST_MIX, name: 'kind mix' };
  if (id === 'LIF') return { live: G.DEST_LIFE, base: DEFAULTS.DEST_LIFE, dials: DIALS.DEST_LIFE, name: 'what lives there' };
  if (id === 'S3L') return { live: G.S3D_LIGHT, base: DEFAULTS.S3D_LIGHT, dials: DIALS.S3D_LIGHT, name: 'built-station light & material', s3: 'FORT' };
  if (id === 'S3B') return { live: G.S3D_LAMPS, base: DEFAULTS.S3D_LAMPS, dials: DIALS.S3D_LAMPS, name: 'how the lights blink', s3: 'PORT' };
  if (id === 'WRP') return { live: G.S3D_WARP, base: DEFAULTS.S3D_WARP, dials: DIALS.S3D_WARP, name: 'the gate throat', s3: 'GATE' };
  if (id.slice(0, 2) === 'B:') {
    // A build has no dials of its own — its geometry is code, not a table — so
    // the tab shows the shared light dials and draws THAT build: you tune what
    // is shared while looking at the one you care about.
    const b = G.S3D_BUILDS.find(x => x.id === id.slice(2));
    if (b) return { live: G.S3D_LIGHT, base: DEFAULTS.S3D_LIGHT, dials: DIALS.S3D_LIGHT, name: b.n, s3: b.id };
  }
  const i = G.PLANET_TYPES.findIndex(p => p.id === id);
  if (i >= 0) return { live: G.PLANET_TYPES[i], base: DEFAULTS.PLANET_TYPES[i], dials: DIALS.world, name: G.PLANET_TYPES[i].n };
  return null;
}

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function tabChanges(id) {
  const t = target(id);
  if (!t) return [];
  return Object.keys(t.live)
    .filter(k => k !== 'id' && k !== 'n' && !same(t.live[k], t.base[k]))
    .map(k => ({ id, key: k, from: t.base[k], to: t.live[k] }));
}
function allChanges() {
  return railItems().filter(i => i.id !== 'ALL').flatMap(i => tabChanges(i.id));
}

/* ── dials ───────────────────────────────────────────────────────────── */
function buildDials() {
  const box = $('#dials');
  box.innerHTML = '';
  const t = target(cur);

  const head = document.createElement('div');
  head.className = 'dials-head';
  head.innerHTML = '<b></b>';
  head.querySelector('b').textContent = t ? cur + ' — ' + t.name : 'no dials';
  if (t) {
    const r = document.createElement('button');
    r.textContent = 'Reset ' + cur;
    r.style.marginLeft = 'auto';
    r.onclick = () => { Object.assign(t.live, clone(t.base)); touched(); buildDials(); };
    head.appendChild(r);
  }
  box.appendChild(head);

  if (!t) {
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = 'The contact sheet is a view, not a thing to tune. Pick a destination on the left — or click one in the sheet.';
    box.appendChild(h);
    return;
  }

  for (const key of Object.keys(t.live)) {
    if (key === 'id' || key === 'n') continue;
    box.appendChild(dialFor(t, key));
  }

  const h = document.createElement('div');
  h.className = 'hint';
  h.innerHTML = 'Every number here is a fraction of the body radius, so it holds at both the 20px chart chip and the full-size arrival. Say <code>' +
    cur + '</code> in chat to point me at this one.';
  if (cur === 'SHD') h.innerHTML = 'These are shared by every world in the table. Say <code>SHD</code> in chat to point me at them.';
  box.appendChild(h);
}

function dialFor(t, key) {
  const meta = t.dials[key] || ['', 0, 1, 0.01];
  const kind = typeof meta[1] === 'string' ? meta[1] : 'num';

  const wrap = document.createElement('div');
  wrap.className = 'dial';
  wrap.dataset.key = key;

  const top = document.createElement('div');
  top.className = 'top';
  top.innerHTML = '<span class="key"></span><span class="lbl"></span>';
  top.querySelector('.key').textContent = key;
  top.querySelector('.lbl').textContent = meta[0];
  wrap.appendChild(top);

  const flagEdited = () => wrap.classList.toggle('edited', !same(t.live[key], t.base[key]));

  // click the key name to put this one dial back
  top.querySelector('.key').style.cursor = 'pointer';
  top.querySelector('.key').title = 'reset to the game value';
  top.querySelector('.key').onclick = () => { t.live[key] = clone(t.base[key]); touched(); buildDials(); };

  if (kind === 'rgb' || kind === 'rgbs') {
    const asArr = () => kind === 'rgb' ? t.live[key].slice() : t.live[key].split(',').map(Number);
    const put = arr => {
      t.live[key] = kind === 'rgb' ? arr : arr.join(',');
      touched(); flagEdited();
    };
    const row = document.createElement('div');
    row.className = 'rgb';
    const hex = document.createElement('input');
    hex.type = 'color';
    hex.value = '#' + asArr().map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
    const trip = document.createElement('input');
    trip.className = 'trip'; trip.value = asArr().join(', ');
    hex.oninput = () => {
      const v = hex.value;
      const arr = [1, 3, 5].map(i => parseInt(v.substr(i, 2), 16));
      trip.value = arr.join(', '); put(arr);
    };
    trip.onchange = () => {
      const arr = trip.value.split(',').map(s => Math.max(0, Math.min(255, Math.round(+s) || 0)));
      if (arr.length !== 3) { trip.value = asArr().join(', '); return; }
      hex.value = '#' + arr.map(v => v.toString(16).padStart(2, '0')).join('');
      put(arr);
    };
    row.append(hex, trip);
    wrap.appendChild(row);
    flagEdited();
    return wrap;
  }

  if (kind === 'enum') {
    // A dial whose value is a NAME, not a magnitude. It needs a picker, because
    // the generic slider below would happily write 0.37 into it — which is how
    // dragging `terr` turned a world into a textured mess instead of changing
    // its surface model. Anything nameable belongs here, not on a range input.
    const sel = document.createElement('select');
    sel.className = 'trip';
    for (const opt of ['(none)', ...meta[2]]) {
      const o = document.createElement('option');
      o.value = opt === '(none)' ? '' : opt; o.textContent = opt;
      sel.appendChild(o);
    }
    sel.value = t.live[key] || '';
    sel.onchange = () => { t.live[key] = sel.value; touched(); flagEdited(); };
    wrap.appendChild(sel);
    flagEdited();
    return wrap;
  }

  if (kind === 'vec') {
    // a small tuple (an axis, an ellipse) — three or two plain numbers, no slider
    const row = document.createElement('div');
    row.className = 'rgb';
    const inp = document.createElement('input');
    inp.className = 'trip'; inp.value = t.live[key].join(', ');
    inp.onchange = () => {
      const arr = inp.value.split(',').map(s => +s);
      if (arr.length !== t.live[key].length || arr.some(isNaN)) { inp.value = t.live[key].join(', '); return; }
      t.live[key] = arr; touched(); flagEdited();
    };
    row.appendChild(inp);
    wrap.appendChild(row);
    flagEdited();
    return wrap;
  }

  const [, lo, hi, step] = meta;
  const val = document.createElement('input');
  val.className = 'val'; val.value = t.live[key];
  top.appendChild(val);
  const rng = document.createElement('input');
  rng.type = 'range'; rng.min = lo; rng.max = hi; rng.step = step; rng.value = t.live[key];
  wrap.appendChild(rng);

  rng.oninput = () => { t.live[key] = +rng.value; val.value = rng.value; touched(); flagEdited(); };
  val.onchange = () => {
    const v = +val.value;
    if (isNaN(v)) { val.value = t.live[key]; return; }
    t.live[key] = v; rng.value = v; touched(); flagEdited();   // typed values may exceed the slider on purpose
  };
  flagEdited();
  return wrap;
}

/* ── state ───────────────────────────────────────────────────────────── */
let saveTimer = null;
function touched() {
  rev++;
  // the dealt hand is memoised per relay, so a DEST_LIFE dial would otherwise
  // not show until the relay changed
  if (G && G.resetLife) G.resetLife();
  // ...and the sandbox bakes its OWN station sprites for the ones in orbit.
  // That cache never dropped, so light and detail dials moved the destination
  // while the station orbiting it kept the look it was first baked with.
  if (G && G.resetS3) G.resetS3();
  dirty = allChanges().length > 0;
  setState(dirty ? 'dirty' : 'ok',
    dirty ? allChanges().length + ' change' + (allChanges().length === 1 ? '' : 's') + ' not yet in the game'
          : staleWork ? 'showing the game — an older saved session was set aside'
          : 'in sync with the game');
  markRail();
  draw();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveWork, 500);
}
function setState(s, txt) {
  $('#state').dataset.s = s;
  $('#stateTxt').textContent = txt;
}
function payload() {
  return {
    PLANET_TYPES: G.PLANET_TYPES, PLANET_STAR: G.PLANET_STAR, PLANET_SHADE: G.PLANET_SHADE,
    DEST_MIX: G.DEST_MIX, DEST_LIFE: G.DEST_LIFE,
    S3D_LIGHT: G.S3D_LIGHT, S3D_LAMPS: G.S3D_LAMPS, S3D_WARP: G.S3D_WARP
  };
}
function saveWork() {
  if (!dirty) { fetch('/api/work', { method: 'DELETE' }); return; }
  fetch('/api/work', { method: 'PUT', body: JSON.stringify(payload()) }).catch(() => {});
}

/* ── the stage ───────────────────────────────────────────────────────── */
const spriteCache = new Map();
let cacheRev = -1;
function sprite(V, R) {
  if (cacheRev !== rev) { spriteCache.clear(); cacheRev = rev; }
  const k = V.id + '@' + R;
  if (!spriteCache.has(k)) spriteCache.set(k, G.buildPlanetSprite(R, V));
  return spriteCache.get(k);
}
function blit(c, V, R, x, y, max) {
  const s = sprite(V, R);
  if (!s) return;
  // A ringed world's sprite is nearly twice as wide as a plain one's, because the
  // ring lives in the same image. Drawn at natural size it overflows its cell and
  // the ring reads as CUT — which it never is: the game draws the whole sprite,
  // scaled, onto an unclipped canvas. Scaling to fit here means the preview
  // cannot tell a lie about the art that the game does not tell.
  const w = max && s.S > max ? max : s.S;
  c.drawImage(s.cv, x - w / 2, y - w / 2, w, w);
}
// Any destination, at any radius, on any context — one entry point, so the
// contact sheet and the hero cannot disagree about how a thing is drawn.
//
// The ring art draws through the game's module-level `ctx`, so the context is
// handed to the sandbox rather than passed as an argument. That is the game's
// own shape and the lab bends to it, not the other way round.
// The built stations are BAKED, not drawn, so the lab caches a sprite per build
// per revision and rebuilds only when a dial actually moves. It bakes at half
// the game's supersample so a dial drag stays answerable; the game's own bake is
// the one that ships.
const s3Cache = new Map();
let s3Rev = -1;
function s3lab(id) {
  if (s3Rev !== rev) { s3Cache.clear(); s3Rev = rev; }
  if (!s3Cache.has(id)) {
    const b = G.s3build(id), M = new G.S3Mesh();
    b.fn(M, 4801 + id.charCodeAt(0) * 131);
    const REF = 300;
    s3Cache.set(id, G.s3render(M, { w: REF, h: REF, ss: 1, scale: REF * b.cam }));
  }
  return s3Cache.get(id);
}
function drawS3(c, id, R, x, y, t) {
  const sp = s3lab(id);
  if (!sp) return false;
  const H = G.S3D_LIGHT, w = sp.S * (R / sp.R), k = w / sp.S;
  c.drawImage(sp.cv, x - w / 2, y - w / 2, w, w);
  G.s3warp(c, sp, x, y, w, 1, t);   // the gate's throat, live
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (const L of sp.lamps) {
    const b = G.s3lamp(L.k, t, L.ph);
    if (b < 0.03) continue;
    const px = x + (L.x - sp.S * 0.5) * k, py = y + (L.y - sp.S * 0.5) * k;
    const r = Math.max(0.35, L.r * k), RR = r * H.haloR;
    const g = c.createRadialGradient(px, py, 0, px, py, RR);
    g.addColorStop(0, 'rgba(' + L.c + ',' + (H.haloA * b).toFixed(3) + ')');
    g.addColorStop(0.16, 'rgba(' + L.c + ',' + (H.haloA * b * 0.26).toFixed(3) + ')');
    g.addColorStop(0.48, 'rgba(' + L.c + ',' + (H.haloA * b * 0.055).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + L.c + ',0)');
    c.fillStyle = g; c.beginPath(); c.arc(px, py, RR, 0, Math.PI * 2); c.fill();
    if (H.spike > 0.01 && r >= H.spikeMin) {
      const len = RR * H.spikeL, sa = (H.spike * b * 0.30).toFixed(3);
      for (const vert of [0, 1]) {
        const gg = vert ? c.createLinearGradient(px, py - len, px, py + len)
                        : c.createLinearGradient(px - len, py, px + len, py);
        gg.addColorStop(0, 'rgba(' + L.c + ',0)');
        gg.addColorStop(0.5, 'rgba(' + L.c + ',' + sa + ')');
        gg.addColorStop(1, 'rgba(' + L.c + ',0)');
        c.fillStyle = gg;
        if (vert) c.fillRect(px - r * 0.30, py - len, r * 0.60, len * 2);
        else c.fillRect(px - len, py - r * 0.30, len * 2, r * 0.60);
      }
    }
    c.fillStyle = 'rgba(' + L.c + ',' + (H.coreA * b).toFixed(3) + ')';
    c.beginPath(); c.arc(px, py, r, 0, Math.PI * 2); c.fill();
  }
  c.restore();
  return true;
}
function drawDest(c, id, R, x, y, t, max) {
  const T = target(id);
  if (T && T.s3) return drawS3(c, T.s3, R, x, y, t);
  const V = id === 'SUN' ? G.PLANET_STAR : G.PLANET_TYPES.find(p => p.id === id);
  if (V) blit(c, V, R, x, y, max);
}
function cv(w, h) {
  const el = document.createElement('canvas');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  el.width = w * dpr; el.height = h * dpr;
  el.style.width = w + 'px'; el.style.height = h + 'px';
  const c = el.getContext('2d');
  c.scale(dpr, dpr);
  return { el, c, w, h };
}

// Ceilings for the grown canvases — past these the art is scaled to fit rather
// than cropped, because the stage column is only so wide. Nothing is ever cut.
const HERO_MAX = 760, SCALE_MAX = 230;

let stageDraw = () => {};
function select(id) {
  cur = id;
  markRail();
  buildStage();
  buildDials();
}

function buildStage() {
  const st = $('#stage');
  st.innerHTML = '';
  const t = target(cur);

  const head = document.createElement('div');
  head.className = 'stage-head';
  head.innerHTML = '<span class="code"></span><h1></h1><div class="note"></div>';
  head.querySelector('.code').textContent = cur;
  head.querySelector('h1').textContent = t ? t.name : 'all destinations';
  head.querySelector('.note').textContent = NOTES[cur] ||
    'A world at the end of a lane. It grows across the run and the chart shows the same body as a chip, off this same renderer.';
  st.appendChild(head);

  if (cur === 'ALL' || cur === 'SHD') return sheetStage(st);
  if (cur === 'MIX') return mixStage(st);
  if (cur === 'LIF') return arrivalStage(st);
  return bodyStage(st);
}

/* one destination, at the sizes it is actually seen at */
// How much room a destination actually needs at radius R, in pixels. A star's
// corona and a ringed world's ring both reach far past the body, and the sprite
// already knows exactly how far — so ask it rather than guessing a square.
function footprint(id, R) {
  const V = id === 'SUN' ? G.PLANET_STAR : G.PLANET_TYPES.find(p => p.id === id);
  const s = V && sprite(V, R);
  return s ? Math.ceil(s.S) : Math.ceil(R * 2.6);
}
// Grow a preview canvas to hold its art at FULL SIZE. Sizing the canvas to the
// art instead of squeezing the art into the canvas is what keeps the body
// exactly R pixels across in every cell — so the three scale cells still compare
// honestly, and a star is shown whole at the size the game draws it, rather than
// cropped by a fixed square or shrunk to fit one.
function grow(holder, cvRef, id, R, cap) {
  const need = Math.max(110, Math.min(cap, footprint(id, R)));
  if (need === cvRef.w) return cvRef;
  const next = cv(need, need);
  holder.replaceChild(next.el, cvRef.el);
  return next;
}

function bodyStage(st) {
  const hero = document.createElement('div');
  hero.className = 'hero';
  let big = cv(420, 420);
  hero.appendChild(big.el);
  st.appendChild(hero);

  const strip = document.createElement('div');
  strip.className = 'scales';
  // The three moments a destination is seen at: departure (a speck at the
  // vanishing point), mid-run, and the chart chip. If it only reads at one of
  // these it is not finished.
  const SCALES = [[14, 'departure'], [38, 'mid-run'], [24, 'chart chip']];
  const small = SCALES.map(([R, label]) => {
    const s = cv(110, 110);
    const w = document.createElement('div');
    w.className = 'scale';
    const cap = document.createElement('span');
    cap.textContent = label;
    w.append(s.el, cap);
    strip.appendChild(w);
    return { s, R, holder: w };
  });
  st.appendChild(strip);

  stageDraw = t => {
    // a swarm has no disc — it needs the extra room its rocks scatter into
    const R = (V0 => V0 && V0.field)(G.PLANET_TYPES.find(p => p.id === cur)) ? 150 : 130;
    big = grow(hero, big, cur, R, HERO_MAX);
    big.c.clearRect(0, 0, big.w, big.h);
    // the haze the game puts around every body, so a colour is judged in air
    const V = cur === 'SUN' ? G.PLANET_STAR : G.PLANET_TYPES.find(p => p.id === cur);
    if (V) {
      const hz = big.c.createRadialGradient(big.w / 2, big.h / 2, R * 0.8, big.w / 2, big.h / 2, R * 1.9);
      hz.addColorStop(0, 'rgba(' + V.atmo + ',0.075)');
      hz.addColorStop(1, 'rgba(' + V.atmo + ',0)');
      big.c.fillStyle = hz;
      big.c.fillRect(0, 0, big.w, big.h);
    }
    drawDest(big.c, cur, R, big.w / 2, big.h / 2, t, Math.min(big.w, big.h));
    for (let i = 0; i < small.length; i++) {
      const it = small[i];
      it.s = grow(it.holder, it.s, cur, it.R, SCALE_MAX);
      it.s.c.clearRect(0, 0, it.s.w, it.s.h);
      drawDest(it.s.c, cur, it.R, it.s.w / 2, it.s.h / 2, t, Math.min(it.s.w, it.s.h));
    }
  };
}

/* every destination at once — the only view that answers "do these read as one
   set", which is a question no single-body view can be asked */
function sheetStage(st) {
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  // Worlds, the boss star, and then every BUILT destination — the four station
  // builds and the gate. 'STN' and 'GAT' used to sit here as one station and one
  // gate, because there was only ever one of each; a build has replaced both, and
  // there are five of them, so the sheet shows the five.
  const ids = cur === 'SHD'
    ? G.PLANET_TYPES.map(p => p.id).concat(['SUN'])
    : G.PLANET_TYPES.map(p => p.id).concat(['SUN'], G.S3D_BUILDS.map(b => 'B:' + b.id));
  const cells = ids.map(id => {
    const t = target(id);
    const s = cv(110, 110);
    const el = document.createElement('div');
    el.className = 'cell';
    el.innerHTML = '<b></b><span></span>';
    el.querySelector('b').textContent = id.slice(0, 2) === 'B:' ? id.slice(2) : id;
    el.querySelector('span').textContent = t ? t.name : '';
    el.insertBefore(s.el, el.firstChild);
    el.onclick = () => select(id);
    sheet.appendChild(el);
    return { s, id };
  });
  st.appendChild(sheet);
  stageDraw = t => {
    for (const { s, id } of cells) {
      s.c.clearRect(0, 0, s.w, s.h);
      drawDest(s.c, id, 38, s.w / 2, s.h / 2, t, Math.min(s.w, s.h));
    }
  };
}

/* THE ARRIVAL. The one view that answers what the destination system is actually
   for: not "is this planet nice" but "does this place feel inhabited". Composed
   from the same pieces, in the same order, as drawFarGlow does it — far-half
   orbits, body, creeping terminator, near-half life. */
function arrivalStage(st) {
  const hero = document.createElement('div');
  hero.className = 'hero';
  const big = cv(460, 400);
  hero.appendChild(big.el);
  st.appendChild(hero);

  const strip = document.createElement('div');
  strip.className = 'scales';
  strip.style.flexDirection = 'column';
  strip.style.alignItems = 'stretch';
  strip.style.gap = '10px';

  // WHICH RELAY. The hand is dealt per relay, so a preview that cannot change
  // relay is showing one deal and calling it the system.
  const pick = document.createElement('div');
  pick.className = 'row';
  pick.style.cssText = 'display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap';
  let campI = 0, lv = 0, approach = 0.55;
  const relayLabel = document.createElement('span');
  relayLabel.style.cssText = 'font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:1px';
  // walk relay by relay across the WHOLE ladder, using each contract's real
  // length — the old walk assumed eight everywhere and would have skipped or
  // repeated relays the moment one campaign was a different size
  const step = (d) => {
    lv += d;
    while (lv < 0) { campI = (campI + CAMPS.length - 1) % CAMPS.length; lv += CAMPS[campI].levels.length; }
    while (lv > CAMPS[campI].levels.length - 1) { lv -= CAMPS[campI].levels.length; campI = (campI + 1) % CAMPS.length; }
    G.resetLife();
    render();
  };
  const btn = (txt, d) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = () => step(d); return b; };
  const dice = document.createElement('button');
  dice.textContent = 'Next relay';
  dice.onclick = () => step(1);
  pick.append(btn('‹', -1), relayLabel, btn('›', 1), dice);
  strip.appendChild(pick);

  // HOW CLOSE. Life ramps in with the approach, so vis0/vis1 can only be judged
  // by scrubbing through it.
  const scrub = document.createElement('div');
  scrub.style.cssText = 'display:flex;gap:10px;align-items:center;max-width:520px;margin:0 auto;width:100%';
  const scrubLbl = document.createElement('span');
  scrubLbl.style.cssText = 'font-family:var(--mono);font-size:10px;color:var(--ink-4);white-space:nowrap';
  const rng = document.createElement('input');
  rng.type = 'range'; rng.min = 0.05; rng.max = 1; rng.step = 0.01; rng.value = approach;
  rng.oninput = () => { approach = +rng.value; render(); };
  scrub.append(scrubLbl, rng);
  strip.appendChild(scrub);
  st.appendChild(strip);

  function render() {
    const c0 = CAMPS[campI];
    const kind = G.destKindFor(c0.id, lv, false);
    relayLabel.textContent = campTitle(c0) + ' · ' + relayName(c0, lv) + ' · ' + kind;
    scrubLbl.textContent = 'approach ' + Math.round(approach * 100) + '%';
  }

  stageDraw = t => {
    const camp = CAMPS[campI].id;
    const c = big.c;
    c.clearRect(0, 0, big.w, big.h);
    G.set({ ctx: c, time: t, CAMP: { id: camp }, levelIdx: lv, LV: { boss: false } });

    const kind = G.destKindFor(camp, lv, false);
    const V = G.planetVariantFor(camp, lv, false);
    const fx = big.w / 2, fy = big.h / 2;
    const R = 122;
    // vis inside the life system is R/nodeR, so the scrub drives nodeR
    const geo = { nodeR: R / approach };
    const far = { x: fx, y: fy };
    const la = G.destLightA();

    // the haze the body sits in, so nothing is judged against bare black
    const hz = c.createRadialGradient(fx, fy, R * 0.8, fx, fy, R * 2.1);
    hz.addColorStop(0, 'rgba(' + V.atmo + ',0.075)');
    hz.addColorStop(1, 'rgba(' + V.atmo + ',0)');
    c.fillStyle = hz; c.fillRect(0, 0, big.w, big.h);

    G.drawDestLife(far, R, geo, false, la);        // whatever is round the back
    if (kind === 'planet') {
      blit(c, V, R, fx, fy, Math.min(big.w, big.h));
      G.drawTerminatorCreep(far, R, clamp01((R / geo.nodeR - G.DEST_LIFE.vis0) / G.DEST_LIFE.vis1), la);
    } else {
      // a station or a gate: the same build the game stands there, off the same
      // bake — so the staged arrival shows the actual destination, not a stand-in
      drawS3(c, G.s3BuildFor(camp, lv, kind), R * 1.02, fx, fy, t);
    }
    G.drawDestLife(far, R, geo, true, la);         // and everything over the top

    // name what was dealt — otherwise a quiet relay reads as a broken preview
    const F = G.destinationLife();
    const had = Object.keys(F.has).filter(k => F.has[k]);
    c.font = '10px ui-monospace, Menlo, monospace';
    c.fillStyle = INK4;
    c.fillText(had.length ? 'dealt: ' + had.join(' · ') : 'dealt: nothing', 10, big.h - 10);
  };
  render();
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

/* THE CONTRACTS, read off src/campaigns.js at boot — never a list typed in here.
   A hardcoded copy is how this lab ended up labelling relays with internal slugs
   ('investigation', 'the-bait') years after the contracts were named and renamed.
   Each entry is { id, title, levels: [name, …] }, and the level COUNT is real
   too, so a contract that grows or shrinks walks correctly. */
let CAMPS = [];
const campTitle = c => c.title || c.id;
// "05 SUBLANE DRIFT" — the number a player sees, and the name on the brief
const relayName = (c, lv) => String(lv + 1).padStart(2, '0') + ' ' + (c.levels[lv] || '—');
function mixStage(st) {
  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.style.alignContent = 'start';
  hero.style.paddingTop = '26px';

  const bar = document.createElement('div');
  bar.className = 'mixbar';
  hero.appendChild(bar);

  // the companion's own numbers. They are not part of the bar's 100 — a world
  // either is or is not the delivery, and separately does or does not carry an
  // installation — so stacking them into one bar would be a lie about the split.
  const note = document.createElement('div');
  note.className = 'hint';
  hero.appendChild(note);

  const ladder = document.createElement('div');
  ladder.className = 'ladder';
  hero.appendChild(ladder);
  st.appendChild(hero);

  stageDraw = () => {
    // A relay delivers to a WORLD or to the system's PRIMARY, and that is the
    // whole split now — stations and gates left this bar when they stopped being
    // destinations. What share of worlds carry one, and how many of those are a
    // gate, is a different question and rides under the bar as text.
    const s = G.DEST_MIX.star, p = Math.max(0, 100 - s);
    bar.innerHTML = '';
    for (const [w, lab, col] of [[p, 'WORLD ' + p, '#6fe3ff'], [s, 'PRIMARY ' + s, '#ffd24a']]) {
      const d = document.createElement('div');
      d.style.flex = w; d.style.background = col;
      d.textContent = w >= 9 ? lab : '';
      bar.appendChild(d);
    }
    const cg = G.DEST_MIX.gate;
    note.textContent = 'COMPANION on ' + G.DEST_MIX.comp + '% of worlds · '
      + (100 - cg) + '% station / ' + cg + '% gate · endpoints always, primaries never';
    // the real sequence, straight off the game's own picker — the honest answer
    // to "what will a player actually see", which a percentage cannot give
    ladder.innerHTML = '';
    for (const c0 of CAMPS) {
      const row = document.createElement('div');
      row.className = 'row';
      const nm = document.createElement('div');
      nm.className = 'cn'; nm.textContent = campTitle(c0);
      nm.title = c0.id;                              // the slug, for when it is the slug you need
      row.appendChild(nm);
      const n = c0.levels.length;
      for (let lv = 0; lv < n; lv++) {
        const isBoss = lv === n - 1;                 // the LAST relay is the duel, whatever the length
        const kind = G.destKindFor(c0.id, lv, isBoss);
        const k = document.createElement('div');
        k.className = 'k k-' + kind;
        k.textContent = kind === 'planet' ? G.planetVariantFor(c0.id, lv, false).id : kind.slice(0, 3).toUpperCase();
        k.title = campTitle(c0) + ' · ' + relayName(c0, lv) + ' — ' + kind;
        row.appendChild(k);
      }
      ladder.appendChild(row);
    }
  };
}

/* ── the loop ────────────────────────────────────────────────────────── */
let t0 = performance.now();
function draw() { stageDraw((performance.now() - t0) / 1000); }
function loop() { draw(); requestAnimationFrame(loop); }

/* ── buttons ─────────────────────────────────────────────────────────── */
function brief() {
  const ch = allChanges();
  if (!ch.length) return 'DESTINATIONS — nothing changed.';
  const fmt = v => Array.isArray(v) ? '[' + v.join(', ') + ']' : typeof v === 'string' ? "'" + v + "'" : String(v);
  const w = Math.max(...ch.map(c => c.key.length));
  return 'DESTINATIONS — ' + ch.length + ' change' + (ch.length === 1 ? '' : 's') + '\n' +
    ch.map(c => c.id.padEnd(4) + c.key.padEnd(w + 2) + fmt(c.from) + '  →  ' + fmt(c.to)).join('\n');
}

$('#btnBrief').onclick = async () => {
  try {
    await navigator.clipboard.writeText(brief());
    setState('ok', 'brief copied — paste it into the chat');
    setTimeout(() => touched(), 1800);
  } catch (e) { setState('err', 'clipboard refused — brief is in the console'); console.log(brief()); }
};

$('#btnRevert').onclick = async () => {
  if (dirty && !confirm('Throw away ' + allChanges().length + ' change(s) and reload from the game source?')) return;
  await fetch('/api/work', { method: 'DELETE' });
  location.reload();
};

$('#btnApply').onclick = async () => {
  if (!dirty) return;
  setState('busy', 'writing DEST-DATA back into the game…');
  try {
    const r = await fetch('/api/apply', { method: 'POST', body: JSON.stringify(payload()) });
    if (!r.ok) throw new Error(await r.text());
    // reload so DEFAULTS come back off the file: after a write, "changed"
    // must mean changed-since-the-write, not changed-since-the-page-opened
    location.reload();
  } catch (e) { setState('err', String(e.message || e)); }
};

// arrows walk the rail, but never while a field has focus
addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && !e.altKey) return;
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const ids = railItems().map(i => i.id);
  const at = ids.indexOf(cur);
  select(ids[(at + (e.key === 'ArrowDown' ? 1 : ids.length - 1)) % ids.length]);
  e.preventDefault();
});

/* ── boot ────────────────────────────────────────────────────────────── */
function fail(msg) {
  document.body.innerHTML = '<div class="boot"><p><b>The lab could not read the game.</b><br><br>' +
    msg.replace(/</g, '&lt;') + '</p></div>';
}

(async function boot() {
  let src;
  try {
    const r = await fetch('/api/dest-src');
    if (!r.ok) throw new Error(await r.text());
    src = await r.json();
  } catch (e) { return fail(String(e.message || e)); }

  // A STALE SERVER is its own failure, and it has to say so. This page is static
  // and re-read on every load, but scripts/dest-lab.js is a node process that
  // read its own source once at startup — so adding a region to the lab leaves a
  // running server handing back a payload with that region simply missing.
  // Interpolating `undefined` into the scope below then fails as "X is not
  // defined", which reads like a bug in the game and is not one.
  const NEED = ['rng', 'data', 'pick', 'kind', 'sprite', 'wake', 'life', 's3d', 's3dpick'];
  const missing = NEED.filter(k => typeof src[k] !== 'string');
  if (missing.length) {
    return fail('The lab SERVER is running older code than this page.\n\n' +
      'It did not send: ' + missing.join(', ') + '\n\n' +
      'Restart it — node re-reads scripts/dest-lab.js only at startup:\n\n' +
      '    npm run lab:dest');
  }

  // the real contracts. Same stale-server story as the regions above: an older
  // node process has no /api/campaigns, and a lab guessing campaign names is
  // exactly the thing this replaced.
  try {
    const r = await fetch('/api/campaigns');
    if (!r.ok) throw new Error(await r.text());
    CAMPS = await r.json();
    if (!Array.isArray(CAMPS) || !CAMPS.length) throw new Error('no contracts in src/campaigns.js');
  } catch (e) {
    return fail('The lab SERVER could not hand over the contracts (/api/campaigns):\n\n' +
      String(e.message || e) + '\n\n' +
      'If it 404s, the server is older than this page. Restart it — node re-reads\n' +
      'scripts/dest-lab.js only at startup:\n\n' +
      '    npm run lab:dest');
  }

  // The game's own regions, in a scope holding only what they are allowed to
  // reach. If one of them ever grabs another game global, it fails loudly here
  // rather than drawing something subtly wrong.
  try {
    G = new Function(`
      const TAU = Math.PI * 2;
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const LIGHT_A = -TAU * 0.31;
      // The game's module-level mutables the lifted regions read. They are LET,
      // not arguments, because the game's own code reads them as free variables —
      // the lab hands them in through set() rather than rewriting the regions.
      let ctx = null, time = 0, CAMP = { id: ${JSON.stringify(CAMPS[0].id)} }, levelIdx = 0, LV = null;
      ${src.rng}
      ${src.data}
      ${src.pick}
      ${src.kind}
      ${src.sprite}
      ${src.wake}
      ${src.life}
      // the built stations: the renderer and the five builds, plus the mapping
      // from a campaign to the place its contract ends at
      const lerp = (a, b, t) => a + (b - a) * t;
      let lowFX = false;
      // the real ids and the real lengths — s3FinalFor asks "is this the LAST
      // relay", so a guessed length puts a contract's endpoint on the wrong one
      const CAMPAIGNS = ${JSON.stringify(CAMPS.map(c => ({ id: c.id, levels: c.levels.map(() => 0) })))};
      ${src.s3d}
      ${src.s3dpick}
      // s3draw ITSELF is not in a lifted region — in the game it is backed by the
      // menu bake, a frame budget and a mip chain, none of which exist here. But
      // the lifted DEST-LIFE region calls it to put stations in orbit around a
      // world, so the scope has to answer. This is the lab's answer: build the
      // thing on demand, cache it, draw it. Same geometry, same shader, same
      // lamps — only the scheduling differs, and the lab has no schedule.
      const _s3lab = {};
      function s3draw(x, y, R, id, alpha, noLamps) {
        let sp = _s3lab[id];
        if (sp === undefined) {
          try {
            const b = s3build(id), M = new S3Mesh();
            b.fn(M, 4801 + id.charCodeAt(0) * 131);
            sp = s3render(M, { w: 300, h: 300, ss: 1, scale: 300 * b.cam });
          } catch (e) { sp = null; }
          _s3lab[id] = sp;
        }
        if (!sp) return false;
        const w = sp.S * (R / sp.R), k = w / sp.S, H = S3D_LIGHT;
        ctx.save();
        if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
        ctx.drawImage(sp.cv, x - w / 2, y - w / 2, w, w);
        ctx.restore();
        if (!noLamps) s3warp(ctx, sp, x, y, w, alpha === undefined ? 1 : alpha, time);
        if (!noLamps) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (const L of sp.lamps) {
            const b2 = s3lamp(L.k, time, L.ph) * (alpha === undefined ? 1 : alpha);
            if (b2 < 0.03) continue;
            const px = x + (L.x - sp.S * 0.5) * k, py = y + (L.y - sp.S * 0.5) * k;
            const r = Math.max(0.35, L.r * k), RR = r * H.haloR;
            const g = ctx.createRadialGradient(px, py, 0, px, py, RR);
            g.addColorStop(0, 'rgba(' + L.c + ',' + (H.haloA * b2).toFixed(3) + ')');
            g.addColorStop(0.16, 'rgba(' + L.c + ',' + (H.haloA * b2 * 0.26).toFixed(3) + ')');
            g.addColorStop(0.48, 'rgba(' + L.c + ',' + (H.haloA * b2 * 0.055).toFixed(3) + ')');
            g.addColorStop(1, 'rgba(' + L.c + ',0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(px, py, RR, 0, TAU); ctx.fill();
            ctx.fillStyle = 'rgba(' + L.c + ',' + (H.coreA * b2).toFixed(3) + ')';
            ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); ctx.fill();
          }
          ctx.restore();
        }
        return true;
      }
      return {
        PLANET_REF_R, PLANET_TYPES, PLANET_STAR, PLANET_SHADE,
        DEST_MIX, DEST_LIFE,
        S3D_LIGHT, S3D_LAMPS, S3D_WARP, S3D_BUILDS, S3D_FINAL,
        S3Mesh, s3render, s3lamp, s3build, s3FinalFor, s3BuildFor, s3warp,
        planetVariantFor, buildPlanetSprite, destKindFor,
        drawDestLife, drawTerminatorCreep, destinationLife, destLightA, orbitAt,
        set(o) {
          if (o.ctx !== undefined) ctx = o.ctx;
          if (o.time !== undefined) time = o.time;
          if (o.CAMP !== undefined) CAMP = o.CAMP;
          if (o.levelIdx !== undefined) levelIdx = o.levelIdx;
          if (o.LV !== undefined) LV = o.LV;
        },
        // the dealt hand is memoised inside the region; this is the only handle
        // on that cache, and the lab must drop it whenever a dial or relay moves
        resetLife() { destLifeKey = ''; destLifeVal = null; },
        // same for the sprites this scope bakes for stations in orbit
        resetS3() { for (const k of Object.keys(_s3lab)) delete _s3lab[k]; }
      };
    `)();
  } catch (e) {
    return fail('The marked regions in src/game/ did not evaluate:\n\n' + (e.message || e));
  }

  DEFAULTS = clone(payload());
  let staleWork = null;

  // a working copy from a previous session, if the tab was closed mid-tune
  try {
    const res = await (await fetch('/api/work')).json();
    // A working copy saved against an OLDER game file is not restored — it is
    // set aside. Replaying it silently is what makes a session's worth of work
    // look like it never happened: the lab shows the restored old values and
    // every later edit to the game file appears to have done nothing.
    if (res && res.stale && res.data) {
      staleWork = res.data;
    }
    const w = res && !res.stale ? res.data : null;
    if (w) for (const k of Object.keys(w)) {
      if (Array.isArray(w[k])) {
        // BY ID, never by index — the same rule the writer already follows.
        // The world table grows and reorders; a working copy saved before it did
        // would otherwise pour one world's dials into whatever now sits at that
        // slot, and because `id` and `n` came along for the ride the victim was
        // RENAMED into a copy of the donor. Two identical 'ICE' rows in the rail
        // was that, exactly: a nine-entry copy replayed onto an eighteen-entry
        // table put the old ICE at index 7, on top of verdant.
        for (const v of w[k]) {
          if (!v || v.id == null) continue;
          const t = G[k].find(o => o.id === v.id);
          if (!t) continue;                       // a world that no longer exists
          for (const kk of Object.keys(v)) if (kk !== 'id' && kk !== 'n') t[kk] = v[kk];
        }
      } else Object.assign(G[k], w[k]);
    }
  } catch (e) {}

  buildRail();
  select('ALL');
  dirty = allChanges().length > 0;
  setState(dirty ? 'dirty' : 'ok', dirty ? 'restored an unsaved session' : 'in sync with the game');
  markRail();
  loop();
})();
</script>
</body>
</html>

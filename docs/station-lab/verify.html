<!doctype html>
<meta charset="utf-8">
<title>verify — the game's own file</title>
<style>html,body{margin:0;background:#04060c}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// the globals 81-station3d.js expects from the rest of the game
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let lowFX = false, time = 0, ctx = null;
const CAMPAIGNS = [
  { id: 'investigation', levels: new Array(8) }, { id: 'going-deeper', levels: new Array(8) },
  { id: 'signal-lost', levels: new Array(8) }, { id: 'the-bait', levels: new Array(8) },
  { id: 'shutdown', levels: new Array(8) }
];
</script>
<script src="file:///Users/gilbeja/vsCode/warp-vanguard/src/game/81-station3d.js"></script>
<script>
const CELL = 500, COLS = 3;
const ORDER = ['investigation', 'going-deeper', 'signal-lost', 'the-bait', 'shutdown'];
const ROWS = Math.ceil(ORDER.length / COLS);
const cv = document.getElementById('c');
cv.width = CELL * COLS; cv.height = CELL * ROWS;
ctx = cv.getContext('2d');
ctx.fillStyle = '#04060c'; ctx.fillRect(0, 0, cv.width, cv.height);
(function () { let s = 991; const r = () => ((s = Math.imul(s ^ s >>> 15, 2246822507)) >>> 0) / 4294967296;
  for (let i = 0; i < 1600; i++) { const x = r() * cv.width, y = r() * cv.height, a = Math.pow(r(), 2.3) * 0.7 + 0.04;
    ctx.fillStyle = 'rgba(210,225,255,' + a.toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x, y, r() * 0.85 + 0.25, 0, TAU); ctx.fill(); } })();

const log = [];
// drive the real chunked pump exactly as the frame loop does
let guard = 0;
while (s3Pump(1000) && guard++ < 4000) {}
log.push('pumped, guard=' + guard + ' blocked=' + s3Blocked);

time = parseFloat(new URLSearchParams(location.search).get('t') || '0.7');
ORDER.forEach((camp, i) => {
  const bid = s3FinalFor(camp, 7);
  const cx = (i % COLS) * CELL + CELL / 2, cy = ((i / COLS) | 0) * CELL + CELL / 2;
  const ok = s3draw(cx, cy, 178, bid, 1);
  log.push(camp + ' -> ' + bid + (ok ? '' : ' DRAW FAILED'));
  ctx.font = '600 13px ui-monospace,Menlo,monospace';
  ctx.fillStyle = 'rgba(175,196,228,0.8)';
  ctx.fillText('C' + (i + 1) + '  ' + camp + '  ->  ' + bid, (i % COLS) * CELL + 16, ((i / COLS) | 0) * CELL + CELL - 16);
});
// the kind override must agree
log.push('kinds: ' + ORDER.map(c => c + '=' + s3build(s3FinalFor(c, 7)).kind).join(' '));
log.push('non-final deal: ' + [0,1,2,3,4,5,6].map(l => s3BuildFor('investigation', l, 'station')).join(','));
window.__log = log.join(' | ');
window.__done = true;
</script>

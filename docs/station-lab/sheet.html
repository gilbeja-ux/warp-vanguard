<!doctype html>
<meta charset="utf-8">
<title>station sheet</title>
<style>html,body{margin:0;background:#04060c}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="r3d.js"></script>
<script src="models.js"></script>
<script>
const TAU = Math.PI * 2;
const NAMES = Object.keys(ARCHETYPES);
const CELL = 500, COLS = 3, ROWS = Math.ceil(NAMES.length / COLS);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = CELL * COLS; cv.height = CELL * ROWS;

// background: the game's void plus a few stars, so nothing is judged on white
ctx.fillStyle = '#04060c'; ctx.fillRect(0, 0, cv.width, cv.height);
(function () {
  let s = 991;
  const r = () => ((s = Math.imul(s ^ s >>> 15, 2246822507)) >>> 0) / 4294967296;
  for (let i = 0; i < 1400; i++) {
    const x = r() * cv.width, y = r() * cv.height, a = Math.pow(r(), 2.2) * 0.75 + 0.04;
    ctx.fillStyle = 'rgba(210,225,255,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, r() * 0.85 + 0.25, 0, TAU); ctx.fill();
  }
})();

const CFG = {
  'truss disc':    { scale: 190, el: 0.56 },
  'fortress ring': { scale: 190, el: 0.56 },
  'spine & torus': { scale: 120, el: 0.56 },
  'port & piers':  { scale: 145, el: 0.56 },
  'gate':          { scale: 195, el: 0.56 }
};
const out = [];
NAMES.forEach((name, i) => {
  const M = new Mesh();
  ARCHETYPES[name](M, 1000 + i * 977);
  const cfg = CFG[name] || {};
  const t0 = performance.now();
  const res = render(M, { w: CELL, h: CELL, ss: 2, scale: cfg.scale || 180, el: cfg.el, dist: 9 });
  const ms = Math.round(performance.now() - t0);
  const cx = (i % COLS) * CELL, cy = ((i / COLS) | 0) * CELL;
  ctx.drawImage(res.cv, cx, cy);
  // the lamps, drawn live over the bake — this is the blinking pass
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const L of res.lamps) {
    const k = 0.55 + 0.45 * Math.sin(L.ph * 2.1);
    const a = 0.85 * k;
    const g = ctx.createRadialGradient(cx + L.x, cy + L.y, 0, cx + L.x, cy + L.y, L.r * 5);
    g.addColorStop(0, 'rgba(' + L.c + ',' + (a * 0.6).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(' + L.c + ',' + (a * 0.14).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + L.c + ',0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx + L.x, cy + L.y, L.r * 5, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(' + L.c + ',' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(cx + L.x, cy + L.y, L.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.font = '600 14px ui-monospace,Menlo,monospace';
  ctx.fillStyle = 'rgba(180,200,230,0.75)';
  ctx.fillText((i + 1) + '. ' + name.toUpperCase() + '   ' + M.T.length / 5 + ' tris  ' + ms + 'ms', cx + 16, cy + CELL - 16);
  out.push(name + ' ' + M.T.length / 5 + ' tris ' + ms + 'ms');
});
window.__log = out.join(' | ');
window.__done = true;
</script>

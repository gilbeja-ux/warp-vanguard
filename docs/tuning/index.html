<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuning Board — Warp Vanguard</title>
<style>
  @font-face {
    font-family: 'Audiowide';
    src: url('/fonts/audiowide.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  /* Every tone here is a DESIGN.md colour or that colour at an alpha. The game
     builds its own chrome the same way — Panel Glass at 92%, Body Ice at 88% —
     so the board reads as the same machine rather than a tool bolted to it. */
  :root {
    --hull:#03060e;        /* Hull Black   — shell */
    --bore:#020510;        /* Bore Void    — the preview stage, as in-game */
    --glass:#040e1e;       /* Panel Glass  */
    --cyan:#6fe3ff;        /* Chrome Cyan  — the console talking to you */
    --ice:#cfeeff;         /* Readout Ice  */
    --body:#bee1ff;        /* Body Ice     */
    --amber:#ff9a3c;       /* Ember Amber  — broken and coming back */
    --red:#ff3c5a;         /* Breach Red   */
    --gold:#ffd24a;        /* Payload Gold — gain only */
    --key:#142c48;         /* button-key           (DESIGN.md component) */
    --key-hi:#1d3d61;      /* button-key-pressed   (DESIGN.md component) */
    --key-ink:#dff2ff;

    --edge:rgba(111,227,255,.10);      /* value break, never a coloured outline */
    --edge-lit:rgba(111,227,255,.26);
    --wash:rgba(111,227,255,.05);      /* hover lift */
    --dim:rgba(190,225,255,.52);
    --dimmer:rgba(190,225,255,.30);
    --shade:rgba(2,5,16,.55);

    --ui:'Audiowide','Segoe UI',system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:var(--hull); color:var(--body); font-family:var(--ui);
    display:grid; grid-template-rows:auto 1fr; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- header: identity, state, and the one action that writes ---------- */
  header {
    display:flex; align-items:center; gap:20px; padding:0 20px; height:56px;
    background:var(--glass);
    box-shadow:0 1px 0 var(--edge), 0 6px 18px -8px var(--shade);
  }
  .mark { font-size:13px; letter-spacing:3px; color:var(--ice); text-transform:uppercase; }
  .mark b { color:var(--cyan); font-weight:400; }
  .simid { font-family:var(--mono); font-size:10px; letter-spacing:.5px; color:var(--dimmer); }
  .simid u { color:var(--dim); text-decoration:none; }
  .spacer { flex:1; }
  .dirty { font-family:var(--mono); font-size:10px; letter-spacing:.5px; color:var(--dimmer); transition:color .18s var(--ease); }
  .dirty.on { color:var(--gold); }

  button {
    font-family:var(--ui); font-size:12px; letter-spacing:3px; text-transform:uppercase;
    height:38px; padding:0 18px; border:0; border-radius:8px;
    background:var(--key); color:var(--key-ink); cursor:pointer;
    transition:background .16s var(--ease), transform .16s var(--ease);
  }
  button:hover:not(:disabled) { background:var(--key-hi); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled { background:var(--wash); color:var(--dimmer); cursor:not-allowed; }
  button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  /* Commit is cyan — the console acting. It turns amber only when the values in
     flight change what a SCORE IS, because that write also invalidates the
     deployed verifier and the next real run would be rejected. */
  .commit:not(:disabled) { background:rgba(111,227,255,.14); color:var(--cyan); box-shadow:inset 0 0 0 1px var(--edge-lit); }
  .commit:not(:disabled):hover { background:rgba(111,227,255,.22); }
  .commit.sim:not(:disabled) { background:rgba(255,154,60,.16); color:var(--amber); box-shadow:inset 0 0 0 1px rgba(255,154,60,.42); }
  .commit.sim:not(:disabled):hover { background:rgba(255,154,60,.26); }

  /* ---------- three columns: pick, dial, see ---------- */
  main { display:grid; grid-template-columns:236px minmax(320px,1fr) minmax(360px,1.1fr); min-height:0; }
  main > * { min-height:0; overflow-y:auto; }

  nav { background:var(--bore); box-shadow:inset -1px 0 0 var(--edge); padding:12px 0 40px; }
  .navhead { font-size:9px; letter-spacing:2px; color:var(--dimmer); padding:12px 20px 8px; text-transform:uppercase; }
  .grp {
    display:flex; align-items:baseline; gap:8px; width:100%; padding:10px 20px;
    background:none; border-radius:0; height:auto; cursor:pointer;
    font-size:12px; letter-spacing:1.4px; color:var(--dim); text-align:left; text-transform:none;
    box-shadow:inset 2px 0 0 transparent;
    transition:color .14s ease-out, background .14s ease-out, box-shadow .14s ease-out;
  }
  .grp:hover { background:var(--wash); color:var(--body); }
  .grp[aria-current="true"] { background:var(--wash); color:var(--ice); box-shadow:inset 2px 0 0 var(--cyan); }
  .grp .n { font-family:var(--mono); font-size:9px; color:var(--dimmer); margin-left:auto; }
  .grp .n.on { color:var(--gold); }
  .grp .sim { font-family:var(--mono); font-size:9px; color:var(--amber); }

  section.dials { padding:26px 28px 60px; }
  .title { font-size:22px; letter-spacing:2px; color:var(--ice); }
  .blurb { font-size:12px; line-height:1.5; color:var(--dim); margin-top:8px; max-width:62ch; }
  .warn {
    margin-top:16px; padding:12px 14px; border-radius:8px;
    background:rgba(255,154,60,.07); box-shadow:inset 0 0 0 1px rgba(255,154,60,.3);
    font-size:12px; line-height:1.55; color:var(--amber);
  }
  .warn b { color:var(--ice); font-weight:400; }

  .const { margin-top:30px; }
  .constname {
    font-family:var(--mono); font-size:10px; letter-spacing:1px; color:var(--dim);
    padding-bottom:8px; box-shadow:inset 0 -1px 0 var(--edge); display:flex; gap:8px; align-items:center;
  }
  .constname em { font-style:normal; color:var(--amber); font-size:9px; }
  .constfile { margin-left:auto; color:var(--dimmer); font-size:9px; }

  .dial { display:grid; grid-template-columns:1fr auto 74px; gap:2px 14px; align-items:center; padding:11px 0; box-shadow:inset 0 -1px 0 var(--edge); }
  .dial:last-child { box-shadow:none; }
  .dial label { font-size:12px; letter-spacing:.6px; color:var(--body); }
  .dial .val { font-family:var(--mono); font-size:10px; color:var(--ice); text-align:right; }
  .dial.changed .val { color:var(--gold); }
  .simtag { font-family:var(--mono); font-size:9px; color:var(--amber); letter-spacing:.5px; }
  .dial.simdirty { box-shadow:inset 0 -1px 0 rgba(255,154,60,.45); }
  .dial.simdirty .val { color:var(--amber); }
  .dial .row { grid-column:1 / -1; display:flex; align-items:center; gap:12px; margin-top:2px; }
  input[type=range] { flex:1; height:22px; background:none; -webkit-appearance:none; appearance:none; cursor:ew-resize; }
  input[type=range]::-webkit-slider-runnable-track { height:2px; background:var(--edge-lit); border-radius:8px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:12px; height:12px; margin-top:-5px; border-radius:50%;
    background:var(--cyan); box-shadow:0 1px 4px var(--shade);
  }
  input[type=range]:focus-visible { outline:2px solid var(--cyan); outline-offset:4px; }
  input[type=color] { width:34px; height:24px; padding:0; border:0; background:none; cursor:pointer; }
  input[type=text] {
    width:100%; background:var(--bore); border:0; box-shadow:inset 0 0 0 1px var(--edge);
    color:var(--ice); font-family:var(--mono); font-size:10px; padding:7px 9px; border-radius:8px;
  }
  input[type=text]:focus-visible { outline:2px solid var(--cyan); outline-offset:1px; }
  .reset { font-family:var(--mono); font-size:9px; color:var(--dimmer); background:none; height:auto; padding:2px 4px; letter-spacing:0; text-transform:none; }
  .reset:hover:not(:disabled) { color:var(--gold); background:none; }

  aside { background:var(--bore); box-shadow:inset 1px 0 0 var(--edge); padding:26px 28px 60px; }
  .pvhead { font-size:9px; letter-spacing:2px; color:var(--dimmer); text-transform:uppercase; margin-bottom:12px; }
  .stage { width:100%; aspect-ratio:16/10; background:var(--bore); border-radius:12px; overflow:hidden; box-shadow:0 8px 28px -14px var(--shade), inset 0 0 0 1px var(--edge); }
  .stage canvas { width:100%; height:100%; display:block; }
  .pvnote { font-family:var(--mono); font-size:10px; line-height:1.6; color:var(--dimmer); margin-top:14px; }
  /* Preview controls drive the SUBJECT, never the game — kept visually apart
     from the dials on the left so there is no doubt which ones Commit writes. */
  .pvctl { margin-top:22px; padding-top:6px; box-shadow:inset 0 1px 0 var(--edge); }
  .pvctl .pvhead { margin:14px 0 6px; }
  .ctl { display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center; padding:8px 0; }
  .ctl label { font-size:12px; letter-spacing:.6px; color:var(--dim); }
  .ctl .val { font-family:var(--mono); font-size:10px; color:var(--body); text-align:right; }
  .ctl .row { grid-column:1 / -1; display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:2px; }
  .pill {
    font-family:var(--mono); font-size:10px; letter-spacing:.5px; text-transform:none;
    height:24px; padding:0 10px; border-radius:8px;
    background:var(--wash); color:var(--dim); box-shadow:inset 0 0 0 1px var(--edge);
  }
  .pill:hover:not(:disabled) { background:rgba(111,227,255,.12); color:var(--body); }
  .pill.on { background:rgba(111,227,255,.16); color:var(--cyan); box-shadow:inset 0 0 0 1px var(--edge-lit); }
  .pvnote.err { color:var(--red); }
  .empty { font-size:12px; line-height:1.6; color:var(--dim); }

  .toast {
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px);
    background:var(--glass); color:var(--ice);
    box-shadow:0 10px 30px -10px var(--shade), inset 0 0 0 1px var(--edge-lit);
    padding:12px 18px; border-radius:8px; font-size:12px; letter-spacing:1px;
    opacity:0; pointer-events:none; transition:opacity .2s ease-out, transform .2s var(--ease);
  }
  .toast.on { opacity:1; transform:translate(-50%,0); }
  .toast.bad { box-shadow:0 10px 30px -10px var(--shade), inset 0 0 0 1px rgba(255,60,90,.45); color:#ffd9d9; }
</style>
</head>
<body>

<header>
  <div class="mark">Tuning <b>Board</b></div>
  <div class="simid">sim <u id="simid">loading</u></div>
  <div class="spacer"></div>
  <div class="dirty" id="dirty">no changes</div>
  <button id="revert" disabled>Revert</button>
  <button class="commit" id="commit" disabled>Commit</button>
</header>

<main>
  <nav id="nav"><div class="navhead">Subsystems</div></nav>
  <section class="dials" id="dials"><p class="empty">Loading the game…</p></section>
  <aside id="preview"></aside>
</main>

<div class="toast" id="toast"></div>

<!-- The canvas src/game/00-core.js binds to. Previews borrow the real painters
     by repointing `ctx` at their own surface — the same trick the game uses to
     bake sprites — so there is never a second copy of a painter to drift. -->
<canvas id="game" width="16" height="16" style="position:fixed;left:-9999px;top:0"></canvas>

<script src="/campaigns.js"></script>
<script src="board.js"></script>
</body>
</html>
